<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>機器學習筆記選擇題測驗（200題題庫 / 每次隨機20題）</title>
<style>
  :root {
    --primary: #4472C4;
    --primary-dark: #2f5597;
    --green: #2e7d32;
    --red: #c62828;
    --bg: #f4f6fb;
    --card: #ffffff;
    --border: #e0e4ee;
    --text: #26314d;
    --muted: #6b7590;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  header.top {
    text-align: center;
    margin-bottom: 24px;
  }
  header.top h1 {
    font-size: 22px;
    margin: 0 0 6px;
    color: var(--primary-dark);
  }
  header.top p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 2px 10px rgba(40,60,120,0.06);
    margin-bottom: 20px;
  }
  .stats-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .stat-box {
    flex: 1;
    min-width: 100px;
    background: #eef2fb;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }
  .stat-box .num { font-size: 22px; font-weight: 700; color: var(--primary-dark); }
  .stat-box .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  button {
    font-family: inherit;
    cursor: pointer;
  }
  .btn-primary {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 14px 28px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    width: 100%;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary {
    display: inline-block;
    background: #fff;
    color: var(--primary-dark);
    border: 1px solid var(--primary);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-secondary:hover { background: #eef2fb; }
  .row-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  .row-buttons > * { flex: 1; }

  .progress-wrap {
    background: #e6e9f4;
    border-radius: 8px;
    height: 10px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .progress-bar {
    background: var(--primary);
    height: 100%;
    width: 0%;
    transition: width .25s ease;
  }
  .q-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .q-tag {
    display: inline-block;
    background: #eef2fb;
    color: var(--primary-dark);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .q-text {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.6;
    margin: 6px 0 18px;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    text-align: left;
    background: #fafbfe;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    transition: all .15s ease;
  }
  .option:hover:not(.locked) { border-color: var(--primary); background: #f2f5fc; }
  .option .letter {
    flex-shrink: 0;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .option.correct { border-color: var(--green); background: #eaf5ea; }
  .option.correct .letter { background: var(--green); }
  .option.wrong { border-color: var(--red); background: #fbeaea; }
  .option.wrong .letter { background: var(--red); }
  .option.locked { cursor: default; }

  .explanation {
    margin-top: 16px;
    background: #f6f8fd;
    border-left: 4px solid var(--primary);
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 14px;
    color: var(--text);
    display: none;
  }
  .explanation.show { display: block; }
  .explanation b { color: var(--primary-dark); }

  .nav-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 20px;
  }

  .result-score {
    text-align: center;
    padding: 10px 0 6px;
  }
  .result-score .big {
    font-size: 46px;
    font-weight: 800;
    color: var(--primary-dark);
  }
  .result-score .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }

  table.history {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.history th, table.history td {
    border-bottom: 1px solid var(--border);
    padding: 8px 6px;
    text-align: left;
  }
  table.history th { color: var(--muted); font-weight: 600; }
  .empty-hint { color: var(--muted); font-size: 13px; text-align: center; padding: 10px 0; }

  .review-item {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 14px;
  }
  .review-item.ok { border-left: 4px solid var(--green); }
  .review-item.bad { border-left: 4px solid var(--red); }
  .review-item .q { font-weight: 700; margin-bottom: 6px; }
  .review-item .ans-line { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .review-item .exp { color: var(--text); font-size: 13px; margin-top: 6px; }
  .hidden { display: none !important; }
  .cat-breakdown { font-size: 13px; margin-top: 10px; }
  .cat-breakdown div { display:flex; justify-content:space-between; padding: 4px 0; border-bottom: 1px dashed var(--border); }
  footer.foot { text-align:center; color: var(--muted); font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
  <header class="top">
    <h1>機器學習筆記選擇題測驗</h1>
    <p>題庫共 200 題（概念題 150 題 ／ 情境範例題 50 題）・每次隨機抽 20 題作答並自動記錄成績</p>
  </header>

  <!-- ============ START SCREEN ============ -->
  <div id="screen-start" class="card">
    <div class="stats-row">
      <div class="stat-box"><div class="num" id="stat-total">200</div><div class="label">題庫總題數</div></div>
      <div class="stat-box"><div class="num" id="stat-attempts">0</div><div class="label">歷史測驗次數</div></div>
      <div class="stat-box"><div class="num" id="stat-best">--</div><div class="label">最佳成績</div></div>
    </div>
    <button class="btn-primary" id="btn-start">開始隨機測驗（20題）</button>
    <p style="text-align:center;color:var(--muted);font-size:12px;margin-top:10px;">每次作答會從 200 題題庫中隨機抽出 20 題，答對率與成績會自動儲存在本機瀏覽器中。</p>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">歷史成績紀錄</h3>
    <div id="history-empty" class="empty-hint">尚無測驗紀錄，開始第一次測驗吧！</div>
    <table class="history hidden" id="history-table">
      <thead><tr><th>時間</th><th>成績</th><th>正確率</th></tr></thead>
      <tbody id="history-body"></tbody>
    </table>
    <div class="row-buttons" style="margin-top:12px;">
      <button class="btn-secondary" id="btn-clear-history">清除歷史紀錄</button>
    </div>
  </div>

  <!-- ============ QUIZ SCREEN ============ -->
  <div id="screen-quiz" class="card hidden">
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="q-meta">
      <span id="q-index">第 1 / 20 題</span>
      <span class="q-tag" id="q-category">分類</span>
    </div>
    <div class="q-text" id="q-text">題目文字</div>
    <div class="options" id="q-options"></div>
    <div class="explanation" id="q-explanation"></div>
    <div class="nav-row">
      <button class="btn-primary" id="btn-next" style="width:auto;" disabled>下一題</button>
    </div>
  </div>

  <!-- ============ RESULT SCREEN ============ -->
  <div id="screen-result" class="card hidden">
    <div class="result-score">
      <div class="big" id="result-score-text">0 / 20</div>
      <div class="sub" id="result-percent">正確率 0%</div>
    </div>
    <div class="cat-breakdown" id="cat-breakdown"></div>
    <div class="row-buttons" style="margin-top:18px;">
      <button class="btn-primary" id="btn-retry">再測一次（新的隨機20題）</button>
      <button class="btn-secondary" id="btn-back-home">回首頁</button>
    </div>
  </div>

  <div id="screen-review" class="card hidden">
    <h3 style="margin-top:0;">本次作答詳解</h3>
    <div id="review-list"></div>
    <div class="row-buttons">
      <button class="btn-secondary" id="btn-review-close">收合詳解</button>
    </div>
  </div>

  <div class="card hidden" id="screen-review-toggle-wrap">
    <button class="btn-secondary" id="btn-show-review" style="width:100%;">查看本次作答詳解</button>
  </div>

  <footer class="foot">機器學習筆記選擇題題庫 &middot; 共 200 題 &middot; 本機儲存成績紀錄</footer>
</div>

<script>
const QUESTIONS = [{"category": "基礎概念", "type": "概念", "question": "鑑別式AI（Discriminative AI, DAI）主要負責的任務是？", "A": "模擬人類情感反應", "B": "判斷與分類，例如判斷圖片是狗還是貓", "C": "執行硬體控制指令", "D": "創造全新的資料，例如生成一張全新的貓的圖片", "answer": "B", "explanation": "鑑別式AI負責判斷/分類，生成式AI才是負責創造資料。"}, {"category": "基礎概念", "type": "概念", "question": "下列何者「不屬於」鑑別式AI(DAI)常見模型？", "A": "GAN（生成對抗網路）", "B": "決策樹（Decision Tree）", "C": "Logistic Regression（邏輯迴歸）", "D": "SVM（支援向量機）", "answer": "A", "explanation": "GAN是生成式AI模型，負責生成資料而非分類判斷。"}, {"category": "基礎概念", "type": "概念", "question": "生成式AI（Generative AI, GAI）的核心任務為何？", "A": "創造全新的資料", "B": "只用於資料清理", "C": "只能處理文字資料", "D": "判斷資料屬於哪個類別", "answer": "A", "explanation": "生成式AI的核心是「創造資料」，例如生成一張貓的圖片。"}, {"category": "基礎概念", "type": "概念", "question": "「成本效益分析（Cost-Benefit Analysis）」的核心作法是？", "A": "只計算模型的準確率", "B": "只評估程式碼的執行速度", "C": "將所有預期效益與成本「貨幣化」並量化比較", "D": "忽略長期效益，只看短期成本", "answer": "C", "explanation": "成本效益分析是將預期正向效益與負向成本全部換算成金額，進行量化比較。"}, {"category": "基礎概念", "type": "概念", "question": "通用人工智慧（Artificial General Intelligence, AGI）目前的發展狀態為何？", "A": "尚未出現", "B": "僅存在於20年前", "C": "已經超越人類所有智力任務", "D": "已經廣泛商用", "answer": "A", "explanation": "筆記中標註AGI「★尚未出現」，屬於尚待實現的概念。"}, {"category": "基礎概念", "type": "概念", "question": "AGI 與目前常見的AI系統（如影像分類模型）最大差異為何？", "A": "AGI具備與人類同等或超越人類的智慧，能適應任何智力任務；目前AI多半是針對特定任務設計的窄AI", "B": "兩者沒有差異", "C": "AGI只存在理論上，完全沒有研究方向", "D": "AGI只能做單一任務，目前AI能做所有任務", "answer": "A", "explanation": "AGI強調能在「任何智力任務」中表現出色，目前AI系統多半僅擅長特定任務。"}, {"category": "基礎概念", "type": "情境範例", "question": "某公司想導入一套系統來自動判斷客戶上傳的商品照片是否為「瑕疵品」，這屬於下列哪一種AI應用？", "A": "通用人工智慧(AGI)", "B": "鑑別式AI(DAI)", "C": "生成式AI(GAI)", "D": "以上皆非", "answer": "B", "explanation": "判斷瑕疵與否屬於分類任務，為鑑別式AI(DAI)的應用。"}, {"category": "基礎概念", "type": "情境範例", "question": "企業在導入AI客服系統前，先評估此系統每年可節省的人力成本，以及開發與維運所需的費用，並將兩者換算成金額比較，這個過程稱為？", "A": "成本效益分析", "B": "特徵交叉", "C": "貝氏最佳化", "D": "梯度下降", "answer": "A", "explanation": "將效益與成本貨幣化並量化比較，即為成本效益分析。"}, {"category": "監督式學習", "type": "概念", "question": "線性迴歸（Linear Regression）主要用來解決什麼問題？", "A": "分類離散類別", "B": "分群不具標籤的資料", "C": "預測連續型數值", "D": "降維", "answer": "C", "explanation": "線性迴歸是用來預測「連續型數值」的工具。"}, {"category": "監督式學習", "type": "概念", "question": "線性迴歸的優點為何？", "A": "完全不會受到極端值影響", "B": "不需要任何假設", "C": "能處理所有非線性關係", "D": "計算速度快、模型簡單、可清楚看出特徵與結果的因果關係", "answer": "D", "explanation": "線性迴歸計算快、模型簡單，可清楚看出特徵與結果的因果關係。"}, {"category": "監督式學習", "type": "概念", "question": "線性迴歸的主要缺點為何？", "A": "無法輸出數值", "B": "世界關係複雜，許多關係並非直線，模型表達能力有限", "C": "只能用於分類問題", "D": "計算速度太慢", "answer": "B", "explanation": "線性迴歸的缺點是許多真實世界的關係並非直線。"}, {"category": "監督式學習", "type": "概念", "question": "決策樹（Decision Tree）中，負責「輸出最終判斷結果」的節點稱為？", "A": "邊界節點", "B": "葉節點（Leaf Node）", "C": "內部節點（Internal Node）", "D": "根節點（Root Node）", "answer": "B", "explanation": "葉節點是決策樹最終輸出判斷結果的節點。"}, {"category": "監督式學習", "type": "概念", "question": "決策樹訓練時追求「讓每次切分後資料變得越純」，這裡的「純」指的是？", "A": "節點內特徵數越多越好", "B": "該節點內樣本類別越單一、混雜程度越低", "C": "該節點內樣本準確率為100%", "D": "節點內樣本數量越多越好", "answer": "B", "explanation": "純度指的是節點內樣本類別的單一程度，混雜程度越低越純。"}, {"category": "監督式學習", "type": "概念", "question": "決策樹容易出現的問題與對應解法為何？", "A": "梯度消失；使用ReLU", "B": "模式崩潰；資料增強", "C": "過擬合（Overfitting）；剪枝（Pruning）", "D": "欠擬合；增加特徵", "answer": "C", "explanation": "決策樹容易過擬合，常見解法是剪枝。"}, {"category": "監督式學習", "type": "概念", "question": "KNN（K-Nearest Neighbors）進行預測時的核心方式為何？", "A": "計算所有資料點與目標的距離，用最近的K個鄰居決定答案", "B": "建立一棵決策樹", "C": "使用兩個網路互相對抗", "D": "使用梯度下降更新權重", "answer": "A", "explanation": "KNN用距離找出最接近的K個鄰居，用這些鄰居決定答案。"}, {"category": "監督式學習", "type": "概念", "question": "邏輯迴歸（Logistic Regression）的核心運作方式為？", "A": "用K個鄰居的距離做分類", "B": "直接輸出連續數值，不做任何轉換", "C": "建立多棵決策樹並投票", "D": "用數學公式算出「某件事發生的機率」，再用該機率做分類", "answer": "D", "explanation": "邏輯迴歸用數學公式算出機率，再用機率做分類。"}, {"category": "監督式學習", "type": "概念", "question": "邏輯迴歸的優點不包含下列何者？", "A": "計算快", "B": "輸出機率", "C": "能學習高度複雜的非線性關係", "D": "可解釋性高（每個特徵都有權重）", "answer": "C", "explanation": "邏輯迴歸只能學線性關係，遇到複雜問題效果有限，這正是它的缺點。"}, {"category": "監督式學習", "type": "概念", "question": "「線性加權 → Sigmoid → 機率 → 分類」描述的是下列哪個模型的運作流程？", "A": "Logistic Regression", "B": "SVM", "C": "Naive Bayes", "D": "Random Forest", "answer": "A", "explanation": "邏輯迴歸的流程正是：線性加權 → Sigmoid → 機率 → 分類。"}, {"category": "監督式學習", "type": "概念", "question": "支援向量機（SVM）的核心目標為何？", "A": "用機率公式做分類", "B": "用投票方式集合多個決策樹", "C": "找到資料的主成分", "D": "找到一個能把不同類別完美分開、且離兩邊最近資料點最遠的邊界（超平面）", "answer": "D", "explanation": "SVM的核心目標是找到最大邊界的超平面，把不同類別完美分開。"}, {"category": "監督式學習", "type": "概念", "question": "SVM中，「最靠近邊界的那幾顆資料點」稱為？", "A": "根節點", "B": "支援向量（Support Vectors）", "C": "主成分", "D": "隱藏層", "answer": "B", "explanation": "最靠近邊界的資料點稱為支援向量，也是SVM名稱由來。"}, {"category": "監督式學習", "type": "概念", "question": "SVM能處理非線性可分的資料，主要依靠下列哪項核心技術？", "A": "核函數（Kernel Trick）", "B": "梯度剪裁", "C": "Dropout", "D": "批次正規化", "answer": "A", "explanation": "SVM透過核函數（Kernel Trick）處理非線性可分的資料。"}, {"category": "監督式學習", "type": "概念", "question": "SVM的主要缺點為何？", "A": "計算速度過快導致不準確", "B": "一定要大量標籤資料才能訓練", "C": "無法用於分類問題", "D": "屬於「黑盒子」模型，對雜訊和極端值較敏感", "answer": "D", "explanation": "SVM屬於黑盒子模型，且對雜訊與極端值比較敏感。"}, {"category": "監督式學習", "type": "概念", "question": "隨機森林（Random Forest）的基本概念為？", "A": "只使用單一決策樹", "B": "用機率分布生成新樹", "C": "用梯度下降訓練線性模型", "D": "集結眾多決策樹，並透過投票做出最終決策", "answer": "D", "explanation": "隨機森林集結眾多決策樹的智慧，透過投票做出最終決策。"}, {"category": "監督式學習", "type": "概念", "question": "隨機森林相較單一決策樹的優點為何？", "A": "完全沒有黑盒子問題", "B": "不需要任何計算資源", "C": "一定比較快", "D": "準確度高、不易過擬合，且能處理缺失值", "answer": "D", "explanation": "隨機森林準確度高、不易過度擬合，且能處理缺失值。"}, {"category": "監督式學習", "type": "概念", "question": "隨機森林的主要缺點為何？", "A": "只能用於迴歸問題", "B": "計算資源消耗大、較難解釋（黑盒子效應）", "C": "完全無法處理連續型變數", "D": "容易嚴重欠擬合", "answer": "B", "explanation": "樹的數量多時需要較多計算資源，且較難解釋整體判斷邏輯。"}, {"category": "監督式學習", "type": "概念", "question": "貝氏分類器（Naive Bayes Classifier）的核心概念是？", "A": "用距離找最近鄰居", "B": "用多棵樹投票", "C": "用機率並根據「已知條件」更新判斷結果（條件機率）", "D": "用邊界最大化分開類別", "answer": "C", "explanation": "Naive Bayes用條件機率，根據已知證據更新判斷結果。"}, {"category": "監督式學習", "type": "概念", "question": "Naive Bayes 之所以稱為「Naive（樸素）」，是因為它假設什麼？", "A": "一定要用於影像辨識", "B": "資料一定沒有雜訊", "C": "所有特徵都是連續型變數", "D": "所有特徵之間互相獨立", "answer": "D", "explanation": "「特徵獨立」假設是Naive Bayes的核心，也是主要限制。"}, {"category": "監督式學習", "type": "情境範例", "question": "某電商希望根據使用者過去的瀏覽與購買紀錄，預測其「下個月的消費金額」（一個連續數值），最適合使用下列哪種監督式學習方法？", "A": "線性迴歸（Linear Regression）", "B": "GAN", "C": "K-means", "D": "PCA", "answer": "A", "explanation": "預測連續數值屬於迴歸問題，線性迴歸是最基本的工具。"}, {"category": "監督式學習", "type": "情境範例", "question": "一封郵件內容包含「免費」「中獎」「點擊連結」等關鍵字，系統將這些字詞的條件機率相乘，分別計算「垃圾郵件機率」與「正常郵件機率」後比較大小來判斷是否為垃圾郵件，此方法屬於？", "A": "Q-Learning", "B": "Naive Bayes（貝氏分類器）", "C": "K-means", "D": "PCA", "answer": "B", "explanation": "將各特徵條件機率相乘比較大小，正是Naive Bayes的經典垃圾郵件判斷法。"}, {"category": "監督式學習", "type": "情境範例", "question": "某生物資訊團隊需要處理「特徵維度極高、但樣本數極少」的癌症基因資料，並希望找出一個能有效分類癌症與正常組織的邊界，最適合的模型為？", "A": "K-means", "B": "SVM", "C": "PCA", "D": "Q-Learning", "answer": "B", "explanation": "SVM非常擅長處理高維度、少樣本的極端狀況，如生物資訊學癌症基因檢測。"}, {"category": "監督式學習", "type": "情境範例", "question": "銀行想預測貸款申請人「是否會違約」（是/否兩類別），並希望模型具備高可解釋性，能清楚說明每個特徵（如收入、信用分數）對結果的影響權重，最適合的模型為？", "A": "GAN", "B": "Logistic Regression（邏輯迴歸）", "C": "Diffusion Model", "D": "K-means", "answer": "B", "explanation": "邏輯迴歸可解釋性高，每個特徵都有明確權重，適合這類需求。"}, {"category": "監督式學習", "type": "情境範例", "question": "某銀行想預測信用卡是否會違約，使用了100棵決策樹並將它們的預測結果投票整合，此方法稱為？", "A": "隨機森林（Random Forest）", "B": "Q-Learning", "C": "Naive Bayes", "D": "SVM", "answer": "A", "explanation": "集結多棵決策樹並透過投票整合結果，正是隨機森林的做法。"}, {"category": "監督式學習", "type": "情境範例", "question": "某手機廠商想在應用程式中加入「人臉解鎖」功能，需要一個模型能有效分辨「是否為機主本人」的臉部特徵邊界，該情境在筆記中被列為哪個模型的應用範例？", "A": "SVM", "B": "K-means", "C": "PCA", "D": "Q-Learning", "answer": "A", "explanation": "筆記列舉SVM的應用範例包含「影像辨識與人臉偵測」。"}, {"category": "非監督式學習", "type": "概念", "question": "非監督式學習的核心特徵為何？", "A": "資料沒有標籤，模型自行找出規律", "B": "一定要搭配強化學習", "C": "資料需要人工標籤", "D": "只能用於迴歸", "answer": "A", "explanation": "非監督式學習使用沒有標籤（Label）的資料，讓模型自行學習規律。"}, {"category": "非監督式學習", "type": "概念", "question": "K-means是屬於哪一種非監督式學習任務？", "A": "降維", "B": "分類", "C": "分群（Clustering）", "D": "迴歸", "answer": "C", "explanation": "K-means是經典的分群（Clustering）演算法。"}, {"category": "非監督式學習", "type": "概念", "question": "K-means演算法的核心作法為何？", "A": "建立決策樹", "B": "用梯度下降訓練分類器", "C": "用最近鄰居投票", "D": "依照特徵相似度自動分成K群", "answer": "D", "explanation": "K-means依照資料特徵的相似度，自動分類成K個不同群組。"}, {"category": "非監督式學習", "type": "概念", "question": "K-means的缺點不包含下列何者？", "A": "對異常值敏感", "B": "必須先指定K值", "C": "只適合圓形/球狀分群", "D": "計算速度非常慢，不適合大數據", "answer": "D", "explanation": "K-means的優點正是計算速度快、適合處理大數據，這不是它的缺點。"}, {"category": "非監督式學習", "type": "概念", "question": "用來選擇K-means中K值的常見圖形化方法為？", "A": "肘部法（Elbow Method）", "B": "梯度剪裁", "C": "交叉驗證", "D": "貝氏最佳化", "answer": "A", "explanation": "肘部法是選擇K-means中K值最常用的圖形化方法。"}, {"category": "非監督式學習", "type": "概念", "question": "PCA（主成分分析）的主要目的是？", "A": "分群", "B": "降維：減少特徵數量同時保留關鍵資料", "C": "做序列預測", "D": "生成新資料", "answer": "B", "explanation": "PCA是最經典的降維（Dimensionality Reduction）技術。"}, {"category": "非監督式學習", "type": "概念", "question": "PCA主要用來解決下列哪個問題？", "A": "類別不平衡", "B": "維度災難（Curse of Dimensionality）", "C": "過擬合的正則化", "D": "梯度消失", "answer": "B", "explanation": "PCA透過壓縮特徵數量，解決維度災難的問題。"}, {"category": "非監督式學習", "type": "概念", "question": "PCA的數學本質是？", "A": "用注意力機制計算權重", "B": "建立多棵決策樹", "C": "座標軸旋轉，尋找最大變異數方向", "D": "用機率分布生成資料", "answer": "C", "explanation": "PCA的數學本質是座標軸旋轉，尋找最大變異數的方向。"}, {"category": "非監督式學習", "type": "概念", "question": "PCA的缺點為何？", "A": "無法用於資料視覺化", "B": "計算速度過慢", "C": "失去解釋性（Interpretability），且只適用線性關係", "D": "一定會增加特徵數量", "answer": "C", "explanation": "PCA降維後失去原始特徵的解釋性，且只適用線性關係。"}, {"category": "非監督式學習", "type": "概念", "question": "K-means與PCA的差異敘述何者正確？", "A": "兩者都需要標籤資料", "B": "K-means是分群（Clustering），PCA是降維（Dimensionality Reduction）", "C": "兩者皆為監督式學習", "D": "K-means是降維技術，PCA是分群技術", "answer": "B", "explanation": "K-means負責分群，PCA負責降維，兩者任務不同。"}, {"category": "非監督式學習", "type": "情境範例", "question": "某電商想根據顧客的消費行為特徵，將顧客「自動」分成幾種不同消費族群以進行精準行銷，且資料沒有標籤，最適合使用？", "A": "Q-Learning", "B": "K-means", "C": "邏輯迴歸", "D": "SVM", "answer": "B", "explanation": "電商客戶分群是K-means分群演算法的經典實際範例。"}, {"category": "非監督式學習", "type": "情境範例", "question": "物流公司想根據各地區的貨運量、人口密度等特徵，決定倉庫/轉運站的最佳選址分組，這是下列哪種技術的實際應用？", "A": "Random Forest", "B": "K-means分群", "C": "GAN", "D": "LSTM", "answer": "B", "explanation": "物流中心選址是筆記中列舉的K-means實際應用範例之一。"}, {"category": "非監督式學習", "type": "情境範例", "question": "某金融機構蒐集了50個財務指標來評估公司體質，希望將這些高度相關的指標壓縮成2~3個「主成分」以利視覺化與後續分析，應使用？", "A": "Q-Learning", "B": "PCA", "C": "CFG", "D": "K-means", "answer": "B", "explanation": "把多個指標數學組合、精煉成少數主成分，正是PCA的核心用途。"}, {"category": "非監督式學習", "type": "情境範例", "question": "將一張3D場景拍成2D照片的過程，常被用來比喻下列哪個技術「找到最能看清全貌的角度」？", "A": "DQN", "B": "K-means", "C": "GAN", "D": "PCA", "answer": "D", "explanation": "筆記以3D拍照變2D照片比喻PCA找到最能看清全貌的拍攝角度。"}, {"category": "半監督式學習", "type": "概念", "question": "半監督式學習的資料特性為何？", "A": "全部都沒有標籤", "B": "少量標籤+大量無標籤資料", "C": "全部都有標籤", "D": "只有影像資料", "answer": "B", "explanation": "半監督式學習使用少量標籤資料搭配大量無標籤資料。"}, {"category": "半監督式學習", "type": "概念", "question": "自我訓練(Self-Training)又被稱為？", "A": "貝氏最佳化", "B": "對比學習", "C": "偽標籤（Pseudo-Labeling）", "D": "掩碼預測", "answer": "C", "explanation": "自我訓練在機器學習中也常被稱為偽標籤（Pseudo-Labeling）。"}, {"category": "半監督式學習", "type": "概念", "question": "自我訓練的基本流程為何？", "A": "只用無標籤資料訓練，完全不用標籤", "B": "先做PCA降維再分群", "C": "用兩個網路互相對抗生成資料", "D": "先用少量標籤資料訓練初始模型，再用它對無標籤資料打分數，將高信心度預測當作標籤放回訓練集", "answer": "D", "explanation": "自我訓練先訓練初始模型，再用模型幫無標籤資料打偽標籤並加回訓練集。"}, {"category": "半監督式學習", "type": "概念", "question": "自我訓練的優點為何？", "A": "不需要任何模型", "B": "絕對不會出錯", "C": "一定比監督式學習準確", "D": "成本極低、概念簡單", "answer": "D", "explanation": "自我訓練成本極低、概念簡單。"}, {"category": "半監督式學習", "type": "概念", "question": "自我訓練最大的風險/缺點稱為？", "A": "確認偏誤（Confirmation Bias）", "B": "維度災難", "C": "模式崩潰", "D": "梯度爆炸", "answer": "A", "explanation": "若初期模型錯誤預測被當成真實標籤，會不斷強化錯誤，此現象稱為確認偏誤。"}, {"category": "半監督式學習", "type": "概念", "question": "如何緩解自我訓練中的確認偏誤問題？", "A": "搭配資料增強（Data Augmentation）或使用軟標籤（Soft Label）", "B": "移除所有標籤資料", "C": "降低學習率至0", "D": "增加更多層數", "answer": "A", "explanation": "可搭配資料增強或軟標籤，減少模型過度自信犯錯的機會。"}, {"category": "半監督式學習", "type": "情境範例", "question": "某團隊只有1000張有標籤的貓狗照片，卻有10萬張無標籤照片，他們先用1000張訓練初始分類器，再用該分類器對10萬張無標籤照片預測，並把「信心度超過95%」的預測結果當作真實標籤加入訓練集重新訓練，這種做法稱為？", "A": "自我訓練/偽標籤", "B": "GAN", "C": "PCA", "D": "對比學習", "answer": "A", "explanation": "這正是自我訓練（Self-Training/Pseudo-Labeling）的標準流程。"}, {"category": "半監督式學習", "type": "情境範例", "question": "為了避免模型對某張照片一開始就過度自信而產生錯誤偽標籤、進而在後續訓練中不斷強化錯誤，工程師選擇不直接把圖片歸類為「貓」，而是保留「0.92貓、0.08狗」的機率分佈來訓練，這種作法稱為？", "A": "批次正規化", "B": "硬標籤（Hard Label）", "C": "梯度剪裁", "D": "軟標籤（Soft Label）", "answer": "D", "explanation": "保留機率分佈而非單一類別，即為軟標籤（Soft Label）。"}, {"category": "自監督式學習(SSL)", "type": "概念", "question": "自監督式學習(SSL)的核心特徵為何？", "A": "沒有人工標籤，但從資料本身自動生成標籤", "B": "完全不需要訓練資料", "C": "需要大量人工標註", "D": "只能用在強化學習", "answer": "A", "explanation": "SSL沒有人工標籤，而是從資料本身自動生成監督訊號。"}, {"category": "自監督式學習(SSL)", "type": "概念", "question": "CLIP的全名與核心用途為何？", "A": "Contrastive Language-Image Pretraining，將圖像與文字映射到同一語意空間", "B": "只用來做影像分類", "C": "只用來生成音樂", "D": "一種決策樹演算法", "answer": "A", "explanation": "CLIP是對比式圖文預訓練模型，將圖像與文字映射到同一語意空間。"}, {"category": "自監督式學習(SSL)", "type": "概念", "question": "CLIP之所以被稱為「弱監督(Weakly Supervised)」，是因為它的監督訊號來自？", "A": "圖像與文字自然配對產生的監督訊號", "B": "強化學習的獎勵訊號", "C": "PCA的主成分", "D": "人工標註的分類標籤", "answer": "A", "explanation": "CLIP的監督訊號是自然產生的圖文配對，因此被稱為弱監督。"}, {"category": "自監督式學習(SSL)", "type": "概念", "question": "CLIP的訓練資料型態為何？", "A": "圖像+文字配對（Image-Text Pair）", "B": "時間序列資料", "C": "純影像", "D": "純文字", "answer": "A", "explanation": "CLIP的資料來源是圖像與文字配對。"}, {"category": "自監督式學習(SSL)", "type": "概念", "question": "DINO是由哪個機構提出，主要用來訓練哪種模型？", "A": "DeepMind；訓練Q-table", "B": "Meta；訓練視覺Transformer（ViT）", "C": "OpenAI；訓練GAN", "D": "Google；訓練決策樹", "answer": "B", "explanation": "DINO由Meta（Facebook）研究團隊提出，專門用來訓練視覺Transformer（ViT）。"}, {"category": "自監督式學習(SSL)", "type": "概念", "question": "DINO的核心運作機制為何？", "A": "透過生成器與判別器互相對抗", "B": "透過條件機率做分類", "C": "透過梯度提升樹進行預測", "D": "透過教師-學生網路的自蒸餾機制，不需負樣本", "answer": "D", "explanation": "DINO不需要人工標籤與負樣本，僅透過教師-學生網路的自蒸餾機制運作。"}, {"category": "自監督式學習(SSL)", "type": "概念", "question": "「前置任務(Pretext Task)」的核心概念為何？", "A": "只能用來做迴歸", "B": "只用於強化學習", "C": "設計一個假任務讓模型學習資料結構，再把學到的能力用在真正任務上", "D": "直接用真實標籤訓練", "answer": "C", "explanation": "前置任務是設計假任務讓模型先學習資料結構，再遷移到真正任務。"}, {"category": "自監督式學習(SSL)", "type": "概念", "question": "下列何者不是常見的前置任務範例？", "A": "拼圖遊戲（Jigsaw）", "B": "隨機森林投票", "C": "圖片旋轉（Rotation）", "D": "遮罩語言模型（Masked Language Modeling）", "answer": "B", "explanation": "隨機森林投票是監督式學習的集成方法，並非前置任務範例。"}, {"category": "自監督式學習(SSL)", "type": "概念", "question": "對比學習(Contrastive Learning)的核心邏輯為何？", "A": "拉近正樣本、推遠負樣本", "B": "只考慮正樣本，忽略負樣本", "C": "用注意力機制翻譯句子", "D": "用機率分布生成新資料", "answer": "A", "explanation": "對比學習的核心邏輯是拉近正樣本、推遠負樣本。"}, {"category": "自監督式學習(SSL)", "type": "概念", "question": "下列哪些模型是對比學習的代表？", "A": "GAN、VAE", "B": "SimCLR、MoCo", "C": "CLIP、DINO", "D": "BERT、MAE", "answer": "B", "explanation": "SimCLR與MoCo是對比學習的代表模型。"}, {"category": "自監督式學習(SSL)", "type": "概念", "question": "掩碼預測(Masked Prediction)的核心做法與代表模型為何？", "A": "分群資料；代表模型為K-means", "B": "對抗生成資料；代表模型為GAN", "C": "隨機遮蔽部分輸入，訓練模型預測缺失內容；代表模型為BERT", "D": "試誤學習；代表模型為Q-Learning", "answer": "C", "explanation": "掩碼預測隨機遮蔽輸入並訓練模型預測缺失內容，最代表性的模型是BERT。"}, {"category": "自監督式學習(SSL)", "type": "概念", "question": "關於CLIP與DINO的比較，下列敘述何者正確？", "A": "CLIP不需要文字資料；DINO需要文字資料", "B": "兩者都需要負樣本", "C": "CLIP=對比學習+多模態（圖文）；DINO=非對比學習+自蒸餾", "D": "兩者都是監督式學習", "answer": "C", "explanation": "筆記總結：CLIP = 對比學習 + 多模態；DINO = 非對比學習 + 自蒸餾。"}, {"category": "自監督式學習(SSL)", "type": "情境範例", "question": "某團隊想開發一個能用「文字描述」搜尋出對應圖片的系統（例如輸入「一隻在沙灘上奔跑的狗」就能找到相符圖片），最適合採用下列哪個模型的概念？", "A": "Random Forest", "B": "Q-Learning", "C": "PCA", "D": "CLIP", "answer": "D", "explanation": "CLIP將圖像與文字映射到同一語意空間，適合圖文搜尋任務。"}, {"category": "自監督式學習(SSL)", "type": "情境範例", "question": "研究人員想在完全沒有人工標籤的情況下訓練一個Vision Transformer，並利用教師-學生網路架構讓模型自己學會理解圖片，這是下列哪個方法的應用？", "A": "DINO", "B": "Wide&Deep", "C": "XGBoost", "D": "SARSA", "answer": "A", "explanation": "DINO正是專門用教師-學生自蒸餾機制訓練ViT，且不需人工標籤。"}, {"category": "自監督式學習(SSL)", "type": "情境範例", "question": "訓練模型時，將一段句子中的某個單字遮住，讓模型根據上下文猜出被遮住的單字，這種訓練方式稱為？", "A": "對比學習", "B": "掩碼預測（Masked Prediction），如BERT", "C": "生成對抗", "D": "貝氏最佳化", "answer": "B", "explanation": "遮蔽部分輸入讓模型猜測缺失內容，正是掩碼預測，代表模型為BERT。"}, {"category": "自監督式學習(SSL)", "type": "情境範例", "question": "工程師刻意把一張圖片隨機旋轉90度、180度或270度，並訓練模型預測「旋轉了幾度」，藉此讓模型學會圖片中物體的結構，這種假任務稱為？", "A": "特徵交叉", "B": "批次正規化", "C": "貝氏最佳化", "D": "前置任務（Pretext Task）中的旋轉預測", "answer": "D", "explanation": "圖片旋轉預測是前置任務的經典範例，屬於自監督學習的一種設計方式。"}, {"category": "強化學習(RL)", "type": "概念", "question": "時序差分(TD)學習的核心概念為何？", "A": "先收集所有資料再一次訓練", "B": "只能用於監督式學習", "C": "邊做邊學，用現在預測去修正過去預測", "D": "完全不需要獎勵訊號", "answer": "C", "explanation": "TD（Temporal-Difference）就是邊做邊學，用現在的預測修正過去的預測。"}, {"category": "強化學習(RL)", "type": "概念", "question": "TD(0)又稱為？", "A": "批次正規化", "B": "對比學習", "C": "1步時序差分，最基礎的預測演算法", "D": "多步蒙地卡羅法", "answer": "C", "explanation": "TD(0)是最基礎的1步時序差分預測演算法。"}, {"category": "強化學習(RL)", "type": "概念", "question": "SARSA屬於哪種學習方式？", "A": "非監督式分群演算法", "B": "線上（On-policy）控制演算法", "C": "生成式模型", "D": "離線（Off-policy）最佳化演算法", "answer": "B", "explanation": "SARSA是一種基於TD的線上（On-policy）控制演算法。"}, {"category": "強化學習(RL)", "type": "概念", "question": "Q-Learning屬於哪種學習方式？", "A": "自監督式學習", "B": "線上（On-policy）", "C": "離線（Off-policy）最佳化演算法", "D": "半監督式學習", "answer": "C", "explanation": "Q-Learning是一種基於TD的離線（Off-policy）最佳化演算法。"}, {"category": "強化學習(RL)", "type": "概念", "question": "Q-Learning的核心資料結構為？", "A": "卷積核", "B": "潛在空間分布", "C": "決策樹", "D": "Q表（Q-table），記錄狀態與動作對應的Q值", "answer": "D", "explanation": "Q-Learning的核心是Q表，記錄每個狀態-動作對應的Q值。"}, {"category": "強化學習(RL)", "type": "概念", "question": "Q(S,A)代表的意義為何？", "A": "狀態S出現的機率", "B": "環境的獎勵函數本身", "C": "動作A的執行時間", "D": "在狀態S下採取動作A，預期未來能獲得的總回報", "answer": "D", "explanation": "Q(S,A)代表在狀態S下採取動作A，預期未來能獲得的總回報。"}, {"category": "強化學習(RL)", "type": "概念", "question": "深度Q學習(DQN)相較傳統Q-Learning的最大改進為何？", "A": "完全不需要獎勵訊號", "B": "改用決策樹取代Q值", "C": "改用PCA降維後直接分類", "D": "用深度神經網路取代Q-table，解決狀態空間過大無法窮舉的問題", "answer": "D", "explanation": "DQN利用深度神經網路取代Q-table，解決狀態空間過大的問題。"}, {"category": "強化學習(RL)", "type": "概念", "question": "DQN較適合處理下列哪種輸入？", "A": "離散、小型狀態空間", "B": "純文字資料的機率分布", "C": "高維度輸入，如影像像素", "D": "表格型資料", "answer": "C", "explanation": "DQN能直接從高維度輸入（如影像像素）中學習，適合複雜問題。"}, {"category": "強化學習(RL)", "type": "概念", "question": "SARSA與Q-Learning最主要的差異在於？", "A": "Q-Learning只能用於監督式學習", "B": "對待風險的態度：SARSA較保守，Q-Learning較激進", "C": "兩者完全相同，沒有差異", "D": "SARSA不使用獎勵訊號", "answer": "B", "explanation": "SARSA屬保守派、在線學習；Q-Learning屬激進派、離線學習。"}, {"category": "強化學習(RL)", "type": "概念", "question": "SARSA在更新當前行為價值時，會考慮什麼？", "A": "完全忽略下一步", "B": "大腦中預計下一步實際會採取的行動", "C": "只考慮過去所有步驟的平均值", "D": "假設下一步一定選最佳動作", "answer": "B", "explanation": "SARSA更新時會把預計下一步實際會採取的行動也納入考量。"}, {"category": "強化學習(RL)", "type": "概念", "question": "Q-Learning在評估當前步驟時的假設為何？", "A": "假設下一步一定會選擇分數最高的最佳動作", "B": "假設沒有下一步", "C": "假設下一步會隨機亂走", "D": "假設環境沒有獎勵", "answer": "A", "explanation": "Q-Learning評估時假設下一步一定選擇最完美、分數最高的動作。"}, {"category": "強化學習(RL)", "type": "情境範例", "question": "一個機器人在懸崖邊行走的環境中，若使用「保守、在線學習」的演算法訓練，比較不會選擇靠近懸崖的捷徑，這種演算法最可能是？", "A": "SARSA", "B": "PCA", "C": "Q-Learning", "D": "GAN", "answer": "A", "explanation": "SARSA訓練過程比較安全保守，會把下一步的風險納入評估。"}, {"category": "強化學習(RL)", "type": "情境範例", "question": "想讓AI直接從Atari遊戲的螢幕像素（高維度影像）中學習操作策略，而不是用表格記錄每個狀態，應該採用？", "A": "PCA", "B": "Naive Bayes", "C": "傳統Q-table", "D": "深度Q學習（DQN）", "answer": "D", "explanation": "DQN能直接處理高維度影像輸入，適合這類複雜問題。"}, {"category": "強化學習(RL)", "type": "情境範例", "question": "一個簡單的迷宮遊戲，狀態與動作空間都很小，工程師想用一張表格直接記錄每個狀態-動作組合的價值，這種做法屬於？", "A": "GCN", "B": "Diffusion Model", "C": "Q-Learning的Q-table", "D": "DQN", "answer": "C", "explanation": "小型、離散狀態空間適合用傳統Q-Learning的Q-table記錄。"}, {"category": "決策與控制(DRL)", "type": "概念", "question": "深度增強式學習(DRL)是結合了哪兩種技術？", "A": "監督式學習與非監督式學習", "B": "GAN與VAE", "C": "深度學習與強化學習", "D": "PCA與K-means", "answer": "C", "explanation": "DRL是把深度學習（Deep Learning）和增強式學習（RL）結合在一起的方法。"}, {"category": "決策與控制(DRL)", "type": "概念", "question": "DRL的核心概念可以理解為？", "A": "完全依賴人工標籤訓練", "B": "讓AI像人一樣透過經驗學習怎麼做決策", "C": "只能處理表格資料", "D": "不需要環境互動", "answer": "B", "explanation": "DRL的核心概念是讓AI像人一樣透過經驗學習如何做決策。"}, {"category": "決策與控制(DRL)", "type": "概念", "question": "DRL中的五個核心要素不包含下列何者？", "A": "Environment（環境）", "B": "Kernel（核函數）", "C": "Reward（獎勵）", "D": "Agent（代理）", "answer": "B", "explanation": "DRL的五個核心要素為Agent、Environment、State、Action、Reward，核函數屬於SVM技術。"}, {"category": "決策與控制(DRL)", "type": "概念", "question": "相較傳統RL，DRL在「狀態表示」上的差異為何？", "A": "傳統RL才能處理影像", "B": "DRL只能處理表格資料", "C": "傳統RL簡單（表格），DRL複雜（可處理圖片、聲音）", "D": "兩者完全相同", "answer": "C", "explanation": "傳統RL狀態表示簡單（表格），DRL能處理複雜狀態如圖片、聲音。"}, {"category": "決策與控制(DRL)", "type": "概念", "question": "DRL使用什麼方法取代傳統RL的Q-table？", "A": "PCA降維", "B": "神經網路（如DQN、Policy Network）", "C": "貝氏分類器", "D": "決策樹", "answer": "B", "explanation": "DRL用神經網路（如DQN、Policy Network）取代傳統表格。"}, {"category": "決策與控制(DRL)", "type": "概念", "question": "DRL相較傳統RL能應用在哪類問題？", "A": "只能用於推薦系統", "B": "高維度問題，如影像輸入的自駕車、AlphaGo", "C": "只能處理文字分類", "D": "只能玩簡單棋盤遊戲", "answer": "B", "explanation": "DRL能應用於高維度問題，如自駕車與AlphaGo等複雜場景。"}, {"category": "決策與控制(DRL)", "type": "情境範例", "question": "AlphaGo需要處理棋盤的高維度狀態表示並做出複雜決策，這種應用最適合歸類為？", "A": "Naive Bayes", "B": "PCA", "C": "傳統Q-table強化學習", "D": "深度增強式學習（DRL）", "answer": "D", "explanation": "AlphaGo是DRL的經典應用，結合深度學習處理複雜棋盤狀態。"}, {"category": "決策與控制(DRL)", "type": "情境範例", "question": "自駕車系統需要從攝影機影像（高維度資料）中即時判斷該加速、煞車或轉彎，這種決策系統最適合使用？", "A": "Naive Bayes", "B": "線性迴歸", "C": "DRL（結合深度學習與強化學習）", "D": "K-means", "answer": "C", "explanation": "自駕車是DRL的典型應用，需處理高維度影像並做出決策。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "概念", "question": "GAN由哪兩個模型組成？", "A": "生成器（Generator）與判別器（Discriminator）", "B": "Agent與Environment", "C": "Wide與Deep", "D": "編碼器與解碼器", "answer": "A", "explanation": "GAN由生成器與判別器兩個模型互相對抗、共同進步。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "概念", "question": "GAN中生成器(Generator)的任務為何？", "A": "造假資料", "B": "做特徵交叉", "C": "計算梯度", "D": "分辨真假", "answer": "A", "explanation": "生成器負責「造假資料」。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "概念", "question": "GAN中判別器(Discriminator)的任務為何？", "A": "壓縮資料", "B": "造假資料", "C": "分辨真假", "D": "做分群", "answer": "C", "explanation": "判別器負責「分辨真假」。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "概念", "question": "GAN常見的訓練挑戰不包含下列何者？", "A": "難以評估生成品質", "B": "完全不需要任何調參", "C": "模式崩潰（只生成某幾種結果）", "D": "訓練不穩定，可能崩潰", "answer": "B", "explanation": "GAN的挑戰包含訓練不穩、模式崩潰、難以評估品質，並非完全不需調參。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "概念", "question": "關於GAN與VAE的比較，下列敘述何者正確？", "A": "GAN的latent空間較有結構，VAE較不規則", "B": "兩者訓練方式完全相同", "C": "VAE的生成品質通常優於GAN", "D": "GAN訓練穩定性較低，VAE訓練較穩定", "answer": "D", "explanation": "GAN訓練不穩定，VAE訓練較穩定；VAE的latent空間反而較有結構。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "概念", "question": "VAE與一般Autoencoder最大的差異為何？", "A": "兩者完全相同", "B": "VAE完全不能生成資料", "C": "VAE記錄的是「機率分布」，一般Autoencoder記錄的是「固定向量」", "D": "VAE不需要Encoder", "answer": "C", "explanation": "一般Autoencoder每張圖對應一個固定向量，VAE則對應一個機率分布。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "概念", "question": "VAE的核心概念不包含下列何者？", "A": "損失函數（Loss Function）", "B": "機率分布（Gaussian）", "C": "支援向量（Support Vector）", "D": "Latent Space（潛在空間）", "answer": "C", "explanation": "支援向量是SVM的概念，不屬於VAE的核心概念。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "概念", "question": "VAE常見的應用不包含下列何者？", "A": "決策樹剪枝", "B": "異常偵測（Anomaly Detection）", "C": "生成圖片、音樂", "D": "資料增強", "answer": "A", "explanation": "決策樹剪枝與VAE無關，屬於決策樹的過擬合解決方法。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "概念", "question": "擴散模型(Diffusion Models)的核心概念為何？", "A": "用兩個網路互相對抗", "B": "從雜訊中一步步還原出有意義的資料", "C": "用最近鄰居投票", "D": "用條件機率做分類", "answer": "B", "explanation": "擴散模型的核心概念是從雜訊中一步步還原出有意義的資料。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "概念", "question": "擴散模型中，逐步「加噪聲」的過程稱為？", "A": "Reverse Diffusion（反向擴散）", "B": "Forward Diffusion（正向擴散）", "C": "Pretext Task", "D": "Backpropagation", "answer": "B", "explanation": "加噪聲的正向過程稱為Forward Diffusion（正向擴散）。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "概念", "question": "擴散模型中，逐步「去噪聲」以生成資料的過程稱為？", "A": "Contrastive Learning", "B": "Forward Diffusion", "C": "Feature Crossing", "D": "Reverse Diffusion（反向擴散）", "answer": "D", "explanation": "去噪聲的反向過程稱為Reverse Diffusion（反向擴散）。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "概念", "question": "比較Diffusion、GAN、VAE三者的生成品質與訓練穩定性，下列敘述何者正確？", "A": "GAN訓練最穩定", "B": "三者生成速度都一樣快", "C": "VAE生成品質最高", "D": "Diffusion品質最高且訓練穩定，但生成速度慢", "answer": "D", "explanation": "Diffusion生成品質最高、訓練穩定，但需多步驟生成速度較慢。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "概念", "question": "Diffusion模型的主要缺點為何？", "A": "經常發生模式崩潰", "B": "生成速度慢（需多步驟）", "C": "完全無法生成高品質圖片", "D": "訓練極度不穩定", "answer": "B", "explanation": "Diffusion模型需要多步驟去噪，生成速度較慢是其主要缺點。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "概念", "question": "無分類器引導(Classifier-free Guidance, CFG)主要用途為何？", "A": "做特徵選擇", "B": "加速模型訓練速度", "C": "控制生成結果更貼近文字提示（prompt）", "D": "取代Encoder-Decoder架構", "answer": "C", "explanation": "CFG是擴散模型的技巧，用來控制生成結果更貼近文字提示。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "概念", "question": "CFG的核心運作機制為何？", "A": "用決策樹分類", "B": "在「有提示」與「沒提示」的預測之間做加權，強化想要的內容", "C": "用兩個網路互相對抗", "D": "用K-means分群", "answer": "B", "explanation": "CFG讓模型在有提示與無提示之間做加權，強化想要的內容。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "概念", "question": "若想要「做逼真的人臉圖片」且影像生成品質最重要，筆記建議優先選用哪個模型？", "A": "Naive Bayes", "B": "PCA", "C": "K-means", "D": "GAN", "answer": "D", "explanation": "筆記指出想做逼真圖片、影像生成品質最重要時建議使用GAN。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "情境範例", "question": "一間新創公司想生成極度真實、以假亂真的AI人臉圖片用於虛擬代言人，且能接受訓練過程較不穩定，最適合的模型為？", "A": "PCA", "B": "Q-Learning", "C": "GAN", "D": "K-means", "answer": "C", "explanation": "GAN生成品質高、非常逼真，符合此需求（雖訓練較不穩定）。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "情境範例", "question": "工程師想要一個訓練穩定、latent space具有良好結構、又能同時做資料壓縮與異常偵測的模型，應優先考慮？", "A": "SVM", "B": "GAN", "C": "VAE", "D": "K-means", "answer": "C", "explanation": "VAE訓練穩定、latent space有結構，且可用於壓縮與異常偵測。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "情境範例", "question": "某圖像生成新創希望產出的圖片畫質是業界最高等級，即使生成速度較慢也能接受，且幾乎不會出現模式崩潰問題，最適合採用？", "A": "擴散模型（Diffusion Models）", "B": "SARSA", "C": "K-means", "D": "GAN", "answer": "A", "explanation": "擴散模型生成品質最高、幾乎沒有模式崩潰，但生成速度較慢。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "情境範例", "question": "使用者在文字生成圖片工具中輸入提示詞「一隻穿太空衣的貓」，並希望生成結果盡量貼近這句提示、而非天馬行空，工程師應調整下列哪個技術的權重？", "A": "批次正規化", "B": "無分類器引導（CFG）", "C": "PCA", "D": "特徵交叉", "answer": "B", "explanation": "CFG可調整權重讓生成結果更貼近使用者輸入的文字提示。"}, {"category": "生成與創作(GAN/VAE/Diffusion/CFG)", "type": "情境範例", "question": "工廠想利用生成模型針對感測器數據做資料增強（Data Augmentation）並同時具備異常偵測能力，且看重模型的可解釋性，最適合的模型為？", "A": "GAN", "B": "Diffusion Model", "C": "Q-Learning", "D": "VAE", "answer": "D", "explanation": "VAE可解釋性較高，且能同時用於資料生成（增強）與異常偵測。"}, {"category": "序列與文字(Transformer/RNN/LSTM)", "type": "概念", "question": "Transformer模型的核心運作機制為何？", "A": "只使用決策樹", "B": "只使用K-means分群", "C": "只使用卷積層", "D": "完全不用RNN/CNN，而是用注意力機制（Attention）", "answer": "D", "explanation": "Transformer完全不用RNN/CNN，而是用注意力機制理解資料。"}, {"category": "序列與文字(Transformer/RNN/LSTM)", "type": "概念", "question": "Transformer的整體架構主要由哪兩部分組成？", "A": "Generator與Discriminator", "B": "Agent與Environment", "C": "Encoder（理解）與Decoder（生成）", "D": "Wide與Deep", "answer": "C", "explanation": "Transformer整體結構主要由Encoder（理解）與Decoder（生成）組成。"}, {"category": "序列與文字(Transformer/RNN/LSTM)", "type": "概念", "question": "Self-Attention中，每個字會被轉換成哪三種向量？", "A": "Forget、Input、Output", "B": "Query、Key、Value", "C": "Mean、Variance、Bias", "D": "Encoder、Decoder、Context", "answer": "B", "explanation": "Self-Attention中每個字會轉換成Query、Key、Value三種向量。"}, {"category": "序列與文字(Transformer/RNN/LSTM)", "type": "概念", "question": "Multi-Head Attention的用途為何？", "A": "只計算單一角度的注意力", "B": "用來做梯度剪裁", "C": "從多個角度理解資料", "D": "取代Encoder", "answer": "C", "explanation": "Multi-Head Attention讓模型從多個角度理解資料。"}, {"category": "序列與文字(Transformer/RNN/LSTM)", "type": "概念", "question": "Transformer相較RNN的優點不包含下列何者？", "A": "完全不需要任何訓練資料", "B": "通常比RNN更快更準", "C": "長距離關係學得更好", "D": "可以同時看整句話（平行處理）", "answer": "A", "explanation": "Transformer仍需要訓練資料，這不是它相較RNN的優點。"}, {"category": "序列與文字(Transformer/RNN/LSTM)", "type": "概念", "question": "RNN(循環神經網路)主要用來處理哪種資料？", "A": "靜態影像", "B": "表格資料", "C": "序列資料（有時間順序的資料）", "D": "圖形結構資料", "answer": "C", "explanation": "RNN專門處理序列資料，例如文字、語音、時間序列。"}, {"category": "序列與文字(Transformer/RNN/LSTM)", "type": "概念", "question": "RNN與一般神經網路（全連接層）最大的差異為何？", "A": "RNN只能處理單一時間點的資料", "B": "RNN會記住之前的資訊（hidden state）並影響現在的輸出", "C": "RNN沒有任何記憶能力", "D": "RNN完全不需要輸入資料", "answer": "B", "explanation": "RNN會記住之前的資訊，並用來影響現在的輸出，這是與一般神經網路最大的差異。"}, {"category": "序列與文字(Transformer/RNN/LSTM)", "type": "概念", "question": "RNN在處理長序列時常遇到的問題稱為？", "A": "梯度消失，導致長期記憶困難", "B": "維度災難", "C": "確認偏誤", "D": "模式崩潰", "answer": "A", "explanation": "RNN長期記憶困難的根本原因是梯度消失問題。"}, {"category": "序列與文字(Transformer/RNN/LSTM)", "type": "概念", "question": "為了解決RNN長期記憶困難的問題，發展出下列哪些模型？", "A": "GAN、VAE", "B": "LSTM、GRU", "C": "K-means、PCA", "D": "SVM、Naive Bayes", "answer": "B", "explanation": "為了解決長期記憶困難，發展出LSTM與GRU等模型。"}, {"category": "序列與文字(Transformer/RNN/LSTM)", "type": "概念", "question": "LSTM主要透過哪個機制決定「記住、忘記、輸出」哪些資訊？", "A": "卷積層與池化層", "B": "根節點與葉節點", "C": "三個門（忘記門、輸入門、輸出門）搭配Cell State", "D": "生成器與判別器", "answer": "C", "explanation": "LSTM透過忘記門、輸入門、輸出門三個門，搭配Cell State決定記憶內容。"}, {"category": "序列與文字(Transformer/RNN/LSTM)", "type": "概念", "question": "LSTM中負責「長期記憶通道」的結構稱為？", "A": "Support Vector", "B": "Hidden Layer", "C": "Cell State", "D": "Latent Space", "answer": "C", "explanation": "Cell State是LSTM中最重要的長期記憶通道。"}, {"category": "序列與文字(Transformer/RNN/LSTM)", "type": "概念", "question": "關於RNN與LSTM的比較，下列敘述何者正確？", "A": "兩者完全相同，沒有差異", "B": "LSTM結構比RNN更簡單", "C": "LSTM改善了梯度消失問題，記憶能力較長期", "D": "RNN的記憶能力優於LSTM", "answer": "C", "explanation": "LSTM改善了RNN的梯度消失問題，具備較長期的記憶能力，但結構較複雜。"}, {"category": "序列與文字(Transformer/RNN/LSTM)", "type": "概念", "question": "Transformer模型最初 category": "影像處理與視覺(ViT/CNN/GCN)", "type": "概念", "question": "ViT是由哪個機構於何時提出？", "A": "Google，2020年", "B": "Meta，2021年", "C": "DeepMind，2018年", "D": "OpenAI，2021年", "answer": "A", "explanation": "ViT由Google於2020年提出。"}, {"category": "影像處理與視覺(ViT/CNN/GCN)", "type": "概念", "question": "CNN(卷積神經網路)主要用來處理哪種資料？", "A": "圖形結構資料，如社交網路", "B": "具備網格結構（Grid）的資料，如影像", "C": "序列資料", "D": "純文字資料", "answer": "B", "explanation": "CNN專門處理具備網格結構的資料，最常見的應用是影像辨識。"}, {"category": "影像處理與視覺(ViT/CNN/GCN)", "type": "概念", "question": "CNN看懂照片的核心三步驟依序為？", "A": "編碼器→潛在空間→解碼器", "B": "卷積層→池化層→全連接層", "C": "Query→Key→Value", "D": "忘記門→輸入門→輸出門", "answer": "B", "explanation": "CNN的核心三步驟為：卷積層（特徵提取）→池化層（降維）→全連接層（分類輸出）。"}, {"category": "影像處理與視覺(ViT/CNN/GCN)", "type": "概念", "question": "CNN中池化層(Pooling Layer)的主要作用為何？", "A": "生成新的圖片", "B": "提取初始特徵", "C": "特徵降維，保留重要特徵並縮小圖片", "D": "做最終分類判斷", "answer": "C", "explanation": "池化層的作用是保留重要特徵，並將圖片尺寸縮小（降維）。"}, {"category": "影像處理與視覺(ViT/CNN/GCN)", "type": "概念", "question": "CNN的核心邏輯可以理解為？", "A": "由整體到局部", "B": "只看圖片邊緣", "C": "完全隨機提取特徵", "D": "由局部到整體", "answer": "D", "explanation": "CNN的核心邏輯是由局部特徵逐步組合成整體判斷。"}, {"category": "影像處理與視覺(ViT/CNN/GCN)", "type": "概念", "question": "圖卷積網路(GCN)主要用來處理哪種資料？", "A": "純文字資料", "B": "圖形結構資料（節點+邊）", "C": "具固定網格結構的影像", "D": "時間序列資料", "answer": "B", "explanation": "GCN用來處理圖形結構資料，也就是節點（Node）與邊（Edge）組成的資料。"}, {"category": "影像處理與視覺(ViT/CNN/GCN)", "type": "概念", "question": "GCN與CNN的核心差異為何？", "A": "GCN處理不規則的圖（Graph），鄰居定義不固定；CNN處理固定網格，鄰居定義固定（上下左右）", "B": "兩者處理的資料完全相同", "C": "CNN可以處理任意圖形結構", "D": "GCN只能用於影像分類", "answer": "A", "explanation": "GCN處理不規則的圖形資料，鄰居定義不固定；CNN處理固定網格資料。"}, {"category": "影像處理與視覺(ViT/CNN/GCN)", "type": "概念", "question": "GCN常見的應用領域不包含下列何者？", "A": "時間序列股價預測", "B": "分子化學與藥物性質預測", "C": "知識圖譜關聯分析", "D": "社交網路好友推薦", "answer": "A", "explanation": "時間序列股價預測通常使用RNN/LSTM等序列模型，並非GCN的常見應用。"}, {"category": "影像處理與視覺(ViT/CNN/GCN)", "type": "情境範例", "question": "使用CNN模型對MNIST手寫數字資料集進行辨識，這是下列哪種資料型態的經典應用範例？", "A": "具網格結構的影像資料", "B": "圖形結構資料", " ": "PCA可以直接生成資料，Autoencoder不行", "C": "兩者都只能處理線性關係", "D": "兩者訓練方式完全相同", "answer": "A", "explanation": "Autoencoder是非線性神經網路、表達能力較強；PCA是線性、透過數學分解。"}, {"category": "基礎特徵與降維(Autoencoder/Seq2Seq)", "type": "概念", "question": "序列對序列自編碼器(Seq2Seq Autoencoder)主要由哪三部分組成？", "A": "根節點、內部節點、葉節點", "B": "忘記門、輸入門、輸出門", "C": "編碼器（Encoder）、特徵向量（Context Vector）、解碼器（Decoder）", "D": "生成器、判別器、損失函數", "answer": "C", "explanation": "Seq2Seq自編碼器由編碼器、特徵向量（Context Vector）與解碼器組成。"}, {"category": "基礎特徵與降維(Autoencoder/Seq2Seq)", "type": "概念", "question": "Seq2Seq自編碼器讓模型「自己複製自己」的好處不包含下列何者？", "A": "適合無監督學習，不需標註資料", "B": "一定能大幅提升監督式學習的標籤準確率", "C": "可處理不同長度的序列", "D": "能自動學習序列特徵，不需人工設計", "answer": "B", "explanation": "Seq2Seq自編碼器本身是無監督學習，並不直接提升監督式學習的標籤準確率。"}, {"category": "基礎特徵與降維(Autoencoder/Seq2Seq)", "type": "情境範例", "question": "工廠想利用感測器蒐集的正常運作訊號訓練一個模型，之後若新資料的「重建誤差」異常偏高，就判定為設備異常，這種做法最常使用？", "A": "自編碼器（Autoencoder）的異常偵測", "B": "Wide & Deep", "C": "Q-Learning", "D": "GAN", "answer": "A", "explanation": "自編碼器常用於異常偵測，透過重建誤差判斷資料是否異常。"}, {"category": "基礎特徵與降維(Autoencoder/Seq2Seq)", "type": "情境範例", "question": "想把長度不一的句子壓縮成固定長度的向量，供後續分類或聚類任務使用，且不需要標註資料，最適合的模型為？", "A": "CNN", "B": "XGBoost", "C": "K-means", "D": "Seq2Seq自編碼器", "answer": "D", "explanation": "Seq2Seq自編碼器能處理不同長度的序列，並產生可用於下游任務的潛在向量。"}, {"category": "基礎特徵與降維(Autoencoder/Seq2Seq)", "type": "情境範例", "question": "資料分析師想對高度相關的特徵進行降維，且該資料存在明顯的非線性關係，此時選用Autoencoder而非PCA的主要原因為？", "A": "PCA無法用於降維", "B": "Autoencoder一定不需要訓練", "C": "Autoencoder計算一定比PCA快", "D": "Autoencoder是非線性模型，表達能力較強", "answer": "D", "explanation": "當資料存在非線性關係時，Autoencoder的非線性表達能力優於線性的PCA。"}, {"category": "其他-梯度/注意力/批次/激活函數", "type": "概念", "question": "梯度(Gradient)在模型訓練中代表的意義為何？", "A": "模型前進的方向與步伐大小", "B": "模型的最終準確率", "C": "資料的標籤數量", "D": "模型的參數個數", "answer": "A", "explanation": "梯度就是模型在學習時的「前進方向與步伐大小」。"}, {"category": "其他-梯度/注意力/批次/激活函數", "type": "概念", "question": "模型訓練時實際前進的方向是？", "A": "梯度方向（最陡峭坡度朝上）", "B": "反梯度方向（最陡峭坡度朝下），使損失函數降到最低", "C": "與梯度完全無關的隨機方向", "D": "固定不變的方向", "answer": "B", function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function loadHistory() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

  const tableEl = document.getElementById("history-table");
  const bodyEl = document.getElementById("history-body");
  bodyEl.innerHTML = "";
  if (history.length === 0) {
    emptyEl.classList.remove("hidden");
    tableEl.classList.add("hidden");
  } else {
    emptyEl.classList.add("hidden");
    tableEl.classList.remove("hidden");
    history.slice().reverse().forEach(h => {
      const tr = document.createElement("tr");
      const pct = Math.round((h.score / h.totalQ) * 100);
      tr.innerHTML = `<td>${h.date}</td><td>${h.score} / ${h.totalQ}</td><td>${pct}%</td>`;
      bodyEl.appendChild(tr);
    });
  }
}

function pickRandomQuestions() {
  const shuffledPool = shuffleArray(QUESTIONS);
  const picked = shuffledPool.slice(0, QUIZ_SIZE);
  // for each picked question, also shuffle its own option order for this session
  return picked.map(q => {
    const letters = ["A","B","C","D"];
    const optionPairs = letters.map(L => ({letter: L, text: q[L], isCorrect: q.answer === L}));
    const shuffledOpts = shuffleArray(optionPairs);
    return {
      category: q.category,
      type: q.type,
      question: q.question,
      explanation: q.explanation,
      options: shuffledOpts // array of {letter(original), text, isCorrect}
    };
  });
}

function showScreen(id) {
  ["screen-start","screen-quiz","screen-result","screen-review"].forEach(s => {
    document.getElementById(s).classList.toggle("hidden", s !== id);
  });
  document.getElementById("screen-review-toggle-wrap").classList.add("hidden");
}

function startQuiz() {
  currentQuiz = pickRandomQuestions();
  currentIndex = 0;
  currentAnswers = [];
  score = 0;
  showScreen("screen-quiz");
  renderQuestion();
}

function renderQuestion() {
  const q = currentQuiz[currentIndex];
  document.getElementById("progress-bar").style.width = ((currentIndex) / QUIZ_SIZE * 100) + "%";
  document.getElementById("q-index").textContent = `第 ${currentIndex + 1} / ${QUIZ_SIZE} 題`;
  document.getElementById("q-category").textContent = `${q.category} ・ ${q.type}`;
  document.getElementById("q-text").textContent = q.question;
  const optWrap = document.getElementById("q-options");
  optWrap.innerHTML = "";
  const displayLetters = ["A","B","C","D"];
  q.options.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.innerHTML = `<span class="letter">${displayLetters[idx]}</span><span>${opt.text}</span>`;
    btn.addEventListener("click", () => selectOption(idx));
    optWrap.appendChild(btn);
  });
  document.getElementById("q-explanation").classList.remove("show");
  document.getElementById("q-explanation").textContent = "";
  document.getElementById("btn-next").disabled = true;
  document.getElementById("btn-next").textContent = (currentIndex === QUIZ_SIZE - 1) ? "查看成績" : "下一題";
}

function selectOption(idx) {
  const q = currentQuiz[currentIndex];
  const optWrap = document.getElementById("q-options");
  const buttons = optWrap.querySelectorAll(".option");
  if (buttons[0].classList.contains("locked")) return; // already answered

  const chosen = q.options[idx];
  const isCorrect = chosen.isCorrect;
  if (isCorrect) score++;

  buttons.forEach((b, i) => {
    b.classList.add("locked");
    if (q.options[i].isCorrect) b.classList.add("correct");
    else if (i === idx) b.classList.add("wrong");
  });

  const expEl = document.getElementById("q-explanation");
  const correctLetterDisplay = ["A","B","C","D"][q.options.findIndex(o => o.isCorrect)];
  expEl.innerHTML = `<b>${isCorrect ? "✓ 答對了！" : "✗ 答錯了。正解：" + correctLetterDisplay}</b><br>${q.explanation}`;
  expEl.classList.add("show");

  document.getElementById("btn-next").disabled = false;

  currentAnswers.push({
    question: q.question,
    category: q.category,
    isCorrect: isCorrect,
    explanation: q.explanation,
    chosenText: chosen.text,
    correctText: q.options.find(o => o.isCorrect).text
  });
}

function nextQuestion() {
  if (currentIndex < QUIZ_SIZE - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  document.getElementById("progress-bar").style.width = "100%";
  const history = loadHistory();
  const record = {
    date: new Date().toLocaleString("zh-TW", {hour12:false}),
    score: score,
    totalQ: QUIZ_SIZE
  };
  history.push(record);
  saveHistory(history);

  showScreen("screen-result");
  document.getElementById("result-score-text").textContent = `${score} / ${QUIZ_SIZE}`;
  const pct = Math.round((score / QUIZ_SIZE) * 100);
  document.getElementById("result-percent").textContent = `正確率 ${pct}%`;

  // category breakdown
  const catMap = {};
  currentAnswers.forEach(a => {
    if (!catMap[a.category]) catMap[a.category] = {correct:0, total:0};
    catMap[a.category].total++;
    if (a.isCorrect) catMap[a.category].correct++;
  });
  const breakdownEl = document.getElementById("cat-breakdown");
  breakdownEl.innerHTML = "<div><b>分類別表現</b><span></span></div>" +
    Object.keys(catMap).map(c => `<div><span>${c}</span><span>${catMap[c].correct} / ${catMap[c].total}</span></div>`).join("");

  document.getElementById("screen-review-toggle-wrap").classList.remove("hidden");
  renderHistoryStats();
}

function renderReview() {
  const listEl = document.getElementById("review-list");
  listEl.innerHTML = "";
  currentAnswers.forEach((a, i) => {
    const div = document.createElement("div");
    div.className = "review-item " + (a.isCorrect ? "ok" : "bad");
    div.innerHTML = `
      <div class="q">${i+1}. ${a.question}</div>
      <div class="ans-line">你的答案：${a.chosenText} ${a.isCorrect ? "（正確）" : "（錯誤，正解：" + a.correctText + "）"}</div>
      <div class="exp">${a.explanation}</div>
    `;
    listEl.appendChild(div);
  });
}

document.getElementById("btn-start").addEventListener("click", startQuiz);
document.getElementById("btn-next").addEventListener("click", nextQuestion);
document.getElementById("btn-retry").addEventListener("click", startQuiz);
document.getElementById("btn-back-home").addEventListener("click", () => { showScreen("screen-start"); renderHistoryStats(); });
document.getElementById("btn-show-review").addEventListener("click", () => { renderReview(); showScreen("screen-review"); });
document.getElementById("btn-review-close").addEventListener("click", () => { showScreen("screen-result"); document.getElementById("screen-review-toggle-wrap").classList.remove("hidden"); });
document.getElementById("btn-clear-history").addEventListener("click", () => {
  if (confirm("確定要清除所有歷史測驗紀錄嗎？")) {
    localStorage.removeItem(STORAGE_KEY);
    renderHistoryStats();
  }
});

renderHistoryStats();
</script>
