<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資料處理與分析 情境題練習</title>
<style>
  :root{
    --ink:#f6f8fb; --ink2:#eef1f7; --panel:#ffffff; --panel2:#f1f4f9;
    --line:#e2e6ed; --muted:#6b7688; --text:#1a2230; --dim:#48566b;
    --c1:#0d9488; --c2:#7c3aed; --c3:#db2777;
    --ok:#16a34a; --okbg:#dcfce7;
    --no:#dc2626; --nobg:#fee2e2;
    --grad:linear-gradient(90deg,#0d9488 0%,#7c3aed 55%,#db2777 100%);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:
      radial-gradient(1200px 600px at 80% -10%, rgba(124,108,255,.10), transparent 60%),
      radial-gradient(900px 500px at -5% 10%, rgba(56,225,200,.08), transparent 55%),
      var(--ink);
    color:var(--text);
    font-family:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    line-height:1.6;
  }
  .mono{font-family:"JetBrains Mono","SFMono-Regular",ui-monospace,Menlo,Consolas,monospace}
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 96px}

  header{margin-bottom:22px}
  .eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--c1);
    font-family:"JetBrains Mono",ui-monospace,monospace;margin:0 0 10px}
  h1{font-size:clamp(26px,5vw,38px);line-height:1.12;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
  h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:14px;margin:0}

  .dash{display:flex;align-items:center;gap:16px;margin:20px 0 8px;flex-wrap:wrap}
  .signal{flex:1;min-width:200px}
  .signal .track{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
  .signal .fill{height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
  .signal .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);
    margin-top:7px;font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.05em}
  .score{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;color:var(--dim)}
  .score b{color:var(--c1)}
  .score .sep{color:var(--line);margin:0 6px}
  .score .wrong{color:var(--c3)}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
  .btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--dim);
    font-size:13px;padding:8px 14px;border-radius:9px;cursor:pointer;transition:.18s;
    font-family:inherit;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--c2);color:var(--text);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{background:transparent}

  .card{background:linear-gradient(180deg,var(--panel),var(--ink2));
    border:1px solid var(--line);border-radius:16px;padding:22px 22px 20px;margin:16px 0;
    box-shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 18px 40px -30px rgba(15,23,42,.10)}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .qnum{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--ink);
    background:var(--c1);padding:3px 9px;border-radius:6px;font-weight:700}
  .qtext{font-size:16px;line-height:1.72;color:var(--text);margin:0 0 16px}

  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    background:var(--panel2);border:1px solid var(--line);border-radius:11px;
    padding:13px 14px;cursor:pointer;transition:.16s;color:var(--dim);font-size:14.5px;line-height:1.6;font-family:inherit}
  .opt:hover:not(.locked){border-color:var(--c2);background:#f4f1fd;color:var(--text)}
  .opt .key{flex:none;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);
    display:grid;place-items:center;font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:13px;font-weight:700;color:var(--muted);transition:.16s}
  .opt:hover:not(.locked) .key{border-color:var(--c2);color:var(--c1)}
  .opt.locked{cursor:default}
  .opt.correct{border-color:var(--ok);background:var(--okbg);color:var(--text)}
  .opt.correct .key{background:var(--ok);color:var(--ink);border-color:var(--ok)}
  .opt.wrong{border-color:var(--no);background:var(--nobg);color:var(--text)}
  .opt.wrong .key{background:var(--no);color:#fff;border-color:var(--no)}
  .opt.dim{opacity:.5}

  .explain{margin-top:14px;border-left:3px solid var(--c2);background:rgba(124,108,255,.07);
    border-radius:0 10px 10px 0;padding:12px 15px;font-size:14px;color:var(--dim);
    max-height:0;overflow:hidden;opacity:0;transition:.35s ease}
  .explain.show{max-height:300px;opacity:1;margin-top:14px}
  .explain .lab{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;
    letter-spacing:.14em;color:var(--c2);text-transform:uppercase;display:block;margin-bottom:5px}
  .explain b{color:var(--c1)}

  .result{display:none;background:linear-gradient(180deg,var(--panel),var(--ink2));
    border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center;margin:18px 0}
  .result.show{display:block}
  .result .big{font-size:52px;font-weight:800;line-height:1;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .result .cap{color:var(--muted);font-size:13px;margin-top:6px;font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.1em}
  .result .msg{margin:14px 0 18px;color:var(--dim)}

  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px;
    font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.04em}

  @media (max-width:560px){
    .wrap{padding:20px 14px 90px}
    .qtext{font-size:15px}
    .opt{font-size:14px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  .opt:focus-visible,.btn:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">初級 AI 應用規劃師 · 情境練習</p>
    <h1>資料處理與分析 <span class="g">情境題</span></h1>
    <p class="sub">30 題跨產業情境選擇題 · 涵蓋編碼與標準化、EDA、四大分析、對數轉換、SMOTE、雷達圖與自動特徵工程</p>

    <div class="dash">
      <div class="signal">
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="lab"><span id="progLab">已作答 0 / 30</span><span id="pct">0%</span></div>
      </div>
      <div class="score">
        正確 <b id="sCorrect">0</b><span class="sep">/</span>錯誤 <span class="wrong" id="sWrong">0</span>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn" id="revealBtn">顯示所有解析</button>
      <button class="btn ghost" id="shuffleBtn">打亂題序</button>
      <button class="btn ghost" id="resetBtn">重新開始</button>
    </div>
  </header>

  <div id="quiz"></div>

  <div class="result" id="result">
    <div class="big" id="rBig">0%</div>
    <div class="cap" id="rCap">SCORE</div>
    <p class="msg" id="rMsg"></p>
    <button class="btn" id="againBtn">再練一次</button>
  </div>

  <footer>學習來源：Notion「資料處理與分析筆記」· 題型仿 115 年第一次初級 AI 應用規劃師</footer>
</div>

<script>
const DATA = [{"id": 1, "q": "某電商平台要將商品的「顏色」欄位（紅、藍、綠，彼此無大小順序）轉為模型可用的數值特徵，且不希望模型誤以為類別間存在大小關係。下列何種編碼方式最適合？", "opts": ["序數編碼（Ordinal Encoding），依字母順序給 0、1、2", "布林轉換，把顏色一律轉為 True/False", "數值標準化（Z-score），把顏色轉為標準分數", "One-Hot 編碼，將每個類別展開為獨立的 0/1 欄位"], "ans": "D", "topic": "One-Hot 編碼", "exp": "無序類別型（如顏色）應用 One-Hot 展開成獨立 0/1 欄位，避免模型誤讀出大小順序。"}, {"id": 2, "q": "某問卷平台的「滿意度」欄位為「低、中、高、非常高」，彼此有明確的高低順序。團隊希望編碼後能保留此順序資訊。下列何種做法最恰當？", "opts": ["布林轉換，只分成滿意與不滿意兩類", "Min-Max 標準化，把文字直接壓到 0~1", "序數編碼（Ordinal Encoding），依序給 0、1、2、3", "One-Hot 編碼，讓四個等級各自成為獨立欄位"], "ans": "C", "topic": "序數編碼", "exp": "有序類別（低→非常高）宜用序數編碼，依序給整數以保留次序資訊。"}, {"id": 3, "q": "某會員系統的「是否訂閱電子報」欄位只有 Yes / No 兩種值。工程師要把它轉成最精簡的數值特徵。下列何種轉換最直接合適？", "opts": ["One-Hot 編碼，展開成兩個欄位", "序數編碼，給 0、1、2、3 四個等級", "布林轉換，將 Yes 對應 1、No 對應 0", "對數轉換（Log Transform）"], "ans": "C", "topic": "布林轉換", "exp": "二元欄位（是/否）用布林轉換映射為 1/0 最為精簡直接。"}, {"id": 4, "q": "某資料團隊要建立 KNN 與 SVM 模型，資料中「年齡」與「年收入」單位與尺度差異極大。為避免尺度大的特徵主導距離計算，最應優先進行下列何種前處理？", "opts": ["One-Hot 編碼", "對數逆轉換", "數值標準化（如 Min-Max 或 Z-score）", "布林轉換"], "ans": "C", "topic": "數值標準化", "exp": "KNN、SVM 對數值尺度敏感，不同單位特徵應先做標準化以對齊尺度。"}, {"id": 5, "q": "某分析師以 XGBoost（樹狀模型）建模，猶豫是否要對所有數值特徵先做標準化。就樹狀模型的特性而言，下列敘述何者最正確？", "opts": ["樹狀模型與 KNN 一樣高度依賴標準化", "標準化會使樹狀模型完全無法訓練", "樹狀模型（決策樹、隨機森林、XGBoost）通常不需要標準化", "必須先標準化，否則決策樹無法分裂"], "ans": "C", "topic": "標準化適用性", "exp": "樹狀模型依門檻切分、不看數值尺度，通常不需標準化；KNN/SVM/神經網路才需要。"}, {"id": 6, "q": "某老師想用 Z-score 說明小明成績。全班平均 70 分、標準差 10 分，小明考 85 分。小明的 Z-score 及其意義為何？", "opts": ["z = -1.5，代表低於平均", "z = 0.85，代表落在第 85 百分位", "z = 1.5，代表比平均高 1.5 個標準差", "z = 15，代表比平均高 15 分即高 15 個單位"], "ans": "C", "topic": "Z-score", "exp": "Z-score=（值−平均）/標準差=(85−70)/10=1.5，代表高於平均 1.5 個標準差。"}, {"id": 7, "q": "某神經網路要求輸入特徵落在 0~1 之間。團隊希望將原始數值線性壓縮到此固定區間，最小值對應 0、最大值對應 1。下列何種標準化方式最符合？", "opts": ["序數編碼", "Min-Max 標準化", "對數轉換", "Z-score 標準化"], "ans": "B", "topic": "Min-Max", "exp": "Min-Max 將數值線性縮放到固定的 0~1 區間，最小值為 0、最大值為 1。"}, {"id": 8, "q": "某資料科學團隊拿到一批全新資料，主管要求在建模前「先看看資料長什麼樣、了解結構與分佈、找出異常值與變數關係」。此階段最符合下列何者？", "opts": ["探索性資料分析（EDA）", "模型壓縮（Quantization）", "超參數調校（Hyperparameter Tuning）", "模型部署（Deployment)"], "ans": "A", "topic": "EDA", "exp": "EDA 是資料分析第一步，目的在理解資料結構、分佈、異常與關係，而非直接做預測。"}, {"id": 9, "q": "關於探索性資料分析（EDA），下列敘述何者最正確？", "opts": ["EDA 的主要目的是產生對未來的預測值", "EDA 只能處理影像資料", "EDA 一定要在模型訓練完成後才進行", "EDA 目的是理解資料本身，而非直接做預測"], "ans": "D", "topic": "EDA", "exp": "EDA 著重「理解資料」（結構、分佈、品質、關係），不是做預測；預測屬預測性分析。"}, {"id": 10, "q": "某零售公司月報寫著：「本月營收 500 萬元，較上月成長 8%。」此種描述過去已發生事實、回答『發生了什麼』的分析，屬於下列何者？", "opts": ["探索性分析", "診斷性分析", "預測性分析", "敘述性分析（Descriptive）"], "ans": "D", "topic": "敘述性分析", "exp": "敘述性分析回答『發生了什麼』，以報表、KPI 描述過去已發生事件。"}, {"id": 11, "q": "某電商團隊在資料中「發現年輕客群偏好使用行動支付」這類先前未知的規律與分群。此種回答『資料中有哪些模式』的分析，屬於下列何者？", "opts": ["診斷性分析", "探索性分析（Exploratory）", "敘述性分析", "預測性分析"], "ans": "B", "topic": "探索性分析", "exp": "探索性分析回答『有哪些模式』，用視覺化、分群、相關分析找出未知規律。"}, {"id": 12, "q": "某公司發現營收下降，分析後得出「因為廣告投放減少 30%」的原因結論。此種回答『為什麼會發生』的分析，屬於下列何者？", "opts": ["預測性分析", "診斷性分析（Diagnostic）", "敘述性分析", "探索性分析"], "ans": "B", "topic": "診斷性分析", "exp": "診斷性分析回答『為什麼發生』，用根因分析、回歸、假設檢定找出原因。"}, {"id": 13, "q": "某財務團隊以歷史資料推估「下個月營收約為 540 萬元」。此種回答『未來可能發生什麼』的分析，屬於下列何者？", "opts": ["敘述性分析", "預測性分析（Predictive）", "診斷性分析", "探索性分析"], "ans": "B", "topic": "預測性分析", "exp": "預測性分析回答『未來會發生什麼』，用機器學習、時間序列等預測未來。"}, {"id": 14, "q": "iPAS 口訣「看現況、找規律、查原因、預未來」對應四種分析方法。下列配對何者完全正確？", "opts": ["看現況=探索、找規律=敘述、查原因=預測、預未來=診斷", "看現況=敘述、找規律=探索、查原因=診斷、預未來=預測", "看現況=診斷、找規律=預測、查原因=敘述、預未來=探索", "看現況=預測、找規律=診斷、查原因=探索、預未來=敘述"], "ans": "B", "topic": "四大分析", "exp": "看現況→敘述、找規律→探索、查原因→診斷、預未來→預測。"}, {"id": 15, "q": "以看醫生比喻四種分析：量身高體重血壓＝敘述、找出哪裡不對勁＝探索、判定因細菌感染而發燒＝診斷。那麼「告訴你若不吃藥三天後可能加重」對應下列何者？", "opts": ["預測性分析", "探索性分析", "敘述性分析", "診斷性分析"], "ans": "A", "topic": "預測性分析", "exp": "推估『不吃藥三天後病情可能加重』是對未來的推估，屬預測性分析。"}, {"id": 16, "q": "某房價資料呈現嚴重右偏，且存在少數極高價格拉大整體範圍。分析師想把分佈拉近常態、縮小範圍並降低極端值影響。下列何種轉換最適合？", "opts": ["布林轉換", "One-Hot 編碼", "序數編碼", "對數轉換（Log Transform）"], "ans": "D", "topic": "對數轉換", "exp": "對數轉換可把右偏分佈拉近常態、壓縮數值範圍並削弱極端值影響。"}, {"id": 17, "q": "團隊決定對某欄位做對數轉換。關於對數轉換的使用限制，下列敘述何者最正確？", "opts": ["轉換後不需要逆轉換即可直接解讀原始金額", "資料不能有 0 或負數，且結果需記得逆轉換還原", "對數轉換會把加法關係變成乘法關係", "資料可以包含 0 與負數，對數皆有定義"], "ans": "B", "topic": "對數轉換", "exp": "對數要求資料無 0 或負數，且分析後要逆轉換還原；它把乘法關係轉為加法關係。"}, {"id": 18, "q": "某銀行詐欺偵測資料中，詐欺樣本比例極低，模型偏向全部預測為「正常」。團隊想用一種「合成少數類別新樣本」的技術來平衡資料。此技術最可能是下列何者？", "opts": ["對數轉換", "SMOTE（合成少數類別過採樣技術）", "Z-score 標準化", "One-Hot 編碼"], "ans": "B", "topic": "SMOTE", "exp": "SMOTE 用於解決資料不平衡，透過合成少數類別新樣本使資料達到平衡。"}, {"id": 19, "q": "關於 SMOTE 與傳統隨機過採樣（Random Oversampling）的差異，下列敘述何者最正確？", "opts": ["SMOTE 會直接刪除多數類別樣本以平衡", "SMOTE 專門用來標準化數值尺度", "SMOTE 依少數類別鄰近樣本以插值（Interpolation）合成新樣本，而非複製", "SMOTE 只是單純複製少數類別原始樣本"], "ans": "C", "topic": "SMOTE", "exp": "SMOTE 核心是找 K 近鄰後插值合成新樣本，而非複製原資料，藉此降低過擬合。"}, {"id": 20, "q": "某團隊使用 SMOTE 後模型在少數類別表現提升，但主管提醒仍有風險。下列何者屬於 SMOTE 的潛在缺點？", "opts": ["會使多數類別完全消失", "一定會造成資料洩漏，無法避免", "可能引入雜訊、放大離群值影響，或讓不同類別邊界模糊", "只能用於樹狀模型，無法搭配 SVM"], "ans": "C", "topic": "SMOTE 缺點", "exp": "SMOTE 可能產生不合理樣本、放大離群值並使類別邊界模糊。"}, {"id": 21, "q": "資料科學家準備對不平衡資料套用 SMOTE。為避免資料洩漏（Data Leakage），下列做法何者最正確？", "opts": ["先對全部資料 SMOTE，再切分訓練與測試集", "先切分資料，只對訓練集套用 SMOTE，測試集維持原始分佈", "對測試集做 SMOTE、訓練集維持原狀", "同時對訓練集與測試集都做 SMOTE"], "ans": "B", "topic": "SMOTE/資料洩漏", "exp": "SMOTE 通常只對訓練集套用；若先合成再切分會讓測試資訊外洩，造成資料洩漏。"}, {"id": 22, "q": "某遊戲公司想把每位玩家的多項能力指標（攻擊、防禦、速度、續航等）畫在同一張圖上，直觀呈現「能力輪廓」以利比較。下列何種視覺化最適合？", "opts": ["雷達圖（Radar / Spider Chart）", "散佈圖（兩變數關係）", "長條圖（單一類別高低）", "折線圖（趨勢隨時間變化）"], "ans": "A", "topic": "雷達圖", "exp": "雷達圖把多個指標畫在一個圓上，形成能力輪廓，適合多維指標的整體比較。"}, {"id": 23, "q": "下列關於雷達圖應用領域的敘述，何者最貼切？", "opts": ["教育可用雷達圖做學生能力分析、HR 做人才評估、醫療呈現健康指標", "雷達圖無法用於客戶或玩家行為分析", "雷達圖只能用於財務報表，無法用於能力分析", "雷達圖僅適合呈現單一數值的大小"], "ans": "A", "topic": "雷達圖應用", "exp": "雷達圖廣泛用於教育（能力分析）、HR（人才評估）、醫療（健康指標）、電商與遊戲。"}, {"id": 24, "q": "某風控團隊想減少人工反覆嘗試欄位組合的時間，讓系統自動把「收入、負債、交易頻率」組合出比單一欄位更有預測力的新特徵。此技術最可能是下列何者？", "opts": ["自動特徵工程（Automated Feature Engineering）", "資料標準化", "資料視覺化", "模型壓縮"], "ans": "A", "topic": "自動特徵工程", "exp": "自動特徵工程自動把原始欄位交叉組合成更好學的訊號，減少人工試欄位的時間。"}, {"id": 25, "q": "關於自動特徵工程的常見方法，下列何者最符合？", "opts": ["單純刪除所有原始欄位", "只做數值標準化，不產生新欄位", "僅將類別欄位轉為 One-Hot", "以交叉組合、統計聚合、時間窗特徵等，把局部訊號轉為可學訊號"], "ans": "D", "topic": "自動特徵工程", "exp": "自動特徵工程常用交叉組合、統計聚合、時間窗特徵，把原始欄位變成更易學的新特徵。"}, {"id": 26, "q": "某電信流失預測資料同時有：類別欄位「資費方案」（無序）、資料嚴重不平衡（流失者稀少）。下列前處理配對何者最恰當？", "opts": ["資費方案用 One-Hot、對不平衡用 SMOTE", "資費方案用對數轉換、對不平衡用序數編碼", "資費方案用 Z-score、對不平衡用 One-Hot", "資費方案用布林轉換、對不平衡用 Min-Max"], "ans": "A", "topic": "綜合前處理", "exp": "無序類別（資費方案）用 One-Hot；類別不平衡用 SMOTE 合成少數樣本。"}, {"id": 27, "q": "某醫療團隊的專案敘述為：「找出過去一年再入院病患資料中，哪些特徵組合經常同時出現的未知模式。」此任務最符合哪一種分析方法？", "opts": ["診斷性分析", "敘述性分析", "預測性分析", "探索性分析"], "ans": "D", "topic": "探索性分析", "exp": "『找出未知的特徵組合模式』是探索『有哪些模式』，屬探索性分析。"}, {"id": 28, "q": "某薪資資料呈現右偏、含極端高薪，且後續要餵入對尺度敏感的神經網路。下列處理順序敘述何者最合理？", "opts": ["可先以對數轉換緩解右偏與極端值，再做數值標準化對齊尺度", "樹狀模型與神經網路都不需任何前處理", "只需序數編碼即可解決偏態", "只做 One-Hot 即可，不需處理偏態與尺度"], "ans": "A", "topic": "對數＋標準化", "exp": "右偏含極端值可先對數轉換緩解，再標準化對齊尺度以配合神經網路。"}, {"id": 29, "q": "某電商同時提出兩個問題：一為「為什麼上季客訴突然增加？」，二為「下季客訴量預估是多少？」。這兩題分別對應哪種分析？", "opts": ["皆為敘述性分析", "皆為探索性分析", "前者預測性、後者診斷性", "前者診斷性、後者預測性"], "ans": "D", "topic": "診斷 vs 預測", "exp": "『為什麼發生』屬診斷性；『未來預估多少』屬預測性。"}, {"id": 30, "q": "某資料集包含三個欄位：教育程度（小學/國中/高中/大學，有序）、血型（A/B/O/AB，無序）、是否已婚（是/否）。下列編碼配對何者全部正確？", "opts": ["教育程度 序數；血型 One-Hot；是否已婚 布林", "教育程度 布林；血型 序數；是否已婚 One-Hot", "教育程度 One-Hot；血型 序數；是否已婚 Z-score", "三者皆用 Z-score 標準化"], "ans": "A", "topic": "編碼統整", "exp": "有序（教育）用序數、無序（血型）用 One-Hot、二元（婚否）用布林轉換。"}];
const LETTERS=['A','B','C','D'];
let order = DATA.map((_,i)=>i);
let answered = {};
const $ = s=>document.querySelector(s);

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function render(){
  const quiz = $('#quiz'); quiz.innerHTML='';
  order.forEach((oi,pos)=>{
    const q = DATA[oi];
    const card = document.createElement('div');
    card.className='card'; card.dataset.oi=oi;
    const chosen = answered[oi];
    card.innerHTML = `
      <div class="qhead">
        <span class="qnum">第 ${String(pos+1).padStart(2,'0')} 題</span>
      </div>
      <p class="qtext">${q.q}</p>
      <div class="opts">
        ${q.opts.map((o,k)=>{
          const L=LETTERS[k];
          return `<button class="opt" data-l="${L}" role="button">
            <span class="key">${L}</span><span>${o}</span></button>`;
        }).join('')}
      </div>
      <div class="explain" id="exp-${oi}">
        <span class="lab">解析 · 正解 ${q.ans} · 觀念：${q.topic}</span>${q.exp}
      </div>`;
    quiz.appendChild(card);
    if(chosen) applyLock(card, q, chosen);
    card.querySelectorAll('.opt').forEach(btn=>{
      btn.addEventListener('click',()=>choose(oi,q,card,btn.dataset.l));
    });
  });
  updateDash();
}

function applyLock(card,q,chosen){
  card.querySelectorAll('.opt').forEach(b=>{
    b.classList.add('locked');
    const L=b.dataset.l;
    if(L===q.ans) b.classList.add('correct');
    else if(L===chosen) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  $('#exp-'+card.dataset.oi).classList.add('show');
}

function choose(oi,q,card,L){
  if(answered[oi]) return;
  answered[oi]=L;
  applyLock(card,q,L);
  updateDash();
  if(Object.keys(answered).length===DATA.length) finish();
}

function updateDash(){
  const n=Object.keys(answered).length;
  let correct=0;
  for(const k in answered){ if(answered[k]===DATA[k].ans) correct++; }
  const wrong=n-correct;
  const pct=Math.round(n/DATA.length*100);
  $('#fill').style.width=pct+'%';
  $('#progLab').textContent=`已作答 ${n} / ${DATA.length}`;
  $('#pct').textContent=pct+'%';
  $('#sCorrect').textContent=correct;
  $('#sWrong').textContent=wrong;
}

function finish(){
  let correct=0;
  for(const k in answered){ if(answered[k]===DATA[k].ans) correct++; }
  const pct=Math.round(correct/DATA.length*100);
  $('#rBig').textContent=pct+'%';
  $('#rMsg').textContent=`答對 ${correct} 題，共 ${DATA.length} 題。`+
    (pct>=80?' 掌握得很扎實，前處理方法與分析層次都分得清楚。':
     pct>=60?' 基礎穩固，再留意易混淆處（如四大分析的診斷 vs 預測、One-Hot vs 序數）。':
     ' 建議回頭複習編碼與標準化、四大分析方法與 SMOTE 的核心定義與適用時機。');
  const r=$('#result'); r.classList.add('show');
  r.scrollIntoView({behavior:'smooth',block:'center'});
}

$('#revealBtn').addEventListener('click',()=>{
  order.forEach(oi=>{
    const q=DATA[oi];
    const card=document.querySelector(`.card[data-oi="${oi}"]`);
    if(!answered[oi]){
      card.querySelectorAll('.opt').forEach(b=>{
        b.classList.add('locked');
        if(b.dataset.l===q.ans) b.classList.add('correct'); else b.classList.add('dim');
      });
    }
    $('#exp-'+oi).classList.add('show');
  });
});
$('#shuffleBtn').addEventListener('click',()=>{ shuffle(order); answered={}; $('#result').classList.remove('show'); render(); window.scrollTo({top:0,behavior:'smooth'}); });
$('#resetBtn').addEventListener('click',reset);
$('#againBtn').addEventListener('click',reset);
function reset(){ order=DATA.map((_,i)=>i); answered={}; $('#result').classList.remove('show'); render(); window.scrollTo({top:0,behavior:'smooth'}); }

render();
</script>
</body>
</html>
