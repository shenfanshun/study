<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI筆記隨機測驗</title>
<style>
  :root{
    --bg:#f6f8fb;
    --card:#ffffff;
    --card2:#f1f4f9;
    --accent:#0d9488;
    --accent2:#2563eb;
    --text:#1a2230;
    --sub:#6b7688;
    --good:#16a34a;
    --bad:#dc2626;
    --border:#e2e6ed;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:linear-gradient(160deg,#f8fafc,#eef1f7 60%,#f8fafc);
    color:var(--text);
    min-height:100vh;
  }
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px;}
  header.top{
    text-align:center;
    padding:32px 16px 8px;
  }
  header.top h1{
    font-size:1.7rem;
    margin:0 0 6px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header.top p{color:var(--sub);margin:0;font-size:0.92rem;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:16px;
    margin-top:24px;
  }
  .topic-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    position:relative;
    overflow:hidden;
  }
  .topic-card:hover{
    transform:translateY(-3px);
    border-color:var(--accent);
    background:var(--card2);
  }
  .topic-card .idx{
    font-size:0.72rem;
    color:var(--accent);
    font-weight:600;
    letter-spacing:.05em;
  }
  .topic-card h3{
    margin:8px 0 10px;
    font-size:1.05rem;
    line-height:1.4;
  }
  .topic-card .meta{
    font-size:0.8rem;
    color:var(--sub);
    display:flex;
    justify-content:space-between;
  }
  .topic-card .best{
    margin-top:10px;
    font-size:0.78rem;
    color:var(--good);
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:24px;
  }

  .quiz-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:10px;
  }
  .quiz-header h2{margin:0;font-size:1.15rem;}
  .backbtn{
    background:none;
    border:1px solid var(--border);
    color:var(--sub);
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:0.85rem;
  }
  .backbtn:hover{border-color:var(--accent);color:var(--text);}

  .progress-bar{
    height:6px;
    background:var(--card2);
    border-radius:3px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .25s ease;
  }

  .qnum{
    font-size:0.8rem;
    color:var(--accent);
    font-weight:600;
    margin-bottom:8px;
  }
  .qtype{
    display:inline-block;
    font-size:0.7rem;
    padding:2px 8px;
    border-radius:20px;
    margin-left:8px;
    background:rgba(37,99,235,0.15);
    color:var(--accent2);
    vertical-align:middle;
  }
  .qtext{
    font-size:1.08rem;
    line-height:1.6;
    margin:0 0 20px;
  }
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    text-align:left;
    background:var(--card2);
    border:1px solid var(--border);
    color:var(--text);
    padding:13px 16px;
    border-radius:10px;
    cursor:pointer;
    font-size:0.96rem;
    line-height:1.5;
    display:flex;
    gap:10px;
    transition:border-color .12s ease, background .12s ease;
  }
  .opt .tag{
    flex-shrink:0;
    width:22px;height:22px;
    border-radius:50%;
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:0.75rem;
    color:var(--sub);
  }
  .opt:hover{border-color:var(--accent2);}
  .opt.selected{border-color:var(--accent2);background:rgba(37,99,235,0.1);}
  .opt.selected .tag{border-color:var(--accent2);color:var(--accent2);}
  .opt.correct{border-color:var(--good);background:rgba(22,163,74,0.12);}
  .opt.correct .tag{border-color:var(--good);color:var(--good);background:rgba(22,163,74,0.15);}
  .opt.wrong{border-color:var(--bad);background:rgba(220,38,38,0.12);}
  .opt.wrong .tag{border-color:var(--bad);color:var(--bad);background:rgba(220,38,38,0.15);}
  .opt.disabled{cursor:default;}

  .nav-row{
    display:flex;
    justify-content:space-between;
    margin-top:22px;
    gap:10px;
  }
  .btn{
    border:none;
    padding:11px 22px;
    border-radius:10px;
    font-size:0.95rem;
    cursor:pointer;
    font-weight:600;
  }
  .btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#ffffff;}
  .btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-ghost{background:none;border:1px solid var(--border);color:var(--text);}
  .btn-ghost:hover{border-color:var(--accent);}

  .result-score{
    text-align:center;
    padding:20px 0 10px;
  }
  .result-score .num{
    font-size:3rem;
    font-weight:700;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .result-score .lbl{color:var(--sub);font-size:0.9rem;}
  .review-item{
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    margin-top:14px;
  }
  .review-item .q{font-size:0.95rem;margin-bottom:10px;line-height:1.55;}
  .review-item .row{
    font-size:0.86rem;
    padding:6px 10px;
    border-radius:8px;
    margin-bottom:6px;
  }
  .review-item .row.correct{background:rgba(22,163,74,0.12);color:#15803d;}
  .review-item .row.wrong{background:rgba(220,38,38,0.12);color:#b91c1c;}
  .icon-ok{color:var(--good);}
  .icon-bad{color:var(--bad);}

  footer.note{
    text-align:center;
    color:var(--sub);
    font-size:0.78rem;
    margin-top:36px;
  }
  .actions-row{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap;}

  @media (max-width:520px){
    header.top h1{font-size:1.35rem;}
    .card{padding:18px;}
    .qtext{font-size:1rem;}
  }
</style>
</head>

<script>
const TOPICS = JSON.parse(document.getElementById('quiz-data').textContent);
const QUIZ_LEN = 10;

function safeGet(key){
  try { return localStorage.getItem(key); } catch(e){ return null; }
}
function safeSet(key, val){
  try { localStorage.setItem(key, val); } catch(e){ /* ignore, storage unavailable */ }
}

let state = {
  view: 'home',        // home | quiz | result
  topicIdx: null,
  questions: [],        // the 10 randomly picked questions for this run
  current: 0,
  answers: [],           // selected option index per question, null if unanswered
  locked: [],             // whether question has been answered/locked
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function pickQuestions(topic){
  return shuffle(topic.questions).slice(0, QUIZ_LEN);
}

function startQuiz(topicIdx){
  const topic = TOPICS[topicIdx];
  state.view = 'quiz';
  state.topicIdx = topicIdx;
  state.questions = pickQuestions(topic);
  state.current = 0;
  state.answers = new Array(QUIZ_LEN).fill(null);
  state.locked = new Array(QUIZ_LEN).fill(false);
  render();
}

function goHome(){
  state.view='home';
  state.topicIdx=null;
  render();
}

function selectOption(qi, oi){
  if(state.locked[qi]) return;
  state.answers[qi] = oi;
  state.locked[qi] = true;
  render();
}

function nextQuestion(){
  if(state.current < state.questions.length-1){
    state.current++;
    render();
  } else {
    state.view = 'result';
    render();
  }
}

function prevQuestion(){
  if(state.current>0){
    state.current--;
    render();
  }
}

function retakeSameTopic(){
  startQuiz(state.topicIdx);
}

function el(tag, attrs, ...children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k==='html') e.innerHTML = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c=>{
    if(c===null||c===undefined) return;
    if(typeof c==='string'||typeof c==='number') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

function renderHome(){
  const wrap = el('div');
  wrap.appendChild(el('header',{class:'top'},
    el('h1',null,'📚 AI筆記隨機測驗'),
    el('p',null,'選擇一個主題開始測驗，每次從題庫中隨機抽出 10 題（共 12 個主題，每主題 50 題）')
  ));
  const grid = el('div',{class:'grid'});
  TOPICS.forEach((t,i)=>{
    const scenarioCount = t.questions.filter(q=>q.type==='scenario').length;
    const best = safeGet('quiz_best_'+t.id);
    const card = el('div',{class:'topic-card', onclick:()=>startQuiz(i)},
      el('div',{class:'idx'}, 'TOPIC ' + String(i+1).padStart(2,'0')),
      el('h3',null, t.title),
      el('div',{class:'meta'},
        el('span',null, '題庫 '+t.questions.length+' 題'),
        el('span',null, '情境題 '+scenarioCount+' 題')
      ),
      best ? el('div',{class:'best'}, '🏆 最佳成績：'+best+' / '+QUIZ_LEN) : el('div',{class:'best'},null)
    );
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  wrap.appendChild(el('footer',{class:'note'}, '每次測驗題目與選項順序皆為隨機抽取，可重複測驗直到熟悉為止。'));
  return wrap;
}

function renderQuiz(){
  const topic = TOPICS[state.topicIdx];
  const qi = state.current;
  const q = state.questions[qi];
  const wrap = el('div',{class:'card'});

  wrap.appendChild(el('div',{class:'quiz-header'},
    el('h2',null, topic.title),
    el('button',{class:'backbtn', onclick:goHome}, '← 返回主題選擇')
  ));

  const pct = Math.round(((qi)/state.questions.length)*100);
  wrap.appendChild(el('div',{class:'progress-bar'},
    el('div',{class:'progress-fill', style:'width:'+pct+'%'})
  ));

  const qnumLine = el('div',{class:'qnum'},
    '第 '+(qi+1)+' / '+state.questions.length+' 題',
    q.type==='scenario' ? el('span',{class:'qtype'},'情境題') : el('span',{class:'qtype'},'知識題')
  );
  wrap.appendChild(qnumLine);
  wrap.appendChild(el('div',{class:'qtext'}, q.q));

  const optsWrap = el('div',{class:'options'});
  const optOrder = q._order || (q._order = shuffle([0,1,2,3]));
  const locked = state.locked[qi];
  const chosen = state.answers[qi];

  optOrder.forEach((origIdx, displayIdx)=>{
    const label = String.fromCharCode(65+displayIdx);
    let cls = 'opt';
    if(locked){
      cls += ' disabled';
      if(origIdx === q.answer) cls += ' correct';
      else if(origIdx === chosen) cls += ' wrong';
      if(origIdx === chosen && chosen!==q.answer) {} // already wrong class
    } else if(chosen===origIdx){
      cls += ' selected';
    }
    const optEl = el('div',{class:cls, onclick: ()=>selectOption(qi, origIdx)},
      el('div',{class:'tag'}, label),
      el('div',null, q.options[origIdx])
    );
    optsWrap.appendChild(optEl);
  });
  wrap.appendChild(optsWrap);

  const navRow = el('div',{class:'nav-row'});
  const prevBtn = el('button',{class:'btn btn-ghost', onclick:prevQuestion}, '上一題');
  if(qi===0) prevBtn.disabled = true;
  const nextLabel = qi===state.questions.length-1 ? '完成測驗' : '下一題';
  const nextBtn = el('button',{class:'btn btn-primary', onclick:nextQuestion}, nextLabel);
  if(!locked) nextBtn.disabled = true;
  navRow.appendChild(prevBtn);
  navRow.appendChild(nextBtn);
  wrap.appendChild(navRow);

  return wrap;
}

function renderResult(){
  const topic = TOPICS[state.topicIdx];
  let score = 0;
  state.questions.forEach((q,i)=>{ if(state.answers[i]===q.answer) score++; });

  const key = 'quiz_best_'+topic.id;
  const prevBest = parseInt(safeGet(key)||'0',10);
  if(score > prevBest) safeSet(key, String(score));

  const wrap = el('div',{class:'card'});
  wrap.appendChild(el('div',{class:'quiz-header'},
    el('h2',null, topic.title + ' － 測驗結果'),
    el('button',{class:'backbtn', onclick:goHome}, '← 返回主題選擇')
  ));

  const pctScore = Math.round(score/state.questions.length*100);
  wrap.appendChild(el('div',{class:'result-score'},
    el('div',{class:'num'}, score+' / '+state.questions.length),
    el('div',{class:'lbl'}, '正確率 '+pctScore+'%'+(score>prevBest?'　🎉 創下新紀錄！':''))
  ));

  const actions = el('div',{class:'actions-row'},
    el('button',{class:'btn btn-primary', onclick:retakeSameTopic}, '🔄 再測驗 10 題'),
    el('button',{class:'btn btn-ghost', onclick:goHome}, '返回主題選擇')
  );
  wrap.appendChild(actions);

  const reviewTitle = el('h3',{style:'margin-top:28px;font-size:1rem;color:var(--sub);'}, '詳解回顧');
  wrap.appendChild(reviewTitle);

  state.questions.forEach((q,i)=>{
    const userAns = state.answers[i];
    const isCorrect = userAns === q.answer;
    const item = el('div',{class:'review-item'});
    item.appendChild(el('div',{class:'q'}, (i+1)+'. '+q.q+ (isCorrect? ' ':' ') ));
    item.appendChild(el('div',{class:'row correct'}, '✔ 正確答案：'+q.options[q.answer]));
    if(!isCorrect){
      item.appendChild(el('div',{class:'row wrong'}, '✘ 你的答案：'+ (userAns!==null? q.options[userAns] : '（未作答）')));
    }
    wrap.appendChild(item);
  });

  return wrap;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  let node;
  if(state.view==='home') node = renderHome();
  else if(state.view==='quiz') node = renderQuiz();
  else node = renderResult();
  app.appendChild(node);
  window.scrollTo({top:0, behavior:'instant'});
}

render();
</script>
</body>
</html>
