</style></head><body><main><header><div class="eyebrow">MARKETING / CHAPTER 03</div><h1>Ch3 行銷環境・進階練習</h1><p class="muted">辨識環境層次、競爭來源與變化，練習有依據的判斷。</p></header><div id="storageNotice" class="notice hidden" role="status"></div><div id="app"></div><footer>依據《Ch3 行銷環境 摘要》編製，延伸基礎觀念與虛構情境。本題庫為理解練習，非官方考古題。<br>成績保存在目前瀏覽器，不會跨裝置同步；清除瀏覽器資料、使用無痕模式或搬移檔案可能影響紀錄。建議定期匯出備份。本章成績與其他章節分開保存；備份請於相同章節及版本匯入。</footer></main>
<script>
'use strict';
const BANK=[{"id": 1, "kind": "基礎", "topic": "環境架構", "q": "分析行銷環境時，判斷內部與外部因素的第一步應為何？", "options": ["依因素是否能立即量化分類", "依因素影響的金額大小排序", "界定分析的企業及組織邊界", "以因素有利或不利決定歸屬"], "answer": 2, "explain": "內外部要相對於特定分析單位判斷；影響大小、有利與否及量化程度都不是邊界本身。"}, {"id": 2, "kind": "基礎", "topic": "環境架構", "q": "關於內部環境與可控制程度，哪項理解較適當？", "options": ["企業對內部配置通常有較直接的調整權", "企業能完全決定與外部組織的交易條件", "企業可在短期任意改變所有內部條件", "企業只需分析能由自己完全控制的因素"], "answer": 0, "explain": "摘要以可控制部分說明內部環境，但規模、結構等也可能受契約、成本或時間限制。"}, {"id": 3, "kind": "基礎", "topic": "環境架構", "q": "個體環境與總體環境主要如何區別？", "options": ["直接往來的行動者，與較廣泛的社會性力量", "能以數字量測的因素，與只能描述的因素", "短期即可改變的因素，與長期不變的因素", "有利於企業的因素，與不利於企業的因素"], "answer": 0, "explain": "供應商、顧客等是個體行動者；經濟、人口及科技等是總體力量。兩者都可能帶來機會與威脅。"}, {"id": 4, "kind": "基礎", "topic": "個體環境", "q": "下列哪項工作最符合行銷中間機構的角色？", "options": ["替品牌制定企業內部人事制度", "替品牌處理商品配送與零售接觸", "替品牌決定全國法定標示規範", "替品牌提供主要製造原料零件"], "answer": 1, "explain": "中間機構協助推廣、銷售或配送；供應原料、制定法律及內部人事分屬其他角色。"}, {"id": 5, "kind": "基礎", "topic": "個體環境", "q": "追蹤顧客留存率時，最適當的比較基礎為何？", "options": ["期末全部顧客中首次購買者所占的比例", "期末成交筆數相對於曝光總次數的比例", "同一批起始顧客在約定期間後仍有往來的比例", "期內新客人數相對於所有名單數的比例"], "answer": 2, "explain": "留存關注原有顧客是否延續往來。需先界定期間及有效往來標準，不能以新客占比替代。"}, {"id": 6, "kind": "基礎", "topic": "競爭分類", "q": "依摘要，慾望競爭與本質競爭主要差異為何？", "options": ["同一需要比較品牌，與不同願望比較價格", "不同願望爭取預算，與同一需要的不同解法", "同類產品比較價格，與相近產品比較規格", "同類產品比較款式，與相近產品比較品牌"], "answer": 1, "explain": "慾望競爭發生在不同用途的預算分配；本質競爭則是同一需要有不同滿足方式。"}, {"id": 7, "kind": "基礎", "topic": "競爭分類", "q": "依摘要，型式競爭與品牌競爭主要差異為何？", "options": ["前者比較交易條件，後者比較整體經濟景氣", "前者比較同類型式，後者比較相近產品的品牌", "前者比較不同需要，後者比較不同支出用途", "前者比較同一品牌，後者比較不同基本需要"], "answer": 1, "explain": "型式著重同類產品的類型或款式；品牌著重已相近的產品在不同品牌之間的選擇。"}, {"id": 8, "kind": "基礎", "topic": "五力分析", "q": "使用五力分析時，主要想了解哪個問題？", "options": ["產業中的競爭結構如何影響獲利空間", "企業各事業應如何分配年度投資預算", "企業內部七項管理要素如何彼此配合", "企業各項活動如何形成內部作業成本"], "answer": 0, "explain": "五力檢視同業、進入者、替代品、購買者與供應商對產業獲利的壓力；不等同內部配合或投資組合分析。"}, {"id": 9, "kind": "基礎", "topic": "五力分析", "q": "判斷替代品時，最適合採取哪項標準？", "options": ["能否用不同方式滿足相同需要", "是否與企業擁有相同的品牌名", "是否與企業使用相同的原材料", "是否與企業設在同一個商圈內"], "answer": 0, "explain": "替代關係應從需要與用途看，外觀、地點或原材料相近均非必要條件。"}, {"id": 10, "kind": "基礎", "topic": "五力分析", "q": "其他條件相同時，何種情況較可能提高購買者議價力？", "options": ["少數客戶集中採購且容易轉換供應來源", "大量客戶分散採購且更換來源成本高", "既有廠商須投入大量資金才能退出市場", "少數供應商掌握關鍵且難以替換的原料"], "answer": 0, "explain": "大買方集中且有選擇，可對價格及服務提出更強要求；其餘涉及其他力量或相反條件。"}, {"id": 11, "kind": "基礎", "topic": "五力分析", "q": "其他條件相同時，何種情況較可能提高供應商議價力？", "options": ["投入規格高度通用且可替代來源眾多", "產業成長快速且現有廠商皆積極增產", "關鍵投入來源稀少且買方更換成本較高", "下游客戶數量減少且採購規模更集中"], "answer": 2, "explain": "供應來源稀少、不可替代及轉換困難，通常使上游更能要求交易條件。"}, {"id": 12, "kind": "基礎", "topic": "總體環境", "q": "追蹤總體環境時，何種做法較能處理微弱訊號？", "options": ["只在銷量大幅下降後，回看最近一次新聞", "挑選符合既有策略的資料，維持判斷一致", "依單次異常數字，立即推定長期方向已定", "持續蒐集多來源資料，檢查趨勢及假設"], "answer": 3, "explain": "摘要強調環境因素多且早期訊號弱，需長期追蹤，必要時借助專家，而非單一事件定論。"}, {"id": 13, "kind": "基礎", "topic": "總體環境", "q": "區分人口統計與社會文化因素時，哪項配對較適當？", "options": ["年齡結構屬人口統計，消費價值觀屬社會文化", "所得變化屬人口統計，技術突破屬社會文化", "利率水準屬人口統計，婚姻狀態屬社會文化", "法規內容屬人口統計，原料耗竭屬社會文化"], "answer": 0, "explain": "年齡與婚姻狀態等可描述人口組成；價值觀與生活習慣則偏文化。部分現象可能跨類，應先看分析焦點。"}, {"id": 14, "kind": "基礎", "topic": "總體環境", "q": "PEST 中 E 與 T 分別著重何者？", "options": ["資源分配與部門權責；市場上的客戶人數", "購買能力與經濟條件；技術與工具的發展", "人口組成與社會習慣；政策與法定要求", "政府管理與法定要求；組織內部的結構"], "answer": 1, "explain": "E 為 Economic，T 為 Technological；PEST 著重外部力量，不是公司部門的分類。"}, {"id": 15, "kind": "基礎", "topic": "分析工具", "q": "若企業要理解「外部產業壓力」及「內部執行配合」，哪組工具最適合分工？", "options": ["安索夫與 PEST", "五力分析與 7S", "BCG 與安索夫", "7S 與 BCG"], "answer": 1, "explain": "五力分析產業競爭結構；7S 檢視策略、制度、人員等的配合。工具應依問題選擇，不能只因摘要列在一起就視為用途相同。"}, {"id": 16, "kind": "應用", "topic": "環境架構", "q": "某品牌可決定自有門市的排班，但無法單方面決定獨立經銷商的採購量。分析時較適當的分類為何？", "options": ["前者屬總體文化，後者屬外部自然環境", "前者屬總體經濟，後者屬內部組織結構", "前者屬內部配置，後者涉及外部中間機構", "前者屬外部顧客，後者屬內部生產資源"], "answer": 2, "explain": "要區分企業對自有通路的內部安排，以及獨立通路商的外部行為；不能將所有通路事項都視為可控制。"}, {"id": 17, "kind": "應用", "topic": "環境架構", "q": "銀行提高某公司的授信要求，同期整體市場利率也上升。兩者分析焦點依序為何？", "options": ["內部管理哲學；總體人口結構", "特定財務機構；總體經濟條件", "特定顧客行為；內部組織權責", "總體科技條件；特定競爭同業"], "answer": 1, "explain": "個別銀行與企業的關係屬個體環境；整體利率變化屬總體經濟，兩者可同時影響資金取得。"}, {"id": 18, "kind": "應用", "topic": "個體環境", "q": "品牌因第三方倉儲揀貨錯誤，導致顧客收到錯誤商品。若依出錯角色追查，應先檢查何者？", "options": ["內部股東關係", "特殊利益團體", "原料供應廠商", "行銷中間機構"], "answer": 3, "explain": "第三方倉儲協助配送與交付，屬行銷中間機構；未指出原料或生產本身出錯。"}, {"id": 19, "kind": "應用", "topic": "個體環境", "q": "包裝廠延遲交付瓶蓋，使飲料廠無法完成生產。若以飲料廠為分析單位，首先涉及何者？", "options": ["股東", "社區", "供應商", "顧客"], "answer": 2, "explain": "瓶蓋是製造投入，上游廠商屬供應商；同樣是延誤，仍應依其實際角色分類。"}, {"id": 20, "kind": "應用", "topic": "個體環境", "q": "某環保團體要求企業減少一次性包材，當時尚無新法規。最直接的個體環境來源為何？", "options": ["產業潛在進入者", "原料供應廠商", "政府主管機關", "特殊利益團體"], "answer": 3, "explain": "倡議來自關注環境議題的團體；題幹未描述法律已改變，不能直接當成新法規要求。"}, {"id": 21, "kind": "應用", "topic": "個體環境", "q": "工廠附近居民要求調整夜間卸貨，以減少噪音。最直接需要經營哪種關係？", "options": ["社區關係", "金融機構關係", "股東關係", "原料供應關係"], "answer": 0, "explain": "關切來自所在地居民，屬社區；即使涉及環境議題，也應先看實際行動者。"}, {"id": 22, "kind": "應用", "topic": "個體環境", "q": "員工集體透過其組織協商輪班與工時，影響配送安排。最直接涉及何者？", "options": ["工會", "主管機關", "消費者組織", "通路商"], "answer": 0, "explain": "題目指向代表勞工協商的組織，並非顧客、經銷商或政府角色。"}, {"id": 23, "kind": "應用", "topic": "個體環境", "q": "出資持有公司股份的人，要求公司說明長期品牌投入及報酬。依摘要的成員分類，最直接屬何者？", "options": ["顧客", "供應商", "股東", "社區"], "answer": 2, "explain": "應依該次行動的角色分析；同一個人可以是顧客，但此處是行使股東身分。"}, {"id": 24, "kind": "應用", "topic": "顧客分析", "q": "某店期初有 200 位有效顧客，期末其中 150 位仍有效，期間另新增 80 位。依同一群體口徑，留存率為何？", "options": ["115%", "65.2%", "75%", "40%"], "answer": 2, "explain": "以期初同一批顧客計算為 150÷200=75%；新客不應加入原客留存分子，150÷230 則是另一種占比。"}, {"id": 25, "kind": "應用", "topic": "顧客分析", "q": "公司總顧客數增加，但原有顧客持續流失。下一步較適當的分析為何？", "options": ["只看新增名單數，推定原有顧客更滿意", "分開檢查新客取得與原客延續往來的情況", "將新舊顧客合併，取消對購買期間的區分", "只看期末總人數，認定顧客關係已改善"], "answer": 1, "explain": "總量成長可能遮住流失問題；新客取得與留存需分開看，還要確認往來標準。"}, {"id": 26, "kind": "應用", "topic": "競爭分類", "q": "消費者決定把有限年終獎金用於添購家具，還是安排旅遊。依摘要最符合何種競爭？", "options": ["本質競爭", "型式競爭", "慾望競爭", "品牌競爭"], "answer": 2, "explain": "家具與旅遊對應不同願望，爭取同一筆可支配預算，符合慾望競爭。"}, {"id": 27, "kind": "應用", "topic": "競爭分類", "q": "消費者已決定以休閒活動放鬆，正在游樂園、KTV 與電影院之間選擇。依摘要最符合何者？", "options": ["慾望競爭", "型式競爭", "本質競爭", "品牌競爭"], "answer": 2, "explain": "目標需要已固定為休閒放鬆，但滿足方式不同；尚未縮小到同類產品的類型或品牌。"}, {"id": 28, "kind": "應用", "topic": "競爭分類", "q": "顧客已決定購買自行車，正在登山車與公路車之間選擇，尚未比較廠牌。依摘要最符合何者？", "options": ["本質競爭", "型式競爭", "慾望競爭", "品牌競爭"], "answer": 1, "explain": "題幹將範圍限定在同一類產品的類型，且尚未比較品牌，較符合型式競爭。"}, {"id": 29, "kind": "應用", "topic": "競爭分類", "q": "顧客已選定相近規格的同類產品，現在比較甲、乙兩個廠牌。依摘要最符合何者？", "options": ["本質競爭", "型式競爭", "品牌競爭", "慾望競爭"], "answer": 2, "explain": "需要、產品類型及規格已接近，剩下主要是品牌之間的選擇。"}, {"id": 30, "kind": "應用", "topic": "競爭分類", "q": "茶品牌只觀察其他茶品牌，忽略顧客可能改用咖啡達成提神目的。最主要漏看何者？", "options": ["同一品牌的不同門市位置", "同一需要的其他滿足方式", "同一商品的不同包裝尺寸", "同一企業的不同部門預算"], "answer": 1, "explain": "需要層次的替代可能來自其他品類，只看品牌會低估競爭範圍；不同分類架構不必強制視為同義。"}, {"id": 31, "kind": "應用", "topic": "五力分析", "q": "某區域多家同類店家反覆跟進折扣，服務內容相近，獲利因此下降。最直接反映哪股力量？", "options": ["供應商的議價能力", "產業內競爭者的競爭", "潛在進入者的威脅", "替代產品的威脅"], "answer": 1, "explain": "行動來自已在市場中的同業，直接表現為價格及服務競爭，而非尚未進入者。"}, {"id": 32, "kind": "應用", "topic": "五力分析", "q": "新設備租賃方案大幅降低開店初期資金需求，原有業者擔心更多新公司加入。主要涉及何者？", "options": ["供應商的議價能力", "購買者的議價能力", "既有同業的退出障礙", "潛在進入者的威脅"], "answer": 3, "explain": "資金門檻降低，可能使新業者更容易進入；這與既有業者是否容易退出不同。"}, {"id": 33, "kind": "應用", "topic": "五力分析", "q": "某產業必須先建立專門配送網及取得顧客信任，投入後短期難以回收。其他條件相同時，對新進威脅有何影響？", "options": ["降低進入難度，使威脅可能提高", "降低產品差異，使威脅必然消失", "提高購買者數量，使威脅必然提高", "提高進入難度，使威脅可能降低"], "answer": 3, "explain": "建立網路、品牌與不可回收投入可能形成進入障礙，但不代表永遠不會有新業者。"}, {"id": 34, "kind": "應用", "topic": "五力分析", "q": "企業原本靠出差進行跨地會議，後來改用視訊服務，減少差旅支出。從航空業看，最直接涉及何者？", "options": ["替代品的威脅", "新航空公司的進入", "上游廠商的議價力", "同業間的價格競爭"], "answer": 0, "explain": "視訊以不同方式滿足跨地溝通的需要，並非航空業內的另一家航空公司。"}, {"id": 35, "kind": "應用", "topic": "五力分析", "q": "零售市場的三家大型連鎖商掌握多數訂單，且可輕易更換同類供貨品牌。品牌最需注意何者？", "options": ["購買者的議價能力", "潛在進入者的威脅", "產品替代技術的發展", "供應商的議價能力"], "answer": 0, "explain": "分析對象是向品牌採購的少數大買方，規模集中及轉換容易會加強其要求條件的能力。"}, {"id": 36, "kind": "應用", "topic": "五力分析", "q": "某關鍵零件只有少數合格來源，更換後須重新驗證且耗時。製造商最直接承受何種壓力？", "options": ["新進同業的資金優勢", "購買者的議價能力", "既有同業的促銷密度", "供應商的議價能力"], "answer": 3, "explain": "稀少來源與高轉換成本，使製造商較難拒絕上游條件。"}, {"id": 37, "kind": "應用", "topic": "五力分析", "q": "企業把原料改為通用規格，並完成數家替代來源的認證。其他條件相同時，最可能有何影響？", "options": ["提高下游客戶的集中度", "增加既有同業退出成本", "縮小最終顧客市場規模", "減少對單一上游的依賴"], "answer": 3, "explain": "可替代來源增加，通常降低單一供應商的議價力；並不直接改變買方集中度或市場規模。"}, {"id": 38, "kind": "應用", "topic": "五力分析", "q": "某公司把規模相同的訂單分散給更多供應商，卻未處理其中一項無法替代的專利零件。哪項判斷較合理？", "options": ["整體供應商家數增加，仍可能保留關鍵依賴", "只要訂單規模不變，新進企業就無法競爭", "只要採購分散，產品替代威脅就會自然降低", "只要供應商總數增加，關鍵議價壓力就消失"], "answer": 0, "explain": "應檢查特定投入的替代性，不能用總家數掩蓋瓶頸零件的單一依賴。"}, {"id": 39, "kind": "應用", "topic": "五力分析", "q": "某行業需求成長放緩，多家廠商仍有大量閒置產能且難以退出。較可能出現何種情況？", "options": ["買方因廠商增加而更難轉換", "新業者因退出困難而更易進入", "同業為爭取訂單而加劇競爭", "上游因產能閒置而必然減少來源"], "answer": 2, "explain": "成長緩慢、過剩產能及退出障礙可能推動同業搶單；需看整體條件，並非由一項指標定論。"}, {"id": 40, "kind": "應用", "topic": "總體環境", "q": "某地高齡人口占比持續上升，公司因而評估較易開啟的包裝。最初的外部變化屬何者？", "options": ["內部技術", "個別競爭者", "個別供應商", "人口統計"], "answer": 3, "explain": "初始訊號是年齡結構；易開包裝是企業可能採取的回應，不應把回應當成環境來源。"}, {"id": 41, "kind": "應用", "topic": "總體環境", "q": "顧客所得成長放緩、可支配預算下降，即使人口總量未變也減少非必要支出。主要屬何者？", "options": ["經濟環境", "人口統計", "政治法律", "自然環境"], "answer": 0, "explain": "直接線索為購買能力與支出型態，屬經濟；人口不變不代表市場需求不變。"}, {"id": 42, "kind": "應用", "topic": "總體環境", "q": "調查發現不同年齡顧客都更重視少糖與飲食健康，尚無新法規。主要反映何者？", "options": ["政治法律", "內部結構", "個別財務機構", "社會文化"], "answer": 3, "explain": "題幹著重價值觀及生活偏好，並未將變化歸因於人口組成或法定要求。"}, {"id": 43, "kind": "應用", "topic": "總體環境", "q": "假設主管機關公告新的標示規定，企業因而重新安排包裝資訊。外部變化主要屬何者？", "options": ["通路競爭", "政治法律", "社會文化", "內部組織"], "answer": 1, "explain": "這是法定要求的假設情境；包裝調整是回應，不改變外部來源的分類。"}, {"id": 44, "kind": "應用", "topic": "總體環境", "q": "手機支付的基礎設施與工具日益普及，企業開始評估導入。最初的外部變化主要屬何者？", "options": ["股東報酬要求", "科技環境", "原料供應商關係", "內部管理哲學"], "answer": 1, "explain": "社會中的工具及基礎技術普及屬外部科技；公司是否導入則是內部決策。"}, {"id": 45, "kind": "應用", "topic": "總體環境", "q": "長期乾旱使多個地區的農作原料供給減少，之後特定供應商調高報價。最初的變動與直接往來依序屬何者？", "options": ["科技環境、中間機構", "經濟環境、股東", "社會文化、顧客", "自然環境、供應商"], "answer": 3, "explain": "乾旱及資源短缺是自然環境，後續報價是個體供應商行為；一條因果鏈可跨越層次。"}, {"id": 46, "kind": "應用", "topic": "總體環境", "q": "企業把整體市場利率上升歸為 PEST 的 E，另把某零售商要求折扣也放在同欄。較適當的修正為何？", "options": ["保留兩者不變，因為有價格就屬總體經濟", "將兩者都改列 S，因為都涉及人的決定", "將兩者都改列 T，因為都能以數字記錄", "保留利率分類，另分析特定買方的議價行為"], "answer": 3, "explain": "利率屬總體經濟；特定零售商的交易要求屬個體行為，不能把所有金錢相關現象都歸同類。"}, {"id": 47, "kind": "應用", "topic": "總體環境", "q": "某月少糖飲品銷量上升，團隊立即認定長期飲食文化已改變。較適當的後續工作為何？", "options": ["依當月數字擴大全部產能，停止蒐集其他資料", "排除促銷與季節影響，再追蹤多期及多來源證據", "將此變化直接列為人口成長，不再分析購買動機", "只訪問當月購買者，以喜好回答取代長期比較"], "answer": 1, "explain": "單期銷量可能有其他原因，文化趨勢需要較長期證據與交叉確認。"}, {"id": 48, "kind": "應用", "topic": "分析工具", "q": "公司想了解產業利潤壓力，同時診斷自家訂單處理效率。較適當的安排為何？", "options": ["以 PEST 取代作業資料，以 7S 計算市場市占", "以價值鏈判定利率，以五力安排部門核准權責", "以五力看競爭結構，以價值鏈檢查活動與連結", "以五力看員工技能，以人口統計檢查流程耗時"], "answer": 2, "explain": "工具應分工；價值鏈關注企業活動如何創造價值及形成成本，五力則看外部產業結構。"}, {"id": 49, "kind": "應用", "topic": "環境整合", "q": "總體經濟轉弱，某品牌仍因產品切合需求而成長。哪項理解較適當？", "options": ["企業成長即可證明經濟資料必然錯誤", "總體因素無法控制，因此不具分析價值", "單一品牌成長代表整個產業沒有壓力", "總體壓力不代表每家企業會有相同結果"], "answer": 3, "explain": "同一外部變化可經由不同客群、定位與能力產生不同影響；宏觀趨勢不能直接代替企業分析。"}, {"id": 50, "kind": "應用", "topic": "環境整合", "q": "企業希望降低未來原料波動的衝擊，但無法決定天候與國際行情。哪項回應較適當？", "options": ["建立情境及供應備案，追蹤變化後調整", "將行情改列內部因素，以便要求部門控制", "等到環境能完全預測，再開始安排採購", "只採用上一年度價格，維持預算資料一致"], "answer": 0, "explain": "難以控制的總體因素仍可監測並預先因應；無法控制來源不等於不能降低曝險或改善回應。"}];
const KEY='marketing-ch3-advanced50-v1';
const app=document.getElementById('app');
let history=[],session=null,index=0,filter='all',storageOK=true;
function notice(t){const el=document.getElementById('storageNotice');el.textContent=t;el.classList.remove('hidden')}
try{history=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(history))throw Error();history=history.filter(h=>h&&typeof h.id==='string'&&Number.isFinite(h.score)&&Array.isArray(h.details));}catch(e){storageOK=false;notice('無法讀取成績紀錄。本次仍可練習，請使用匯出功能保存結果。')}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(history))}catch(e){storageOK=false;notice('瀏覽器未能儲存成績，請先匯出備份；關閉頁面後可能無法保留。')}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){if(session&&!session.result&&!confirm('重新抽題會捨棄目前尚未交卷的作答，確定繼續？'))return;const picked=shuffle([...shuffle(BANK.filter(q=>q.kind==='基礎')).slice(0,6),...shuffle(BANK.filter(q=>q.kind==='應用')).slice(0,14)]);session={start:Date.now(),questions:picked.map(q=>({...q,order:shuffle([0,1,2,3])})),answers:{},result:null};index=0;renderQuestion()}
function home(){if(session&&!session.result&&!confirm('返回首頁會捨棄尚未交卷的作答，確定繼續？'))return;session=null;renderHome()}
function renderHome(){const best=history.length?Math.max(...history.map(h=>h.score)):'—';const avg=history.length?Math.round(history.reduce((n,h)=>n+h.score,0)/history.length):'—';app.innerHTML=`<section class="card"><span class="pill">CH3 進階理解練習</span><h2 style="margin-top:15px">一次 20 題，練習環境判斷</h2><p>50 題進階單選題庫（15 題基礎、35 題應用），每回隨機抽取 <b>6 題基礎知識＋14 題實際應用</b>。每題 5 分，不限時；交卷後顯示成績、正確答案與解析。</p><div class="stats"><div class="stat"><b>${history.length}</b><small>完成回數</small></div><div class="stat"><b>${best}</b><small>最高分 / 100</small></div><div class="stat"><b>${avg}</b><small>平均分 / 100</small></div></div><button class="primary" onclick="start()">開始隨機練習 →</button></section><section class="card"><div class="topline"><h2>歷次成績</h2><small>儲存在此瀏覽器</small></div><div class="actions"><button onclick="exportHistory()" ${history.length?'':'disabled'}>匯出紀錄備份</button><button onclick="document.getElementById('importFile').click()">匯入備份</button><input id="importFile" class="hidden" type="file" accept=".json,application/json" onchange="importHistory(this)"><button onclick="clearHistory()" ${history.length?'':'disabled'}>清除紀錄</button></div>${history.length?`<div class="tablewrap"><table><thead><tr><th>練習時間</th><th>成績</th><th>答對</th><th>用時</th><th>解析</th></tr></thead><tbody>${history.map(h=>`<tr><td>${esc(new Date(h.date).toLocaleString('zh-TW'))}</td><td><b>${h.score} 分</b></td><td>${h.correct} / 20</td><td>${duration(h.seconds)}</td><td><button onclick="viewHistory('${esc(h.id)}')">查看</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">尚無紀錄。完成第一回，開始累積你的學習足跡。</p>'}</section>`}
function duration(s){return `${Math.floor(s/60)} 分 ${s%60} 秒`}
function renderQuestion(){const q=session.questions[index],answered=Object.keys(session.answers).length;app.innerHTML=`<section class="card"><div class="topline"><b>第 ${index+1} / 20 題</b><span class="muted">已作答 ${answered} / 20</span></div><progress max="20" value="${answered}"></progress><span class="pill">進階單選題</span><h2 style="margin-top:20px" id="questionHeading" tabindex="-1">${q.q}</h2><fieldset style="border:0;padding:0;margin:0"><legend class="muted">請選擇一個最適合的答案</legend><div class="options">${q.order.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${session.answers[q.id]===o?'checked':''} onchange="chooseDisplay(${i})"><span><b>${'ABCD'[i]}.</b> ${q.options[o]}</span></label>`).join('')}</div></fieldset><div class="actions"><button onclick="move(-1)" ${index===0?'disabled':''}>← 上一題</button>${index<19?'<button class="primary" onclick="move(1)">下一題 →</button>':''}<button onclick="submitQuiz()">交卷看解析</button><button onclick="home()">返回首頁</button></div><div class="navgrid" aria-label="題號導覽">${session.questions.map((x,i)=>`<button aria-label="第 ${i+1} 題${session.answers[x.id]!==undefined?'，已作答':''}" class="${i===index?'current ':''}${session.answers[x.id]!==undefined?'done':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><small>綠底表示已作答，可隨時切換題號修改答案。未交卷作答不會在重新整理後保留。</small></section>`}
function chooseDisplay(i){const q=session.questions[index];choose(q.id,q.order[i])}
function choose(id,o){session.answers[id]=o;renderQuestion()}
function jump(i){index=i;renderQuestion();document.getElementById('questionHeading').focus()}
function move(n){jump(index+n)}
function submitQuiz(){if(!session||session.result)return;const missing=20-Object.keys(session.answers).length;if(!confirm(missing?`還有 ${missing} 題未作答，交卷將以答錯計算。確定交卷？`:'確定交卷並查看解析？'))return;const details=session.questions.map(q=>({id:q.id,choice:session.answers[q.id]??null,order:q.order}));const correct=details.filter(d=>d.choice===BANK.find(q=>q.id===d.id).answer).length;const result={id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),date:new Date().toISOString(),score:correct*5,correct,seconds:Math.round((Date.now()-session.start)/1000),details};session.result=result;history.unshift(result);persist();filter='all';renderResult(result)}
function viewHistory(id){const h=history.find(h=>h.id===id);if(h){session={result:h};filter='all';renderResult(h)}}
function renderResult(r){const groups={};r.details.forEach(d=>{const q=BANK.find(x=>x.id===d.id);const g=groups[q.topic]??={total:0,correct:0};g.total++;g.correct+=Number(d.choice===q.answer)});app.innerHTML=`<section class="card"><div class="topline"><h2>本回練習結果</h2><small>${esc(new Date(r.date).toLocaleString('zh-TW'))}</small></div><div class="score">${r.score}<small style="font-size:18px"> / 100</small></div><p>答對 ${r.correct} / 20 題 · 用時 ${duration(r.seconds)}</p><p class="muted">${r.score>=80?'觀念逐漸穩固！看看解析，確認自己能說出原因。':'先找出混淆的概念，再用解析中的關鍵線索重新判斷。'}</p><div class="actions"><button class="primary" onclick="start()">再抽 20 題</button><button onclick="home()">回首頁看紀錄</button><button onclick="exportHistory()">匯出成績備份</button></div><h3>各主題表現</h3>${Object.entries(groups).map(([t,g])=>`<span class="pill">${t} ${g.correct}/${g.total}</span>`).join('')}</section><section><div class="topline"><h2>逐題解析</h2><div><button onclick="setFilter('all')" ${filter==='all'?'disabled':''}>全部</button> <button onclick="setFilter('wrong')" ${filter==='wrong'?'disabled':''}>只看錯題</button></div></div><div style="margin-top:18px">${r.details.map((d,i)=>{const q=BANK.find(x=>x.id===d.id),ok=d.choice===q.answer;if(filter==='wrong'&&ok)return '';return `<article class="card review ${ok?'':'bad'}"><span class="pill">${q.kind} · ${q.topic}</span><h3>${i+1}. ${q.q}</h3><p class="${ok?'right':'wrong'}">${ok?'✓ 答對':'✕ '+(d.choice===null?'未作答':'答錯')}｜你的答案：${d.choice===null?'未作答':esc(q.options[d.choice])}</p><p><b>正確答案：${q.options[q.answer]}</b></p><p class="muted">${q.explain}</p></article>`}).join('')}${filter==='wrong'&&r.correct===20?'<div class="card">本回全對，沒有錯題！</div>':''}</div></section>`}
function setFilter(f){filter=f;renderResult(session.result)}
function exportHistory(){const blob=new Blob([JSON.stringify({version:2,bank:'ch3-advanced50-v1',history},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='行銷Ch3行銷環境50題成績備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importHistory(input){const file=input.files[0];if(!file)return;try{if(file.size>5000000)throw Error();const data=JSON.parse(await file.text());if(data.version!==2||data.bank!=='ch3-advanced50-v1'||!Array.isArray(data.history)||data.history.length>10000)throw Error();for(const h of data.history){if(!h||typeof h.id!=='string'||!/^[a-z0-9]+$/.test(h.id)||!Number.isFinite(Date.parse(h.date))||!Number.isInteger(h.seconds)||h.seconds<0||!Array.isArray(h.details)||h.details.length!==20||new Set(h.details.map(d=>d.id)).size!==20)throw Error();for(const d of h.details){if(!Number.isInteger(d.id)||!BANK.some(q=>q.id===d.id)||!(d.choice===null||Number.isInteger(d.choice)&&d.choice>=0&&d.choice<4))throw Error()}h.correct=h.details.filter(d=>d.choice===BANK.find(q=>q.id===d.id).answer).length;h.score=h.correct*5}const ids=new Set(history.map(h=>h.id));history=[...history,...data.history.filter(h=>!ids.has(h.id))].sort((a,b)=>new Date(b.date)-new Date(a.date));persist();renderHome();alert('備份已匯入。')}catch(e){alert('無法匯入：請選擇本練習室匯出的有效 JSON 備份。')}input.value=''}
function clearHistory(){if(confirm('確定清除所有歷次成績？建議先匯出備份，清除後無法復原。')){history=[];persist();renderHome()}}
renderHome();
</script></body></html>
