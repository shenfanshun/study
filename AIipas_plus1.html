<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI應用規劃師 隨機測驗</title>
<style>
  :root {
    --primary: #4472C4;
    --primary-dark: #2f5597;
    --green: #2e7d32;
    --red: #c62828;
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #26324a;
    --muted: #6b7686;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  h1 {
    text-align: center;
    color: var(--primary-dark);
    font-size: 1.6em;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 28px;
    font-size: 0.95em;
  }
  .card {
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 2px 12px rgba(30,40,80,0.08);
    padding: 28px 24px;
    margin-bottom: 20px;
  }
  .btn {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px 22px;
    font-size: 1em;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s;
    font-family: inherit;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn.secondary {
    background: #eef1f8;
    color: var(--primary-dark);
  }
  .btn.secondary:hover { background: #dde3f2; }
  .btn.block { display:block; width:100%; margin-bottom:12px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .start-actions { display:flex; flex-direction:column; gap:12px; }
  .cat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
    margin: 16px 0 20px;
    font-size: 0.92em;
    color: var(--muted);
  }
  .cat-grid div { display:flex; justify-content:space-between; border-bottom:1px dashed #e0e4ee; padding:4px 0; }
  .progress-row {
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-bottom: 14px;
    font-size: 0.9em;
    color: var(--muted);
  }
  .progress-bar {
    height: 8px;
    background: #e6e9f2;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-fill {
    height: 100%;
    background: var(--primary);
    transition: width 0.25s;
  }
  .tag {
    display:inline-block;
    font-size: 0.75em;
    background: #eef1f8;
    color: var(--primary-dark);
    border-radius: 20px;
    padding: 3px 10px;
    margin-right: 6px;
  }
  .tag.scenario { background:#fff1e0; color:#a15c00; }
  .question-text {
    font-size: 1.12em;
    line-height: 1.6;
    margin: 14px 0 20px;
    font-weight: 600;
  }
  .option {
    display:block;
    width:100%;
    text-align:left;
    background:#f8f9fc;
    border: 2px solid #e6e9f2;
    border-radius: 10px;
    padding: 13px 16px;
    margin-bottom: 10px;
    font-size: 0.98em;
    cursor: pointer;
    line-height:1.5;
    color: var(--text);
    font-family: inherit;
    transition: border-color 0.15s, background 0.15s;
  }
  .option:hover:not(:disabled) { border-color: var(--primary); }
  .option.correct { background:#e8f5e9; border-color: var(--green); color:#1b5e20; font-weight:600; }
  .option.wrong { background:#fdecea; border-color: var(--red); color:#8e1c1c; font-weight:600; }
  .option:disabled { cursor:not-allowed; }
  .explain {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 10px;
    background: #f1f5ff;
    border-left: 4px solid var(--primary);
    font-size: 0.92em;
    line-height:1.6;
    display:none;
  }
  .explain.show { display:block; }
  .nav-row { display:flex; justify-content:flex-end; margin-top: 20px; }
  .score-big {
    text-align:center;
    font-size: 2.6em;
    font-weight:700;
    color: var(--primary-dark);
    margin: 10px 0;
  }
  .score-sub { text-align:center; color:var(--muted); margin-bottom: 20px;}
  table { width:100%; border-collapse: collapse; font-size:0.9em; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #eef1f8; text-align:left; }
  th { color: var(--muted); font-weight:600; }
  .review-item { padding: 14px 0; border-bottom: 1px solid #eef1f8; }
  .review-item:last-child { border-bottom:none; }
  .review-q { font-weight:600; margin-bottom:6px; }
  .review-ans { font-size:0.9em; margin: 3px 0; }
  .ok { color: var(--green); }
  .no { color: var(--red); }
  .hidden { display:none !important; }
  .footer-note { text-align:center; color:var(--muted); font-size:0.8em; margin-top: 24px; }
  .history-empty { text-align:center; color:var(--muted); padding: 20px 0; }
  .clear-link { display:block; text-align:center; margin-top:14px; color:var(--red); font-size:0.85em; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
<div class="wrap">
  <h1>AI應用規劃師 隨機測驗</h1>
  <div class="subtitle">六大主題題庫共200題 · 每次隨機抽取20題 · 自動計分並記錄成績</div>

  <!-- 開始畫面 -->
  <div id="screen-start" class="card">
    <div class="cat-grid" id="cat-summary"></div>
    <div class="start-actions">
      <button class="btn block" onclick="startQuiz()">開始測驗(隨機20題)</button>
      <button class="btn secondary block" onclick="showHistory()">查看歷史成績</button>
    </div>
  </div>

  <!-- 測驗畫面 -->
  <div id="screen-quiz" class="card hidden">
    <div class="progress-row">
      <span id="progress-text">第 1 / 20 題</span>
      <span id="score-text">目前得分:0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div>
      <span class="tag" id="q-cat">分類</span><span class="tag scenario hidden" id="q-type-tag">情境題</span>
    </div>
    <div class="question-text" id="q-text"></div>
    <div id="options"></div>
    <div class="explain" id="explain"></div>
    <div class="nav-row">
      <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>下一題</button>
    </div>
  </div>

  <!-- 結果畫面 -->
  <div id="screen-result" class="card hidden">
    <div class="score-big" id="final-score"></div>
    <div class="score-sub" id="final-sub"></div>
    <div class="start-actions">
      <button class="btn block" onclick="startQuiz()">再測一次(重新隨機20題)</button>
      <button class="btn secondary block" onclick="showStart()">回到首頁</button>
    </div>
  </div>

  <!-- 錯題檢討 -->
  <div id="screen-review" class="card hidden">
    <h3 style="margin-top:0;color:var(--primary-dark);">本次錯題檢討</h3>
    <div id="review-list"></div>
    <div class="start-actions" style="margin-top:16px;">
      <button class="btn block" onclick="startQuiz()">再測一次</button>
      <button class="btn secondary block" onclick="showStart()">回到首頁</button>
    </div>
  </div>

  <!-- 歷史成績 -->
  <div id="screen-history" class="card hidden">
    <h3 style="margin-top:0;color:var(--primary-dark);">歷史成績紀錄</h3>
    <div id="history-content"></div>
    <button class="btn secondary block" style="margin-top:16px;" onclick="showStart()">回到首頁</button>
    <div class="clear-link" onclick="clearHistory()">清除所有歷史紀錄</div>
  </div>

  <div class="footer-note">題庫依「AI Agent、AI安全與對齊、法規與治理、基礎演算法、資料工程、資料處理與分析」六大主題編製,成績紀錄僅保存在您目前使用的瀏覽器中。</div>
</div>

<script>
const ALL_QUESTIONS = [{"id": 1, "cat": "AI Agent", "type": "概念", "q": "下列何者最能定義「AI Agent(AI代理)」?", "opts": ["單純輸出文字、無法呼叫外部工具的語言模型", "只能依照固定規則回覆訊息的聊天機器人", "僅能執行單一次問答、不具記憶能力的程式", "能自主感知環境、規劃步驟、使用工具、執行任務的AI系統"], "ans": 3, "exp": "筆記明確定義AI Agent是能「自主感知環境、規劃步驟、使用工具、執行任務」的AI系統。"}, {"id": 2, "cat": "AI Agent", "type": "概念", "q": "「代理技能(Agent Skills)」的概念,最適合用下列哪個比喻來理解?", "opts": ["AI是硬體伺服器,代理技能是網路頻寬", "AI是資料庫,代理技能是資料表的欄位名稱", "AI是聰明的通才,代理技能是它學會的專業證照或SOP", "AI是空白畫布,代理技能是隨機產生的雜訊"], "ans": 2, "exp": "筆記用「通才 + 專業證照/SOP」比喻代理技能,賦予AI代理特定專業能力與任務流程。"}, {"id": 3, "cat": "AI Agent", "type": "概念", "q": "關於「小型模型+代理技能」與「大模型」的關係,筆記中的說法是?", "opts": ["小型模型永遠不可能超越大模型", "代理技能會降低小型模型的表現", "代理技能只能用在大模型上", "小型模型搭配代理技能,表現也可以超過大模型"], "ans": 3, "exp": "筆記提到「小型模型+技能 也可以超過大模型」。"}, {"id": 4, "cat": "AI Agent", "type": "概念", "q": "SOUL.md 這份檔案的主要用途是什麼?", "opts": ["記錄伺服器CPU使用率的日誌檔", "儲存資料庫的加密金鑰", "定義AI「靈魂」與人格特質的純文字Markdown檔案", "AI模型的權重檔案格式"], "ans": 2, "exp": "筆記定義SOUL.md是「一份用來定義AI靈魂與人格特質的純文字Markdown檔案」。"}, {"id": 5, "cat": "AI Agent", "type": "概念", "q": "在零信任架構(ZTA)中,「PDP」的角色定位為何?", "opts": ["系統的守門員或閘道器,負責攔截或放行連線", "負責儲存使用者密碼的資料庫", "負責產生UI介面的前端框架", "系統的大腦或法官,負責評估條件並下達存取許可"], "ans": 3, "exp": "筆記:PDP(策略決策點)角色定位是系統的「大腦」或「法官」,負責評估條件並下達存取許可。"}, {"id": 6, "cat": "AI Agent", "type": "概念", "q": "在零信任架構(ZTA)中,「PEP」的角色定位為何?", "opts": ["大腦或法官,負責評估條件並下達存取許可", "負責產生使用者介面的框架", "負責訓練模型的GPU叢集", "守門員或閘道器,實際攔截或放行連線,確保請求經過信任驗證"], "ans": 3, "exp": "筆記:PEP(策略執行點)角色定位是「守門員」或「閘道器」,負責保護資源並實際攔截或放行連線。"}, {"id": 7, "cat": "AI Agent", "type": "概念", "q": "「模組化架構(Modular Architecture)」主要解決AI Agent的哪個問題?", "opts": ["AI會亂講話", "太貴用不起", "系統太難改,讓Agent可拆、可換、可擴充", "風險太高、不受控管"], "ans": 2, "exp": "筆記表格:模組化架構解決「系統太難改」,核心價值是「可擴展」。"}, {"id": 8, "cat": "AI Agent", "type": "概念", "q": "「成本效益(Cost Efficiency)」在AI Agent中對應解決的問題與核心價值為何?", "opts": ["解決「系統太難改」,核心價值為「可擴展」", "解決「風險太高」,核心價值為「可控管」", "解決「太貴用不起」,核心價值為「可持續」", "解決「AI會亂講」,核心價值為「可相信」"], "ans": 2, "exp": "筆記表格:成本效益解決「太貴用不起」,核心價值是「可持續」,功用是讓AI Agent用得起、撐得久。"}, {"id": 9, "cat": "AI Agent", "type": "概念", "q": "「確定性驗證(Deterministic Verification)」的功用與核心價值為何?", "opts": ["讓AI不亂講、可驗證,核心價值為「可相信」", "讓AI用得起撐得久,核心價值為「可持續」", "讓AI可拆可換可擴充,核心價值為「可擴展」", "讓AI不出事可控管,核心價值為「可控管」"], "ans": 0, "exp": "筆記:確定性驗證功用是讓AI Agent「不亂講、可驗證」,核心價值是「可相信」,解決「AI會亂講」的問題。"}, {"id": 10, "cat": "AI Agent", "type": "概念", "q": "「安全治理(Safety & Governance)」對應解決的問題與核心價值為何?", "opts": ["解決「系統太難改」,核心價值為「可擴展」", "解決「AI會亂講」,核心價值為「可相信」", "解決「風險太高」,核心價值為「可控管」", "解決「太貴用不起」,核心價值為「可持續」"], "ans": 2, "exp": "筆記表格:安全治理解決「風險太高」,核心價值是「可控管」,功用是讓AI Agent「不出事、可控管」。"}, {"id": 11, "cat": "AI Agent", "type": "概念", "q": "「Agentic AI(代理式AI)」最貼切的定義為何?", "opts": ["僅用於影像辨識的傳統機器學習模型", "只能被動回答單一問題的聊天機器人", "一種資料庫查詢語言", "具備「自主行動力」的進階人工智慧系統"], "ans": 3, "exp": "筆記:「簡單來說,Agentic AI(代理式AI)是指具備自主行動力的進階人工智慧系統」。"}, {"id": 12, "cat": "AI Agent", "type": "概念", "q": "關於「AI Agent」與「Agentic AI」的角色定位比喻,下列何者正確?", "opts": ["AI Agent是團隊,Agentic AI是單一工具", "兩者角色定位完全相同,沒有差別", "AI Agent像專案經理;Agentic AI像單一實習生", "AI Agent像數位員工或實習生;Agentic AI像專案經理與協作平台"], "ans": 3, "exp": "筆記:AI Agent角色定位是「數位員工或實習生」;Agentic AI角色定位是「專案經理與協作平台」,是更大更廣的技術領域。"}, {"id": 13, "cat": "AI Agent", "type": "概念", "q": "Agentic AI的四大核心能力(支柱)不包含下列何者?", "opts": ["記憶系統(Memory)", "規劃能力(Planning)", "資料庫正規化(Normalization)", "工具調用(Tool Use)"], "ans": 2, "exp": "四大支柱為:規劃能力、工具調用、記憶系統、自我修正(Self-correction),資料庫正規化不在其中。"}, {"id": 14, "cat": "AI Agent", "type": "概念", "q": "Agentic AI四大核心能力中的「自我修正(Self-correction)」是指什麼?", "opts": ["自己上網搜尋、操作API、發送Email", "記得上一步做了什麼、使用者偏好是什麼", "把模糊目標自動拆解成具體SOP步驟", "遇到錯誤時自己分析原因、調整策略,換方法繼續嘗試直到達成目標"], "ans": 3, "exp": "筆記:自我修正是指執行中遇到錯誤(如網頁連不上、預算超標)會自己分析原因、調整策略,直到目標達成。"}, {"id": 15, "cat": "AI Agent", "type": "概念", "q": "「Agentic Workflow(代理式工作流程)」與傳統一次提示、一次輸出的方式最大差異為何?", "opts": ["以多步驟、可迭代方式自動執行任務,規劃→執行→檢查→修正", "只能執行一次提示就結束,不能反覆修正", "只能用於圖形化介面操作,不能用程式呼叫", "完全不需要AI模型參與"], "ans": 0, "exp": "筆記:Agentic Workflow讓AI以多步驟、可迭代方式自動執行任務,系統自行規劃→執行→檢查→修正直到完成目標。"}, {"id": 16, "cat": "AI Agent", "type": "概念", "q": "研究顯示,下列何種組合的表現可能超越「較強模型+單次提示」?", "opts": ["較強模型 + 不使用工具", "較弱模型 + Agentic Workflow", "較弱模型 + 單次提示", "較強模型 + 單次提示 + 更大的資料庫"], "ans": 1, "exp": "筆記:「較弱模型+Agentic Workflow」的表現可超越「較強模型+單次提示」。"}, {"id": 17, "cat": "AI Agent", "type": "概念", "q": "AI Agent與Agentic Workflow的關係,下列敘述何者正確?", "opts": ["AI Agent是流程方法,Agentic Workflow是執行者", "Agentic Workflow只能在沒有AI Agent時使用", "兩者是完全無關的獨立概念", "AI Agent是「執行者」,Agentic Workflow是「執行的流程方法」"], "ans": 3, "exp": "筆記明確指出:AI Agent是「執行者」,Agentic Workflow是「執行的流程方法」。"}, {"id": 18, "cat": "AI Agent", "type": "概念", "q": "Agent-to-Agent(A2A)最核心的定義是什麼?", "opts": ["單一AI與人類之間的一對一對話", "使用者介面與後端伺服器之間的通訊", "智能體與智能體之間的協作或通訊", "AI模型與資料庫之間的連線協定"], "ans": 2, "exp": "筆記:「Agent-to-Agent (A2A),也就是智能體與智能體之間的協作或通訊」。"}, {"id": 19, "cat": "AI Agent", "type": "概念", "q": "下列哪一個框架的特色是「用角色(Role)、目標(Goal)、任務(Task)」定義多AI協作,操作非常直覺?", "opts": ["HDFS", "LangGraph", "Microsoft AutoGen", "CrewAI"], "ans": 3, "exp": "筆記:CrewAI非常直覺,讓你用定義角色、目標和任務的方式讓多個AI協作。"}, {"id": 20, "cat": "AI Agent", "type": "概念", "q": "下列哪個框架擅長處理複雜、多對多的AI對話與事件驅動工作流?", "opts": ["Microsoft AutoGen", "CrewAI", "LangGraph", "Spark"], "ans": 0, "exp": "筆記:Microsoft AutoGen是微軟推出的框架,擅長處理複雜、多對多的AI對話與事件驅動工作流。"}, {"id": 21, "cat": "AI Agent", "type": "概念", "q": "LangGraph最適合用於下列哪種情境?", "opts": ["需要精準控制AI之間溝通循環(Loops)的複雜圖形結構", "純粹的資料庫儲存與查詢", "單一模型的單次問答", "只需定義角色、目標、任務即可完成的簡單協作"], "ans": 0, "exp": "筆記:LangGraph是LangChain家族成員,適合需要精準控制AI之間溝通循環(Loops)的複雜圖形結構。"}, {"id": 22, "cat": "AI Agent", "type": "概念", "q": "一個完整的「任務規劃器(Task Planner)」核心組成要素不包含下列何者?", "opts": ["資料加密演算法(Encryption Algorithm)", "子任務(Subtasks)", "優先順序(Priority)", "截止日期(Due Date)"], "ans": 0, "exp": "任務規劃器核心要素:任務名稱與描述、截止日期、優先順序、負責人、子任務、狀態追蹤,不含資料加密演算法。"}, {"id": 23, "cat": "AI Agent", "type": "概念", "q": "任務規劃器中,「優先順序(Priority)」的分類常運用下列哪一種工具?", "opts": ["波特五力分析", "PDCA循環", "SWOT分析", "艾森豪矩陣"], "ans": 3, "exp": "筆記:優先順序通常分高、中、低,可運用「艾森豪矩陣」來分類。"}, {"id": 24, "cat": "AI Agent", "type": "概念", "q": "「解決方案圖譜(Solution Graph)」的關鍵字是?", "opts": ["分散式儲存、副本機制", "隨機抽樣、過採樣", "動態路徑規劃、回溯能力", "資料加密、身分驗證"], "ans": 2, "exp": "筆記:解決方案圖譜關鍵字為「動態路徑規劃、回溯能力」。"}, {"id": 25, "cat": "AI Agent", "type": "概念", "q": "解決方案圖譜的四個核心節點不包含下列何者?", "opts": ["策略/方向(Strategy/Approach)", "資料庫正規化程度(Normal Form)", "核心問題(Problem/Goal)", "預期成效(Impact/Metric)"], "ans": 1, "exp": "解決方案圖譜四核心節點:核心問題、策略/方向、具體方案(Solution/Feature)、預期成效,不含正規化程度。"}, {"id": 26, "cat": "AI Agent", "type": "概念", "q": "「多代理系統(Multi-Agent System, MAS)」的定義為何?", "opts": ["單一AI代理獨立完成所有任務的封閉系統", "專門用於清洗資料的ETL工具", "由多個自主互動的代理在共同環境中,透過協作、分工與溝通解決複雜問題的分散式運算架構", "一種僅用於加密通訊的網路協定"], "ans": 2, "exp": "筆記定義MAS是由多個自主互動的Agent在共同環境中,透過協作分工溝通解決複雜問題的分散式運算架構。"}, {"id": 27, "cat": "AI Agent", "type": "概念", "q": "MAS(多代理系統)的核心組成不包含下列何者?", "opts": ["溝通(Communication)", "環境(Environment)", "Agent(代理)", "資料倉儲(Data Warehouse)"], "ans": 3, "exp": "MAS核心組成為:Agent、環境、溝通、規則(Rules),不含資料倉儲。"}, {"id": 28, "cat": "AI Agent", "type": "概念", "q": "MAS三種互動關係中,「機器人搬貨」屬於哪一種類型?", "opts": ["競爭", "隔離", "合作", "混合"], "ans": 2, "exp": "筆記表格:合作類型範例是「機器人搬貨」,一起完成任務。"}, {"id": 29, "cat": "AI Agent", "type": "概念", "q": "MAS三種互動關係中,「遊戲AI」屬於哪一種類型?", "opts": ["沙箱", "合作", "競爭", "混合"], "ans": 2, "exp": "筆記表格:競爭類型範例是「遊戲AI」,彼此對抗。"}, {"id": 30, "cat": "AI Agent", "type": "概念", "q": "MAS三種互動關係中,「市場經濟」屬於哪一種類型?", "opts": ["混合(合作+競爭)", "純合作", "純競爭", "隔離"], "ans": 0, "exp": "筆記表格:混合類型(合作+競爭)範例是「市場經濟」。"}, {"id": 31, "cat": "AI Agent", "type": "概念", "q": "「駕馭工程(Harness Engineering)」的核心概念最貼切的說法是?", "opts": ["只用於清洗訓練資料的前處理技術", "不是在改AI的大腦(模型),而是設計「牽繩+控制台」來駕馭它", "一種硬體加速晶片的設計方法", "直接修改模型權重以改變其人格"], "ans": 1, "exp": "筆記:Harness Engineering「不是在改AI的大腦(模型),而是在設計牽繩+控制台來駕馭它」。"}, {"id": 32, "cat": "AI Agent", "type": "概念", "q": "Harness Engineering所做的事情不包含下列何者?", "opts": ["模型參數的反向傳播訓練(Backpropagation)", "評估與測試(Evaluation)", "輸出約束(Output Constraint)", "輸入控制(Input Control)"], "ans": 0, "exp": "Harness Engineering在做的事:輸入控制、流程編排、工具整合、輸出約束、評估與測試,不含反向傳播訓練(那屬於模型訓練本身)。"}, {"id": 33, "cat": "AI Agent", "type": "概念", "q": "關於Harness與Prompt Engineering的關係,筆記中的描述為何?", "opts": ["Prompt Engineering是Harness的一部分", "Harness是Prompt Engineering的一部分", "兩者完全無關,不存在包含關係", "Prompt Engineering可以取代整個Harness架構"], "ans": 0, "exp": "筆記表格:Prompt Engineering與Harness的關係是「Harness的一部分」。"}, {"id": 34, "cat": "AI Agent", "type": "概念", "q": "關於Harness與Tool Calling的關係,筆記中的描述為何?", "opts": ["Tool Calling負責何時啟動Harness", "Harness與Tool Calling互不影響", "Harness負責何時用工具", "兩者是同一件事,沒有主從關係"], "ans": 2, "exp": "筆記表格:Tool Calling與Harness的關係是「Harness負責何時用工具」。"}, {"id": 35, "cat": "AI Agent", "type": "情境", "q": "公司想開發一套系統,能自動規劃「撰寫市場分析報告」的步驟、上網搜尋最新數據、寫初稿、自我檢查資料是否有缺漏並回頭補搜尋,最後由審稿Agent做品質把關。這最符合下列哪個概念的範例?", "opts": ["單純的Prompt Engineering", "HDFS分散式儲存", "Agentic Workflow", "ACID交易特性"], "ans": 2, "exp": "此範例正是筆記中Agentic Workflow的範例:Planning拆四步→Tool Use搜尋→撰寫初稿→Reflection自我檢查→Multi-agent審稿Agent把關。"}, {"id": 36, "cat": "AI Agent", "type": "情境", "q": "某企業導入零信任架構,系統中有一個角色專門「評估使用者的存取條件是否符合政策,並做出是否放行的判斷」,但實際攔截連線的是另一個元件。請問這個「做判斷」的角色是?", "opts": ["PEP(策略執行點)", "MAS(多代理系統)", "SOUL.md", "PDP(策略決策點)"], "ans": 3, "exp": "負責評估條件、下達存取許可的是PDP(大腦/法官),而實際攔截或放行連線的是PEP(守門員)。"}, {"id": 37, "cat": "AI Agent", "type": "情境", "q": "一個新創團隊資源有限,想用比GPT-4更小的模型,搭配特定領域的「代理技能」套件,來完成專業客服任務,並期望效果不輸給直接用大模型。這個做法呼應了筆記中的哪個觀念?", "opts": ["只有大模型才能使用代理技能", "小型模型+技能 也可以超過大模型", "代理技能必須搭配Hadoop才能運作", "代理技能只適用於影像辨識任務"], "ans": 1, "exp": "筆記明確提到「小型模型+技能 也可以超過大模型」,呼應此團隊的做法。"}, {"id": 38, "cat": "AI Agent", "type": "情境", "q": "某AI新創想讓自家AI助理有一致的說話語氣與人格,並用簡單的Markdown文字檔記錄這些人格特質設定,方便隨時編輯與版本控管。他們最可能會建立哪一類檔案?", "opts": ["SOUL.md", "Dockerfile", "requirements.txt", ".gitignore"], "ans": 0, "exp": "SOUL.md正是用來定義AI「靈魂」與人格特質的純文字Markdown檔案。"}, {"id": 39, "cat": "AI Agent", "type": "情境", "q": "一間物流公司希望AI Agent系統未來可以隨時「抽換」其中的地圖模組或付款模組,而不影響其他部分運作。這最符合下列哪個設計原則帶來的核心價值?", "opts": ["成本效益→可持續", "模組化架構→可擴展", "安全治理→可控管", "確定性驗證→可相信"], "ans": 1, "exp": "「可拆、可換、可擴充」正是模組化架構解決「系統太難改」問題後帶來的「可擴展」核心價值。"}, {"id": 40, "cat": "AI Agent", "type": "情境", "q": "某公司的AI客服常常因為API呼叫成本過高導致部門無法長期負擔,後來透過精簡呼叫次數與快取回應大幅降低費用。這主要體現了下列哪個面向?", "opts": ["安全治理(Safety & Governance)", "模組化架構(Modular Architecture)", "確定性驗證(Deterministic Verification)", "成本效益(Cost Efficiency)"], "ans": 3, "exp": "解決「太貴用不起」、讓系統「用得起、撐得久」正是成本效益面向,核心價值為可持續。"}, {"id": 41, "cat": "AI Agent", "type": "情境", "q": "一個團隊組建了「研究員Agent」「撰寫Agent」「審稿Agent」,三者分別被賦予不同角色(Role)、目標(Goal)與任務(Task),彼此協作完成一份報告。此團隊最可能是用下列哪個框架建構?", "opts": ["Regex", "HDFS", "CrewAI", "SMOTE"], "ans": 2, "exp": "用角色、目標、任務定義多AI協作,正是CrewAI的直覺設計方式。"}, {"id": 42, "cat": "AI Agent", "type": "情境", "q": "某電商平台想打造一個系統,讓「推薦Agent」與「庫存Agent」能進行複雜的多對多對話,並根據不同事件(如缺貨、促銷開始)觸發對應流程。這最適合採用下列哪個框架?", "opts": ["ACID", "CrewAI", "Microsoft AutoGen", "Regex"], "ans": 2, "exp": "擅長處理複雜、多對多AI對話與事件驅動工作流,正是Microsoft AutoGen的特色。"}, {"id": 43, "cat": "AI Agent", "type": "情境", "q": "一個專案經理正在規劃團隊工作,列出「撰寫產品行銷企劃」這項任務,設定7月31日截止,標記為高優先,指派給小美負責,並拆成「發想文案」「設計版面」兩個子任務,狀態標為「進行中」。這整套安排最符合下列哪個工具/概念的核心組成?", "opts": ["Harness Engineering", "解決方案圖譜(Solution Graph)", "多代理系統(MAS)", "任務規劃器(Task Planner)"], "ans": 3, "exp": "任務名稱、截止日期、優先順序、負責人、子任務、狀態追蹤正是任務規劃器的核心組成要素。"}, {"id": 44, "cat": "AI Agent", "type": "情境", "q": "一間顧問公司畫出一張圖:中間是「降低客訴率」的核心問題,延伸出「改善出貨流程」與「加強客服訓練」兩個策略方向,再各自對應具體行動方案與預期能降低客訴的百分比指標。這張圖最符合下列哪個概念?", "opts": ["HDFS架構圖", "解決方案圖譜(Solution Graph)", "ETL流程圖", "雷達圖(Radar Chart)"], "ans": 1, "exp": "核心問題→策略方向→具體方案→預期成效四個節點,正是解決方案圖譜的標準結構。"}, {"id": 45, "cat": "AI Agent", "type": "情境", "q": "某遊戲公司開發多個AI角色,這些角色在遊戲世界(環境)中彼此可能結盟合作攻打王城,也可能互相競爭資源,整體行為由一套規則約束。這個系統最適合被稱為?", "opts": ["單一AI Agent", "多代理系統(MAS)", "ETL Pipeline", "Harness Engineering"], "ans": 1, "exp": "多個自主互動代理在共同環境中,依規則進行協作或競爭,正是MAS的定義與三種互動關係(合作/競爭/混合)。"}, {"id": 46, "cat": "AI安全與對齊", "type": "概念", "q": "「對齊校準(Alignment)」的核心概念拆解為以下哪三者?", "opts": ["輸入對齊、輸出對齊、成本對齊", "目標對齊、行為對齊、價值對齊", "時間對齊、空間對齊、語言對齊", "資料對齊、模型對齊、硬體對齊"], "ans": 1, "exp": "筆記:Alignment核心概念拆解為目標對齊(Goal Alignment)、行為對齊(Behavior Alignment)、價值對齊(Value Alignment)。"}, {"id": 47, "cat": "AI安全與對齊", "type": "概念", "q": "用「開車」比喻Alignment、RLHF、Safety,下列何者正確?", "opts": ["三者比喻完全相同,沒有區別", "Alignment=交通規則;RLHF=目的地;Safety=教練指導", "Alignment=教練指導;RLHF=交通規則;Safety=目的地", "Alignment=正確的目的地;RLHF=教練在旁指導;Safety=交通規則+安全帶+煞車"], "ans": 3, "exp": "筆記開車比喻:Alignment是「你要去正確的目的地」,RLHF是「教練在旁邊指導你怎麼開」,Safety是「交通規則+安全帶+煞車」。"}, {"id": 48, "cat": "AI安全與對齊", "type": "概念", "q": "在Alignment / RLHF / Safety比較表中,三者的「核心定位」依序為何?", "opts": ["方法(How)、限制(Guardrail)、目標(Why)", "限制(Guardrail)、目標(Why)、方法(How)", "目標(Why)、方法(How)、限制(Guardrail)", "三者核心定位相同,皆為目標"], "ans": 2, "exp": "筆記比較表:Alignment核心定位是目標(Why),RLHF是方法(How),Safety是限制(Guardrail)。"}, {"id": 49, "cat": "AI安全與對齊", "type": "概念", "q": "在Alignment / RLHF / Safety比較表中,三者的「層級」依序為何?", "opts": ["Safety最上層、RLHF執行層、Alignment中層", "Alignment最上層(理念)、RLHF中層(技術手段)、Safety執行層(防護機制)", "Alignment執行層、RLHF最上層、Safety中層", "三者屬於同一層級,無高低之分"], "ans": 1, "exp": "筆記比較表:Alignment是最上層(理念)、RLHF是中層(技術手段)、Safety是執行層(防護機制)。"}, {"id": 50, "cat": "AI安全與對齊", "type": "概念", "q": "Alignment / RLHF / Safety三者「是否為技術」的比較,下列何者正確?", "opts": ["Alignment是訓練方法;RLHF是概念/目標;Safety是系統設計", "三者皆屬於技術方法,沒有區別", "三者皆非技術,純屬理念", "Alignment是概念/目標(非技術);RLHF是訓練方法;Safety是系統設計"], "ans": 3, "exp": "筆記比較表:Alignment為「❌概念/目標」,RLHF為「✅訓練方法」,Safety為「✅系統設計」。"}, {"id": 51, "cat": "AI安全與對齊", "type": "概念", "q": "關於Alignment、RLHF、Safety三者之間的關係,下列何者正確?", "opts": ["三者彼此獨立,沒有包含關係", "Safety包含Alignment與RLHF", "RLHF包含Alignment與Safety", "Alignment包含RLHF與Safety;RLHF是Alignment的一種方法;Safety是Alignment的一部分"], "ans": 3, "exp": "筆記比較表「關係」列:Alignment包含RLHF & Safety;RLHF是Alignment的一種方法;Safety是Alignment的一部分。"}, {"id": 52, "cat": "AI安全與對齊", "type": "概念", "q": "RLHF(人類回饋強化學習)一句話核心概念為何?", "opts": ["先用人類評分,再讓AI學會基本能力", "先進行資料清洗,再進行資料加密", "完全不需要人類參與,由AI自行評分", "先讓AI學會基本能力,再用人類評分去調整它的行為"], "ans": 3, "exp": "筆記:「RLHF =『先讓AI學會基本能力 → 再用人類評分去調整它的行為』」。"}, {"id": 53, "cat": "AI安全與對齊", "type": "概念", "q": "RLHF的三個主要步驟依序為何?", "opts": ["預訓練(Pretraining)→人類回饋(Human Feedback)→強化學習(Reinforcement Learning)", "資料清洗→模型部署→紅隊演練", "人類回饋→預訓練→強化學習", "強化學習→人類回饋→預訓練"], "ans": 0, "exp": "筆記:RLHF三個主要步驟為預訓練、人類回饋、強化學習。"}, {"id": 54, "cat": "AI安全與對齊", "type": "概念", "q": "「憲法型AI(Constitutional AI)」的核心概念為何?", "opts": ["讓AI不只靠人類打分數,而是自己依據一套明確規則(憲法)來判斷對錯並修正行為", "透過對抗性攻擊測試模型的穩健性", "在模型中植入後門以便日後控制", "完全依賴人類即時打分數來訓練AI,不使用任何規則"], "ans": 0, "exp": "筆記:憲法型AI核心是讓AI「自己依據一套明確規則(憲法)」來判斷對錯並修正行為,而不只靠人類打分數。"}, {"id": 55, "cat": "AI安全與對齊", "type": "概念", "q": "「後門攻擊(Backdoor Attack)」的定義為何?", "opts": ["模擬真實駭客行為的資安攻防實戰測試", "攻擊者在模型中植入後門,使其在特定觸發條件下產生預設的錯誤輸出", "把惡意指令藏在AI會讀取的外部網頁中", "透過對輸入做微小修改使模型產生錯誤輸出以測試模型"], "ans": 1, "exp": "筆記:後門攻擊是攻擊者在模型中植入後門,使其在特定觸發條件下產生預設的錯誤輸出。"}, {"id": 56, "cat": "AI安全與對齊", "type": "概念", "q": "「對抗性攻擊(Adversarial Attack)」的定義為何?", "opts": ["通過對輸入數據進行微小且不易察覺的修改,使AI模型產生錯誤輸出,用於測試模型", "將惡意指令藏在Email或PDF中誘使AI執行", "在模型訓練階段植入永久性後門程式", "利用人類評分來強化模型行為"], "ans": 0, "exp": "筆記:對抗性攻擊是通過對輸入數據做微小且不易察覺的修改,使AI模型產生錯誤輸出的攻擊方式,用於測試模型。"}, {"id": 57, "cat": "AI安全與對齊", "type": "概念", "q": "「對抗性穩健(Adversarial Robustness)」指的是什麼能力?", "opts": ["機器學習模型面對惡意設計的對抗樣本時,仍能維持其預測準確性、抵抗攻擊的能力", "模型能夠自動產生新的訓練資料的能力", "模型面對缺失值時自動填補的能力", "模型壓縮參數以節省記憶體的能力"], "ans": 0, "exp": "筆記:對抗性穩健是模型面對惡意設計的對抗樣本時,仍能維持預測準確性、抵抗攻擊的能力。"}, {"id": 58, "cat": "AI安全與對齊", "type": "概念", "q": "「提示注入攻擊(Prompt Injection)」的定義為何?", "opts": ["將惡意程式碼植入模型的訓練資料集中", "利用K個最近鄰進行插值合成新樣本", "在資料傳輸過程中加密內容以防竊聽", "透過精心設計的輸入(提示詞),騙過模型原本設定的開發者指令(System Prompt)"], "ans": 3, "exp": "筆記:提示注入攻擊(也稱降低提示攻擊)是透過精心設計的輸入,騙過模型原本設定的開發者指令(System Prompt)。"}, {"id": 59, "cat": "AI安全與對齊", "type": "概念", "q": "「間接提示注入(Indirect Prompt Injection)」與一般提示注入最大的不同在於?", "opts": ["只能針對圖片辨識模型有效", "需要事先取得模型的原始碼才能執行", "必須由使用者親自在對話框輸入惡意指令", "惡意指令暗中藏在AI會主動讀取的外部資源(如網頁、PDF或Email)中,而非直接輸入給AI"], "ans": 3, "exp": "筆記:間接提示注入是將惡意指令暗中藏在AI會主動讀取的外部資源中,誘使AI誤將這些指令當作合法命令執行。"}, {"id": 60, "cat": "AI安全與對齊", "type": "概念", "q": "「紅隊演練(Red Teaming)」的定義為何?", "opts": ["一種將類別特徵轉換為數值的編碼方式", "一種模擬真實駭客行為的資安攻防實戰測試", "一種將資料切割成多塊分散儲存的技術", "一種訓練AI模型基本語言能力的預訓練方法"], "ans": 1, "exp": "筆記:紅隊演練是一種模擬真實駭客行為的資安攻防實戰測試。"}, {"id": 61, "cat": "AI安全與對齊", "type": "概念", "q": "關於「偏差(Bias)」的敘述,下列何者正確?", "opts": ["偏差是指模型對訓練資料過度擬合造成的誤差", "偏差只會發生在影像辨識模型中", "偏差與訓練資料的分布完全無關", "模型對特定族群或特徵產生系統性錯誤傾向,源自訓練資料不平衡或演算法設計缺陷,屬於欠擬合"], "ans": 3, "exp": "筆記:偏差是模型對特定族群或特徵產生系統性錯誤傾向,源自訓練資料不平衡或演算法設計缺陷,屬於欠擬合。"}, {"id": 62, "cat": "AI安全與對齊", "type": "概念", "q": "「隔離(Isolation)」在安全機制中的核心目的與關係為何?", "opts": ["核心目的是提升模型準確率", "核心目的是安全測試,控制風險行為", "核心目的是分開風險,屬於基礎防護", "核心目的是判斷誰可信,決定是否允許通過"], "ans": 2, "exp": "筆記表格:隔離(Isolation)核心目的是「分開風險」,關係是「基礎防護」。"}, {"id": 63, "cat": "AI安全與對齊", "type": "概念", "q": "「信任邊界(Trust Boundary)」的核心目的為何?", "opts": ["分開風險,作為基礎防護", "修正資料品質", "判斷誰可信,決定是否允許通過", "進行安全測試,控制風險行為"], "ans": 2, "exp": "筆記表格:信任邊界核心目的是「判斷誰可信」,關係是「決定是否允許通過」。"}, {"id": 64, "cat": "AI安全與對齊", "type": "概念", "q": "「沙箱(Sandbox)」的核心目的與關係為何?", "opts": ["核心目的是安全測試,關係是控制風險行為", "核心目的是分開風險,關係是基礎防護", "核心目的是提升運算速度", "核心目的是判斷誰可信,關係是決定是否允許通過"], "ans": 0, "exp": "筆記表格:沙箱核心目的是「安全測試」,關係是「控制風險行為」。"}, {"id": 65, "cat": "AI安全與對齊", "type": "概念", "q": "「資料淨化」與「資料驗證」的差異,下列敘述何者正確?", "opts": ["資料淨化只發生在資料輸入前,資料驗證只發生在資料整理時", "資料淨化目的是修正資料、動作是改資料;資料驗證目的是檢查資料、動作是擋資料", "兩者發生的時機完全相同,沒有先後之分", "資料淨化目的是檢查資料;資料驗證目的是修正資料"], "ans": 1, "exp": "筆記:資料淨化(目的:修正資料,時機:資料整理時,動作:改資料) vs 資料驗證(目的:檢查資料,時機:資料輸入/使用前,動作:擋資料)。"}, {"id": 66, "cat": "AI安全與對齊", "type": "概念", "q": "依照筆記中的安全全流程圖,使用者輸入後的第一個處理步驟是什麼?", "opts": ["資料淨化(修正品質)", "內容過濾(控制輸出)", "輸入消毒(防攻擊)", "AI模型處理"], "ans": 2, "exp": "全流程圖:使用者輸入→輸入消毒(防攻擊)→資料驗證(確認合理)→資料淨化(修正品質)→AI模型處理→內容過濾(控制輸出)→安全結果。"}, {"id": 67, "cat": "AI安全與對齊", "type": "概念", "q": "依照筆記中的安全全流程圖,「內容過濾」發生在流程的哪個階段?", "opts": ["使用者輸入之前", "資料淨化之前,用來防攻擊", "AI模型處理之後,用來控制輸出", "與資料驗證同時發生,確認資料合理性"], "ans": 2, "exp": "全流程圖顯示內容過濾(控制輸出)發生在AI模型處理之後,最終產生安全結果。"}, {"id": 68, "cat": "AI安全與對齊", "type": "概念", "q": "「差分隱私(Differential Privacy)」的核心定義為何?", "opts": ["一種評估模型是否過擬合的統計方法", "一種用來加速模型訓練的記憶體運算技術", "一種將資料切分至多台機器儲存的分片技術", "一種先進的數據匿名化與數學框架,旨在進行數據分析和機器學習時保護個人隱私"], "ans": 3, "exp": "筆記:差分隱私是一種先進的數據匿名化與數學框架,旨在進行數據分析和機器學習時保護個人隱私。"}, {"id": 69, "cat": "AI安全與對齊", "type": "概念", "q": "下列哪一項在Alignment / RLHF / Safety比較表中,被歸類為「失敗會怎樣」對應Safety的敘述?", "opts": ["AI產生危險輸出", "AI資料外洩", "AI做錯方向(價值錯)", "AI學錯偏好"], "ans": 0, "exp": "筆記比較表:失敗情形中,Alignment失敗是「AI做錯方向(價值錯)」,RLHF失敗是「AI學錯偏好」,Safety失敗是「AI產生危險輸出」。"}, {"id": 70, "cat": "AI安全與對齊", "type": "概念", "q": "在Alignment / RLHF / Safety比較表中,「如何實現」欄位對應RLHF的方式為何?", "opts": ["多種方法(含RLHF)", "人類標註+強化學習", "規則、過濾、監控", "資料淨化與驗證"], "ans": 1, "exp": "筆記比較表:RLHF的「如何實現」是「人類標註+強化學習」;Alignment是「多種方法(含RLHF)」;Safety是「規則、過濾、監控」。"}, {"id": 71, "cat": "AI安全與對齊", "type": "概念", "q": "下列何者屬於Alignment / RLHF / Safety比較表中「例子」欄位所對應的Safety範例?", "opts": ["人類評分回答好壞", "不偏見、公平、可信", "資料匿名化處理", "阻擋違法/危險內容"], "ans": 3, "exp": "筆記比較表:Safety對應的例子是「阻擋違法/危險內容」;Alignment例子是「不偏見、公平、可信」;RLHF例子是「人類評分回答好壞」。"}, {"id": 72, "cat": "AI安全與對齊", "type": "情境", "q": "使用者在對話框中刻意輸入一段話,企圖讓AI忽略原本開發者設定的系統指令,轉而執行使用者想要的違規行為。這是下列哪種攻擊手法?", "opts": ["後門攻擊(Backdoor Attack)", "資料分片攻擊", "提示注入攻擊(Prompt Injection)", "差分隱私攻擊"], "ans": 2, "exp": "直接透過精心設計的輸入騙過模型的System Prompt,正是提示注入攻擊的定義。"}, {"id": 73, "cat": "AI安全與對齊", "type": "情境", "q": "攻擊者在一個公開網頁裡暗藏一段隱形文字指令,當AI瀏覽並讀取這個網頁內容時,誤把該指令當成使用者的合法命令執行,導致資料外洩。這屬於下列哪種攻擊?", "opts": ["差分隱私(Differential Privacy)", "資料淨化", "間接提示注入(Indirect Prompt Injection)", "紅隊演練(Red Teaming)"], "ans": 2, "exp": "惡意指令藏在AI會主動讀取的外部資源(如網頁)中,誘使AI誤執行,正是間接提示注入的定義。"}, {"id": 74, "cat": "AI安全與對齊", "type": "情境", "q": "某銀行資安團隊模擬駭客攻擊自家的AI客服系統,嘗試各種手法看是否能誘導其洩漏客戶資料,以此找出系統弱點並修補。這項活動屬於下列哪個概念?", "opts": ["資料分片(Data Sharding)", "紅隊演練(Red Teaming)", "序數編碼(Ordinal Encoding)", "差分隱私(Differential Privacy)"], "ans": 1, "exp": "模擬真實駭客行為的資安攻防實戰測試,正是紅隊演練的定義。"}, {"id": 75, "cat": "AI安全與對齊", "type": "情境", "q": "研究人員發現某AI人臉辨識模型,對某個特定膚色族群的辨識錯誤率明顯高於其他族群,追查後發現是因為訓練資料中該族群樣本數過少所致。這最符合下列哪個概念?", "opts": ["提示注入攻擊(Prompt Injection)", "偏差(Bias)", "對抗性攻擊(Adversarial Attack)", "後門攻擊(Backdoor Attack)"], "ans": 1, "exp": "模型對特定族群產生系統性錯誤傾向,源自訓練資料不平衡,正是偏差(Bias)的定義。"}, {"id": 76, "cat": "AI安全與對齊", "type": "情境", "q": "開發團隊在正式上線AI程式碼助理前,先讓它在一個獨立、與正式環境隔離的虛擬環境中執行陌生程式碼,確認不會影響到公司真正的系統與資料。這個獨立環境屬於下列哪個概念?", "opts": ["差分隱私(Differential Privacy)", "資料淨化", "信任邊界(Trust Boundary)", "沙箱(Sandbox)"], "ans": 3, "exp": "讓AI在隔離環境中執行陌生程式碼以進行安全測試、控制風險行為,正是沙箱的核心目的。"}, {"id": 77, "cat": "AI安全與對齊", "type": "情境", "q": "政府統計單位想公布某地區的平均所得資料,同時避免有心人士能反推出特定個人的所得金額,因此在資料中加入經過數學設計的雜訊。這最符合下列哪個技術?", "opts": ["紅隊演練(Red Teaming)", "資料分片(Data Sharding)", "SMOTE過採樣", "差分隱私(Differential Privacy)"], "ans": 3, "exp": "加入數學設計的雜訊以保護個人隱私、同時仍能進行統計分析,正是差分隱私的核心作法。"}, {"id": 78, "cat": "AI安全與對齊", "type": "情境", "q": "某模型開發商先用大量文本讓模型具備基本語言能力,接著請大量標註員對模型不同回答的好壞進行評分,最後用這些評分回饋進一步調整模型行為。這個流程最符合下列哪個技術的三步驟?", "opts": ["Constitutional AI(憲法型AI)", "SMOTE", "差分隱私", "RLHF(人類回饋強化學習)"], "ans": 3, "exp": "預訓練→人類回饋→強化學習,正是RLHF的三個主要步驟。"}, {"id": 79, "cat": "AI安全與對齊", "type": "情境", "q": "攻擊者事先在模型訓練資料中埋入一組特殊圖案,平時模型辨識正常,但只要輸入圖片右下角出現這個特殊圖案,模型就會被觸發、固定輸出攻擊者指定的錯誤分類結果。這屬於下列哪種攻擊?", "opts": ["後門攻擊(Backdoor Attack)", "間接提示注入", "對抗性攻擊(Adversarial Attack)", "差分隱私"], "ans": 0, "exp": "攻擊者在模型中植入後門,使其在特定觸發條件(特殊圖案)下產生預設的錯誤輸出,正是後門攻擊的定義。"}, {"id": 80, "cat": "法規與治理", "type": "概念", "q": "EU AI Act(歐盟人工智慧法案)的三大核心為何?", "opts": ["自動化程度、運算速度、雲端整合", "四大風險評級、人類監督、透明度", "分散式儲存、副本機制、容錯能力", "資料加密、模型壓縮、成本控管"], "ans": 1, "exp": "筆記:EU AI Act三大核心為「四大風險評級、人類監督、透明度」。"}, {"id": 81, "cat": "法規與治理", "type": "概念", "q": "EU AI Act中,「不可接受風險(Unacceptable Risk)」的規範重點為何?", "opts": ["必須告知這是AI", "直接禁止使用", "幾乎無限制", "需風險評估、資料品質、可追蹤性、人類監督"], "ans": 1, "exp": "筆記:不可接受風險規範重點是「直接禁止使用」,因其對人權或安全構成重大威脅。"}, {"id": 82, "cat": "法規與治理", "type": "概念", "q": "下列何者屬於EU AI Act中「不可接受風險」的典型案例?", "opts": ["社會信用評分(政府評分人民)", "垃圾郵件過濾", "醫療診斷AI", "AI客服Chatbot"], "ans": 0, "exp": "筆記:不可接受風險典型案例為社會信用評分(政府評分人民)、操控人類行為的AI(如誘導兒童危險行為)。"}, {"id": 83, "cat": "法規與治理", "type": "概念", "q": "EU AI Act中,「高風險(High Risk)」的AI應用,是否被允許使用?", "opts": ["可用,但需嚴格監管", "可用,但只需口頭告知使用者", "完全禁止使用", "可自由使用,幾乎無限制"], "ans": 0, "exp": "筆記:高風險「✅可用,但需嚴格監管」,因其對生命、安全、基本權利有影響。"}, {"id": 84, "cat": "法規與治理", "type": "概念", "q": "下列何者屬於EU AI Act中「高風險」的典型案例?", "opts": ["推薦系統", "社會信用評分", "貸款審核、招聘篩選", "垃圾郵件過濾"], "ans": 2, "exp": "筆記:高風險典型案例包含醫療診斷AI、貸款審核、招聘篩選、交通(自駕車)。"}, {"id": 85, "cat": "法規與治理", "type": "概念", "q": "EU AI Act中,「高風險」AI的規範重點包含下列何者?", "opts": ["完全無規範限制", "必須告知這是AI即可,無其他規範", "需風險評估、資料品質、可追蹤性、人類監督", "直接禁止使用"], "ans": 2, "exp": "筆記:高風險規範重點為需風險評估、資料品質、可追蹤性、人類監督。"}, {"id": 86, "cat": "法規與治理", "type": "概念", "q": "EU AI Act中,「有限風險(Limited Risk)」的規範重點為何?", "opts": ["直接禁止使用", "幾乎無限制", "必須告知「這是AI」", "需風險評估與人類監督"], "ans": 2, "exp": "筆記:有限風險「✅可用,但需透明揭露」,規範重點是必須告知使用者這是AI。"}, {"id": 87, "cat": "法規與治理", "type": "概念", "q": "下列何者屬於EU AI Act中「有限風險」的典型案例?", "opts": ["社會信用評分", "Chatbot、AI客服、深偽(Deepfake)", "醫療診斷AI", "垃圾郵件過濾"], "ans": 1, "exp": "筆記:有限風險典型案例為Chatbot、AI客服、深偽(Deepfake)。"}, {"id": 88, "cat": "法規與治理", "type": "概念", "q": "EU AI Act中,「最低風險(Minimal Risk)」的規範重點與典型案例為何?", "opts": ["直接禁止使用;案例如社會信用評分", "必須告知這是AI;案例如深偽(Deepfake)", "需嚴格監管;案例如醫療診斷AI", "幾乎無限制;案例如垃圾郵件過濾、遊戲AI、推薦系統"], "ans": 3, "exp": "筆記:最低風險幾乎無風險,可自由使用,規範重點幾乎無限制,典型案例為垃圾郵件過濾、遊戲AI、推薦系統。"}, {"id": 89, "cat": "法規與治理", "type": "概念", "q": "「負責任的AI(Responsible AI, RAI)」六大核心原則,依順序排列第一項為何?", "opts": ["隱私(Privacy)", "可解釋性(Explainability)", "公平性(Fairness)", "透明性(Transparency)"], "ans": 2, "exp": "筆記:RAI六大核心原則順序第1項為公平性Fairness,關鍵字記憶為「不歧視」。"}, {"id": 90, "cat": "法規與治理", "type": "概念", "q": "RAI六大核心原則中,「可解釋性(Explainability)」的關鍵字記憶為何?", "opts": ["看得懂", "說得出原因", "出事有人負責", "不歧視"], "ans": 1, "exp": "筆記:可解釋性(Explainability)關鍵字記憶為「說得出原因」,排序第3項。"}, {"id": 91, "cat": "法規與治理", "type": "概念", "q": "RAI六大核心原則中,「可靠性(Reliability)」的關鍵字記憶為何?", "opts": ["出事有人負責", "做得準、不亂來", "保護資料", "看得懂"], "ans": 1, "exp": "筆記:可靠性(Reliability)排序第4項,關鍵字記憶為「做得準、不亂來」。"}, {"id": 92, "cat": "法規與治理", "type": "概念", "q": "RAI六大核心原則中,排序第6項、關鍵字為「出事有人負責」的原則是?", "opts": ["公平性(Fairness)", "透明性(Transparency)", "隱私(Privacy)", "責任(Accountability)"], "ans": 3, "exp": "筆記:RAI第6項原則為責任(Accountability),關鍵字記憶「出事有人負責」。"}, {"id": 93, "cat": "法規與治理", "type": "概念", "q": "在RAI與AI風險治理對應表中,「訓練資料偏差」對應的RAI原則與解決方法為何?", "opts": ["對應Reliability原則,解決方法為RAG、Fact Checking", "對應Privacy原則,解決方法為差分隱私、資料匿名化", "對應Fairness原則,解決方法為Bias Detection、資料平衡", "對應Explainability原則,解決方法為XAI、LIME、SHAP"], "ans": 2, "exp": "筆記對應表:訓練資料偏差→Fairness→Bias Detection、資料平衡。"}, {"id": 94, "cat": "法規與治理", "type": "概念", "q": "在RAI與AI風險治理對應表中,「黑盒決策」問題對應的RAI原則與解決方法為何?", "opts": ["對應Explainability原則,解決方法為XAI、LIME、SHAP", "對應Security原則,解決方法為Robust Training", "對應Human Oversight,解決方法為人機協作審核", "對應Fairness原則,解決方法為Bias Detection"], "ans": 0, "exp": "筆記對應表:黑盒決策→Explainability→XAI、LIME、SHAP。"}, {"id": 95, "cat": "法規與治理", "type": "概念", "q": "在RAI與AI風險治理對應表中,「AI幻覺」問題對應的RAI原則與解決方法為何?", "opts": ["對應Reliability原則,解決方法為RAG、Fact Checking", "對應Fairness原則,解決方法為資料平衡", "對應Security原則,解決方法為Red Team", "對應Privacy原則,解決方法為差分隱私"], "ans": 0, "exp": "筆記對應表:AI幻覺→Reliability→RAG、Fact Checking。"}, {"id": 96, "cat": "法規與治理", "type": "概念", "q": "「監理沙盒(Regulatory Sandbox)」最貼切的類比與定義為何?", "opts": ["是專門用來訓練AI模型的GPU叢集", "有點像遊戲封測,是政府或監管機構設計的安全試驗環境,讓企業在有限範圍內測試創新產品,同時暫時放寬部分法規限制", "是企業內部用來加密資料的沙箱環境,與政府監管無關", "是用來過濾垃圾郵件的演算法"], "ans": 1, "exp": "筆記:監理沙盒「有點像遊戲封測」,由政府或監管機構設計安全試驗環境,讓企業在有限範圍內測試創新產品或服務,同時暫時放寬部分法規限制。"}, {"id": 97, "cat": "法規與治理", "type": "情境", "q": "某政府計畫建立一套系統,依人民的言行舉止給予信用評分,分數低者將被限制搭乘大眾運輸工具。依EU AI Act的風險分級,這套系統會被歸類為?", "opts": ["有限風險,只需告知這是AI", "最低風險,可自由使用", "高風險,但可嚴格監管後上線", "不可接受風險(Unacceptable Risk),應直接禁止"], "ans": 3, "exp": "社會信用評分(政府評分人民)正是筆記中不可接受風險的典型案例,規範重點是直接禁止使用。"}, {"id": 98, "cat": "法規與治理", "type": "情境", "q": "一家銀行導入AI系統來自動審核房屋貸款申請,決定是否核貸與利率高低。依EU AI Act,此系統應歸類為何種風險等級,並適用什麼規範?", "opts": ["不可接受風險,應直接禁止使用", "最低風險,幾乎無限制", "有限風險,只需告知使用者這是AI", "高風險,需風險評估、資料品質、可追蹤性、人類監督"], "ans": 3, "exp": "貸款審核是筆記中高風險的典型案例,需嚴格監管,包括風險評估、資料品質、可追蹤性、人類監督。"}, {"id": 99, "cat": "法規與治理", "type": "情境", "q": "某電商網站上線一個AI客服機器人與消費者對話,但沒有告知消費者對方是AI而非真人客服。依EU AI Act精神,這樣的作法最主要違反了哪個風險等級的規範重點?", "opts": ["最低風險的無限制規定", "不可接受風險的完全禁止規定", "有限風險規範中「必須告知這是AI」的要求", "高風險的人類監督要求"], "ans": 2, "exp": "Chatbot、AI客服屬於有限風險,規範重點是必須告知使用者「這是AI」,未告知即違反此規範。"}, {"id": 100, "cat": "法規與治理", "type": "情境", "q": "某AI招募系統被發現對特定性別的求職者評分系統性偏低,追查發現是訓練資料本身分布不均所致。依RAI風險治理對應表,這個問題應優先對應哪個RAI原則與解決方法?", "opts": ["Security原則,採用Robust Training", "Privacy原則,採用差分隱私", "Reliability原則,採用RAG", "Fairness原則,採用Bias Detection、資料平衡"], "ans": 3, "exp": "訓練資料偏差對應Fairness原則,解決方法為Bias Detection、資料平衡,正符合此招募系統評分偏差的情境。"}, {"id": 101, "cat": "法規與治理", "type": "情境", "q": "某醫療AI診斷系統做出判斷後,醫生完全無法理解模型為何下此結論,難以向病患解釋。依RAI風險治理對應表,這最符合下列哪個問題與解決方法?", "opts": ["AI幻覺問題,對應Reliability原則", "訓練資料偏差問題,對應Fairness原則", "黑盒決策問題,對應Explainability原則,可用XAI、LIME、SHAP", "個資洩漏問題,對應Privacy原則"], "ans": 2, "exp": "模型決策不可理解正是「黑盒決策」問題,對應Explainability原則,解決方法包含XAI、LIME、SHAP。"}, {"id": 102, "cat": "法規與治理", "type": "情境", "q": "某國金融監管機關允許一家新創公司在限定1000名用戶、交易金額上限新台幣10萬元、為期六個月的條件下,測試其新型AI投資顧問服務,並全程監控其運作。這個安排最符合下列哪個機制?", "opts": ["紅隊演練(Red Teaming)", "監理沙盒(Regulatory Sandbox)", "多代理系統(MAS)", "差分隱私(Differential Privacy)"], "ans": 1, "exp": "限制用戶數、金額、時間並由政府全程監控,正是監理沙盒的風險控制與監管觀察機制。"}, {"id": 103, "cat": "基礎演算法", "type": "概念", "q": "線性搜尋(Linear Search)的核心概念與速度為何?", "opts": ["核心概念是每次切一半,速度快,用途為排序資料", "核心概念是一個一個找,速度慢,用途為小資料", "核心概念是一層一層找,速度中等,用途為最短路徑", "核心概念是走到底,速度中等,用途為路徑探索"], "ans": 1, "exp": "筆記表格:線性搜尋核心概念「一個一個找」,速度「慢」,用途「小資料」。"}, {"id": 104, "cat": "基礎演算法", "type": "概念", "q": "二分搜尋(Binary Search)的核心概念、速度與用途為何?", "opts": ["走到底;速度中等;用途為路徑探索", "每次切一半;速度快;用途為排序資料", "一層一層;速度中等;用途為最短路徑", "一個一個找;速度慢;用途為小資料"], "ans": 1, "exp": "筆記表格:二分搜尋核心概念「每次切一半」,速度「快」,用途「排序資料」(前提資料須已排序)。"}, {"id": 105, "cat": "基礎演算法", "type": "概念", "q": "DFS(深度優先搜尋)的核心概念為何?", "opts": ["每次切一半", "一個一個找", "一層一層", "走到底"], "ans": 3, "exp": "筆記表格:DFS(深度優先搜尋)核心概念是「走到底」,速度中等,用途為路徑探索(就像走迷宮)。"}, {"id": 106, "cat": "基礎演算法", "type": "概念", "q": "BFS(廣度優先搜尋)的用途最常被用於下列何者?", "opts": ["已排序資料的快速查找", "最短路徑(如同剝洋蔥般一層一層搜尋)", "路徑探索(像走迷宮)", "小資料的逐一查找"], "ans": 1, "exp": "筆記表格:BFS核心概念「一層一層」,速度中等,用途為「最短路徑(剝洋蔥)」。"}, {"id": 107, "cat": "基礎演算法", "type": "概念", "q": "下列搜尋演算法中,哪一個的比喻是「像走迷宮」,核心概念為走到底?", "opts": ["Linear(線性搜尋)", "BFS(廣度優先搜尋)", "DFS(深度優先搜尋)", "Binary(二分搜尋)"], "ans": 2, "exp": "筆記:DFS用途描述為「路徑探索(就像走迷宮)」,核心概念是走到底。"}, {"id": 108, "cat": "基礎演算法", "type": "概念", "q": "正規表達式(Regular Expression, Regex)的核心定義為何?", "opts": ["一種將類別特徵轉為數值的編碼方式", "透過特定的字元與符號組成「樣式(Pattern)」,用於快速進行字串的搜尋、比對與取代", "一種用來加密資料庫連線的協定", "一種分散式檔案儲存系統"], "ans": 1, "exp": "筆記:Regex是透過特定字元與符號組成樣式(Pattern),讓開發者快速進行字串的搜尋、比對與取代。"}, {"id": 109, "cat": "基礎演算法", "type": "概念", "q": "Regex在AI領域中的用途,下列何者最主要用於「輸入過濾(Input Filtering)」?", "opts": ["壓縮模型參數以節省記憶體", "移除垃圾字元、抓特定欄位如電話、Email", "檢查prompt是否包含敏感字,避免AI被誘導", "防止使用者輸入惡意內容,過濾SQL injection、腳本攻擊"], "ans": 3, "exp": "筆記:Regex的輸入過濾(Input Filtering)用途是防止使用者輸入惡意內容,過濾SQL injection、腳本攻擊。"}, {"id": 110, "cat": "基礎演算法", "type": "概念", "q": "Regex用於「資料前處理(Data Cleaning)」時,主要功能為何?", "opts": ["檢查prompt是否包含敏感字", "訓練神經網路模型的權重", "移除垃圾字元、抓取特定欄位(如電話、Email),例如清理客服對話紀錄", "防止SQL injection攻擊"], "ans": 2, "exp": "筆記:Regex在資料前處理的用途是移除垃圾字元、抓特定欄位(電話、Email),例如清理客服對話紀錄。"}, {"id": 111, "cat": "基礎演算法", "type": "情境", "q": "小明要在Google Maps上規劃從家裡到公司「距離最短」的路線,系統會一層一層擴散搜尋鄰近路口,直到找到目的地。這個過程最類似下列哪種搜尋演算法?", "opts": ["Linear(線性搜尋)", "DFS(深度優先搜尋)", "BFS(廣度優先搜尋)", "Binary(二分搜尋)"], "ans": 2, "exp": "一層一層搜尋以找出最短路徑,正是BFS的核心概念與用途。"}, {"id": 112, "cat": "基礎演算法", "type": "情境", "q": "客服部門想從大量的客服對話紀錄中,自動抓出所有出現的電話號碼與Email地址,並清除其中夾雜的亂碼與垃圾字元。這項工作最適合使用下列哪個工具?", "opts": ["正規表達式(Regex)", "ACID原則", "差分隱私", "BFS廣度優先搜尋"], "ans": 0, "exp": "抓取特定欄位(電話、Email)並清理垃圾字元,正是Regex在資料前處理(Data Cleaning)的典型應用。"}, {"id": 113, "cat": "資料工程", "type": "概念", "q": "關於ETL的本質,下列敘述何者正確?", "opts": ["ETL是Apache基金會發行的一套特定軟體", "ETL不是一個特定的軟體,而是一種概念與流程", "ETL是一種程式語言,專門用來寫SQL查詢", "ETL是一種硬體儲存設備的品牌名稱"], "ans": 1, "exp": "筆記明確指出:「ETL不是一個特定的軟體,而是一種概念與流程」。"}, {"id": 114, "cat": "資料工程", "type": "概念", "q": "ETL流程中的「E(Extract)」步驟指的是什麼?", "opts": ["將資料清洗、格式轉換", "將轉換好的資料寫入最終目的地", "將資料切割成多個區塊分散儲存", "將原始資料讀取出來"], "ans": 3, "exp": "筆記:E(Extract)萃取是將原始資料讀取出來。"}, {"id": 115, "cat": "資料工程", "type": "概念", "q": "ETL流程中的「T(Transform)」步驟指的是什麼?", "opts": ["將資料寫入最終目的地", "為資料製作三份備份", "將原始資料讀取出來", "對原始資料進行清洗、格式轉換等"], "ans": 3, "exp": "筆記:T(Transform)轉換是對原始資料進行清洗、格式轉換等處理。"}, {"id": 116, "cat": "資料工程", "type": "概念", "q": "ETL流程中的「L(Load)」步驟指的是什麼?", "opts": ["將原始資料讀取出來", "對資料進行清洗與格式轉換", "將轉換好、有價值的資料,寫入最終的目的地", "將資料切成小塊分散運算"], "ans": 2, "exp": "筆記:L(Load)載入是將轉換好、有價值的資料,寫入最終的目的地。"}, {"id": 117, "cat": "資料工程", "type": "概念", "q": "Hadoop的核心由哪兩個主要部分組成?", "opts": ["ETL與ACID", "HDFS(儲存)與MapReduce(運算)", "Spark SQL與Spark Streaming", "NameNode與Regex"], "ans": 1, "exp": "筆記:Hadoop核心由HDFS(儲存)與MapReduce(運算)兩個主要部分組成。"}, {"id": 118, "cat": "資料工程", "type": "概念", "q": "Hadoop中「MapReduce」的運算邏輯為何?", "opts": ["把所有資料和中間結果都放進記憶體(RAM)運算", "透過艾森豪矩陣分類任務優先順序", "把任務拆小,分給各台電腦一起算(Map),最後再把結果加總(Reduce)", "用雜湊函數決定資料要存到哪個節點"], "ans": 2, "exp": "筆記:MapReduce邏輯是「把任務拆小,分給各台電腦一起算(Map),最後再把結果加總(Reduce)」。"}, {"id": 119, "cat": "資料工程", "type": "概念", "q": "Spark是為了解決下列哪個問題而誕生的?", "opts": ["HDFS無法備份資料", "ACID無法保證交易一致性", "Regex無法處理中文字串", "Hadoop MapReduce速度太慢"], "ans": 3, "exp": "筆記:Spark是「解決Hadoop MapReduce速度太慢而誕生」的快取記憶體(In-Memory)運算引擎。"}, {"id": 120, "cat": "資料工程", "type": "概念", "q": "Spark的「記憶體運算(In-Memory)」特性指的是什麼?", "opts": ["用雜湊函數決定資料儲存位置", "為每個資料區塊製作3份複本", "把所有的資料和中間運算結果都放在記憶體(RAM)裡面", "把資料切割成128MB或256MB的區塊分散儲存"], "ans": 2, "exp": "筆記:Spark記憶體運算是把所有資料和中間運算結果都放在記憶體(RAM)裡面,因此速度快。"}, {"id": 121, "cat": "資料工程", "type": "概念", "q": "Spark被稱為「全能型架構」,是因為它內建了下列哪些模組?", "opts": ["PDP、PEP、SOUL.md", "機器學習(MLlib)、串流資料處理(Spark Streaming)、SQL查詢(Spark SQL)", "Linear、Binary、DFS、BFS搜尋演算法", "NameNode、DataNode、Block"], "ans": 1, "exp": "筆記:Spark全能型架構除基本資料處理外,還內建MLlib(機器學習)、Spark Streaming(串流處理)、Spark SQL(SQL查詢)。"}, {"id": 122, "cat": "資料工程", "type": "概念", "q": "關於ETL與Hadoop、Spark三者本質上的不同,下列敘述何者正確?", "opts": ["ETL是方法論/流程;Hadoop和Spark是工具/平台", "Hadoop是方法論,Spark和ETL都是工具", "三者本質完全相同,可以互相替代", "ETL是工具/平台;Hadoop和Spark是方法論/流程"], "ans": 0, "exp": "筆記:「ETL是方法論/流程;Hadoop和Spark是工具/平台」,可以用Hadoop或Spark來執行ETL流程。"}, {"id": 123, "cat": "資料工程", "type": "概念", "q": "「雲端原生流派」的ETL工具,最大特色為何?", "opts": ["完全不需要雲端環境,只能在地端伺服器運作", "由AWS、GCP、Azure等雲端巨頭提供的託管服務,整合度最高", "僅限個人開發者免費使用", "只支援程式碼開發,無圖形介面"], "ans": 1, "exp": "筆記:若企業資料本來就存放在AWS、GCP或Azure上,直接用他們自家的託管服務整合度最高。"}, {"id": 124, "cat": "資料工程", "type": "概念", "q": "「圖形介面與企業級流派」的ETL工具最大特色為何?", "opts": ["完全依賴工程師撰寫Python或Scala程式碼", "僅適用於即時查詢(OLTP)情境", "擁有強大GUI,點選、拖拉元件就能畫出資料流(Data Pipeline),不需寫高深程式碼", "只負責萃取(E)與載入(L),不做轉換(T)"], "ans": 2, "exp": "筆記:圖形介面與企業級流派特色是擁有強大GUI,點選拖拉元件就能畫出資料流,屬於No-Code/Low-Code。"}, {"id": 125, "cat": "資料工程", "type": "概念", "q": "HDFS(Hadoop Distributed File System)通常將資料切割成多大的區塊?", "opts": ["通常為1GB或2GB", "通常為1KB或4KB", "通常為128MB或256MB", "通常為512位元組"], "ans": 2, "exp": "筆記:HDFS將龐大的資料集切割成多個區塊,通常為128MB或256MB。"}, {"id": 126, "cat": "資料工程", "type": "概念", "q": "HDFS預設情況下,會為每個資料區塊製作幾份複本?", "opts": ["2份", "5份", "3份", "1份"], "ans": 2, "exp": "筆記:「無限硬碟HDFS:預設情況下會為每個資料區塊製作3份複本」。"}, {"id": 127, "cat": "資料工程", "type": "概念", "q": "下列何者屬於HDFS「不適合」的應用情境?", "opts": ["批次處理(Batch Processing)", "即時查詢(如OLTP)、小檔案很多的情境", "大數據分析(Big Data)", "日誌分析(Log Analysis)"], "ans": 1, "exp": "筆記:HDFS不適合即時查詢(例如OLTP)與小檔案很多的情境;適合大數據分析、日誌分析、批次處理。"}, {"id": 128, "cat": "資料工程", "type": "概念", "q": "在HDFS架構的比喻中,「NameNode」的角色與職責為何?", "opts": ["負責產生隨機雜訊以保護隱私", "負責清洗資料格式的轉換工具", "總管理員,負責管理檔案目錄", "書架,負責真正儲存資料(block)"], "ans": 2, "exp": "筆記比喻:NameNode是「總管理員」,負責管理檔案目錄;DataNode是「書架」,負責真正儲存資料。"}, {"id": 129, "cat": "資料工程", "type": "概念", "q": "在HDFS架構的比喻中,「DataNode」的職責為何?", "opts": ["書架,真正儲存資料(block),並回報狀態給NameNode", "負責評估存取許可的決策者", "總管理員,負責管理檔案目錄", "負責產生資料視覺化圖表"], "ans": 0, "exp": "筆記比喻:DataNode是「書架」,負責真正儲存資料(block),並回報狀態給NameNode。"}, {"id": 130, "cat": "資料工程", "type": "概念", "q": "HDFS的三大關鍵設計為何?", "opts": ["範圍分片、雜湊分片、地理分片", "Atomicity、Consistency、Isolation", "Extract、Transform、Load", "Block(資料切塊)、Replication(副本機制)、Fault Tolerance(容錯能力)"], "ans": 3, "exp": "筆記:HDFS三大關鍵設計為Block(資料切塊)、Replication(副本機制)、Fault Tolerance(容錯能力)。"}, {"id": 131, "cat": "資料工程", "type": "概念", "q": "「資料分片(Data Sharding)」的核心目的為何?", "opts": ["讓系統更快、更能擴展(scalable)", "讓交易資料具備原子性", "讓AI模型的回答更有創意", "讓資料自動加上浮水印"], "ans": 0, "exp": "筆記:資料分片核心目的是「讓系統更快、更能擴展(scalable)」。"}, {"id": 132, "cat": "資料工程", "type": "概念", "q": "下列何者是用雜湊函數(Hash function)決定資料儲存位置的分片方式?", "opts": ["地理分片(Geo Sharding)", "範圍分片(Range Sharding)", "區塊分片(Block Sharding)", "雜湊分片(Hash Sharding)"], "ans": 3, "exp": "筆記:雜湊分片(Hash Sharding)用雜湊函數決定資料去哪。"}, {"id": 133, "cat": "資料工程", "type": "概念", "q": "ACID原則中的「A(Atomicity, 原子性)」概念為何?", "opts": ["交易不能只做一半", "一旦成功,資料永遠不會消失", "避免資料被同時修改造成錯誤", "資料不能違反規則"], "ans": 0, "exp": "筆記:ACID中A為Atomicity(原子性),概念是「交易不能只做一半」。"}, {"id": 134, "cat": "資料工程", "type": "概念", "q": "ACID原則中的「I(Isolation, 隔離性)」概念為何?", "opts": ["資料不能違反規則", "交易不能只做一半", "資料永遠不會消失", "避免「資料被同時修改造成錯誤」"], "ans": 3, "exp": "筆記:ACID中I為Isolation(隔離性),概念是避免資料被同時修改造成錯誤。"}, {"id": 135, "cat": "資料工程", "type": "概念", "q": "ACID原則中的「D(Durability, 持久性)」概念為何?", "opts": ["一旦交易成功,資料永遠不會消失", "交易不能只做一半", "避免資料同時被修改造成錯誤", "資料不能違反規則"], "ans": 0, "exp": "筆記:ACID中D為Durability(持久性),概念是一旦成功,資料永遠不會消失。"}, {"id": 136, "cat": "資料工程", "type": "情境", "q": "某公司將每天產生的大量日誌檔(log)先讀取出來,清洗掉不完整的紀錄並統一時間格式,最後寫入資料倉儲供分析使用。這整套流程最符合下列哪個概念?", "opts": ["MAS(多代理系統)", "ETL(萃取、轉換、載入)", "SMOTE", "差分隱私"], "ans": 1, "exp": "讀取原始資料(E)→清洗格式轉換(T)→寫入資料倉儲(L),正是ETL黃金流程的三步驟。"}, {"id": 137, "cat": "資料工程", "type": "情境", "q": "某電商公司把每天上億筆的交易紀錄丟進一套會自動切成128MB區塊、分散存放在多台伺服器並各自備份三份的儲存系統。這套系統最可能是?", "opts": ["Spark SQL", "HDFS(Hadoop Distributed File System)", "Regex", "SMOTE"], "ans": 1, "exp": "切成128MB或256MB區塊、分散儲存並預設備份3份複本,正是HDFS的特性。"}, {"id": 138, "cat": "資料工程", "type": "情境", "q": "一位工程師需要對高達數TB的資料進行極為複雜的多步驟清洗邏輯,他選擇用Python與Scala撰寫程式來完成,而非使用拖拉式的圖形化介面工具。他採用的是哪一種ETL工具流派?", "opts": ["現代SaaS雲端整合流派", "雲端原生流派", "程式碼流派", "圖形介面與企業級流派"], "ans": 2, "exp": "依賴工程師寫程式碼(Python、Scala、SQL)處理海量資料與複雜邏輯,正是程式碼流派的特色。"}, {"id": 139, "cat": "資料工程", "type": "情境", "q": "某資料團隊選擇一套現代SaaS工具,它強調快速上手、不需維護伺服器,但只負責把資料從來源系統抓出來、直接寫入資料倉儲,轉換邏輯則交由後續的SQL模型處理。這符合下列哪個ETL工具流派特色?", "opts": ["程式碼流派", "雲端原生流派", "圖形介面與企業級流派", "現代SaaS雲端整合流派(通常只負責E萃取和L載入)"], "ans": 3, "exp": "現代SaaS雲端整合流派因應現代資料技術棧而生,通常只負責E(萃取)和L(載入),即ELT模式。"}, {"id": 140, "cat": "資料工程", "type": "情境", "q": "某公司先把海量的原始交易紀錄存進Hadoop的HDFS(便宜又安全),接著工程師編寫程式,把資料從HDFS讀取出來、在記憶體中高速清洗與加總、最後把乾淨的資料載入資料倉儲供報表分析使用。這位工程師使用的高速記憶體運算引擎最可能是?", "opts": ["PEP", "Spark", "Regex", "HDFS的NameNode"], "ans": 1, "exp": "此描述正是筆記中「三者如何協同工作」的範例:Spark讀取HDFS資料,在記憶體中執行ETL流程。"}, {"id": 141, "cat": "資料工程", "type": "情境", "q": "某網路服務的使用者資料量太大,單一資料庫已無法負荷,工程團隊決定依照使用者所在的洲別(亞洲、歐洲、美洲)將資料庫拆成三個獨立的資料庫分開儲存與處理。這種做法屬於下列哪一種分片方式?", "opts": ["地理分片(Geo Sharding)", "範圍分片(Range Sharding)", "區塊分片", "雜湊分片(Hash Sharding)"], "ans": 0, "exp": "依地區(洲別)拆分資料庫,正是地理分片(Geo Sharding)的定義。"}, {"id": 142, "cat": "資料工程", "type": "情境", "q": "銀行轉帳系統在使用者從A帳戶轉100元到B帳戶時,若中途系統當機,絕不能出現「A帳戶已扣款但B帳戶沒收到錢」的情況,必須整筆交易同時成功或同時失敗。這最直接體現ACID原則中的哪一項?", "opts": ["Durability(持久性)", "Consistency(一致性)", "Isolation(隔離性)", "Atomicity(原子性)"], "ans": 3, "exp": "交易必須整筆同時成功或失敗,不能只做一半,正是Atomicity(原子性)的定義。"}, {"id": 143, "cat": "資料工程", "type": "情境", "q": "某資料庫在同一時間有兩位使用者同時修改同一筆訂單資料,系統設計必須確保這兩個操作不會互相干擾、造成資料錯亂。這最直接體現ACID原則中的哪一項?", "opts": ["Isolation(隔離性)", "Atomicity(原子性)", "Consistency(一致性)", "Durability(持久性)"], "ans": 0, "exp": "避免資料被同時修改造成錯誤,正是Isolation(隔離性)的定義。"}, {"id": 144, "cat": "資料處理與分析", "type": "概念", "q": "One-Hot編碼最適合用於下列哪種類型的資料?", "opts": ["無序的類別型資料", "連續型的數值資料", "有順序關係的類別資料", "二元的布林資料"], "ans": 0, "exp": "筆記:One-Hot編碼用於「無序」的「類別型」資料,例如紅、藍、綠等沒有大小順序的類別。"}, {"id": 145, "cat": "資料處理與分析", "type": "概念", "q": "將顏色「紅、藍、綠」以One-Hot編碼表示「藍」,結果應為下列何者?", "opts": ["[0, 0, 1]", "[1, 1, 0]", "[0, 1, 0]", "[1, 0, 0]"], "ans": 2, "exp": "筆記範例表:紅=[1,0,0]、藍=[0,1,0]、綠=[0,0,1],因此「藍」對應[0,1,0]。"}, {"id": 146, "cat": "資料處理與分析", "type": "概念", "q": "序數編碼(Ordinal Encoding)最適合用於下列哪種資料?", "opts": ["完全無順序關係的類別資料,如顏色", "有順序關係的類別資料,如「低、中、高、非常高」", "二元的是非資料", "文字自由輸入的資料"], "ans": 1, "exp": "筆記:序數編碼用於「有序類別」,例如低=0、中=1、高=2、非常高=3。"}, {"id": 147, "cat": "資料處理與分析", "type": "概念", "q": "依照筆記範例,序數編碼中「高」被編碼為下列哪個數值?", "opts": ["3", "2", "0", "1"], "ans": 1, "exp": "筆記範例:低=0,中=1,高=2,非常高=3。"}, {"id": 148, "cat": "資料處理與分析", "type": "概念", "q": "布林轉換編碼中,「True / 是 / Yes」會被編碼為下列何值?", "opts": ["2", "1", "0", "-1"], "ans": 1, "exp": "筆記:布林轉換編碼中True/是/Yes編碼為1,False/否/No編碼為0。"}, {"id": 149, "cat": "資料處理與分析", "type": "概念", "q": "數值標準化編碼(如Min-Max、Z-score)最適合用於下列哪種情境?", "opts": ["KNN、SVM、神經網路等對數值尺度敏感的模型,或不同單位的特徵(如年齡vs收入)", "只有無序類別型資料的情境", "只有布林二元資料的情境", "只有樹狀模型如決策樹的情境"], "ans": 0, "exp": "筆記:數值標準化適用於KNN、SVM、神經網路等對數值尺度敏感的模型,以及不同單位的特徵。"}, {"id": 150, "cat": "資料處理與分析", "type": "概念", "q": "Min-Max標準化通常會將數值壓縮到下列哪個範圍?", "opts": ["0~1", "-100~100", "-1~1", "沒有固定範圍"], "ans": 0, "exp": "筆記:Min-Max標準化範圍為0~1。"}, {"id": 151, "cat": "資料處理與分析", "type": "概念", "q": "Z-score標準化的結果,其平均值與標準差分別為何?", "opts": ["均值0,標準差1", "均值100,標準差10", "均值0,標準差100", "均值1,標準差0"], "ans": 0, "exp": "筆記:Z-score就是把數值轉換為均值0、標準差1的分布。"}, {"id": 152, "cat": "資料處理與分析", "type": "概念", "q": "「Z-score」的定義最貼切的說法為何?", "opts": ["某個數值是否經過One-Hot編碼", "某個數值,離平均值有幾個標準差", "某個數值是否為類別型資料", "某個數值,離最大值有幾個百分比"], "ans": 1, "exp": "筆記:「Z-score就是『某個數值,離平均值有幾個標準差?』」。"}, {"id": 153, "cat": "資料處理與分析", "type": "概念", "q": "全班數學平均70分、標準差10分,小明考85分,他的Z-score約為多少,代表什麼意思?", "opts": ["z=1.5,表示比平均高1.5個標準差(表現很好)", "z=15,表示考了15分", "z=85,表示考了85分", "z=0.5,表示比平均低0.5個標準差"], "ans": 0, "exp": "筆記範例:平均70/標準差10/小明85分,z=(85-70)/10=1.5,代表比平均高1.5個標準差,表現很好。"}, {"id": 154, "cat": "資料處理與分析", "type": "概念", "q": "下列哪一類模型「通常不需要」做數值標準化?", "opts": ["SVM(支援向量機)", "KNN(K最近鄰)", "神經網路", "樹狀模型(決策樹、隨機森林、XGBoost)"], "ans": 3, "exp": "筆記:「樹狀模型(決策樹、隨機森林、XGBoost)通常不需要標準化」,因為其分裂規則不受數值尺度影響。"}, {"id": 155, "cat": "資料處理與分析", "type": "概念", "q": "「探索性資料分析(EDA)」最核心的一句話定義為何?", "opts": ["只針對數值型資料進行分析,不看類別型資料", "直接跳過資料檢查,盡快訓練模型", "先看看資料長什麼樣子,再決定怎麼用它", "先建立預測模型,再回頭檢查資料"], "ans": 2, "exp": "筆記:EDA核心定義是「先看看資料長什麼樣子,再決定怎麼用它」。"}, {"id": 156, "cat": "資料處理與分析", "type": "概念", "q": "EDA(探索性資料分析)的目的不包含下列何者?", "opts": ["理解資料的結構(欄位、型態)", "發現異常值(outliers)", "檢查資料品質(缺失值、錯誤)", "直接產出最終的預測結果"], "ans": 3, "exp": "筆記:EDA目的包括理解結構、找出分佈、發現異常值、找出變數關係、檢查資料品質,但EDA「目的是理解資料,不是做預測」。"}, {"id": 157, "cat": "資料處理與分析", "type": "概念", "q": "如果沒有做EDA就直接建模,筆記中形容可能發生的結果是?", "opts": ["模型會自動變得更精準", "模型很容易學到錯誤資訊(垃圾進,垃圾出)", "資料會自動被加密", "訓練速度會大幅加快且不影響準確率"], "ans": 1, "exp": "筆記:「如果沒有EDA:模型很容易學到錯誤資訊(垃圾進,垃圾出)」。"}, {"id": 158, "cat": "資料處理與分析", "type": "概念", "q": "下列關於EDA的敘述,何者正確?", "opts": ["EDA等同於機器學習模型訓練", "EDA是資料分析的第一步,目的是「理解資料」,不是「做預測」", "EDA是資料分析的最後一步,用來驗證預測結果", "EDA只能用於文字資料,不能用於數值資料"], "ans": 1, "exp": "筆記明確指出:「EDA是資料分析的第一步,目的是『理解資料』,不是『做預測』」。"}, {"id": 159, "cat": "資料處理與分析", "type": "概念", "q": "四大資料分析方法中,「敘述性分析(Descriptive Analytics)」要回答的核心問題是什麼?", "opts": ["發生了什麼?(What happened?)", "資料中有哪些模式?(What patterns exist?)", "為什麼會發生?(Why did it happen?)", "未來可能發生什麼?(What will happen?)"], "ans": 0, "exp": "筆記表格:敘述性分析核心問題是「發生了什麼?(What happened?)」,目的是描述過去已發生的事件。"}, {"id": 160, "cat": "資料處理與分析", "type": "概念", "q": "「本月營收為500萬元,比上月增加8%」屬於四大資料分析方法中的哪一種?", "opts": ["預測性分析(Predictive Analytics)", "診斷性分析(Diagnostic Analytics)", "敘述性分析(Descriptive Analytics)", "探索性分析(Exploratory Analytics)"], "ans": 2, "exp": "筆記表格範例:「本月營收為500萬元,比上月增加8%」正是敘述性分析(Descriptive)的範例。"}, {"id": 161, "cat": "資料處理與分析", "type": "概念", "q": "四大資料分析方法中,「探索性分析(Exploratory Analytics)」要回答的核心問題與常用技術為何?", "opts": ["核心問題是「為什麼會發生?」,常用技術為根因分析、回歸分析", "核心問題是「未來會發生什麼?」,常用技術為機器學習、時間序列", "核心問題是「發生了什麼?」,常用技術為統計分析與報表", "核心問題是「資料中有哪些特徵或模式?」,常用技術為視覺化、群集分析、相關分析、降維分析"], "ans": 3, "exp": "筆記表格:探索性分析核心問題是資料中有哪些特徵或模式,常用技術為視覺化、群集分析、相關分析、降維分析。"}, {"id": 162, "cat": "資料處理與分析", "type": "概念", "q": "「發現年輕客群偏好使用行動支付」屬於四大資料分析方法中的哪一種範例?", "opts": ["探索性分析(Exploratory Analytics)", "預測性分析(Predictive Analytics)", "診斷性分析(Diagnostic Analytics)", "敘述性分析(Descriptive Analytics)"], "ans": 0, "exp": "筆記表格範例:「發現年輕客群偏好使用行動支付」屬於探索性分析,找出未知的規律與關聯。"}, {"id": 163, "cat": "資料處理與分析", "type": "概念", "q": "四大資料分析方法中,「診斷性分析(Diagnostic Analytics)」要回答的核心問題與常用技術為何?", "opts": ["核心問題是「發生了什麼?」,常用技術為統計分析、報表", "核心問題是「未來會發生什麼?」,常用技術為機器學習、迴歸模型", "核心問題是「資料中有哪些模式?」,常用技術為視覺化、群集分析", "核心問題是「為什麼會發生?」,常用技術為根因分析、回歸分析、假設檢定、因果分析"], "ans": 3, "exp": "筆記表格:診斷性分析核心問題是為什麼會發生,常用技術為根因分析、回歸分析、假設檢定、因果分析。"}, {"id": 164, "cat": "資料處理與分析", "type": "概念", "q": "「發現營收下降是因為廣告投放減少30%」屬於四大資料分析方法中的哪一種範例?", "opts": ["探索性分析(Exploratory Analytics)", "預測性分析(Predictive Analytics)", "敘述性分析(Descriptive Analytics)", "診斷性分析(Diagnostic Analytics)"], "ans": 3, "exp": "筆記表格範例:「發現營收下降是因為廣告投放減少30%」正是診斷性分析,找出事件發生的原因。"}, {"id": 165, "cat": "資料處理與分析", "type": "概念", "q": "四大資料分析方法中,「預測性分析(Predictive Analytics)」的核心問題與常用技術為何?", "opts": ["核心問題是「未來可能會發生什麼?」,常用技術為機器學習、時間序列、迴歸模型、分類模型", "核心問題是「發生了什麼?」,常用技術為統計分析與報表", "核心問題是「為什麼發生?」,常用技術為根因分析", "核心問題是「資料中有哪些模式?」,常用技術為視覺化"], "ans": 0, "exp": "筆記表格:預測性分析核心問題是未來可能發生什麼,常用技術為機器學習、時間序列、迴歸模型、分類模型。"}, {"id": 166, "cat": "資料處理與分析", "type": "概念", "q": "「預測下個月營收約為540萬元」屬於四大資料分析方法中的哪一種範例?", "opts": ["預測性分析(Predictive Analytics)", "敘述性分析(Descriptive Analytics)", "探索性分析(Exploratory Analytics)", "診斷性分析(Diagnostic Analytics)"], "ans": 0, "exp": "筆記表格範例:「預測下個月營收約為540萬元」正是預測性分析,根據歷史資料預測未來。"}, {"id": 167, "cat": "資料處理與分析", "type": "概念", "q": "iPAS AI應用規劃師記憶口訣「看現況、找規律、查原因、預未來」,依序對應四大分析方法的順序為何?", "opts": ["診斷性→預測性→敘述性→探索性", "探索性→敘述性→預測性→診斷性", "敘述性→探索性→診斷性→預測性", "預測性→診斷性→探索性→敘述性"], "ans": 2, "exp": "筆記口訣對應:敘述性→看現況,探索性→找規律,診斷性→查原因,預測性→預未來。"}, {"id": 168, "cat": "資料處理與分析", "type": "概念", "q": "「對數轉換(Log Transform)」的主要作用不包含下列何者?", "opts": ["縮小數據範圍,消除極端值的負面影響", "把資料的類別型欄位轉換為One-Hot編碼", "把右偏分佈變成正態(常態)分佈", "將乘法關係轉化為加法關係"], "ans": 1, "exp": "對數轉換的作用是把右偏分布變常態、縮小數據範圍消除極端值影響、將乘法關係轉為加法關係,與One-Hot編碼無關。"}, {"id": 169, "cat": "資料處理與分析", "type": "概念", "q": "進行對數轉換時,必須遵守的兩個鐵律為何?", "opts": ["數據不能有0或負數;結果記得逆轉換", "數據必須先做One-Hot編碼;結果不需逆轉換", "數據必須是類別型;結果需要加密", "數據必須先標準化;結果需要四捨五入"], "ans": 0, "exp": "筆記:對數轉換兩個必須遵守的鐵律為「數據不能有0或負數」及「結果記得逆轉換」。"}, {"id": 170, "cat": "資料處理與分析", "type": "概念", "q": "SMOTE的全名為何?", "opts": ["Synthetic Minority Over-sampling Technique(合成少數類別過採樣技術)", "Sequential Machine Output Testing Environment", "Sampled Multi-Objective Training Evaluation", "Standard Model Optimization Training Engine"], "ans": 0, "exp": "筆記:SMOTE全名是Synthetic Minority Over-sampling Technique,中文為合成少數類別過採樣技術。"}, {"id": 171, "cat": "資料處理與分析", "type": "概念", "q": "SMOTE技術主要用來解決下列哪種問題?", "opts": ["類別型資料無法編碼的問題", "資料遺漏值過多的問題", "模型訓練速度太慢的問題", "資料不平衡(Imbalanced Data)問題"], "ans": 3, "exp": "筆記:SMOTE是用來解決資料不平衡(Data Imbalance)問題的重要技術。"}, {"id": 172, "cat": "資料處理與分析", "type": "概念", "q": "SMOTE的核心做法為何?", "opts": ["根據少數類別的鄰近樣本,透過插值(Interpolation)產生新的合成樣本,而非複製原始資料", "刪除多數類別的樣本以達到平衡", "將所有類別資料都轉換為One-Hot編碼", "直接複製少數類別的原始樣本以增加數量"], "ans": 0, "exp": "筆記:SMOTE核心做法是根據少數類別鄰近樣本,透過插值產生新的合成樣本,而不是複製原始資料。"}, {"id": 173, "cat": "資料處理與分析", "type": "概念", "q": "SMOTE在尋找鄰居時,採用下列哪種方法?", "opts": ["隨機森林分類", "K個最近鄰(K-Nearest Neighbors)", "主成分分析(PCA)", "階層式分群"], "ans": 1, "exp": "筆記:SMOTE尋找鄰居的方法是K個最近鄰(K-Nearest Neighbors)。"}, {"id": 174, "cat": "資料處理與分析", "type": "概念", "q": "傳統的Random Oversampling(隨機過採樣)最容易產生的問題是?", "opts": ["無法處理數值型資料", "運算速度過慢", "容易過度擬合", "容易造成資料外洩"], "ans": 2, "exp": "筆記:「傳統的Random Oversampling(隨機過採樣)容易過度擬合」,而SMOTE正是為改善此問題而生。"}, {"id": 175, "cat": "資料處理與分析", "type": "概念", "q": "SMOTE的優點包含下列何者?", "opts": ["完全不會引入任何雜訊", "有效擴充少數類別資料,避免模型過度擬合,提升模型整體泛化能力與準確率", "可以直接處理遺漏值問題", "不需要K最近鄰運算即可完成"], "ans": 1, "exp": "筆記:SMOTE優點是有效擴充少數類別資料,避免模型對少數類別過度死記硬背(過擬合),提升泛化能力與準確率。"}, {"id": 176, "cat": "資料處理與分析", "type": "概念", "q": "SMOTE的缺點包含下列何者?", "opts": ["只能用於文字資料,不能用於數值資料", "會直接刪除少數類別的原始樣本", "可能不小心引入雜訊,或在多維度空間中產生邊界模糊的無效樣本", "無法應用於決策樹或隨機森林模型"], "ans": 2, "exp": "筆記:SMOTE缺點是只考慮少數類別樣本本身,可能引入雜訊,或產生邊界模糊的無效樣本。"}, {"id": 177, "cat": "資料處理與分析", "type": "概念", "q": "關於SMOTE的使用時機,下列敘述何者正確?", "opts": ["通常只對訓練集使用,避免資料洩漏(Data Leakage)", "只能用於迴歸問題,不能用於分類問題", "必須同時對訓練集與測試集使用", "必須先對資料做對數轉換才能使用"], "ans": 0, "exp": "筆記:SMOTE常搭配決策樹、隨機森林、XGBoost、LightGBM、SVM等分類模型,通常只對訓練集使用,避免資料洩漏。"}, {"id": 178, "cat": "資料處理與分析", "type": "概念", "q": "「雷達圖(Radar Chart / Spider Chart)」最主要的視覺化特色為何?", "opts": ["把單一數值以長條圖方式呈現", "把時間序列資料以折線方式呈現趨勢", "把多個指標畫在一個圓上,形狀代表一個人(或物件)的能力輪廓", "把地理資料以地圖熱區方式呈現"], "ans": 2, "exp": "筆記:雷達圖就是把多個指標畫在一個圓上,這個形狀等於一個人的能力輪廓。"}, {"id": 179, "cat": "資料處理與分析", "type": "概念", "q": "雷達圖在「HR(人力資源)」領域最常見的應用為何?", "opts": ["學生能力分析", "人才評估", "健康指標", "客戶分析"], "ans": 1, "exp": "筆記表格:雷達圖在HR領域的應用是「人才評估」。"}, {"id": 180, "cat": "資料處理與分析", "type": "概念", "q": "雷達圖在「醫療」領域最常見的應用為何?", "opts": ["客戶分析", "健康指標", "人才評估", "玩家行為分析"], "ans": 1, "exp": "筆記表格:雷達圖在醫療領域的應用是「健康指標」。"}, {"id": 181, "cat": "資料處理與分析", "type": "概念", "q": "AI對雷達圖的應用不包含下列何者?", "opts": ["自動產生資料加密金鑰", "用雷達圖做異常偵測", "自動產生雷達圖(資料→視覺化)", "解讀雷達圖"], "ans": 0, "exp": "筆記列出AI對雷達圖的應用:自動產生、解讀、分類/分群、異常偵測、預測,不包含產生加密金鑰。"}, {"id": 182, "cat": "資料處理與分析", "type": "概念", "q": "「自動特徵工程(Automated Feature Engineering)」最貼切的比喻為何?", "opts": ["像資料庫管理員,負責備份與還原資料", "像資料整理助理,把原始欄位變成模型更容易學的訊號", "像資安人員,負責攔截惡意輸入", "像客服人員,負責回答使用者問題"], "ans": 1, "exp": "筆記:自動特徵工程可想成資料整理助理,把原始欄位變成更好學的訊號,減少人工反覆試欄位組合的時間。"}, {"id": 183, "cat": "資料處理與分析", "type": "概念", "q": "自動特徵工程在「信用風險」的實際案例中,是如何產生更有預測力的特徵?", "opts": ["刪除所有數值型欄位只保留類別型欄位", "只用單一的收入欄位進行預測,不做任何組合", "把收入、負債、交易頻率組合出比單一欄位更有預測力的特徵", "直接使用One-Hot編碼取代所有數值欄位"], "ans": 2, "exp": "筆記:信用風險案例是把收入、負債、交易頻率組合出比單一欄位更有預測力的特徵。"}, {"id": 184, "cat": "資料處理與分析", "type": "概念", "q": "自動特徵工程的「方法」欄位,常見做法包含下列何者?", "opts": ["紅隊演練與差分隱私", "交叉組合、統計聚合、時間窗特徵", "One-Hot編碼與序數編碼", "K最近鄰插值法"], "ans": 1, "exp": "筆記表格:自動特徵工程的方法為交叉組合、統計聚合、時間窗特徵。"}, {"id": 185, "cat": "資料處理與分析", "type": "概念", "q": "自動特徵工程的「輸入」欄位為何,以及為何強調資料需要「乾淨」?", "opts": ["輸入為原始表格資料,越乾淨越容易做出好特徵", "輸入為使用者的個人隱私資料,必須先加密", "輸入為已訓練完成的模型權重,不需考慮乾淨與否", "輸入為雷達圖的視覺化圖表"], "ans": 0, "exp": "筆記表格:自動特徵工程輸入是原始表格資料,越乾淨越容易做出好特徵。"}, {"id": 186, "cat": "資料處理與分析", "type": "情境", "q": "資料工程師要處理一個「顏色」欄位,裡面有紅、藍、綠三種類別,彼此沒有大小順序關係,他想把這個欄位轉換成模型能讀懂的數值格式。他最適合採用下列哪種編碼方式?", "opts": ["布林轉換", "One-Hot編碼", "對數轉換(Log Transform)", "序數編碼(Ordinal Encoding)"], "ans": 1, "exp": "顏色是無序類別型資料,最適合使用One-Hot編碼,分別建立獨立的0/1欄位。"}, {"id": 187, "cat": "資料處理與分析", "type": "情境", "q": "某問卷調查的「滿意度」欄位分為「低、中、高、非常高」四個等級,彼此有明確的順序關係。資料科學家最適合採用下列哪種編碼方式?", "opts": ["SMOTE過採樣", "差分隱私", "One-Hot編碼", "序數編碼(Ordinal Encoding)"], "ans": 3, "exp": "滿意度等級具有順序關係,最適合用序數編碼(低=0、中=1、高=2、非常高=3)。"}, {"id": 188, "cat": "資料處理與分析", "type": "情境", "q": "某資料集有「年齡」(數值範圍0~100)與「年收入」(數值範圍0~數百萬)兩個欄位,若直接放入KNN模型訓練,年收入會因數值範圍過大而主導距離計算。為了解決這個問題,最適合採取下列哪種做法?", "opts": ["使用正規表達式清理欄位", "對類別欄位做One-Hot編碼", "使用SMOTE過採樣少數類別", "對數值進行標準化(如Min-Max或Z-score)"], "ans": 3, "exp": "不同單位、尺度差異大的數值特徵(如年齡vs收入),適合用Min-Max或Z-score等數值標準化方式處理,這正是KNN等對尺度敏感模型的常見做法。"}, {"id": 189, "cat": "資料處理與分析", "type": "情境", "q": "小華的統計學考試,全班平均分數是70分,標準差是10分,小華考了50分。請問小華的Z-score約為多少,代表什麼意思?", "opts": ["z=-0.2,表示幾乎與平均相同", "z=-2,表示比平均低2個標準差(表現偏低)", "z=50,表示考了50分", "z=2,表示比平均高2個標準差"], "ans": 1, "exp": "z=(50-70)/10=-2,代表比平均低2個標準差,表現偏低,計算方式與筆記中小明85分z=1.5的範例一致。"}, {"id": 190, "cat": "資料處理與分析", "type": "情境", "q": "資料團隊使用XGBoost這種樹狀模型來做信用評分預測,有同事建議先對所有數值欄位做Z-score標準化再訓練。依照筆記內容,這個建議是否必要?", "opts": ["不必要,因為XGBoost只能處理類別型資料", "必要,因為所有機器學習模型都需要標準化", "絕對必要,否則XGBoost完全無法運作", "不一定必要,因為樹狀模型(決策樹、隨機森林、XGBoost)通常不需要標準化"], "ans": 3, "exp": "筆記明確指出樹狀模型(決策樹、隨機森林、XGBoost)通常不需要標準化,因為其分裂規則不受數值尺度影響。"}, {"id": 191, "cat": "資料處理與分析", "type": "情境", "q": "資料分析師拿到一份新資料集後,第一步是先檢查欄位型態、看資料分布、找異常值與缺失值,而不是急著建立預測模型。這個步驟屬於下列哪個概念?", "opts": ["自動特徵工程", "預測性分析(Predictive Analytics)", "探索性資料分析(EDA)", "SMOTE過採樣"], "ans": 2, "exp": "「先看看資料長什麼樣子,再決定怎麼用它」正是EDA的核心定義,EDA是資料分析第一步,目的是理解資料而非做預測。"}, {"id": 192, "cat": "資料處理與分析", "type": "情境", "q": "公司內部報表顯示「本季新客戶成長率為12%,較上季提升3個百分點」,這份報表最主要屬於四大分析方法中的哪一種?", "opts": ["敘述性分析(Descriptive Analytics)", "預測性分析(Predictive Analytics)", "探索性分析(Exploratory Analytics)", "診斷性分析(Diagnostic Analytics)"], "ans": 0, "exp": "單純描述已發生的統計數字(成長率),屬於敘述性分析,回答「發生了什麼」的問題。"}, {"id": 193, "cat": "資料處理與分析", "type": "情境", "q": "行銷團隊透過群集分析發現,消費者可以被分成三個明顯不同的族群,且過去沒有人注意到這種分群模式。這項發現最主要屬於四大分析方法中的哪一種?", "opts": ["探索性分析(Exploratory Analytics)", "預測性分析(Predictive Analytics)", "敘述性分析(Descriptive Analytics)", "診斷性分析(Diagnostic Analytics)"], "ans": 0, "exp": "透過群集分析找出未知的規律與分群,正是探索性分析的核心目的與常用技術。"}, {"id": 194, "cat": "資料處理與分析", "type": "情境", "q": "財務部門發現本季獲利大幅下滑,於是進行根因分析與假設檢定,最終確認是原物料成本上漲35%所致。這個分析過程屬於四大分析方法中的哪一種?", "opts": ["探索性分析(Exploratory Analytics)", "預測性分析(Predictive Analytics)", "敘述性分析(Descriptive Analytics)", "診斷性分析(Diagnostic Analytics)"], "ans": 3, "exp": "透過根因分析、假設檢定找出獲利下滑的原因,正是診斷性分析回答「為什麼會發生」的典型應用。"}, {"id": 195, "cat": "資料處理與分析", "type": "情境", "q": "電商平台利用時間序列模型與歷史銷售資料,推估下一季的訂單量大約會成長15%。這項工作屬於四大分析方法中的哪一種?", "opts": ["探索性分析(Exploratory Analytics)", "診斷性分析(Diagnostic Analytics)", "敘述性分析(Descriptive Analytics)", "預測性分析(Predictive Analytics)"], "ans": 3, "exp": "根據歷史資料用時間序列模型預測未來訂單量,正是預測性分析的定義與常用技術。"}, {"id": 196, "cat": "資料處理與分析", "type": "情境", "q": "某公司想分析「員工每月薪資」欄位,發現資料呈現極度右偏分佈(少數高階主管薪資極高,大多數員工薪資集中在較低區間),導致統計模型效果不佳。下列哪種處理方式最適合改善這個問題?", "opts": ["對薪資欄位做One-Hot編碼", "對薪資欄位做正規表達式清理", "對薪資欄位做SMOTE過採樣", "對薪資欄位做對數轉換(Log Transform)"], "ans": 3, "exp": "對數轉換的主要作用之一,就是把「右偏分佈」變成正態分佈,並縮小數據範圍、消除極端值的負面影響,適合處理薪資這類右偏資料。"}, {"id": 197, "cat": "資料處理與分析", "type": "情境", "q": "某銀行的詐騙交易偵測資料集中,正常交易佔99.5%,詐騙交易只佔0.5%,模型訓練時嚴重偏向多數類別。資料科學家決定只對訓練集,依詐騙樣本的K個最近鄰進行插值合成新樣本,以平衡資料。這最符合下列哪個技術?", "opts": ["對數轉換(Log Transform)", "One-Hot編碼", "差分隱私", "SMOTE(合成少數類別過採樣技術)"], "ans": 3, "exp": "依少數類別(詐騙交易)的K最近鄰插值合成新樣本以解決資料不平衡,正是SMOTE的核心做法,且只對訓練集使用以避免資料洩漏。"}, {"id": 198, "cat": "資料處理與分析", "type": "情境", "q": "某人資部門想比較一位求職者在「溝通能力」「邏輯思考」「團隊合作」「抗壓性」「創意」五個面向的綜合表現,並用一張圖呈現出其能力的整體輪廓。最適合使用下列哪種圖表?", "opts": ["長條圖", "圓餅圖", "折線圖", "雷達圖(Radar Chart)"], "ans": 3, "exp": "把多個指標畫在一個圓上呈現能力輪廓,正是雷達圖(Radar Chart/Spider Chart)的典型應用,尤其常見於HR人才評估。"}, {"id": 199, "cat": "資料處理與分析", "type": "情境", "q": "某電信公司想預測「哪些客戶即將流失」,工程師沒有手動一一嘗試欄位組合,而是讓系統自動從「登入次數」「最近互動時間」「購買間隔」中,自動找出能預測流失的特徵組合。這最符合下列哪個概念?", "opts": ["SMOTE過採樣", "差分隱私", "自動特徵工程(Automated Feature Engineering)", "探索性資料分析(EDA)"], "ans": 2, "exp": "筆記明確以「流失預測」為例:從登入次數、最近互動時間與購買間隔中自動找出能預測流失的組合,正是自動特徵工程的實際案例。"}, {"id": 200, "cat": "資料處理與分析", "type": "情境", "q": "某問卷欄位「是否願意推薦本產品給朋友」只有「願意」與「不願意」兩種答案,資料工程師要把它轉換成模型可用的數值。他最適合採用下列哪種編碼方式?", "opts": ["序數編碼", "對數轉換", "One-Hot編碼(三個以上類別)", "布林轉換編碼"], "ans": 3, "exp": "二元的是非型資料(願意/不願意)最適合用布林轉換編碼,將其轉為1與0。"}];
const STORAGE_KEY = "ai_quiz_history_v1";
const QUIZ_LEN = 20;

let session = null; // {questions, index, score, answers:[{q, chosen, correct}]}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function catSummary() {
  const counts = {};
  ALL_QUESTIONS.forEach(q => {
    counts[q.cat] = (counts[q.cat] || 0) + 1;
  });
  const el = document.getElementById('cat-summary');
  el.innerHTML = Object.entries(counts).map(([cat, n]) =>
    `<div><span>${cat}</span><span>${n} 題</span></div>`
  ).join('');
}
catSummary();

function hideAllScreens() {
  ['screen-start','screen-quiz','screen-result','screen-review','screen-history'].forEach(id => {
    document.getElementById(id).classList.add('hidden');
  });
}

function showStart() {
  hideAllScreens();
  document.getElementById('screen-start').classList.remove('hidden');
}

function startQuiz() {
  const picked = shuffle(ALL_QUESTIONS).slice(0, QUIZ_LEN);
  session = { questions: picked, index: 0, score: 0, answers: [] };
  hideAllScreens();
  document.getElementById('screen-quiz').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion() {
  const q = session.questions[session.index];
  document.getElementById('progress-text').textContent = `第 ${session.index + 1} / ${session.questions.length} 題`;
  document.getElementById('score-text').textContent = `目前得分:${session.score}`;
  document.getElementById('progress-fill').style.width = ((session.index) / session.questions.length * 100) + '%';
  document.getElementById('q-cat').textContent = q.cat;
  const typeTag = document.getElementById('q-type-tag');
  if (q.type === '情境') {
    typeTag.classList.remove('hidden');
    typeTag.textContent = '情境範例題';
  } else {
    typeTag.classList.add('hidden');
  }
  document.getElementById('q-text').textContent = q.q;
  const optsEl = document.getElementById('options');
  optsEl.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.opts.forEach((optText, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = `${letters[i]}. ${optText}`;
    btn.onclick = () => selectAnswer(i);
    optsEl.appendChild(btn);
  });
  document.getElementById('explain').classList.remove('show');
  document.getElementById('explain').textContent = '';
  document.getElementById('next-btn').disabled = true;
}

function selectAnswer(i) {
  const q = session.questions[session.index];
  const options = document.querySelectorAll('#options .option');
  options.forEach(o => o.disabled = true);
  const correct = i === q.ans;
  options[i].classList.add(correct ? 'correct' : 'wrong');
  if (!correct) {
    options[q.ans].classList.add('correct');
  }
  if (correct) session.score++;
  session.answers.push({
    q: q.q, cat: q.cat, type: q.type,
    chosen: q.opts[i], correctText: q.opts[q.ans], correct: correct, exp: q.exp
  });
  const explainEl = document.getElementById('explain');
  explainEl.textContent = (correct ? '✅ 答對了!' : '❌ 答錯了。') + ' 解析:' + q.exp;
  explainEl.classList.add('show');
  document.getElementById('next-btn').disabled = false;
  document.getElementById('score-text').textContent = `目前得分:${session.score}`;
}

function nextQuestion() {
  session.index++;
  if (session.index >= session.questions.length) {
    finishQuiz();
  } else {
    renderQuestion();
  }
}

function finishQuiz() {
  document.getElementById('progress-fill').style.width = '100%';
  const total = session.questions.length;
  const score = session.score;
  const pct = Math.round(score / total * 100);
  saveHistory(score, total, pct);

  hideAllScreens();
  document.getElementById('screen-result').classList.remove('hidden');
  document.getElementById('final-score').textContent = `${score} / ${total}`;
  let comment = '';
  if (pct >= 90) comment = '太厲害了,幾乎全對!';
  else if (pct >= 70) comment = '表現不錯,再加把勁!';
  else if (pct >= 50) comment = '及格邊緣,建議再複習一下筆記。';
  else comment = '還需要多加練習,別灰心!';
  document.getElementById('final-sub').textContent = `正確率 ${pct}% ・ ${comment}`;

  // build review screen content but keep hidden until requested via result screen button
  buildReview();
}

function buildReview() {
  const wrong = session.answers.filter(a => !a.correct);
  const listEl = document.getElementById('review-list');
  if (wrong.length === 0) {
    listEl.innerHTML = '<div class="history-empty">本次全部答對,沒有錯題!</div>';
  } else {
    listEl.innerHTML = wrong.map(a => `
      <div class="review-item">
        <div class="review-q">[${a.cat}] ${a.q}</div>
        <div class="review-ans no">您的答案:${a.chosen}</div>
        <div class="review-ans ok">正確答案:${a.correctText}</div>
        <div class="review-ans">解析:${a.exp}</div>
      </div>
    `).join('');
  }
  // add a link on the result screen to view review
  const sub = document.getElementById('final-sub');
  if (!document.getElementById('review-link')) {
    const link = document.createElement('div');
    link.id = 'review-link';
    link.style.textAlign = 'center';
    link.style.marginTop = '10px';
    link.innerHTML = '<span style="color:#4472C4;text-decoration:underline;cursor:pointer;" onclick="showReview()">查看本次錯題檢討</span>';
    sub.after(link);
  }
}

function showReview() {
  hideAllScreens();
  document.getElementById('screen-review').classList.remove('hidden');
}

function saveHistory(score, total, pct) {
  const history = loadHistoryRaw();
  history.unshift({
    date: new Date().toLocaleString('zh-TW'),
    score, total, pct
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(0, 200)));
}

function loadHistoryRaw() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function showHistory() {
  hideAllScreens();
  document.getElementById('screen-history').classList.remove('hidden');
  const history = loadHistoryRaw();
  const el = document.getElementById('history-content');
  if (history.length === 0) {
    el.innerHTML = '<div class="history-empty">尚無測驗紀錄,快去開始第一次測驗吧!</div>';
    return;
  }
  const avgPct = Math.round(history.reduce((s,h) => s + h.pct, 0) / history.length);
  const bestPct = Math.max(...history.map(h => h.pct));
  let html = `<div class="cat-grid" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:16px;">
    <div><span>總測驗次數</span><span>${history.length}</span></div>
    <div><span>平均正確率</span><span>${avgPct}%</span></div>
    <div><span>最佳正確率</span><span>${bestPct}%</span></div>
  </div>`;
  html += '<table><thead><tr><th>時間</th><th>得分</th><th>正確率</th></tr></thead><tbody>';
  history.forEach(h => {
    html += `<tr><td>${h.date}</td><td>${h.score} / ${h.total}</td><td>${h.pct}%</td></tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

function clearHistory() {
  if (confirm('確定要清除所有歷史測驗紀錄嗎?此動作無法復原。')) {
    localStorage.removeItem(STORAGE_KEY);
    showHistory();
  }
}

showStart();
</script>
