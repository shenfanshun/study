<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>多益商用單字卡</title>
<style>
  :root{
    --ink:#1a2b3c; --ink-soft:#5a6b7c; --paper:#f5f1e8; --card:#fffdf8;
    --gold:#c8a45c; --gold-deep:#a67c2e; --teal:#2b7a78; --teal-deep:#1f5c5a;
    --coral:#d96c5f; --line:#e4ddce; --shadow:rgba(40,50,60,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Georgia","Songti TC","Noto Serif TC",serif;
    background:
      radial-gradient(circle at 20% 10%, #efe8d6 0%, transparent 55%),
      radial-gradient(circle at 85% 90%, #e8ece6 0%, transparent 55%),
      var(--paper);
    color:var(--ink);display:flex;flex-direction:column;
    height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  header{
    padding:12px 20px 8px;text-align:center;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,253,248,.7), transparent);
  }
  .brand{font-size:11px;letter-spacing:4px;color:var(--gold-deep);text-transform:uppercase;font-family:"Helvetica Neue",sans-serif;font-weight:600;}
  .title{font-size:20px;margin-top:2px;font-weight:700;letter-spacing:1px;}
  .title small{font-size:12px;color:var(--ink-soft);font-weight:400;letter-spacing:0;}

  .cats{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;}
  .cats::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;padding:6px 14px;border-radius:20px;border:1px solid var(--line);
    background:var(--card);font-size:13px;color:var(--ink-soft);cursor:pointer;
    font-family:"Helvetica Neue",sans-serif;white-space:nowrap;transition:all .2s;
  }
  .chip.active{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 3px 10px rgba(43,122,120,.3);}

  .progress-wrap{padding:2px 22px 8px;}
  .progress-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-family:"Helvetica Neue",sans-serif;}
  .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;}
  .bar > i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold-deep));transition:width .35s ease;}

  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 22px;perspective:1400px;min-height:0;}
  .card{position:relative;width:100%;max-width:440px;height:100%;max-height:410px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1);cursor:pointer;}
  .card.flipped{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border-radius:22px;box-shadow:0 18px 40px -12px var(--shadow),0 2px 6px rgba(0,0,0,.04);border:1px solid rgba(200,164,92,.25);display:flex;flex-direction:column;padding:26px 24px;overflow:hidden;}
  .face::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--gold),var(--teal));}
  .front{align-items:center;justify-content:center;text-align:center;}
  .cat-tag{position:absolute;top:20px;left:22px;font-size:11px;letter-spacing:2px;color:var(--gold-deep);text-transform:uppercase;font-family:"Helvetica Neue",sans-serif;font-weight:600;}
  .idx{position:absolute;top:18px;right:22px;font-size:12px;color:var(--ink-soft);font-family:"Helvetica Neue",sans-serif;}
  .word{font-size:42px;font-weight:700;letter-spacing:.5px;line-height:1.1;}
  .pos{font-style:italic;color:var(--teal-deep);font-size:17px;margin-top:8px;}
  .tap-hint{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:12px;color:#b8ae98;font-family:"Helvetica Neue",sans-serif;letter-spacing:1px;}
  .speak-btn{margin-top:22px;width:58px;height:58px;border-radius:50%;border:none;background:var(--teal);color:#fff;font-size:24px;cursor:pointer;box-shadow:0 6px 16px rgba(43,122,120,.35);transition:transform .15s;display:flex;align-items:center;justify-content:center;}
  .speak-btn:active{transform:scale(.9);}
  .back{transform:rotateY(180deg);justify-content:flex-start;}
  .back .word-sm{font-size:25px;font-weight:700;}
  .back .word-sm .pos{font-size:14px;margin-left:8px;}
  .zh{font-size:25px;font-weight:700;color:var(--teal-deep);margin:12px 0 6px;line-height:1.35;}
  .divider{height:1px;background:var(--line);margin:12px 0;}
  .ex-label{font-size:11px;letter-spacing:2px;color:var(--gold-deep);text-transform:uppercase;font-family:"Helvetica Neue",sans-serif;font-weight:600;margin-bottom:6px;}
  .ex{font-size:18px;line-height:1.5;color:var(--ink);}
  .ex-zh{font-size:15px;line-height:1.5;color:var(--ink-soft);margin-top:8px;}
  .speak-inline{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--teal);background:transparent;color:var(--teal);font-size:15px;cursor:pointer;margin-left:8px;vertical-align:middle;transition:all .15s;}
  .speak-inline:active{background:var(--teal);color:#fff;transform:scale(.9);}
  .back-scroll{overflow-y:auto;flex:1;}

  .toolbar{display:flex;gap:8px;justify-content:center;padding:0 22px 4px;flex-wrap:wrap;}
  .tool{font-size:12px;color:var(--ink-soft);background:none;border:none;cursor:pointer;font-family:"Helvetica Neue",sans-serif;padding:4px 8px;text-decoration:underline;}

  .controls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 22px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:linear-gradient(0deg, rgba(255,253,248,.7), transparent);}
  .nav-btn{flex:1;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;font-family:"Helvetica Neue",sans-serif;transition:all .15s;}
  .nav-btn:active{transform:scale(.96);}
  .nav-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .known-btn{flex:0 0 auto;width:52px;padding:14px 0;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;transition:all .15s;}
  .known-btn.on{background:#e7f2ec;border-color:var(--teal);color:var(--teal);}
  .known-btn:active{transform:scale(.9);}

  @media (max-height:680px){
    .word{font-size:34px;} .speak-btn{width:50px;height:50px;margin-top:14px;} .card{max-height:330px;}
    .zh{font-size:22px;}
  }
</style>
</head>
<body>
  <header>
    <div class="brand">TOEIC · Business English</div>
    <div class="title">商用單字卡 <small id="deck-count">高頻精選</small></div>
  </header>

  <div class="cats" id="cats"></div>

  <div class="progress-wrap">
    <div class="progress-meta">
      <span id="pos-label">1 / 1</span>
      <span id="known-label">已學會 0</span>
    </div>
    <div class="bar"><i id="bar-fill"></i></div>
  </div>

  <div class="stage">
    <div class="card" id="card">
      <div class="face front">
        <div class="cat-tag" id="cat-tag"></div>
        <div class="idx" id="idx"></div>
        <div class="word" id="word"></div>
        <div class="pos" id="pos"></div>
        <button class="speak-btn" id="speak-front" aria-label="播放發音">🔊</button>
        <div class="tap-hint">點卡片看解釋</div>
      </div>
      <div class="face back">
        <div class="back-scroll">
          <div class="word-sm"><span id="word-b"></span><span class="pos" id="pos-b"></span>
            <button class="speak-inline" id="speak-word-b" aria-label="播放單字">🔊</button>
          </div>
          <div class="zh" id="zh"></div>
          <div class="divider"></div>
          <div class="ex-label">例句 Example</div>
          <div class="ex" id="ex"><span id="ex-text"></span>
            <button class="speak-inline" id="speak-ex" aria-label="播放例句">🔊</button>
          </div>
          <div class="ex-zh" id="ex-zh"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button class="tool" id="shuffle">🔀 隨機順序</button>
    <button class="tool" id="only-unknown">📖 只看未學會</button>
    <button class="tool" id="reset-known">↺ 清除紀錄</button>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prev">← 上一個</button>
    <button class="known-btn" id="known" aria-label="標記學會">✓</button>
    <button class="nav-btn primary" id="next">下一個 →</button>
  </div>

<script>

},{"word": "solution","pos": "n.","zh": "解決方案","example": "We found a simple solution.","exampleZh": "我們找到了簡單的解決方案。","cat": "問題解決"},{"word": "troubleshoot","pos": "v.","zh": "排除故障","example": "Let me troubleshoot the error.","exampleZh": "讓我排除這個錯誤。","cat": "問題解決"},{"word": "address","pos": "v.","zh": "處理；因應","example": "We must address the delay.","exampleZh": "我們必須處理延誤問題。","cat": "問題解決"},{"word": "overcome","pos": "v.","zh": "克服","example": "The team overcame the challenge.","exampleZh": "團隊克服了挑戰。","cat": "問題解決"},{"word": "cope with","pos": "phr.","zh": "應付","example": "They coped with the sudden demand.","exampleZh": "他們應付了突如其來的需求。","cat": "問題解決"},{"word": "prevent","pos": "v.","zh": "預防","example": "Regular checks prevent problems.","exampleZh": "定期檢查能預防問題。","cat": "問題解決"},{"word": "cause","pos": "n./v.","zh": "原因；造成","example": "We identified the cause of the fault.","exampleZh": "我們找出了故障的原因。","cat": "問題解決"},{"word": "adjust","pos": "v.","zh": "調整","example": "We adjusted the schedule.","exampleZh": "我們調整了時程。","cat": "改變"},{"word": "transform","pos": "v.","zh": "轉變","example": "Technology transformed the industry.","exampleZh": "科技改變了這個產業。","cat": "改變"},{"word": "revise","pos": "v.","zh": "修訂","example": "Please revise the draft.","exampleZh": "請修訂草稿。","cat": "改變"},{"word": "convert","pos": "v.","zh": "轉換","example": "They converted the space into offices.","exampleZh": "他們把這個空間改成辦公室。","cat": "改變"},{"word": "adapt","pos": "v.","zh": "適應","example": "We adapt to market changes.","exampleZh": "我們適應市場變化。","cat": "改變"},{"word": "partner","pos": "n.","zh": "夥伴","example": "We signed a deal with a partner.","exampleZh": "我們和一個夥伴簽了約。","cat": "合作夥伴"},{"word": "alliance","pos": "n.","zh": "聯盟","example": "The two firms formed an alliance.","exampleZh": "兩家公司結成聯盟。","cat": "合作夥伴"},{"word": "collaboration","pos": "n.","zh": "協作","example": "The project is a collaboration.","exampleZh": "這個專案是合作成果。","cat": "合作夥伴"},{"word": "joint","pos": "adj.","zh": "共同的","example": "They made a joint announcement.","exampleZh": "他們做了聯合聲明。","cat": "合作夥伴"},{"word": "affiliate","pos": "n.","zh": "分支機構","example": "The bank has overseas affiliates.","exampleZh": "這家銀行有海外分支機構。","cat": "合作夥伴"},{"word": "cooperate","pos": "v.","zh": "合作","example": "Departments must cooperate.","exampleZh": "各部門必須合作。","cat": "合作夥伴"},{"word": "aware","pos": "adj.","zh": "知道的","example": "Are you aware of the new rule?","exampleZh": "你知道新規定嗎？","cat": "常用字補充"},{"word": "capable","pos": "adj.","zh": "有能力的","example": "She is capable of leading.","exampleZh": "她有能力領導。","cat": "常用字補充"},{"word": "attempt","pos": "n./v.","zh": "嘗試","example": "They made an attempt to fix it.","exampleZh": "他們嘗試修好它。","cat": "常用字補充"},{"word": "aim","pos": "v./n.","zh": "目標；以…為目標","example": "We aim to finish by June.","exampleZh": "我們的目標是六月前完成。","cat": "常用字補充"},{"word": "depend on","pos": "phr.","zh": "取決於","example": "The plan depends on funding.","exampleZh": "計畫取決於資金。","cat": "常用字補充"},{"word": "focus on","pos": "phr.","zh": "專注於","example": "We focus on quality.","exampleZh": "我們專注於品質。","cat": "常用字補充"},{"word": "rely on","pos": "phr.","zh": "依賴","example": "We rely on our suppliers.","exampleZh": "我們依賴我們的供應商。","cat": "常用字補充"},{"word": "in charge of","pos": "phr.","zh": "負責","example": "She is in charge of hiring.","exampleZh": "她負責招聘。","cat": "常用字補充"},{"word": "keep track of","pos": "phr.","zh": "追蹤記錄","example": "Keep track of your expenses.","exampleZh": "記錄你的開支。","cat": "常用字補充"}];
</script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  let deck = VOCAB.slice();
  let filtered = deck.slice();
  let i = 0, currentCat = "全部", onlyUnknown = false;
  const known = new Set();

  $("deck-count").textContent = "共 " + VOCAB.length + " 字";

  // categories
  const cats = ["全部", ...Array.from(new Set(VOCAB.map(v=>v.cat)))];
  const catsEl = $("cats");
  cats.forEach(c=>{
    const b = document.createElement("button");
    b.className = "chip" + (c==="全部"?" active":"");
    b.textContent = c;
    b.onclick = ()=>{
      currentCat = c;
      document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      applyFilter();
    };
    catsEl.appendChild(b);
  });

  function baseList(){
    return currentCat==="全部" ? deck.slice() : deck.filter(v=>v.cat===currentCat);
  }
  function applyFilter(){
    filtered = baseList();
    if(onlyUnknown) filtered = filtered.filter(v=>!known.has(v.word));
    if(filtered.length===0){ filtered = baseList(); onlyUnknown=false; $("only-unknown").textContent="📖 只看未學會"; }
    i = 0; render();
  }

  // speech
  let voice = null;
  function pickVoice(){
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v=>/en-US/i.test(v.lang) && /female|Samantha|Google US/i.test(v.name))
         || vs.find(v=>/en-US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
  }
  if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text){
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang="en-US"; u.rate=.9; u.pitch=1; if(voice) u.voice=voice;
    speechSynthesis.speak(u);
  }

  const card = $("card");
  function render(){
    if(filtered.length===0) return;
    const v = filtered[i];
    card.classList.remove("flipped");
    $("cat-tag").textContent = v.cat;
    $("idx").textContent = (i+1)+" / "+filtered.length;
    $("word").textContent = v.word;
    $("pos").textContent = v.pos;
    $("word-b").textContent = v.word;
    $("pos-b").textContent = v.pos;
    $("zh").textContent = v.zh;
    $("ex-text").textContent = v.example + " ";
    $("ex-zh").textContent = v.exampleZh;
    $("pos-label").textContent = (i+1)+" / "+filtered.length;
    $("known-label").textContent = "已學會 "+known.size;
    $("bar-fill").style.width = ((i+1)/filtered.length*100)+"%";
    $("known").classList.toggle("on", known.has(v.word));
  }
  function go(step){ i=(i+step+filtered.length)%filtered.length; render(); }

  card.onclick = e=>{ if(e.target.closest("button")) return; card.classList.toggle("flipped"); };
  $("speak-front").onclick = e=>{ e.stopPropagation(); speak(filtered[i].word); };
  $("speak-word-b").onclick = e=>{ e.stopPropagation(); speak(filtered[i].word); };
  $("speak-ex").onclick = e=>{ e.stopPropagation(); speak(filtered[i].example); };
  $("prev").onclick = ()=>go(-1);
  $("next").onclick = ()=>go(1);
  $("known").onclick = ()=>{
    const w=filtered[i].word;
    if(known.has(w)) known.delete(w); else known.add(w);
    render();
  };
  $("shuffle").onclick = ()=>{
    for(let k=deck.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[deck[k],deck[j]]=[deck[j],deck[k]];}
    applyFilter();
  };
  $("only-unknown").onclick = ()=>{
    onlyUnknown=!onlyUnknown;
    $("only-unknown").textContent = onlyUnknown ? "📚 看全部" : "📖 只看未學會";
    applyFilter();
  };
  $("reset-known").onclick = ()=>{ known.clear(); render(); };

  document.addEventListener("keydown", e=>{
    if(e.key==="ArrowRight") go(1);
    else if(e.key==="ArrowLeft") go(-1);
    else if(e.key===" "){ e.preventDefault(); card.classList.toggle("flipped"); }
  });
  let sx=0,sy=0;
  card.addEventListener("touchstart", e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  card.addEventListener("touchend", e=>{
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) go(dx<0?1:-1);
  },{passive:true});

  render();
})();
</script>
