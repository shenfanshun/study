<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可解釋 AI (XAI) 情境題練習</title>
<style>
  :root{
    --ink:#f6f8fb; --ink2:#eef1f7; --panel:#ffffff; --panel2:#f1f4f9;
    --line:#e2e6ed; --muted:#6b7688; --text:#1a2230; --dim:#48566b;
    --c1:#0d9488; --c2:#7c3aed; --c3:#db2777;
    --ok:#16a34a; --okbg:#dcfce7;
    --no:#dc2626; --nobg:#fee2e2;
    --grad:linear-gradient(90deg,#0d9488 0%,#7c3aed 55%,#db2777 100%);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:
      radial-gradient(1200px 600px at 80% -10%, rgba(124,108,255,.10), transparent 60%),
      radial-gradient(900px 500px at -5% 10%, rgba(56,225,200,.08), transparent 55%),
      var(--ink);
    color:var(--text);
    font-family:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    line-height:1.6;
  }
  .mono{font-family:"JetBrains Mono","SFMono-Regular",ui-monospace,Menlo,Consolas,monospace}
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 96px}

  /* header */
  header{margin-bottom:22px}
  .eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--c1);
    font-family:"JetBrains Mono",ui-monospace,monospace;margin:0 0 10px}
  h1{font-size:clamp(26px,5vw,38px);line-height:1.12;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
  h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:14px;margin:0}

  /* signal / progress */
  .dash{display:flex;align-items:center;gap:16px;margin:20px 0 8px;flex-wrap:wrap}
  .signal{flex:1;min-width:200px}
  .signal .track{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
  .signal .fill{height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
  .signal .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);
    margin-top:7px;font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.05em}
  .score{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;color:var(--dim)}
  .score b{color:var(--c1)}
  .score .sep{color:var(--line);margin:0 6px}
  .score .wrong{color:var(--c3)}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
  .btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--dim);
    font-size:13px;padding:8px 14px;border-radius:9px;cursor:pointer;transition:.18s;
    font-family:inherit;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--c2);color:var(--text);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{background:transparent}

  /* card */
  .card{background:linear-gradient(180deg,var(--panel),var(--ink2));
    border:1px solid var(--line);border-radius:16px;padding:22px 22px 20px;margin:16px 0;
    box-shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 18px 40px -30px rgba(15,23,42,.10)}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .qnum{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--ink);
    background:var(--c1);padding:3px 9px;border-radius:6px;font-weight:700}
  .qtext{font-size:16px;line-height:1.72;color:var(--text);margin:0 0 16px}

  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    background:var(--panel2);border:1px solid var(--line);border-radius:11px;
    padding:13px 14px;cursor:pointer;transition:.16s;color:var(--dim);font-size:14.5px;line-height:1.6;font-family:inherit}
  .opt:hover:not(.locked){border-color:var(--c2);background:#f4f1fd;color:var(--text)}
  .opt .key{flex:none;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);
    display:grid;place-items:center;font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:13px;font-weight:700;color:var(--muted);transition:.16s}
  .opt:hover:not(.locked) .key{border-color:var(--c2);color:var(--c1)}
  .opt.locked{cursor:default}
  .opt.correct{border-color:var(--ok);background:var(--okbg);color:var(--text)}
  .opt.correct .key{background:var(--ok);color:var(--ink);border-color:var(--ok)}
  .opt.wrong{border-color:var(--no);background:var(--nobg);color:var(--text)}
  .opt.wrong .key{background:var(--no);color:#fff;border-color:var(--no)}
  .opt.dim{opacity:.5}

  .explain{margin-top:14px;border-left:3px solid var(--c2);background:rgba(124,108,255,.07);
    border-radius:0 10px 10px 0;padding:12px 15px;font-size:14px;color:var(--dim);
    max-height:0;overflow:hidden;opacity:0;transition:.35s ease}
  .explain.show{max-height:300px;opacity:1;margin-top:14px}
  .explain .lab{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;
    letter-spacing:.14em;color:var(--c2);text-transform:uppercase;display:block;margin-bottom:5px}
  .explain b{color:var(--c1)}

  /* result banner */
  .result{display:none;background:linear-gradient(180deg,var(--panel),var(--ink2));
    border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center;margin:18px 0}
  .result.show{display:block}
  .result .big{font-size:52px;font-weight:800;line-height:1;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .result .cap{color:var(--muted);font-size:13px;margin-top:6px;font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.1em}
  .result .msg{margin:14px 0 18px;color:var(--dim)}

  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px;
    font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.04em}

  /* sticky mini progress on mobile scroll */
  @media (max-width:560px){
    .wrap{padding:20px 14px 90px}
    .qtext{font-size:15px}
    .opt{font-size:14px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  .opt:focus-visible,.btn:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">初級 AI 應用規劃師 · 情境練習</p>
    <h1>可解釋 AI <span class="g">(XAI)</span> 情境題</h1>
    <p class="sub">30 題跨產業情境選擇題 · 涵蓋 LIME、SHAP、PDP、反事實解釋、顯著性圖與黑箱／白箱</p>

    <div class="dash">
      <div class="signal">
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="lab"><span id="progLab">已作答 0 / 30</span><span id="pct">0%</span></div>
      </div>
      <div class="score">
        正確 <b id="sCorrect">0</b><span class="sep">/</span>錯誤 <span class="wrong" id="sWrong">0</span>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn" id="revealBtn">顯示所有解析</button>
      <button class="btn ghost" id="shuffleBtn">打亂題序</button>
      <button class="btn ghost" id="resetBtn">重新開始</button>
    </div>
  </header>

  <div id="quiz"></div>

  <div class="result" id="result">
    <div class="big" id="rBig">0%</div>
    <div class="cap" id="rCap">SCORE</div>
    <p class="msg" id="rMsg"></p>
    <button class="btn" id="againBtn">再練一次</button>
  </div>

  <footer>學習來源：Notion「可解釋 AI (XAI)」· 題型仿 115 年第一次初級 AI 應用規劃師</footer>
</div>

<script>
const DATA = [{"id": 1, "q": "某醫學中心導入深度神經網路分析胸部X光片以輔助肺炎判讀。放射科醫師發現模型雖準確率高，但擔心其可能依據影像中的醫院浮水印或標記文字而非病灶區域做判斷。為驗證模型是否「看對地方」，並以熱度圖呈現各像素對分類結果的影響程度，下列何種技術最為適合？", "opts": ["部分依賴圖（PDP），觀察特徵平均影響趨勢", "顯著性圖（Saliency Map），透過梯度標示影響最大的像素區域", "反事實解釋，改變病患年齡看結果是否翻轉", "LIME，在資料點附近訓練線性替代模型取得全域規則"], "ans": "B", "topic": "顯著性圖", "exp": "顯著性圖以輸入像素對輸出的梯度，將重要區域以熱度圖呈現，最適合檢查模型是否「看對地方」。"}, {"id": 2, "q": "某銀行的AI信用評分模型婉拒了一位申請人的房貸。依主管機關要求，銀行須向該客戶說明「還需要達成什麼條件才能核貸」，且建議事項必須是客戶實際能改變的。下列何種可解釋方法最符合此需求？", "opts": ["顯著性圖，標出申請表上最重要的欄位像素", "部分依賴圖，呈現全體客戶的收入對核貸率的平均關係", "反事實解釋，並將建議限制在客戶可改變的特徵上", "SHAP，計算所有客戶特徵的全域平均貢獻度"], "ans": "C", "topic": "反事實解釋", "exp": "反事實解釋透過改變條件看結果翻轉，且建議必須限制在客戶可改變的特徵上。"}, {"id": 3, "q": "某電商平台使用複雜的集成模型即時預測顧客是否會棄置購物車，需要在使用者瀏覽的當下、於單一資料點附近快速產生一個簡單替代模型來說明本次預測原因。相較於理論嚴謹但計算較慢的方法，下列何者最符合「局部近似、快速」的情境需求？", "opts": ["SHAP", "部分依賴圖（PDP）", "LIME", "顯著性圖（Saliency Map）"], "ans": "C", "topic": "LIME", "exp": "LIME 在單一資料點附近訓練簡單替代模型，特點是局部近似、簡單快速。"}, {"id": 4, "q": "某產險公司建立車險保費預測模型，法遵部門要求對每一張保單能逐一說明各特徵（如年齡、車齡、肇事紀錄）「各自貢獻了多少」保費，且方法需具備博弈論基礎、分帳公平。下列何者最符合？", "opts": ["LIME，於局部以線性模型近似", "SHAP，依Shapley值公平分配各特徵貢獻", "反事實解釋，尋找可翻轉結果的最小改變", "部分依賴圖，觀察單一特徵的平均影響"], "ans": "B", "topic": "SHAP", "exp": "SHAP 源自博弈論，能公平分配每個特徵「各自貢獻了多少」。"}, {"id": 5, "q": "某半導體廠導入AI進行晶圓瑕疵分類，管理層在兩套方案間抉擇：一為準確度極高但難以追蹤推論過程的深度模型，另一為準確度中等但邏輯完全透明、便於稽核與除錯的模型。就「原因是否合理、可稽核」為最高優先的情境而言，下列敘述何者最正確？", "opts": ["黑箱模型因準確度高，必然是稽核情境的最佳選擇", "白箱模型運作邏輯透明，較利於解釋、除錯與安全稽核", "兩者透明度相同，差別僅在於運算速度", "白箱模型無法處理任何分類任務"], "ans": "B", "topic": "黑箱/白箱", "exp": "白箱模型邏輯透明，核心考量是「原因合不合理」，利於解釋、除錯與稽核。"}, {"id": 6, "q": "某自駕車公司要理解影像辨識神經網路在判定「行人」時，輸入影像中哪些像素貢獻最大，做法是直接取用模型內部對輸入的梯度。關於此類需進入模型內部、屬於「模型相關（model-specific）」的解釋技術，下列何者屬於同一類？", "opts": ["LIME", "SHAP", "Grad-CAM 與 Integrated Gradients", "部分依賴圖（PDP）"], "ans": "C", "topic": "模型相關", "exp": "Saliency Map、Grad-CAM、Integrated Gradients 皆需進入模型內部取梯度，屬 model-specific。"}, {"id": 7, "q": "某企業HR以隨機森林模型預測員工流失風險。人資長想了解「在控制其他因素後，通勤時間由短到長變化時，模型預測的流失風險平均會如何變動」，以檢查模型是否合理。下列何種工具最直接支援此需求？", "opts": ["反事實解釋，找出可讓某員工不離職的最小改變", "顯著性圖，標示履歷影像的重要區域", "部分依賴圖（PDP），呈現單一特徵對預測的平均影響方向", "One-hot 編碼，將通勤時間轉為類別"], "ans": "C", "topic": "PDP", "exp": "PDP 呈現控制其他因素後，單一特徵對預測的平均影響與方向。"}, {"id": 8, "q": "某銀行風控團隊同時想知道兩件事：其一為「整體而言，負債比對違約率的平均趨勢」；其二為「就某一位特定客戶而言，各特徵各自貢獻了多少違約分數」。下列配對何者最恰當？", "opts": ["前者用SHAP、後者用PDP", "兩者皆只能用LIME達成", "前者用PDP（整體趨勢）、後者用SHAP（個別貢獻）", "兩者皆須使用顯著性圖"], "ans": "C", "topic": "PDP vs SHAP", "exp": "PDP＝整體平均趨勢；SHAP＝個別特徵貢獻（更細）。"}, {"id": 9, "q": "某電信公司採用一套深度學習模型預測用戶續約意願，資料團隊坦言「輸入資料進去就有答案，但中間如何算出來完全無法追蹤」。此描述最符合下列哪一種模型特性？", "opts": ["白箱模型，邏輯透明可逐步追蹤", "黑箱模型，內部推論過程不透明", "線性回歸模型，係數可直接解讀", "決策樹模型，可畫出分支規則"], "ans": "B", "topic": "黑箱模型", "exp": "黑箱：給輸入就有答案，但中間推論過程完全無法追蹤。"}, {"id": 10, "q": "某農業科技公司以CNN辨識葉片病害影像。工程師懷疑模型可能學到了「拍攝背景」而非病斑本身，想以視覺化方式檢查模型關注的像素位置是否落在葉片病徵上。下列何種用途與此情境最相符？", "opts": ["以顯著性圖偵測模型是否學錯特徵（偵測偏差）", "以PDP計算背景顏色的全域平均貢獻", "以反事實解釋列舉多重解答", "以SHAP的博弈論基礎重新訓練模型"], "ans": "A", "topic": "顯著性圖", "exp": "顯著性圖可用於偵測偏差，找出模型是否學到背景等錯誤特徵。"}, {"id": 11, "q": "某醫院AI建議一位受檢者「未通過健康風險評估」。營養師想用反事實方式告訴他「怎麼做結果會翻轉」，卻發現可翻轉結果的組合不只一種（例如降低體重或提升運動量皆可）。此情境凸顯反事實解釋的哪一項挑戰？", "opts": ["梯度消失問題", "多重解答（Multiple Counterfactuals），需在多個可行方案中取捨", "特徵交互被忽略", "計算速度過慢"], "ans": "B", "topic": "反事實解釋", "exp": "可翻轉結果的方法通常不只一種，即「多重解答」挑戰。"}, {"id": 12, "q": "某零售集團的資料團隊希望所選的解釋方法「不論底層換成XGBoost、隨機森林或神經網路都能通用，只看輸入與輸出即可」。下列哪一組方法皆屬於此類「模型無關（model-agnostic）」技術？", "opts": ["Saliency Map、Grad-CAM、Integrated Gradients", "LIME、SHAP、PDP、反事實解釋", "僅限決策樹與線性回歸", "只有神經網路可用的梯度法"], "ans": "B", "topic": "模型無關", "exp": "LIME、SHAP、PDP、反事實解釋皆為 model-agnostic，只看輸入輸出。"}, {"id": 13, "q": "某法律科技公司開發判決輔助系統，主管機關與律師要求其推論須「像看說明書一樣，能一步一步追蹤如何得到結論」以承擔法律責任。此需求最強調模型的哪一項特性？", "opts": ["準確度必須是所有考量中的唯一目標", "高度透明、可逐步追蹤的白箱特性", "能處理最大規模的資料量", "完全不需任何解釋即可上線"], "ans": "B", "topic": "白箱模型", "exp": "白箱運作透明，可像看說明書一步步追蹤推論，利於承擔責任。"}, {"id": 14, "q": "某廣告投放團隊用PDP觀察「投放時段」對點擊率的平均影響，卻忽略了它與「使用者裝置」之間可能存在交互作用，導致解讀失真。若團隊改採能「分解每個特徵貢獻、較精準公平但計算較慢」的方法，下列何者最適合？", "opts": ["顯著性圖", "SHAP", "單純加大PDP的取樣點", "改用白箱線性模型即可完全解決交互作用"], "ans": "B", "topic": "SHAP", "exp": "PDP 忽略特徵交互；SHAP 分解各特徵貢獻、精準公平但較慢。"}, {"id": 15, "q": "某電力公司以模型預測家戶用電。分析師發現整體平均趨勢（氣溫升高、用電上升）之外，仍想檢視「每一個別家戶對氣溫變化的真實反應曲線」，因為不同家戶差異很大。下列敘述何者正確？", "opts": ["PDP呈現個體反應，ICE呈現全體平均", "ICE呈現每個個體的真實反應，PDP呈現全體平均趨勢", "兩者完全等價，可互相取代", "ICE屬於模型相關的梯度方法"], "ans": "B", "topic": "PDP vs ICE", "exp": "ICE＝每個個體的真實反應；PDP＝全體平均趨勢。"}, {"id": 16, "q": "某教育平台以複雜模型預測學生是否會中輟，老師想理解「針對這一位學生的這次預測」為何如此。系統的做法是：在該學生資料點附近取樣、訓練一個簡單可解釋模型來模仿原模型行為。此做法屬於下列何者的核心原理？", "opts": ["SHAP的Shapley值分配", "LIME的局部替代模型", "顯著性圖的梯度熱度", "部分依賴圖的平均邊際效果"], "ans": "B", "topic": "LIME", "exp": "LIME 核心：在資料點附近取樣、訓練簡單模型模仿原模型行為。"}, {"id": 17, "q": "某銀行AI對一位客戶說明：「若您年輕15歲，信用卡申請就會通過。」客服主管認為此解釋無效。依反事實解釋的實務原則，主要問題為何？", "opts": ["該解釋計算速度過慢", "建議落在人類無法改變的特徵上，缺乏現實可行性", "該解釋使用了太多梯度資訊", "反事實解釋不適用於金融領域"], "ans": "B", "topic": "反事實解釋", "exp": "建議落在無法改變的特徵（如年齡）上就缺乏現實可行性。"}, {"id": 18, "q": "某物流公司比較兩個路線最佳化AI：A模型準確度極高、擅長處理大量複雜資料，但內部難以解釋；B模型準確度中等但邏輯透明。若營運目標是「結果精準最重要、可接受解釋性較低」，下列選擇與敘述何者最一致？", "opts": ["應選B模型，因為黑箱模型無法處理大數據", "應選A模型（黑箱），其優勢在效果好、能處理複雜大數據", "兩模型透明度相同，選擇無差別", "高準確度必然等於高透明度"], "ans": "B", "topic": "黑箱模型", "exp": "黑箱優勢在效果好、能處理複雜大數據，適合「結果精準最重要」情境。"}, {"id": 19, "q": "某生技公司以模型預測化合物活性，研究團隊既想知道「單一化合物這次預測中各描述子的貢獻」，也想彙整出「所有樣本的整體特徵重要性」。下列哪一方法可同時支援局部與全局兩種層次的解釋？", "opts": ["僅能做局部解釋的LIME", "具博弈論基礎、局部與全局皆可解釋的SHAP", "只呈現單一像素梯度的顯著性圖", "僅能看單變數平均趨勢的PDP"], "ans": "B", "topic": "SHAP", "exp": "SHAP 具博弈論基礎，局部與全局皆可解釋。"}, {"id": 20, "q": "某資安團隊想對一套影像式惡意程式偵測神經網路取得像素級歸因，做法需取用模型內部梯度。關於此類「模型相關」方法的適用性，下列敘述何者最正確？", "opts": ["可完全把模型當黑箱、只看輸入輸出即可套用", "通常需進入模型內部（如取梯度），多用於神經網路", "與LIME一樣屬於模型無關方法", "僅適用於線性回歸模型"], "ans": "B", "topic": "模型相關", "exp": "model-specific 通常需進入模型內部取梯度，多用於神經網路。"}, {"id": 21, "q": "某政府機關導入AI輔助社福資格審核，民眾與監察單位要求對每一項否決決定都能提出「可被理解、可被質疑」的理由。下列何種整體策略最符合演算法問責與可解釋性的精神？", "opts": ["直接採用最高準確度的黑箱模型，不提供任何理由", "採用可解釋方法（如SHAP或反事實）說明個案決策依據，並確保建議可行", "僅公布模型整體準確率即可滿足問責要求", "以隨機方式產生解釋以加快審核"], "ans": "B", "topic": "可解釋性/問責", "exp": "以 SHAP 或反事實說明個案依據，並確保建議可行，符合演算法問責。"}, {"id": 22, "q": "某車險公司理賠部門在爭議案件中，需要對「個別理賠決策」提供理論最嚴謹、結果穩定、可作為對外正式說明的特徵貢獻分析，即使計算較慢也可接受。下列何者最符合此需求？", "opts": ["LIME，因其局部近似快速", "SHAP，因其理論嚴謹、結果穩定", "顯著性圖，因其呈現像素熱度", "PDP，因其只看整體平均"], "ans": "B", "topic": "SHAP", "exp": "SHAP 理論嚴謹、結果穩定，適合作為對外正式說明，雖計算較慢。"}, {"id": 23, "q": "某房仲平台以XGBoost估價，資料科學家想在上線前檢查「坪數增加時，估價是否隨之合理上升」，以驗證模型行為符合常識。此屬於PDP的哪一種典型用途？", "opts": ["偵測單張影像的重要像素", "模型檢查（合理性）與特徵影響方向判讀", "為單一客戶產生反事實建議", "以博弈論分配各特徵貢獻"], "ans": "B", "topic": "PDP", "exp": "PDP 可用於模型檢查（合理性）與判讀特徵影響方向。"}, {"id": 24, "q": "某醫院導入AI輔助腫瘤偵測，醫師與病患對「黑箱給出的結論」信任度不足。院方希望以視覺化方式標示模型在影像上關注的區域，讓醫師確認其與臨床判讀一致，以提升信任。下列何種技術用途最貼近此目的？", "opts": ["以PDP呈現全院病患的平均趨勢", "以顯著性圖標示重要區域以提升解釋性與信任", "以One-hot編碼處理影像類別", "以反事實解釋改變病患性別看結果"], "ans": "B", "topic": "顯著性圖", "exp": "顯著性圖標示重要區域，於醫療等領域用於提升解釋性與信任。"}, {"id": 25, "q": "某電商想向賣家說明「為何某商品未被推薦上首頁」。團隊決定不去拆解模型內部複雜演算法，而是透過「改變哪些條件（如評價數、售價）結果就會翻轉」的方式來說明。此做法屬於下列何者？", "opts": ["顯著性圖", "反事實解釋（Counterfactual Explanation）", "部分依賴圖（PDP）", "標準化（Standardization）"], "ans": "B", "topic": "反事實解釋", "exp": "不拆解內部演算法，而以改變條件看結果翻轉的方式說明。"}, {"id": 26, "q": "某供應鏈公司使用深度模型預測缺貨風險，準確度高但無法解讀。管理層要求：在不更換模型的前提下，能對每次預測拆解各特徵貢獻。下列組合敘述何者最正確？", "opts": ["該模型屬白箱，本身已可逐步追蹤，無需額外方法", "該模型屬黑箱，可用模型無關的SHAP在不改動模型下拆解特徵貢獻", "必須改用線性模型才能得到任何解釋", "只能用模型相關的梯度法，且僅限影像"], "ans": "B", "topic": "黑箱＋SHAP", "exp": "黑箱可用模型無關的 SHAP，在不改動模型下拆解特徵貢獻。"}, {"id": 27, "q": "某工廠以視覺AI檢測金屬表面刮痕，工程師想用一句話向產線主管說明顯著性圖的本質。下列何者最貼切？", "opts": ["它是把模型當黑箱、只看輸入輸出的全域平均趨勢圖", "它是以輸入對輸出的梯度，將重要像素以熱力圖呈現的可視化", "它是以博弈論公平分配各特徵貢獻的分帳表", "它是改變條件看結果翻轉的假設情境"], "ans": "B", "topic": "顯著性圖", "exp": "顯著性圖＝梯度 × 熱力圖 × 重要像素。"}, {"id": 28, "q": "某金融科技新創的工程師宣稱：「我們用LIME得到的解釋，就代表模型在所有客戶上的通用全域規則。」資深資料科學家指出此說法有誤。下列糾正何者最正確？", "opts": ["LIME提供的是單一資料點附近的局部解釋，不宜直接當作全域規則", "LIME只能用於神經網路，不能用於此模型", "LIME與SHAP完全相同，說法其實沒有問題", "LIME需要模型內部梯度，屬模型相關方法"], "ans": "A", "topic": "LIME", "exp": "LIME 提供的是單點附近的局部解釋，不宜當作全域規則。"}, {"id": 29, "q": "某壽險公司以PDP說明「年齡對核保分數的平均影響」，核保主管詢問此圖有何需注意的限制。下列敘述何者最正確？", "opts": ["PDP會精準分解每位客戶的個別貢獻，無任何限制", "PDP呈現平均趨勢，可能忽略特徵之間的交互作用", "PDP屬模型相關方法，僅能用於神經網路", "PDP計算比SHAP慢很多且結果不穩定"], "ans": "B", "topic": "PDP", "exp": "PDP 呈現平均趨勢，可能忽略特徵之間的交互作用。"}, {"id": 30, "q": "某AI顧問為不同客戶推薦XAI方法：甲客戶要「影像像素級的重要區域熱度圖」、乙客戶要「個案各特徵的公平貢獻分帳」、丙客戶要「告訴用戶怎麼改條件結果會翻轉」。下列對應何者全部正確？", "opts": ["甲：PDP；乙：LIME；丙：顯著性圖", "甲：顯著性圖；乙：SHAP；丙：反事實解釋", "甲：反事實解釋；乙：PDP；丙：SHAP", "甲：SHAP；乙：顯著性圖；丙：LIME"], "ans": "B", "topic": "方法對應", "exp": "像素熱度→顯著性圖；特徵公平分帳→SHAP；改條件翻轉→反事實解釋。"}];
const LETTERS=['A','B','C','D'];
let order = DATA.map((_,i)=>i);
let answered = {};   // originalIndex -> chosen letter
const $ = s=>document.querySelector(s);

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function render(){
  const quiz = $('#quiz'); quiz.innerHTML='';
  order.forEach((oi,pos)=>{
    const q = DATA[oi];
    const card = document.createElement('div');
    card.className='card'; card.dataset.oi=oi;
    const chosen = answered[oi];
    card.innerHTML = `
      <div class="qhead">
        <span class="qnum">第 ${String(pos+1).padStart(2,'0')} 題</span>
      </div>
      <p class="qtext">${q.q}</p>
      <div class="opts">
        ${q.opts.map((o,k)=>{
          const L=LETTERS[k];
          return `<button class="opt" data-l="${L}" role="button">
            <span class="key">${L}</span><span>${o}</span></button>`;
        }).join('')}
      </div>
      <div class="explain" id="exp-${oi}">
        <span class="lab">解析 · 正解 ${q.ans} · 觀念：${q.topic}</span>${q.exp}
      </div>`;
    quiz.appendChild(card);
    // rebind state if already answered
    if(chosen) applyLock(card, q, chosen);
    card.querySelectorAll('.opt').forEach(btn=>{
      btn.addEventListener('click',()=>choose(oi,q,card,btn.dataset.l));
    });
  });
  updateDash();
}

function applyLock(card,q,chosen){
  card.querySelectorAll('.opt').forEach(b=>{
    b.classList.add('locked');
    const L=b.dataset.l;
    if(L===q.ans) b.classList.add('correct');
    else if(L===chosen) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  $('#exp-'+q_oi(card)).classList.add('show');
}
function q_oi(card){return card.dataset.oi;}

function choose(oi,q,card,L){
  if(answered[oi]) return;
  answered[oi]=L;
  applyLock(card,q,L);
  updateDash();
  if(Object.keys(answered).length===DATA.length) finish();
}

function updateDash(){
  const n=Object.keys(answered).length;
  let correct=0;
  for(const k in answered){ if(answered[k]===DATA[k].ans) correct++; }
  const wrong=n-correct;
  const pct=Math.round(n/DATA.length*100);
  $('#fill').style.width=pct+'%';
  $('#progLab').textContent=`已作答 ${n} / ${DATA.length}`;
  $('#pct').textContent=pct+'%';
  $('#sCorrect').textContent=correct;
  $('#sWrong').textContent=wrong;
}

function finish(){
  let correct=0;
  for(const k in answered){ if(answered[k]===DATA[k].ans) correct++; }
  const pct=Math.round(correct/DATA.length*100);
  $('#rBig').textContent=pct+'%';
  $('#rMsg').textContent=`答對 ${correct} 題，共 ${DATA.length} 題。`+
    (pct>=80?' 掌握得很扎實，各方法的適用情境都分得清楚。':
     pct>=60?' 基礎穩固，再留意方法之間的差異（如 PDP／SHAP、LIME 局部 vs 全局）。':
     ' 建議回頭複習黑箱／白箱與五種解釋方法的核心定義與適用時機。');
  const r=$('#result'); r.classList.add('show');
  r.scrollIntoView({behavior:'smooth',block:'center'});
}

$('#revealBtn').addEventListener('click',()=>{
  order.forEach(oi=>{
    const q=DATA[oi];
    const card=document.querySelector(`.card[data-oi="${oi}"]`);
    if(!answered[oi]){ // reveal without scoring
      card.querySelectorAll('.opt').forEach(b=>{
        b.classList.add('locked');
        if(b.dataset.l===q.ans) b.classList.add('correct'); else b.classList.add('dim');
      });
    }
    $('#exp-'+oi).classList.add('show');
  });
});
$('#shuffleBtn').addEventListener('click',()=>{ shuffle(order); answered={}; $('#result').classList.remove('show'); render(); window.scrollTo({top:0,behavior:'smooth'}); });
$('#resetBtn').addEventListener('click',reset);
$('#againBtn').addEventListener('click',reset);
function reset(){ order=DATA.map((_,i)=>i); answered={}; $('#result').classList.remove('show'); render(); window.scrollTo({top:0,behavior:'smooth'}); }

render();
</script>
