</style></head><body><main><header><div class="eyebrow">MARKETING / CHAPTER 01</div><h1>行銷基本概念・進階練習</h1><p class="muted">辨別相近概念，從情境線索判斷最適合的選擇。</p></header><div id="storageNotice" class="notice hidden" role="status"></div><div id="app"></div><footer>題目依據《行銷-Ch1 行銷基本概念》摘要，延伸概念辨識與虛構生活情境。4R／4S／4V／4I 及效用分類採摘要用語；本題庫為理解練習，非官方考古題。<br>成績保存在目前瀏覽器，不會跨裝置同步；清除瀏覽器資料、使用無痕模式或搬移檔案可能影響紀錄。建議定期匯出備份。進階版紀錄與原 50 題版分開保存；備份請於相同版本匯入。</footer></main>

'use strict';
const BANK=[{"id": 1, "kind": "基礎", "topic": "核心概念", "q": "關於需要、慾望與需求，下列哪個關係較適當？", "options": ["需要可有多種滿足方式，特定慾望須有購買能力才構成需求", "需要只涉及生理，需求只涉及奢侈消費", "需要由企業創造，慾望則完全不受文化影響", "需求等同完成交易，慾望則等同購買能力"], "answer": 0, "explain": "需要是基本匱乏感，慾望是特定滿足方式，需求是購買能力支持的慾望。"}, {"id": 2, "kind": "基礎", "topic": "核心概念", "q": "將行銷視為「社會程序」，分析焦點最接近哪一項？", "options": ["業務單位如何提高本季的成交轉換率", "單一企業如何分配各產品的廣告預算", "單一工廠如何降低每批產品的製造費用", "整體供需協調及社會資源如何滿足成員需要"], "answer": 3, "explain": "社會程序採整體社會視角；其餘偏向企業或部門的管理視角。"}, {"id": 3, "kind": "基礎", "topic": "核心概念", "q": "判斷一項活動能否成為行銷對象，最應採取哪個原則？", "options": ["考量能否向特定對象提供有意義的價值", "考量是否由營利企業負責設計與提供", "考量是否能以實體商品完成所有權移轉", "考量是否能直接收取貨幣作為對價"], "answer": 0, "explain": "服務、思想、人物與活動都能成為行銷對象，不限有形物或營利活動。"}, {"id": 4, "kind": "基礎", "topic": "核心概念", "q": "下列何者最能區別「交換」與已完成的「交易」？", "options": ["交換只適用個人，交易只適用企業", "交換只處理有形物，交易才包含無形服務", "交換只適用物物互換，交易才涉及貨幣", "交換是取得所需並提供對價的過程，交易是雙方完成約定的價值移轉"], "answer": 3, "explain": "交換概念較廣；交易可視為交換達成的具體結果，對價不必限於金錢。"}, {"id": 5, "kind": "基礎", "topic": "核心概念", "q": "消費者滿意度的判斷，最適合比較哪兩者？", "options": ["製造成本與公司資本", "競爭家數與通路層數", "使用後感受與原先期望", "廣告次數與銷售人數"], "answer": 2, "explain": "滿意度與感受績效相對於期望的落差有關，價格或銷量本身不足以判定。"}, {"id": 6, "kind": "基礎", "topic": "核心概念", "q": "關於功利、享樂與象徵性需求，下列何者較適當？", "options": ["象徵性需求僅存在於價格最高的商品", "服務主要涉及享樂需求而不涉及功利需求", "同一商品可同時回應不同需求，應看購買動機", "有實用功能的商品不會涉及享樂需求"], "answer": 2, "explain": "分類依動機而非品類或售價；同一購買行為可以包含多種動機。"}, {"id": 7, "kind": "基礎", "topic": "行銷組合", "q": "將 4P 轉為 4C 思考時，哪組對應最適當？", "options": ["產品對顧客成本，通路對雙向溝通", "價格對取得便利，推廣對顧客需求", "產品對顧客需求，通路對取得便利", "價格對雙向溝通，推廣對取得便利"], "answer": 2, "explain": "常見對應為產品／需求、價格／成本、通路／便利、推廣／溝通。"}, {"id": 8, "kind": "基礎", "topic": "行銷組合", "q": "4C 的顧客成本相較於產品標價，範圍有何差異？", "options": ["僅計算售價扣除折扣後的實付金額", "涵蓋取得、學習、使用及處置的相關付出", "僅增加企業投入的研發與固定成本", "僅計算顧客取得產品前的交通費用"], "answer": 1, "explain": "總成本可包含金錢、時間、心力及其他顧客負擔，不能只看標價。"}, {"id": 9, "kind": "基礎", "topic": "行銷組合", "q": "依摘要區分 4R 與 4S，哪個比較較適當？", "options": ["前者偏重線上趣味，後者偏重技術研發", "前者偏重生產效率，後者偏重市場區隔", "前者偏重互利關係，後者偏重服務體驗", "前者偏重附加價值，後者偏重企業訂價"], "answer": 2, "explain": "依摘要，4R 著重關聯、反應、關係與回報；4S 著重滿意、服務、速度與誠意。"}, {"id": 10, "kind": "基礎", "topic": "行銷組合", "q": "依摘要，4I 的「利益原則」較適合如何理解？", "options": ["將所有線上活動改為付費參與", "提供參與者能感受到的收穫", "以參與人數替代顧客得到的價值", "以企業當期毛利作為唯一標準"], "answer": 1, "explain": "4I 從線上參與者角度看趣味、利益、互動與個性，利益不僅指企業獲利。"}, {"id": 11, "kind": "基礎", "topic": "行銷組合", "q": "評估行銷 5.0 導入是否恰當，哪個判準較核心？", "options": ["採用工具是否為市場最新版本", "科技是否改善顧客問題與體驗", "自動化設備數量是否高於同業", "人工服務比例是否逐年下降"], "answer": 1, "explain": "人本目的應引導科技選擇；新穎或自動化程度不是價值的充分證據。"}, {"id": 12, "kind": "基礎", "topic": "價值與效用", "q": "依摘要，數量效用與組合效用的差異是？", "options": ["前者處理付款移轉，後者處理功能說明", "前者處理購買時段，後者處理購買地點", "前者處理購買份量，後者處理不同商品搭配", "前者處理產品加工，後者處理付款方式"], "answer": 2, "explain": "份量適配屬數量效用，不同品項一次配齊屬組合效用。"}, {"id": 13, "kind": "基礎", "topic": "價值與效用", "q": "依摘要，空間效用與擁有效用的差異是？", "options": ["前者著重取得地點，後者著重取得或使用權的便利", "前者著重產品資訊，後者著重購買份量", "前者著重付款條件，後者著重通路位置", "前者著重取得時段，後者著重產品加工"], "answer": 0, "explain": "地點可及性與完成取得的條件不同，兩者可同時改善但分析焦點有別。"}, {"id": 14, "kind": "基礎", "topic": "需求管理", "q": "對「潛在需求」與「衰退需求」的區分，哪個判準最關鍵？", "options": ["顧客是否首次購買，或曾參加會員活動", "需求尚缺合適解方，或既有需求正呈下降", "產品是否由國內製造，或由國外輸入", "售價是否低於成本，或高於市場均價"], "answer": 1, "explain": "潛在需求是未被滿足的需要；衰退需求是需求隨時間降低，對策分別偏開發與再行銷。"}, {"id": 15, "kind": "基礎", "topic": "需求管理", "q": "「無需求」與「負需求」的差異，最適當的是？", "options": ["前者供給不足，後者供給過量", "前者尚無產品，後者已有替代品", "前者缺乏興趣，後者存在抗拒", "前者購買減少，後者購買波動"], "answer": 2, "explain": "無需求與負需求的差別在態度：不感興趣與主動排斥需要不同處理。"}, {"id": 16, "kind": "基礎", "topic": "需求管理", "q": "低行銷與反行銷的任務差異，何者較適當？", "options": ["前者用於需求衰退，後者用於需求波動", "前者用於需求未滿足，後者用於顧客不知情", "前者著重品質改善，後者著重通路增加", "前者調降過量需求，後者抑制有害需求"], "answer": 3, "explain": "低行銷處理超額需求，反行銷處理有害需求，兩者的目的不同。"}, {"id": 17, "kind": "基礎", "topic": "需求管理", "q": "需求管理的目標，何者較完整？", "options": ["使所有短期促銷均帶來立即銷售成長", "使每個市場的顧客都以同樣頻率購買", "使需求水準與時機符合組織目標與條件", "使所有產品在各時段都維持最高銷量"], "answer": 2, "explain": "需求管理可能增加、維持、調節或降低需求，取決於需求狀態。"}, {"id": 18, "kind": "基礎", "topic": "行銷觀念", "q": "產品觀念與行銷觀念最主要的差異是？", "options": ["採用高價策略，或採用低價策略", "採用直營通路，或採用經銷通路", "以產品優越性為起點，或以顧客問題為起點", "重視長期關係，或重視短期成交"], "answer": 2, "explain": "兩者都可能改善產品，但決策起點與成功判準不同。"}, {"id": 19, "kind": "基礎", "topic": "行銷觀念", "q": "辨識銷售觀念與行銷觀念時，哪個問題最有幫助？", "options": ["企業先決定要賣什麼，還是先確認誰需要什麼", "企業是否提供短期優惠與折價方案", "企業是否設有專責的業務銷售部門", "企業是否同時使用實體與網路廣告"], "answer": 0, "explain": "是否促銷不能單獨區分，應看活動是由既有產品還是顧客需求出發。"}, {"id": 20, "kind": "基礎", "topic": "行銷觀念", "q": "關係行銷的「互利」較適合如何理解？", "options": ["顧客持續得到價值，企業取得可持續的往來成果", "企業延長契約期限，顧客失去比較其他方案的機會", "顧客每次取得最低價格，企業不計服務成本", "企業累積更多名單，顧客增加接收訊息次數"], "answer": 0, "explain": "關係需要雙方受益，不能僅以名單量、綁約或無限制讓利判斷。"}, {"id": 21, "kind": "基礎", "topic": "行銷觀念", "q": "社會行銷觀念相較於顧客導向，額外強調什麼？", "options": ["以公益捐款完全替代產品品質管理", "將顧客偏好排除於企業決策之外", "同時納入社會長期利益與外部影響", "以社會曝光取代所有企業獲利目標"], "answer": 2, "explain": "它是在企業與顧客利益外納入社會利益，而非取消其中任何一方。"}, {"id": 22, "kind": "基礎", "topic": "管理程序", "q": "在 R → STP → MM → I → C 中，MM 最適合產出什麼？", "options": ["彼此配合的產品、價格、通路與推廣方案", "用來描述各群消費者差異的研究資料", "對執行結果與既定目標的差距分析", "用來衡量實際服務是否到位的稽核結果"], "answer": 0, "explain": "MM 是行銷組合規劃；研究、控制與執行稽核各有不同任務。"}, {"id": 23, "kind": "基礎", "topic": "管理程序", "q": "市場區隔與目標市場選擇的先後關係，何者較適當？", "options": ["先訂出最低售價，再將購買者視為相同群體", "先辨識有意義的差異，再評估要服務哪些群體", "先統一所有顧客需求，再決定產品標準規格", "先決定廣告媒體，再以曝光人數定義所有群體"], "answer": 1, "explain": "區隔用來理解差異，選擇目標市場則涉及吸引力與企業能力的評估。"}, {"id": 24, "kind": "基礎", "topic": "管理程序", "q": "行銷控制對下一輪規劃的主要作用為何？", "options": ["將各項成果統一換成曝光數比較", "將已執行的計畫固定為下年度標準", "將未達目標的活動自動判定為無需求", "將績效差距與原因回饋至策略修正"], "answer": 3, "explain": "控制應解釋結果並改善，不能直接由單一指標推定需求狀態。"}, {"id": 25, "kind": "應用", "topic": "核心概念", "q": "訪談發現消費者想買高階耳機，但目前預算不足。企業若估算近期可成交市場，應如何處理？", "options": ["將此群歸為主動抗拒耳機的負需求群體", "將此群列為有慾望者，另確認購買能力與時點", "將此群直接視為本期可成交需求的全部", "將此群歸為對耳機沒有基本需要的群體"], "answer": 1, "explain": "想要不等於現期有效需求；市場估計還需購買能力與購買意願等資訊。"}, {"id": 26, "kind": "應用", "topic": "核心概念", "q": "同一人平日買平價咖啡提神，假日買精品咖啡體驗風味。哪項推論較合理？", "options": ["咖啡價格提高會使生理需要轉為需求", "平日購買屬需求，假日購買只屬需要", "該消費者的兩次購買必有一次不理性", "相同品類在不同情境可滿足不同動機"], "answer": 3, "explain": "平日偏功利，假日偏享樂；應依情境與動機分析，不能只按品類分類。"}, {"id": 27, "kind": "應用", "topic": "核心概念", "q": "學員報名公開演講課，表示最重視「在同事面前獲得肯定」。依馬斯洛架構，最直接對應何者？", "options": ["安全需求", "社會歸屬需求", "尊敬需求", "生理需求"], "answer": 2, "explain": "題幹強調認可與肯定，最直接對應尊敬；結交朋友才較偏歸屬。"}, {"id": 28, "kind": "應用", "topic": "核心概念", "q": "某消費者已獲同儕肯定，仍投入多年學習只為完成自己理想中的作品。最直接對應何者？", "options": ["社會歸屬需求", "自我實現需求", "尊敬需求", "安全需求"], "answer": 1, "explain": "重點在實現個人潛能與理想，而非取得外在肯定。"}, {"id": 29, "kind": "應用", "topic": "核心概念", "q": "旅館房型與設備未變，廣告卻將服務描寫得遠超實際。入住滿意度下降，最合理的解釋是？", "options": ["宣傳提高了期望，感受與期望的差距擴大", "售價未變，因此顧客的價值評估應相同", "廣告增加了資訊，所以滿意度應保持不變", "設備未變，因此滿意度下降應與行銷無關"], "answer": 0, "explain": "滿意與期望比較有關，過度承諾可能在實際績效不變時降低滿意。"}, {"id": 30, "kind": "應用", "topic": "核心概念", "q": "某通勤族選較貴的接駁服務，因能節省一小時並降低遲到風險。哪項判斷最合理？", "options": ["較高價格可能由時間與可靠性的利益補償", "購買高價服務表示不再重視顧客成本", "同一路線的服務應具有相同顧客價值", "可靠性屬企業成本，不屬顧客利益"], "answer": 0, "explain": "顧客價值是整體利益相對付出的評估，標價較高仍可能有更高價值。"}, {"id": 31, "kind": "應用", "topic": "核心概念", "q": "博物館免費辦展，盼民眾付出時間理解文化保存。哪種分析較適當？", "options": ["因對象是一般民眾，故不需確認其需要", "因無門票收入，故活動僅有管理而無行銷", "仍可分析價值與交換，對價可包含時間與參與", "展品沒有出售，故只能分析實體商品通路"], "answer": 2, "explain": "非營利與免費活動也可創造價值，交換不必只以貨幣進行。"}, {"id": 32, "kind": "應用", "topic": "行銷組合", "q": "品牌提供相同茶飲，分別測試會員價與一般價，其他條件固定。主要測試哪項決策？", "options": ["推廣", "產品", "價格", "通路"], "answer": 2, "explain": "題幹實際改變的是收費條件；告知價格的訊息才屬推廣表達。"}, {"id": 33, "kind": "應用", "topic": "行銷組合", "q": "外送平台廣告量增加，但顧客因服務區域外無法下單。最應優先檢查哪項？", "options": ["廣告記憶度", "口味豐富度", "品牌識別度", "通路可及性"], "answer": 3, "explain": "問題在服務無法交付，增加溝通不會直接解決取得障礙。"}, {"id": 34, "kind": "應用", "topic": "行銷組合", "q": "茶品牌確認顧客希望減少甜味，但只提高廣告頻率而未調整配方。最主要的失配是？", "options": ["通路增加，付款仍未回應顧客成本", "推廣增加，產品仍未回應顧客需要", "價格降低，服務仍未回應顧客便利", "包裝減量，媒體仍未回應顧客溝通"], "answer": 1, "explain": "問題在需求與產品內容的落差，單靠提高曝光難以補足。"}, {"id": 35, "kind": "應用", "topic": "行銷組合", "q": "顧客對價格沒有意見，卻常因註冊流程繁複放棄購買。從 4C 看，最適當的改善為？", "options": ["增加規格以提高產品的功能數量", "增加折價以補償企業的製造費用", "簡化流程以降低時間與心力付出", "增加曝光以提高品牌的訊息觸及"], "answer": 2, "explain": "流程摩擦屬非金錢成本；降低售價未必針對真正障礙。"}, {"id": 36, "kind": "應用", "topic": "行銷組合", "q": "客服蒐集大量意見，但從不回覆也不把意見交給改善團隊。哪項最欠缺？", "options": ["雙向溝通的回應與回饋運用", "產品規格的標準化程度", "通路據點的地理涵蓋率", "大眾媒體的訊息觸及規模"], "answer": 0, "explain": "蒐集意見只是起點，回應與運用才能形成有效溝通。"}, {"id": 37, "kind": "應用", "topic": "行銷組合", "q": "會員計畫發送許多折價券，卻忽略常客反映的退貨問題，回購持續下降。最適當的調整為？", "options": ["提高入會門檻，以縮小抱怨者的數量", "增加會員綁約，以延後顧客離開時間", "改善問題處理與持續服務，再評估會員誘因", "增加發券頻率，以折扣取代售後處理"], "answer": 2, "explain": "關係行銷需持續創造價值與處理問題，促銷次數不能替代信任。"}, {"id": 38, "kind": "應用", "topic": "行銷組合", "q": "線上活動有遊戲與獎品，但所有人只能觀看，無法回應或參與決定。依 4I，哪項最明顯不足？", "options": ["互動原則", "趣味原則", "個性原則", "利益原則"], "answer": 0, "explain": "題幹已具遊戲與獎勵，最直接缺少的是參與者與品牌的往返互動。"}, {"id": 39, "kind": "應用", "topic": "行銷組合", "q": "問答平台允許即時互動且有獎勵，卻不提供任何偏好設定，介面內容對所有人一致。依 4I，最適合補強？", "options": ["趣味原則", "利益原則", "互動原則", "個性原則"], "answer": 3, "explain": "依摘要，個性原則強調個人差異與表達；題幹缺乏個人化選擇。"}, {"id": 40, "kind": "應用", "topic": "行銷組合", "q": "餐廳為縮短出餐時間，省略必要確認而頻繁送錯餐。依 4S，最適當的判斷是？", "options": ["只要員工態度友善便可忽略錯餐率", "速度提高即可推定整體服務品質改善", "只要延長等待時間即可恢復所有滿意度", "速度應與服務正確性及滿意度一併評估"], "answer": 3, "explain": "4S 不能只追求單一速度指標，錯誤也會破壞體驗。"}, {"id": 41, "kind": "應用", "topic": "行銷組合", "q": "禮盒原料與價格接近同業，品牌想以在地工藝故事增加認同感。依 4V，主要強化何者？", "options": ["配銷", "功能化", "數量", "共鳴"], "answer": 3, "explain": "題幹重點是情感與文化認同；若強調功能性能才較偏功能化。"}, {"id": 42, "kind": "應用", "topic": "行銷組合", "q": "商店想裝設 AI 推薦系統，但顧客最常抱怨的是無法找到真人處理異常訂單。較適當的做法是？", "options": ["先確保異常問題能獲協助，再評估科技用途", "先增加推薦曝光，以點擊量代表體驗改善", "先減少真人管道，以提高自動化採用率", "先擴大推薦品項，以商品數代表服務品質"], "answer": 0, "explain": "人本的科技運用應回應實際問題，不能只看工具使用程度。"}, {"id": 43, "kind": "應用", "topic": "價值與效用", "q": "生鮮店把營業時間延長到晚間，但據點與品項都不變。此次改變最直接增加什麼？", "options": ["形式效用", "時間效用", "組合效用", "空間效用"], "answer": 1, "explain": "唯一改變是可取得的時段，應隔離其他未變條件判斷。"}, {"id": 44, "kind": "應用", "topic": "價值與效用", "q": "品牌不改營業時段與品項，僅在偏遠地區新增取貨櫃。最直接增加什麼？", "options": ["資訊效用", "數量效用", "空間效用", "時間效用"], "answer": 2, "explain": "題幹只改變取得地點，較接近空間效用而非時段效用。"}, {"id": 45, "kind": "應用", "topic": "價值與效用", "q": "食品廠將整顆蔬菜製成可直接烹煮的切片，份量與通路不變。最直接增加什麼？", "options": ["擁有效用", "空間效用", "形式效用", "數量效用"], "answer": 2, "explain": "切片改變產品形態，並非以份量或取得條件為主要變動。"}, {"id": 46, "kind": "應用", "topic": "價值與效用", "q": "零售商推出單人小份包裝，另將不同調味料配成套組。兩項措施依序為？", "options": ["時間效用、形式效用", "形式效用、數量效用", "數量效用、組合效用", "組合效用、空間效用"], "answer": 2, "explain": "小份對應購買份量，套組對應跨品項搭配，應分別辨識。"}, {"id": 47, "kind": "應用", "topic": "價值與效用", "q": "家電網站新增型號比較表與安裝教學，價格、付款及物流皆不變。主要增加什麼？", "options": ["數量效用", "空間效用", "擁有效用", "資訊效用"], "answer": 3, "explain": "變動在理解與使用所需資訊，非付款移轉或配送位置。"}, {"id": 48, "kind": "應用", "topic": "價值與效用", "q": "某家具商在商品與配送不變下，新增合約清楚的分期方案以協助取得商品。依摘要主要增加什麼？", "options": ["空間效用", "組合效用", "形式效用", "擁有效用"], "answer": 3, "explain": "付款條件降低取得障礙，主要對應擁有效用；不代表總成本必然下降。"}, {"id": 49, "kind": "應用", "topic": "價值與效用", "q": "兩種方案品質相同，甲較便宜但須自行取貨，乙較貴但含送裝。判斷哪個價值較高時，最需補充什麼？", "options": ["競爭者在上一年度投放廣告的總次數", "兩種方案在內部報表上的商品編碼", "目標顧客對送裝利益及時間心力成本的評估", "企業為兩個方案投入的商標設計費"], "answer": 2, "explain": "沒有顧客對利益與付出的評估，無法只按標價判斷價值高低。"}, {"id": 50, "kind": "應用", "topic": "需求管理", "q": "某健康課程的受訪者認為內容無關自己，但未表達排斥。最適合先採取哪種任務？", "options": ["低行銷", "扭轉性行銷", "反行銷", "刺激性行銷"], "answer": 3, "explain": "缺乏興趣與關聯較接近無需求，應建立用途與需要的連結。"}, {"id": 51, "kind": "應用", "topic": "需求管理", "q": "另有一群人相信課程會使自己難堪，甚至願意付費避開。最適合先採取哪種任務？", "options": ["維護性行銷", "調和性行銷", "扭轉性行銷", "刺激性行銷"], "answer": 2, "explain": "這是主動抗拒而非漠不關心，應理解疑慮並改變抗拒態度。"}, {"id": 52, "kind": "應用", "topic": "需求管理", "q": "多數顧客長期尋求可重複封口又不影響回收的材料，現有方案均無法符合。主要任務是？", "options": ["低行銷", "維護性行銷", "再行銷", "開發性行銷"], "answer": 3, "explain": "需要存在而現有解方不足，應開發可滿足需要的方案。"}, {"id": 53, "kind": "應用", "topic": "需求管理", "q": "某服務過去多年受歡迎，近兩年使用人數逐季減少。排除季節因素後，最符合哪一狀態？", "options": ["不規則需求", "潛在需求", "負需求", "衰退需求"], "answer": 3, "explain": "題幹給出持續下降趨勢；不能僅因人數減少便推定顧客主動排斥。"}, {"id": 54, "kind": "應用", "topic": "需求管理", "q": "運動中心全年總需求足夠，但集中於下班後。若要優先平衡現有設備使用，最適當的是？", "options": ["將所有會員改為相同到場時段", "全面增加尖峰曝光以提高來客", "停止所有宣傳以消除全年需求", "提供離峰誘因並調整預約安排"], "answer": 3, "explain": "問題在時機不平均，應調和時段分布，不必一律提高或消滅需求。"}, {"id": 55, "kind": "應用", "topic": "需求管理", "q": "場館整季每個時段都超過可承載人數，且短期無法擴建。哪項最符合當前任務？", "options": ["取消預約以增加自由入場人數", "限制預約名額並降低過量需求", "增加廣告頻率並提高到場誘因", "向所有時段發放不限量折價券"], "answer": 1, "explain": "所有時段都超額，不能僅靠移轉到離峰；應使需求符合容量。"}, {"id": 56, "kind": "應用", "topic": "需求管理", "q": "某產品需求已達企業預期水準且供應穩定。下一步較適合？", "options": ["維持品質與滿意，監測偏好及競爭變化", "大幅擴張促銷，以確認需求能否超額", "停止品質投入，將預算全轉向新客", "立即調高價格，以壓低全部需求"], "answer": 0, "explain": "維護性行銷不是不作為，而是持續維護與監測適當需求水準。"}, {"id": 57, "kind": "應用", "topic": "需求管理", "q": "一項活動以降低社會傷害為由，盼某有害行為逐步消失。它與演唱會限量售票的主要差異為何？", "options": ["前者恢復衰退需求，後者刺激無需求", "前者調和波動需求，後者開發潛在需求", "前者抑制有害需求，後者調節超額需求", "前者維護既有需求，後者扭轉負需求"], "answer": 2, "explain": "兩者都可能減少數量，但有害與超額的判準及目的不同。"}, {"id": 58, "kind": "應用", "topic": "需求管理", "q": "經理只看到某月銷量下降，便決定採再行銷。做決策前最應補充哪項資訊？", "options": ["當月辦公室固定租金的付款日期", "公司是否有足夠多的社群帳號", "是否為持續趨勢，以及是否有缺貨或季節因素", "業務名片是否採用新的字體與配色"], "answer": 2, "explain": "銷量不是需求的完整觀察，缺貨與季節波動也會造成下降。"}, {"id": 59, "kind": "應用", "topic": "需求管理", "q": "某旅遊景點平日人少、連假超載。提高全年所有日期票價，可能有何問題？", "options": ["未針對時段差異，可能連平日需求也被壓低", "只要提高價格就必然使各時段需求平均", "連假超載即代表此景點屬有害需求", "平日需求較少即代表旅客主動排斥景點"], "answer": 0, "explain": "應先辨識波動，依時段管理；總量壓抑未必能達到調和效果。"}, {"id": 60, "kind": "應用", "topic": "行銷觀念", "q": "廠商把掃地機定義為「更強吸力的機器」，卻忽略顧客最在意卡住時無人處理。最值得修正的是？", "options": ["以增加馬達型號作為處理所有客訴的主軸", "將競爭焦點擴及顧客完成清潔任務的整體體驗", "以工程測試名次作為市場需要的唯一依據", "以更高吸力規格作為顧客滿意的替代指標"], "answer": 1, "explain": "行銷近視可能來自只看產品，未看顧客希望解決的完整問題。"}, {"id": 61, "kind": "應用", "topic": "行銷觀念", "q": "甲公司先訂產量再推銷；乙公司先研究家庭份量需要再決定產量。兩者主要差異是？", "options": ["銷售導向與顧客導向的決策起點不同", "甲必然低價，乙必然採取高價策略", "甲必然使用廣告，乙必然不用廣告", "甲必然短期獲利，乙必然短期虧損"], "answer": 0, "explain": "決策起點可辨識觀念，但不能由此必然推論媒體、價格或財務成果。"}, {"id": 62, "kind": "應用", "topic": "行銷觀念", "q": "工廠採大量標準化生產，研究也顯示目標客群最在意低價與容易取得。較合理的判斷是？", "options": ["只要大量生產，就不可能具有顧客導向", "該做法可符合此情境，仍須持續確認需求", "只要研究過顧客，就不應再追求生產效率", "只要售價低，就不需要確認品質與可用性"], "answer": 1, "explain": "生產效率與顧客導向並非互斥，重點在是否符合目標需求而非僵化套用。"}, {"id": 63, "kind": "應用", "topic": "行銷觀念", "q": "企業以高額獎金獎勵當月成交，造成誇大承諾與退貨增加。最適合的修正為？", "options": ["將客訴處理延後到下一個考核年度", "將履約品質與後續留存納入績效評估", "將退貨資料排除於業務考核之外", "將成交獎金改為依承諾項目數量計算"], "answer": 1, "explain": "只獎勵短期成交易使誘因失衡，應把顧客結果與履約納入。"}, {"id": 64, "kind": "應用", "topic": "行銷觀念", "q": "品牌推出環保包裝，但產品難以使用、價格也超出目標客群負擔。依社會行銷觀念，應如何評估？", "options": ["只要售價提高，即可推定社會利益增加", "只要有公益訴求，即可不評估使用體驗", "仍需整合顧客價值、企業可持續性與社會利益", "只要包裝較環保，即可判定三方已達平衡"], "answer": 2, "explain": "社會行銷觀念要求平衡，單一環保措施不是整體成功的充分證據。"}, {"id": 65, "kind": "應用", "topic": "行銷觀念", "q": "行銷部承諾隔日到貨，但物流未獲通知且庫存不足。最根本的管理問題是？", "options": ["對外承諾未與跨部門交付能力整合", "市場區隔的群數尚未超過競爭者", "廣告版面未放上更多產品的規格", "顧客購買頻率未被設定成固定次數"], "answer": 0, "explain": "行銷承諾需要物流、庫存等部門支持，否則溝通與實際交付脫節。"}, {"id": 66, "kind": "應用", "topic": "行銷觀念", "q": "門市員工不知道新會員權益，無法回答顧客。優先補強何者？", "options": ["擴大對外觸及以增加員工被詢問次數", "員工理解與服務能力的內部行銷", "將原有顧客再劃分更多價格群體", "增加包裝特色以替代權益說明"], "answer": 1, "explain": "內部行銷讓員工理解並有能力落實承諾，而不是只向外宣傳。"}, {"id": 67, "kind": "應用", "topic": "行銷觀念", "q": "公司把會員人數當作關係經營成功的唯一證據，但活躍與回購均下降。最適當的評估補充是？", "options": ["只比較會員資料欄位的填寫比例", "追蹤持續使用、回購與問題處理後的留存", "只統計本月新發出的會員卡張數", "只比較每次促銷的訊息傳送量"], "answer": 1, "explain": "會員規模不等於關係品質，應評估實際往來與價值是否延續。"}, {"id": 68, "kind": "應用", "topic": "管理程序", "q": "團隊訪談後整理出「省時型、體驗型、價格敏感型」三群，尚未選擇服務對象。正在進行何者？", "options": ["市場定位", "行銷執行", "目標市場選擇", "市場區隔"], "answer": 3, "explain": "辨識群體差異是區隔；評估並選定服務群體才是目標市場選擇。"}, {"id": 69, "kind": "應用", "topic": "管理程序", "q": "企業比較各群規模、競爭及自身能力，最後只服務其中兩群。主要屬於何者？", "options": ["市場定位", "目標市場選擇", "績效控制", "市場區隔"], "answer": 1, "explain": "此時不是辨識群體，而是在群體間進行取捨。"}, {"id": 70, "kind": "應用", "topic": "管理程序", "q": "品牌已選通勤族，決定讓顧客將自己視為「趕時間時最可靠的早餐選擇」。主要屬於何者？", "options": ["績效控制", "市場區隔", "市場定位", "需求扭轉"], "answer": 2, "explain": "定位著重品牌在目標顧客心中相對其他選擇的意義與形象。"}, {"id": 71, "kind": "應用", "topic": "管理程序", "q": "已選定服務客群後，團隊決定套餐、售價、取餐方式及宣傳內容。主要屬於何者？", "options": ["行銷組合規劃", "產業範圍定義", "市場區隔分析", "績效控制修正"], "answer": 0, "explain": "產品、價格、通路與推廣共同構成 MM，而非重新選客群。"}, {"id": 72, "kind": "應用", "topic": "管理程序", "q": "方案核定後，團隊安排人員排班、備貨並實際上架。主要屬於何者？", "options": ["調查", "控制", "定位", "執行"], "answer": 3, "explain": "將方案轉為實際工作與交付屬 I；比較結果與目標才屬 C。"}, {"id": 73, "kind": "應用", "topic": "管理程序", "q": "活動觸及達標，但試用率未達目標。下一步最適當的是？", "options": ["忽略試用結果，僅將下一期觸及目標加倍", "檢查觸及對象與試用流程，找出落差原因", "因試用未達標，直接判定產品為有害需求", "因觸及達標，直接判定所有行銷目標達成"], "answer": 1, "explain": "控制需依目標與因果線索分析，單一上游指標不能代表全部成效。"}, {"id": 74, "kind": "應用", "topic": "管理程序", "q": "品牌發現新品連續缺貨，銷量低於目標。若直接認為顧客沒興趣，主要忽略什麼？", "options": ["供應與交付限制會壓低可觀察的銷售量", "行銷需求只由廣告頻率決定", "需求狀態必須只依單月數字分類", "產品價格與需求判斷沒有關係"], "answer": 0, "explain": "缺貨時未成交不代表沒有需求，應先排除供應因素。"}, {"id": 75, "kind": "應用", "topic": "管理程序", "q": "企業想知道新產品是否回應目標需要，只有整體曝光數據。最適合新增哪項觀察？", "options": ["廣告檔案輸出的尺寸與容量", "辦公室內部文具採購的件數", "所有非目標客群看到廣告的總人次", "目標客群試用後的問題解決程度與回饋"], "answer": 3, "explain": "應回到目標顧客是否獲得價值，而非只衡量訊息輸送。"}, {"id": 76, "kind": "應用", "topic": "行銷組合", "q": "公司主打熟齡族，卻將下單介面設為小字且步驟複雜。最適當的改善方向是？", "options": ["將難以上手視為提高品牌定位的方法", "使通路與介面配合目標客群的使用能力", "以增加產品規格替代下單流程的改善", "以提高折扣頻率替代使用障礙的處理"], "answer": 1, "explain": "行銷組合需彼此一致；目標客群與取得方式不能脫節。"}, {"id": 77, "kind": "應用", "topic": "價值與效用", "q": "品牌推出低價印表機，但耗材昂貴且難購得。評估方案時最應避免哪種偏誤？", "options": ["只比較首次購買價格而忽略後續總付出", "依目標使用量估計長期支出", "將維護便利性納入利益與成本", "同時衡量耗材價格與取得時間"], "answer": 0, "explain": "低入手價未必意味低總成本，需納入使用生命週期中的付出。"}, {"id": 78, "kind": "應用", "topic": "需求管理", "q": "同一產品在甲地區被排斥、乙地區則無人了解。較適當的做法是？", "options": ["視為同一種需求狀態，使用同一說服方式", "兩地均採低行銷，減少接觸與購買機會", "分別診斷態度與資訊障礙，採不同需求管理", "兩地均採維護性行銷，維持既有需求"], "answer": 2, "explain": "需求狀態應依目標市場判斷，負需求與無需求需要不同任務。"}, {"id": 79, "kind": "應用", "topic": "行銷觀念", "q": "某品牌產品品質穩定，卻發現目標客群已轉向另一種使用方式。較適當的回應是？", "options": ["維持原有規格，僅強調過往品質獎項", "重新研究使用情境，再調整整體價值方案", "停止顧客訪談，以避免影響產品標準", "維持既有通路，將流失一律歸因價格"], "answer": 1, "explain": "需求與情境會變，品質穩定不代表價值方案仍適配。"}, {"id": 80, "kind": "應用", "topic": "管理程序", "q": "兩群顧客需要不同服務，但企業資源只能做好一群。哪項決策較符合 STP 精神？", "options": ["不分析差異，先以最多規格涵蓋所有人", "將兩群需求平均，提供兩者都不滿意的方案", "只依全體人口數量決定每一項服務內容", "依群體吸引力與能力配適選擇服務對象"], "answer": 3, "explain": "目標市場選擇包含取捨，應評估是否能有效提供價值。"}];

try{history=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(history))throw Error();history=history.filter(h=>h&&typeof h.id==='string'&&Number.isFinite(h.score)&&Array.isArray(h.details));}catch(e){storageOK=false;notice('無法讀取成績紀錄。本次仍可練習，請使用匯出功能保存結果。')}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){if(session&&!session.result&&!confirm('重新抽題會捨棄目前尚未交卷的作答，確定繼續？'))return;const picked=shuffle([...shuffle(BANK.filter(q=>q.kind==='基礎')).slice(0,6),...shuffle(BANK.filter(q=>q.kind==='應用')).slice(0,14)]);session={start:Date.now(),questions:picked.map(q=>({...q,order:shuffle([0,1,2,3])})),answers:{},result:null};index=0;renderQuestion()}
function home(){if(session&&!session.result&&!confirm('返回首頁會捨棄尚未交卷的作答，確定繼續？'))return;session=null;renderHome()}
function renderHome(){const best=history.length?Math.max(...history.map(h=>h.score)):'—';const avg=history.length?Math.round(history.reduce((n,h)=>n+h.score,0)/history.length):'—';app.innerHTML=`<section class="card"><span class="pill">CH1 進階理解練習</span><h2 style="margin-top:15px">一次 20 題，練習判斷與整合</h2><p>80 題進階單選題庫（24 題基礎、56 題應用），每回隨機抽取 <b>6 題基礎知識＋14 題實際應用</b>。每題 5 分，不限時；交卷後顯示成績、正確答案與解析。</p><div class="stats"><div class="stat"><b>${history.length}</b><small>完成回數</small></div><div class="stat"><b>${best}</b><small>最高分 / 100</small></div><div class="stat"><b>${avg}</b><small>平均分 / 100</small></div></div><button class="primary" onclick="start()">開始隨機練習 →</button></section><section class="card"><div class="topline"><h2>歷次成績</h2><small>儲存在此瀏覽器</small></div><div class="actions"><button onclick="exportHistory()" ${history.length?'':'disabled'}>匯出紀錄備份</button><button onclick="document.getElementById('importFile').click()">匯入備份</button><input id="importFile" class="hidden" type="file" accept=".json,application/json" onchange="importHistory(this)"><button onclick="clearHistory()" ${history.length?'':'disabled'}>清除紀錄</button></div>${history.length?`<div class="tablewrap"><table><thead><tr><th>練習時間</th><th>成績</th><th>答對</th><th>用時</th><th>解析</th></tr></thead><tbody>${history.map(h=>`<tr><td>${esc(new Date(h.date).toLocaleString('zh-TW'))}</td><td><b>${h.score} 分</b></td><td>${h.correct} / 20</td><td>${duration(h.seconds)}</td><td><button onclick="viewHistory('${esc(h.id)}')">查看</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">尚無紀錄。完成第一回，開始累積你的學習足跡。</p>'}</section>`}
function duration(s){return `${Math.floor(s/60)} 分 ${s%60} 秒`}
function renderQuestion(){const q=session.questions[index],answered=Object.keys(session.answers).length;app.innerHTML=`<section class="card"><div class="topline"><b>第 ${index+1} / 20 題</b><span class="muted">已作答 ${answered} / 20</span></div><progress max="20" value="${answered}"></progress><span class="pill">進階單選題</span><h2 style="margin-top:20px" id="questionHeading" tabindex="-1">${q.q}</h2><fieldset style="border:0;padding:0;margin:0"><legend class="muted">請選擇一個最適合的答案</legend><div class="options">${q.order.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${session.answers[q.id]===o?'checked':''} onchange="chooseDisplay(${i})"><span><b>${'ABCD'[i]}.</b> ${q.options[o]}</span></label>`).join('')}</div></fieldset><div class="actions"><button onclick="move(-1)" ${index===0?'disabled':''}>← 上一題</button>${index<19?'<button class="primary" onclick="move(1)">下一題 →</button>':''}<button onclick="submitQuiz()">交卷看解析</button><button onclick="home()">返回首頁</button></div><div class="navgrid" aria-label="題號導覽">${session.questions.map((x,i)=>`<button aria-label="第 ${i+1} 題${session.answers[x.id]!==undefined?'，已作答':''}" class="${i===index?'current ':''}${session.answers[x.id]!==undefined?'done':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><small>綠底表示已作答，可隨時切換題號修改答案。未交卷作答不會在重新整理後保留。</small></section>`}
function chooseDisplay(i){const q=session.questions[index];choose(q.id,q.order[i])}
function choose(id,o){session.answers[id]=o;renderQuestion()}
function jump(i){index=i;renderQuestion();document.getElementById('questionHeading').focus()}
function move(n){jump(index+n)}
function submitQuiz(){const missing=20-Object.keys(session.answers).length;if(!confirm(missing?`還有 ${missing} 題未作答，交卷將以答錯計算。確定交卷？`:'確定交卷並查看解析？'))return;const details=session.questions.map(q=>({id:q.id,choice:session.answers[q.id]??null,order:q.order}));const correct=details.filter(d=>d.choice===BANK.find(q=>q.id===d.id).answer).length;const result={id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),date:new Date().toISOString(),score:correct*5,correct,seconds:Math.round((Date.now()-session.start)/1000),details};session.result=result;history.unshift(result);persist();filter='all';renderResult(result)}
function viewHistory(id){const h=history.find(h=>h.id===id);if(h){session={result:h};filter='all';renderResult(h)}}
function renderResult(r){const groups={};r.details.forEach(d=>{const q=BANK.find(x=>x.id===d.id);const g=groups[q.topic]??={total:0,correct:0};g.total++;g.correct+=Number(d.choice===q.answer)});app.innerHTML=`<section class="card"><div class="topline"><h2>本回練習結果</h2><small>${esc(new Date(r.date).toLocaleString('zh-TW'))}</small></div><div class="score">${r.score}<small style="font-size:18px"> / 100</small></div><p>答對 ${r.correct} / 20 題 · 用時 ${duration(r.seconds)}</p><p class="muted">${r.score>=80?'觀念逐漸穩固！看看解析，確認自己能說出原因。':'先找出混淆的概念，再用解析中的關鍵線索重新判斷。'}</p><div class="actions"><button class="primary" onclick="start()">再抽 20 題</button><button onclick="home()">回首頁看紀錄</button><button onclick="exportHistory()">匯出成績備份</button></div><h3>各主題表現</h3>${Object.entries(groups).map(([t,g])=>`<span class="pill">${t} ${g.correct}/${g.total}</span>`).join('')}</section><section><div class="topline"><h2>逐題解析</h2><div><button onclick="setFilter('all')" ${filter==='all'?'disabled':''}>全部</button> <button onclick="setFilter('wrong')" ${filter==='wrong'?'disabled':''}>只看錯題</button></div></div><div style="margin-top:18px">${r.details.map((d,i)=>{const q=BANK.find(x=>x.id===d.id),ok=d.choice===q.answer;if(filter==='wrong'&&ok)return '';return `<article class="card review ${ok?'':'bad'}"><span class="pill">${q.kind} · ${q.topic}</span><h3>${i+1}. ${q.q}</h3><p class="${ok?'right':'wrong'}">${ok?'✓ 答對':'✕ '+(d.choice===null?'未作答':'答錯')}｜你的答案：${d.choice===null?'未作答':esc(q.options[d.choice])}</p><p><b>正確答案：${q.options[q.answer]}</b></p><p class="muted">${q.explain}</p></article>`}).join('')}${filter==='wrong'&&r.correct===20?'<div class="card">本回全對，沒有錯題！</div>':''}</div></section>`}
function setFilter(f){filter=f;renderResult(session.result)}
function exportHistory(){const blob=new Blob([JSON.stringify({version:2,bank:'advanced80-v1',history},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='行銷進階80題成績備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importHistory(input){const file=input.files[0];if(!file)return;try{if(file.size>5000000)throw Error();const data=JSON.parse(await file.text());if(data.version!==2||data.bank!=='advanced80-v1'||!Array.isArray(data.history)||data.history.length>10000)throw Error();for(const h of data.history){if(!h||typeof h.id!=='string'||!/^[a-z0-9]+$/.test(h.id)||!Number.isFinite(Date.parse(h.date))||!Number.isInteger(h.seconds)||h.seconds<0||!Array.isArray(h.details)||h.details.length!==20||new Set(h.details.map(d=>d.id)).size!==20)throw Error();for(const d of h.details){if(!Number.isInteger(d.id)||!BANK.some(q=>q.id===d.id)||!(d.choice===null||Number.isInteger(d.choice)&&d.choice>=0&&d.choice<4))throw Error()}h.correct=h.details.filter(d=>d.choice===BANK.find(q=>q.id===d.id).answer).length;h.score=h.correct*5}const ids=new Set(history.map(h=>h.id));history=[...history,...data.history.filter(h=>!ids.has(h.id))].sort((a,b)=>new Date(b.date)-new Date(a.date));persist();renderHome();alert('備份已匯入。')}catch(e){alert('無法匯入：請選擇本練習室匯出的有效 JSON 備份。')}input.value=''}
function clearHistory(){if(confirm('確定清除所有歷次成績？建議先匯出備份，清除後無法復原。')){history=[];persist();renderHome()}}
renderHome();
</script></body></html>
