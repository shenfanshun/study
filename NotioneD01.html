<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 筆記選擇測驗</title>
<style>
  :root{
    --ink:#1a2230; --soft:#48566b; --line:#e2e6ed; --paper:#f6f8fb;
    --box:#fff; --band:#f1f4f9; --accent:#7c3aed;
    --good:#16a34a; --goodbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    line-height:1.6;font-size:16px}
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 80px}
  header.top{border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:20px}
  .kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);font-weight:700}
  h1{font-size:24px;margin:6px 0 4px;letter-spacing:-.01em}
  .sub{color:var(--soft);font-size:14px}

  /* screens */
  .screen{display:none}
  .screen.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* topic cards */
  .grid{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
  .topic{border:1px solid var(--line);border-left:6px solid var(--tc,#3f5f9f);
    border-radius:12px;background:var(--box);padding:16px 16px;cursor:pointer;
    text-align:left;transition:transform .12s ease,box-shadow .12s ease;font:inherit;color:inherit}
  .topic:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(26,34,48,.08)}
  .topic:active{transform:translateY(0)}
  .topic .tname{font-weight:700;font-size:15.5px;margin-bottom:4px}
  .topic .tmeta{font-size:12.5px;color:var(--soft)}

  .hint{background:var(--band);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin:18px 0 8px;font-size:13.5px;color:var(--soft)}

  /* quiz */
  .bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .chip{font-size:12.5px;font-weight:700;padding:3px 12px;border-radius:20px;
    background:var(--accent);color:#fff}
  .progress{flex:1;min-width:120px;height:8px;background:var(--line);border-radius:20px;overflow:hidden}
  .progress > i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
  .count{font-size:13px;color:var(--soft);font-weight:600;white-space:nowrap}

  .qcard{background:var(--box);border:1px solid var(--line);border-radius:14px;
    padding:20px 18px;margin-bottom:14px}
  .qnum{font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:.05em}
  .qtext{font-size:17px;font-weight:600;margin:6px 0 16px;line-height:1.5}
  .opts{display:grid;gap:10px}
  .opt{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--line);
    border-radius:10px;padding:12px 14px;background:#fff;cursor:pointer;
    font:inherit;color:inherit;text-align:left;transition:border-color .12s,background .12s;width:100%}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--band)}
  .opt .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--band);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--soft)}
  .opt .otext{flex:1;font-size:15px;line-height:1.45}
  .opt:disabled{cursor:default}
  .opt.correct{border-color:var(--good);background:var(--goodbg)}
  .opt.correct .k{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--badbg)}
  .opt.wrong .k{background:var(--bad);color:#fff}
  .opt.dim{opacity:.6}
  .fb{margin-top:12px;font-size:13.5px;font-weight:600;display:none}
  .fb.show{display:block}
  .fb.ok{color:var(--good)}
  .fb.no{color:var(--bad)}

  .nav{display:flex;gap:10px;margin-top:4px}
  .btn{font:inherit;font-weight:700;border:none;border-radius:10px;padding:12px 20px;
    cursor:pointer;transition:opacity .12s,transform .1s}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.ghost{background:var(--box);border:1.5px solid var(--line);color:var(--ink)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.full{width:100%}

  /* result */
  .result{background:var(--box);border:1px solid var(--line);border-radius:16px;
    padding:28px 22px;text-align:center;margin-bottom:16px}
  .score{font-size:52px;font-weight:800;line-height:1;margin:6px 0}
  .score small{font-size:22px;color:var(--soft);font-weight:700}
  .rlabel{font-size:16px;font-weight:700;margin-bottom:6px}
  .rmsg{color:var(--soft);font-size:14px}
  .review{margin-top:8px}
  .rev{border:1px solid var(--line);border-radius:12px;background:var(--box);
    padding:14px 16px;margin-bottom:10px;text-align:left}
  .rev .rq{font-weight:600;font-size:14.5px;margin-bottom:8px}
  .rev .rline{font-size:13.5px;margin:3px 0;display:flex;gap:8px}
  .rev .tagok{color:var(--good);font-weight:700;white-space:nowrap}
  .rev .tagno{color:var(--bad);font-weight:700;white-space:nowrap}
  .rev .yours.miss{color:var(--bad)}
  footer{margin-top:30px;border-top:1px solid var(--line);padding-top:12px;color:var(--soft);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="kicker">考前速讀 · 自我測驗</div>
    <h1 id="pageTitle">AI 筆記選擇測驗</h1>
    <div class="sub" id="pageSub">選擇主題，每次隨機抽 10 題作答</div>
  </header>

  <!-- 主題選擇 -->
  <section id="home" class="screen active">
    <div class="grid" id="topicGrid"></div>
    <div class="hint">每個主題共 <b>50 題</b>，開始後系統會隨機抽出 <b>10 題</b>。作答後立即顯示對錯，結束可看解答回顧並重新測驗。</div>
  </section>

  <!-- 測驗中 -->
  <section id="quiz" class="screen">
    <div class="bar">
      <span class="chip" id="quizChip">主題</span>
      <span class="progress"><i id="progBar"></i></span>
      <span class="count" id="quizCount">1 / 10</span>
    </div>
    <div class="qcard">
      <div class="qnum" id="qNum">第 1 題</div>
      <div class="qtext" id="qText"></div>
      <div class="opts" id="optWrap"></div>
      <div class="fb" id="feedback"></div>
    </div>
    <div class="nav">
      <button class="btn ghost" id="quitBtn">結束</button>
      <button class="btn primary" id="nextBtn" disabled>下一題</button>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" class="screen">
    <div class="result">
      <div class="rlabel" id="rTopic">主題</div>
      <div class="score"><span id="rScore">0</span><small> / 10</small></div>
      <div class="rmsg" id="rMsg"></div>
    </div>
    <div class="nav" style="margin-bottom:18px">
      <button class="btn ghost" id="homeBtn">回主題</button>
      <button class="btn primary" id="retryBtn">再測 10 題</button>
    </div>
    <div class="review" id="review"></div>
  </section>

  <footer>整理自「考前速讀」系列筆記 · 題庫共 7 主題 × 50 題</footer>
</div>
<script>
/* 題庫：每個主題 50 題（前 30 題概念/定義題，後 20 題情境應用題），4 選 1，answer 為正解索引 */
const QUIZ_DATA = {
  benchmark: {
    title: "AI 常見 Benchmark 測試",
    color: "#3f5f9f",
    questions: [
      /* ---- 概念/定義題 30 ---- */

      {q:"MMLU 主要測試什麼能力？", o:["圖片分類","通識＋專業知識（57 個學科）","語音辨識","程式除錯"], a:1},
      {q:"MMLU 的題型是？", o:["問答申論","選擇題","填空","看圖回答"], a:1},

      {q:"GSM8K 主要測什麼？", o:["高中競賽數學","國小～國中數學文字題","中文閱讀","圖片分類"], a:1},
      {q:"GSM8K 特別重視模型的什麼表現？", o:["回答速度","記憶容量","一步步的思考過程","圖像品質"], a:2},
      {q:"MATH 這個 Benchmark 的難度大約是？", o:["幼稚園程度","高中～競賽等級","國小程度","無難度"], a:1},
      {q:"MATH 常被類比為什麼？", o:["英文閱讀測驗","數學奧林匹亞","看圖說物","中文學測"], a:1},
      {q:"GLUE / SuperGLUE 屬於哪一類 Benchmark？", o:["圖像分類","語言理解與生成","多模態","數學推理"], a:1},
      {q:"HellaSwag 測試的核心能力是？", o:["常識推理（句子補完）","高等數學","圖片分類","語音合成"], a:0},

      {q:"ARC 分成哪兩種難度？", o:["初級與高級","Easy 與 Challenge","簡單與普通","基礎與進階"], a:1},
      {q:"VQA（Visual Question Answering）是做什麼的？", o:["看圖片回答問題","純文字問答","數學計算","語音辨識"], a:0},
      {q:"ImageNet 主要用於什麼任務？", o:["文本翻譯","圖片分類","數學推理","情感分析"], a:1},
      {q:"下列哪個 Benchmark 屬於「多模態」類型？", o:["MMLU","GSM8K","VQA","GLUE"], a:2},
      {q:"為什麼需要「多個」Benchmark 而非單一分數？", o:["因為模型可能偏科或只會背不會推理","為了增加成本","為了拖慢速度","沒有特別原因"], a:0},
      {q:"Benchmark 常見的限制之一「data leakage」指的是？", o:["資料遺失","模型記住了測試答案（資料洩漏）","網路延遲","記憶體不足"], a:1},
      {q:"下列何者是 Benchmark 的新趨勢？", o:["只重視記憶力","更重視推理、多模態、真實任務（Agent）","減少測試項目","只測單一學科"], a:1},
      {q:"C-Eval 偏重哪種文化背景？", o:["歐美文化","亞洲/中文文化","非洲文化","無特定文化"], a:1},
      {q:"BIG-bench 的特點是？", o:["只測數學","涵蓋多樣任務（含創造力、推理）","只測圖像","只測中文"], a:1},
      {q:"多數 Benchmark 題目的共同特性之一是？", o:["多為靜態題目","即時更新","無標準答案","只能人工評分"], a:0},
      {q:"下列哪組全是「數學與邏輯推理」類 Benchmark？", o:["GSM8K、MATH","MMLU、C-Eval","VQA、ImageNet","GLUE、HellaSwag"], a:0},
      {q:"下列哪組全是「多模態」類 Benchmark？", o:["MMLU、GSM8K","VQA、ImageNet","GLUE、ARC","MATH、C-Eval"], a:1},
      {q:"ARC 的 Challenge 版本特性是？", o:["非常簡單","很難","不需推理","只有圖片"], a:1},
      {q:"下列何者「不是」Benchmark 的主要限制？", o:["可能被記答案","不一定代表真實能力","多為靜態題目","一定能反映所有真實世界任務"], a:3},
      {q:"MMLU 涵蓋的學科數量大約是？", o:["10 個","57 個","3 個","100 個以上（無上限）"], a:1},
      {q:"五大 Benchmark 分類中，哪一類通常被視為最核心？", o:["多模態","知識與推理","語言生成","圖像"], a:1},
      {q:"下列敘述何者正確？", o:["一個分數就能決定 AI 好壞","不同 Benchmark 測不同能力，像考不同科目","Benchmark 永遠代表真實世界","Benchmark 不會被作弊"], a:1},
      /* ---- 情境應用題 20 ---- */
      {q:"情境：你想評估一個模型的『中文專業知識與推理』能力，最該選哪個 Benchmark？", o:["ImageNet","C-Eval","GLUE","GSM8K"], a:1},
      {q:"情境：某模型在 MMLU 拿高分，但在 GSM8K 表現很差，這最可能代表？", o:["模型完全無用","知識豐富但數學推理較弱","模型只會圖像","模型當機"], a:1},

      {q:"情境：一題是『小明有 5 顆糖，吃掉 2 顆又買了 3 顆，最後剩幾顆？』屬於哪個 Benchmark？", o:["GSM8K","MMLU","VQA","ImageNet"], a:0},
      {q:"情境：你想用『真實的 SAT、GRE、法考題目』來測模型，該選？", o:["AGIEval","ImageNet","HellaSwag","VQA"], a:0},
      {q:"情境：一位模型『只會背答案、不會推理』，最容易在哪類題目露出破綻？", o:["需要一步步推理的數學文字題","純記憶選擇題","圖片分類","字典查詢"], a:0},
      {q:"情境：你要測模型能否『把一張圖片正確分類成貓或狗』，最典型的 Benchmark 是？", o:["GLUE","ImageNet","GSM8K","C-Eval"], a:1},
      {q:"情境：想測模型『英文通識＋各專業學科（如法律、醫學）』的知識廣度，選？", o:["ImageNet","MMLU","VQA","GSM8K"], a:1},
      {q:"情境：你要挑一個『難度最高、接近數學競賽』的測試來挑戰模型，選？", o:["GSM8K","MATH","HellaSwag","GLUE"], a:1},
      {q:"情境：需要測『英文閱讀理解、情感分析、文本推論』等 NLP 經典任務，選？", o:["ImageNet","GLUE / SuperGLUE","GSM8K","VQA"], a:1},

  xai: {
    title: "可解釋性 AI（LIME/SHAP/反事實/PDP）",
    color: "#6a4bb0",
    questions: [
      /* ---- 概念/定義題 30 ---- */
      {q:"LIME 的核心概念是？", o:["用簡單模型近似局部區域","公平分配特徵貢獻","改輸入看結果變化","畫全局趨勢曲線"], a:0},

      {q:"LIME 的解釋範圍屬於？", o:["全局","局部","無範圍","僅整體平均"], a:1},

      {q:"LIME 的輸出形式是？", o:["特徵權重","Shapley 值","條件建議","曲線圖"], a:0},

      {q:"LIME 的主要優點是？", o:["快、直觀","理論嚴謹","可行動","看趨勢"], a:0},

/* ---- 應用邏輯 ---- */
const KEYS = ["A","B","C","D","E"];
const NUM_PER = 10;

const el = id => document.getElementById(id);
const screens = { home: el("home"), quiz: el("quiz"), result: el("result") };
function show(name){
  for(const k in screens) screens[k].classList.toggle("active", k===name);
  window.scrollTo({top:0, behavior:"smooth"});
}

let state = null; // {topic, questions[], idx, answers[], correct}

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* 抽題並同時打亂每題選項順序（維持正解對應） */
function buildQuiz(topicKey){
  const topic = QUIZ_DATA[topicKey];
  const picked = shuffle(topic.questions).slice(0, Math.min(NUM_PER, topic.questions.length));
  const questions = picked.map(q=>{
    const order = shuffle(q.o.map((_,i)=>i));
    return {
      q: q.q,
      opts: order.map(i=>q.o[i]),
      ans: order.indexOf(q.a)   // 正解在打亂後的新位置
    };
  });
  return { topicKey, topic, questions, idx:0, answers:new Array(questions.length).fill(null), correct:0 };
}

/* ---- 首頁：建立主題卡 ---- */
function renderTopics(){
  const grid = el("topicGrid");
  grid.innerHTML = "";
  Object.keys(QUIZ_DATA).forEach(key=>{
    const t = QUIZ_DATA[key];
    const b = document.createElement("button");
    b.className = "topic";
    b.style.setProperty("--tc", t.color);
    b.innerHTML = `<div class="tname">${t.title}</div><div class="tmeta">共 ${t.questions.length} 題 · 隨機測 ${NUM_PER} 題</div>`;
    b.addEventListener("click", ()=> startQuiz(key));
    grid.appendChild(b);
  });
}

function startQuiz(key){
  state = buildQuiz(key);
  el("quizChip").textContent = state.topic.title;
  el("quizChip").style.background = state.topic.color;
  el("progBar").style.background = state.topic.color;
  document.documentElement.style.setProperty("--accent", state.topic.color);
  show("quiz");
  renderQuestion();
}

function renderQuestion(){
  const q = state.questions[state.idx];
  const total = state.questions.length;
  el("qNum").textContent = `第 ${state.idx+1} 題`;
  el("qText").textContent = q.q;
  el("quizCount").textContent = `${state.idx+1} / ${total}`;
  el("progBar").style.width = ((state.idx)/total*100) + "%";

  const wrap = el("optWrap");
  wrap.innerHTML = "";
  q.opts.forEach((text,i)=>{
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.innerHTML = `<span class="k">${KEYS[i]}</span><span class="otext">${text}</span>`;
    btn.addEventListener("click", ()=> choose(i));
    wrap.appendChild(btn);
  });

  const fb = el("feedback");
  fb.className = "fb"; fb.textContent = "";
  el("nextBtn").disabled = true;
  el("nextBtn").textContent = (state.idx === total-1) ? "看結果" : "下一題";
}

function choose(i){
  const q = state.questions[state.idx];
  if(state.answers[state.idx] !== null) return; // 已作答鎖定
  state.answers[state.idx] = i;
  const correct = q.ans;
  const optBtns = el("optWrap").querySelectorAll(".opt");
  optBtns.forEach((b,bi)=>{
    b.disabled = true;
    if(bi === correct) b.classList.add("correct");
    else if(bi === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb = el("feedback");
  if(i === correct){ state.correct++; fb.className="fb show ok"; fb.textContent="✓ 答對了！"; }
  else { fb.className="fb show no"; fb.textContent = `✗ 正解是 ${KEYS[correct]}．${q.opts[correct]}`; }
  el("nextBtn").disabled = false;
  el("progBar").style.width = ((state.idx+1)/state.questions.length*100) + "%";
}

el("nextBtn").addEventListener("click", ()=>{
  if(state.idx < state.questions.length-1){ state.idx++; renderQuestion(); }
  else finish();
});

el("quitBtn").addEventListener("click", ()=>{
  if(confirm("確定要結束這次測驗嗎？")) show("home");
});

function finish(){
  const total = state.questions.length;
  const score = state.correct;
  el("rTopic").textContent = state.topic.title;
  el("rScore").textContent = score;
  el("result").querySelector(".score small").textContent = ` / ${total}`;
  const pct = score/total;
  let msg;
  if(pct===1) msg = "滿分！這個主題你完全掌握了 🎉";
  else if(pct>=0.8) msg = "很不錯！再複習幾個細節就完美了。";
  else if(pct>=0.6) msg = "及格水準，建議回頭看錯題加強。";
  else msg = "還需要多讀幾遍筆記，別灰心，再測一次！";
  el("rMsg").textContent = `答對率 ${Math.round(pct*100)}%．${msg}`;

  const rev = el("review");
  rev.innerHTML = "";
  state.questions.forEach((q,i)=>{
    const your = state.answers[i];
    const isOk = your === q.ans;
    const box = document.createElement("div");
    box.className = "rev";
    let html = `<div class="rq">${i+1}. ${q.q}</div>`;
    html += `<div class="rline"><span class="tagok">正解</span><span>${KEYS[q.ans]}．${q.opts[q.ans]}</span></div>`;
    if(!isOk){
      const yourTxt = your===null ? "（未作答）" : `${KEYS[your]}．${q.opts[your]}`;
      html += `<div class="rline"><span class="tagno">你的</span><span class="yours miss">${yourTxt}</span></div>`;
    } else {
      html += `<div class="rline"><span class="tagok">你的</span><span>答對 ✓</span></div>`;
    }
    box.innerHTML = html;
    rev.appendChild(box);
  });
  show("result");
}

el("retryBtn").addEventListener("click", ()=> startQuiz(state.topicKey));
el("homeBtn").addEventListener("click", ()=> show("home"));

renderTopics();

</script>
