": "生成式 AI 模型，學習資料分布並生成全新旋律", "ans": "D"}, {"q": "下列何者最能描述「大型語言模型（Large Language Model, LLM）」的基礎技術特性？", "A": "以大量文本訓練，透過預測下一個符號來生成語言", "B": "無需任何訓練資料，僅憑內建常識即可直接運作", "C": "以固定規則庫逐條匹配回覆，不涉及機率式生成", "D": "本質上僅能處理影像資料，無法理解與生成文字", "ans": "A"}, {"q": "ChatGPT、Gemini、Claude 等對話型生成式 AI 工具，其背後所採用的基礎模型技術主要為下列何者？", "A": "圖卷積網路（GCN），擅長處理圖結構關係資料", "B": "決策樹（Decision Tree），依條件分支逐層判斷", "C": "支援向量機（SVM），以最大間隔超平面做分類", "D": "大型語言模型（LLM），以海量文本訓練生成語言", "ans": "D"}, {"q": "下列何者最能描述「生成式 AI 產生內容時可能出現幻覺（Hallucination）」的現象？", "A": "模型在任何情況下都完全無法產生任何文字內容", "B": "此現象只會發生在影像生成模型而不會出現於文字", "C": "輸出看似流暢合理，但內容可能與事實不符或憑空捏造", "D": "模型的輸出永遠只會逐字複製訓練資料中的原文", "ans": "C"}, {"q": "某企業導入生成式 AI 產出會議摘要，並另外建置一套 AI 系統來評估這些摘要的正確性與完整性。此評估系統的核心目標最接近下列何者？", "A": "自動為摘要新增更多的專業名詞與技術性指標", "B": "自動更換摘要文件的字型樣式與排版視覺呈現", "C": "調整原始會議錄音在語音轉文字時的音量大小", "D": "判斷摘要是否遺漏關鍵資訊或出現語意上的錯誤", "ans": "D"}, {"q": "在可解釋 AI（XAI）的分類架構中，LIME（Local Interpretable Model-agnostic Explanations）屬於下列哪一類技術？", "A": "資料前處理技術，於訓練前清理與轉換原始資料", "B": "後處理（Post-hoc）模型解釋，於訓練後解釋預測", "C": "模型壓縮技術，於部署前縮減模型的參數與體積", "D": "內建可解釋（Intrinsic）模型，結構本身即透明", "ans": "B"}, {"q": "下列何者最符合 SHAP（SHapley Additive exPlanations）值所能提供的資訊？", "A": "有效降低模型在推論階段的整體計算複雜度", "B": "呈現各特徵對模型損失函數收斂速度的影響", "C": "在單一預測中，量化各輸入特徵對輸出的貢獻分配", "D": "自動篩除重要性偏低的變數以精簡特徵集合", "ans": "C"}, {"q": "某法律科技公司希望在其合約風險審查系統中，讓律師能理解模型「為何」將某條款判定為高風險，以便覆核與說明。此需求最直接對應下列何種技術目標？", "A": "壓縮模型的參數量以縮小模型的整體體積", "B": "提升模型在大量條款上的推論與回應速度", "C": "提升模型的可解釋性，使判斷依據可被理解", "D": "將模型的輸出結果加密以保護資料的機密性", "ans": "C"}, {"q": "反事實解釋（Counterfactual Explanation）最能回答下列哪一類問題？", "A": "此模型在整體測試集上的準確率究竟是多少", "B": "若某些輸入特徵改為何值，模型決策結果將會改變", "C": "此模型所使用的訓練資料集總共有多少筆資料", "D": "此模型完成一次完整訓練總共花費了多少時間", "ans": "B"}, {"q": "在深度學習模型的分析中，「顯著性圖（Saliency Map）」的主要用途最接近下列何者？", "A": "標示輸入（如影像）中哪些區域對模型判斷影響較大", "B": "將模型的輸出結果進行加密以防止被外部竊取", "C": "壓縮模型的檔案大小以利在邊緣裝置上部署", "D": "增加訓練資料的總筆數以擴充可用樣本規模", "ans": "A"}, {"q": "某醫療 AI 系統要求能標示出「X 光影像中哪些區域」影響了模型對肺炎的判斷，以協助醫師覆核。此需求最直接對應下列何種 XAI 能力？", "A": "顯著性或熱區可視化，標示影響判斷的影像區域", "B": "批次推論最佳化，提升大量影像的處理吞吐量", "C": "模型量化壓縮，降低模型部署所需的運算資源", "D": "資料去識別化，移除影像中可辨識個人的資訊", "ans": "A"}, {"q": "下列關於「內建可解釋模型（Intrinsic Interpretability）」的敘述，何者最為正確？", "A": "此概念與模型的可解釋性之間並沒有任何關聯", "B": "此類方法僅能應用於影像相關的任務而非文字", "C": "指對已訓練完成的黑盒模型另外附加外部解釋", "D": "指模型結構本身即具透明性，可直接檢視決策依據", "ans": "D"}, {"q": "某製造業的品質預測模型採用部分依賴圖（Partial Dependence Plots, PDP）來分析特徵影響。PDP 最能呈現下列何種資訊？", "A": "單一特徵在其取值範圍變化時對平均預測結果的影響趨勢", "B": "整體資料集中各欄位所含缺失值（Missing Value）的比例", "C": "模型在訓練過程中損失函數隨迭代下降的變化曲線", "D": "資料集中每一筆樣本所對應的原始人工標註標籤值", "ans": "A"}, {"q": "下列何者最能描述 XAI（可解釋人工智慧）在企業導入 AI 時所帶來的主要價值？", "A": "保證模型在部署後永遠都不會產生任何錯誤預測", "B": "使決策過程更透明可理解，有助信任、除錯與治理", "C": "使模型在訓練與部署時都不再需要任何訓練資料", "D": "可完全取代資料前處理的所有清理與轉換工作", "ans": "B"}, {"q": "某信用評分公司以 SHAP 分析模型輸出，希望能向被拒貸的客戶清楚說明「拒絕貸款」的主要影響因素。此應用最能發揮 SHAP 的下列哪項特性？", "A": "量化各特徵對個別預測結果的貢獻方向與大小", "B": "有效加快模型在訓練階段的整體收斂與運算速度", "C": "將原本的黑盒模型直接替換為人工訂定的規則庫", "D": "自動擴增訓練資料的筆數以改善模型的泛化能力", "ans": "A"}, {"q": "下列關於 LIME（Local Interpretable Model-agnostic Explanations）的敘述，何者最為正確？", "A": "只能應用於線性模型，無法解釋非線性的黑盒模型", "B": "在解釋的過程中會永久改變原模型的權重與結構", "C": "本質上是一種對模型輸出進行加密保護的安全技術", "D": "屬模型無關的後處理解釋，在局部近似原模型以解釋預測", "ans": "D"}, {"q": "在 XAI 中，「全域解釋（Global Explanation）」與「局部解釋（Local Explanation）」的主要差異為何？", "A": "兩者本質上完全相同，只是使用的名稱不一樣而已", "B": "全域解釋只能應用於影像，局部解釋只能用於文字", "C": "局部解釋只能用於迴歸，全域解釋只能用於分類", "D": "全域解釋著重模型整體行為，局部解釋著重單一樣本依據", "ans": "D"}, {"q": "依《人工智慧基本法》的精神，某地方政府的 AI 補助審核系統雖然整體準確率很高，但被外界指出不同族群之間的核准率差異顯著。下列何者為最適當的優先作法？", "A": "僅持續提升模型的整體準確率，暫不處理差異問題", "B": "要求廠商提出一份無歧視聲明並在後續持續觀察即可", "C": "進行偏誤影響評估，並建立可解釋與申訴的相關機制", "D": "由於目前尚未收到大量民眾申訴，暫時不作任何調整", "ans": "C"}, {"q": "依《金融機構運用人工智慧技術作業規範》，金融機構以 AI 直接與消費者互動時，下列何者並非其必要揭露之事項？", "A": "該項服務所適用的對象範圍與主要的用途說明", "B": "該項服務是否由 AI 自動完成或有人工參與其中", "C": "該服務所採用 AI 模型的原始程式碼與完整訓練資料", "D": "是否提供替代方案或由專人進行人工複核的管道", "ans": "C"}, {"q": "某 AI 輔助診斷系統出現三類問題：①醫師無法理解模型對高風險案例判斷的依據；②系統對特定族裔的誤診率顯著偏高；③病患個資未經告知即被納入模型的再訓練。依 AI 倫理的核心原則，三者分別最違反下列何者？", "A": "①安全性　②問責性　③透明性，依序對應三項問題", "B": "①隱私性　②安全性　③公平性，依序對應三項問題", "C": "①公平性　②透明性　③問責性，依序對應三項問題", "D": "①透明性　②公平性　③隱私性，依序對應三項問題", "ans": "D"}, {"q": "某保險公司欲以「性別」作為預測愛滋病毒感染風險的輸入特徵，但資料治理委員會表示反對。下列何者最能說明此做法不適當的主要理由？", "A": "性別欄位可能存在缺失值，會影響模型訓練的穩定性", "B": "以性別作為風險代理特徵會強化對特定族群的歧視，違反公平性", "C": "性別與感染風險的統計相關性有限，可能反而降低效能", "D": "性別屬類別型變數，需額外編碼而增加前處理的複雜度", "ans": "B"}, {"q": "某交通局欲將公車刷卡資料（含卡號、上下車時間、路線）提供給學術單位研究，且需保留「跨時間追蹤同一名乘客」的能力。下列何種做法最符合去識別化的要求？", "A": "對卡號做 MD5 雜湊處理，並另外保留對照表供日後查詢", "B": "將卡號一致地替換為隨機編號，且不保留任何對應關係", "C": "將資料彙總為每日各路線的總乘客數後再提供研究使用", "D": "直接刪除卡號欄位，僅保留每筆的搭乘時間與路線資訊", "ans": "B"}, {"q": "某媒體集團自行訓練生成式 AI 產出新聞內容，希望能從「訓練階段」就降低產出有害或偏頗內容的機率，並兼顧多元與公平。下列何項措施最應優先落實？", "A": "僅在輸出端限制固定的格式，不調整任何訓練資料", "B": "在訓練時完全避免使用任何來自外部來源的文本資料", "C": "確保訓練資料來源多元，並經過內容清洗與偏見過濾", "D": "僅使用公司內部既有的新聞稿作為唯一的訓練資料", "ans": "C"}, {"q": "下列何者最能描述 AI 倫理中「透明性（Transparency）」原則的核心精神？", "A": "確保系統所處理的個人資料在任何情況下都不被外洩", "B": "使模型的訓練與推論過程都能達到最快的運算速度", "C": "保證模型部署上線後在所有情境中都永遠不會出錯", "D": "使系統的運作方式與決策依據能被適當地理解與檢視", "ans": "D"}, {"q": "下列何者最能描述 AI 倫理中「問責性（Accountability）」原則的核心精神？", "A": "僅一味要求提升模型在各項任務上的整體準確率", "B": "明確界定系統各環節的責任歸屬，並可回溯與追究", "C": "全面禁止任何組織或個人使用 AI 系統於決策流程", "D": "設計上讓系統的任何決策都無需由特定人員負責", "ans": "B"}, {"q": "某 AI 新創聲稱其產品已通過我國「AI 產品與系統評測中心」之生成式 AI 評測。下列何者並非該中心的評測項目？", "A": "公平性（Fair），評估系統是否對不同群體造成偏差", "B": "效率性（Efficiency），評估系統的運算速度與資源用量", "C": "可靠性（Reliability），評估系統輸出的穩定與可信程度", "D": "資安（Secure），評估系統抵禦攻擊與保護資料的能力", "ans": "B"}, {"q": "某銀行以 AI 進行貸款審核時，若模型對特定性別或種族產生系統性的不利結果，最直接違反下列哪一項 AI 倫理原則？", "A": "公平性（Fairness），要求不對特定群體造成不當歧視", "B": "效率性（Efficiency），要求系統以最少資源完成運算", "C": "即時性（Real-time），要求系統能於毫秒等級回應請求", "D": "可壓縮性（Compressibility），要求模型體積可被縮小", "ans": "A"}, {"q": "下列關於「資料去識別化（De-identification）」的敘述，何者最為正確？", "A": "此技術與個人資料保護之間並沒有任何實質關聯", "B": "資料經去識別化之後就一定無法再用於任何分析", "C": "只要刪除姓名欄位就能完全消除再識別化的風險", "D": "透過移除或轉換可識別資訊，降低關聯到個人的風險", "ans": "D"}, {"q": "某跨國企業需將敏感資料透過網路傳輸至海外總部訓練模型，並要求防範傳輸過程中的中間人攻擊。在不明顯影響即時傳輸效率的前提下，下列何者最能有效降低風險？", "A": "改用離線實體媒介備援的方式交換資料，避免走網路", "B": "在傳輸過程中加密並驗證雙方身分以確保通訊的安全", "C": "僅在接收端加強權限控管與身分驗證，發送端不處理", "D": "將資料拆分為多份後分批傳送，以分散被竊取的風險", "ans": "B"}, {"q": "下列何者最能描述「AI 偏誤（Bias）」在實務上最常見的來源？", "A": "訓練資料本身即存在的代表性不足或既有的歷史偏見", "B": "運算硬體因長時間運行導致的溫度過高與效能下降", "C": "模型儲存時所使用的檔案格式錯誤或版本不相容", "D": "部署環境的網路頻寬不足導致推論回應速度變慢", "ans": "A"}, {"q": "依 AI 倫理原則，當系統對消費者作出重大不利決策時，提供「人工複核或申訴管道」最直接體現下列何種原則？", "A": "即時性，要求系統於極短時間內完成回應與處理", "B": "效率性，要求系統以最少的資源完成決策的運算", "C": "問責性與可救濟性，使不利決策可被覆核與救濟", "D": "壓縮性，要求模型體積可被縮小以利部署與傳輸", "ans": "C"}, {"q": "下列何者最能描述 AI 倫理中「隱私性（Privacy）」原則的核心精神？", "A": "保證模型在所有任務上都能達到最高的整體準確率", "B": "確保個資的蒐集、處理與利用受到適當的保護與限制", "C": "全面禁止任何形式的資料分析以徹底杜絕外洩風險", "D": "使模型在推論階段能達到最快速度並回應大量請求", "ans": "B"}, {"q": "某企業以含敏感個資之資料訓練 AI，內部政策要求原始資料不得外洩、且應集中於安全環境中處理。下列何種作法在兼顧資料保護的前提下最為合理？", "A": "將資料任意複製至員工個人裝置以方便隨時取用分析", "B": "不採取任何額外保護措施，直接將資料對外傳輸使用", "C": "在受控的安全環境中處理，並輔以去識別化與存取控管", "D": "將原始資料公開上傳至網路，供內外部各方自由取用", "ans": "C"}, {"q": "下列關於「AI 治理（AI Governance）」的敘述，何者最為正確？", "A": "涵蓋 AI 全生命週期的政策、風險管理、責任與合規安排", "B": "是一項與資料隱私、公平性等倫理議題毫無關聯的工作", "C": "僅是指在部署前對模型進行壓縮以縮小體積的技術", "D": "單純是指運用各種技術手段提升模型準確率的作法", "ans": "A"}, {"q": "某招聘系統以 AI 生成面試問題並協助評估，過程中發現模型可能對應徵者的性別或年齡產生偏差。下列何種策略最能有效降低此偏差風險？", "A": "由於相關申訴數量不多，暫時忽略此偏差不予處理", "B": "刻意加大模型的偏差程度，以便凸顯群體間的差異", "C": "僅單純提高模型的參數量以期改善其整體的表現", "D": "改善訓練資料代表性，並導入偏誤檢測與緩解機制", "ans": "D"}, {"q": "下列何者屬於典型的「偏見緩解（Bias Mitigation）」措施，而非「偏見檢測（Bias Detection）」措施？", "A": "計算不同群體之間在核准率或錄取率上的差距大小", "B": "僅逐一列出資料集中各個群體所對應的樣本數量", "C": "對訓練資料重新採樣或調整權重以平衡群體代表性", "D": "以統計檢定評估各群體的結果之間是否有顯著差異", "ans": "C"}, {"q": "某醫療機構將病患的個人資料未經告知即納入模型的再訓練流程，此作法最直接違反下列何種原則？", "A": "可壓縮性，要求模型的體積能被有效地縮減", "B": "效率性，要求系統以最少資源完成運算工作", "C": "即時性，要求系統能在極短時間內回應請求", "D": "隱私性與知情同意，個資使用須經當事人同意", "ans": "D"}, {"q": "下列關於 AI 系統「可靠性（Reliability）」的敘述，何者最為正確？", "A": "指系統在各種預期情境下都能穩定產生正確可信賴的結果", "B": "指系統一經部署上線之後便完全不需要任何後續維護", "C": "此概念與模型的預測錯誤率之間並沒有任何的關聯", "D": "指系統能在相同輸入下盡可能生成最多樣化的內容", "ans": "A"}, {"q": "某企業導入 AI 時建立「模型卡（Model Card）」或詳盡的使用說明文件，主要有助於落實下列哪一組原則？", "A": "加快資料在不同節點之間的網路傳輸速度與效率", "B": "降低模型訓練與推論階段所需投入的硬體成本", "C": "提高模型所輸出影像或圖表的整體解析度品質", "D": "透明性與問責性，使決策依據與責任可被理解追溯", "ans": "D"}, {"q": "某環保局需整合全市 5 萬個感測器每秒產生的大量即時資料並持續不間斷處理。就大數據特性而言，此專案最主要面臨下列哪一組挑戰？", "A": "Volume 與 Value，資料量龐大且須萃取商業價值", "B": "Velocity 與 Value，資料流速快且須萃取商業價值", "C": "Volume 與 Velocity，資料量龐大且產生速度極快", "D": "Variety 與 Veracity，資料型態多元且真實性存疑", "ans": "C"}, {"q": "大數據 5V 特性中，「Variety（多樣性）」最能描述下列何種挑戰？", "A": "資料的真實性與可信度難以被有效地確認與驗證", "B": "資料來源與型態多元，含結構化、半結構化與非結構化", "C": "資料以極快的速度持續產生，須即時接收與處理", "D": "資料的總量非常龐大，對儲存與運算造成沉重負擔", "ans": "B"}, {"q": "大數據 5V 特性中，「Veracity（真實性）」最能描述下列何種挑戰？", "A": "資料的真實性與品質問題，如雜訊、不一致與缺失", "B": "資料所蘊含、可轉化為決策依據的潛在商業價值", "C": "資料須被即時接收與處理，以支援即時的應用場景", "D": "資料來源與型態的多樣性，涵蓋多種不同的格式", "ans": "A"}, {"q": "下列哪一項「AI 技術應用與產業領域」的對應最為恰當？", "A": "利用 AI 分析社群互動以提升臨床診斷準確度，屬金融服務業", "B": "以 AI 融合氣象與消費行為推薦會員方案升級，屬智慧醫療", "C": "以 AI 進行設備故障預測與預防性維護，屬於智慧製造領域", "D": "利用 AI 分析商場購買紀錄以預測股市波動，屬智慧交通", "ans": "C"}, {"q": "某智慧城市專案需持續蒐集環境數據（如 PM2.5、氣體濃度）與設備狀態（如垃圾桶滿溢程度）。下列何種技術最直接支援此類即時感測需求？", "A": "啟發式決策引擎，依經驗法則對輸入進行快速判斷", "B": "決策支援系統，整合資料以輔助管理者制定決策", "C": "感知器網路（Sensor Network），部署感測節點蒐集資料", "D": "專家系統，以人工建立的規則庫進行推論與判斷", "ans": "C"}, {"q": "某電子製造公司於產線導入 AI 自動判斷電路板焊接瑕疵，以取代原本的人工目視檢查。下列何者最不符合此應用所展現的核心技術能力？", "A": "電腦視覺（Computer Vision），從影像辨識瑕疵位置", "B": "自然語言處理（NLP），理解與生成人類文字語言", "C": "診斷性分析（Diagnostic Analytics），找出瑕疵的成因", "D": "異常偵測（Anomaly Detection），辨識偏離正常的樣態", "ans": "B"}, {"q": "某金融科技公司的交易系統需在毫秒等級掃描跨市場的價格差異並自動下單套利。下列何者最能說明其核心的 AI 能力？", "A": "以生成對抗網路（GAN）模擬罕見的黑天鵝市場事件", "B": "快速分析龐大市場數據，於極短時間內識別機會並自動決策", "C": "以自然語言處理分析大量財經新聞的語意與情緒傾向", "D": "以推薦系統依風險偏好為投資人推薦合適的投資組合", "ans": "B"}, {"q": "下列哪一項最符合「異常偵測（Anomaly Detection）」的主要應用目標？", "A": "建立管理儀表板以持續追蹤各項營運的關鍵績效指標", "B": "依歷史資料預測未來哪些客戶最可能發生違約的情形", "C": "從設備感測資料即時偵測顯著偏離正常模式的訊號以預警", "D": "將客群依消費偏好分成不同群體以制定差異化行銷", "ans": "C"}, {"q": "某智慧交通系統需即時辨識路口監視畫面中的汽車、機車與公車，並統計各方向的車流量。此任務最核心依賴下列何種 AI 能力？", "A": "強化學習，透過與環境互動的回饋學習下棋等策略", "B": "自然語言處理，理解與生成人類的文字或語音語言", "C": "電腦視覺與物件偵測，辨識畫面中車輛的類別與位置", "D": "語音合成，將輸入的文字轉換為自然流暢的語音輸出", "ans": "C"}, {"q": "下列何者最能描述 AI 在「智慧醫療」領域中的典型應用？", "A": "依歷史交易資料預測未來股票市場的漲跌走勢", "B": "依既有樂曲自動生成適合電玩場景的背景音樂", "C": "規劃倉儲中揀貨人員的最短行走動線與路徑", "D": "以影像辨識輔助醫師判讀 X 光片或病理切片影像", "ans": "D"}, {"q": "下列關於「電腦視覺（Computer Vision）」的敘述，何者最為正確？", "A": "使電腦能從影像或影片中辨識並理解其視覺內容", "B": "本質上僅能處理聲音等語音訊號而無法處理影像", "C": "是一項與影像辨識、物件偵測完全無關的技術領域", "D": "主要專注於處理文字的語意理解與自然語言生成", "ans": "A"}, {"q": "下列關於「自然語言處理（NLP）」的敘述，何者最為正確？", "A": "是一項與文字分類、機器翻譯等任務毫無關聯的技術", "B": "使電腦能夠理解、分析與生成人類所使用的自然語言", "C": "本質上僅能處理影像資料而無法處理文字或語音", "D": "主要專注於數值運算，與語言的語意理解無直接關係", "ans": "B"}, {"q": "某企業導入 AI 進行「客服對話情緒判斷」，分析顧客留言屬於正面、負面或中立。此應用最主要屬於下列哪一類 AI 技術？", "A": "語音合成，將文字轉換為自然流暢的語音輸出", "B": "電腦視覺，從影像或影片中辨識並理解視覺內容", "C": "自然語言處理中的情感分析，判斷文字的情緒傾向", "D": "強化學習，透過與環境互動的回饋逐步學習策略", "ans": "C"}, {"q": "某地方政府欲對選舉期間的社群貼文進行大規模輿情分析，且明確要求不涉及對特定個人的身份辨識。下列哪一組技術最符合其需求？", "A": "文本分類結合人臉辨識，以辨識出每篇貼文的發文者", "B": "語音辨識結合影像辨識，以辨識參與討論者的個人身分", "C": "情感分析結合關鍵詞提取，掌握輿論傾向與熱門議題", "D": "推薦系統結合社群圖譜，預測每位使用者的投票對象", "ans": "C"}, {"q": "下列何種情境最適合以「自編碼器（Autoencoder）」作為主要的模型架構？", "A": "依設備感測器數值學習正常型態並判斷是否出現異常", "B": "依產品外觀影像直接進行多類別的瑕疵種類分類任務", "C": "將一種語言的句子翻譯為另一種語言的機器翻譯任務", "D": "依客服對話的文字內容判斷顧客當下的情緒是否負面", "ans": "A"}, {"q": "下列何者最能描述「診斷性分析（Diagnostic Analytics）」的主要目的？", "A": "描述過去一段期間內究竟發生了哪些事情與現象", "B": "依據分析結果進一步建議應該採取哪些具體行動", "C": "解釋某個現象為何會發生，找出其背後的成因", "D": "依歷史資料推估未來一段期間內可能發生的結果", "ans": "C"}, {"q": "下列何者最能描述「預測性分析（Predictive Analytics）」的主要目的？", "A": "對資料進行加密處理以確保其在儲存時的安全性", "B": "解釋過去所發生現象背後的原因與影響的因素", "C": "描述目前資料所呈現的整體狀態與分布的情形", "D": "運用歷史資料推估未來一段期間可能發生的結果", "ans": "D"}, {"q": "某製造業導入 AI 進行「預防性維護（Predictive Maintenance）」，其核心價值最接近下列何者？", "A": "在設備故障之前提早預測並安排維護，降低停機損失", "B": "對設備所產生的各類感測資料進行加密以保護機密", "C": "依產品特性自動生成具吸引力的行銷文案與素材", "D": "在設備故障發生後統計其歷次故障的次數與頻率", "ans": "A"}, {"q": "下列何者最能描述「推薦系統（Recommendation System）」的核心目標？", "A": "依既定範本自動生成契約、報告等各類正式文件", "B": "對使用者所設定的登入密碼進行加密與安全保護", "C": "從設備的感測資料中即時偵測出異常的運作訊號", "D": "依使用者行為與偏好推薦其可能感興趣的內容或商品", "ans": "D"}, {"q": "某電商欲依顧客的購買機率排序推薦商品，同時運用大量稀疏的類別特徵與數值特徵，並希望模型能兼顧「記憶已知組合」與「泛化未知組合」。下列何種模型最為適合？", "A": "寬深模型（Wide and Deep），兼顧記憶與泛化能力", "B": "決策樹（Decision Tree），依特徵條件逐層分割樣本", "C": "支援向量機（SVM），以最大間隔超平面進行分類", "D": "線性迴歸模型，以線性組合預測連續的數值輸出", "ans": "A"}, {"q": "下列關於「AI 於智慧製造之應用」的敘述，何者最不恰當？", "A": "以強化學習依生產狀態的回饋動態優化生產排程", "B": "以 AI 直接判斷產品外觀影像即可得知其股價走勢", "C": "以感測資料進行設備的異常偵測與預測性維護", "D": "以電腦視覺對產品外觀進行瑕疵檢測與品質把關", "ans": "B"}, {"q": "在 AI 推論服務中，關於「批次推論（Batch Inference）」與「即時推論（Real-time Inference）」的敘述，何者最為正確？", "A": "批次推論以同步請求回傳以確保一致，即時推論多採非同步提升吞吐", "B": "批次推論僅能適用於影像類模型，即時推論僅能適用於結構化資料", "C": "批次推論多用於延遲容忍度高的大規模處理以吞吐量優先，即時推論重低延遲", "D": "即時推論僅能處理單筆輸入，批次推論則可同步將多筆結果即時回傳", "ans": "C"}, {"q": "在 LLM 推論服務中，透過請求批次處理（Batching）來提升效能，下列敘述何者最為正確？", "A": "Batching 即使在極低併發的情況下仍能明顯地提升效能", "B": "Batching 可提升加速器使用率並增加吞吐量，但可能影響單筆延遲", "C": "Batching 的效益主要來自降低記憶體用量，對吞吐量的影響有限", "D": "Batching 的主要用途是加快單一筆請求的回應處理時間", "ans": "B"}, {"q": "某企業提供 LLM API 服務，需支援高併發與流量波動、確保服務不中斷並具備故障容忍能力。以高可用與可擴展為原則，下列部署方式較為適當？", "A": "採用單一台高效能虛擬機，將所有推論請求集中於其上處理", "B": "建立多個模型服務實例，並透過負載分散機制對外提供服務", "C": "將推論運算改由各使用者的用戶端裝置自行分擔以節省成本", "D": "使用 FTP 檔案傳輸協議來傳送每一筆推論請求與回應結果", "ans": "B"}, {"q": "在 LLM 的效能優化技術中，Flash Attention 主要用來改善下列何者？", "A": "對模型的參數與輸出結果進行加密以保護模型安全", "B": "改善 Transformer 注意力機制的計算與記憶體使用效率", "C": "將原本的深度模型轉換為可解釋的決策樹結構", "D": "增加訓練資料的總筆數以改善模型的泛化能力", "ans": "B"}, {"q": "某企業希望以人類反饋強化學習（RLHF）優化 LLM 的偏好一致性與規範遵循。下列何者最不屬於 RLHF 階段的典型技術活動？", "A": "以人工評估建立偏好資料，用以反映不同輸出的品質差異", "B": "訓練一個能依人類偏好判斷輸出品質高低的獎勵模型", "C": "以未標註語料為主進行長週期的表示學習預訓練", "D": "依評估結果調整生成策略，使輸出更符合人類偏好", "ans": "C"}, {"q": "下列何者最能描述「模型量化（Quantization）」的主要目的？", "A": "透過各種方式擴增訓練資料的筆數以改善泛化", "B": "對模型的輸出結果進行加密以保護其機密性", "C": "增加模型的網路層數以提升其整體表達能力", "D": "以較低數值精度表示參數，降低記憶體與運算需求", "ans": "D"}, {"q": "下列何者最能描述「知識蒸餾（Knowledge Distillation）」的主要概念？", "A": "讓小型的學生模型學習大型教師模型的行為以降低推論成本", "B": "先將訓練資料加密之後再進行後續的模型蒸餾程序", "C": "單純是指增加模型的參數量以提升其表達能力", "D": "在訓練完成後刪除所有曾用於訓練的原始資料", "ans": "A"}, {"q": "某語音互動 AI 助理的流程包含語音轉文字、語言模型生成回覆、文字轉語音三個階段。此為典型的多階段 AI 應用管線（Pipeline），下列敘述何者最為正確？", "A": "此種多階段流程本質上完全無法應用於即時互動的場景", "B": "僅需其中的語言模型單一階段即可獨力完成全部的流程", "C": "各階段須串接運作，任一階段的延遲都會影響整體回應時間", "D": "語音轉文字階段的處理時間與系統整體的回應延遲無關", "ans": "C"}, {"q": "下列關於系統效能指標「延遲（Latency）」與「吞吐量（Throughput）」的敘述，何者最為正確？", "A": "系統的延遲數值越高，就代表該系統的效能表現越好", "B": "延遲指單筆請求的回應時間，吞吐量指單位時間可處理的請求量", "C": "延遲與吞吐量這兩項指標的定義與衡量方式完全相同", "D": "吞吐量這項指標僅適用於影像類模型而不適用其他", "ans": "B"}, {"q": "某推論服務需在毫秒等級回應單筆使用者請求（例如即時線上客服），設計時最應優先考量下列何者？", "A": "將所有的推論請求一律延後至夜間再以批次方式處理", "B": "僅專注於縮短模型的訓練時間而不理會推論的延遲", "C": "降低單筆請求的推論延遲，並確保回應時間的穩定", "D": "盡量最大化每次的批次大小以追求最高的整體吞吐", "ans": "C"}, {"q": "下列何者最能描述「模型部署（Model Deployment）」在 AI 專案中的意義？", "A": "將訓練完成的模型上線提供實際服務或整合進系統", "B": "在專案初期撰寫需求規格與功能設計等相關文件", "C": "對原始資料進行清理、轉換與缺失值的補值處理", "D": "從各種來源蒐集並彙整模型訓練所需的原始資料", "ans": "A"}, {"q": "某推薦模型上線數月後，點擊率與準確度逐漸下降，分析後發現近期使用者的行為模式與資料分布已明顯改變。此現象最接近下列何者？", "A": "過度標註，訓練資料被賦予了過多且重複的標籤", "B": "One-hot 編碼錯誤，使類別特徵的向量表示產生偏差", "C": "資料或概念漂移，資料分布隨時間改變使模型退化", "D": "梯度爆炸，訓練時梯度值過大導致參數更新發散", "ans": "C"}, {"q": "針對模型上線後可能發生的資料漂移（Data Drift），下列何種做法最為合適？", "A": "刪除所有的歷史資料，僅保留最近一週的少量資料", "B": "將模型永久凍結、不再進行任何更新以維持一致性", "C": "在模型上線之後便不再對其表現進行任何的監控", "D": "建立持續監控機制，並於效能下降時以新資料重訓更新", "ans": "D"}, {"q": "下列何者最能描述「邊緣運算（Edge Computing）」在 AI 部署上的特性？", "A": "將推論運算移至靠近資料來源的裝置端，降低延遲與頻寬", "B": "本質上完全無法應用於任何需要即時回應的應用場景", "C": "必須將所有的運算工作全部集中於單一的雲端節點上", "D": "所提供的運算資源在任何情況下都一定比雲端更充足", "ans": "A"}, {"q": "某即時應用將 AI 模型部署至運算資源有限的邊緣裝置，測試時卻出現回應延遲。下列何者最能合理解釋此現象？", "A": "雲端部署在任何情況下都一定會比邊緣部署延遲更高", "B": "邊緣運算在任何情況下都必然會比雲端運算更為快速", "C": "模型部署的效能表現與其所在硬體的資源完全無關", "D": "邊緣裝置通常受限於本身的運算能力與可用資源上限", "ans": "D"}, {"q": "下列何者最能描述「模型監控（Model Monitoring）」在 MLOps 中所扮演的角色？", "A": "在專案中專門負責對原始訓練資料進行人工標註", "B": "持續追蹤模型上線後的效能、資料分布與異常以發現退化", "C": "專責撰寫系統中各項功能所需的應用程式碼與邏輯", "D": "對模型的參數與輸出結果進行加密以保護其安全", "ans": "B"}, {"q": "下列關於「MLOps」的敘述，何者最為正確？", "A": "此套方法與實務本質上僅能適用於影像類的模型", "B": "指整合機器學習開發、部署與維運的流程，以持續交付價值", "C": "僅是指機器學習模型所使用的訓練演算法本身而已", "D": "此概念與模型的部署及後續監控之間沒有任何關聯", "ans": "B"}, {"q": "某搜尋系統需在已排序的價格清單 [3, 8, 14, 19, 21, 27, 33, 45, 52] 中，以標準二分搜尋（Binary Search）尋找目標值 27（每次取中位數比較後排除一半）。最多需比較幾次即可找到？", "A": "2 次，於前兩次比較即可命中目標值", "B": "3 次，依序比較中位數後即可命中目標", "C": "5 次，須逐一比較約半數以上的元素", "D": "4 次，須比較至接近清單末端才可命中", "ans": "B"}, {"q": "下列關於「批次推論（Batch Inference）」適用情境的敘述，何者最為正確？", "A": "本質上完全無法用於處理大量的資料筆數", "B": "在任何情況下都一定會比即時推論的延遲更低", "C": "僅適合用於需要毫秒級即時回應的互動式任務", "D": "適合延遲容忍度高、需一次處理大量資料且以吞吐量優先者", "ans": "D"}, {"q": "某企業已部署預訓練 LLM 作為內部知識問答系統，但公司內規每月都會更新。若希望回答能即時反映最新內規、又不需頻繁地重新訓練模型，下列何種作法較為合適？", "A": "每當內規更新時，都從零開始重新訓練整個大型模型", "B": "在內規更新後即停止使用該問答系統，改回人工查詢", "C": "以檢索增強方式，結合最新內規文件的檢索來提供答案", "D": "僅單純增加模型的參數量以期能記住更多的內規內容", "ans": "C"}, {"q": "下列何者最能描述「結構化預測（Structured Prediction）」問題？", "A": "判斷一張輸入影像中的主體是否為一隻貓咪", "B": "輸出具有內部結構的複雜物件，如句中每個詞的標籤序列", "C": "預測單一的連續數值輸出，例如某物件的房價", "D": "將一群客戶依相似度自動分成數個不同的群體", "ans": "B"}, {"q": "在命名實體辨識（Named Entity Recognition, NER）任務中，模型需依整句文字判斷句中每個詞的標籤（如人名、地名、機構）。此任務最接近下列哪一類問題？", "A": "影像分群，依像素相似度將影像區塊自動歸群", "B": "純迴歸任務，輸出單一的連續數值預測結果", "C": "單純的二元分類，僅需輸出是或否兩種類別", "D": "結構化的序列標註，為序列中每個位置輸出標籤", "ans": "D"}, {"q": "下列哪一種應用情境最適合採用卷積神經網路（CNN）作為主要模型？", "A": "對大量客戶依消費特徵進行 K-means 分群分析", "B": "依純文字的客服紀錄進行關鍵字的出現次數統計", "C": "依產品的外觀影像對其表面瑕疵進行分類判斷", "D": "對結構化的表格數值資料進行線性迴歸的預測", "ans": "C"}, {"q": "某公車系統想預測到站時間，需同時考量歷史班次、即時路況、天氣等序列與情境因素，而傳統 RNN 難以捕捉其中的長距離依賴關係。下列何種模型較適合處理此類長序列依賴？", "A": "單純的線性迴歸模型，以線性關係預測到站時間", "B": "以注意力機制為基礎的模型，如 Transformer 或 LSTM", "C": "One-hot 編碼，將類別特徵轉為稀疏的指示向量", "D": "K-means 分群，依相似度將班次資料自動分群", "ans": "B"}, {"q": "下列何者最能描述「主成分分析（PCA）」的主要用途？", "A": "透過與環境互動的回饋來學習最佳的行動策略", "B": "依既有資料的分布特性生成全新的影像樣本", "C": "降維，將高維資料投影至保留最大變異的低維空間", "D": "依已標註資料學習輸入與輸出之間的分類關係", "ans": "C"}, {"q": "下列關於「決策樹（Decision Tree）」的敘述，何者最為正確？", "A": "本質上完全無法被應用於任何的分類預測任務", "B": "屬可解釋性較高、以條件分支決策的模型，對特徵尺度不敏感", "C": "僅能用於非監督式的資料分群而不能用於分類", "D": "運作前必須先對所有的數值特徵進行標準化縮放", "ans": "B"}, {"q": "下列哪一種模型對「特徵尺度（Feature Scale）」最不敏感，最適合在不進行標準化的情況下直接使用不同量綱的數值特徵？", "A": "線性迴歸，係數大小易受各特徵量綱差異的影響", "B": "K 近鄰（KNN），依距離計算故對特徵尺度相當敏感", "C": "支援向量機（SVM），間隔的計算會受特徵尺度影響", "D": "決策樹（Decision Tree），依門檻分割而不受尺度影響", "ans": "D"}, {"q": "下列關於「隨機森林（Random Forest）」的敘述，何者最為正確？", "A": "本質上是一種將資料依相似度歸群的分群演算法", "B": "本質上完全無法被應用於任何的分類預測任務", "C": "由多棵決策樹組成的集成模型，整合多樹結果提升表現", "D": "僅由單一棵決策樹所構成，並無集成的機制設計", "ans": "C"}, {"q": "下列關於「支援向量機（SVM）」的敘述，何者最為正確？", "A": "本質上僅能用於非監督式的資料分群任務", "B": "是一種尋找最大間隔決策邊界的監督式分類方法", "C": "是一種能依資料分布生成全新樣本的生成式模型", "D": "此方法與需要標籤的監督式學習之間沒有關聯", "ans": "B"}, {"q": "下列關於「K-means 分群」的敘述，何者最為正確？", "A": "屬非監督式學習，將資料分為 K 群且需事先指定 K 值", "B": "屬監督式分類方法，訓練時需要大量的人工標籤", "C": "此方法與將資料歸類的分群任務並沒有任何關聯", "D": "是一種能依既有資料生成全新影像的生成方法", "ans": "A"}, {"q": "某資安團隊評估以機器學習偵測網路流量中的異常連線，一位工程師建議採用支援向量機（SVM）。下列關於此技術選擇的敘述，何者最為正確？", "A": "SVM 屬監督式方法，有標註樣本時可分類，亦有 One-Class 版本可偵測異常", "B": "SVM 本質上完全無法被應用於任何形式的偵測任務", "C": "SVM 屬強化學習，須透過與環境互動的回饋來學習", "D": "SVM 的用途僅限於生成全新的攻擊流量以進行測試", "ans": "A"}, {"q": "下列何者最能描述「集成學習（Ensemble Learning）」的核心概念？", "A": "結合多個模型的預測以取得比單一模型更好的整體表現", "B": "在訓練之前先對所有的原始資料進行加密處理", "C": "在模型訓練完成後刪除所有曾使用的訓練資料", "D": "在解決任務時一律僅採用單一且最簡單的模型", "ans": "A"}, {"q": "下列關於「偏差（Bias）與變異（Variance）的權衡」的敘述，何者最為正確？", "A": "偏差與變異這兩者都與模型的複雜度高低完全無關", "B": "只要設法降低模型的偏差，就必然能同時降低變異", "C": "模型呈現高變異就一定代表其發生了欠擬合的問題", "D": "高偏差常對應欠擬合、高變異常對應過擬合，兩者須平衡", "ans": "D"}, {"q": "下列何者最能描述「正則化（Regularization）」在機器學習中的主要作用？", "A": "透過對模型的複雜度施加懲罰以抑制過擬合現象", "B": "將無順序關係的類別型特徵編碼轉換為數值向量", "C": "對模型的輸出結果進行加密以保護其機密性", "D": "透過各種手法增加訓練資料的筆數以擴充樣本", "ans": "A"}, {"q": "某超市有 120 萬筆銷售紀錄，但僅約 8 萬筆被標記為「正常」或「損耗」，其餘皆未標註。在標註資源有限的情況下希望盡量提升預測表現，下列何種學習方式最為適合？", "A": "先對全部資料進行分群，再由專家逐群事後確認標籤", "B": "僅使用已標註的 8 萬筆資料訓練，捨棄其餘未標註者", "C": "改用強化學習，依實際的損耗回饋持續調整模型策略", "D": "半監督式學習，同時利用少量標註與大量未標註資料", "ans": "D"}, {"q": "下列關於深度學習正則化技術「Dropout」的敘述，何者最為正確？", "A": "主要用於將低解析度的影像放大為高解析度影像", "B": "此技術與模型是否過擬合之間並沒有任何關聯", "C": "主要用於透過各種手法增加訓練資料的總筆數", "D": "訓練時隨機丟棄部分神經元以降低過擬合、提升泛化", "ans": "D"}, {"q": "下列何者最能描述「學習率（Learning Rate）」對模型訓練過程的影響？", "A": "學習率的數值設定得越大，就一定能使訓練效果越好", "B": "學習率是一個與模型實際訓練過程完全無關的參數", "C": "學習率的設定僅會影響訓練資料在磁碟的儲存格式", "D": "學習率過大可能導致訓練發散，過小則使收斂變得緩慢", "ans": "D"}, {"q": "下列何者最能描述「Epoch」在模型訓練中所代表的意義？", "A": "分類任務中模型最終需輸出的類別總數量", "B": "模型完整地遍歷過一次全部訓練資料的過程", "C": "整個神經網路模型中所包含的隱藏層總層數", "D": "資料集中每一筆樣本所具有的特徵欄位數量", "ans": "B"}, {"q": "下列關於「批次正規化（Batch Normalization）」的敘述，何者最為正確？", "A": "此技術僅被用於對訓練資料進行加密與保護", "B": "此技術與模型訓練過程的穩定性之間毫無關聯", "C": "透過對各層的輸入做正規化以穩定並加速訓練", "D": "此技術運作時會刪除部分的訓練資料以簡化計算", "ans": "C"}, {"q": "某製造業每天需處理來自 30 條產線的影像、感測器數值與生產參數等多種型態的資料。此情境最能體現大數據的哪一項特性？", "A": "資料完全不含任何雜訊，品質極高且無需清理", "B": "資料型態多元（Variety），涵蓋多種不同的格式", "C": "僅具備資料量龐大（Volume）此單一項特性而已", "D": "資料在任何情況下都一定是欄位明確的結構化資料", "ans": "B"}, {"q": "下列何者最能描述「特徵重要性（Feature Importance）」的主要用途？", "A": "評估各輸入特徵對模型預測結果的相對影響程度", "B": "對原始的特徵資料進行加密處理以保護其機密", "C": "刪除資料集中的所有特徵欄位以徹底簡化模型", "D": "將分析所得的資料結果視覺化呈現為地理地圖", "ans": "A"}, {"q": "下列關於「時間序列資料（Time Series）」處理的敘述，何者最為正確？", "A": "切分訓練與測試集時應保持時間先後，避免以未來預測過去", "B": "可任意隨機打亂資料的時間順序而完全不影響結果", "C": "此類資料在任何情況下都一定不能使用任何的模型", "D": "此類資料的處理與其本身的時間連續性完全無關", "ans": "A"}, {"q": "某模型面對「類別高度不平衡」的資料，下列何者並非常見且適當的處理策略？", "A": "刻意刪除所有的少數類別樣本，僅保留多數類別", "B": "對少數類別進行過採樣，如以 SMOTE 合成新樣本", "C": "調整損失函數的權重，以加重少數類別誤判的懲罰", "D": "對數量過多的多數類別樣本進行欠採樣以平衡比例", "ans": "A"}, {"q": "下列關於「AI 專案生命週期」的敘述，何者最為正確？", "A": "模型一旦部署上線之後就完全不需要任何的監控", "B": "整個生命週期實際上僅包含模型訓練這一個步驟", "C": "通常含問題定義、資料處理、建模、評估、部署與監控等階段", "D": "資料的蒐集與處理並不屬於 AI 專案生命週期的一部分", "ans": "C"}, {"q": "下列何者最能描述「概念驗證（Proof of Concept, PoC）」在 AI 導入過程中所扮演的角色？", "A": "在專案中專門負責撰寫對外宣傳用的行銷文案", "B": "此階段與評估技術方案的可行性之間毫無關聯", "C": "在小範圍先驗證技術可行性與價值，以降低導入風險", "D": "指系統全面上線之後所進行的日常維運工作", "ans": "C"}, {"q": "某企業評估導入 AI 的效益時，除了直接的 API 費用與人力成本外，還一併納入了模型訓練、系統整合與資安合規等各項支出。此評估最接近下列何種概念？", "A": "總體擁有成本（TCO），涵蓋各項直接與間接支出", "B": "One-hot 編碼，將類別特徵轉為稀疏的指示向量", "C": "召回率（Recall），衡量實際正例被找出的比例", "D": "梯度下降，沿損失梯度反方向逐步調整模型參數", "ans": "A"}, {"q": "下列何者最能描述「投資報酬率（ROI）」在 AI 專案評估中所代表的意義？", "A": "衡量訓練資料集中各欄位所含缺失值的比例高低", "B": "衡量模型在訓練階段完成一次迭代所需的速度", "C": "衡量導入 AI 帶來的效益相對於所投入成本的比率", "D": "衡量模型所輸出的影像或圖表的整體解析度品質", "ans": "C"}, {"q": "下列關於「資料標註（Data Labeling）」的敘述，何者最為正確？", "A": "此項工作本質上僅適用於非監督式的學習任務", "B": "資料標註的品質與最終模型的表現之間毫無關聯", "C": "為監督式學習提供正確答案，其品質直接影響模型表現", "D": "此項工作一定能完全自動化，全程無需任何人工介入", "ans": "C"}, {"q": "下列何者最能描述「特徵選擇（Feature Selection）」的主要目的？", "A": "刪除資料集中的所有特徵欄位以徹底簡化模型", "B": "從眾多特徵中挑選對任務最有幫助者以提升效能", "C": "刻意增加大量無關的特徵以擴充資料的維度", "D": "對原始的特徵資料進行加密以保護其機密性", "ans": "B"}, {"q": "某企業在同一份資料集上比較多個候選模型，為使比較的結果公平可靠，下列做法何者最為正確？", "A": "在比較過程中依主觀感受隨意地更換所用的評估指標", "B": "只需比較各個模型的訓練速度快慢即可決定優劣", "C": "讓每一個模型各自使用不同的測試集來評估表現", "D": "所有模型皆使用相同的訓練測試切分與相同評估指標", "ans": "D"}, {"q": "下列關於「基準模型（Baseline Model）」的敘述，何者最為正確？", "A": "基準模型指的是專案中最終上線的最複雜的模型", "B": "建立基準模型時一定要採用深度學習相關的方法", "C": "此概念與後續各模型之間的效能比較毫無關聯", "D": "建立簡單模型作為比較基準，以判斷複雜模型是否有改善", "ans": "D"}, {"q": "下列關於「資料增強（Data Augmentation）」的敘述，何者最為正確？", "A": "此技術本質上指的是將原始資料進行加密的處理", "B": "對既有資料施加變換（如影像旋轉、翻轉）以增加多樣性", "C": "此技術本質上指的是刪除資料集中的部分資料", "D": "此技術在任何情況下都僅適用於數值型的表格資料", "ans": "B"}, {"q": "下列何者最能描述「監督式學習中的標籤洩漏（Label Leakage）」問題？", "A": "特徵中不當含有與目標高度相關、推論時卻不可得的資訊", "B": "指資料集中各類別之間的樣本比例維持得相當平衡", "C": "指模型的網路層數設計得過多而導致訓練困難", "D": "指用於訓練模型的資料筆數過少而不足以訓練", "ans": "A"}, {"q": "下列關於「AI 與自動化（Automation）」兩者關係的敘述，何者最為正確？", "A": "自動化與 AI 在任何情況下都是完全相同的概念", "B": "AI 本質上完全無法被應用於任何的自動化流程", "C": "AI 可強化自動化的判斷與適應能力，但兩者並非完全等同", "D": "自動化流程的運作必然完全不需要任何規則或模型", "ans": "C"}, {"q": "下列何者最能描述「弱人工智慧（Narrow AI）」的主要特性？", "A": "能像人類一樣勝任幾乎任何領域的智力型任務", "B": "專注於特定任務（如影像辨識、翻譯），不具通用智能", "C": "此概念與目前既有的各種 AI 實際應用毫無關聯", "D": "此類人工智慧目前僅存在於科幻小說或電影之中", "ans": "B"}, {"q": "下列關於「AI（機器學習）與傳統規則式系統（Rule-based System）」兩者差異的敘述，何者最為正確？", "A": "這兩種系統在運作原理與方法上是完全相同的", "B": "規則式依人工預定規則運作，機器學習可從資料自動學習", "C": "機器學習本質上完全無法被應用於任何實務場景", "D": "傳統規則式系統在任何任務上都一定比機器學習更準", "ans": "B"}, {"q": "下列關於「資料品質對模型影響」的敘述，何者最為正確？", "A": "訓練資料品質不佳會直接影響模型表現，即 Garbage In, Garbage Out", "B": "訓練資料的品質好壞對最終模型的表現完全沒有影響", "C": "只要模型的規模夠大，就完全不會受到資料品質影響", "D": "資料品質僅會影響模型的訓練速度而不影響其準確度", "ans": "A"}, {"q": "某企業希望在正式導入 AI 之前，先釐清「究竟要解決什麼問題、成功又該如何衡量」。此步驟在 AI 專案中最接近下列何者？", "A": "硬體採購，評估並購置專案所需的運算硬體設備", "B": "問題定義與成功指標設定，釐清目標與衡量標準", "C": "資料加密，對敏感的原始資料進行加密以保護安全", "D": "模型部署，將訓練完成的模型上線提供實際服務", "ans": "B"}, {"q": "下列關於「AI 模型可能放大既有社會偏見」的敘述，何者最為正確？", "A": "若訓練資料反映了歷史上的不平等，模型可能學習並放大偏見", "B": "模型的偏見只來自其架構設計，與所使用的資料無關", "C": "AI 模型在訓練後必然能自動消除資料中的所有偏見", "D": "模型所帶有的偏見對其最終的決策結果毫無影響", "ans": "A"}, {"q": "下列何者最能描述「持續學習／線上學習（Online Learning）」的主要特性？", "A": "此種學習方式與上線後的資料漂移問題毫無關聯", "B": "模型能隨新到來的資料持續更新，以適應變化的環境", "C": "模型僅能進行一次性的離線訓練而不能持續更新", "D": "模型一旦完成訓練之後便永遠固定、不再作任何更新", "ans": "B"}]}, "new_gen": {"rows": [{"q": "某企業需以 AI 生成客服回覆與文件摘要，要求模型能理解完整語句，且即使對話較長仍能維持上下文的一致性。下列何種模型架構最為適合？", "A": "僅使用人工預先定義的規則式樣板來組合回覆", "B": "循環神經網路（RNN），逐步處理序列但長依賴較弱", "C": "基於 Transformer 架構的自迴歸語言模型", "D": "卷積神經網路（CNN），擅長擷取影像的空間特徵", "ans": "C"}, {"q": "下列何者最能描述「自迴歸（Autoregressive）語言模型」的生成方式？", "A": "僅能輸出長度固定且內容也固定不變的制式回覆", "B": "一次直接輸出整句話，過程中不參考已生成的內容", "C": "完全不需任何前文脈絡即可生成一整段完整文字", "D": "依先前已生成的內容，逐個 token 產生後續的文字", "ans": "D"}, {"q": "某電信公司客服系統採用 Encoder-Decoder 架構。下列何者最能準確描述其解碼器（Decoder）在生成回覆時的作用？", "A": "一次性地將編碼器的語義表示直接轉為完整回覆", "B": "先產生一份完整回覆，再交由編碼器進行事後修正", "C": "先產生多個候選句子，再從中挑選一句作為輸出", "D": "依編碼器語義表示並結合已生成內容，逐詞產生回覆", "ans": "D"}, {"q": "下列關於「Encoder–Decoder」與「Decoder-only」兩種架構的敘述，何者最為正確？", "A": "這兩種架構在整體結構與內部運作的機制上是幾乎完全相同的", "B": "Encoder–Decoder 架構本質上僅能用於影像處理而無法處理文字序列", "C": "Encoder–Decoder 常用於序列轉序列任務，Decoder-only 常見於自迴歸生成", "D": "Decoder-only 架構本質上完全無法用於任何形式的文字生成任務", "ans": "C"}, {"q": "在 LLM 的應用中，下列何者最能正確描述「Token」的意義？", "A": "Token 是用來代表整段輸入文字的單一數值向量", "B": "Token 是模型將文字切分後的基本單位，長度與其數量相關", "C": "Token 的數量只會影響運算速度而完全不影響計費", "D": "Token 的多寡與模型的上下文長度限制之間沒有關聯", "ans": "B"}, {"q": "下列關於「上下文長度（Context Length / Context Window）」的敘述，何者最為正確？", "A": "上下文設定得越短，模型的表現就一定會越好", "B": "指模型單次可處理的最大 Token 數，超過即無法完整納入", "C": "上下文長度可以無限延長，完全不受模型架構的限制", "D": "上下文長度與輸入所占用的 Token 數量之間毫無關聯", "ans": "B"}, {"q": "在以 API 串接生成式 AI 服務時，下列關於 Token 對計費影響的敘述，何者最為正確？", "A": "輸入與輸出的 Token 數量都會影響 API 的使用成本", "B": "使用時 Token 的數量多寡完全不會影響任何的費用", "C": "Token 的數量僅會影響模型回覆內容所使用的字型", "D": "計費時僅計算輸出的 Token，輸入的部分完全免費", "ans": "A"}, {"q": "下列何者最能描述生成式 AI 產生「幻覺（Hallucination）」的風險？", "A": "模型在生成時只會逐字複製訓練語料中的原始內容", "B": "模型可能生成看似流暢但與事實不符或憑空捏造的內容", "C": "此種幻覺的風險僅會存在於影像生成類的模型之中", "D": "模型受此風險影響時將完全無法輸出任何的文字", "ans": "B"}, {"q": "下列關於「溫度參數（Temperature）」對 LLM 生成內容影響的敘述，何者最為正確？", "A": "溫度參數的設定與模型輸出的隨機程度之間毫無關聯", "B": "溫度參數設定得越高，模型的輸出就一定會越準確", "C": "溫度越高輸出越隨機多樣，溫度越低輸出越保守一致", "D": "溫度參數的設定只會影響模型回應請求的處理速度", "ans": "C"}, {"q": "某法規文件自動摘要應用要求輸出具「高一致性、可重現」，在其他條件相同的前提下，下列調整何者較為合適？", "A": "移除提示詞中所有的指令，僅提供原始文件內容", "B": "調低生成的溫度參數以降低隨機性、提升一致性", "C": "調高生成的溫度參數以增加輸出內容的隨機變化", "D": "改用影像生成模型來處理此文字摘要相關任務", "ans": "B"}, {"q": "下列何者最能描述「多模態模型（Multimodal Model）」的主要特性？", "A": "能同時處理與理解多種型態資料，如文字、影像與語音", "B": "本質上僅能處理純文字資料而無法處理其他型態", "C": "本質上僅能處理數值型的表格資料而無法理解文字", "D": "此類模型在任何情況下都完全無法生成任何內容", "ans": "A"}, {"q": "某電商導入 CLIP 模型，讓使用者以文字描述來搜尋商品圖片。CLIP 主要透過下列何種方式衡量文字與圖片的相符程度？", "A": "交叉熵損失，衡量預測機率分布與真實分布的差距", "B": "F1 分數，整合精確率與召回率的調和平均數值", "C": "BLEU 分數，衡量生成文字與參考譯文的重疊程度", "D": "餘弦相似度，計算文字與圖片向量在空間中的方向相似度", "ans": "D"}, {"q": "下列關於「嵌入（Embedding）向量」的敘述，何者最為正確？", "A": "將資料轉為反映語意的向量，語意相近者在空間中較接近", "B": "此技術與語意相似度的計算之間並沒有任何的關聯", "C": "此技術本質上僅能表示影像資料而無法表示文字", "D": "嵌入向量的唯一用途是對原始資料進行加密保護", "ans": "A"}, {"q": "某 AI 客服系統先從知識庫檢索相關文件，再依使用者的查詢內容生成回覆。下列對其技術本質的敘述，何者最為適當？", "A": "屬於以人工規則庫逐條匹配回覆的傳統規則式系統", "B": "屬於單純的資料檢索，過程中並未涉及任何生成式 AI", "C": "屬於依歷史資料推估未來結果的預測分析類系統", "D": "結合檢索與生成機制，仍屬於生成式 AI 的應用範疇", "ans": "D"}, {"q": "下列關於「GPT-Realtime 這類即時互動模型」最適用場景的敘述，何者最為正確？", "A": "適合用於即時語音客服與需即時回應的互動式 AI 代理", "B": "適合用於需長時間批次處理的大規模報表生成任務", "C": "適合用於以高一致性為優先的法規文件摘要類任務", "D": "適合用於離線環境下對大量歷史資料進行清理工作", "ans": "A"}, {"q": "下列關於「基礎模型（Foundation Model）」的敘述，何者最為正確？", "A": "此類模型本質上僅能用於單一且固定不變的任務", "B": "以大規模資料預訓練，可經微調或提示適配多種下游任務", "C": "此類模型不需要任何訓練資料即可直接投入使用", "D": "基礎模型此一概念與生成式 AI 之間並沒有關聯", "ans": "B"}, {"q": "在對 LLM 進行企業專屬知識的 Fine-tuning 時，若 GPU 與記憶體資源嚴重受限，下列哪一種參數高效微調（PEFT）技術最能在維持效能下顯著降低需更新的參數量？", "A": "知識蒸餾，讓小型學生模型學習大型教師模型的行為", "B": "梯度凍結，直接凍結網路中所有層而不更新任何參數", "C": "低秩適配（LoRA），僅訓練少量低秩矩陣以逼近微調", "D": "提示詞工程，僅調整輸入提示而完全不改動模型權重", "ans": "C"}, {"q": "下列關於「參數高效微調（PEFT）」的敘述，何者最為正確？", "A": "進行 PEFT 時必須完整更新模型的全部參數才有效", "B": "PEFT 此一技術與模型的微調之間並沒有任何關聯", "C": "PEFT 此類技術本質上僅能適用於影像類的模型", "D": "僅更新少量參數即達到接近全參數微調的效果並降低成本", "ans": "D"}, {"q": "某新創僅收集到少量已標註的診斷病例。相較於監督式微調（SFT），強化微調（RFT）在標註資料極為有限時最主要的優勢為何？", "A": "RFT 與 SFT 在資料需求上本質相同，並無明顯差異", "B": "RFT 以獎懲回饋引導優化，對大量標註資料依賴相對較低", "C": "RFT 反而更需仰賴大量且高品質的人工標註資料才能運作", "D": "RFT 可從未標註資料自動產生正確標註以完全取代 SFT", "ans": "B"}, {"q": "下列關於「監督式微調（Supervised Fine-Tuning, SFT）」的敘述，何者最為正確？", "A": "此技術本質上僅能被應用於影像生成相關的任務", "B": "SFT 此一技術與模型的微調之間並沒有任何關聯", "C": "以標註好的輸入輸出範例調整模型，使其特定任務表現更佳", "D": "進行 SFT 時完全不需要任何已標註的範例資料", "ans": "C"}, {"q": "某 RAG 系統回覆品質穩定，但推論延遲與運算成本逐漸增加。若採用知識蒸餾（Knowledge Distillation）來優化效能，下列敘述何者最為合理？", "A": "使小型模型學習大型模型的行為，以降低推論的成本", "B": "將檢索到的資料全部轉為固定規則以取代生成模型", "C": "直接停用生成模型以徹底避免推論所帶來的延遲", "D": "僅靠不斷增加檢索文件的數量來改善系統的效能", "ans": "A"}, {"q": "某開發團隊發現 AI 生成的 Python 套件呼叫方式為舊版 API，與最新官方文件不符。若希望模型在推理時能即時存取並整合最新的外部文件，下列何種技術最為適合？", "A": "以提示詞快取的方式，將常用文件預先存放於提示中", "B": "透過 MCP 工具整合，讓模型推理時即時存取最新外部文件", "C": "對模型進行微調，將最新文件重新訓練寫入模型權重", "D": "以知識蒸餾的方式，將龐大的文件庫壓縮進小型模型", "ans": "B"}, {"q": "下列何者最能描述「提示詞工程（Prompt Engineering）」的核心概念？", "A": "進行時必須重新訓練並更新模型的全部參數才有效", "B": "本質上僅是指增加運算所使用的 GPU 數量而已", "C": "透過設計輸入提示的內容與結構引導輸出，不改動模型權重", "D": "提示詞工程與模型最終的輸出品質之間並沒有關聯", "ans": "C"}, {"q": "下列關於「Fine-tuning」與「Prompt Engineering」兩者取捨的敘述，何者最為正確？", "A": "Prompt Engineering 在執行時同樣需要更新模型的權重", "B": "這兩種方法在做法與效果上本質上是完全相同的", "C": "提示工程成本低彈性高但受模型能力限制，微調可深化領域表現", "D": "Fine-tuning 在任何情況下都一定優於任何的提示詞設計", "ans": "C"}, {"q": "下列關於「AI 研究團隊採用 GRPO（Group Relative Policy Optimization）」的敘述，何者最為正確？", "A": "GRPO 此一方法本質上僅被用於影像的壓縮處理", "B": "GRPO 是一種強化學習方法，透過群組內相對比較優化策略", "C": "GRPO 此一技術與模型的實際訓練之間並沒有關聯", "D": "GRPO 本質上是一種對訓練資料進行加密的安全技術", "ans": "B"}, {"q": "下列關於「人類反饋強化學習（RLHF）」在生成式 AI 中用途的敘述，何者最為正確？", "A": "RLHF 此一技術與模型行為的對齊之間並沒有關聯", "B": "RLHF 此一技術本質上僅能被用於影像的去噪處理", "C": "RLHF 此一技術本質上僅被用於原始資料的清理工作", "D": "以人類偏好回饋引導模型輸出更符合人類期望與規範", "ans": "D"}, {"q": "某教育科技公司開發 AI 作文批改系統，希望模型能依教師的評分邏輯給予回饋，並在每次送出時一併提供評分準則作為參考依據。此作法最接近下列何種技術？", "A": "模型量化，以較低數值精度表示參數以降低運算需求", "B": "重新訓練整個模型的所有參數以學會新的評分邏輯", "C": "在提示中提供評分準則作為上下文的提示與情境設計", "D": "知識蒸餾，讓小型模型學習大型模型的批改行為", "ans": "C"}, {"q": "下列關於「小樣本學習（Few-shot Prompting）」的敘述，何者最為正確？", "A": "使用此方法時必須先提供多達上萬筆的人工標註資料", "B": "在提示中提供少量範例引導任務，但範例可能難以涵蓋新情境", "C": "小樣本學習此一方法與提示詞的設計之間毫無關聯", "D": "只要使用此方法就一定能完整涵蓋所有可能的新情境", "ans": "B"}, {"q": "某企業以 Few-shot Prompting 進行文字分類，套用至新市場的資料時結果不穩定，且原本提供的範例並未涵蓋新市場的表達方式。下列何者最可能為主因？", "A": "模型對其中的某一個單一範例產生了過度記憶的現象", "B": "少量的範例難以涵蓋新情境下資料在表達上的差異", "C": "提示詞完全無法引導模型擷取不同資料間的共通特徵", "D": "模型本身的推理能力嚴重不足以致無法完成分類任務", "ans": "B"}, {"q": "下列關於「零樣本學習（Zero-shot Prompting）」的敘述，何者最為正確？", "A": "零樣本學習的效果在任何情況下都一定優於 Few-shot", "B": "不提供任何任務範例，僅以指令引導模型完成任務", "C": "零樣本學習此一方法與提示詞的設計之間毫無關聯", "D": "使用零樣本學習時仍必須提供大量的人工標註範例", "ans": "B"}, {"q": "某醫療任務需微調語言模型，但可用的標註資料相當稀少。下列關於微調策略選擇的敘述，何者最為正確？", "A": "微調策略的選擇與當前手上可用的標註資料量多寡之間完全無關", "B": "在標註資料稀少的情況下也只能選擇更新全部參數的全參數微調", "C": "標註極有限時可考量 RFT 等低依賴方法或以 PEFT 降低成本", "D": "一定要先蒐集到高達數百萬筆的標註資料之後才能夠進行微調", "ans": "C"}, {"q": "下列關於「持續預訓練（Continual / Domain Pre-training）」的敘述，何者最為正確？", "A": "持續預訓練此一方法與模型的領域適配之間毫無關聯", "B": "以特定領域大量語料進一步預訓練，強化該領域語言理解", "C": "持續預訓練此一方法本質上僅能適用於影像類的資料", "D": "持續預訓練指的是刪除模型先前所學到的全部知識", "ans": "B"}, {"q": "某企業建置檢索增強生成（RAG）系統以支援內部知識查詢。下列何者最能描述 RAG 的核心價值？", "A": "在生成前先檢索外部知識作為上下文，補充知識並降低幻覺", "B": "RAG 此一技術的唯一用途是對原始資料進行加密保護", "C": "RAG 此一機制會完全取代語言模型本身的文字生成能力", "D": "RAG 此一機制與補充模型的外部知識之間並沒有關聯", "ans": "A"}, {"q": "某企業將長篇文件直接整份檢索，發現回覆常含無關內容、引用段落不精準，於是決定導入 Chunking（文件切塊）機制。其主要目的為何？", "A": "透過縮短整體輸入的長度來加快模型的推理速度", "B": "讓生成模型在回覆時能有更高的創意與發揮空間", "C": "減少推論時所使用的記憶體以提升系統的穩定性", "D": "提升檢索的語意對齊程度並降低長文件造成的干擾", "ans": "D"}, {"q": "下列何者最能描述 RAG 系統中「向量資料庫（Vector Database）」所扮演的角色？", "A": "專門用於儲存系統所使用的原始高解析度影像檔案", "B": "負責對系統所採用的大型語言模型進行訓練與微調", "C": "用於對使用者所設定的登入密碼進行加密與保護", "D": "以向量形式儲存文件嵌入並支援以相似度快速檢索", "ans": "D"}, {"q": "某 RAG 系統的回覆有時會引用關聯性不足的文件，影響了回覆的可信度。若在流程中引入重排序（Re-ranking）機制，其主要作用為何？", "A": "直接刪除初步檢索所得到的所有候選文件不予使用", "B": "對初步檢索的候選文件重新排序，使最相關者優先提供", "C": "增加生成模型的參數量以提升其整體的表達能力", "D": "停用系統中的生成模型以避免產生不精準的回覆", "ans": "B"}, {"q": "下列關於 RAG 中「Chunking（文件切塊）」策略的敘述，何者最為正確？", "A": "文件切塊此一步驟的唯一目的是為了對內容加密", "B": "切塊大小的設定對最終的檢索結果不會有任何影響", "C": "在任何情況下都應將整份文件視為單一且完整的塊", "D": "適當的切塊大小與重疊有助檢索精準，過大過小都可能影響", "ans": "D"}, {"q": "下列何者最能描述 Model Context Protocol（MCP）與 RAG 在功能定位上的主要差異？", "A": "RAG 必依賴向量資料庫，而 MCP 則完全不需任何外部整合", "B": "MCP 的主要目的在降低訓練成本，RAG 主要在提升推論速度", "C": "MCP 著重模型與外部工具或系統互動，RAG 著重補充知識來源", "D": "RAG 本質上是一種通訊協議，MCP 本質上是一種檢索技術", "ans": "C"}, {"q": "某企業以 LLM 分析內部報表，使用者常提供由 Excel 匯出的表格資料，但模型解析結果不穩定。下列哪一種上下文工程（Context Engineering）作法較為適當？", "A": "直接將使用者原始的整段表格內容貼上，以求完整保留其中所有資訊", "B": "將表格內容轉換為結構化的 JSON 或 Markdown 表格格式", "C": "維持使用者表格資料原始的呈現方式，完全不對其做任何格式上的轉換", "D": "先將表格的內容隨機切割為許多小段落之後，再逐段分別輸入給模型解析", "ans": "B"}, {"q": "某會計事務所需自動分類多種格式（手寫、掃描、電子發票）且各企業科目規則不同的報銷單據。比較方案甲（直接呼叫基礎 LLM API 解析分類）與方案乙（內建 RAG 比對過去已正確分類的案例）。下列分析何者最正確？", "A": "方案乙較優，RAG 可提供歷史案例作為上下文提升分類準確率", "B": "兩方案的效果相同，因此應選擇實作較為簡單的方案甲", "C": "方案甲較優，因為模型的通用知識已足以應對所有格式", "D": "以人工訂定的固定分類規則處理即可，完全無需導入 AI", "ans": "A"}, {"q": "下列關於「檢索增強生成（RAG）可引用來源」此一特性之價值的敘述，何者最為正確？", "A": "可引用來源此一特性與生成內容的可信度之間毫無關聯", "B": "可讓生成內容附帶可追溯的來源，提升可信度與可驗證性", "C": "此一特性反而會使模型的回覆內容變得完全無法驗證", "D": "可引用來源此一特性本質上僅適用於影像的生成任務", "ans": "B"}, {"q": "某企業需其 AI 助理具備以下需求：能查詢內部規範、回答須可追溯來源、資料頻繁更新、且須維持即時性。下列何種架構最為適合？", "A": "將所有內規一次性微調寫入模型權重，之後便不再更新", "B": "僅使用零樣本提示，不串接任何形式的外部知識庫", "C": "以 RAG 結合最新內部文件的檢索，並於回覆時附上來源", "D": "改用純影像生成模型來處理這些文字查詢相關的需求", "ans": "C"}, {"q": "下列關於 RAG 系統中「Embedding 模型選擇」的敘述，何者最為正確？", "A": "任何一種嵌入模型所產生的檢索效果都是完全相同的", "B": "所選用的嵌入模型與最終的檢索品質之間並沒有關聯", "C": "系統中所使用的嵌入向量其唯一用途是對資料加密", "D": "選用合適的嵌入模型會影響檢索語意對齊，進而影響回覆", "ans": "D"}, {"q": "某支付平台欲以生成式 AI 輔助分析可疑交易並生成特徵描述報告，且已擁有大量歷史洗錢案例資料。下列何種技術最為適合？", "A": "以 Midjourney 等影像生成工具生成交易流程的示意圖像", "B": "以 Few-shot 的方式訓練一個影像識別模型來辨識交易", "C": "運用 RAG 檢索增強生成，並結合歷史案例的資料庫", "D": "直接使用基礎模型作答，不串接任何外部的資料來源", "ans": "C"}, {"q": "下列關於「RAG 相較於單純微調」在需頻繁更新知識情境下優勢的敘述，何者最為正確？", "A": "RAG 此一機制本質上完全無法引用任何的外部資料", "B": "更新知識時只需更新檢索資料庫，無需重訓模型，較易維持即時", "C": "RAG 系統每一次更新知識時都需要重新訓練整個模型", "D": "RAG 此一機制與知識的更新維護之間並沒有任何關聯", "ans": "B"}, {"q": "下列何者最能描述 RAG 流程的典型步驟？", "A": "僅由模型憑其記憶直接作答，過程中不檢索任何資料", "B": "在流程中僅對使用者所輸入的原始資料進行加密處理", "C": "先由模型生成內容，再將所生成的所有內容全部刪除", "D": "先將查詢轉向量並檢索文件，再連同查詢交生成模型產出", "ans": "D"}, {"q": "某企業建置文件型知識查詢系統，若直接以整份長文件進行檢索，容易造成回覆含有無關內容。除了 Chunking 之外，下列何者亦有助於提升檢索的精準度？", "A": "為文件片段建立高品質的嵌入，並使用語意相似度來檢索", "B": "將系統中所有的文件全部合併為單一超長的字串處理", "C": "移除文件中所有的段落、標題等結構性的組織資訊", "D": "僅依關鍵字進行完全比對，而不進行任何語意的檢索", "ans": "A"}, {"q": "在 LLM 的提示詞設計中，下列何者並非基於思維鏈（Chain-of-Thought）推理所發展而來的技術？", "A": "ReAct prompting，交錯進行推理與呼叫工具的行動", "B": "Zero-shot Learning，不給範例僅以指令引導完成任務", "C": "Tree-of-Thought，以樹狀方式探索多條推理的路徑", "D": "Self-consistency，取多條推理路徑的多數結果為答案", "ans": "B"}, {"q": "下列關於「思維鏈（Chain-of-Thought, CoT）」提示的敘述，何者最為正確？", "A": "思維鏈提示此一技術本質上僅適用於影像的生成任務", "B": "思維鏈提示此一技術與模型的推理品質之間毫無關聯", "C": "引導模型逐步展開推理過程，有助提升複雜推理的正確率", "D": "此技術要求模型直接給出答案，過程中不做任何的推理", "ans": "C"}, {"q": "下列關於「ReAct（Reason and Act）」架構的敘述，何者最為正確？", "A": "採用此架構的模型完全無法呼叫任何的外部工具", "B": "此架構僅能用於處理固定且步驟不會改變的既定流程", "C": "讓模型交錯進行推理與行動（如呼叫工具），適合動態任務", "D": "ReAct 此一架構與模型的推理能力之間並沒有關聯", "ans": "C"}, {"q": "某企業設計 AI Agent，正評估是否採用 ReAct 架構。下列哪一種情境最適合使用 ReAct（需交錯推理與行動）？", "A": "將固定格式的 PDF 批次翻譯並自動儲存，流程明確固定", "B": "依既定的流程進行多步驟的查詢，再整合結果後回覆", "C": "分析新創融資狀況，須自行判斷資訊是否足夠並調整查詢", "D": "依既有規則判斷退貨條件，並回覆事先設定好的固定訊息", "ans": "C"}, {"q": "下列關於「Self-consistency」提示策略的敘述，何者最為正確？", "A": "Self-consistency 本質上是一種對資料進行加密的技術", "B": "Self-consistency 此策略與 Chain-of-Thought 之間毫無關聯", "C": "此策略在運作時僅會生成單一條推理路徑後即輸出答案", "D": "多次採樣多條推理路徑並取多數一致的答案以提升可靠度", "ans": "D"}, {"q": "下列關於「Tree-of-Thought（ToT）」的敘述，何者最為正確？", "A": "Tree-of-Thought 此一方法與模型的推理過程毫無關聯", "B": "此方法僅能進行單線的推理，過程中完全不可以分支", "C": "Tree-of-Thought 本質上是一種對影像進行壓縮的方法", "D": "將推理展開為樹狀多分支探索，比較不同思路以找較佳解", "ans": "D"}, {"q": "某律師事務所在設計 AI 合約審查系統的上下文（Context）時，最應優先考量下列何者？", "A": "優先提升系統回應每次查詢時的整體處理與回覆速度", "B": "優先強化模型在生成合約相關內容時的創意發揮能力", "C": "優先保留合約原文的逐字精確性，避免語意被改寫遺漏", "D": "盡量壓縮所提供的上下文內容以降低 API 的使用成本", "ans": "C"}, {"q": "下列關於「上下文工程（Context Engineering）」的敘述，何者最為正確？", "A": "上下文工程此一做法與模型最終的提示品質之間毫無關聯", "B": "上下文工程本質上僅是指增加運算所使用的 GPU 數量", "C": "妥善組織並提供模型的上下文（如結構化格式）以提升回應", "D": "上下文工程此一做法本質上僅能適用於影像類的模型", "ans": "C"}, {"q": "某公司開發能長期記住使用者重要資訊的 AI 助理，採用 Titans 架構的 Memory as Context（MAC）機制。在此設計下，長期記憶最可能的使用方式為何？", "A": "完全不使用任何記憶模組，僅單純延長模型的輸入長度", "B": "將所有的記憶內容整合寫入模型每一層的內部權重之中", "C": "利用所儲存的記憶去動態調整模型各處注意力的強弱", "D": "將記憶整理為重點，與目前輸入一起提供給模型作為參考", "ans": "D"}, {"q": "某保險公司導入具延伸推理（Extended Thinking）功能的推理型模型，希望能依案件複雜度自動調整推理深度，以平衡回覆品質與成本。此需求最核心涉及下列何種設計概念？", "A": "在提示中為模型增加更多可供參考的範例與說明內容", "B": "依案件複雜度動態設定推理過程可用的最大思考資源上限", "C": "無論案件難易一律改用參數規模更大的模型來作答", "D": "透過調整生成的溫度參數來控制輸出內容的隨機程度", "ans": "B"}, {"q": "下列關於「提示詞快取（Prompt Caching）」的敘述，何者最為正確？", "A": "提示詞快取此一機制主要用於對使用者的輸入進行加密", "B": "提示詞快取此一機制會永久地改變模型內部的權重參數", "C": "提示詞快取此一機制與請求的延遲及成本之間毫無關聯", "D": "將常用或固定的提示內容快取重用，以降低重複處理的成本", "ans": "D"}, {"q": "某人資部門在 Dify 平台建立 AI 面試輔助機器人，卻發現機器人無法記住同一位應徵者五分鐘前說過的話。下列何者最能從根本上解決此問題？", "A": "為執行系統的伺服器增加更多的實體記憶體與運算資源", "B": "在每次 API 請求中將歷史對話一併送入模型進行推理", "C": "提高模型生成時的溫度參數以增加輸出內容的多樣性", "D": "改用一個參數規模更多、能力更強的大型語言模型", "ans": "B"}, {"q": "下列關於「系統提示（System Prompt）」的敘述，何者最為正確？", "A": "系統提示的內容依規定只能保持空白而不可填寫任何字", "B": "用於設定模型的角色、行為準則與回應範圍，引導整體行為", "C": "系統提示的唯一用途是對使用者的輸入內容進行加密", "D": "系統提示的設定對模型最終的行為表現沒有任何影響", "ans": "B"}, {"q": "某作文批改系統希望模型每一次都能依照教師的評分邏輯給予回饋。下列做法何者最直接且成本較低？", "A": "改用影像生成模型來處理此作文的文字批改相關任務", "B": "在提示中提供清楚的評分準則與範例作為引導的依據", "C": "移除提示中的所有內容，僅提供學生的作文原始文字", "D": "每一次批改時都重新訓練整個模型以學會評分的邏輯", "ans": "B"}, {"q": "下列關於「將表格資料提供給 LLM」的最佳實務，何者最為正確？", "A": "僅提供該表格的一張圖片截圖，並且完全不附加任何的文字補充說明", "B": "先刪除表格中所有的欄位名稱標題之後，再將其餘的內容提供給模型", "C": "轉換為結構化格式（如 JSON 或 Markdown 表格）有助正確解析", "D": "先將表格中各個儲存格的內容全部隨機打亂順序之後，再提供給模型", "ans": "C"}, {"q": "下列何者最能描述「提示詞注入（Prompt Injection）」所帶來的風險？", "A": "提示詞注入此一風險與系統的整體安全性之間毫無關聯", "B": "提示詞注入此一風險僅會影響到模型的訓練處理速度", "C": "攻擊者以精心設計的輸入誘使模型忽略原指令、執行非預期行為", "D": "提示詞注入指的是模型變得完全無法接受任何形式的輸入", "ans": "C"}, {"q": "下列何者最能體現 AI Agent 與傳統自動化系統之間的關鍵差異？", "A": "AI Agent 僅能依預先設定好的流程執行固定不變的任務", "B": "AI Agent 僅能對結構化的資料進行批次的運算與處理", "C": "AI Agent 能依任務目標動態決策行動並適時調整執行策略", "D": "AI Agent 僅能透過圖形化的使用者介面進行操作與互動", "ans": "C"}, {"q": "某企業導入 AI 以改善營運效率。下列何者最不符合 AI Agent 的典型特性？", "A": "可視當下情境調用不同的外部工具以協助完成指定任務", "B": "可在任務執行過程中依實際狀況調整策略以達成目標", "C": "僅能依提示生成多樣化文本內容，而無法規劃或採取行動", "D": "可依所設定的任務目標動態規劃出合適的處理流程步驟", "ans": "C"}, {"q": "下列關於「Agentic AI」的敘述，何者最為正確？", "A": "Agentic AI 此一概念與各種自動化的任務之間毫無關聯", "B": "Agentic AI 在執行任務時完全無法使用任何的外部工具", "C": "能自主規劃步驟、調用工具並執行多步驟任務以達成目標", "D": "Agentic AI 僅能進行單輪的問答，而不具備任何規劃能力", "ans": "C"}, {"q": "某企業以解決方案圖譜（Solution Graph）作為 Agentic AI 的規劃框架。下列何者為 Solution Graph 的主要功能？", "A": "完全取代語言模型的推理，改以純圖形搜尋來完成所有決策", "B": "作為儲存已完成案例的知識庫，供代理在需要時檢索參考", "C": "定義代理可參考的任務分解方式與各步驟的決策路徑結構", "D": "限制代理在執行任務時僅能依照單一固定的流程來執行", "ans": "C"}, {"q": "某金融集團建構多代理（Multi-Agent）系統，由不同 Agent 分別負責市場分析、風險評估與交易執行。此架構的主要優勢最接近下列何者？", "A": "所有的工作最終仍僅能由單一個 Agent 集中處理與完成", "B": "將複雜任務拆解由專責 Agent 協作完成，提升分工與可維護性", "C": "此種多代理的架構設計反而使系統無法處理任何複雜任務", "D": "多代理的架構設計與任務的分工協作之間並沒有任何關聯", "ans": "B"}, {"q": "下列關於「MCP（Model Context Protocol）」的敘述，何者最為正確？", "A": "MCP 此一協議本質上僅被用於對影像進行壓縮的處理", "B": "提供標準化方式讓模型與外部工具或資料來源互動整合", "C": "MCP 此一協議與模型和外部工具的整合之間毫無關聯", "D": "MCP 本質上是一種以向量形式儲存資料的向量資料庫", "ans": "B"}, {"q": "某軟體開發公司評估導入 Agentic Coding 工具（如 Claude Code）。下列何者最能正確描述此類工具所支援的核心操作能力？", "A": "僅提供程式碼建議，實際套用完全需人工手動而無法自動變更", "B": "僅將需求轉為架構規劃，過程中並不介入實際的開發工作", "C": "可讀寫專案檔案、執行終端指令，並協助修改測試與版控等流程", "D": "僅輔助撰寫程式，測試、建置與版控的部分則完全需要手動", "ans": "C"}, {"q": "關於 2025 年 OpenAI 所提供的 AgentKit，下列何者最能描述其主要用途？", "A": "支援 Agents 的建構、工具整合與整體任務流程的開發", "B": "提供代理模型進行大規模預訓練與權重優化的完整環境", "C": "作為多個 Agent 之間彼此進行通訊與資訊傳遞的協議", "D": "建立強化學習訓練所需的互動式模擬環境與獎勵機制", "ans": "A"}, {"q": "下列何者最能描述「工具使用（Tool Use / Function Calling）」讓 LLM 具備的能力？", "A": "工具使用此一能力與模型和外部系統的整合之間毫無關聯", "B": "讓模型能呼叫外部函式或工具（如查詢、計算）以完成任務", "C": "工具使用此一機制反而會使模型變得完全無法生成文字", "D": "工具使用此一機制的唯一用途是對輸入的資料進行加密", "ans": "B"}, {"q": "某物流公司部署 Agentic AI 自動規劃跨縣市配送排程。當輸入複雜的配送需求時，此類系統相較於固定流程自動化的主要優勢為何？", "A": "此類系統的運作與其能否自主進行規劃之間並沒有關聯", "B": "此類系統在面對任何條件上的變化時都完全無法處理", "C": "能依目標自主拆解步驟、調用工具並依當下情境調整規劃", "D": "此類系統在配送時僅能執行單一條事先固定好的路線", "ans": "C"}, {"q": "下列關於「AI Agent 的記憶（Memory）」機制的敘述，何者最為正確？", "A": "可保存並運用對話歷史或任務狀態，使後續決策具連貫性", "B": "此記憶機制一次僅能夠記住單一個字元的少量資訊", "C": "此記憶機制與後續決策的連貫性之間並沒有任何關聯", "D": "此類 Agent 在任何情況下都一定不保留任何歷程資訊", "ans": "A"}, {"q": "下列關於「情境感知代理（Context-aware Agent）」核心特性的敘述，何者最為正確？", "A": "僅依當前輸入的指令執行，過程中不保留任何的歷程", "B": "此類代理本質上僅能處理影像而無法處理文字或狀態", "C": "能利用對話歷史與任務狀態來調整自身的行為與決策", "D": "此類代理在每次運作時都一定需要即時重新訓練模型", "ans": "C"}, {"q": "某外送平台推出語音訂餐功能，需完成語音理解、意圖判斷、下單等多個步驟。此類需串接多項能力並依情境決策的應用，最適合以下列何種架構實現？", "A": "純影像分類模型，僅能對輸入的影像進行類別的判斷", "B": "單一固定樣板回覆，僅能回覆事先設定好的固定內容", "C": "僅做關鍵字比對的規則系統，依關鍵字觸發固定回應", "D": "具工具調用與流程規劃能力的 AI Agent 架構來實現", "ans": "D"}, {"q": "下列關於「AI Agent 的自主性（Autonomy）」與風險控管的敘述，何者最為正確？", "A": "採用 AI Agent 之後其在執行任務時就一定不會發生錯誤", "B": "AI Agent 的風險控管與其自主性的高低之間並沒有關聯", "C": "自主性越高越需搭配適當的人工審核與權限控管以降低風險", "D": "AI Agent 的自主性設定得越高，就越完全不需要任何控管", "ans": "C"}, {"q": "某企業使用者要求 ChatGPT「產生一張簡報架構圖」，模型輸出一段具固定語法規則的結構化文字（可再由工具轉換為圖）。此作法最能體現下列何種能力？", "A": "此作法與模型和外部工具之間的協作之間並沒有關聯", "B": "模型能夠直接繪製出點陣格式的高解析度視覺化影像", "C": "模型本身在任何情況下都完全無法產生結構化的輸出", "D": "以結構化文字（如可被工具解析的標記語言）作為協作中介", "ans": "D"}, {"q": "下列關於「Human-in-the-loop（人機協作審核）」在 Agentic AI 中所扮演角色的敘述，何者最為正確？", "A": "Human-in-the-loop 此一機制的唯一用途是對資料加密", "B": "此機制的核心設計是要完全排除任何人工的參與及介入", "C": "Human-in-the-loop 此一機制與系統的風險控管之間毫無關聯", "D": "在關鍵步驟引入人工確認，兼顧自動化效率與風險的控管", "ans": "D"}, {"q": "某研究團隊希望評估 LLM 在法律、醫學、數學、歷史等多學科上的整體理解能力，且要求模型在未見過的題型上仍能作答。下列何種評測最符合此需求？", "A": "僅測試模型在單一特定領域中固定題型的作答表現", "B": "僅測試模型對輸入影像進行分類與辨識的準確程度", "C": "僅測試模型將語音訊號轉換為文字的語音辨識能力", "D": "涵蓋多學科知識與推理的綜合性基準測試（如 MMLU 類）", "ans": "D"}, {"q": "下列關於「多代理協作可能面臨挑戰」的敘述，何者最為正確？", "A": "多個代理彼此之間在協作時完全不需要進行任何的溝通", "B": "多代理的協作與任務執行中的錯誤傳播之間並沒有關聯", "C": "多個 Agent 協作時需處理任務協調、資訊傳遞與錯誤傳播", "D": "多代理系統在運作時一定不會出現任何的協調相關問題", "ans": "C"}, {"q": "下列何者最能描述「AI Agent 的規劃（Planning）」能力？", "A": "此規劃能力僅能讓模型輸出單一句固定不變的內容", "B": "此類 Agent 本質上完全無法對任何任務進行拆解", "C": "將高階目標拆解為可執行的子步驟，並安排其執行順序", "D": "AI Agent 的規劃能力與其最終目標的達成之間毫無關聯", "ans": "C"}, {"q": "某企業導入 No-Code/Low-Code 平台讓各部門自行建立應用。就資料治理的觀點，下列何者最能描述此類平台對治理機制的典型影響？", "A": "平台僅支援快速開發，資料治理完全需仰賴另外的外部系統", "B": "平台雖強化部門自主性，但通常會使治理流程變得難以延續", "C": "導入此類平台通常可以顯著地降低治理與法遵合規的需求", "D": "平台內建角色權限與資料存取控管，有助治理制度的落實", "ans": "D"}, {"q": "某製造企業於邊緣裝置以 No-Code/Low-Code 平台開發即時監控應用，於雲端執行順暢，但部署至邊緣裝置後出現延遲。下列何者最能合理解釋此現象？", "A": "No-Code/Low-Code 平台所開發的應用僅能在雲端環境執行", "B": "邊緣裝置通常受限於本身的運算能力與可用的資源上限", "C": "邊緣運算的架構設計反而可以降低對於整體效能的需求", "D": "雲端部署的方式通常會比邊緣部署更容易出現回應延遲", "ans": "B"}, {"q": "某零售企業希望門市主管可自行調整分析畫面與檢視指標，並由行銷部門建立銷售預測模型。依各工具的主要功能定位，下列規劃何者最為合理？", "A": "以 AutoML 作為分析介面調整平台，No-Code 平台用於模型訓練", "B": "僅導入 AutoML 一項工具，同時兼顧介面調整與模型訓練需求", "C": "以 No-Code 平台支援分析與介面調整，AutoML 負責模型的建立", "D": "僅導入 No-Code 平台一項工具，同時滿足高階模型建立與分析", "ans": "C"}, {"q": "某中小企業行銷主管希望在不高度依賴 IT 部門的情況下，快速建立可自動分析問卷並進行情緒分類的系統。下列何者最能說明 AutoML 在此情境下的核心優勢？", "A": "AutoML 可自動完成模型選擇、特徵處理與訓練，非技術者也能建立", "B": "AutoML 在使用時仍需先熟悉 Python 與深度學習框架才能訓練", "C": "AutoML 所產出的模型無法直接應用，必須完全重寫程式才能上線", "D": "AutoML 此一工具的適用範圍僅限於文字的情緒分析類任務", "ans": "A"}, {"q": "某封閉式 No-Code 平台以專有格式儲存資料、匯出功能有限且未提供標準 API。就長期而言，該企業最可能面臨下列何種風險？", "A": "員工必須具備進階的程式設計能力之後才能夠操作此平台", "B": "此類平台相較之下較容易發生資安漏洞而導致資料的外洩", "C": "未來更換系統時因資料與功能難以轉移而高度依賴原平台", "D": "此平台的運算效能會隨著使用時間的增加而逐漸地下降", "ans": "C"}, {"q": "某物流公司評估 No-Code/Low-Code 平台，主要考量其能否與現有的 ERP、倉儲、客戶通知等平台順利串接。下列哪一項平台特性最能滿足此整合需求？", "A": "採用封閉式的系統架構，以此來降低對外整合時的安全風險", "B": "具備豐富的 API 介接、Webhooks 機制與開放式的系統架構", "C": "內建可將圖形化流程還原為原始程式碼的反向編譯工具", "D": "強制要求將所有開發的應用一律部署於企業的地端伺服器", "ans": "B"}, {"q": "某企業導入 No-Code/Low-Code 後出現大量功能相近的應用、資料欄位定義不一致，導致治理困難。若希望在維持「AI 民主化」的前提下改善，下列何者最為適當？", "A": "限制所開發的 AI 應用僅能被使用於單一個特定的部門", "B": "建立應用開發與模型使用的治理規範以及共用的資料標準", "C": "全面停止使用 No-Code/Low-Code，改回採用傳統開發方式", "D": "全面禁止業務單位自行開發，統一都由資訊部門負責開發", "ans": "B"}, {"q": "在自動化工作流程中，Webhook 是一種由事件觸發、系統主動回應的機制。下列何者最符合此運作邏輯？", "A": "將相關資料整理彙總至公開的看板上，供有需要者隨時查看", "B": "系統每隔一段固定的時間便主動輪詢查詢狀態後再發出通知", "C": "事先約定條件，當符合條件的事件發生時系統主動傳送資訊", "D": "系統定期地向使用者寄送包含各項統計資訊的電子報內容", "ans": "C"}, {"q": "某客服主管希望在 Low-Code 平台設定：當訊息被判為「退費意圖」且金額大於 10,000 元時自動通知主管。此需求最可能透過下列哪一種元件來實現？", "A": "資料格式化（Formatter），將資料轉換為指定的呈現格式", "B": "陣列聚合器（Array Aggregator），將多筆資料彙整為陣列", "C": "條件分支（Branching / Router），依多重條件判斷流程走向", "D": "迭代／迴圈（Iterator），對集合中的每個元素逐一處理", "ans": "C"}, {"q": "某公司需開發股票交易工具，要求在 50 毫秒內完成訊號判斷，並每秒處理超過一萬筆的高併發交易。若以 Low-Code 平台開發，最難克服的先天限制為何？", "A": "無法與任何一家券商所提供的下單 API 進行串接與整合", "B": "底層封裝通用框架，在毫秒級延遲與超高吞吐的極限場景難深度優化", "C": "無法建立能夠即時更新資料的使用者操作介面與畫面", "D": "無法與任何的金融市場行情資料 API 進行串接與整合", "ans": "B"}, {"q": "某新創希望讓非技術背景的業務同仁也能參與功能原型的快速開發，正比較 Vibe Coding 與 Low-Code 兩種方式。下列敘述何者最為正確？", "A": "Vibe Coding 只能拖拉元件，而 Low-Code 只能以對話方式生成", "B": "Vibe Coding 需具程式基礎以審閱 AI 產出，較不適合非技術人員", "C": "兩者的本質完全相同，僅介面有差異，產出的品質也無顯著差異", "D": "Low-Code 較適合開發穩定可維護系統，Vibe Coding 較適快速原型", "ans": "D"}, {"q": "某新創以 MVP 策略導入 Vibe Coding 加速開發，但在上線前仍可能存在程式碼品質與安全上的風險。下列哪一項措施最為合理，以降低相關風險？", "A": "限制開發者修改 AI 所生成的架構，以維持整體的一致性", "B": "只要持續不斷地優化提示詞，即可避免大部分的品質問題", "C": "為降低成本，直接沿用 AI 所生成的程式碼至正式的環境", "D": "將生成的程式碼納入人工審查、重構與安全測試的流程中", "ans": "D"}, {"q": "下列關於 ChatGPT、Claude、GitHub Copilot 等 AI 程式碼輔助工具運作原理的敘述，何者正確？", "A": "Claude 所給的建議是從一個既有的解答資料庫中檢索而得", "B": "ChatGPT 內建了完整的編譯器，可自動更正程式中所有錯誤", "C": "基於 LLM 以大量程式碼訓練並預測下一符號生成，不保證正確", "D": "Copilot 會先執行並驗證程式碼確保結果正確後才提出建議", "ans": "C"}, {"q": "某企業僅有兩名資訊人力且不具備開發能力，希望快速建置「AI 檢測到瑕疵即自動通知、更新庫存並生成報告」的流程。下列何者最為適合？", "A": "將所需的所有功能模組全部委外進行客製化的開發完成之後才上線使用", "B": "使用 No-Code 工具串接 AI 檢測、通知與報表以建立自動化流程", "C": "僅以試算表軟體搭配大量人工的作業方式處理，再逐步地進行優化調整", "D": "導入大型的企業級整合系統，並針對公司的實際需求進行整合與客製", "ans": "B"}, {"q": "某紡織公司具備一定的開發人力，希望快速建置瑕疵檢測後自動拍照存檔並通知品管的工作流程，同時保有後續彈性調整的空間。下列何種方案最為適合？", "A": "以 Excel 的巨集功能搭配人工處理來完成此工作流程", "B": "將程式完全委外進行客製化開發，以完全符合現有規格", "C": "使用 n8n 建立工作流，整合 AI 檢測 API、檔案系統與通訊軟體", "D": "直接採購市面上現成的品管軟體並將其導入公司使用", "ans": "C"}, {"q": "下列關於「AutoML」核心價值的敘述，何者最為正確？", "A": "使用者必須先具備操作深度學習框架的能力之後才能使用", "B": "AutoML 所產出的模型在任何情況下都完全無法實務應用", "C": "自動化模型選擇、特徵處理與超參數調整，降低機器學習門檻", "D": "AutoML 此一工具的適用範圍僅限於單一固定的特定任務", "ans": "C"}, {"q": "下列關於「No-Code 與 Low-Code 的差異」的敘述，何者最為正確？", "A": "Low-Code 平台在任何情況下都完全不允許任何程式的擴充", "B": "No-Code 與 Low-Code 這兩者在本質與做法上是完全相同的", "C": "No-Code 平台在任何情況下都一定會比 Low-Code 功能更強大", "D": "No-Code 幾乎不需寫程式以視覺化為主，Low-Code 可少量程式擴充", "ans": "D"}, {"q": "某企業以 Low-Code 平台建置一套需整合財務、庫存與第三方物流的系統，希望確保跨部門流程與外部服務都能順暢串接。下列平台特性何者最應優先確認？", "A": "平台所提供的使用者操作介面在視覺上是否美觀好看", "B": "平台是否限制其所開發的應用僅能供單一部門使用", "C": "平台是否提供了數量最多、可供選擇的各式佈景主題", "D": "平台是否具備良好的 API 介接、Webhooks 與整合能力", "ans": "D"}, {"q": "下列關於「No-Code/Low-Code 平台導入時的治理考量」，何者最為正確？", "A": "此類平台一經導入之後便完全不再需要任何的治理機制", "B": "導入此類平台後，平台會自動免除掉組織所有的合規要求", "C": "平台的治理工作與其資料的存取管理之間並沒有關聯", "D": "隨使用範圍擴大，需關注資料權限、存取紀錄與合規等議題", "ans": "D"}, {"q": "某企業關注其 Low-Code 儀表板所顯示結果的穩定性與分析的可信度，下列何者最應優先確認？", "A": "平台是否提供了數量最多、樣式最豐富的各式圖表", "B": "平台是否具備穩定的資料串接能力與即時更新的機制", "C": "平台是否支援數量最多的各國語系與在地化的介面", "D": "平台是否可以讓使用者自由地自訂登入畫面的顏色", "ans": "B"}, {"q": "下列關於「Vibe Coding」的敘述，何者最為正確？", "A": "以自然語言驅動 AI 生成客製程式，品質高度依賴提示精準度", "B": "使用時完全不需提供任何提示，即可完美地運作與產出", "C": "Vibe Coding 此一概念與 AI 生成程式碼之間並沒有關聯", "D": "此方法一定能產出可直接上線、且無需任何審查的程式碼", "ans": "A"}, {"q": "某公司使用 AI 程式設計助手時，發現其生成的程式碼與最新的官方 API 不符。下列何種做法最能確保生成的結果符合最新規範？", "A": "全面停止使用任何一種 AI 輔助程式設計的相關工具", "B": "導入可即時存取最新外部文件的機制，如 MCP 工具整合", "C": "僅單純地調高模型生成時所使用的溫度參數即可解決", "D": "直接忽略程式碼與規範不符之處，並將其直接上線使用", "ans": "B"}, {"q": "下列關於「n8n、Make 等自動化工作流工具」的敘述，何者最為正確？", "A": "使用這些工具前必須先撰寫大量的底層程式碼才能運作", "B": "這些工具的功能定位與工作流程的自動化之間毫無關聯", "C": "可透過視覺化方式串接多種服務與 API，建立事件驅動流程", "D": "這些工具僅能處理單一固定任務且無法整合任何外部服務", "ans": "C"}, {"q": "下列關於「AI 民主化（AI Democratization）」的敘述，何者最為正確？", "A": "AI 民主化此一概念指的是僅限資料科學家等專業技術人員才能夠使用 AI", "B": "以 No-Code/Low-Code 等工具降低門檻讓更多人運用，但需搭配治理", "C": "推動 AI 民主化之後反而就會使得整個組織的資料治理工作變得完全不必要", "D": "AI 民主化此一概念與降低使用者實際使用時的技術門檻之間並沒有任何關聯", "ans": "B"}, {"q": "某工廠導入生成式 AI，每月 API 調用成本 15 萬元、維護人力 8 萬元、基礎設施 5 萬元。下列哪一項總體擁有成本（TCO）分析最為完整？", "A": "綜合 API、維護人力與基礎設施等直接成本，合計約為 28 萬", "B": "僅以每月的 API 成本 15 萬加上維護人力 8 萬進行估算", "C": "除各項直接成本外，並一併考量訓練、系統整合與資安合規等支出", "D": "僅以每月的 API 調用成本 15 萬元作為評估的唯一基礎", "ans": "C"}, {"q": "某機構每月需人工翻譯 600 則訊息、每則 50 元；改用 API 每則需 2000 Tokens、Token 成本為每 1000 Tokens 0.8 元，另需一次性系統整合費 20 萬元。下列 ROI 評估何者最為正確？", "A": "每月約可節省 29,040 元，投入成本約需 7 個月即可回收", "B": "每月約可節省 30,000 元，投入成本約需 7 個月即可回收", "C": "每月約可節省 25,000 元，投入成本約需 8 個月即可回收", "D": "每月約可節省 28,040 元，投入成本約需 8 個月即可回收", "ans": "A"}, {"q": "某製造業導入視覺檢測，導入前不良品流出率為 3%、導入後降至 0.4%，導入成本為 800 萬元。在評估其效益時，下列做法何者最為完整？", "A": "僅考量所導入視覺檢測系統其操作介面的整體美觀程度", "B": "僅計算此專案一次性投入的導入成本 800 萬元此一數字", "C": "僅比較導入前後不良率的差異，而不將其換算為金額效益", "D": "綜合評估不良率下降所減少的損失與導入成本，估算回收期", "ans": "D"}, {"q": "某企業導入生成式 AI 客服後，系統整體穩定且吞吐量高，但仍有使用者反映回覆卡頓（已排除網路與前端問題）。若欲針對此現象進行效能測試，下列何者最符合測試重點？", "A": "分析每一次單一互動從送出到回覆之間的反應速度（延遲）", "B": "評估整個系統在長時間連續運作之下的整體穩定程度", "C": "比較模型針對不同問題所生成回覆在語言品質上的差異", "D": "測量整個系統在單位時間之內所能處理的請求總數量", "ans": "A"}, {"q": "某企業導入生成式 AI 助理，在全面部署之前先進行概念驗證（PoC）。下列何者最不適合作為 PoC 階段的主要工作？", "A": "以小範圍的樣本資料測試模型在此任務上的實際效果", "B": "驗證此專案關鍵技術的可行性與其核心價值的假設", "C": "評估此 AI 助理與企業現有作業流程整合的可行性", "D": "進行全公司範圍的大規模正式上線與全面性的推廣", "ans": "D"}, {"q": "某金融服務公司基於內部控制與治理的要求，考慮將 LLM 建置於公司可自行管理的環境中。此考量最直接對應下列何種部署方式的優勢？", "A": "將公司所有的內部資料全部公開上傳至網際網路上", "B": "在部署時完全放棄任何內部控制與治理相關的要求", "C": "地端或私有部署，有助於對資料的掌控與法遵合規", "D": "完全交由不可控的第三方處理，且不做任何的約定", "ans": "C"}, {"q": "某市政府以生成式 AI 進行公文摘要，其中部分文件屬於機密等級（依規定不得離開內部）。依資安規範，最合理的處理方式為何？", "A": "忽略文件的機密等級，一律將所有文件送往外部 API 處理", "B": "將所有屬於機密等級的文件全部刪除，完全不予以處理", "C": "對機密文件採地端或內部可控環境處理，避免資料外流", "D": "將機密文件全部上傳至公開的外部服務進行摘要的處理", "ans": "C"}, {"q": "某企業導入具文件閱讀能力的 LLM 助理，資安團隊發現當模型讀取外部網頁或文件時，可能被其中隱藏的惡意指令所操控。此風險最接近下列何者？", "A": "梯度爆炸，指訓練時梯度值過大導致參數更新發散", "B": "資料去識別化，指移除可識別個人身分的相關資訊", "C": "間接提示詞注入，惡意指令藏於外部內容中操控模型", "D": "模型量化，指以較低數值精度表示參數以降低需求", "ans": "C"}, {"q": "某金融機構對外的 AI 理財問答機器人，於滲透測試中被發現攻擊者可透過精心設計的自然語言輸入繞過系統的限制。此漏洞最接近下列何者？", "A": "梯度消失，指深層網路的梯度在反向傳遞時趨近於零", "B": "提示詞注入，以特製輸入誘使模型繞過限制或改變行為", "C": "One-hot 編碼錯誤，指類別特徵的向量表示產生了偏差", "D": "過擬合，指模型過度記憶訓練資料而在新資料上表現差", "ans": "B"}, {"q": "某電商對外客服 Chatbot 於系統提示中設定只回答訂單與退換貨問題，但使用者輸入特定內容誘使其回答無關的問題。下列何種防護措施最直接相關？", "A": "強化輸入過濾與提示詞注入防護，並限制模型可執行的範圍", "B": "全面停用系統中所有既有的安全防護機制以簡化流程", "C": "透過各種手法增加模型訓練時所使用的資料筆數規模", "D": "調高模型生成時所使用的溫度參數以增加輸出多樣性", "ans": "A"}, {"q": "某物流公司導入生成式 AI 預測交通流量並優化配送路線，每月處理 500 萬筆路況資料。在進行成本效益評估時，下列何者最為完整？", "A": "綜合考量 API、運算、維護、整合等成本與其所帶來的效益", "B": "僅估算此系統為公司所節省下來的燃油費用此一項目", "C": "僅計算此系統每月所產生的 API 調用成本此一項目", "D": "僅考量此系統操作介面在視覺呈現上的整體美觀程度", "ans": "A"}, {"q": "某企業欲導入 AI 知識助理，需求包含：能查詢內部規範、回答須可追溯來源、資料頻繁更新、且需具備即時性。下列何種方案最為合適？", "A": "以 RAG 結合最新內部文件的檢索，並於回覆時提供來源引用", "B": "將所有的內部規範一次性微調寫入模型，之後便不再更新", "C": "改用純影像生成模型來處理這些文字查詢相關的各項需求", "D": "僅使用零樣本提示作答，不串接任何形式的外部知識庫", "ans": "A"}, {"q": "下列關於「生成式 AI 專案導入的效益評估」，何者最為正確？", "A": "宜同時考量直接成本與間接成本，並對照可量化與不可量化效益", "B": "在評估時僅需要考量單一項的 API 調用成本此一項目即可", "C": "在評估時僅需要比較各方案操作介面外觀上的美觀程度", "D": "生成式 AI 的效益完全無法被量化，因此根本不需要評估", "ans": "A"}, {"q": "下列關於「私有部署（On-premise）與雲端部署（Cloud）」取捨的敘述，何者最為正確？", "A": "採用雲端部署的方式在任何情況下都一定不符合合規要求", "B": "採用私有部署一定會比雲端部署更為便宜且完全無需維運", "C": "私有部署與雲端部署這兩者在本質與特性上是完全相同的", "D": "私有部署對資料掌控與合規較有利但成本高，雲端彈性佳需評估外流", "ans": "D"}, {"q": "某企業在評估生成式 AI 導入時，下列何者最能完整描述「總體擁有成本（TCO）」所應涵蓋的範圍？", "A": "TCO 此一概念指的僅是系統運作時所消耗的電費此一項目", "B": "TCO 此一概念與後續的維運及法遵合規之間並沒有關聯", "C": "涵蓋 API 與運算等直接成本，及訓練、整合、維運與合規支出", "D": "TCO 此一概念指的僅是系統首次採購時的一次性費用而已", "ans": "C"}, {"q": "下列何者為 Google 於 Gemini/Veo 所生成影片中，用以標示 AI 生成內容、協助辨識不實資訊風險的技術？", "A": "於影片的開頭與結尾處強制加入一段文字的警語提示", "B": "要求所有生成的影片都須附帶至少 10 秒的免責聲明", "C": "限制每一位使用者每日所能生成影片內容的總次數上限", "D": "以 SynthID 技術在影片的每一幀嵌入不可見的數位浮水印", "ans": "D"}, {"q": "下列何者屬於 OpenAI 為 Sora 所生成內容提供的出處證明（Provenance）機制？", "A": "全面禁止使用者對其所生成的內容進行任何形式的分享", "B": "要求使用者在生成內容之前先以手寫的方式簽署姓名", "C": "限制所有生成出來的影片內容都只能夠是黑白的色彩", "D": "在所生成的資產中內嵌 C2PA（Content Credentials）元數據", "ans": "D"}, {"q": "下列關於「C2PA / Content Credentials」的敘述，何者最為正確？", "A": "在內容中附加可驗證的來源與編輯履歷，協助辨識出處與是否經 AI 生成", "B": "C2PA 此一標準的唯一用途是用來加快內容的生成速度", "C": "C2PA 本質上是一種用於訓練生成模型的訓練演算法", "D": "C2PA 此一標準與內容的來源出處辨識之間並沒有關聯", "ans": "A"}, {"q": "下列關於「數位浮水印（如 SynthID）」在生成式 AI 中用途的敘述，何者最為正確？", "A": "數位浮水印此一技術主要被用於對生成模型進行壓縮", "B": "數位浮水印此一技術與生成內容的辨識之間並沒有關聯", "C": "在生成內容中嵌入浮水印可有效提升模型的預測準確率", "D": "在生成內容中嵌入可偵測的標記，協助辨識是否由 AI 生成", "ans": "D"}, {"q": "某招聘公司以生成式 AI 生成面試問題與評估，過程中發現模型可能對應徵者的性別或年齡產生偏差。下列哪一種策略最能降低此偏差風險？", "A": "檢視並改善訓練與提示資料的代表性，並導入偏誤檢測與緩解", "B": "由於相關的申訴數量不多，因此暫時忽略此偏差不予處理", "C": "僅單純地提高模型的參數量以期能改善其整體的表現", "D": "刻意放大模型既有的偏差程度，以便凸顯群體間的差異", "ans": "A"}, {"q": "下列何者最屬於「偏見檢測（Bias Detection）」而非「偏見緩解（Bias Mitigation）」的措施？", "A": "對訓練資料進行重新採樣，以平衡不同群體間的代表性", "B": "調整模型的機制，以降低其對特定群體所產生的不利結果", "C": "評估模型的輸出在不同群體之間是否存在系統性的差異", "D": "在模型的輸出端加入公平性的約束條件以修正其結果", "ans": "C"}, {"q": "某零售企業導入生成式 AI 推薦系統，測試時發現行為與偏好相同的不同客群仍收到明顯不同的推薦，且難以既有策略解釋。若優先降低模型的偏差風險，下列何者最為合理？", "A": "在推薦時限制系統僅顯示店內銷量最高的那些熱門商品", "B": "提高推薦系統輸出結果的隨機程度以打散原本的推薦", "C": "重新檢視模型訓練資料的樣本分布狀況與整體的代表性", "D": "降低所使用模型的參數規模以簡化其內部的運作機制", "ans": "C"}, {"q": "某企業導入生成式影像 AI 以提升商品圖片的處理效率，並允許以自然語言進行編輯。下列何者最不屬於該類工具的典型功能？", "A": "依使用者的指令，將圖片中特定的元素替換為其他物件", "B": "依圖像內容自動判斷商品的銷售數據並生成分析報表", "C": "依使用者的指令，調整整張影像的光影效果與色彩風格", "D": "依使用者的指令，移除圖片中不需要的物件並修補背景", "ans": "B"}, {"q": "某律師事務所評估導入生成式 AI，下列何者最符合其目前在法律實務中的主要應用？", "A": "自動做出判決建議，並作為法官裁決的依據而直接採用", "B": "預測嫌疑人未來再犯的時間與地點，以供執法機關參考", "C": "在正式的法庭審理過程中，代替律師進行言詞上的答辯", "D": "快速爬梳判例、協助起草合約初稿並標記文件中風險條款", "ans": "D"}, {"q": "下列關於「生成式 AI 於企業導入時的資料隱私考量」，何者最為正確？", "A": "資料隱私此一議題與生成式 AI 的導入之間並沒有關聯", "B": "可以任意地將客戶的個人資料上傳至任何的外部服務中", "C": "應避免將敏感或個資不當送往外部，並落實去識別化與存取控管", "D": "只要所使用的模型能力夠強，就完全無需任何的隱私保護", "ans": "C"}, {"q": "某銀行 AI 理財助理上線後，在部分對話中主動提及特定客戶的資產與交易紀錄，但發問的使用者其實並無查詢該資料的權限。此問題最直接反映下列何者？", "A": "梯度爆炸，指訓練時梯度值過大導致模型參數更新發散", "B": "模型推論速度不足，導致回覆使用者時出現明顯的延遲", "C": "所處理影像的解析度過低，影響了模型的判讀與辨識", "D": "資料存取權限控管不足，導致敏感資訊外洩的相關風險", "ans": "D"}, {"q": "某醫院導入 AI 輔助診斷，當發生誤判引發爭議時，院方與供應商都無法說明模型當初判斷的依據。此案例最主要反映了 AI 的下列何種問題？", "A": "缺乏可解釋性與問責機制，無法說明判斷依據與釐清責任", "B": "模型的推論速度不足，導致無法即時提供診斷的結果", "C": "所需處理的資料量過於龐大，超出系統的可負荷範圍", "D": "系統所提供的操作介面在視覺呈現上不夠美觀好用", "ans": "A"}, {"q": "下列關於「生成式 AI 內容合規與著作權」的考量，何者最為正確？", "A": "著作權此一議題與生成式 AI 的內容產出之間完全無關", "B": "只要內容是由 AI 所生成的，就完全無須考量任何合規", "C": "使用生成內容時應留意訓練資料授權、輸出權利歸屬與侵權風險", "D": "由 AI 所生成的內容一律都不會涉及任何的權利問題", "ans": "C"}, {"q": "下列關於「AI 生成內容標示（Disclosure）」的敘述，何者最為正確？", "A": "AI 生成的內容在任何情況下都一律不需要進行揭露", "B": "在適當情境揭露內容為 AI 生成，有助降低誤導並符合透明", "C": "只要一揭露內容為 AI 生成，該內容就會變得完全無法使用", "D": "內容是否揭露為 AI 生成，與透明性此一原則之間毫無關聯", "ans": "B"}, {"q": "某研究機構開放統計查詢（如平均收入、疾病發生率），為避免攻擊者透過多次查詢反推出特定個體的資料，系統可採用下列何種技術？", "A": "將機構所持有的所有資料全部以公開明文的方式提供出來", "B": "僅單純地提升系統回應每一次統計查詢時的處理速度", "C": "全面停止對外提供任何形式的統計查詢服務以杜絕風險", "D": "差分隱私等在結果中加入受控雜訊以保護個體的機制", "ans": "D"}, {"q": "下列關於「生成式 AI 的資安風險」的敘述，何者最為正確？", "A": "含提示詞注入、資料外洩、惡意內容生成，須以過濾與控管因應", "B": "生成式 AI 此一技術在使用上完全沒有任何的資安風險", "C": "只要在使用時不連上網際網路，就完全不會有任何風險", "D": "生成式 AI 的資安風險其來源僅來自於所使用的硬體", "ans": "A"}, {"q": "下列關於「生成式 AI 產出內容的事實查核」，何者最為正確？", "A": "模型的輸出內容必然完全正確，因此完全無需再進行查核", "B": "內容的事實查核此一工作與模型的幻覺風險之間毫無關聯", "C": "只有影像類的生成模型其產出的內容才需要進行事實查核", "D": "因模型可能產生幻覺，重要用途應搭配人工查核或可追溯來源", "ans": "D"}, {"q": "某企業導入生成式 AI 客服並引用歷史交易資料，法遵部門指出若不當處理顧客個資將有風險。下列何種做法最能降低此風險？", "A": "直接忽略法遵部門所提出的相關意見，並將系統直接上線", "B": "將顧客完整的個人資料毫無限制地提供給所使用的模型", "C": "對個資進行去識別化或存取控管，僅在必要範圍內提供模型", "D": "將所有的歷史交易資料全部刪除，而完全不做任何的處理", "ans": "C"}, {"q": "下列關於「模型輸出安全護欄（Guardrails）」的敘述，何者最為正確？", "A": "透過輸入與輸出的過濾、規則與政策約束，降低不當內容風險", "B": "模型的安全護欄此一機制與內容的安全性之間並沒有關聯", "C": "模型安全護欄此一機制的唯一用途是加快內容的生成速度", "D": "一旦為模型加上安全護欄，就會使其完全無法回覆任何問題", "ans": "A"}, {"q": "下列關於「生成式 AI 於高風險決策（如醫療、金融）應用」的原則，何者最為正確？", "A": "在高風險領域中應用 AI 時完全不需要任何的人工審核", "B": "AI 所做出的決策在任何情況下都一定優於任何專業人員", "C": "應完全由 AI 自動做出最終的決策，且無需任何人員負責", "D": "宜作為輔助工具並保留人工最終判斷與問責，而非完全取代", "ans": "D"}, {"q": "某市政府導入 AI 公文摘要，需同時兼顧處理效率與機密文件不外流。下列規劃何者最為合理？", "A": "為求最快的處理速度，一律將所有文件都送往外部服務", "B": "依文件機密等級分流，機密於內部處理、一般可用外部服務", "C": "一律改回以人工方式處理所有公文，完全不使用任何 AI", "D": "在處理時完全忽略各文件之間機密等級上的實際差異", "ans": "B"}, {"q": "下列關於「AI 生成內容可能被惡意用於製造不實資訊（如 Deepfake）」的因應，何者最為正確？", "A": "僅需持續提高所使用模型的準確率即可完全地解決此問題", "B": "可透過內容出處標示、浮水印與偵測技術，並搭配規範與教育", "C": "此類問題的因應方式與內容的出處標示技術之間毫無關聯", "D": "AI 生成內容被惡意用於製造不實資訊此一風險並不存在", "ans": "B"}, {"q": "下列關於「生成式 AI 導入的責任分配（問責）」，何者最為正確？", "A": "責任的分配與問責此一議題和 AI 的整體治理之間毫無關聯", "B": "所有責任僅由使用者單方面承擔，且事前無需做任何約定", "C": "應明確界定資料、開發、整合與使用等各方責任以利追溯", "D": "當 AI 系統出現問題時，並不需要由任何一方來負起責任", "ans": "C"}, {"q": "下列關於「以生成式 AI 模擬攻擊流量以強化資安偵測」的敘述，何者最為正確？", "A": "此作法與提升系統整體的資安偵測能力之間並沒有關聯", "B": "可產生多樣化的模擬攻擊樣本納入訓練，提升對變種攻擊偵測", "C": "生成式 AI 在任何情況下都無法產生任何的模擬攻擊資料", "D": "以生成式 AI 模擬攻擊流量此一作法對資安完全沒有幫助", "ans": "B"}, {"q": "某企業建立文字生成影片系統，模型依輸入的文字描述生成連續且具時間一致性的影像內容。下列何者最能描述此類生成的特性？", "A": "此系統僅是將既有的多段影片進行剪輯與拼接的處理", "B": "此系統在生成影片時一定完全不需要用到任何的模型", "C": "文字生成影片此一應用與生成式 AI 之間並沒有關聯", "D": "屬生成式模型，需在畫面之間維持時間與內容的一致性", "ans": "D"}, {"q": "某食品公司想生成大量模擬瑕疵影像以擴充訓練資料，並撰寫檢測流程的技術文件，且不打算自行開發模型。下列規劃何者最為合理？", "A": "僅以人工手繪的方式來產生所有需要的模擬瑕疵影像", "B": "直接放棄擴充訓練資料，僅使用現有的少量瑕疵影像", "C": "運用生成式影像模型產生模擬瑕疵影像，並以 LLM 協助寫文件", "D": "僅撰寫檢測流程的技術文件，而完全不產生任何的影像", "ans": "C"}, {"q": "某交通局委託開發公車到站預測系統，開發團隊想導入 AI 程式設計助手（如 GitHub Copilot、Cursor）。下列關於此類工具的敘述何者最為正確？", "A": "此類工具的功能僅限於協助撰寫專案的相關說明文件", "B": "此類工具可完全取代開發者，且其產出無需經過任何審查", "C": "可依情境提供程式碼建議以加速開發，但產出仍需審查與測試", "D": "AI 程式設計助手此一工具與實際的程式開發之間毫無關聯", "ans": "C"}, {"q": "下列關於「生成式 AI 於企業知識管理」的應用，何者最為正確？", "A": "生成式 AI 在知識管理中僅能生成無來源依據的隨機內容", "B": "生成式 AI 在任何情況下都無法整合任何企業內部的文件", "C": "可結合 RAG 讓員工以自然語言查詢內部文件並取得可追溯回覆", "D": "生成式 AI 此一技術與企業的知識管理之間並沒有關聯", "ans": "C"}, {"q": "某企業規劃導入生成式 AI，下列關於「先進行小規模概念驗證（PoC）再擴大」的敘述，何者最為正確？", "A": "所進行的 PoC 必須一次涵蓋全公司的所有作業流程才行", "B": "PoC 此一階段的工作與後續的風險控管之間並沒有關聯", "C": "有助於在有限成本下驗證可行性與價值，降低全面導入風險", "D": "PoC 此一階段是系統進行全面正式上線之後的最後階段", "ans": "C"}, {"q": "下列關於「選擇生成式 AI 模型時的考量」，何者最為正確？", "A": "選擇模型時僅需考量哪一個模型的使用價格為最低者", "B": "選擇模型時僅需挑選參數量規模最大的那一個模型", "C": "模型的選擇與實際要處理任務的需求之間並沒有關聯", "D": "宜綜合考量任務需求、品質、延遲、成本、隱私與合規等因素", "ans": "D"}, {"q": "某企業希望其生成式 AI 的回覆能「即時反映每日更新的促銷資訊」，同時維持一致的風格。下列何種作法最為合適？", "A": "僅使用固定的樣板來回覆，且完全不隨促銷更新內容", "B": "以檢索最新促銷資料（如 RAG）提供即時資訊，並以提示規範風格", "C": "直接放棄回覆須即時反映最新促銷資訊此一項需求", "D": "每當每日促銷更新時，都重新微調一次整個大型模型", "ans": "B"}, {"q": "下列關於「生成式 AI 與傳統鑑別式 AI 在企業應用中的搭配」，何者最為正確？", "A": "生成式與鑑別式這兩者在任何情況下都不可以同時使用", "B": "生成式 AI 在任何情況下都一定能取代所有鑑別式的任務", "C": "鑑別式 AI 本質上完全無法被應用於任何的實務場景中", "D": "可視任務性質搭配，鑑別式適合分類判斷、生成式適合產生內容", "ans": "D"}, {"q": "下列關於「生成式 AI 導入後的持續監控」，何者最為正確？", "A": "導入之後僅需要監控系統操作介面的外觀是否美觀即可", "B": "上線後仍需監控輸出品質、成本、資料漂移與風險並持續優化", "C": "系統的持續監控工作與其輸出的品質之間並沒有關聯", "D": "系統一經上線之後，便完全不再需要進行任何的監控", "ans": "B"}, {"q": "某企業評估以生成式 AI 自動生成大量文字報告，下列何者最能兼顧產出效率與品質風險的控管？", "A": "完全不經任何審核，即直接發布 AI 所生成的報告內容", "B": "以 AI 生成報告初稿，再搭配人工審核與必要的事實查核", "C": "在 AI 生成報告內容之後，僅隨機地抽換其中部分內容", "D": "為徹底避免品質風險，完全放棄使用 AI 來生成報告", "ans": "B"}, {"q": "下列關於「Prompt、RAG 與 Fine-tuning 三種調整方式的選擇」，何者最為正確？", "A": "這三種方式在效果上完全等價，可隨意互換且並無差異", "B": "在調整時一定只能從這三種方式中三選一，不可加以組合", "C": "這三種調整方式與實際要處理任務的需求之間毫無關聯", "D": "頻繁更新知識宜用 RAG、快速調整行為宜用 Prompt、深化領域宜微調", "ans": "D"}, {"q": "下列關於「企業導入生成式 AI 的整體規劃流程」，何者最為正確？", "A": "宜含需求與價值定義、資料合規評估、PoC、部署與上線後監控", "B": "整體的規劃流程與後續的系統維運工作之間並沒有關聯", "C": "在導入時只需要直接購買市面上最昂貴的模型即可完成", "D": "完全不需要進行任何事前的規劃，即可直接全面地上線", "ans": "A"}, {"q": "下列關於「大型語言模型（LLM）」的敘述，何者最為正確？", "A": "以大規模文本訓練、能理解與生成語言，可經提示或微調適配任務", "B": "大型語言模型此類模型本質上僅能夠處理數值型的資料", "C": "大型語言模型此一技術與自然語言處理之間並沒有關聯", "D": "大型語言模型在任何情況下都一定不會產生錯誤的內容", "ans": "A"}, {"q": "下列關於「生成式 AI 與鑑別式 AI」核心差異的敘述，何者最為正確？", "A": "生成式與鑑別式這兩者在本質與運作上是完全相同的", "B": "鑑別式 AI 本質上僅能夠用於生成各種的影像類內容", "C": "生成式著重產生新內容（文字、影像），鑑別式著重判斷分類", "D": "生成式 AI 本質上僅能夠對輸入的資料進行分類的判斷", "ans": "C"}, {"q": "下列關於「模型微調（Fine-tuning）」與「檢索增強（RAG）」在知識更新上比較的敘述，何者最為正確？", "A": "RAG 更新知識僅需更新資料庫，適合頻繁變動，微調更新成本較高", "B": "採用模型微調的方式可以即時反映每一分鐘都在變動的資料", "C": "模型微調與檢索增強這兩者在本質與效果上是完全相同的", "D": "RAG 此一機制本質上完全無法引用任何的外部知識來源", "ans": "A"}, {"q": "下列關於「LLM 的上下文視窗（Context Window）限制」所帶來影響的敘述，何者最為正確？", "A": "模型的上下文視窗其長度可以無限地延長而不受限制", "B": "當輸入加輸出超過上下文上限時，超出的內容無法被完整處理", "C": "上下文視窗的限制並不會影響到模型對長文件的處理", "D": "上下文視窗的限制與輸入所占用的 Token 數量之間無關", "ans": "B"}, {"q": "下列關於「在提示詞中提供範例（Few-shot）」效果的敘述，何者最為正確？", "A": "在提示中提供範例反而會使模型的運作變得完全失效", "B": "所提供的範例數量越多就一定越好，且完全沒有上限的考量", "C": "在提示中是否提供範例與模型最終的輸出品質之間毫無關聯", "D": "適當範例可引導輸出格式與風格，但需具代表性以涵蓋實際情境", "ans": "D"}, {"q": "某企業希望 LLM 在回答時能「先分析再作答」以提升複雜任務的正確率，下列何種提示策略最為直接？", "A": "思維鏈（Chain-of-Thought）提示，引導模型逐步展開推理", "B": "移除提示中的所有指令，僅提供最基本的問題內容給模型", "C": "要求模型完全不進行任何的推理分析而直接輸出其答案", "D": "要求模型將其輸出的內容盡量地縮短到最精簡的程度", "ans": "A"}, {"q": "下列關於「AI Agent 調用外部工具」的敘述，何者最為正確？", "A": "工具的調用反而會使模型變得完全無法生成任何的文字", "B": "透過工具調用可取得即時資訊或執行運算，突破模型內部限制", "C": "AI Agent 在執行任務時一定不能夠使用任何的外部工具", "D": "工具的調用與 AI Agent 最終能否完成任務之間毫無關聯", "ans": "B"}, {"q": "下列關於「Multi-Agent（多代理）系統」的敘述，何者最為正確？", "A": "多個代理彼此之間在協作時完全不需要進行任何的協調", "B": "多代理系統的運作與其中任務的分工之間並沒有關聯", "C": "由多個具不同職責的 Agent 協作完成複雜任務，需處理協調溝通", "D": "所有的任務在任何情況下都僅能夠由單一個 Agent 來運作", "ans": "C"}, {"q": "下列關於「MCP（Model Context Protocol）」在工具整合上價值的敘述，何者最為正確？", "A": "提供標準化介面讓模型連接外部工具與資料源，降低整合複雜度", "B": "MCP 此一協定與模型和外部系統的整合之間並沒有關聯", "C": "MCP 此一協定本質上僅被用於對影像資料進行壓縮處理", "D": "MCP 本質上是一種對傳輸中的資料進行加密的安全協定", "ans": "A"}, {"q": "下列關於「RAG 系統的 Chunking（文件切塊）策略」，何者最為正確？", "A": "在任何情況下都一定要把整份文件當作單一個完整的塊", "B": "文件切塊此一步驟對最終的檢索結果不會有任何的影響", "C": "將長文件切為適當大小片段以提升檢索精準並降低無關干擾", "D": "文件切塊此一步驟的唯一用途是對文件的內容進行加密", "ans": "C"}, {"q": "下列關於「向量相似度檢索」的敘述，何者最為正確？", "A": "此種檢索方式僅能夠以完全相同的字串來進行比對查找", "B": "將查詢與文件轉為向量後，以相似度找出語意最相關的內容", "C": "向量相似度檢索此一技術與所使用的嵌入向量之間毫無關聯", "D": "此種檢索方式無法處理語意相近但字面用詞不同的內容", "ans": "B"}, {"q": "下列關於「生成式 AI 的溫度（Temperature）與 Top-p 等取樣參數」的敘述，何者最為正確？", "A": "可用於調整輸出的隨機性與多樣性，高值偏創意、低值偏穩定", "B": "這些取樣參數的設定與模型輸出內容的多樣性之間毫無關聯", "C": "這些取樣參數僅會影響模型的訓練，而不影響其推論的輸出", "D": "一旦調整了這些取樣參數的數值，模型就會立即停止運作", "ans": "A"}, {"q": "某企業希望降低重複發送冗長提示所帶來的成本與延遲，下列何種技術最直接相關？", "A": "增加所使用模型的網路層數以提升其整體的表達能力", "B": "提示詞快取，將重複的固定提示內容快取以重複使用", "C": "調高模型生成時的溫度參數以增加輸出內容的多樣性", "D": "刪除提示中的所有內容，僅保留使用者最原始的問題", "ans": "B"}, {"q": "下列關於「LLM 的幻覺（Hallucination）緩解」，何者最為正確？", "A": "幻覺的緩解方式與模型回覆是否具備事實依據之間毫無關聯", "B": "可透過 RAG 提供事實依據、要求引用來源以及人工查核來降低", "C": "模型所產生的幻覺在任何情況下都無法以任何方式加以緩解", "D": "只要調高模型生成時的溫度參數即可完全地消除掉幻覺", "ans": "B"}, {"q": "下列關於「AI 程式碼助手（如 Copilot、Cursor）的定位」，何者最為正確？", "A": "此類助手可完全取代開發者，且其產出完全無需任何審查", "B": "輔助開發者提高效率，但產出仍需審查與測試以確保正確安全", "C": "此類助手的功能僅限於協助撰寫專案的相關說明文件", "D": "AI 程式碼助手此一工具與實際的程式開發之間毫無關聯", "ans": "B"}, {"q": "下列關於「Agentic Coding 工具（如 Claude Code）」能力的敘述，何者最為正確？", "A": "此類工具僅能夠提供文字建議，且完全無法操作任何檔案", "B": "此類工具的功能僅限於將一種程式語言翻譯為另一種語言", "C": "Agentic Coding 工具此一技術與實際的開發流程之間毫無關聯", "D": "能讀寫檔案、執行指令並協助完成多步驟開發，通常搭配人工審核", "ans": "D"}, {"q": "下列關於「No-Code/Low-Code 平台的供應商鎖定（Vendor Lock-in）風險」，何者最為正確？", "A": "供應商鎖定的風險與平台所採用的資料格式之間毫無關聯", "B": "若平台採專有格式且缺乏標準匯出與 API，未來遷移將變困難", "C": "無論採用哪一種平台，未來都可以零成本地完成資料的遷移", "D": "採用封閉式架構的平台在任何情況下都完全沒有鎖定風險", "ans": "B"}, {"q": "下列關於「AutoML 的適用情境」，何者最為正確？", "A": "使用 AutoML 前必須先精通各種深度學習框架才能夠使用", "B": "AutoML 所產出的模型在任何情況下都完全無法實務應用", "C": "AutoML 此一工具的適用範圍僅限於單一固定的特定任務", "D": "適合缺乏深度 ML 背景者快速建立與上線模型，降低建模門檻", "ans": "D"}, {"q": "下列關於「Webhook 與輪詢（Polling）的差異」，何者最為正確？", "A": "Webhook 與輪詢這兩種機制在運作原理上是完全相同的", "B": "Webhook 此一機制在運作時需要定期地主動去查詢狀態", "C": "輪詢（Polling）此一機制是由事件所觸發而主動推送的", "D": "Webhook 由事件觸發主動推送，輪詢則需定期主動查詢狀態", "ans": "D"}, {"q": "下列關於「條件分支（Router / Branching）元件」用途的敘述，何者最為正確？", "A": "此元件的唯一用途是將輸入的資料整理為指定的格式", "B": "依條件判斷讓流程走向不同分支，實現有條件的自動化邏輯", "C": "條件分支此一元件與工作流程的控制之間並沒有關聯", "D": "此元件的唯一用途是將輸入的多筆資料進行加總的運算", "ans": "B"}, {"q": "下列關於「生成式 AI 導入的總體擁有成本（TCO）評估」，何者最為正確？", "A": "應涵蓋直接成本（API、運算）與間接成本（整合、維運、合規、訓練）", "B": "TCO 的評估在計算時僅需要計入系統運作所消耗的電費即可", "C": "TCO 此一評估概念與後續的維運及法遵合規之間並沒有關聯", "D": "TCO 的評估在計算時僅需要計入系統首次採購的一次性費用", "ans": "A"}, {"q": "下列關於「生成式 AI 導入的投資報酬率（ROI）評估」，何者最為正確？", "A": "ROI 的評估僅需要衡量模型在訓練階段所需的處理速度", "B": "以導入帶來的效益相對投入成本，估算其回收期與整體報酬", "C": "ROI 的評估僅需要衡量系統操作介面在視覺上的美觀程度", "D": "ROI 此一評估概念與導入 AI 所帶來的實際效益之間毫無關聯", "ans": "B"}, {"q": "下列關於「私有／地端部署 LLM 的主要考量」，何者最為正確？", "A": "私有部署在任何情況下都一定比雲端便宜且完全無需維運", "B": "私有部署此一方式與企業對資料的掌控之間並沒有關聯", "C": "採用私有部署的方式在任何情況下都無法符合合規的要求", "D": "有利於資料掌控與合規，但需承擔較高的硬體與維運成本", "ans": "D"}, {"q": "下列關於「生成式 AI 的提示詞注入（Prompt Injection）防護」，何者最為正確？", "A": "可透過輸入過濾、限制模型可執行範圍、隔離不可信內容降低風險", "B": "提示詞注入此一風險在目前並沒有任何可行的防護方式", "C": "提示詞注入的防護工作與系統的整體安全性之間毫無關聯", "D": "只要調高模型生成時的溫度參數即可防護提示詞注入攻擊", "ans": "A"}, {"q": "下列關於「間接提示詞注入（Indirect Prompt Injection）」的敘述，何者最為正確？", "A": "間接提示詞注入此一風險僅來自於使用者所直接輸入的內容", "B": "間接提示詞注入此一風險與模型所讀取的外部內容之間毫無關聯", "C": "惡意指令隱藏於模型讀取的外部內容中，誘使其執行非預期行為", "D": "間接提示詞注入此一情況在實務上並不存在任何實質的風險", "ans": "C"}, {"q": "下列關於「SynthID 等 AI 內容浮水印」的敘述，何者最為正確？", "A": "AI 內容浮水印此一技術主要被用於加快內容的生成速度", "B": "在內容中嵌入浮水印可有效地提升生成模型的預測準確率", "C": "AI 內容浮水印此一技術與生成內容的辨識之間並沒有關聯", "D": "在生成內容中嵌入可偵測標記，協助辨識內容是否由 AI 生成", "ans": "D"}, {"q": "下列關於「C2PA / Content Credentials」用途的敘述，何者最為正確？", "A": "記錄內容的來源與編輯履歷，協助驗證真偽與是否經 AI 生成", "B": "C2PA 此一標準與內容的來源出處辨識之間並沒有任何關聯", "C": "C2PA 本質上是一種用於生成內容的深度學習模型架構", "D": "C2PA 此一標準的唯一用途是用來對影片檔案進行壓縮", "ans": "A"}, {"q": "下列關於「生成式 AI 的偏誤（Bias）風險」，何者最為正確？", "A": "生成式 AI 此一技術在任何情況下都一定不會有任何偏誤", "B": "生成式 AI 的偏誤與其訓練資料的代表性之間並沒有關聯", "C": "生成式 AI 所帶有的偏誤對其最終的決策結果毫無影響", "D": "訓練或提示資料若缺代表性，輸出可能對特定群體不利需緩解", "ans": "D"}, {"q": "下列關於「生成式影像 AI 工具的典型功能」，何者最為正確？", "A": "生成式影像 AI 工具本質上僅能夠生成黑白的線稿圖像", "B": "生成式影像 AI 此一工具與各種的影像編輯之間毫無關聯", "C": "生成式影像 AI 工具可依所輸入的影像自動得知財務報表", "D": "可依自然語言指令進行物件移除、背景修補、風格轉換等編輯", "ans": "D"}, {"q": "下列關於「生成式 AI 於法律實務的應用邊界」，何者最為正確？", "A": "適合輔助檢索判例、起草初稿與標記風險，但不宜取代裁決或庭辯", "B": "生成式 AI 此一技術與法律實務的各項輔助工作之間毫無關聯", "C": "生成式 AI 所產出的內容可以直接作為法官裁決案件的依據", "D": "生成式 AI 可以在正式的法庭審理過程中完全取代律師答辯", "ans": "A"}, {"q": "下列關於「差分隱私（Differential Privacy）」用途的敘述，何者最為正確？", "A": "差分隱私此一技術與個體的隱私保護之間並沒有任何關聯", "B": "透過加入受控雜訊，使查詢或發布結果難以推斷特定個體資訊", "C": "差分隱私此一技術主要被用於對模型的權重參數進行加密", "D": "在資料中加入差分隱私機制可有效地提升模型的生成速度", "ans": "B"}, {"q": "下列關於「生成式 AI 內容的事實查核」，何者最為正確？", "A": "模 <script>
/* ================= APP LOGIC ================= */
(function(){
  "use strict";
  const HKEY = "ipas_ai_quiz_history_v1";
  const QCOUNT = 50;

  const SUBJ_LABEL = {ai:"人工智慧基礎概論", gen:"生成式 AI 應用與規劃"};
  const SRC_LABEL  = {orig:"115年考古題", new:"新題庫"};

  // Map source+subject -> array of bank keys to merge
  function poolKeys(src, subj){
    if(src==="orig") return subj==="ai" ? ["orig_ai_1","orig_ai_2"] : ["orig_gen_1","orig_gen_2"];
    return subj==="ai" ? ["new_ai"] : ["new_gen"];
  }
  function buildPool(src, subj){
    let out=[];
    poolKeys(src,subj).forEach(k=>{ if(BANKS[k]) out=out.concat(BANKS[k].rows); });
    return out;
  }

  // ---- storage helpers (graceful fallback if unavailable) ----
  let memHist=null;
  function loadHist(){
    try{ const r=localStorage.getItem(HKEY); return r?JSON.parse(r):[]; }
    catch(e){ return memHist||[]; }
  }
  function saveHist(h){
    try{ localStorage.setItem(HKEY, JSON.stringify(h)); }
    catch(e){ memHist=h; }
  }

  // ---- state ----
  let quiz=null; // {questions:[], answers:[], idx, src, subj}

  const $=id=>document.getElementById(id);
  const views={setup:$("view-setup"),quiz:$("view-quiz"),result:$("view-result")};
  function show(v){ Object.keys(views).forEach(k=>views[k].classList.toggle("hidden",k!==v)); window.scrollTo(0,0); }

  function getRadio(name){ const el=document.querySelector(`input[name="${name}"]:checked`); return el?el.value:null; }

  // highlight selected .opt in setup
  document.querySelectorAll('#src-opts .opt, #subj-opts .opt').forEach(opt=>{
    opt.addEventListener('click',()=>{
      const group=opt.parentElement;
      group.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');
      setTimeout(refreshPoolNote,0);
    });
  });

  function refreshPoolNote(){
    const src=getRadio("src"), subj=getRadio("subj");
    const pool=buildPool(src,subj);
    const note=$("pool-note");
    if(pool.length<QCOUNT_MIN()){
      note.textContent=`此範圍僅有 ${pool.length} 題，將全部納入本回測驗。`;
      note.classList.remove("hidden");
    } else { note.classList.add("hidden"); }
  }
  function QCOUNT_MIN(){ return QCOUNT; }

  // shuffle
  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

  function startQuiz(){
    const src=getRadio("src"), subj=getRadio("subj");
    const pool=buildPool(src,subj);
    const n=Math.min(QCOUNT, pool.length);
    const qs=shuffle(pool).slice(0,n);
    quiz={questions:qs, answers:new Array(qs.length).fill(null), idx:0, src, subj};
    $("quiz-meta").innerHTML=`<span class="tag">${SRC_LABEL[src]}</span> <span class="tag">${SUBJ_LABEL[subj]}</span>`;
    show("quiz");
    renderQuestion();
  }

  function renderQuestion(){
    const {questions,answers,idx}=quiz;
    const q=questions[idx];
    const total=questions.length;
    $("pfill").style.width=((idx+1)/total*100)+"%";
    $("ptxt").textContent=`${idx+1} / ${total}`;
    const labels=["A","B","C","D"];
    const optsHtml=labels.map(L=>{
      const sel=answers[idx]===L?"selected":"";
      const checked=answers[idx]===L?"checked":"";
      return `<label class="opt ${sel}" data-lab="${L}">
        <input type="radio" name="choice" value="${L}" ${checked}>
        <span class="opt-text"><b style="font-family:var(--mono);margin-right:8px;color:var(--accent-deep)">${L}</b>${esc(q[L])}</span>
      </label>`;
    }).join("");
    $("quiz-body").innerHTML=`
      <div class="qnum"><span>第 ${idx+1} 題 / 共 ${total} 題</span><span>${answeredCount()} 題已作答</span></div>
      <div class="qtext">${esc(q.q)}</div>
      <div class="opts">${optsHtml}</div>`;
    // bind
    $("quiz-body").querySelectorAll(".opt").forEach(opt=>{
      opt.addEventListener("click",()=>{
        const L=opt.getAttribute("data-lab");
        quiz.answers[idx]=L;
        $("quiz-body").querySelectorAll(".opt").forEach(o=>o.classList.remove("selected"));
        opt.classList.add("selected");
        opt.querySelector("input").checked=true;
        $(".qnum"); // noop
        const c=$("quiz-body").querySelector(".qnum span:last-child");
        if(c) c.textContent=answeredCount()+" 題已作答";
      });
    });
    $("prev-btn").disabled = idx===0;
    $("next-btn").textContent = idx===total-1 ? "交卷計分 ✓" : "下一題 →";
  }
  function answeredCount(){ return quiz.answers.filter(a=>a!==null).length; }

  function nextQ(){
    if(quiz.idx===quiz.questions.length-1){ finish(); return; }
    quiz.idx++; renderQuestion();
  }
  function prevQ(){ if(quiz.idx>0){quiz.idx--; renderQuestion();} }

  function finish(){
    const {questions,answers,src,subj}=quiz;
    let correct=0;
    questions.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
    const total=questions.length;
    const score=Math.round(correct/total*100);

    // record
    const rec={date:new Date().toISOString(), src, subj, correct, total, score};
    const h=loadHist(); h.unshift(rec); saveHist(h);

    // render result
    $("score-big").textContent=score;
    $("ring").style.setProperty("--pct",score);
    const pass=score>=60;
    $("result-title").textContent = pass?"成績單 · 及格 🎉":"成績單";
    $("score-meta").innerHTML=`答對 <b>${correct}</b> / ${total} 題　·　<span class="tag">${SRC_LABEL[src]}</span> <span class="tag">${SUBJ_LABEL[subj]}</span><br>
      <span style="color:${pass?'var(--correct)':'var(--wrong)'};font-weight:700">${pass?'已達 60 分及格標準':'未達 60 分，再接再厲'}</span>`;

    // review
    const rev=questions.map((q,i)=>{
      const user=answers[i];
      const labels=["A","B","C","D"];
      const ok=user===q.ans;
      const opts=labels.map(L=>{
        let cls="review-opt";
        if(L===q.ans) cls+=" is-correct";
        else if(L===user) cls+=" is-wrong";
        return `<div class="${cls}"><span class="lab">${L}</span>${esc(q[L])}</div>`;
      }).join("");
      return `<div class="review-item">
        <div class="review-q">第 ${i+1} 題　${esc(q.q)}
          <span class="verdict ${ok?'ok':'no'}">${ok?'答對':(user?'答錯':'未作答')}</span></div>
        ${opts}
      </div>`;
    }).join("");
    $("review-box").innerHTML=rev;
    show("result");
    renderHistory();
  }

  function renderHistory(){
    const h=loadHist();
    const box=$("history-box");
    if(!h.length){ box.innerHTML=`<div class="empty">尚無測驗紀錄，完成一回測驗後將顯示於此。</div>`; return; }
    const rows=h.slice(0,30).map(r=>{
      const d=new Date(r.date);
      const ds=`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      const color=r.score>=60?'var(--correct)':'var(--wrong)';
      return `<tr>
        <td>${ds}</td>
        <td><span class="pill">${SRC_LABEL[r.src]||r.src}</span></td>
        <td>${SUBJ_LABEL[r.subj]||r.subj}</td>
        <td class="score" style="color:${color}">${r.score}</td>
        <td style="color:var(--ink-soft)">${r.correct}/${r.total}</td>
      </tr>`;
    }).join("");
    box.innerHTML=`<table class="hist"><thead><tr>
      <th>日期時間</th><th>來源</th><th>科目</th><th>分數</th><th>答對</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
  }

  function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // ---- wire up ----
  $("start-btn").addEventListener("click",startQuiz);
  $("next-btn").addEventListener("click",nextQ);
  $("prev-btn").addEventListener("click",prevQ);
  $("abort-btn").addEventListener("click",()=>{ if(confirm("確定放棄本回測驗？本回成績不會被記錄。")){ show("setup"); renderHistory(); } });
  $("again-btn").addEventListener("click",startQuiz);
  $("home-btn").addEventListener("click",()=>{ show("setup"); renderHistory(); });
  $("clear-hist").addEventListener("click",()=>{ if(confirm("確定清除所有測驗紀錄？此動作無法復原。")){ saveHist([]); renderHistory(); } });

  // total count
  let totalQ=0; Object.keys(BANKS).forEach(k=>totalQ+=BANKS[k].rows.length);
  $("total-count").textContent=totalQ;

  refreshPoolNote();
  renderHistory();
  show("setup");
})();
</script>
</body>
</html>
