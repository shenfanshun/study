</style></head><body><main><header><div class="eyebrow">MARKETING / CHAPTER 04</div><h1>Ch4 行銷資訊與研究・進階練習</h1><p class="muted">從問題界定到研究判讀，練習選擇適切的方法與證據。</p></header><div id="storageNotice" class="notice hidden" role="status"></div><div id="app"></div><footer>依據《行銷-Ch4 行銷資訊與研究 摘要》編製，延伸基礎觀念與虛構情境。本題庫為理解練習，非官方考古題。<br>成績保存在目前瀏覽器，不會跨裝置同步；清除瀏覽器資料、使用無痕模式或搬移檔案可能影響紀錄。建議定期匯出備份。本章成績與其他章節分開保存；備份請於相同章節及版本匯入。</footer></main>
<script>
'use strict';
const BANK=[{"id": 1, "kind": "基礎", "topic": "資料與資訊", "q": "判斷某資料對「本次研究」屬初級或次級，主要依據為何？", "options": ["是否專為本次研究目的而蒐集", "是否已發表於公開網路平台", "是否已轉換成可計算的數字", "是否由企業自己的員工持有"], "answer": 0, "explain": "初級與次級要相對本次研究目的判斷。自行保管的舊資料也可屬次級，委託他人為本次蒐集的則可屬初級。"}, {"id": 2, "kind": "基礎", "topic": "資料與資訊", "q": "關於資料與資訊的關係，何者較適當？", "options": ["資料只能來自內部，資訊只能來自外部來源", "經過分析的資訊，就不必再檢查來源與適用性", "紀錄只要存入電腦，就會自動具有決策意義", "原始紀錄經有系統整理分析，可形成決策資訊"], "answer": 3, "explain": "資訊是處理與組織後有意義的結果；數位化不等於分析完成，仍需檢查正確性及決策相關性。"}, {"id": 3, "kind": "基礎", "topic": "資訊系統", "q": "行銷資訊系統與一次性專案研究的主要差異為何？", "options": ["前者有持續運作安排，後者針對特定問題展開", "前者只儲存原始資料，後者只處理外部資料", "前者不需要人員參與，後者必須由顧問負責", "前者不受決策目的影響，後者不受成本限制"], "answer": 0, "explain": "行銷資訊系統包含人員、設備與程序，持續提供資訊；專案研究可成為這套安排中的一環。"}, {"id": 4, "kind": "基礎", "topic": "資訊系統", "q": "決策支援系統中的「模式庫」主要負責何者？", "options": ["提供分析方案所需的模型與計算方法", "保存各筆顧客及訂單的原始紀錄", "呈現輸入欄位及選單的互動畫面", "決定企業所有部門的人員任免權限"], "answer": 0, "explain": "資料庫管理資料，模式庫提供分析計算方法，對談系統是使用者互動介面，三者功能不同。"}, {"id": 5, "kind": "基礎", "topic": "資訊系統", "q": "選擇提供給決策者的資訊時，哪項原則較適當？", "options": ["以總資料筆數為準，盡量不刪任何欄位", "以取得速度為準，暫不追究定義差異", "與問題相關，並兼顧及時性與正確性", "以報表版面為準，沿用歷年相同內容"], "answer": 2, "explain": "資訊的價值取決於是否能支持當前決策，不是越多、越快或版面越固定就越好。"}, {"id": 6, "kind": "基礎", "topic": "研究類型", "q": "區分探索性與描述性研究，哪項較適當？", "options": ["前者只處理新產品，後者只處理既有顧客", "前者釐清問題線索，後者呈現現況與分布", "前者估計母體比例，後者驗證控制下的效果", "前者須有隨機實驗，後者須有開放式訪談"], "answer": 1, "explain": "研究類型取決於目的，而非產品新舊或固定工具；探索偏釐清，描述偏呈現已界定現象。"}, {"id": 7, "kind": "基礎", "topic": "研究類型", "q": "若要支持「某因素造成結果改變」，研究設計最應補強何者？", "options": ["只保留與研究者原先推測一致的回答", "有計畫改變該因素並處理其他因素干擾", "增加同一份問卷的題數與填答欄位", "讓結果以更多種顏色及圖表方式呈現"], "answer": 1, "explain": "因果性研究需處理替代解釋，實驗的操弄與控制可增強因果判斷；相關本身不足以證明因果。"}, {"id": 8, "kind": "基礎", "topic": "研究流程", "q": "在選擇調查工具之前，最應先釐清何者？", "options": ["準備採用的圖表色彩與字體大小", "目前最容易招募到哪一批填答者", "資料檔案最後要存放在哪一個資料夾", "要支援的決策及需要回答的研究問題"], "answer": 3, "explain": "先界定問題與目的，才有依據選擇設計、對象及工具，避免工具便利性反過來決定研究方向。"}, {"id": 9, "kind": "基礎", "topic": "研究流程", "q": "關於研究假設，哪項理解較適當？", "options": ["它只能來自管理者直覺，不能借助理論與既有資料", "它是可供檢查的推測，並非每項研究都先有明確假設", "它是研究完成的結論，可在蒐集之前直接定稿", "它一經提出便應維持原案，不宜接受相反證據"], "answer": 1, "explain": "假設可源自理論、過往研究及合理推論；探索早期也可能先尋線索，並非一律先訂明確假設。"}, {"id": 10, "kind": "基礎", "topic": "蒐集方法", "q": "定性與定量研究最適當的區別為何？", "options": ["前者不需規劃研究設計，後者不需解釋結果", "前者偏理解意義與脈絡，後者偏量測數量與分布", "前者只使用文字資料，後者不需要研究問題", "前者樣本必然具代表性，後者樣本必然不具代表性"], "answer": 1, "explain": "兩者按目的與資料處理方式區分，可互相補充；任何一種都需適當設計，樣本代表性也需另外判斷。"}, {"id": 11, "kind": "基礎", "topic": "蒐集方法", "q": "焦點群體與深度訪談的主要差異為何？", "options": ["前者能直接推估人口比例，後者能直接確定因果", "前者運用小群互動，後者以個別追問深入了解", "前者須填封閉問卷，後者須做等距抽樣", "前者只測產品口味，後者只研究價格敏感度"], "answer": 1, "explain": "小群討論可觀察互動與不同觀點，個別訪談較能依個人脈絡追問；兩者都不直接保證比例或因果推論。"}, {"id": 12, "kind": "基礎", "topic": "測量品質", "q": "信度與效度的區別，何者較適當？", "options": ["信度關注結果一致穩定，效度關注是否測到所需概念", "信度關注經費控制，效度關注調查委外比例", "信度關注報表格式，效度關注問卷題目數量", "信度關注樣本多寡，效度關注填答速度快慢"], "answer": 0, "explain": "穩定不代表測得正確概念；一個工具可能反覆得到相近結果，卻始終偏離真正想測的內容。"}, {"id": 13, "kind": "基礎", "topic": "抽樣設計", "q": "分層抽樣與配額抽樣最主要的差別為何？", "options": ["研究是否事先決定預計招募的人數", "研究是否先區分不同的顧客群體", "各組內是否依機率方式選取個別樣本", "研究是否最後整理各組的回答比例"], "answer": 2, "explain": "兩者均可能先分組並設定人數；關鍵是分層的組內機率選取，與配額常採非隨機招募的差別。"}, {"id": 14, "kind": "基礎", "topic": "抽樣設計", "q": "分層抽樣與單階段集群抽樣的差異，何者較適當？", "options": ["前者依受訪者介紹，後者依研究者主觀挑選", "前者只調查一個群，後者必須調查所有群", "前者各層抽部分個體，後者抽部分群並調查群內個體", "前者不需要定義母體，後者不需要任何抽取程序"], "answer": 2, "explain": "分層意在涵蓋各層；單階段集群則先抽一些群，再調查所選群的全部個體。本題已限定單階段，避免與多階段設計混淆。"}, {"id": 15, "kind": "基礎", "topic": "研究誤差", "q": "抽樣誤差與非抽樣誤差的關係，哪項較適當？", "options": ["只要樣本大於原先規劃，便可不檢查拒答情形", "名單越容易取得，就越不必確認其涵蓋對象", "只要抽取程序隨機，所有類型誤差都會消失", "名單涵蓋與測量問題，不能單靠增加樣本數解決"], "answer": 3, "explain": "增加機率樣本可降低抽樣變動，但名單漏列、題目誤解及選擇性未回覆需分別處理。"}, {"id": 16, "kind": "應用", "topic": "資料與資訊", "q": "企業為本次新包裝研究，委託顧問重新招募顧客並訪談。對本次研究而言，訪談紀錄屬何者？", "options": ["初級資料", "次級資料", "分析模型", "研究假設"], "answer": 0, "explain": "是否初級取決於蒐集目的，不是由企業員工還是外部顧問執行；此處專為本研究蒐集。"}, {"id": 17, "kind": "應用", "topic": "資料與資訊", "q": "店家想評估今年調整營業時間，先使用去年為日常結帳而保存的交易紀錄。對這次研究而言屬何者？", "options": ["初級資料", "抽樣誤差", "研究假設", "次級資料"], "answer": 3, "explain": "原資料為其他目的而存在，本次拿來再利用，屬次級資料；不是企業自己擁有就一定是初級。"}, {"id": 18, "kind": "應用", "topic": "資料與資訊", "q": "研究者找到三年前的全國消費報告，但本次要決定某地區新客群的服務。使用前最應檢查什麼？", "options": ["報告封面是否採用企業習慣的設計", "報告能否直接轉存為更多檔案格式", "期間、地區及對象是否符合本次問題", "報告頁數是否多於研究計畫書頁數"], "answer": 2, "explain": "次級資料可節省資源，但時效、對象、定義及原蒐集方法可能不適配，須先確認用途。"}, {"id": 19, "kind": "應用", "topic": "資訊系統", "q": "每日固定彙整各店銷量與退貨，並在異常時通知主管。依摘要的功能區分，最接近何者？", "options": ["一次性抽樣實驗", "行銷研究系統", "行銷決策支援系統", "行銷監控系統"], "answer": 3, "explain": "重點是持續追蹤及發現變化，未描述針對問題深入蒐集或比較方案的試算。"}, {"id": 20, "kind": "應用", "topic": "資訊系統", "q": "報表發現下午來客下降後，公司特別訪問流失顧客以釐清原因。此環節最接近何者？", "options": ["例行訂單保存程序", "行銷監控系統", "行銷決策支援系統", "行銷研究系統"], "answer": 3, "explain": "針對特定問題有目的地蒐集及分析，是行銷研究功能；並非只是持續觀看報表。"}, {"id": 21, "kind": "應用", "topic": "資訊系統", "q": "店長輸入不同折扣及預估來客數，比較各方案毛利與損耗。此環節最接近何者？", "options": ["原始交易登錄程序", "顧客深度訪談程序", "行銷監控系統", "行銷決策支援系統"], "answer": 3, "explain": "藉資料與模型試算、比較方案是決策支援；它協助判斷，不代表預估一定實現。"}, {"id": 22, "kind": "應用", "topic": "資訊系統", "q": "某系統已能保存銷售資料，也有收益計算公式，但店長難以輸入條件及理解輸出。優先改善何者？", "options": ["抽樣名單", "資料庫", "模式庫", "對談系統"], "answer": 3, "explain": "瓶頸在使用者操作與理解的互動介面；不是缺乏資料儲存或計算方法。"}, {"id": 23, "kind": "應用", "topic": "資訊系統", "q": "店家新增外送服務，仍只提供門市銷售，主管無法比較通路淨收益。最適當的調整為何？", "options": ["只更換資料庫名稱，維持原蒐集範圍", "只提高門市報表更新頻率，維持原欄位", "納入平台費用、配送與通路收入等資料", "只新增全店營收合計，停止區分通路"], "answer": 2, "explain": "系統須隨決策及業務變化調整，廣泛與彈性不只是增加原有資料更新速度。"}, {"id": 24, "kind": "應用", "topic": "資訊系統", "q": "試算顯示降價可能增利，但假設的新增來客數尚未驗證。最適當的解讀為何？", "options": ["結果已由模型計算，可以取代後續觀察工作", "結果只要與主管預期相符，就不需再作查核", "結果有條件成立，應檢查假設並追蹤實施成效", "結果已產生確切數字，代表來客假設已獲證明"], "answer": 2, "explain": "模型輸出依賴輸入假設，數字精確不等於假設正確；可試辦並回到監控與研究。"}, {"id": 25, "kind": "應用", "topic": "研究類型", "q": "新服務詢問度低，團隊還不清楚顧客如何理解它，先訪談不同對象尋找可能障礙。主要屬何者？", "options": ["因果性研究", "實地實驗研究", "探索性研究", "描述性研究"], "answer": 2, "explain": "目的尚在釐清問題及尋找線索，不是估計已定義指標的分布，也尚未操弄因素驗證效果。"}, {"id": 26, "kind": "應用", "topic": "研究類型", "q": "團隊已界定服務對象，想估計各年齡層使用頻率及偏好方案的比例。主要屬何者？", "options": ["探索性研究", "因果性研究", "描述性研究", "實驗室實驗研究"], "answer": 2, "explain": "研究目的在呈現頻率、分布與群體差異，無需因為用了問卷就推定能確認因果。"}, {"id": 27, "kind": "應用", "topic": "研究類型", "q": "發現加入會員者購買更多，便認定入會使每人消費增加。最需要注意什麼？", "options": ["改用平均消費呈現，便可直接確認入會效果", "資料只要來自交易紀錄，就能保證推論因果", "會員人數只要足夠，便可排除所有自選差異", "本來常購買的人可能更願意加入，仍有其他解釋"], "answer": 3, "explain": "群體的自我選擇可能造成關聯；需要更適當設計處理既有差異及其他因素。"}, {"id": 28, "kind": "應用", "topic": "研究設計", "q": "兩組相近顧客隨機分派看不同促銷訊息，其他條件盡量相同，再比較下單率。主要目的是？", "options": ["檢驗訊息改變對購買的影響", "估計全部顧客的年齡分布", "尋找受訪者招募的人際網路", "彙整過去各通路的原始訂單"], "answer": 0, "explain": "有計畫改變訊息並比較結果，配合隨機分派及控制，可增強效果的因果判斷。"}, {"id": 29, "kind": "應用", "topic": "研究設計", "q": "一店在節日前換新包裝且大幅折扣，銷量隨後增加。若要判定包裝效果，最大限制為何？", "options": ["前後都有銷售紀錄，因此不能研究", "多項條件同時變動，無法單獨歸因", "門市是真實情境，因此沒有研究價值", "包裝是有形商品，因此不能作比較"], "answer": 1, "explain": "節日、折扣與包裝一起改變，構成替代解釋；真實情境仍可研究，但需更妥善的比較設計。"}, {"id": 30, "kind": "應用", "topic": "研究設計", "q": "研究者在實際營業門市隨機安排兩種陳列，記錄真實顧客購買，其他促銷維持一致。依場域屬何者？", "options": ["非參與自然觀察", "實地實驗", "單純問卷調查", "實驗室實驗"], "answer": 1, "explain": "在真實營業環境中主動安排變動，屬實地實驗；不是只旁觀原本存在的自然行為。"}, {"id": 31, "kind": "應用", "topic": "研究設計", "q": "研究者在模擬商店內控制燈光與商品位置，安排受測者完成購物任務。依場域屬何者？", "options": ["實驗室實驗", "焦點群體討論", "現成資料分析", "實地實驗"], "answer": 0, "explain": "模擬、可控制的非真實營業場域較符合實驗室實驗；結果能否推廣至真實市場還需評估。"}, {"id": 32, "kind": "應用", "topic": "蒐集方法", "q": "店家想知道顧客在哪個貨架停留，選擇記錄行走與停留行為而不提問。最需留意哪項限制？", "options": ["停留時間足夠長，就能確認顧客最喜歡該商品", "行為可見，背後動機仍未必能由紀錄得知", "研究者沒有參與購買，便可推論全部顧客想法", "沒有口頭回答，紀錄就不可能發生錯誤"], "answer": 1, "explain": "觀察能捕捉行為，但對原因、態度與無法觀察的情境有限；也仍有編碼與觀察誤差。"}, {"id": 33, "kind": "應用", "topic": "蒐集方法", "q": "品牌找六位顧客共同討論包裝，觀察彼此回應與意見碰撞。主要使用何者？", "options": ["深度訪談法", "系統抽樣法", "焦點群體法", "實驗研究法"], "answer": 2, "explain": "小群體圍繞主題互動討論是焦點群體；人數較少不代表可直接推估母體比例。"}, {"id": 34, "kind": "應用", "topic": "蒐集方法", "q": "研究者希望了解受訪者不願在別人面前談的購買經驗，安排個別訪談並逐步追問。最適合何者？", "options": ["焦點群體法", "深度訪談法", "非參與行為觀察", "封閉式網路普查"], "answer": 1, "explain": "個別深入追問較能處理個人脈絡及敏感內容；仍需適當訪談與資料解釋。"}, {"id": 35, "kind": "應用", "topic": "蒐集方法", "q": "研究者不直接問本人態度，而請其接續「小林買這款商品後，朋友可能會……」的故事。主要使用何者？", "options": ["隱喻分析法", "結構式封閉調查", "控制組比較實驗", "投射技術法"], "answer": 3, "explain": "借第三人或未完成故事間接表達屬投射；未要求以一事物比擬感受，故不以隱喻為主。"}, {"id": 36, "kind": "應用", "topic": "蒐集方法", "q": "受訪者選一張「避風港」圖片，並解釋它如何代表使用產品的安心感。依摘要最貼近何者？", "options": ["隱喻分析法", "第三人故事投射法", "結構式比例調查", "非參與行為觀察"], "answer": 0, "explain": "明確用一事物比擬另一感受，符合摘要的隱喻分析；有圖片不代表各方法可完全互換。"}, {"id": 37, "kind": "應用", "topic": "問卷設計", "q": "問卷寫「你是否同意本店服務快速且價格合理？」只提供一個同意程度。主要問題為何？", "options": ["題目沒有填答姓名，因此不能測量意見", "同題含兩個評估面向，回答意義難以辨別", "題目採用程度選項，因此無法作任何分析", "題目涉及服務內容，因此只能用現場觀察"], "answer": 1, "explain": "速度與價格可能得到相反評價，合在同一題會使回答難解，宜拆開測量。"}, {"id": 38, "kind": "應用", "topic": "問卷設計", "q": "問卷尚不知道顧客抱怨的類型，希望先讓其自由描述，再整理分類。最適合先採何者？", "options": ["固定單選題目", "固定排序題目", "開放式題目", "同意程度量表"], "answer": 2, "explain": "先以開放回答捕捉未知內容，之後可編碼；固定選項可能漏掉未預見的原因。"}, {"id": 39, "kind": "應用", "topic": "測量品質", "q": "同一工具反覆測出相近結果，但題目其實測到熟悉度而非原訂的滿意度。較合理的判斷為何？", "options": ["只要增加重測次數，便可改正概念選擇", "結果既然穩定，就足以確認測量方向正確", "結果可能穩定，但概念適切性仍有問題", "只要改成較大的樣本，就能測到原訂概念"], "answer": 2, "explain": "這是信度可能較好但效度不足的例子；穩定地測錯概念仍不能回答研究問題。"}, {"id": 40, "kind": "應用", "topic": "抽樣設計", "q": "公司有完整會員名冊，以亂數從中抽取個人，讓每人有相同被抽中的機會。最符合何者？", "options": ["雪球抽樣", "單純隨機抽樣", "便利抽樣", "判斷抽樣"], "answer": 1, "explain": "對完整名冊中的個體直接作等機會亂數選取，符合單純隨機；與方便招募或人際轉介不同。"}, {"id": 41, "kind": "應用", "topic": "抽樣設計", "q": "研究者先依年齡分組，再於每一組名冊中用亂數選取受訪者。最符合何者？", "options": ["分層抽樣", "便利抽樣", "配額抽樣", "集群抽樣"], "answer": 0, "explain": "題目同時具分組與各組內機率選取；不能只因各組有人數目標就判成配額。"}, {"id": 42, "kind": "應用", "topic": "抽樣設計", "q": "研究者將門市視為群，用亂數抽出部分門市，調查這些門市全部符合條件的員工。最符合何者？", "options": ["雪球抽樣", "便利抽樣", "單階段集群抽樣", "分層抽樣"], "answer": 2, "explain": "抽取的是部分群，之後調查選中群的全部個體，符合單階段集群；不是每個群都各抽一些。"}, {"id": 43, "kind": "應用", "topic": "抽樣設計", "q": "完整名冊排序後，先在前十人中隨機決定起點，此後每隔十人抽一位。最符合何者？", "options": ["系統抽樣", "判斷抽樣", "配額抽樣", "單純隨機抽樣"], "answer": 0, "explain": "隨機起點加固定間隔為系統抽樣；仍需注意排序若有與間隔重合的週期，可能影響樣本。"}, {"id": 44, "kind": "應用", "topic": "抽樣設計", "q": "訪員須湊足各年齡組人數，但在商場自由邀請願意填答者，未使用組內機率抽取。最符合何者？", "options": ["配額抽樣", "系統抽樣", "集群抽樣", "分層抽樣"], "answer": 0, "explain": "有人數配置但個體選取非隨機，符合配額；達到年齡結構目標不保證各方面具代表性。"}, {"id": 45, "kind": "應用", "topic": "抽樣設計", "q": "研究對象難以接觸，團隊先訪問少數符合條件者，再請他們轉介下一位。最符合何者？", "options": ["雪球抽樣", "便利抽樣", "系統抽樣", "判斷抽樣"], "answer": 0, "explain": "核心機制是由已接觸受訪者轉介後續人選；網絡相似性也可能限制推廣範圍。"}, {"id": 46, "kind": "應用", "topic": "研究誤差", "q": "研究要涵蓋全體顧客，卻只從電子會員名單抽人，未納入未入會顧客。最直接的問題為何？", "options": ["抽樣架構未涵蓋目標對象", "已抽中的對象拒絕回覆", "抽樣機會造成的隨機變動", "受訪者誤解同意程度選項"], "answer": 0, "explain": "問題在可抽名單漏掉一部分母體，是架構或涵蓋問題；不等同抽中後拒答。"}, {"id": 47, "kind": "應用", "topic": "研究誤差", "q": "名單與抽取程序合適，但忙碌顧客較少回覆，最後意見偏向較有空的人。最直接屬何者？", "options": ["隨機抽樣波動", "無反應誤差", "資料編碼錯誤", "架構誤差"], "answer": 1, "explain": "選擇性回覆使答覆者與未回覆者可能不同；增加相同招募下的回覆數不一定消除這種偏差。"}, {"id": 48, "kind": "應用", "topic": "研究誤差", "q": "受訪者把「每週」看成「每月」，導致回報購買頻率的基準不同。最直接屬何者？", "options": ["群集選取誤差", "無反應誤差", "抽樣架構誤差", "衡量誤差"], "answer": 3, "explain": "對題目期間理解不同，造成測量偏離預定概念，與名單、抽取或未回覆問題不同。"}, {"id": 49, "kind": "應用", "topic": "分析資料", "q": "團隊把開放回答依規則分成價格、品質與通路等代碼，再統計次數。前半段主要在做何者？", "options": ["抽樣名單擴充", "研究假設驗證", "實驗隨機分派", "資料編碼"], "answer": 3, "explain": "把內容轉成可整理的符號或數字屬編碼；應有清楚規則並檢查一致性，統計並非自動證明假設。"}, {"id": 50, "kind": "應用", "topic": "解釋與跟催", "q": "八位深訪者都喜歡新品，主管便說全市場都會喜歡並立即大量鋪貨。最適當的回應為何？", "options": ["以全數受訪者同意，確認母體偏好已得到估計", "以訪談形成線索，另評估代表性及擴大量測需要", "以個別追問深入，確認後續不再需要其他證據", "以八人意見一致，確認推出後的銷售因果效果"], "answer": 1, "explain": "小型定性研究可深入理解，但不足以直接估計全市場比例或保證銷售效果；報告需交代限制並跟催驗證。"}];
const KEY='marketing-ch4-advanced50-v1';
const app=document.getElementById('app');
let history=[],session=null,index=0,filter='all',storageOK=true;
function notice(t){const el=document.getElementById('storageNotice');el.textContent=t;el.classList.remove('hidden')}
try{history=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(history))throw Error();history=history.filter(h=>h&&typeof h.id==='string'&&Number.isFinite(h.score)&&Array.isArray(h.details));}catch(e){storageOK=false;notice('無法讀取成績紀錄。本次仍可練習，請使用匯出功能保存結果。')}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(history))}catch(e){storageOK=false;notice('瀏覽器未能儲存成績，請先匯出備份；關閉頁面後可能無法保留。')}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){if(session&&!session.result&&!confirm('重新抽題會捨棄目前尚未交卷的作答，確定繼續？'))return;const picked=shuffle([...shuffle(BANK.filter(q=>q.kind==='基礎')).slice(0,6),...shuffle(BANK.filter(q=>q.kind==='應用')).slice(0,14)]);session={start:Date.now(),questions:picked.map(q=>({...q,order:shuffle([0,1,2,3])})),answers:{},result:null};index=0;renderQuestion()}
function home(){if(session&&!session.result&&!confirm('返回首頁會捨棄尚未交卷的作答，確定繼續？'))return;session=null;renderHome()}
function renderHome(){const best=history.length?Math.max(...history.map(h=>h.score)):'—';const avg=history.length?Math.round(history.reduce((n,h)=>n+h.score,0)/history.length):'—';app.innerHTML=`<section class="card"><span class="pill">CH4 進階理解練習</span><h2 style="margin-top:15px">一次 20 題，練習研究判斷</h2><p>50 題進階單選題庫（15 題基礎、35 題應用），每回隨機抽取 <b>6 題基礎知識＋14 題實際應用</b>。每題 5 分，不限時；交卷後顯示成績、正確答案與解析。</p><div class="stats"><div class="stat"><b>${history.length}</b><small>完成回數</small></div><div class="stat"><b>${best}</b><small>最高分 / 100</small></div><div class="stat"><b>${avg}</b><small>平均分 / 100</small></div></div><button class="primary" onclick="start()">開始隨機練習 →</button></section><section class="card"><div class="topline"><h2>歷次成績</h2><small>儲存在此瀏覽器</small></div><div class="actions"><button onclick="exportHistory()" ${history.length?'':'disabled'}>匯出紀錄備份</button><button onclick="document.getElementById('importFile').click()">匯入備份</button><input id="importFile" class="hidden" type="file" accept=".json,application/json" onchange="importHistory(this)"><button onclick="clearHistory()" ${history.length?'':'disabled'}>清除紀錄</button></div>${history.length?`<div class="tablewrap"><table><thead><tr><th>練習時間</th><th>成績</th><th>答對</th><th>用時</th><th>解析</th></tr></thead><tbody>${history.map(h=>`<tr><td>${esc(new Date(h.date).toLocaleString('zh-TW'))}</td><td><b>${h.score} 分</b></td><td>${h.correct} / 20</td><td>${duration(h.seconds)}</td><td><button onclick="viewHistory('${esc(h.id)}')">查看</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">尚無紀錄。完成第一回，開始累積你的學習足跡。</p>'}</section>`}
function duration(s){return `${Math.floor(s/60)} 分 ${s%60} 秒`}
function renderQuestion(){const q=session.questions[index],answered=Object.keys(session.answers).length;app.innerHTML=`<section class="card"><div class="topline"><b>第 ${index+1} / 20 題</b><span class="muted">已作答 ${answered} / 20</span></div><progress max="20" value="${answered}"></progress><span class="pill">進階單選題</span><h2 style="margin-top:20px" id="questionHeading" tabindex="-1">${q.q}</h2><fieldset style="border:0;padding:0;margin:0"><legend class="muted">請選擇一個最適合的答案</legend><div class="options">${q.order.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${session.answers[q.id]===o?'checked':''} onchange="chooseDisplay(${i})"><span><b>${'ABCD'[i]}.</b> ${q.options[o]}</span></label>`).join('')}</div></fieldset><div class="actions"><button onclick="move(-1)" ${index===0?'disabled':''}>← 上一題</button>${index<19?'<button class="primary" onclick="move(1)">下一題 →</button>':''}<button onclick="submitQuiz()">交卷看解析</button><button onclick="home()">返回首頁</button></div><div class="navgrid" aria-label="題號導覽">${session.questions.map((x,i)=>`<button aria-label="第 ${i+1} 題${session.answers[x.id]!==undefined?'，已作答':''}" class="${i===index?'current ':''}${session.answers[x.id]!==undefined?'done':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><small>綠底表示已作答，可隨時切換題號修改答案。未交卷作答不會在重新整理後保留。</small></section>`}
function chooseDisplay(i){const q=session.questions[index];choose(q.id,q.order[i])}
function choose(id,o){session.answers[id]=o;renderQuestion()}
function jump(i){index=i;renderQuestion();document.getElementById('questionHeading').focus()}
function move(n){jump(index+n)}
function submitQuiz(){if(!session||session.result)return;const missing=20-Object.keys(session.answers).length;if(!confirm(missing?`還有 ${missing} 題未作答，交卷將以答錯計算。確定交卷？`:'確定交卷並查看解析？'))return;const details=session.questions.map(q=>({id:q.id,choice:session.answers[q.id]??null,order:q.order}));const correct=details.filter(d=>d.choice===BANK.find(q=>q.id===d.id).answer).length;const result={id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),date:new Date().toISOString(),score:correct*5,correct,seconds:Math.round((Date.now()-session.start)/1000),details};session.result=result;history.unshift(result);persist();filter='all';renderResult(result)}
function viewHistory(id){const h=history.find(h=>h.id===id);if(h){session={result:h};filter='all';renderResult(h)}}
function renderResult(r){const groups={};r.details.forEach(d=>{const q=BANK.find(x=>x.id===d.id);const g=groups[q.topic]??={total:0,correct:0};g.total++;g.correct+=Number(d.choice===q.answer)});app.innerHTML=`<section class="card"><div class="topline"><h2>本回練習結果</h2><small>${esc(new Date(r.date).toLocaleString('zh-TW'))}</small></div><div class="score">${r.score}<small style="font-size:18px"> / 100</small></div><p>答對 ${r.correct} / 20 題 · 用時 ${duration(r.seconds)}</p><p class="muted">${r.score>=80?'觀念逐漸穩固！看看解析，確認自己能說出原因。':'先找出混淆的概念，再用解析中的關鍵線索重新判斷。'}</p><div class="actions"><button class="primary" onclick="start()">再抽 20 題</button><button onclick="home()">回首頁看紀錄</button><button onclick="exportHistory()">匯出成績備份</button></div><h3>各主題表現</h3>${Object.entries(groups).map(([t,g])=>`<span class="pill">${t} ${g.correct}/${g.total}</span>`).join('')}</section><section><div class="topline"><h2>逐題解析</h2><div><button onclick="setFilter('all')" ${filter==='all'?'disabled':''}>全部</button> <button onclick="setFilter('wrong')" ${filter==='wrong'?'disabled':''}>只看錯題</button></div></div><div style="margin-top:18px">${r.details.map((d,i)=>{const q=BANK.find(x=>x.id===d.id),ok=d.choice===q.answer;if(filter==='wrong'&&ok)return '';return `<article class="card review ${ok?'':'bad'}"><span class="pill">${q.kind} · ${q.topic}</span><h3>${i+1}. ${q.q}</h3><p class="${ok?'right':'wrong'}">${ok?'✓ 答對':'✕ '+(d.choice===null?'未作答':'答錯')}｜你的答案：${d.choice===null?'未作答':esc(q.options[d.choice])}</p><p><b>正確答案：${q.options[q.answer]}</b></p><p class="muted">${q.explain}</p></article>`}).join('')}${filter==='wrong'&&r.correct===20?'<div class="card">本回全對，沒有錯題！</div>':''}</div></section>`}
function setFilter(f){filter=f;renderResult(session.result)}
function exportHistory(){const blob=new Blob([JSON.stringify({version:2,bank:'ch4-advanced50-v1',history},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='行銷Ch4行銷資訊與研究50題成績備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importHistory(input){const file=input.files[0];if(!file)return;try{if(file.size>5000000)throw Error();const data=JSON.parse(await file.text());if(data.version!==2||data.bank!=='ch4-advanced50-v1'||!Array.isArray(data.history)||data.history.length>10000)throw Error();for(const h of data.history){if(!h||typeof h.id!=='string'||!/^[a-z0-9]+$/.test(h.id)||!Number.isFinite(Date.parse(h.date))||!Number.isInteger(h.seconds)||h.seconds<0||!Array.isArray(h.details)||h.details.length!==20||new Set(h.details.map(d=>d.id)).size!==20)throw Error();for(const d of h.details){if(!Number.isInteger(d.id)||!BANK.some(q=>q.id===d.id)||!(d.choice===null||Number.isInteger(d.choice)&&d.choice>=0&&d.choice<4))throw Error()}h.correct=h.details.filter(d=>d.choice===BANK.find(q=>q.id===d.id).answer).length;h.score=h.correct*5}const ids=new Set(history.map(h=>h.id));history=[...history,...data.history.filter(h=>!ids.has(h.id))].sort((a,b)=>new Date(b.date)-new Date(a.date));persist();renderHome();alert('備份已匯入。')}catch(e){alert('無法匯入：請選擇本練習室匯出的有效 JSON 備份。')}input.value=''}
function clearHistory(){if(confirm('確定清除所有歷次成績？建議先匯出備份，清除後無法復原。')){history=[];persist();renderHome()}}
renderHome();
</script></body></html>
