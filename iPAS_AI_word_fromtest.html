<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>初級 AI 應用規劃師 · 核心名詞字卡</title>
<style>
  :root{
    --ink:#12233b;          /* deep navy ink */
    --ink-soft:#4a5b70;
    --paper:#f3efe6;        /* warm study-paper */
    --card:#ffffff;
    --line:#d9d2c4;
    --accent:#1f6f6b;       /* teal — quiz/exam calm */
    --accent-2:#c65d3b;     /* terracotta highlight */
    --gold:#b78a2e;
    --shadow:0 6px 22px rgba(18,35,59,.10);
    --r:16px;
    font-synthesis-weight:none;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,rgba(243,239,230,.98),rgba(243,239,230,.92));
    backdrop-filter:saturate(1.4) blur(8px);
    border-bottom:1px solid var(--line);
    padding:14px 16px 10px;
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  .brand{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .brand h1{
    font-size:18px;margin:0;font-weight:800;letter-spacing:.3px;
  }
  .brand .tag{
    font-size:11px;color:#fff;background:var(--accent);
    padding:2px 8px;border-radius:999px;font-weight:700;letter-spacing:.5px;
  }
  .count{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .search{
    margin-top:10px;width:100%;
    border:1px solid var(--line);background:var(--card);
    border-radius:12px;padding:10px 12px;font-size:15px;color:var(--ink);
    outline:none;
  }
  .search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,111,107,.15);}

  /* topic chips */
  .chips{
    display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:var(--card);
    color:var(--ink-soft);font-size:13px;font-weight:700;
    padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;
    transition:.15s;
  }
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .chip .n{opacity:.6;font-weight:600;margin-left:4px;font-size:11px;}
  .chip.active .n{opacity:.85;}

  main{padding:8px 16px 40px;max-width:720px;margin:0 auto;}
  .group-head{
    display:flex;align-items:center;gap:10px;
    margin:22px 2px 12px;
  }
  .group-head .idx{
    font-size:12px;font-weight:800;color:var(--accent-2);
    border:1.5px solid var(--accent-2);border-radius:8px;
    padding:2px 7px;letter-spacing:.5px;
  }
  .group-head h2{font-size:16px;margin:0;font-weight:800;}
  .group-head .gline{flex:1;height:1px;background:var(--line);}

  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);box-shadow:var(--shadow);
    margin:0 0 12px;overflow:hidden;
  }
  .card-top{
    padding:14px 16px;cursor:pointer;
    display:flex;justify-content:space-between;gap:12px;align-items:flex-start;
  }
  .term-zh{font-size:16.5px;font-weight:800;line-height:1.35;}
  .term-en{font-size:12.5px;color:var(--accent);font-weight:600;margin-top:3px;
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2px;}
  .topic-tag{
    flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--gold);
    border:1px solid #e6dcc2;background:#fbf7ec;border-radius:6px;
    padding:2px 6px;align-self:flex-start;white-space:nowrap;
  }
  .chev{flex:0 0 auto;color:var(--ink-soft);transition:transform .25s;margin-top:2px;}
  .card.open .chev{transform:rotate(180deg);}
  .card-body{
    max-height:0;overflow:hidden;transition:max-height .3s ease;
    border-top:0 solid var(--line);
  }
  .card.open .card-body{max-height:800px;border-top-width:1px;}
  .bwrap{padding:14px 16px 16px;}
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .flabel{
    font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
    color:var(--accent);margin-bottom:4px;display:flex;align-items:center;gap:6px;
  }
  .flabel.point{color:var(--accent-2);}
  .ftext{font-size:14.5px;color:var(--ink);line-height:1.7;}
  .point-box{
    background:#fdf3ee;border-left:3px solid var(--accent-2);
    border-radius:0 8px 8px 0;padding:8px 12px;
    font-size:14px;line-height:1.65;color:#7a3d29;
  }
  .empty{text-align:center;color:var(--ink-soft);padding:50px 20px;font-size:15px;}
  .footer{text-align:center;color:var(--ink-soft);font-size:11.5px;padding:24px 16px 8px;}
  @media (prefers-reduced-motion:reduce){
    .card-body,.chev{transition:none;}
  }
</style>
</head>

<header>
  <div class="brand">
    <h1>核心名詞字卡</h1>
    <span class="tag">初級 AI 應用規劃師</span>
  </div>
  <div class="count" id="count"></div>
  <input class="search" id="search" type="search" placeholder="搜尋名詞、英文或關鍵字…" autocomplete="off">

<script>
const DATA = {"groups": ["1. AI基礎概念與分類", "2. 機器學習類型", "3. 演算法與模型架構", "4. 訓練與最佳化", "5. 資料處理與特徵工程", "6. 模型評估指標", "7. 可解釋AI與倫理治理", "8. 生成式AI與LLM", "9. AI Agent與應用架構", "10. 監控、隱私與Low-Code"], "cards": [{"zh": "SMOTE 合成少數類過採樣", "en": "Synthetic Minority Over-sampling Technique", "topic": "不平衡資料", "use": "針對類別不平衡的資料集，SMOTE 會在少數類樣本之間以特徵空間插值方式合成全新的樣本，藉此提高少數類佔比、使各類別數量趨於平衡，讓模型不再一面倒偏向多數類。", "point": "優於單純複製；對比隨機欠採樣。通常只在訓練集使用。", "group": "5. 資料處理與特徵工程"}, {"zh": "類別不平衡", "en": "Class Imbalance / Random Resampling", "topic": "不平衡資料", "use": "指資料集中各類別的樣本數量差距極為懸殊的情況，例如詐欺交易遠少於正常交易；此時模型容易偏向樣本較多的多數類，導致對少數類的辨識能力嚴重不足。", "point": "此時 Accuracy 失真，應看 Recall / F1", "group": "5. 資料處理與特徵工程"}, {"zh": "K-平均分群", "en": "K-means", "topic": "分群演算法", "use": "非監督式的分群演算法，先隨機指定 K 個群心，將每筆資料分配到最近的群心，再依群內平均重新計算群心，反覆迭代直到群心穩定，最終把資料切分成 K 個群集。", "point": "非監督代表演算法；需事先指定K", "group": "3. 演算法與模型架構"}, {"zh": "LIME 局部可解釋模型無關解釋", "en": "Local Interpretable Model-agnostic Explanations", "topic": "可解釋AI", "use": "一種事後、模型無關的可解釋性方法，針對單一預測樣本在其鄰近區域取樣，訓練一個簡單的可解釋代理模型，藉此近似並說明黑箱模型在該筆預測附近的局部決策依據。", "point": "局部解釋、模型無關", "group": "7. 可解釋AI與倫理治理"}, {"zh": "SHAP 夏普利值加法解釋", "en": "SHapley Additive exPlanations", "topic": "可解釋AI", "use": "以博弈論中的夏普利值為基礎，公平地將每個特徵對單筆預測的貢獻度加以量化與分配，可同時提供單筆的局部解釋與整體的全域解釋，且具有理論一致性保證。", "point": "可同時提供局部與全域解釋，具一致性", "group": "7. 可解釋AI與倫理治理"}, {"zh": "部分依賴圖", "en": "Partial Dependence Plot, PDP", "topic": "可解釋AI", "use": "一種全域可解釋性工具，透過固定其他特徵、逐步改變某一特徵的取值，觀察並繪出該特徵變動對模型預測結果所造成的平均影響趨勢，用以理解特徵與預測的整體關係。", "point": "全域解釋工具", "group": "7. 可解釋AI與倫理治理"}, {"zh": "顯著圖", "en": "Saliency Map", "topic": "可解釋AI", "use": "針對影像模型的可解釋性技術，會計算並標示出輸入影像中對最終預測結果影響最為關鍵的像素或區域，常以熱力圖形式呈現，方便理解 CNN 究竟「看」哪裡做決策。", "point": "CNN 影像模型解釋", "group": "7. 可解釋AI與倫理治理"}, {"zh": "反事實解釋", "en": "Counterfactual Explanation", "topic": "可解釋AI", "use": "一種以使用者為中心的解釋方式，說明「輸入需要改變哪些條件，模型的結果才會變成期望的另一種結果」，例如貸款被拒時指出調整哪些條件即可獲得核准，最貼近實際需求。", "point": "貸款被拒等場景最貼近使用者需求", "group": "7. 可解釋AI與倫理治理"}, {"zh": "代理模型", "en": "Surrogate Model", "topic": "可解釋AI", "use": "以一個結構簡單、本身即可被人類理解的模型，去近似並模仿複雜黑箱模型的整體行為，藉此達成全域的可解釋性；其限制在於代理模型對原模型的忠實度未必完整。", "point": "全域近似；忠實度為限制", "group": "7. 可解釋AI與倫理治理"}, {"zh": "內在可解釋性", "en": "Intrinsic Interpretability", "topic": "可解釋AI", "use": "指模型的結構本身就具備可讀性、無須額外解釋工具，例如決策樹的分裂規則或線性迴歸的權重係數，決策依據一目了然；與訓練後才另外施加的事後解釋法形成對比。", "point": "對比事後(post-hoc)解釋法", "group": "7. 可解釋AI與倫理治理"}, {"zh": "事後解釋", "en": "Post-hoc Explanation", "topic": "可解釋AI", "use": "指在模型訓練完成之後，才另外對其施加的解釋方法，不改變模型本身結構，例如 LIME、SHAP、PDP 皆屬此類，用以事後剖析既有黑箱模型的決策行為。", "point": "LIME/SHAP/PDP 皆屬之", "group": "7. 可解釋AI與倫理治理"}, {"zh": "自編碼器", "en": "Autoencoder, AE", "topic": "生成/表示學習", "use": "一種非監督式的表示學習神經網路，由編碼器將輸入資料壓縮成低維的潛在向量，再由解碼器從該向量重建原始輸入，可用於降維，亦能以重建誤差偏大來偵測異常。", "point": "降維、異常偵測(重建誤差大即異常)", "group": "3. 演算法與模型架構"}, {"zh": "生成式AI", "en": "Generative AI", "topic": "生成式AI", "use": "泛指能夠自主產生文字、影像、音訊、程式碼等全新內容的模型；與只做分類或預測的判別式 AI 不同，其重點在於「創造」而非僅僅判斷既有資料屬於哪一類。", "point": "對比判別式AI只做分類預測", "group": "8. 生成式AI與LLM"}, {"zh": "大型語言模型", "en": "Large Language Model, LLM", "topic": "生成式AI", "use": "以海量文本語料進行預訓練、參數量極為龐大的語言模型，採自迴歸方式逐字生成內容，並在規模達到一定程度後展現出未經專門訓練即具備的湧現能力。", "point": "自迴歸生成、具湧現能力", "group": "8. 生成式AI與LLM"}, {"zh": "檢索增強生成", "en": "Retrieval-Augmented Generation, RAG", "topic": "生成式AI", "use": "先從外部知識庫或文件中檢索出與問題相關的資料，再連同問題一起交給大型語言模型生成回答；能有效降低幻覺、隨時更新知識，且無須重新訓練模型即可擴充知識。", "point": "降低幻覺、可即時更新知識、無須重訓", "group": "8. 生成式AI與LLM"}, {"zh": "上下文視窗", "en": "Context Window", "topic": "生成式AI", "use": "指模型在單次推論中所能一次處理的最大 token 數量，涵蓋輸入與輸出；一旦超出此上限，較早的內容便會被遺忘，因此處理長篇文件時往往需要先行分段。", "point": "超出即遺忘早期內容；長文件需分段", "group": "8. 生成式AI與LLM"}, {"zh": "對話歷史", "en": "Chat History", "topic": "生成式AI", "use": "由於大型語言模型本身是無狀態的，為維持多輪對話的記憶，必須將先前各輪的對話內容一併附加送入模型，讓它在生成新回應時能參考完整的上下文脈絡。", "point": "LLM 無狀態，多輪記憶須自行攜帶", "group": "8. 生成式AI與LLM"}, {"zh": "上下文工程", "en": "Context Engineering", "topic": "生成式AI", "use": "比提示詞工程涵蓋範圍更廣的系統層設計，指有系統地組織並管理送入模型的資訊、外部工具與記憶內容，以在有限的上下文視窗內，讓模型獲得最合適的脈絡。", "point": "比提示詞工程更廣的系統層設計", "group": "8. 生成式AI與LLM"}, {"zh": "控制符元", "en": "Control Tokens", "topic": "生成式AI", "use": "指語言模型中用來標示對話角色、序列開始與結束或特定格式的特殊 token，例如區隔 system 與 user 的分隔符，藉此讓模型正確理解輸入的結構。", "point": "如 system/user 分隔", "group": "8. 生成式AI與LLM"}, {"zh": "多模態模型", "en": "Multimodal Model", "topic": "生成式AI", "use": "指能同時接收並處理文字、影像、音訊等多種型態輸入的模型，具備跨模態的理解與生成能力，例如看圖回答問題或依文字描述生成影像。", "point": "跨模態理解與生成", "group": "8. 生成式AI與LLM"}, {"zh": "幻覺", "en": "Hallucination", "topic": "生成式AI風險", "use": "指生成式模型產生出看似合理通順、實際上卻與事實不符或憑空捏造的內容；可透過檢索增強生成、要求引用來源與人工審核等方式加以緩解，是 LLM 主要風險之一。", "point": "以RAG、引用來源、人工審核緩解", "group": "8. 生成式AI與LLM"}, {"zh": "溫度參數", "en": "Temperature", "topic": "生成參數", "use": "生成式模型的取樣參數，用來控制輸出的隨機性與多樣性，數值越高輸出越發散有創意、越低則越保守一致；需要嚴謹一致的法遵或財報等場景應調低此值。", "point": "需嚴謹一致的法遵/財報應調低", "group": "8. 生成式AI與LLM"}, {"zh": "變分自編碼器", "en": "Variational Autoencoder, VAE", "topic": "生成模型", "use": "一種生成式的自編碼器變體，會先學習潛在空間的機率分布，再從該分布中採樣並解碼生成全新資料；相較 GAN 其生成品質稍顯模糊，但訓練過程較為穩定。", "point": "生成品質較GAN模糊但訓練穩定", "group": "3. 演算法與模型架構"}, {"zh": "生成對抗網路", "en": "Generative Adversarial Network, GAN", "topic": "生成模型", "use": "由生成器與判別器兩個網路相互對抗、彼此博弈的方式進行訓練，生成器力求產出以假亂真的樣本，判別器則負責分辨真偽；訓練不穩定與模式崩潰是其關鍵缺點。", "point": "訓練不穩定、模式崩潰為關鍵缺點", "group": "3. 演算法與模型架構"}, {"zh": "擴散模型", "en": "Diffusion Model", "topic": "生成模型", "use": "透過前向過程逐步對資料加入雜訊、再由反向過程逐步去噪的方式，一步步還原並生成高品質影像，是 Stable Diffusion、DALL·E 等模型的基礎，已取代 GAN 成為主流。", "point": "Stable Diffusion/DALL·E 基礎，取代GAN成主流", "group": "3. 演算法與模型架構"}, {"zh": "自迴歸模型", "en": "Autoregressive Model", "topic": "生成模型", "use": "一種依序生成的機制，模型會根據先前已產生的輸出來逐一預測下一個 token，是 GPT 類大型語言模型的生成方式；因需逐字產生，故推論延遲相對較高。", "point": "GPT 類LLM生成機制；逐字生成故延遲較高", "group": "3. 演算法與模型架構"}, {"zh": "模式崩潰", "en": "Mode Collapse", "topic": "生成模型問題", "use": "GAN 訓練中常見的故障現象，指生成器只反覆產出少數幾種樣本、喪失了多樣性，無法涵蓋真實資料的完整分布，屬於 GAN 特有的專屬問題。", "point": "GAN專屬故障現象", "group": "3. 演算法與模型架構"}, {"zh": "餘弦相似度", "en": "Cosine Similarity", "topic": "向量檢索", "use": "透過計算兩個向量之間夾角的餘弦值來衡量語義上的相似程度，數值越接近 1 表示方向越一致、語義越相近，是向量資料庫進行相似度比對的標準度量方式。", "point": "向量資料庫比對的標準度量", "group": "3. 演算法與模型架構"}, {"zh": "CLIP 對比式語言-影像預訓練", "en": "Contrastive Language-Image Pre-training", "topic": "多模態", "use": "透過對比式學習，將影像與其對應文字描述對映到同一個共享的語義空間，使圖文可直接比對，成為多模態檢索與零樣本影像分類的重要基礎。", "point": "多模態檢索與零樣本分類基礎", "group": "3. 演算法與模型架構"}, {"zh": "API 閘道", "en": "API Gateway", "topic": "系統架構", "use": "作為微服務架構的統一入口，負責請求的路由分派、身分驗證、流量限制與計費等工作，是微服務治理與對外安全控管的關鍵中介層。", "point": "微服務治理與安全控管", "group": "9. AI Agent與應用架構"}, {"zh": "吞吐量", "en": "Throughput", "topic": "系統效能", "use": "指系統在單位時間內所能成功處理的請求數量或資料量，是衡量系統處理容量的重要效能指標；在實務上常需與延遲之間取得權衡。", "point": "與延遲常需權衡", "group": "10. 監控、隱私與Low-Code"}, {"zh": "並行處理", "en": "Concurrency", "topic": "系統效能", "use": "指系統能夠同時處理多個請求的能力，反映其在高負載下維持服務的容量；並行能力越高，越能因應大量使用者的同時存取需求。", "point": "", "group": "10. 監控、隱私與Low-Code"}, {"zh": "延遲測試", "en": "Latency Testing", "topic": "系統測試", "use": "透過量測從發出請求到收到回應之間所需的時間，來評估系統的反應速度，通常需與吞吐量、並行數等指標一併評估，以全面掌握系統效能。", "point": "與吞吐量、並行數共同評估", "group": "10. 監控、隱私與Low-Code"}, {"zh": "API 呼叫／函式呼叫", "en": "API Calling / Function Calling", "topic": "系統整合", "use": "讓模型以結構化的參數格式呼叫外部服務或函式，取得即時或計算類的資料，藉此克服模型知識截止與本身計算能力不足的限制，擴充其實際可執行的能力。", "point": "克服知識截止與計算能力不足", "group": "9. AI Agent與應用架構"}, {"zh": "正規化(懲罰項)", "en": "Regularization", "topic": "防止過擬合", "use": "在損失函數中加入 L1 或 L2 懲罰項來限制權重的大小，以抑制模型過度複雜、防止過度擬合；Dropout 與 Early Stopping 也屬於同一類防過擬合手段。", "point": "Dropout、Early Stopping 同屬防過擬合手段", "group": "4. 訓練與最佳化"}, {"zh": "嵌入向量", "en": "Embedding", "topic": "表示學習", "use": "將文字、圖像等原始資料映射為具有語義意義的稠密向量，使語義相近者在向量空間中距離較近，是語義檢索與檢索增強生成（RAG）比對的基礎。", "point": "語義相近者向量距離近，為RAG檢索基礎", "group": "5. 資料處理與特徵工程"}, {"zh": "規則式自動化", "en": "Rule-based Automation", "topic": "流程自動化", "use": "依據事先訂定的固定規則來執行流程，本身不具備從資料中學習的能力；當規則多變或輸入為非結構化資料時，這種方式便難以適用。", "point": "規則多變或非結構化輸入時不適用", "group": "10. 監控、隱私與Low-Code"}, {"zh": "提示快取", "en": "Prompt Caching", "topic": "效能最佳化", "use": "將重複出現的前綴提示內容加以快取，後續請求可直接重用而無須重新計算，藉此降低推論延遲與運算成本；在系統提示冗長且高度重複的情境下效益最大。", "point": "高重複性長系統提示效益最大", "group": "8. 生成式AI與LLM"}, {"zh": "批次處理", "en": "Batching", "topic": "效能最佳化", "use": "將多筆推論請求合併成一批一次送入運算，以提升 GPU 的使用率與整體吞吐量；代價是個別請求的等待延遲會因等候湊批而增加。", "point": "提高吞吐但增加單筆延遲", "group": "8. 生成式AI與LLM"}, {"zh": "特徵交叉", "en": "Feature Cross", "topic": "特徵工程", "use": "將兩個以上的特徵組合成新的特徵，用以捕捉特徵之間的交互作用，例如以「星期幾×時段」組合來預測通勤時間，是特徵工程中的經典題型。", "point": "「星期幾×時段」預測通勤時間為經典題", "group": "5. 資料處理與特徵工程"}, {"zh": "獨熱編碼", "en": "One-hot Encoding", "topic": "特徵編碼", "use": "將沒有順序關係的類別型資料轉換成互斥的 0/1 向量，每個類別各佔一維，避免模型誤把類別當成大小順序；但類別數過多（高基數）時會造成維度爆炸。", "point": "避免類別被誤解為大小順序；高基數會造成維度爆炸", "group": "5. 資料處理與特徵工程"}, {"zh": "順序編碼", "en": "Ordinal Encoding", "topic": "特徵編碼", "use": "將具有順序性的類別（如低／中／高）轉換為帶有大小意義的整數，使模型能理解其先後高低關係；此法僅適用於本身確實具備順序性的類別。", "point": "僅適用具順序性的類別", "group": "5. 資料處理與特徵工程"}, {"zh": "激活函數", "en": "Activation Function", "topic": "神經網路", "use": "在神經網路中引入非線性轉換，使多層網路得以擬合複雜的非線性函數；若各層全部採用線性函數，則多層堆疊在效果上等同於單層，失去深度的意義。", "point": "若全用線性函數，多層網路等同單層", "group": "3. 演算法與模型架構"}, {"zh": "梯度消失與梯度爆炸", "en": "Vanishing / Exploding Gradients", "topic": "訓練問題", "use": "在深層網路的反向傳播中，梯度可能因連乘而趨近於零（消失）或不斷放大（爆炸），導致模型難以收斂；ReLU、殘差連接與梯度裁剪等是常見的解法。", "point": "ReLU、殘差連接、梯度裁剪為解法", "group": "4. 訓練與最佳化"}, {"zh": "遷移學習", "en": "Transfer Learning", "topic": "訓練策略", "use": "將既有領域已訓練完成的模型知識移轉並沿用到新的相關任務上，是在目標資料量不足時的常用解法，可與從零開始訓練在成本與效益上做比較。", "point": "資料量不足時的解法；與從零訓練做成本比較", "group": "2. 機器學習類型"}, {"zh": "投資報酬率", "en": "Return on Investment, ROI", "topic": "專案評估", "use": "衡量一項投資或專案所帶來的效益與其投入成本之間的比率，是 AI 專案立案評估時判斷是否值得推動的核心財務指標之一。", "point": "AI專案立案評估核心指標", "group": "10. 監控、隱私與Low-Code"}, {"zh": "總持有成本", "en": "Total Cost of Ownership, TCO", "topic": "專案評估", "use": "涵蓋建置、維運、人力與算力等整個生命週期的所有成本，用以全面評估專案的真實花費；僅比較授權費用而忽略其餘成本，是常見的評估錯誤。", "point": "僅比較授權費用為常見錯誤", "group": "10. 監控、隱私與Low-Code"}, {"zh": "最小可行產品", "en": "Minimum Viable Product, MVP", "topic": "專案管理", "use": "以最小的成本與功能打造出的初版產品，用來快速驗證核心價值是否成立、能否獲得市場或使用者認同；與偏重技術可行性驗證的 PoC 在階段定位上有所區別。", "point": "與PoC的階段差異", "group": "10. 監控、隱私與Low-Code"}, {"zh": "概念驗證", "en": "Proof of Concept, PoC", "topic": "專案管理", "use": "在小規模範圍內驗證某項技術構想是否確實可行，是導入 AI 專案的第一階段，重點在於證明技術能否成立，而非產品是否具備完整商業價值。", "point": "導入AI專案的第一階段", "group": "10. 監控、隱私與Low-Code"}, {"zh": "關鍵績效指標", "en": "Key Performance Indicator, KPI", "topic": "專案管理", "use": "指可量化衡量目標達成程度的關鍵指標，用以追蹤績效與進度；良好的 KPI 應具體明確、可實際量測，並與整體業務目標保持一致對齊。", "point": "須具體、可量測、與業務目標對齊", "group": "10. 監控、隱私與Low-Code"}, {"zh": "探索與利用權衡", "en": "Exploration vs. Exploitation", "topic": "強化學習", "use": "強化學習的核心概念，指在「嘗試尚未探索的新行動」與「沿用目前已知最佳行動」之間取得平衡，以兼顧發掘更優策略與累積即時報酬；ε-greedy 是典型解法。", "point": "RL 專屬概念；ε-greedy 為典型解法", "group": "2. 機器學習類型"}, {"zh": "經驗回放", "en": "Experience Replay", "topic": "強化學習", "use": "強化學習中將過去互動的經驗存入緩衝區，訓練時再從中隨機抽樣重複使用，藉此打破樣本間的時間相關性，提升樣本使用效率與整體訓練的穩定度。", "point": "提升樣本效率與訓練穩定度", "group": "2. 機器學習類型"}, {"zh": "延伸思考", "en": "Extended Thinking", "topic": "推理模型", "use": "指模型在正式輸出答案之前，先投入更多的推理運算與思考步驟，以推論階段花費的額外時間來換取更高的答案品質，常見於推理型模型。", "point": "以推論時間換取答案品質", "group": "1. AI基礎概念與分類"}, {"zh": "類神經網路／多層感知器", "en": "Multi-Layer Perceptron, MLP / FCNN", "topic": "深度學習架構", "use": "由多個全連接層堆疊而成的基礎神經網路，是最典型的前饋式架構；但用於影像時因參數量爆炸而效率不佳，因此影像任務多改用卷積神經網路。", "point": "對影像效率差(參數爆炸)，故用CNN", "group": "3. 演算法與模型架構"}, {"zh": "卷積神經網路", "en": "Convolutional Neural Network, CNN", "topic": "深度學習架構", "use": "以卷積核在影像上滑動來擷取局部的空間特徵，並透過權重共享大幅減少參數量，是影像與電腦視覺任務的首選架構，瑕疵檢測等題型必考。", "point": "影像/電腦視覺首選；瑕疵檢測題必考", "group": "3. 演算法與模型架構"}, {"zh": "循環神經網路", "en": "Recurrent Neural Network, RNN", "topic": "深度學習架構", "use": "具備時間序列記憶能力的網路結構，會將前一時刻的狀態帶入下一時刻運算；但存在梯度消失問題，在處理較長的序列時表現不佳。", "point": "有梯度消失問題，長序列表現差", "group": "3. 演算法與模型架構"}, {"zh": "長短期記憶網路", "en": "Long Short-Term Memory, LSTM", "topic": "深度學習架構", "use": "透過輸入、遺忘與輸出等閘門機制來保留長期依賴資訊，改善傳統 RNN 的梯度消失問題；適用於時序預測與語音，雖被 Transformer 取代但仍是常考重點。", "point": "時序預測、語音；被Transformer取代但仍常考", "group": "3. 演算法與模型架構"}, {"zh": "圖卷積網路", "en": "Graph Convolutional Network, GCN", "topic": "深度學習架構", "use": "專門處理節點與邊構成的圖結構資料的卷積運算，能聚合鄰近節點的資訊，廣泛應用於社群網路分析、分子結構與知識圖譜等領域。", "point": "社群網路、分子結構、知識圖譜", "group": "3. 演算法與模型架構"}, {"zh": "可測試性", "en": "Testability", "topic": "軟體品質", "use": "指系統設計上易於被自動化測試驗證的程度，可測試性越高越利於品質保證；實務上應導入可重複執行的自動化測試與服務虛擬化來提升它。", "point": "應導入可重複執行的自動化測試與服務虛擬化", "group": "10. 監控、隱私與Low-Code"}, {"zh": "邊緣運算", "en": "Edge Computing", "topic": "部署架構", "use": "指前者將請求累積後集中批次處理、後者則逐筆低延遲即時回應，兩者依應用對即時性的需求做選型，是依即時性需求選擇部署方式的固定題型。", "point": "即時性高、網路不穩、隱私敏感情境的首選；對比雲端集中運算", "group": "1. AI基礎概念與分類"}, {"zh": "批次推論 vs 即時推論", "en": "Batch Inference vs. Real-time Inference", "topic": "部署架構", "use": "指前者將請求累積後集中批次處理、以吞吐量為重，後者則逐筆低延遲即時回應，兩者依應用對即時性的需求做取捨與選型。", "point": "依即時性需求選型的固定題型", "group": "1. AI基礎概念與分類"}, {"zh": "基因演算法", "en": "Genetic Algorithm", "topic": "最佳化演算法", "use": "屬於啟發式搜尋演算法，模擬生物演化中的選擇、交配與突變過程，逐代演化以尋找近似最佳解；它並非機器學習的模型訓練方法。", "point": "屬啟發式搜尋，非機器學習訓練法", "group": "3. 演算法與模型架構"}, {"zh": "提示詞工程", "en": "Prompt Engineering", "topic": "提示技術", "use": "透過設計指令、指定角色與提供範例等方式來引導模型產生期望的輸出，過程中完全不更動模型權重，是各種客製手段中成本最低的一種。", "point": "不更動模型權重，成本最低", "group": "8. 生成式AI與LLM"}, {"zh": "零樣本提示", "en": "Zero-shot Prompting", "topic": "提示技術", "use": "在提示中僅給出任務描述、完全不提供任何範例，便要求模型直接完成任務，用以測試模型本身的泛用與遷移能力。", "point": "模型泛用能力測試", "group": "8. 生成式AI與LLM"}, {"zh": "少樣本提示", "en": "Few-shot Prompting", "topic": "提示技術", "use": "在提示中提供少量的輸入與輸出範例，藉此引導模型掌握期望的輸出格式與風格；需與 Few-shot Learning、Fine-tuning 等概念加以辨析區分。", "point": "與Few-shot Learning/Fine-tuning辨析", "group": "8. 生成式AI與LLM"}, {"zh": "思維鏈", "en": "Chain of Thought, CoT", "topic": "提示技術", "use": "要求模型在給出最終答案之前，先逐步展開中間推理過程，藉此顯著提升其在數學計算與邏輯推理類問題上的正確率。", "point": "提升數學與邏輯推理正確率", "group": "8. 生成式AI與LLM"}, {"zh": "思維樹", "en": "Tree of Thoughts, ToT", "topic": "提示技術", "use": "在推理時同時展開多條不同的思考路徑，並可回溯比較各路徑後擇優選取，相較單一線性的思維鏈，更適合需要探索與嘗試的複雜問題。", "point": "比CoT更適合需探索的複雜問題", "group": "8. 生成式AI與LLM"}, {"zh": "圖提示", "en": "Graph Prompting", "topic": "提示技術", "use": "以圖的結構來組織推理過程中的各個節點與其相互關聯，讓模型能沿著節點間的連結進行更有結構的推理與資訊整合。", "point": "", "group": "8. 生成式AI與LLM"}, {"zh": "自動提示工程師", "en": "Automatic Prompt Engineer, APE", "topic": "提示技術", "use": "由模型自動生成大量候選提示詞並加以評估篩選，找出效果最佳者，以自動化的方式取代人工反覆試錯撰寫提示的過程。", "point": "自動化取代人工試錯", "group": "8. 生成式AI與LLM"}, {"zh": "AI 代理", "en": "AI Agent", "topic": "智慧代理", "use": "指能自主規劃、呼叫外部工具並執行多步驟任務以達成目標的 AI 系統，通常具備規劃、記憶與工具使用三大要素，是邁向自動化的重要形式。", "point": "具備規劃、記憶、工具使用三要素", "group": "1. AI基礎概念與分類"}, {"zh": "平均數/中位數/眾數/標準差/百分位數", "en": "Mean / Median / Mode / Standard Deviation / Percentile", "topic": "統計基礎", "use": "指用來描述資料集中集中趨勢（平均數、中位數、眾數）與離散程度（標準差、百分位數）的基本描述統計量；當資料含離群值時，中位數比平均數更具代表性。", "point": "有離群值時中位數比平均數具代表性", "group": "5. 資料處理與特徵工程"}, {"zh": "均方誤差／均方根誤差", "en": "MSE / RMSE", "topic": "評估指標", "use": "均方誤差為預測誤差平方後取平均，均方根誤差再開根號以還原回原始單位；兩者皆用於迴歸任務，且對離群值相當敏感。", "point": "迴歸任務；對離群值敏感", "group": "6. 模型評估指標"}, {"zh": "平均絕對誤差", "en": "Mean Absolute Error, MAE", "topic": "評估指標", "use": "指將所有預測誤差取絕對值後再取平均，用以衡量迴歸模型的預測偏差；相較於平方誤差，它對離群值較不敏感，常與 MSE 做對比。", "point": "對離群值較不敏感，與MSE做對比", "group": "6. 模型評估指標"}, {"zh": "準確率", "en": "Accuracy", "topic": "評估指標", "use": "指模型預測正確的樣本數佔全部樣本的比例；當資料存在類別不平衡時，此指標容易失真而具有誤導性，不宜單獨使用。", "point": "類別不平衡時具誤導性", "group": "6. 模型評估指標"}, {"zh": "精確率", "en": "Precision", "topic": "評估指標", "use": "指在所有被模型預測為正類的樣本中，實際確實為正類的比例；當誤報成本較高的情境（如垃圾郵件封鎖）時應優先關注此指標。", "point": "誤報成本高時(如垃圾信封鎖)優先", "group": "6. 模型評估指標"}, {"zh": "召回率", "en": "Recall", "topic": "評估指標", "use": "指在所有實際為正類的樣本中，被模型正確找出來的比例；當漏掉正類的成本較高的情境（如醫療診斷、詐欺偵測）時應優先關注此指標。", "point": "漏診成本高時(醫療、詐欺)優先", "group": "6. 模型評估指標"}, {"zh": "F1 分數", "en": "F1 Score", "topic": "評估指標", "use": "指精確率與召回率的調和平均數，用以在兩者之間取得綜合平衡；當需要同時兼顧精確率與召回率、且面臨類別不平衡時特別適用。", "point": "兩者需兼顧且類別不平衡時使用", "group": "6. 模型評估指標"}, {"zh": "偽陽性率", "en": "False Positive Rate", "topic": "評估指標", "use": "指在所有實際為負類的樣本中，卻被模型錯誤判為正類的比例；此指標與 ROC 曲線、AUC 及決策門檻的調整彼此連動。", "point": "與ROC/AUC、決策門檻連動", "group": "6. 模型評估指標"}, {"zh": "漏診／偽陰性", "en": "Missed Diagnosis / False Negative", "topic": "評估指標", "use": "指實際為正類的樣本卻被模型誤判為負類（偽陰性）的情況，例如把真正的病患判為健康；在醫療等情境中是最需要極力壓低的錯誤類型。", "point": "醫療情境最需壓低的錯誤類型", "group": "6. 模型評估指標"}, {"zh": "混淆矩陣", "en": "Confusion Matrix", "topic": "評估指標", "use": "以 TP、FP、FN、TN 四個格子呈現分類結果中預測與實際的對照關係，是計算準確率、精確率、召回率等所有分類指標的共同基礎。", "point": "所有分類指標的計算基礎", "group": "6. 模型評估指標"}, {"zh": "隨機森林", "en": "Random Forest", "topic": "集成學習", "use": "屬於集成學習，訓練多棵決策樹並以投票方式整合其結果，藉此降低模型的變異數；相較單一決策樹更為穩健，但整體可解釋性隨之下降。", "point": "比單一決策樹穩健但可解釋性下降", "group": "3. 演算法與模型架構"}, {"zh": "線性迴歸", "en": "Linear Regression", "topic": "傳統ML演算法", "use": "以特徵與目標之間的線性關係來預測連續型數值，是最基礎的迴歸演算法；其評估應採用 MSE、RMSE、MAE 等指標，而非分類用的準確率。", "point": "評估指標用 MSE/RMSE/MAE，非 Accuracy", "group": "3. 演算法與模型架構"}, {"zh": "邏輯迴歸", "en": "Logistic Regression", "topic": "傳統ML演算法", "use": "名為迴歸實則為分類演算法，透過 Sigmoid 函數將輸出壓縮到 0 到 1 之間表示為機率，據以進行二元分類判斷。", "point": "名為迴歸實為分類；輸出介於0~1", "group": "3. 演算法與模型架構"}, {"zh": "決策樹", "en": "Decision Tree", "topic": "傳統ML演算法", "use": "以特徵條件逐層分割資料，形成樹狀的判斷規則來做分類或迴歸；因結構本身可讀而具高可解釋性（屬內在可解釋），但容易發生過擬合。", "point": "可解釋性高(內在可解釋)，但易過擬合", "group": "3. 演算法與模型架構"}, {"zh": "支援向量機", "en": "Support Vector Machine, SVM", "topic": "傳統ML演算法", "use": "尋找能以最大邊界分隔不同類別的超平面來進行分類，並可透過核函數處理非線性可分的資料；在小樣本、高維度的資料上往往表現優異。", "point": "小樣本高維度資料表現佳", "group": "3. 演算法與模型架構"}, {"zh": "K-近鄰演算法", "en": "K-Nearest Neighbors, KNN", "topic": "傳統ML演算法", "use": "以待預測樣本鄰近最接近的 K 個樣本進行多數決來分類，屬惰性學習、沒有明確的訓練階段；K 值大小會影響模型的過擬合或欠擬合程度。", "point": "惰性學習、無訓練階段；K值影響過擬合/欠擬合", "group": "3. 演算法與模型架構"}, {"zh": "樸素貝氏分類器", "en": "Naive Bayes Classifier", "topic": "傳統ML演算法", "use": "以貝氏定理為基礎，並假設各特徵之間條件獨立來進行分類；是文本與垃圾郵件分類的經典演算法，而其特徵獨立性假設正是常見考點。", "point": "文本/垃圾郵件分類經典；獨立性假設為考點", "group": "3. 演算法與模型架構"}, {"zh": "災難性遺忘", "en": "Catastrophic Forgetting", "topic": "微調風險", "use": "指模型在針對新任務進行微調之後，反而喪失了原先已具備的通用能力或舊任務知識，是持續學習與模型微調過程中的主要風險。", "point": "持續學習/微調的主要風險", "group": "4. 訓練與最佳化"}, {"zh": "資料整合", "en": "Data Integration", "topic": "資料工程", "use": "將來自多個來源的資料統一其格式、欄位定義並進行去重合併，使其能一致地被後續使用；其目的並不包含「延長資料保存期限」，此為常見的誤答選項。", "point": "目的不含「延長保存期限」為常見誤答選項", "group": "5. 資料處理與特徵工程"}, {"zh": "ETL", "en": "Extract-Transform-Load", "topic": "資料工程", "use": "資料工程的標準流程，依序為擷取（Extract）、轉換（Transform，含清理與排序）、載入（Load）至目標儲存庫；此順序不可任意調換，T 階段包含清理與排序。", "point": "順序不可任意調換；T包含清理與排序", "group": "5. 資料處理與特徵工程"}, {"zh": "資料管線系統", "en": "Data Pipeline System", "topic": "資料工程", "use": "以自動化方式串接資料的蒐集、處理與供應等各個環節，形成一條連續運作的資料流程，通常會與批次處理或串流處理搭配設計。", "point": "與批次/串流處理搭配考", "group": "5. 資料處理與特徵工程"}, {"zh": "探索性資料分析", "en": "Exploratory Data Analysis, EDA", "topic": "資料分析", "use": "在正式建模之前，先以統計摘要與各種視覺化方法來了解資料的分布特性、變數關係與潛在異常，是資料分析與建模流程的第一步。", "point": "建模前的第一步", "group": "5. 資料處理與特徵工程"}, {"zh": "時間序列分解", "en": "Time Series Decomposition", "topic": "資料分析", "use": "將時間序列資料拆解為趨勢、季節性與殘差等組成成分，以便分別分析各成分的變化，常作為需求預測等時序任務的前置分析。", "point": "需求預測前置分析", "group": "5. 資料處理與特徵工程"}, {"zh": "訓練/驗證/測試資料集", "en": "Training / Validation / Test Data", "topic": "資料切分", "use": "將資料切分為三部分，分別用於學習模型參數（訓練集）、調整超參數（驗證集）與最終客觀評估（測試集）；測試集絕不可參與訓練，否則會造成資料洩漏。", "point": "測試集不得參與訓練，否則資料洩漏", "group": "5. 資料處理與特徵工程"}, {"zh": "資料匿名化", "en": "Data Anonymization", "topic": "資料治理", "use": "透過移除或遮蔽可直接識別出個人身分的欄位，來保護個資隱私，是符合個資法規、進行資料去識別化處理的基本要求。", "point": "去識別化為個資合規基本要求", "group": "5. 資料處理與特徵工程"}, {"zh": "特徵工程", "en": "Feature Engineering", "topic": "資料前處理", "use": "指將原始資料轉換、萃取成更有利於模型學習的特徵的過程，是影響模型最終效能的關鍵前置作業，往往比選擇演算法本身更為重要。", "point": "影響模型效能的關鍵前置作業", "group": "5. 資料處理與特徵工程"}, {"zh": "正規化(縮放)", "en": "Normalization", "topic": "資料前處理", "use": "將數值特徵縮放到固定的區間（常見為 0 到 1）以消除不同特徵間量綱差異的影響，使各特徵處於可比較的尺度；需與標準化加以區分。", "point": "消除量綱差異；與標準化區分", "group": "5. 資料處理與特徵工程"}, {"zh": "標準化", "en": "Standardization / Z-score", "topic": "資料前處理", "use": "將數值特徵轉換為平均值為 0、標準差為 1 的分布（即 Z-score 標準化），以消除量綱差異；對呈常態分布的資料較為適用。", "point": "對常態分布資料較適用", "group": "5. 資料處理與特徵工程"}, {"zh": "對數轉換", "en": "Log Transformation", "topic": "資料前處理", "use": "對呈現右偏長尾分布的資料取對數，藉此壓縮其極端大值、使分布更接近常態，常用於處理高度偏態的金額或次數類欄位。", "point": "處理高度偏態的金額、次數類欄位", "group": "5. 資料處理與特徵工程"}, {"zh": "分箱", "en": "Binning", "topic": "資料前處理", "use": "將連續型的數值切分成若干區間、轉換為離散的類別，藉此降低雜訊的影響並協助模型捕捉非線性關係，是常見的資料前處理手法。", "point": "降低雜訊影響、處理非線性關係", "group": "5. 資料處理與特徵工程"}, {"zh": "資料增強", "en": "Data Augmentation", "topic": "資料前處理", "use": "以旋轉、翻轉、加噪、裁切等方式對既有訓練樣本加以變化來擴增資料量，在影像等訓練資料不足時，可有效提升模型的泛化能力。", "point": "影像資料不足時提升泛化", "group": "5. 資料處理與特徵工程"}, {"zh": "離群值", "en": "Outliers", "topic": "資料品質", "use": "指明顯偏離整體資料分布的極端數值；可用箱型圖或 Z-score 加以偵測，並常以截尾（Trimming）等方式處理，以免影響模型判斷。", "point": "箱型圖/Z-score偵測；截尾(Trimming)處理", "group": "5. 資料處理與特徵工程"}, {"zh": "直方圖／散佈圖／折線圖／長條圖", "en": "Histogram / Scatter Plot / Line Chart / Bar Chart", "topic": "資料視覺化", "use": "分別對應不同的視覺化目的：直方圖呈現資料分布、散佈圖呈現變數相關性、折線圖呈現時間趨勢、長條圖呈現類別間比較，依情境選最適圖表為固定題型。", "point": "題目給情境選最適圖表為固定題型", "group": "5. 資料處理與特徵工程"}, {"zh": "遮罩語言建模", "en": "Masked Language Modeling, MLM", "topic": "預訓練任務", "use": "一種預訓練任務，先遮蔽輸入文本中的部分詞彙，再讓模型根據上下文預測還原被遮蔽的字詞，是 BERT 的預訓練方式，與自迴歸生成形成對比。", "point": "BERT預訓練方式；對比自迴歸", "group": "3. 演算法與模型架構"}, {"zh": "生成式模型 vs 判別式模型", "en": "Generative Model vs. Discriminative Model", "topic": "模型分類", "use": "指前者學習資料的聯合機率分布因而能產生全新樣本，後者則只學習類別間的決策邊界；GAN、VAE 屬生成式，SVM、邏輯迴歸則屬判別式。", "point": "GAN/VAE 屬生成式；SVM/邏輯迴歸屬判別式", "group": "3. 演算法與模型架構"}, {"zh": "微調", "en": "Fine-tuning", "topic": "模型客製", "use": "以特定領域的資料對已預訓練的模型再進行訓練、調整其權重，使其更擅長目標任務；需要標註資料與運算資源，可與 RAG 的知識注入方式做對比。", "point": "需標註資料與算力；對比RAG的知識注入", "group": "4. 訓練與最佳化"}, {"zh": "參數高效微調", "en": "Parameter Efficient Fine-Tuning, PEFT", "topic": "模型客製", "use": "指在微調時僅更新極少量新增的參數、而凍結原有的大部分權重，即可達到客製化效果，是 GPU 等運算資源受限情境下常見的標準解法。", "point": "GPU資源受限情境的標準答案", "group": "4. 訓練與最佳化"}, {"zh": "低秩適配", "en": "Low-Rank Adaptation, LoRA", "topic": "模型客製", "use": "屬於 PEFT 的代表技術，在原模型中注入可訓練的低秩矩陣、並凍結原有權重，只訓練少量新增參數，可大幅降低微調所需的記憶體需求。", "point": "PEFT代表技術，記憶體需求大幅降低", "group": "4. 訓練與最佳化"}, {"zh": "梯度凍結", "en": "Gradient Freezing", "topic": "模型客製", "use": "在微調時凍結網路中部分層的權重、不再對其計算與更新梯度，藉此降低運算量；不過其彈性與效果通常不如 LoRA 靈活。", "point": "降低運算但彈性低於LoRA", "group": "4. 訓練與最佳化"}, {"zh": "監督式微調", "en": "Supervised Fine-Tuning, SFT", "topic": "模型客製", "use": "以人工標註的「指令-回應」配對資料對模型進行微調，是大型語言模型對齊流程中的第一階段，讓模型學會依指令產生合宜回應。", "point": "對齊流程第一階段", "group": "4. 訓練與最佳化"}, {"zh": "強化微調", "en": "Reinforcement Fine-Tuning, RFT", "topic": "模型客製", "use": "以獎勵訊號針對模型的推理過程進行強化式的微調訓練，引導其產生更佳的推理路徑，藉此提升在複雜推理任務上的表現。", "point": "提升複雜推理任務表現", "group": "4. 訓練與最佳化"}, {"zh": "序列到序列", "en": "Sequence-to-Sequence, Seq2Seq", "topic": "模型架構", "use": "採編碼器-解碼器架構，先由編碼器將輸入序列編碼、再由解碼器產生輸出序列，適用於機器翻譯與摘要等任務，Encoder 與 Decoder 的分工為考點。", "point": "翻譯、摘要；Encoder/Decoder 分工為考點", "group": "3. 演算法與模型架構"}, {"zh": "寬深模型", "en": "Wide and Deep", "topic": "模型架構", "use": "結合兩部分的推薦系統架構，Wide 端負責記憶特徵的具體組合、Deep 端負責泛化學習，兩者互補；它屬於模型架構而非特徵工程技巧。", "point": "推薦系統架構，非特徵工程技巧", "group": "3. 演算法與模型架構"}, {"zh": "Transformer 與注意力機制", "en": "Transformer / Self-Attention", "topic": "模型架構", "use": "以自注意力機制平行處理整個序列並捕捉長距離的依賴關係，克服了 RNN 難以平行且長序列表現差的問題，已取代 RNN 成為大型語言模型的基石。", "point": "取代RNN成為LLM基石", "group": "3. 演算法與模型架構"}, {"zh": "編碼器／解碼器", "en": "Encoder / Decoder", "topic": "模型架構", "use": "編碼器負責將輸入理解並編碼為內部表示，解碼器則據此生成輸出；BERT 屬於僅用編碼器的架構，GPT 則屬於僅用解碼器（Decoder-only）的架構。", "point": "BERT為Encoder、GPT為Decoder-only", "group": "3. 演算法與模型架構"}, {"zh": "資料洩漏", "en": "Data Leakage", "topic": "模型風險", "use": "指測試集資訊或未來資訊不慎混入了訓練過程，使模型在評估時效能虛高、上線後卻大幅下滑；在資料切分之前就對全體做標準化即為典型的洩漏。", "point": "切分前先做全體標準化即為典型洩漏", "group": "10. 監控、隱私與Low-Code"}, {"zh": "損失函數", "en": "Loss Function", "topic": "模型訓練", "use": "用來量化模型預測值與真實值之間差距的函數，作為訓練時最佳化的目標；分類任務常用交叉熵、迴歸任務常用 MSE，兩者的配對是常見考題。", "point": "分類用交叉熵、迴歸用MSE，配對題常考", "group": "4. 訓練與最佳化"}, {"zh": "交叉熵損失", "en": "Cross-Entropy Loss", "topic": "模型訓練", "use": "用來衡量模型預測的機率分布與真實標籤分布之間差異的損失函數，差異越大損失越大，是分類任務中最標準、最常用的損失函數。", "point": "分類任務標準損失函數", "group": "4. 訓練與最佳化"}, {"zh": "Hinge 損失", "en": "Hinge Loss", "topic": "模型訓練", "use": "支援向量機所採用的最大邊界損失函數，藉由懲罰落在邊界之內或分類錯誤的樣本來擴大分類間隔；常與交叉熵損失配對辨識。", "point": "與交叉熵配對辨識", "group": "4. 訓練與最佳化"}, {"zh": "KL 散度", "en": "Kullback-Leibler Divergence", "topic": "模型訓練", "use": "用來衡量兩個機率分布之間差異程度的指標，其值不具對稱性（P 對 Q 與 Q 對 P 不相等），常見於變分自編碼器與知識蒸餾等場景。", "point": "VAE、知識蒸餾中使用", "group": "4. 訓練與最佳化"}, {"zh": "最佳化器", "en": "Optimizer", "topic": "模型訓練", "use": "依據損失函數的梯度來更新模型參數的演算法，例如 SGD 與 Adam；其中學習率設定過大會震盪難收斂、過小則收斂緩慢，都會影響訓練效果。", "point": "學習率設定過大/過小的影響", "group": "4. 訓練與最佳化"}, {"zh": "收斂速度", "en": "Convergence Rate", "topic": "模型訓練", "use": "指模型在訓練中損失下降至穩定所需的迭代速度，反映訓練效率；學習率的設定與最佳化器的選擇都會顯著影響收斂的快慢。", "point": "學習率與最佳化器影響", "group": "4. 訓練與最佳化"}, {"zh": "過擬合／欠擬合", "en": "Overfitting / Underfitting", "topic": "模型評估", "use": "過擬合指模型在訓練集表現很好、在測試集卻表現差，欠擬合則指兩者皆差；過擬合對應高變異、欠擬合對應高偏差，是最高頻的考點之一。", "point": "過擬合=高變異、欠擬合=高偏差，最高頻考點", "group": "6. 模型評估指標"}, {"zh": "偏差-變異權衡", "en": "Bias-Variance Tradeoff", "topic": "模型評估", "use": "描述模型複雜度與其泛化能力之間的取捨關係：模型過於簡單會導致高偏差（欠擬合），過於複雜則導致高變異（過擬合），需在兩者間找到平衡。", "point": "模型過簡→高偏差；過複雜→高變異", "group": "6. 模型評估指標"}, {"zh": "交叉驗證", "en": "Cross-validation", "topic": "模型評估", "use": "將資料切分為 K 折，輪流以其中一折當驗證集、其餘當訓練集，重複後取平均效能作為評估結果；在小資料集下能提供更穩健的效能估計。", "point": "小資料集下更穩健的效能估計", "group": "6. 模型評估指標"}, {"zh": "基準測試", "en": "Benchmark", "topic": "模型評估", "use": "以公認的標準資料集與任務來比較不同模型的效能表現，例如 MMLU 等測試；使用時需特別留意訓練資料遭到測試集污染的問題。", "point": "MMLU 等；需注意資料污染", "group": "6. 模型評估指標"}, {"zh": "人類回饋強化學習", "en": "RLHF", "topic": "模型對齊", "use": "先以人類對輸出的偏好排序來訓練一個獎勵模型，再據此透過強化學習優化語言模型的策略，使模型的輸出更符合人類價值觀與安全需求。", "point": "使輸出更符合人類價值與安全", "group": "4. 訓練與最佳化"}, {"zh": "群組相對策略最佳化", "en": "Group Relative Policy Optimization, GRPO", "topic": "模型對齊", "use": "一種強化學習演算法，以同一群組內樣本之間的相對比較來估計優勢、取代傳統的價值網路，是訓練推理型模型的新方法。", "point": "推理模型訓練新方法", "group": "4. 訓練與最佳化"}, {"zh": "資料漂移", "en": "Data Drift", "topic": "模型監控", "use": "指模型上線後，輸入資料的分布隨時間逐漸改變、偏離了原訓練資料，是導致模型效能衰退的主因之一，因此需要持續監控。", "point": "上線後效能衰退主因，需持續監控", "group": "10. 監控、隱私與Low-Code"}, {"zh": "概念漂移", "en": "Concept Drift", "topic": "模型監控", "use": "指輸入特徵與輸出目標之間的對應關係本身發生了改變（而非僅輸入分布改變），此時往往需要重新訓練模型或更新標籤的定義。", "point": "需重新訓練或更新標籤定義", "group": "10. 監控、隱私與Low-Code"}, {"zh": "領域偏移", "en": "Domain Shift", "topic": "模型監控", "use": "指模型的訓練環境與實際部署環境的資料特性不一致，導致模型跨場域部署時效能明顯下降，是實務落地時常見的挑戰。", "point": "跨場域部署效能下降", "group": "10. 監控、隱私與Low-Code"}, {"zh": "決策門檻", "en": "Decision Threshold", "topic": "模型調校", "use": "指用來把預測機率判定為正類的機率界線，可依需求調整；調低門檻會使召回率上升、精確率下降，反之亦然，藉此權衡兩類錯誤。", "point": "調低門檻→Recall↑Precision↓", "group": "6. 模型評估指標"}, {"zh": "模型剪枝", "en": "Pruning", "topic": "模型壓縮", "use": "透過移除模型中冗餘的權重或神經元來縮小模型規模、提升推論效率，與量化、知識蒸餾並列為常見的模型輕量化手段。", "point": "與量化、蒸餾並列輕量化手段", "group": "4. 訓練與最佳化"}, {"zh": "知識蒸餾", "en": "Knowledge Distillation, KD", "topic": "模型壓縮", "use": "以一個大型的教師模型來指導小型的學生模型學習其輸出行為，使小模型在保有相近效能下大幅縮小，常用於邊緣裝置部署；它並非降低參數更新量的 PEFT。", "point": "邊緣裝置部署；非降低參數更新量的PEFT", "group": "4. 訓練與最佳化"}, {"zh": "貝氏網路", "en": "Bayesian Network", "topic": "機率圖模型", "use": "以有向無環圖來表示多個變數之間的條件機率依賴關係，屬於機率圖模型，可用於因果推論與在不確定性下進行推理。", "point": "可做因果推論與不確定性推理", "group": "3. 演算法與模型架構"}, {"zh": "監督式學習", "en": "Supervised Learning", "topic": "機器學習類型", "use": "使用已標註好的資料，讓模型學習從輸入到目標標籤之間的對應關係；需要大量標註資料，分類與迴歸皆屬此類，是最高頻的考點之一。", "point": "需大量標註資料；分類與迴歸皆屬之，為最高頻考點", "group": "2. 機器學習類型"}, {"zh": "非監督式學習", "en": "Unsupervised Learning", "topic": "機器學習類型", "use": "使用沒有標籤的資料，依特徵之間的相似性自動進行分群或找出潛在結構；由於無標準答案，故不能判定「對錯」，常見錯誤選項是說它能準確判斷特定類別。", "point": "不能判定「對錯」；常見錯誤選項是說它能準確判斷特定類別", "group": "2. 機器學習類型"}, {"zh": "半監督式學習", "en": "Semi-supervised Learning", "topic": "機器學習類型", "use": "結合少量已標註資料與大量未標註資料一起訓練，在標註成本高昂但未標註資料相當豐富的情境下，是兼顧成本與效能的最佳解法。", "point": "標註成本高但未標註資料豐富時的最佳解", "group": "2. 機器學習類型"}, {"zh": "自監督式學習", "en": "Self-supervised Learning", "topic": "機器學習類型", "use": "從資料本身自動生成標籤（例如遮字預測）來進行預訓練，無須人工標註，是大型語言模型預訓練的核心方法；與非監督學習的區別在於它會「自造標籤」。", "point": "LLM 預訓練的核心方法；與非監督學習的區別在於有「自造標籤」", "group": "2. 機器學習類型"}, {"zh": "強化學習", "en": "Reinforcement Learning, RL", "topic": "機器學習類型", "use": "由代理人與環境互動，依環境回饋的獎勵訊號反覆試誤，逐步學出能最大化長期報酬的最佳策略；廣泛用於路線規劃、遊戲與機器人控制，關鍵字為獎勵、環境回饋與策略。", "point": "路線規劃、遊戲、機器人控制；關鍵字：獎勵、環境回饋、策略", "group": "2. 機器學習類型"}, {"zh": "深度學習", "en": "Deep Learning", "topic": "機器學習類型", "use": "以多層神經網路自動學習資料的階層式特徵表示，免除大量人工特徵工程；但相對需要大量的訓練資料與運算資源，是機器學習的重要分支。", "point": "免手工特徵工程；需大量資料與算力", "group": "2. 機器學習類型"}, {"zh": "ReLU 函數", "en": "Rectified Linear Unit, ReLU", "topic": "激活函數", "use": "一種激活函數，將負值一律歸零、正值則原樣線性通過；因計算速度快且能緩解梯度消失，常被選為神經網路隱藏層的預設激活函數。", "point": "計算快且緩解梯度消失，隱藏層預設選擇", "group": "3. 演算法與模型架構"}, {"zh": "Sigmoid 函數", "en": "Sigmoid Function", "topic": "激活函數", "use": "一種激活函數，將任意輸入壓縮到 0 至 1 之間以表示機率，常用於二元分類的輸出層；但在輸入絕對值較大時容易發生梯度飽和。", "point": "二元分類輸出層；易梯度飽和", "group": "3. 演算法與模型架構"}, {"zh": "Softmax 函數", "en": "Softmax Function", "topic": "激活函數", "use": "一種激活函數，將多個類別的分數轉換為總和為 1 的機率分布，使各類別機率可比較，常用於多類別分類問題的輸出層。", "point": "多類別分類輸出層", "group": "3. 演算法與模型架構"}, {"zh": "低程式碼／無程式碼平台", "en": "Low-Code / No-Code Platform", "topic": "應用開發", "use": "以視覺化拖拉方式快速建置應用、幾乎不需撰寫程式碼，可大幅降低開發門檻；但其彈性與客製化能力受限，且有供應商鎖定的缺點。", "point": "彈性與客製化受限、供應商鎖定為缺點", "group": "10. 監控、隱私與Low-Code"}, {"zh": "差分隱私", "en": "Differential Privacy", "topic": "隱私保護", "use": "在資料或查詢結果中加入受控的雜訊，使任何單筆個別紀錄都無法被反推出來，同時可量化隱私預算（ε），且整體統計結果仍保有可用性。", "point": "可量化隱私預算(ε)，統計結果仍可用", "group": "10. 監控、隱私與Low-Code"}, {"zh": "同態加密", "en": "Homomorphic Encryption", "topic": "隱私保護", "use": "一種可直接在加密狀態（密文）上進行運算的加密技術，其結果解密後與對明文直接運算的結果相同；但其運算成本極高，是主要的實用限制。", "point": "運算成本極高為主要限制", "group": "10. 監控、隱私與Low-Code"}, {"zh": "安全多方計算", "en": "Secure Multi-party Computation, MPC", "topic": "隱私保護", "use": "讓多個參與方在各自都不揭露自身輸入資料的前提下，共同協作計算出某個結果，兼顧協作需求與各方資料的隱私保護。", "point": "", "group": "10. 監控、隱私與Low-Code"}, {"zh": "零知識證明", "en": "Zero-knowledge Proof", "topic": "隱私保護", "use": "一種密碼學技術，讓證明者能向驗證者證明某項敘述為真，卻不洩漏該敘述以外的任何額外資訊，常用於身分驗證與區塊鏈，並非用於模型訓練。", "point": "身分驗證/區塊鏈；非用於模型訓練", "group": "10. 監控、隱私與Low-Code"}, {"zh": "聯邦學習", "en": "Federated Learning", "topic": "隱私保護AI", "use": "讓原始資料保留在各本地端、不集中匯總，僅上傳各端訓練得到的模型參數或梯度到中央加以聚合，是跨機構共同訓練敏感資料、避免資料外洩的標準答案。", "point": "跨機構敏感資料共同訓練的標準答案，避免資料外洩", "group": "2. 機器學習類型"}, {"zh": "任務規劃器", "en": "Task Planner", "topic": "Agent架構", "use": "AI Agent 的規劃核心元件，負責將使用者的高階目標拆解成一連串可實際執行的子任務序列，作為後續行動的執行藍圖。", "point": "Agent 的規劃核心元件", "group": "9. AI Agent與應用架構"}, {"zh": "解決方案圖", "en": "Solution Graph", "topic": "Agent架構", "use": "以圖的形式表示各子任務之間的依賴關係與可能的執行路徑，讓 Agent 得以支援任務的並行執行與必要時的回溯調整。", "point": "支援並行與回溯", "group": "9. AI Agent與應用架構"}, {"zh": "工具執行器", "en": "Tool Executor", "topic": "Agent架構", "use": "Agent 架構中負責實際動作的元件，會實際呼叫外部 API 或函式並取回執行結果，把規劃出的步驟真正付諸執行。", "point": "", "group": "9. AI Agent與應用架構"}, {"zh": "模型訓練器", "en": "Model Trainer", "topic": "Agent架構", "use": "Agent 架構中專責模型再訓練與更新的模組，負責在需要時重新訓練或更新模型，以維持系統整體的效能與時效性。", "point": "", "group": "9. AI Agent與應用架構"}, {"zh": "多代理系統", "en": "Multi-Agent System", "topic": "Agent架構", "use": "由多個各自擔負不同角色的 Agent 相互協作，以分工、辯論或審核等機制共同完成單一 Agent 難以獨立處理的複雜任務。", "point": "分工、辯論、審核機制", "group": "9. AI Agent與應用架構"}, {"zh": "情境感知代理", "en": "Context-aware Agent", "topic": "Agent架構", "use": "能依據使用者當前狀態與周遭環境資訊，動態調整自身行為與回應策略的 Agent，使其反應更貼合當下情境與需求。", "point": "", "group": "9. AI Agent與應用架構"}, {"zh": "ReAct 推理與行動", "en": "Reason and Act, ReAct", "topic": "Agent框架", "use": "一種 Agent 的運作範式，交錯地進行推理（Reason）與工具行動（Act），並依每次行動後的觀察結果修正下一步，是 Agent 最常被考的運作模式。", "point": "Agent 最常考的運作範式", "group": "9. AI Agent與應用架構"}, {"zh": "模型上下文協定", "en": "Model Context Protocol, MCP", "topic": "Agent標準", "use": "一套標準化的協定，用來規範大型語言模型與外部資料源、工具之間的連接介面，藉此解決各種工具整合方式碎片化、難以互通的問題。", "point": "解決工具整合碎片化問題", "group": "9. AI Agent與應用架構"}, {"zh": "Agent 間通訊協定", "en": "Agent-to-Agent, A2A", "topic": "Agent標準", "use": "用來規範不同 Agent 之間如何互通訊息與協作的通訊協定；其與 MCP 在定位上的差異（Agent 間 vs Agent 與工具間）是常見考點。", "point": "與MCP的定位差異為考點", "group": "9. AI Agent與應用架構"}, {"zh": "對抗式攻擊", "en": "Adversarial Attack", "topic": "AI安全", "use": "對輸入資料刻意加入人眼難以察覺的微小擾動，藉此誘使模型產生錯誤判斷，以影像分類最為典型；對抗訓練是常見的防禦手段。", "point": "影像分類最典型；對抗訓練為防禦", "group": "7. 可解釋AI與倫理治理"}, {"zh": "可解釋人工智慧", "en": "Explainable AI, XAI", "topic": "AI治理", "use": "泛指使 AI 模型的決策依據能被人類理解的技術與方法，在金融、醫療等高風險領域中，往往是法規遵循上的明確要求。", "point": "高風險領域(金融、醫療)法遵要求", "group": "7. 可解釋AI與倫理治理"}, {"zh": "偏差偵測與緩解", "en": "Bias Detection / Bias Mitigation", "topic": "AI治理", "use": "先量測不同群體之間模型結果的差異以偵測偏差，再透過再抽樣、再加權等方式加以修正緩解，涉及公平性指標的評估與去偏流程。", "point": "公平性指標與去偏流程", "group": "7. 可解釋AI與倫理治理"}, {"zh": "資料去偏", "en": "Data Debiasing", "topic": "AI治理", "use": "透過調整訓練資料的組成來降低樣本分布的偏斜，屬於從資料源頭著手的治本手段，效果通常優於僅在模型輸出端做調整。", "point": "治本手段，優於只調整輸出", "group": "7. 可解釋AI與倫理治理"}, {"zh": "人在迴圈中", "en": "Human-in-the-loop, HITL", "topic": "AI治理", "use": "指 AI 的每一項輸出都必須經由人類逐一審核並批准後才會實際執行，是控制最為嚴格的人機協作模式，適用於高風險決策情境。", "point": "控制最嚴格；高風險決策適用", "group": "7. 可解釋AI與倫理治理"}, {"zh": "人在迴圈上", "en": "Human-over-the-loop", "topic": "AI治理", "use": "指人類持續在旁監督 AI 的運作，並在必要時能即時介入修正；與人在迴圈中（HITL）、人在迴圈外三者的辨析是固定考點。", "point": "與HITL、HOTL三者辨析為固定考點", "group": "7. 可解釋AI與倫理治理"}, {"zh": "人在迴圈外", "en": "Human-out-of-the-loop", "topic": "AI治理", "use": "指 AI 全自動運作、人類不即時介入，僅在事後檢視或發生例外時才接手處理，是自動化程度最高、同時風險也最大的模式。", "point": "自動化程度最高、風險最大", "group": "7. 可解釋AI與倫理治理"}, {"zh": "AI 三大原則(可靠/公平/安全)", "en": "Reliable / Fair / Secure", "topic": "AI治理", "use": "指可信任 AI 常見的三大面向，要求模型必須穩定可靠、對不同群體公平無歧視，並能防護惡意攻擊確保安全，是可信任 AI 框架的核心原則。", "point": "可信任AI框架常見面向", "group": "7. 可解釋AI與倫理治理"}, {"zh": "內容憑證", "en": "Content Credentials", "topic": "AI治理", "use": "以標準化的中繼資料（如 C2PA 規範）來標示內容的來源與其 AI 生成的軌跡，是因應深偽造假與著作權治理的重要手段。", "point": "C2PA；深偽與著作權治理手段", "group": "7. 可解釋AI與倫理治理"}, {"zh": "演算法偏差", "en": "Algorithmic Bias", "topic": "AI倫理", "use": "指模型因訓練資料本身的偏斜或設計不當，而反映甚至放大了社會中既有的歧視；發生時應優先排查訓練資料的樣本分布與代表性。", "point": "首要排查訓練資料樣本分布與代表性", "group": "7. 可解釋AI與倫理治理"}, {"zh": "弱人工智慧／狹義AI", "en": "Weak AI / Narrow AI", "topic": "AI基本概念", "use": "專精於單一特定任務的 AI，例如影像辨識或語音助理，不具備跨領域的通用能力；目前所有商用 AI 皆屬弱 AI，常與 AGI、ASI 做三層次比較題。", "point": "現行所有商用AI皆屬弱AI；常與AGI、ASI做三層次比較題", "group": "1. AI基礎概念與分類"}, {"zh": "通用人工智慧", "en": "Artificial General Intelligence, AGI", "topic": "AI基本概念", "use": "指具備與人類相當的跨領域理解、學習與推理能力的 AI，目前尚未實現；題目常以「能自主遷移到全新領域」來描述其特徵。", "point": "尚未實現；題目常以「可自主遷移到全新領域」描述", "group": "1. AI基礎概念與分類"}, {"zh": "超人工智慧", "en": "Artificial Superintelligence, ASI", "topic": "AI基本概念", "use": "指在幾乎所有領域都全面超越人類智慧的假想 AI 階段，目前仍純屬理論；選項中若聲稱它「已商用」即為錯誤敘述。", "point": "純理論階段，選項中若稱「已商用」即為錯誤", "group": "1. AI基礎概念與分類"}, {"zh": "強人工智慧", "en": "Strong AI", "topic": "AI基本概念", "use": "指具備自我意識與真正理解能力的 AI 概念，與 AGI 常被混用；相對於弱 AI 僅是「模擬行為而不具真正理解」，強 AI 強調真正的理解。", "point": "與AGI常混用；對比弱AI的「只模擬行為不具理解」", "group": "1. AI基礎概念與分類"}, {"zh": "專家系統", "en": "Expert System", "topic": "AI基本概念", "use": "以人工撰寫的規則庫（IF-THEN 規則）搭配推論引擎來模擬專家的決策，屬於符號式 AI、本身不會自我學習；情境題中若需從資料學習則非專家系統。", "point": "屬符號式AI，不會自我學習；情境題中若需從資料學習則非專家系統", "group": "1. AI基礎概念與分類"}, {"zh": "機器學習維運", "en": "Machine Learning Operations, MLOps", "topic": "AI維運", "use": "整合模型的開發、部署、監控與再訓練等各環節的一套流程實踐，重點在於自動化的 CI/CD 與模型版本控管，使 AI 系統能穩定持續運作。", "point": "自動化CI/CD與模型版本控管", "group": "1. AI基礎概念與分類"}, {"zh": "決策支援系統", "en": "Decision Support System, DSS", "topic": "AI應用系統", "use": "彙整相關資料與模型分析結果來輔助管理者做決策，但最終仍由人做決定；與自動化 AI 決策的差異在於 DSS 僅提供資訊、不會自動執行。", "point": "與自動化AI決策的差異：DSS僅提供資訊不自動執行", "group": "1. AI基礎概念與分類"}, {"zh": "預測性維護", "en": "Predictive Maintenance", "topic": "AI應用場景", "use": "以感測器資料預測設備可能發生故障的時點，據以提前安排維修排程，屬於預測分析的應用；常與事後維修、定期維修做對比。", "point": "屬預測分析應用；與事後維修、定期維修做對比", "group": "1. AI基礎概念與分類"}, {"zh": "推薦系統", "en": "Recommendation System", "topic": "AI應用場景", "use": "依據使用者的行為與偏好推薦其可能感興趣的內容或商品，常採協同過濾或內容式方法；其偏差與同溫層（過濾泡泡）效應是倫理考點。", "point": "協同過濾/內容式；偏差與同溫層(過濾泡泡)為倫理考點", "group": "1. AI基礎概念與分類"}, {"zh": "感知器網路／感測器網路", "en": "Sensor Network", "topic": "AIoT/智慧城市", "use": "在環境中佈署大量感測節點，持續蒐集環境或設備狀態的資料，是智慧城市題（如 PM2.5 監測、垃圾桶滿溢偵測）最直接對應的技術。", "point": "智慧城市題(PM2.5、垃圾桶滿溢度)最直接對應的技術", "group": "1. AI基礎概念與分類"}, {"zh": "提示詞注入", "en": "Prompt Injection", "topic": "LLM安全", "use": "透過惡意輸入來覆蓋或劫持模型原本的系統指令，使其脫離既定控制、執行攻擊者意圖的行為；輸入過濾、指令隔離與權限最小化為常見防禦。", "point": "輸入過濾、指令隔離、權限最小化為防禦", "group": "8. 生成式AI與LLM"}, {"zh": "提示詞洩漏", "en": "Prompt Leakage", "topic": "LLM安全", "use": "透過誘導的方式使模型吐露出其系統提示、隱藏規則或內部設定等機密內容，屬於機密資訊外洩的安全風險，需加以防範。", "point": "屬機密外洩風險", "group": "8. 生成式AI與LLM"}, {"zh": "稀疏混合專家", "en": "Sparse Mixture-of-Experts, MoE", "topic": "LLM架構", "use": "在推論時僅啟用部分專家子網路、而非全部參數，藉此在維持大模型能力的同時降低運算量，是大模型效率化的架構（如 Mixtral）。", "point": "大模型效率化架構(如Mixtral)", "group": "3. 演算法與模型架構"}, {"zh": "模型(建模元素)", "en": "Model", "topic": "Low-Code", "use": "低程式碼平台中的核心建模元素，用以抽象描述資料結構、業務流程與介面邏輯，其設計良窳會影響應用的整體設計與後續維護性。", "point": "影響應用設計與後續維護性", "group": "10. 監控、隱私與Low-Code"}, {"zh": "工作流", "en": "Workflow", "topic": "Low-Code", "use": "在低程式碼平台中，將觸發條件、判斷邏輯與各項動作串接組合成一條自動化流程，讓事件發生時能自動依序執行對應處理。", "point": "", "group": "10. 監控、隱私與Low-Code"}, {"zh": "條件分支", "en": "Branching / Router", "topic": "Low-Code元件", "use": "低程式碼平台的流程元件，依據多重條件的判斷結果決定流程接下來的走向，「若金額大於 N 則發送通知」即為此元件的典型題型答案。", "point": "「若金額>N則通知」為典型題型答案", "group": "10. 監控、隱私與Low-Code"}, {"zh": "迭代／迴圈", "en": "Iterator", "topic": "Low-Code元件", "use": "低程式碼平台的流程元件，能逐筆處理多筆資料並依序對每一筆執行相同的流程步驟，適用於批量資料的重複處理。", "point": "", "group": "10. 監控、隱私與Low-Code"}, {"zh": "陣列聚合器", "en": "Array Aggregator", "topic": "Low-Code元件", "use": "低程式碼平台的流程元件，負責將流程中多筆分別處理後的結果整合彙集成單一的資料集，便於後續統一使用或輸出。", "point": "", "group": "10. 監控、隱私與Low-Code"}, {"zh": "資料格式化器", "en": "Formatter", "topic": "Low-Code元件", "use": "低程式碼平台的流程元件，負責整理與轉換流程中傳遞的資料格式，使其符合後續步驟所需的形式，確保資料能順利銜接。", "point": "", "group": "10. 監控、隱私與Low-Code"}, {"zh": "向量檢索", "en": "Vector Retrieval", "topic": "RAG", "use": "以文件的嵌入向量進行近似最近鄰搜尋，取回與查詢語義最相關的文件片段，是 RAG 的檢索核心；與關鍵字檢索的差異在於它比對的是語義而非字面。", "point": "與關鍵字檢索的語義差異", "group": "9. AI Agent與應用架構"}, {"zh": "分塊", "en": "Chunking", "topic": "RAG", "use": "在 RAG 中將長篇文件切分成大小適當的片段後再各自嵌入；切得太大會稀釋語義、切得太小又會失去上下文，需拿捏適當的分塊大小。", "point": "切太大稀釋語義、太小失去上下文", "group": "9. AI Agent與應用架構"}, {"zh": "多向量檢索器", "en": "Multi-vector Retriever", "topic": "RAG", "use": "在 RAG 中以多個向量來表示同一份文件的不同面向，藉此提升檢索的召回率，讓相關文件更容易在檢索階段被正確取回。", "point": "", "group": "9. AI Agent與應用架構"}]};
const cards = DATA.cards;
const groups = DATA.groups;
document.getElementById('tot').textContent = cards.length;

let activeGroup = 'ALL';
let q = '';

// build chips
const chipsEl = document.getElementById('chips');
function groupCount(g){ return cards.filter(c=>c.group===g).length; }
const chipDefs = [['ALL','全部', cards.length]].concat(groups.map(g=>{
  const short = g.replace(/^\d+\.\s*/,'');
  return [g, short, groupCount(g)];
}));
chipDefs.forEach(([key,label,n])=>{
  const b=document.createElement('button');
  b.className='chip'+(key==='ALL'?' active':'');
  b.dataset.key=key;
  b.innerHTML=label+' <span class="n">'+n+'</span>';
  b.onclick=()=>{activeGroup=key;[...chipsEl.children].forEach(c=>c.classList.toggle('active',c.dataset.key===key));render();};
  chipsEl.appendChild(b);
});

const main=document.getElementById('main');
const countEl=document.getElementById('count');

function matches(c){
  if(activeGroup!=='ALL' && c.group!==activeGroup) return false;
  if(!q) return true;
  const hay=(c.zh+' '+c.en+' '+c.topic+' '+c.use+' '+c.point).toLowerCase();
  return hay.includes(q);
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(){
  const list=cards.filter(matches);
  countEl.textContent = (activeGroup==='ALL'?'全部主題':activeGroup.replace(/^\d+\.\s*/,'')) + ' · 顯示 '+list.length+' 張';
  main.innerHTML='';
  if(!list.length){main.innerHTML='<div class="empty">找不到符合的名詞，換個關鍵字試試。</div>';return;}

  const showByGroup = (activeGroup==='ALL' && !q);
  if(showByGroup){
    groups.forEach(g=>{
      const items=list.filter(c=>c.group===g);
      if(!items.length) return;
      const idx=g.match(/^(\d+)\./)[1];
      const name=g.replace(/^\d+\.\s*/,'');
      const gh=document.createElement('div');
      gh.className='group-head';
      gh.innerHTML='<span class="idx">'+idx+'</span><h2>'+esc(name)+'</h2><span class="gline"></span>';
      main.appendChild(gh);
      items.forEach(c=>main.appendChild(cardEl(c)));
    });
  }else{
    list.forEach(c=>main.appendChild(cardEl(c)));
  }
}

function cardEl(c){
  const el=document.createElement('div');
  el.className='card';
  const en = c.en ? '<div class="term-en">'+esc(c.en)+'</div>' : '';
  const point = c.point ? '<div class="field"><div class="flabel point">考點</div><div class="point-box">'+esc(c.point)+'</div></div>' : '';
  el.innerHTML =
    '<div class="card-top">'+
      '<div><div class="term-zh">'+esc(c.zh)+'</div>'+en+'</div>'+
      '<span class="topic-tag">'+esc(c.topic)+'</span>'+
      '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>'+
    '</div>'+
    '<div class="card-body"><div class="bwrap">'+
      '<div class="field"><div class="flabel">用途說明</div><div class="ftext">'+esc(c.use)+'</div></div>'+
      point+
    '</div></div>';
  el.querySelector('.card-top').onclick=()=>el.classList.toggle('open');
  return el;
}

let t;
document.getElementById('search').addEventListener('input',e=>{
  clearTimeout(t);
  t=setTimeout(()=>{q=e.target.value.trim().toLowerCase();render();},120);
});

render();
</script>
