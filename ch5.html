</style></head><body><main><header><div class="eyebrow">MARKETING / CHAPTER 05</div><h1>Ch5 消費者市場與購買行為・進階練習</h1><p class="muted">從購買歷程到心理與群體影響，練習辨識行為背後的原因。</p></header><div id="storageNotice" class="notice hidden" role="status"></div><div id="app"></div><footer>依據《行銷-Ch5 消費者市場與購買行為 摘要》編製，延伸基礎觀念與虛構情境。本題庫為理解練習，非官方考古題。<br>成績保存在目前瀏覽器，不會跨裝置同步；清除瀏覽器資料、使用無痕模式或搬移檔案可能影響紀錄。建議定期匯出備份。本章成績與其他章節分開保存；備份請於相同章節及版本匯入。</footer></main>

'use strict';
const BANK=[{"id": 1, "kind": "基礎", "topic": "市場與行為", "q": "區分消費市場與組織市場，最應優先看哪項？", "options": ["本次購買的用途與目的", "商品本身的體積與重量", "實際付款金額的高低", "交易是否透過網路完成"], "answer": 0, "explain": "同一商品可用於家庭生活或生產營運，應依本次用途判斷，而不是品類、價格或交易媒介。"}, {"id": 2, "kind": "基礎", "topic": "市場與行為", "q": "研究消費者行為的範圍，何者較完整？", "options": ["取得、使用及處置中的決策與活動", "僅限使用期間對產品品質的評價", "僅限購買當下的品牌與支付選擇", "僅限付款完成前的比較與選擇活動"], "answer": 0, "explain": "消費者行為包含購前、購買、使用及處置，不止成交時刻。"}, {"id": 3, "kind": "基礎", "topic": "分析架構", "q": "7O 中 Occupants 與 Organization 的區別為何？", "options": ["前者描述使用時機，後者描述支付方式", "前者描述交易程序，後者描述購買地點", "前者描述市場消費者，後者描述購買參與分工", "前者描述購買目的，後者描述產品類型"], "answer": 2, "explain": "Occupants 看誰構成市場；Organization 看誰參與某次購買、各自扮演什麼角色。"}, {"id": 4, "kind": "基礎", "topic": "分析架構", "q": "在輸入、處理、輸出的架構中，何者屬於「處理」？", "options": ["消費者完成交易並申請退換貨", "企業刊出廣告並發布優惠內容", "消費者解讀訊息並評估候選方案", "朋友向消費者分享產品的消息"], "answer": 2, "explain": "處理是消費者內在心理與決策活動；外界刺激屬輸入，實際購買及購後活動屬輸出。"}, {"id": 5, "kind": "基礎", "topic": "資訊蒐集", "q": "消費者的內部蒐集與外部蒐集，主要差別為何？", "options": ["取用既有記憶，或另向外界取得資訊", "取用品牌資料，或取用非品牌資料", "購前蒐集資料，或於購買完成後蒐集", "由本人蒐集資料，或由別人代為蒐集"], "answer": 0, "explain": "內部指自身記憶、知識及既往經驗；外部則包含品牌、朋友、公共來源或新體驗。"}, {"id": 6, "kind": "基礎", "topic": "候選品牌", "q": "依摘要，失當集合與呆滯集合的主要差別為何？", "options": ["前者已被排除，後者尚可接受但缺乏吸引力", "前者完全未知，後者已經確定購買", "前者必屬高價，後者必屬低價替代品", "前者已經付款，後者只是尚未完成付款"], "answer": 0, "explain": "兩者都不同於最後積極考慮的候選者；失當偏排斥，呆滯偏無突出理由。"}, {"id": 7, "kind": "基礎", "topic": "知覺風險", "q": "心理風險與社會風險主要如何區別？", "options": ["前者涉及自我感受，後者涉及他人的評價", "前者涉及功能落差，後者涉及退款金額", "前者涉及身體傷害，後者涉及產品性能", "前者涉及維修費用，後者涉及學習時間"], "answer": 0, "explain": "自我不安、價值衝突偏心理；擔心不被他人認同偏社會，應看情境最主要的顧慮。"}, {"id": 8, "kind": "基礎", "topic": "涉入決策", "q": "關於涉入程度，哪項理解較適當？", "options": ["只要價格低，便不會產生高度涉入", "同一品類對所有消費者皆維持固定水準", "依個人關切、風險及情境而可能改變", "只要熟悉品牌，便不再考慮任何風險"], "answer": 2, "explain": "價格是因素之一，興趣、用途、經驗及重要情境也會影響願意投入的心力。"}, {"id": 9, "kind": "基礎", "topic": "說服路徑", "q": "區分中央與邊陲路徑，較關鍵的判準為何？", "options": ["廣告是否使用文字而不是圖片呈現", "產品是否屬於耐用品而不是日用品", "訊息是否在實體門市而不是網路出現", "是否仔細檢視與判斷對象相關的論據"], "answer": 3, "explain": "中央路徑重較深入的論據處理；邊陲較依賴代言、熟悉感等線索。不能單以媒介或理性感性字眼判斷。"}, {"id": 10, "kind": "基礎", "topic": "涉入決策", "q": "只觀察到顧客重複購買同牌，為何不足以確認品牌忠誠？", "options": ["可能源自習慣或取得方便，仍需了解承諾與動機", "重複購買次數只與年齡有關，與品牌無關", "重複購買只會出現在顧客認為各品牌差異很大時", "品牌忠誠只適用首次購買，不能看後續行為"], "answer": 0, "explain": "重複行為可能是慣性，忠誠還涉及偏好與信任，不能由表面次數直接推定。"}, {"id": 11, "kind": "基礎", "topic": "購買角色", "q": "「決定者」與「購買者」的核心差異為何？", "options": ["前者提供意見，後者提出最早的購買構想", "前者只能是家長，後者只能是家庭中的晚輩", "前者決定是否或如何買，後者實際執行交易", "前者使用產品，後者只比較使用後的感受"], "answer": 2, "explain": "角色依行動功能而非身分判斷，同一人也可能同時具有多種角色。"}, {"id": 12, "kind": "基礎", "topic": "採用階段", "q": "在 AIETA 中，試用與接納的差異為何？", "options": ["前者限於個人，後者限於組織使用", "前者有限體驗，後者決定持續採用", "前者比較利弊，後者只想了解規格", "前者首次聽聞，後者開始搜尋消息"], "answer": 1, "explain": "試用提供實際體驗以評估；接納則走向持續使用，不應把領一次試用品等同正式採用。"}, {"id": 13, "kind": "基礎", "topic": "知覺歷程", "q": "選擇性暴露與選擇性注意的差別為何？", "options": ["前者由品牌直接決定，後者由朋友直接決定", "前者影響接觸哪些訊息，後者影響接觸後留意哪些", "前者處理已記得的內容，後者處理價值衝突", "前者發生於使用之後，後者發生於購買之後"], "answer": 1, "explain": "暴露涉及是否接觸，注意涉及已呈現刺激中哪些被留意，不能與解釋及記憶混用。"}, {"id": 14, "kind": "基礎", "topic": "學習機制", "q": "古典制約與工具制約的主要區別為何？", "options": ["前者只影響陌生品牌，後者只影響知名品牌", "前者以刺激配對建立聯想，後者由行為結果改變行為", "前者不需任何經驗，後者不需任何回饋", "前者只能透過文字發生，後者只能透過影像發生"], "answer": 1, "explain": "古典重聯結；工具重做了某事後的後果如何影響下次行為。"}, {"id": 15, "kind": "基礎", "topic": "學習機制", "q": "判斷「負向增強」時，哪兩項條件最重要？", "options": ["既有好處消失，且目標行為減少", "不利結果出現，且目標行為減少", "不舒服被移除，且目標行為增加", "額外好處增加，且目標行為增加"], "answer": 2, "explain": "負向指移除令人不適的刺激，增強指行為增加；不是因名稱含負向就等同處罰。"}, {"id": 16, "kind": "基礎", "topic": "態度構成", "q": "態度的認知、情感與行為傾向，何種配對較適當？", "options": ["具備何種所得、具有何種年齡、生活於何種地區", "屬於何種市場、使用何種通路、處於何種時機", "接觸何種廣告、購買何種數量、付款使用何種方式", "認為具何特性、對它的感受、傾向採取的行動"], "answer": 3, "explain": "ABC 分別涵蓋情感 Affect、行為傾向 Behavior 及認知 Cognition；傾向也不等於已完成行為。"}, {"id": 17, "kind": "基礎", "topic": "態度功能", "q": "價值表達與社會適應功能的主要差別為何？", "options": ["前者整理產品資訊，後者避免自我受到傷害", "前者展現所重視的原則，後者協助融入重要群體", "前者只能出現在個人購物，後者只能出現在團購", "前者只受價格影響，後者只受產品規格影響"], "answer": 1, "explain": "相同行為可能有不同功能，要看為了表達自我價值，還是為了群體關係與接納。"}, {"id": 18, "kind": "基礎", "topic": "動機理論", "q": "驅力理論與摘要所述期望理論，重點差異為何？", "options": ["前者只分析群體規範，後者只分析個人所得", "前者排除生理狀態，後者排除心理預期", "前者偏向品牌分類，後者偏向通路分類", "前者偏向降低內在緊張，後者偏向追求預期好結果"], "answer": 3, "explain": "驅力著重不平衡引起的緊張與滿足；期望重對正向結果的期待，不是所有動機都來自同一路徑。"}, {"id": 19, "kind": "基礎", "topic": "動機衝突", "q": "趨避衝突與雙趨衝突的主要差異為何？", "options": ["前者對同一目標又想要又顧慮，後者在兩個喜好間選擇", "前者只涉及金錢風險，後者只涉及人際關係", "前者必須先完成購買，後者必須先發生退貨", "前者在兩個討厭選項間取捨，後者對單一商品無感"], "answer": 0, "explain": "趨避是同一目標有吸引與排斥面；雙趨是兩個有吸引力的目標互相競逐。"}, {"id": 20, "kind": "基礎", "topic": "動機理論", "q": "依摘要運用赫茲伯格雙因子觀點時，哪項判斷較適當？", "options": ["所有滿意與不滿意，都必須由同一條件決定", "只要增加激勵內容，就可以不處理基本缺失", "只要不再出現抱怨，就代表有強烈滿意與認同", "消除不滿的條件，不一定足以創造額外滿意"], "answer": 3, "explain": "保健因素與激勵因素作用有別；此處沿用摘要作動機辨析，不將每項商品屬性固定歸類。"}, {"id": 21, "kind": "基礎", "topic": "個人因素", "q": "信念與價值的主要區別為何？", "options": ["前者取決於商品價格，後者取決於購買數量", "前者是已經完成的交易，後者是尚未進行的交易", "前者只能透過觀察得知，後者只能透過實驗得知", "前者是對事物的描述想法，後者是較持久的偏好原則"], "answer": 3, "explain": "例如認為某品耐用是信念，重視節約或環保是價值；不能以資料蒐集方法來區分。"}, {"id": 22, "kind": "基礎", "topic": "個人因素", "q": "研究生活型態的 AIO，應主要蒐集何者？", "options": ["活動、興趣與意見", "年齡、所得與職業", "態度、意圖與能力", "品牌、規格與價格"], "answer": 0, "explain": "AIO 是 Activities、Interests、Opinions，與人口特徵或 TPB 構面不同，可互相補充。"}, {"id": 23, "kind": "基礎", "topic": "參考群體", "q": "主要群體與次要群體的區別，最應看哪項？", "options": ["成員人數是否超過某一門檻", "成員是否屬於相同所得級距", "關係親近程度與互動密切性", "是否使用網路平台交換訊息"], "answer": 2, "explain": "兩者皆可為成員群體，區別在關係與互動性質；不能僅依人數或線上線下分類。"}, {"id": 24, "kind": "基礎", "topic": "計畫行為理論", "q": "依 TPB，對某行為評價正面但沒有採取行動，哪項理解較合理？", "options": ["正面態度即可證明資料記錄必有錯誤", "仍須考量規範、控制知覺、意圖及實際條件", "只需看是否看過廣告，不必考量其他因素", "沒有行動即可確認其態度必為負面"], "answer": 1, "explain": "TPB 區分評價、規範、能力條件、意圖與行為；正面態度不是實際行動的保證。"}, {"id": 25, "kind": "應用", "topic": "市場與行為", "q": "同一款烤箱，甲買回家做點心，乙買來供咖啡店營業使用。兩者依序屬何者？", "options": ["組織市場、消費市場", "組織市場、組織市場", "消費市場、消費市場", "消費市場、組織市場"], "answer": 3, "explain": "產品相同，但用途分別為家庭生活與組織營運，分類依購買目的。"}, {"id": 26, "kind": "應用", "topic": "品牌依附", "q": "顧客偏愛某款糖果，因每次看到都想起童年與祖母相處的時光。最直接屬何者？", "options": ["自我概念連結", "懷舊依附", "日常依附", "價格導向習慣"], "answer": 1, "explain": "線索在過往個人記憶；不是只有情緒正面就忽略懷舊的更具體來源。"}, {"id": 27, "kind": "應用", "topic": "品牌依附", "q": "顧客穿某戶外品牌，是因它讓自己覺得「我是重視探索的人」，未提及往昔回憶。最直接屬何者？", "options": ["財務風險", "懷舊依附", "自我概念連結", "日常依附"], "answer": 2, "explain": "主要是用品牌建立身分與認同，不是記憶或不可或缺的日常流程。"}, {"id": 28, "kind": "應用", "topic": "分析架構", "q": "研究者已知道市場由哪些家庭構成，現在追查誰提議、誰出錢與誰選款。7O 中最對應何者？", "options": ["Outlets", "Organization", "Occupants", "Occasions"], "answer": 1, "explain": "問題是一次購買中的參與分工，不是整個市場有哪些消費者。"}, {"id": 29, "kind": "應用", "topic": "問題確認", "q": "消費者因長時間未進食而感到飢餓，開始尋找餐點。最直接的觸發來源是？", "options": ["品牌區辨", "內部刺激", "外部刺激", "購後評估"], "answer": 1, "explain": "生理壓力來自身體，屬內部刺激；找餐點是後續行為。"}, {"id": 30, "kind": "應用", "topic": "問題確認", "q": "消費者原本沒打算換鞋，看見朋友示範新款功能後開始考慮。最直接的觸發來源是？", "options": ["購後失調", "外部刺激", "內部生理刺激", "支付方式選擇"], "answer": 1, "explain": "朋友示範是自身之外的刺激，不代表之後一定購買或已出現購後疑慮。"}, {"id": 31, "kind": "應用", "topic": "資訊蒐集", "q": "顧客買相機前，先回想自己上次使用的故障經驗，之後才閱讀新的評測。第一步屬何者？", "options": ["外部公共蒐集", "內部資訊蒐集", "實際購後處置", "外部商業蒐集"], "answer": 1, "explain": "回憶既有經驗屬內部取用；閱讀新評測才是另向外界取得資訊。"}, {"id": 32, "kind": "應用", "topic": "資訊蒐集", "q": "顧客閱讀品牌官網的規格表，又參考沒有品牌贊助的消費者組織測試。兩者依序屬何者？", "options": ["個人來源、內部記憶", "內部記憶、個人來源", "商業來源、公共來源", "公共來源、商業來源"], "answer": 2, "explain": "官網為品牌控制的商業資訊，獨立組織測試則屬公共資訊；來源不同也仍需判斷內容品質。"}, {"id": 33, "kind": "應用", "topic": "資訊蒐集", "q": "同一人替自己買日用品時很快決定，替重要客戶挑禮物時卻花很多時間比較。最合理的解讀是？", "options": ["搜尋時間增加足以證明售價必然較高", "用途與社會風險使涉入及搜尋投入提高", "買禮物一定代表消費者缺乏商品知識", "日用品一定不會有任何心理處理過程"], "answer": 1, "explain": "任務、對他人觀感的顧慮及重要性可改變涉入，不能只由品類或價格推論。"}, {"id": 34, "kind": "應用", "topic": "資訊蒐集", "q": "顧客開了數十個比較頁，越看越混亂，最後只依其中一項容易理解的指標決定。最值得注意何者？", "options": ["頁面數量足以保證最適合的決策", "資訊增加必然讓每項比較更周全", "單一指標可以排除所有購後風險", "資訊過荷可能促使簡化及篩選"], "answer": 3, "explain": "資料量超過處理能力時，消費者可能忽略部分資訊並採簡化規則；多不一定等於更好。"}, {"id": 35, "kind": "應用", "topic": "候選品牌", "q": "顧客知道甲品牌，也認為可用，但沒有特別想選它；另因糟糕經驗明確排除乙。依摘要依序屬何者？", "options": ["選擇集合、非知曉集合", "失當集合、呆滯集合", "非知曉集合、選擇集合", "呆滯集合、失當集合"], "answer": 3, "explain": "甲是可接受但缺乏突出吸引力；乙則是明確排除，兩者不宜混為不知曉。"}, {"id": 36, "kind": "應用", "topic": "候選品牌", "q": "品牌已被許多人認得，卻很少出現在最後比較的名單。最應新增哪項了解？", "options": ["顧客是否願意把它納入候選及其原因", "只計算看到標誌的次數，不必問考慮情形", "只調查品牌名稱能否唸出，取代後續比較", "只確認商品上架總數，不必問排除理由"], "answer": 0, "explain": "知曉不等於考慮或最後選擇；需找到從認得走向候選的障礙。"}, {"id": 37, "kind": "應用", "topic": "知覺風險", "q": "顧客擔心新家電後續耗材與維修費太高，但並不懷疑功能。主要屬何者？", "options": ["績效風險", "財務風險", "社會風險", "身體風險"], "answer": 1, "explain": "焦點在未來金錢負擔，不是產品能否達成功效或他人看法。"}, {"id": 38, "kind": "應用", "topic": "知覺風險", "q": "顧客擔心空氣清淨機無法達到宣稱的淨化效果，其他條件皆可接受。主要屬何者？", "options": ["財務風險", "社會風險", "績效風險", "心理風險"], "answer": 2, "explain": "題目指向功能與預期成果落差，應與支出、內心衝突及社會評價區分。"}, {"id": 39, "kind": "應用", "topic": "知覺風險", "q": "顧客喜歡某商品，但擔心使用時傷及皮膚。主要屬何者？", "options": ["社會風險", "財務風險", "身體風險", "時間風險"], "answer": 2, "explain": "這是對可能身體傷害的主觀顧慮；題目不主張該商品實際具有特定健康風險。"}, {"id": 40, "kind": "應用", "topic": "知覺風險", "q": "顧客覺得皮革包外觀好看，卻擔心購買後違背自己對動物保護的原則。主要屬何者？", "options": ["心理風險", "績效風險", "社會風險", "財務風險"], "answer": 0, "explain": "主要是自我價值衝突，未提及別人是否認同，較偏心理風險。"}, {"id": 41, "kind": "應用", "topic": "知覺風險", "q": "顧客認為平價西裝品質足夠，卻怕在聚會被同儕看低。主要屬何者？", "options": ["身體風險", "時間風險", "社會風險", "績效風險"], "answer": 2, "explain": "擔心他人的身分評價是社會風險，並非商品功能不佳。"}, {"id": 42, "kind": "應用", "topic": "知覺風險", "q": "顧客不怕自行組裝失敗，也能負擔費用，但擔心研究說明與退換貨太耗時。主要屬何者？", "options": ["績效風險", "時間風險", "身體風險", "社會風險"], "answer": 1, "explain": "題幹已將主要顧慮限定為時間付出，不應只因提到組裝就歸為性能。"}, {"id": 43, "kind": "應用", "topic": "購後行為", "q": "顧客已買下筆電，尚未使用便反覆懷疑「另一款會不會更值得」，也沒有發現故障。最接近何者？", "options": ["初次問題確認", "購後認知失調", "產品績效故障", "內部生理刺激"], "answer": 1, "explain": "成交後對選擇產生疑慮是認知失調，不必等同實際不滿或故障。"}, {"id": 44, "kind": "應用", "topic": "顧客旅程", "q": "品牌官網容易下單，但貨到後找不到客服，整體評價仍下降。最適當的改善視角為何？", "options": ["只看每個部門各自達標，不需追蹤同一顧客", "串連購前到購後接觸點，找出交接與體驗斷點", "把下單成功視為旅程結束，忽略後續接觸", "只優化官網流量，成交後的環節另不納入"], "answer": 1, "explain": "旅程跨越購前、購買與購後；局部介面順暢不保證整體體驗良好。"}, {"id": 45, "kind": "應用", "topic": "涉入決策", "q": "顧客因家人重要紀念日，為平常不太在意的茶葉仔細比較產地與包裝。最合理的判斷為何？", "options": ["包裝資訊增加就能確認顧客已有忠誠", "茶葉對每位消費者都必然是高度涉入", "特定情境可提高原本品類的涉入", "涉入只能隨收入變動，不能受情境影響"], "answer": 2, "explain": "同一人同一品類也可能因任務、重要場合與風險改變心力投入。"}, {"id": 46, "kind": "應用", "topic": "說服路徑", "q": "消費者比較測試方法、性能證據及適用限制，再形成產品評價。較符合何者？", "options": ["邊陲路徑", "非知曉集合", "習慣性取貨", "中央路徑"], "answer": 3, "explain": "判斷依據是深入處理與產品相關的論據，而不是媒體類型或頁面外觀。"}, {"id": 47, "kind": "應用", "topic": "說服路徑", "q": "消費者沒有細看商品證據，只因信任的名人出現在廣告裡，就覺得商品可靠。較符合何者？", "options": ["刺激區辨", "邊陲路徑", "中央路徑", "廣泛決策"], "answer": 1, "explain": "主要依賴代言者線索而非細查論據；名人也可提供論據，但本題明確表示未細看。"}, {"id": 48, "kind": "應用", "topic": "涉入決策", "q": "顧客經常直接拿固定品牌的鹽，說不出特別偏好，缺貨時也隨手換牌。最適當的理解為何？", "options": ["鹽價格通常低，所以不可能發生任何比較", "重複購買較可能來自慣性而非強烈品牌承諾", "固定品牌紀錄已足以證明高度品牌忠誠", "缺貨時改買其他牌代表曾進行廣泛搜尋"], "answer": 1, "explain": "熟悉、低心力且替換容易較像習慣；不能只靠重複購買貼上忠誠標籤。"}, {"id": 49, "kind": "應用", "topic": "購買角色", "q": "孩子最先提議買遊戲機，家長決定是否購買，店員朋友提供規格意見。三者依序屬何者？", "options": ["購買者、影響者、發起者", "使用者、發起者、決定者", "影響者、購買者、使用者", "發起者、決定者、影響者"], "answer": 3, "explain": "依提議、決策及資訊建議三項功能辨識，而非依年齡或職業。"}, {"id": 50, "kind": "應用", "topic": "購買角色", "q": "母親選定款式並決定要買，父親依指示到店付款取貨，祖父是唯一使用者。父親主要扮演何者？", "options": ["購買者", "決定者", "發起者", "使用者"], "answer": 0, "explain": "父親執行交易，並不因付款取貨就代表他決定購買內容或實際使用。"}, {"id": 51, "kind": "應用", "topic": "採用階段", "q": "顧客已知道某新服務並蒐集說明，現在比較它是否適合自己的日程，尚未使用。主要處於何者？", "options": ["評估", "知曉", "接納", "試用"], "answer": 0, "explain": "題幹已有認知與興趣，目前在權衡適用性，尚未實際體驗或持續採用。"}, {"id": 52, "kind": "應用", "topic": "採用階段", "q": "顧客首次領取短期體驗方案，用後仍打算再決定是否長期付費。主要處於何者？", "options": ["試用", "知曉", "接納", "問題確認"], "answer": 0, "explain": "有限體驗不等於已經承諾持續使用；即使完成一次交易，也不能跳過採用意義的區別。"}, {"id": 53, "kind": "應用", "topic": "知覺歷程", "q": "顧客刻意取消不喜歡品牌的訊息訂閱，避免再收到其內容。最符合何者？", "options": ["選擇性扭曲", "選擇性注意", "選擇性暴露", "選擇性記憶"], "answer": 2, "explain": "重點在事先決定接觸哪些資訊，而非訊息已呈現後只留意其中一部分。"}, {"id": 54, "kind": "應用", "topic": "知覺歷程", "q": "賣場海報完整呈現在眼前，顧客只留意自己正在找的尺寸，未注意其餘內容。最符合何者？", "options": ["選擇性扭曲", "選擇性暴露", "選擇性記憶", "選擇性注意"], "answer": 3, "explain": "已經接觸訊息，當下只注意特定部分；不是事先避開或事後只記得某部分。"}, {"id": 55, "kind": "應用", "topic": "知覺歷程", "q": "顧客看完品牌的負面實測，仍把同一結果解釋為「測試越嚴格，越證明這牌有實力」。最符合何者？", "options": ["選擇性記憶", "選擇性注意", "選擇性扭曲", "選擇性暴露"], "answer": 2, "explain": "資訊已接收，但解釋被原有偏好帶動；不只是沒看到或後來忘掉。"}, {"id": 56, "kind": "應用", "topic": "知覺歷程", "q": "顧客當時讀過品牌優缺點，幾週後卻只想得起支持原先偏好的內容。最符合何者？", "options": ["選擇性扭曲", "選擇性暴露", "選擇性注意", "選擇性記憶"], "answer": 3, "explain": "題幹強調時間過後保留哪些內容，不是接觸、當下留意或當時解釋。"}, {"id": 57, "kind": "應用", "topic": "學習機制", "q": "品牌長期讓商品與令人愉快的音樂一同出現，之後顧客只看到商品也感到愉快。較符合何者？", "options": ["購後處置", "工具制約", "古典制約", "系統抽樣"], "answer": 2, "explain": "透過刺激反覆配對建立情感聯想，未描述先購買再獲得獎酬而增加行為。"}, {"id": 58, "kind": "應用", "topic": "學習機制", "q": "顧客原本喜歡甲品牌，看到其新口味採相近包裝，尚未試喝就期待也很好喝。最符合何者？", "options": ["刺激區辨", "雙避衝突", "行為消弱", "刺激類化"], "answer": 3, "explain": "將對相似刺激的反應延伸到新項目，是類化；尚未描述分辨相似品的不同。"}, {"id": 59, "kind": "應用", "topic": "學習機制", "q": "試過兩款相似包裝後，顧客發現配方不同，之後只選符合自己需要的一款。最符合何者？", "options": ["負向增強", "選擇性暴露", "刺激類化", "刺激區辨"], "answer": 3, "explain": "關鍵是從經驗學會區分相似刺激，不再給予相同反應。"}, {"id": 60, "kind": "應用", "topic": "學習機制", "q": "顧客每次自備杯都獲得點數，之後自備杯次數增加。最符合何者？", "options": ["正向增強", "處罰", "負向增強", "消弱"], "answer": 0, "explain": "行為後增加好處，且行為增加，為正向增強；不是移除原本的不舒服。"}, {"id": 61, "kind": "應用", "topic": "學習機制", "q": "平台原本持續顯示令人困擾的未完成設定提醒，完成設定後提醒消失，使用者以後更常及時完成。最符合何者？", "options": ["正向增強", "處罰", "消弱", "負向增強"], "answer": 3, "explain": "目標行為移除不適刺激並因而增加，符合負向增強。不能只因提醒令人不快就判成處罰。"}, {"id": 62, "kind": "應用", "topic": "學習機制", "q": "顧客因逾期取貨而支付額外費用，之後逾期次數下降。最符合何者？", "options": ["負向增強", "正向增強", "處罰", "刺激類化"], "answer": 2, "explain": "不利結果跟隨逾期行為，且逾期下降，為處罰；負向增強則要求行為增加。"}, {"id": 63, "kind": "應用", "topic": "學習機制", "q": "原先因集點而頻繁購買的顧客，在長期停止提供點數後逐漸不再頻繁回訪。最符合何者？", "options": ["消弱", "刺激區辨", "處罰", "負向增強"], "answer": 0, "explain": "原本維持行為的好處停止，行為逐漸減少，屬消弱；題幹未新增罰款或其他不利刺激。"}, {"id": 64, "kind": "應用", "topic": "學習機制", "q": "顧客自己未曾購買，卻讀說明並觀察朋友使用後，學會判斷產品是否適合。依摘要較符合何者？", "options": ["例行決策", "觀念式學習", "工具制約", "購後認知失調"], "answer": 1, "explain": "可透過資訊、觀察與思考學習，不必親自試用或直接獲得獎酬。"}, {"id": 65, "kind": "應用", "topic": "態度構成", "q": "顧客說「我認為這款飲品含糖較少」，尚未表達喜歡或購買打算。最直接屬何者？", "options": ["認知成分", "行為傾向", "實際購買", "情感成分"], "answer": 0, "explain": "這是關於產品特性的想法，不等於感受、行動傾向或已完成交易。"}, {"id": 66, "kind": "應用", "topic": "態度功能", "q": "顧客喜歡某家商店，因它省錢、省時且能解決生活採買問題。主要體現何者？", "options": ["社會適應功能", "自我防衛功能", "工具性功能", "價值表達功能"], "answer": 2, "explain": "態度幫助取得實際利益、避免不利結果，偏工具性；題幹未強調群體認同或自我價值宣示。"}, {"id": 67, "kind": "應用", "topic": "態度功能", "q": "顧客選擇減少包裝的商品，明確表示即使沒有人知道，也想實踐自己的環保原則。主要體現何者？", "options": ["知識功能", "自我防衛功能", "社會適應功能", "價值表達功能"], "answer": 3, "explain": "題目把動機限定為實踐重視的原則，而非取悅他人或簡化資訊。"}, {"id": 68, "kind": "應用", "topic": "動機衝突", "q": "消費者同樣喜歡兩個旅遊行程，但假期只夠選一個，並未提及負面顧慮。最符合何者？", "options": ["購後失調", "趨避衝突", "雙趨衝突", "雙避衝突"], "answer": 2, "explain": "兩個有吸引力的目標互相競逐，是雙趨；尚未購買，亦非購後疑慮。"}, {"id": 69, "kind": "應用", "topic": "動機衝突", "q": "消費者想買高性能相機，卻也擔心它太重而降低攜帶意願。最符合何者？", "options": ["雙趨衝突", "雙避衝突", "趨避衝突", "刺激類化"], "answer": 2, "explain": "同一目標同時帶來吸引與不利面，不能只因有兩項考量就當成兩個喜愛選項。"}, {"id": 70, "kind": "應用", "topic": "動機衝突", "q": "消費者不喜歡高昂修理費，也不喜歡更換設備的麻煩，但故障使其必須擇一。最符合何者？", "options": ["雙避衝突", "品牌依附", "雙趨衝突", "趨避衝突"], "answer": 0, "explain": "是兩個不喜歡但必須選擇的方案；不是對同一商品同時愛與怕。"}, {"id": 71, "kind": "應用", "topic": "動機理論", "q": "訪談發現，顧客口頭強調功能，進一步探索卻可能也在追求未自覺的身分肯定。依摘要最貼近何者？", "options": ["佛洛伊德動機觀點", "馬斯洛需求層級", "驅力降低觀點", "赫茲伯格雙因子"], "answer": 0, "explain": "焦點是表面理由之外的隱藏動機；不能單靠研究者猜測就當成已證實，仍應審慎解釋。"}, {"id": 72, "kind": "應用", "topic": "個人因素", "q": "兩位同齡且所得相近的人，一人熱衷露營，另一人重視劇場與閱讀，購物也不同。最適合補充哪種資料？", "options": ["商品總價格與包裝重量", "活動、興趣及意見", "門市總面積與倉庫位置", "年齡與所得重複量測"], "answer": 1, "explain": "人口特徵相近不代表生活型態相同，AIO 有助於理解不同偏好與行動脈絡。"}, {"id": 73, "kind": "應用", "topic": "參考群體", "q": "消費者尚未加入某專業協會，但正準備取得資格，並參照會員的購買選擇。依摘要最接近何者？", "options": ["象徵仰慕群體", "主要成員群體", "斥拒群體", "期盼仰慕群體"], "answer": 3, "explain": "目前非成員，但有可能且期盼未來加入，與純象徵模仿及已是親近成員不同。"}, {"id": 74, "kind": "應用", "topic": "參考群體", "q": "消費者模仿國際巨星社交圈的穿搭，卻不認為自己實際有機會加入該圈。依摘要最接近何者？", "options": ["主要成員群體", "斥拒群體", "期盼仰慕群體", "象徵仰慕群體"], "answer": 3, "explain": "欣賞與模仿但實際加入機會不大，較符合象徵仰慕；不能因喜歡就推定可成為成員。"}, {"id": 75, "kind": "應用", "topic": "參考群體", "q": "顧客避免購買某款衣服，因不想讓人把自己與其不認同的群體聯想在一起。主要涉及何者？", "options": ["斥拒群體", "主要成員群體", "象徵仰慕群體", "期盼仰慕群體"], "answer": 0, "explain": "此處是想避免身分連結的群體，不是想加入或模仿。"}, {"id": 76, "kind": "應用", "topic": "參考群體", "q": "某攝影社成員沒有高追蹤數，但經常提供可靠的鏡頭知識，朋友購買前都會詢問他。最適當的判斷為何？", "options": ["能提供建議即可推定他是購買者", "追蹤數不高便不可能影響他人", "可能是特定領域的意見領袖", "受他影響即可推定交易必屬 B2B"], "answer": 2, "explain": "意見領袖的影響可來自專業與可信度，不必等同名人，也不代表他本人執行交易。"}, {"id": 77, "kind": "應用", "topic": "情境因素", "q": "同一顧客平時慢慢挑選，趕搭車時卻只買熟悉款式。最直接改變的是？", "options": ["品牌所有權", "人口結構", "家庭生命週期", "時間壓力"], "answer": 3, "explain": "題目指出可用時間改變，促使搜尋與評估縮短；不需推定其穩定偏好已永久改變。"}, {"id": 78, "kind": "應用", "topic": "計畫行為理論", "q": "顧客認為自備杯值得做，但說「重要同事希望我一起做，我很在意他們的期待」。TPB 中後一句主要屬何者？", "options": ["實際行為", "主觀規範", "行為控制知覺", "對行為的態度"], "answer": 1, "explain": "核心是感知重要他人的期待及對其看法的重視，不是對自備杯本身的好壞評價。"}, {"id": 79, "kind": "應用", "topic": "計畫行為理論", "q": "顧客支持自備杯，也覺得同事贊同，但認為自己總忘記帶、工作地點又難清洗。最應補強哪個面向？", "options": ["行為控制知覺及實際便利條件", "對市場品牌總數的記憶", "對產品外觀的懷舊聯想", "對同儕期待的重複宣傳"], "answer": 0, "explain": "能力與障礙感影響是否覺得做得到；可改善提醒、清洗及攜帶條件，不能只再強調好處。"}, {"id": 80, "kind": "應用", "topic": "計畫行為理論", "q": "顧客已決定下週固定三天自備杯，卻因臨時行程改變而未做到。哪項判斷較適當？", "options": ["既然受行程影響，就代表態度必為負面", "既然未實行，就代表從未有過意圖", "既然有計畫，就代表實際行為已完成", "已有明確意圖，行為仍可能受條件影響"], "answer": 3, "explain": "行為意圖是打算，實際行為是執行；二者相關但不能視為完全相同，實際條件也可能阻礙。"}];
const KEY='marketing-ch5-advanced80-v1';
const app=document.getElementById('app');
let history=[],session=null,index=0,filter='all',storageOK=true;
function notice(t){const el=document.getElementById('storageNotice');el.textContent=t;el.classList.remove('hidden')}
try{history=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(history))throw Error();history=history.filter(h=>h&&typeof h.id==='string'&&Number.isFinite(h.score)&&Array.isArray(h.details));}catch(e){storageOK=false;notice('無法讀取成績紀錄。本次仍可練習，請使用匯出功能保存結果。')}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(history))}catch(e){storageOK=false;notice('瀏覽器未能儲存成績，請先匯出備份；關閉頁面後可能無法保留。')}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){if(session&&!session.result&&!confirm('重新抽題會捨棄目前尚未交卷的作答，確定繼續？'))return;const picked=shuffle([...shuffle(BANK.filter(q=>q.kind==='基礎')).slice(0,6),...shuffle(BANK.filter(q=>q.kind==='應用')).slice(0,14)]);session={start:Date.now(),questions:picked.map(q=>({...q,order:shuffle([0,1,2,3])})),answers:{},result:null};index=0;renderQuestion()}
function home(){if(session&&!session.result&&!confirm('返回首頁會捨棄尚未交卷的作答，確定繼續？'))return;session=null;renderHome()}
function renderHome(){const best=history.length?Math.max(...history.map(h=>h.score)):'—';const avg=history.length?Math.round(history.reduce((n,h)=>n+h.score,0)/history.length):'—';app.innerHTML=`<section class="card"><span class="pill">CH5 進階理解練習</span><h2 style="margin-top:15px">一次 20 題，練習消費行為判斷</h2><p>80 題進階單選題庫（24 題基礎、56 題應用），每回隨機抽取 <b>6 題基礎知識＋14 題實際應用</b>。每題 5 分，不限時；交卷後顯示成績、正確答案與解析。</p><div class="stats"><div class="stat"><b>${history.length}</b><small>完成回數</small></div><div class="stat"><b>${best}</b><small>最高分 / 100</small></div><div class="stat"><b>${avg}</b><small>平均分 / 100</small></div></div><button class="primary" onclick="start()">開始隨機練習 →</button></section><section class="card"><div class="topline"><h2>歷次成績</h2><small>儲存在此瀏覽器</small></div><div class="actions"><button onclick="exportHistory()" ${history.length?'':'disabled'}>匯出紀錄備份</button><button onclick="document.getElementById('importFile').click()">匯入備份</button><input id="importFile" class="hidden" type="file" accept=".json,application/json" onchange="importHistory(this)"><button onclick="clearHistory()" ${history.length?'':'disabled'}>清除紀錄</button></div>${history.length?`<div class="tablewrap"><table><thead><tr><th>練習時間</th><th>成績</th><th>答對</th><th>用時</th><th>解析</th></tr></thead><tbody>${history.map(h=>`<tr><td>${esc(new Date(h.date).toLocaleString('zh-TW'))}</td><td><b>${h.score} 分</b></td><td>${h.correct} / 20</td><td>${duration(h.seconds)}</td><td><button onclick="viewHistory('${esc(h.id)}')">查看</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">尚無紀錄。完成第一回，開始累積你的學習足跡。</p>'}</section>`}
function duration(s){return `${Math.floor(s/60)} 分 ${s%60} 秒`}
function renderQuestion(){const q=session.questions[index],answered=Object.keys(session.answers).length;app.innerHTML=`<section class="card"><div class="topline"><b>第 ${index+1} / 20 題</b><span class="muted">已作答 ${answered} / 20</span></div><progress max="20" value="${answered}"></progress><span class="pill">進階單選題</span><h2 style="margin-top:20px" id="questionHeading" tabindex="-1">${q.q}</h2><fieldset style="border:0;padding:0;margin:0"><legend class="muted">請選擇一個最適合的答案</legend><div class="options">${q.order.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${session.answers[q.id]===o?'checked':''} onchange="chooseDisplay(${i})"><span><b>${'ABCD'[i]}.</b> ${q.options[o]}</span></label>`).join('')}</div></fieldset><div class="actions"><button onclick="move(-1)" ${index===0?'disabled':''}>← 上一題</button>${index<19?'<button class="primary" onclick="move(1)">下一題 →</button>':''}<button onclick="submitQuiz()">交卷看解析</button><button onclick="home()">返回首頁</button></div><div class="navgrid" aria-label="題號導覽">${session.questions.map((x,i)=>`<button aria-label="第 ${i+1} 題${session.answers[x.id]!==undefined?'，已作答':''}" class="${i===index?'current ':''}${session.answers[x.id]!==undefined?'done':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><small>綠底表示已作答，可隨時切換題號修改答案。未交卷作答不會在重新整理後保留。</small></section>`}
function chooseDisplay(i){const q=session.questions[index];choose(q.id,q.order[i])}
function choose(id,o){session.answers[id]=o;renderQuestion()}
function jump(i){index=i;renderQuestion();document.getElementById('questionHeading').focus()}
function move(n){jump(index+n)}
function submitQuiz(){if(!session||session.result)return;const missing=20-Object.keys(session.answers).length;if(!confirm(missing?`還有 ${missing} 題未作答，交卷將以答錯計算。確定交卷？`:'確定交卷並查看解析？'))return;const details=session.questions.map(q=>({id:q.id,choice:session.answers[q.id]??null,order:q.order}));const correct=details.filter(d=>d.choice===BANK.find(q=>q.id===d.id).answer).length;const result={id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),date:new Date().toISOString(),score:correct*5,correct,seconds:Math.round((Date.now()-session.start)/1000),details};session.result=result;history.unshift(result);persist();filter='all';renderResult(result)}
function viewHistory(id){const h=history.find(h=>h.id===id);if(h){session={result:h};filter='all';renderResult(h)}}
function renderResult(r){const groups={};r.details.forEach(d=>{const q=BANK.find(x=>x.id===d.id);const g=groups[q.topic]??={total:0,correct:0};g.total++;g.correct+=Number(d.choice===q.answer)});app.innerHTML=`<section class="card"><div class="topline"><h2>本回練習結果</h2><small>${esc(new Date(r.date).toLocaleString('zh-TW'))}</small></div><div class="score">${r.score}<small style="font-size:18px"> / 100</small></div><p>答對 ${r.correct} / 20 題 · 用時 ${duration(r.seconds)}</p><p class="muted">${r.score>=80?'觀念逐漸穩固！看看解析，確認自己能說出原因。':'先找出混淆的概念，再用解析中的關鍵線索重新判斷。'}</p><div class="actions"><button class="primary" onclick="start()">再抽 20 題</button><button onclick="home()">回首頁看紀錄</button><button onclick="exportHistory()">匯出成績備份</button></div><h3>各主題表現</h3>${Object.entries(groups).map(([t,g])=>`<span class="pill">${t} ${g.correct}/${g.total}</span>`).join('')}</section><section><div class="topline"><h2>逐題解析</h2><div><button onclick="setFilter('all')" ${filter==='all'?'disabled':''}>全部</button> <button onclick="setFilter('wrong')" ${filter==='wrong'?'disabled':''}>只看錯題</button></div></div><div style="margin-top:18px">${r.details.map((d,i)=>{const q=BANK.find(x=>x.id===d.id),ok=d.choice===q.answer;if(filter==='wrong'&&ok)return '';return `<article class="card review ${ok?'':'bad'}"><span class="pill">${q.kind} · ${q.topic}</span><h3>${i+1}. ${q.q}</h3><p class="${ok?'right':'wrong'}">${ok?'✓ 答對':'✕ '+(d.choice===null?'未作答':'答錯')}｜你的答案：${d.choice===null?'未作答':esc(q.options[d.choice])}</p><p><b>正確答案：${q.options[q.answer]}</b></p><p class="muted">${q.explain}</p></article>`}).join('')}${filter==='wrong'&&r.correct===20?'<div class="card">本回全對，沒有錯題！</div>':''}</div></section>`}
function setFilter(f){filter=f;renderResult(session.result)}
function exportHistory(){const blob=new Blob([JSON.stringify({version:2,bank:'ch5-advanced80-v1',history},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='行銷Ch5消費者市場與購買行為80題成績備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importHistory(input){const file=input.files[0];if(!file)return;try{if(file.size>5000000)throw Error();const data=JSON.parse(await file.text());if(data.version!==2||data.bank!=='ch5-advanced80-v1'||!Array.isArray(data.history)||data.history.length>10000)throw Error();for(const h of data.history){if(!h||typeof h.id!=='string'||!/^[a-z0-9]+$/.test(h.id)||!Number.isFinite(Date.parse(h.date))||!Number.isInteger(h.seconds)||h.seconds<0||!Array.isArray(h.details)||h.details.length!==20||new Set(h.details.map(d=>d.id)).size!==20)throw Error();for(const d of h.details){if(!Number.isInteger(d.id)||!BANK.some(q=>q.id===d.id)||!(d.choice===null||Number.isInteger(d.choice)&&d.choice>=0&&d.choice<4))throw Error()}h.correct=h.details.filter(d=>d.choice===BANK.find(q=>q.id===d.id).answer).length;h.score=h.correct*5}const ids=new Set(history.map(h=>h.id));history=[...history,...data.history.filter(h=>!ids.has(h.id))].sort((a,b)=>new Date(b.date)-new Date(a.date));persist();renderHome();alert('備份已匯入。')}catch(e){alert('無法匯入：請選擇本練習室匯出的有效 JSON 備份。')}input.value=''}
function clearHistory(){if(confirm('確定清除所有歷次成績？建議先匯出備份，清除後無法復原。')){history=[];persist();renderHome()}}
renderHome();
</script></body></html>
