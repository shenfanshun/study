{id:9, t:'pe', stem:'某電商平台要 AI 依據 3 個已標註「正確分類」的商品描述範例，學習如何將新商品描述分類到對應類別，且不對模型參數做任何訓練或調整。這種在 prompt 中直接提供範例、讓模型參考範例作答的方式稱為？',

 o:{A:'LoRA',B:'Batch Inference',C:'Flash Attention',D:'Knowledge Distillation'}, ans:'C',
 ex:'分塊計算、不完整儲存中間矩陣、搭配 Online Softmax，是 Flash Attention 的核心設計；其餘三者雖然也與效率或資源相關，但都不是針對注意力機制記憶體佔用問題的解法。'},
{id:18, t:'opt', stem:'某公司 AI 模型上線後，維運團隊發現正式環境接收到的使用者資料分布與當初訓練時的資料分布已經產生明顯落差，模型準確率逐漸下滑，且不同版本模型與資料集之間的對應關係混亂，難以追蹤是哪個版本造成問題。團隊決定導入一套涵蓋開發、測試、部署、監控的自動化標準流程來解決此問題。這最符合下列哪一項？',
 o:{A:'Fine-Tuning',B:'Context Engineering',C:'MLOps',D:'Batch Inference'}, ans:'C',
 ex:'涵蓋開發、測試、部署、監控的自動化標準流程，並處理版本與資料漂移問題，正是 MLOps；其餘選項都只能片面處理部分問題，無法涵蓋版本控管與流程自動化的整體需求。'},
{id:19, t:'opt', stem:'某智慧工廠希望在產線上的攝影機裝置本身就能即時判斷產品是否有瑕疵，只有在偵測到瑕疵時才把結果傳回雲端，且不希望產品影像資料離開廠內裝置，以避免資料外洩風險與降低網路頻寬負擔。此需求最適合採用下列哪一種架構？',
 o:{A:'Batch Inference（批次推論）',B:'MLOps',C:'Knowledge Distillation',D:'Edge Computing（邊緣運算）'}, ans:'D',
 ex:'需求核心是「裝置端即時判斷、資料不外傳」，正是 Edge Computing 的特徵；Batch Inference 屬非即時處理不符「即時判斷」需求，MLOps 與知識蒸餾也未解決「資料不能離開裝置」的核心要求。'},
{id:20, t:'opt', stem:'某公司同時考慮三種方式縮小模型體積並加快部署：(1) 用少量新參數在既有模型上做小補丁微調；(2) 訓練一個小模型模仿大模型的思考方式；(3) 直接移除大模型中貢獻度低的權重。工程師想確認三者的核心差異，下列敘述何者最正確？',
 o:{A:'(1) 為 LoRA 一類的 PEFT 微調、(2) 為知識蒸餾、(3) 為剪枝，三者做法各不相同',B:'三者本質相同，都是在調整模型的訓練資料而非模型本身',C:'只有 (3) 剪枝屬於模型優化技術，(1) 與 (2) 都與模型大小無關',D:'三者都必須先完成 Full Fine-Tuning 才能執行'}, ans:'A',
 ex:'(1) LoRA 屬 PEFT 微調、(2) 為知識蒸餾、(3) 為剪枝，三者做法與風險各不相同；三者皆直接調整「模型本身」而非訓練資料，且彼此並非互為前置步驟關係。'},

// ---------------- 模型評估 (21-30) ----------------
{id:21, t:'eval', stem:'某 AI 新創公司開發了三套語音辨識系統，想要用統一、客觀的標準比較三者在相同任務上的表現，以決定要採用哪一套上線。他們最應該採用下列哪一種方式？',
 o:{A:'K-Fold 交叉驗證',B:'Benchmark',C:'Data Drift 監測',D:'Cross-Entropy Loss'}, ans:'B',
 ex:'需求是「用統一客觀標準比較不同系統的表現」，正是 Benchmark 的定義；其餘三者分別用於驗證單一模型是否過擬合、偵測資料分布變化、或評估分類機率誤差，皆非用來橫向比較多套系統的工具。'},
{id:22, t:'eval', stem:'某語音助理上線後，使用者反映「講完話要等很久才有回應」，體驗很差。工程團隊想量化評估「系統從接收輸入到回覆完成所需要的時間」，藉此找出優化方向。他們應該進行下列哪一項測試？',
 o:{A:'Cross-Entropy Loss',B:'K-Fold 交叉驗證',C:'延遲測試（Latency Testing）',D:'MMLU 評測'}, ans:'C',
 ex:'「從輸入到回應所需時間」正是延遲測試量測的對象；其餘三者分別評估分類誤差、模型穩定性與知識廣度，皆與回應速度無關。'},
{id:23, t:'eval', stem:'某銀行的信用風險模型訓練時使用的是疫情前的消費行為資料，上線後才發現近年消費型態已大幅改變，模型判斷屢屢失準，即使模型架構與訓練方法都沒有問題。團隊主管形容這是「不是模型不會，而是模型學習的環境跟現在用的環境不一樣了」。這最符合下列哪一個概念？',
 o:{A:'Domain Shift（領域偏移）',B:'Data Drift（資料漂移）',C:'Cross-Entropy Loss 偏高',D:'K-Fold 交叉驗證未確實執行'}, ans:'A',
 ex:'情境強調「模型學習的環境跟現在用的環境不一樣」，屬於整體環境改變的 Domain Shift；Data Drift 較側重資料分布本身的變化，且情境明確指出訓練方法與架構皆無問題，故排除損失函數計算錯誤與交叉驗證執行問題。'},
{id:24, t:'eval', stem:'某電商推薦系統上線一段時間後，工程團隊發現使用者實際瀏覽行為的資料分布（如年齡層比例、瀏覽裝置種類）已經和當初訓練模型時所使用的資料分布出現明顯差異，導致推薦準確度下滑，但模型本身架構未曾更動。這種現象最貼切的說法是？',
 o:{A:'Data Drift（資料漂移）',B:'Domain Shift（領域偏移）',C:'Cross-Entropy Loss 上升',D:'MAE 上升'}, ans:'A',
 ex:'情境明確描述「使用者瀏覽行為的資料分布」隨時間改變，屬於 Data Drift 的定義；Domain Shift 較著重整體使用環境改變而非單純資料分布變化，Cross-Entropy Loss 與 MAE 則是誤差指標而非現象描述。'},
{id:25, t:'eval', stem:'某房價預測模型的評估報告顯示，預測誤差的計算方式是「先將每筆預測值與實際值相減取絕對值，再全部平均」，得到的誤差單位與房價單位相同（例如「平均誤差 50 萬元」），且對於少數幾筆離群的極端誤差案例不會過度放大整體分數。這最符合下列哪一項指標？',
 o:{A:'MSE（Mean Squared Error）',B:'Cross-Entropy Loss',C:'MAE（Mean Absolute Error，平均絕對誤差）',D:'K-Fold 交叉驗證'}, ans:'C',
 ex:'「取絕對值後平均、單位與原資料相同、對離群值不敏感」正是 MAE 的定義；MSE 會放大極端值影響，Cross-Entropy Loss 用於分類、K-Fold 用於資料切分驗證，皆與此情境描述不符。'},
{id:26, t:'eval', stem:'某工廠設備故障預測模型的評估團隊希望「讓少數幾次判斷嚴重失準的案例，對整體評估分數造成更大的懲罰」，因為這類重大誤判在實務上代價極高，因此決定改用「將每筆誤差平方後再平均」的方式計算誤差。下列敘述何者最正確？',
 o:{A:'MAE（Mean Absolute Error）',B:'MSE（Mean Squared Error）',C:'Cross-Entropy Loss',D:'Benchmark'}, ans:'B',
 ex:'「誤差平方後再平均、放大極端誤差影響」正是 MSE 的特徵；MAE 對離群值的懲罰是線性的、不會特別放大，Cross-Entropy Loss 用於分類任務，Benchmark 則用於橫向比較而非計算誤差。'},
{id:27, t:'eval', stem:'某醫療影像分類模型有兩種預測結果：模型 A 對錯誤答案給出 99% 的高信心分數；模型 B 對錯誤答案只給出 51% 的低信心分數。單純看 Accuracy（準確率），兩者都被記為「答錯一題」，無法區分兩者風險程度的差異。若要衡量「模型錯得有多離譜、多有自信」，應改用下列哪一種指標？',
 o:{A:'Accuracy（準確率）',B:'MAE',C:'Cross-Entropy Loss',D:'Latency Testing'}, ans:'C',
 ex:'要衡量「模型錯得多離譜、多有自信」需比較機率分布與真實答案的差距，正是 Cross-Entropy Loss 的作用；Accuracy 無法反映信心程度，MAE 用於迴歸任務，Latency Testing 與答對與否無關。'},
{id:28, t:'eval', stem:'某研究團隊訓練的模型在單一次的訓練/測試資料切分下表現極佳，但主管擔心這只是「運氣好切到一組對模型有利的測試資料」，希望的評估方式是讓資料集中每一筆資料都輪流當過訓練資料與測試資料，以得到更穩定、更具代表性的評估結果。下列何者最符合此需求？',
 o:{A:'只需擴大單一測試資料集的筆數即可',B:'Domain Shift 偵測',C:'Benchmark 比較',D:'K-Fold 交叉驗證'}, ans:'D',
 ex:'讓每筆資料都輪流當訓練與測試角色、降低單一切分偏差，正是 K-Fold 交叉驗證的核心目的；擴大測試集筆數並無法解決「切分方式偏頗」的問題，Domain Shift 偵測與 Benchmark 比較則是不同目的的評估方式。'},
{id:29, t:'eval', stem:'某 AI 團隊要為新開發的中文語言模型挑選合適的評測基準，目標是「以全中文題目、選擇題形式，測試模型的中文知識、推理與語言理解能力」，且該基準需能反映模型在中文情境下的綜合能力。下列哪一個 Benchmark 最符合需求？',
 o:{A:'C-Eval',B:'MMLU',C:'GSM8K',D:'AIME'}, ans:'A',
 ex:'需求明確是「全中文、測試中文知識推理與語言理解」，對應 C-Eval；MMLU、GSM8K、AIME 皆以英文出題，且側重跨領域知識或數學能力，並非針對中文語言理解設計。'},
{id:30, t:'eval', stem:'某教育科技公司要評估旗下三個數學輔導 AI 的解題邏輯能力，並依照難度分級進行測試：先用小學程度的基礎應用題把明顯較弱的模型篩掉，再用高中到競賽等級的題目，最後用奧林匹亞等級的超高難度題目來區分頂尖模型間的差異。下列對應何者最正確？',
 o:{A:'依序應為 AIME → MATH → GSM8K，難度依序遞增',B:'三者難度完全相同，差異只在於出題語言為中文或英文',C:'應改用 C-Eval 取代這三者',D:'依序應為 GSM8K（小學程度）→ MATH（高中至競賽程度）→ AIME（奧林匹亞等級），難度依序遞增'}, ans:'D',
 ex:'難度依序為 GSM8K（小學）→ MATH（高中至競賽）→ AIME（奧林匹亞等級），由易到難遞增；三者皆為英文數學題庫、難度不同，C-Eval 則是全中文綜合知識測驗，並非數學難度分級題庫。'},

// ---------------- NLP/LLM (31-40) ----------------
{id:31, t:'nlp', stem:'某公司要開發中文命名實體辨識系統（判斷句子中哪些詞是「人名」「地名」），在深度學習模型尚未普及的年代，工程師採用一種會同時考慮「當前詞的特徵」與「前後文脈絡關係」的序列標註模型，而非像 Logistic Regression 那樣逐點獨立判斷。這最可能是採用下列哪一種模型？',
 o:{A:'Logistic Regression',B:'CRF（Conditional Random Field，條件隨機場）',C:'BERT',D:'Beam Search'}, ans:'B',
 ex:'情境特別強調「非深度學習時代」且「同時考慮局部特徵與上下文」，符合 CRF 特徵；Logistic Regression 逐點獨立判斷不考慮上下文，BERT 屬深度學習時代模型，Beam Search 則是生成搜尋策略而非分類模型。'},
{id:32, t:'nlp', stem:'某翻譯系統在生成譯文時，並非只選擇當下機率最高的單一候選詞就直接往下走，而是同時保留多個可能不錯的候選翻譯路徑，逐步比較後才挑出整體最通順、最合理的一句譯文。這種生成策略稱為？',
 o:{A:'Greedy Search（貪婪搜尋）',B:'Beam Search（集束搜尋）',C:'CRF',D:'K-Fold Cross-Validation'}, ans:'B',
 ex:'「同時保留多個候選路徑、逐步比較後才擇優」正是 Beam Search 的特徵；Greedy Search 只選擇當下最高機率的單一路徑，與情境描述相反；CRF 為分類模型、K-Fold 為評估方法，皆與生成策略無關。'},
{id:33, t:'nlp', stem:'某客服系統需要模型「根據使用者提供的訂單編號與問題描述」生成客製化回覆，而不是憑空生成一段與輸入無關的文字。這種「依據給定輸入條件來生成內容」的語言模型稱為？',
 o:{A:'純粹的 Language Model',B:'CRF',C:'BERT',D:'Conditional Language Model（條件式語言模型）'}, ans:'D',
 ex:'「根據訂單編號與問題描述生成客製化回覆」正是依輸入條件生成內容的 Conditional Language Model；純語言模型不考慮額外條件，CRF 非生成模型，BERT 則擅長理解而非生成。'},
{id:34, t:'nlp', stem:'某公司要開發文件分類系統，需要模型在判斷一個詞的意思時，同時參考該詞「前面」與「後面」的完整上下文，而不是只從左到右單向閱讀。此外該模型主要用於「理解」任務（分類、問答），而非用來生成大段落文字。下列哪一個模型最符合描述？',
 o:{A:'傳統單向生成式模型',B:'CRF',C:'BERT',D:'Beam Search'}, ans:'C',
 ex:'「同時參考詞的前後完整上下文、主要用於理解類任務」正是 BERT 的特徵；單向生成式模型僅能從左到右閱讀，CRF 非 Transformer 架構，Beam Search 則是生成搜尋策略而非理解模型。'},
{id:35, t:'nlp', stem:'某企業內部 AI 助理需要處理長達數萬字的合約全文，並要求模型能理解合約前段條款與後段條款之間的關聯，而不是把長文件切片後各自獨立理解。工程師特別挑選一款標榜「能記住、理解非常長輸入文字，並支援跨段落推理」的模型。這個能力最直接對應下列哪一個概念？',
 o:{A:'Context Window',B:'Temperature',C:'Beam Search',D:'Long-Context 能力'}, ans:'D',
 ex:'「能記住、理解非常長輸入文字，並支援跨段落推理」是 Long-Context 這項整體能力的描述，而不只是 token 上限這個數字（Context Window）；Temperature 與 Beam Search 皆與長文本理解能力無關。'},
{id:36, t:'nlp', stem:'某開發團隊在 API 文件中看到「此模型一次最多只能處理 128,000 個 token，超過會被截斷」的規格描述。這個「一次最多能放多少 token 的硬性上限數字」，指的是下列哪一個概念？',
 o:{A:'Long-Context',B:'Context Window',C:'Beam Search 寬度',D:'Temperature'}, ans:'B',
 ex:'「一次最多能處理的 token 數量上限」正是 Context Window 的定義；Long-Context 是模型整體理解長文的能力表現而非單純的數字上限，Beam Search 寬度與 Temperature 皆與 token 上限無關。'},
{id:37, t:'nlp', stem:'某產品經理要求 AI 助理「請用非常保守、幾乎每次都給出相同答案的方式回答客戶的退換貨政策問題，避免回答內容天馬行空」，工程師因此將某項生成參數設定在 0~0.3 的低區間。這項參數是？',
 o:{A:'Temperature',B:'Context Window',C:'K 值（K-Fold）',D:'Beam Width'}, ans:'A',
 ex:'「調降至 0~0.3 的低區間、讓回答保守固定」正是低 Temperature 設定的效果；Context Window 與 token 上限有關、K 值用於交叉驗證切分、Beam Width 影響候選路徑數量，皆非控制回答隨機創意程度的參數。'},
{id:38, t:'nlp', stem:'某 AI 寫作助理系統中，使用者只要在指令中加入「請正式一點回答」「請用小學生能懂的方式解釋」等短語，AI 就會切換不同的回應風格與難度，這些短語本身並不是要 AI 回答的「內容」，而更像是操控 AI 行為模式的開關。這種特殊指令詞最貼切的說法是？',
 o:{A:'Control Tokens（控制變量／控制詞）',B:'Few-Shot 範例',C:'Beam Search',D:'Cross-Entropy Loss'}, ans:'A',
 ex:'「請正式一點回答」等短語是切換 AI 行為模式的指令而非要回答的內容，正是 Control Tokens 的定義；Few-Shot 範例是提供例子而非模式開關，Beam Search 與 Cross-Entropy Loss 則分別是生成搜尋策略與損失函數，皆非此處描述的指令詞。'},
{id:39, t:'nlp', stem:'某新進工程師在會議中主張：「只要把 Context Window 的上限數字調大，模型自然就會擁有處理長文件的能力，這兩者完全是同一件事。」資深主管認為這個說法並不精確。下列何者最能反駁該新進工程師？',
 o:{A:'兩者確實完全相同',B:'Context Window 只與生成速度有關',C:'Long-Context 指的是模型參數量的大小',D:'Context Window 是上限數字，Long-Context 是模型能否妥善理解長輸入的整體能力，兩者不同'}, ans:'D',
 ex:'Context Window 只是上限數字，Long-Context 才是模型是否真的能妥善理解長輸入的整體能力，僅擴大上限數字不代表模型真的能有效理解超長內容；其餘選項對兩者的描述皆不正確。'},
{id:40, t:'nlp', stem:'某客服中心的訓練資料只有少量標記案例，工程師想在「不訓練模型、只是判斷句子語意情境」的情況下辨識客戶語氣是「抱怨」還是「稱讚」，且需要同時參考句子的前後文才能正確判斷（例如「這個服務⋯真的是我用過最『棒』的了」需配合語氣判斷是反諷還是稱讚）。下列何者最能描述此處「同時參考前後文判斷語意」的技術特性？',
 o:{A:'單向上下文',B:'雙向上下文（Bidirectional Context）',C:'Beam Search',D:'Batch Inference'}, ans:'B',
 ex:'「同時參考前後文才能正確判斷語氣是否反諷」正是雙向上下文的特徵；單向上下文僅參考前面文字，Beam Search 與 Batch Inference 則分別是生成搜尋策略與部署方式，皆與語意理解技術無關。'},

// ---------------- RAG 與檢索 (41-50) ----------------
{id:41, t:'rag', stem:'某企業內部 AI 助理常常「一本正經地胡說八道」，針對公司內部規定給出看似合理但實際錯誤的答案，因為這些規定並未出現在模型訓練資料中。工程師決定在 AI 回答前，先讓系統從公司內部文件庫中檢索出相關規定段落，再連同問題一起交給模型生成答案。這種作法稱為？',

{id:42, t:'rag', stem:'某公司想讓內部 AI 助理能夠直接讀取公司的 Slack 訊息、存取 GitHub 上的程式碼庫，並操作內部資料庫，而不希望每接入一個新工具就要重新開發一套客製化串接程式。團隊決定採用 Anthropic 於 2024 年底發布的開放標準協議，統一 AI 應用與各種外部工具/資料來源之間的連接方式，被稱為「AI 界的 USB-C」。這最符合下列哪一項技術？',
 o:{A:'MCP（Model Context Protocol，模型上下文協議）',B:'RAG',C:'Multi-vector Retriever',D:'Chunking'}, ans:'A',

 ex:'使用者操作的 AI 應用（如 Claude Desktop）為 MCP Host，其內部負責與外部服務建立連線的元件為 MCP Client；MCP Server 才是提供工具與資料的服務端，三者角色並不相同也不可互相取代。'},

{id:45, t:'rag', stem:'某公司同時在專案中導入 RAG 與 MCP 兩項技術，工程師想跟主管解釋兩者的差異與定位，下列說明何者最正確？',

{id:46, t:'rag', stem:'某法律事務所要將一份長達 200 頁的判決書全文交給 AI 做問答輔助，但直接把全文塞進提示詞會嚴重超出模型的上下文長度限制。工程師因此先將全文拆分成多個具有完整語意的小段落，之後才對每個小段落分別建立向量並存入向量資料庫以供檢索。這個「先把長文件拆分成小段落」的步驟稱為？',
 o:{A:'Embedding',B:'Chunking（分塊）',C:'Multi-vector Retriever',D:'MCP'}, ans:'B',
 ex:'「先把長文件拆分成具語意完整性的小段落」正是 Chunking 的定義；Embedding 是切分後的向量化步驟，Multi-vector Retriever 是檢索技巧而非切分步驟，MCP 則與文件切分無關。'},
{id:47, t:'rag', stem:'某企業 RAG 系統原本為每份文件只建立一個向量代表整份文件的整體語意，但檢索命中率一直不理想，因為使用者的提問角度五花八門（有時問細節、有時問摘要、有時問特定條款）。工程師改為針對同一份文件，從不同角度（如摘要向量、細節向量、關鍵字向量）分別建立多個向量再存入資料庫檢索。這種做法稱為？',

{id:48, t:'rag', stem:'某企業要建置 RAG 系統，工程師規劃的完整流程為：先將內部文件拆解成適當大小的段落，再將每個段落轉換成向量並存入向量資料庫，使用者提問時，系統依語意相似度找出最相關的段落，最後將這些段落連同問題一併交給語言模型生成回答。下列對應何者最正確？',

 ex:'正確的 RAG 流程為先切分文件（Chunking）、再向量化（Embedding）、存入向量資料庫，使用者提問時才進行檢索（Retrieval），最後生成答案（Generation）；其餘選項的步驟順序皆不合理（例如尚未切分就無法向量化，也不可能先生成答案再檢索）。'},
{id:49, t:'rag', stem:'某企業的客服 AI 助理需要「即時查詢公司最新退換貨政策文件」以確保回答正確性與時效性，同時也需要「直接呼叫訂單系統 API 查詢客戶的訂單狀態」。工程師認為第一項需求應交由檢索外部知識庫的技術處理，第二項需求則應交由標準化的工具串接協議處理。下列配對何者最正確？',

{id:50, t:'rag', stem:'某圖書館比喻常用來說明 RAG 流程：「把一整本書拆成一段一段」對應 Chunking，「幫每一段內容標上語意座標方便查找」對應 Embedding，「依照讀者的問題找出最相關的段落」對應 Retriever。若某本書特別厚重、內容涉及多重主題，圖書館員決定「為同一段內容，從摘要、關鍵字、細節等不同角度分別建立座標，方便從更多角度被找到」，這對應下列哪一項技巧？',
 o:{A:'Multi-vector Retriever',B:'Chunking',C:'MCP',D:'Embedding'}, ans:'A',
 ex:'「為同一段內容，從摘要、關鍵字、細節等不同角度分別建立座標」正是 Multi-vector Retriever 的定義；Chunking 只涉及段落切分、Embedding 只是建立單一向量的基礎步驟、MCP 則與此比喻中的檢索命中率提升無關。'},

let mode = 'quiz'; // 'quiz' or 'all'
let quizIds = [3,5,10,12,20,25,29,30,32,33,34,40,41,43,45];
const answered = {}; // id -> chosen key

function pickRandom15(){
  const pool = Q.map(q=>q.id);
  for(let i=pool.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }
  return pool.slice(0,15).sort((a,b)=>a-b);
}

function currentIds(){
  return mode==='quiz' ? quizIds : Q.map(q=>q.id);
}

function render(){
  const area = document.getElementById('quizArea');
  area.innerHTML = '';
  const ids = currentIds();
  let lastTopic = null;
  let displayNo = 0;
  ids.forEach(id=>{
    const q = Q.find(x=>x.id===id);
    if(q.t !== lastTopic){
      lastTopic = q.t;
      const tm = TOPIC[q.t];
      const tag = document.createElement('span');
      tag.className = 'section-tag ' + tm.tag;
      tag.textContent = '◈ ' + tm.name;
      area.appendChild(tag);
    }
    displayNo++;
    const card = document.createElement('div');
    card.className = 'card ' + TOPIC[q.t].card;
    card.innerHTML = `<h3><span class="no">第 ${displayNo} 題</span>${TOPIC[q.t].name}</h3>
      <div class="stem">${q.stem}</div>
      <div class="opts" data-id="${q.id}">
        ${['A','B','C','D'].map(k=>`<div class="opt" data-k="${k}"><span class="k">${k}.</span>${q.o[k]}</div>`).join('')}
      </div>
      <div class="explain" id="ex-${q.id}"><b>解析：</b>${q.ex}</div>`;
    area.appendChild(card);

    const optsWrap = card.querySelector('.opts');
    optsWrap.querySelectorAll('.opt').forEach(optEl=>{
      optEl.addEventListener('click', ()=>{
        if(answered[q.id]) return;
        answered[q.id] = optEl.dataset.k;
        optsWrap.querySelectorAll('.opt').forEach(o=>{
          o.classList.add('disabled');
          if(o.dataset.k === q.ans) o.classList.add('correct');
          else if(o.dataset.k === optEl.dataset.k) o.classList.add('wrong');
        });
        document.getElementById('ex-'+q.id).classList.add('show');
        updateScore();
      });
    });
  });
  updateScore();
}

function updateScore(){
  const ids = currentIds();
  let ansCount=0, correct=0;
  ids.forEach(id=>{
    if(answered[id]){
      ansCount++;
      const q = Q.find(x=>x.id===id);
      if(answered[id]===q.ans) correct++;
    }
  });
  document.getElementById('score').innerHTML = `已作答 ${ansCount} / ${ids.length}　答對 <b>${correct}</b>`;
}

document.getElementById('btnQuiz').addEventListener('click', ()=>{
  mode='quiz';
  document.getElementById('btnQuiz').classList.add('active');
  document.getElementById('btnAll').classList.remove('active');
  render();
});
document.getElementById('btnAll').addEventListener('click', ()=>{
  mode='all';
  document.getElementById('btnAll').classList.add('active');
  document.getElementById('btnQuiz').classList.remove('active');
  render();
});
document.getElementById('btnShuffle').addEventListener('click', ()=>{
  quizIds = pickRandom15();
  quizIds.forEach(id=>{ delete answered[id]; });
  if(mode==='quiz') render(); else updateScore();
});
document.getElementById('btnReset').addEventListener('click', ()=>{
  currentIds().forEach(id=> delete answered[id]);
  render();
});

render();
</script>

</html>
