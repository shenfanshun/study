<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 應用規劃師（初級）｜科目二 隨機測驗</title>
<style>
  :root{
    --ink:#14213d;
    --ink-soft:#3a4668;
    --paper:#f7f5ef;
    --card:#ffffff;
    --line:#e3ded1;
    --accent:#0b7a75;
    --accent-deep:#075e5a;
    --gold:#c8992e;
    --wrong:#c0392b;
    --wrong-bg:#fbeceb;
    --right:#0b7a75;
    --right-bg:#e7f4f2;
    --shadow:0 8px 30px rgba(20,33,61,.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:
      radial-gradient(1200px 500px at 100% -10%, rgba(11,122,117,.07), transparent 60%),
      radial-gradient(900px 400px at -10% 110%, rgba(200,153,46,.08), transparent 55%),
      var(--paper);
    color:var(--ink);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px;margin:0 auto;padding:32px 20px 80px;}

  header.masthead{
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:8px;
  }
  .eyebrow{
    font-size:12px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--accent-deep);font-weight:700;margin:0 0 6px;
  }
  h1{
    font-size:clamp(26px,5vw,38px);margin:0;font-weight:800;letter-spacing:-.5px;
    line-height:1.2;
  }
  .sub{color:var(--ink-soft);margin:10px 0 0;font-size:15px;}
  .meta-row{
    display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:16px;font-size:13px;
    color:var(--ink-soft);
  }
  .meta-row b{color:var(--ink);font-weight:700;}

  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:28px;margin-top:26px;
  }

  .start-copy{font-size:15px;color:var(--ink-soft);margin:0 0 20px;}
  .mode-label{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-deep);font-weight:700;margin:0 0 10px;}
  .mode-grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;}
  .mode-btn{
    flex:1;min-width:150px;border:1.5px solid var(--line);background:#fff;
    border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;
    transition:.18s;font-family:inherit;
  }
  .mode-btn:hover{border-color:var(--accent);transform:translateY(-1px);}
  .mode-btn.active{border-color:var(--accent);background:var(--right-bg);}
  .mode-btn .t{font-weight:700;font-size:15px;color:var(--ink);}
  .mode-btn .d{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

  .btn{
    display:inline-flex;align-items:center;gap:8px;justify-content:center;
    background:var(--accent);color:#fff;border:none;border-radius:12px;
    padding:14px 26px;font-size:16px;font-weight:700;cursor:pointer;
    font-family:inherit;transition:.18s;box-shadow:0 4px 14px rgba(11,122,117,.28);
  }
  .btn:hover{background:var(--accent-deep);transform:translateY(-1px);}
  .btn.ghost{
    background:#fff;color:var(--accent-deep);border:1.5px solid var(--accent);
    box-shadow:none;
  }
  .btn.ghost:hover{background:var(--right-bg);}
  .btn-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;}

  /* progress */
  .progress-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .progress-head .count{font-weight:800;font-size:15px;}
  .progress-head .tag{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent-deep);font-weight:700;}
  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:24px;}
  .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .35s;}

  .qtype{
    display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.12em;
    padding:3px 10px;border-radius:99px;margin-bottom:12px;
  }
  .qtype.know{background:#eef4f3;color:var(--accent-deep);}
  .qtype.case{background:#f6efe0;color:#8a6a12;}

  .qstem{font-size:18px;font-weight:700;line-height:1.6;margin:0 0 20px;}

  .options{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}
  .opt{
    border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;cursor:pointer;
    display:flex;gap:12px;align-items:flex-start;transition:.15s;background:#fff;font-size:15.5px;
  }
  .opt:hover{border-color:var(--accent);background:#fbfdfc;}
  .opt .key{
    flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);
    display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--ink-soft);
    transition:.15s;
  }
  .opt.correct{border-color:var(--right);background:var(--right-bg);}
  .opt.correct .key{background:var(--right);border-color:var(--right);color:#fff;}
  .opt.wrong{border-color:var(--wrong);background:var(--wrong-bg);}
  .opt.wrong .key{background:var(--wrong);border-color:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;pointer-events:none;}
  .opt.dim{opacity:.55;}

  .explain{
    margin-top:16px;border-left:4px solid var(--accent);background:#f1f7f6;
    padding:14px 16px;border-radius:0 10px 10px 0;font-size:14.5px;color:var(--ink-soft);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--ink);}

  .nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;}

  /* results */
  .score-hero{text-align:center;padding:10px 0 6px;}
  .score-num{font-size:56px;font-weight:800;line-height:1;letter-spacing:-1px;}
  .score-num small{font-size:22px;color:var(--ink-soft);font-weight:700;}
  .score-msg{font-size:16px;color:var(--ink-soft);margin-top:8px;}
  .ring{
    width:130px;height:130px;border-radius:50%;margin:0 auto 4px;
    display:grid;place-items:center;
  }
  .review-item{border-top:1px solid var(--line);padding:16px 0;}
  .review-item:first-of-type{border-top:none;}
  .review-q{font-weight:700;font-size:15px;margin:0 0 8px;}
  .review-line{font-size:14px;margin:3px 0;}
  .review-line .lab{display:inline-block;min-width:70px;color:var(--ink-soft);}
  .ok{color:var(--right);font-weight:700;}
  .no{color:var(--wrong);font-weight:700;}
  .rev-badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;margin-left:6px;}
  .rev-badge.k{background:#eef4f3;color:var(--accent-deep);}
  .rev-badge.c{background:#f6efe0;color:#8a6a12;}

  footer{text-align:center;color:var(--ink-soft);font-size:12.5px;margin-top:40px;}
  .hidden{display:none;}
  @media(max-width:600px){
    .panel{padding:20px;}
    .qstem{font-size:16.5px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">iPAS · 初級能力鑑定</p>
    <h1>AI 應用規劃師｜科目二 隨機測驗</h1>
    <p class="sub">生成式 AI 應用與規劃　—　No Code / Low Code 概念、應用領域與導入評估</p>
    <div class="meta-row">
      <span>題庫共 <b id="poolTotal">50</b> 題</span>
      <span>每回抽出 <b>10</b> 題</span>
      <span>知識題 <b>30</b>　情境題 <b>20</b></span>
    </div>
  </header>

  <!-- START -->
  <section id="startScreen" class="panel">
    <p class="start-copy">每次作答會從題庫隨機抽出 10 題，選完即知道對錯與解析。你可以選擇抽題範圍：</p>
    <p class="mode-label">出題範圍</p>
    <div class="mode-grid">
      <button class="mode-btn active" data-mode="all">
        <div class="t">綜合題</div><div class="d">知識題＋情境題混合抽 10 題</div>
      </button>
      <button class="mode-btn" data-mode="know">
        <div class="t">知識題</div><div class="d">僅抽概念與事實題</div>
      </button>
      <button class="mode-btn" data-mode="case">
        <div class="t">情境題</div><div class="d">僅抽應用與判斷情境題</div>
      </button>
    </div>
    <button class="btn" id="startBtn">開始測驗　→</button>
  </section>

  <!-- QUIZ -->
  <section id="quizScreen" class="panel hidden">
    <div class="progress-head">
      <span class="count">第 <span id="curIdx">1</span> / 10 題</span>
      <span class="tag" id="qtypeTag">知識題</span>
    </div>
    <div class="bar"><span id="barFill" style="width:10%"></span></div>

    <span class="qtype know" id="qBadge">知識題</span>
    <p class="qstem" id="qStem">題目</p>
    <ul class="options" id="optList"></ul>
    <div class="explain" id="explainBox"></div>

    <div class="nav">
      <span style="font-size:13px;color:var(--ink-soft);align-self:center;">目前得分：<b id="liveScore">0</b></span>
      <button class="btn hidden" id="nextBtn">下一題　→</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="resultScreen" class="panel hidden">
    <div class="score-hero">
      <div class="ring" id="ring">
        <div>
          <div class="score-num"><span id="finalScore">0</span><small> / 10</small></div>
        </div>
      </div>
      <p class="score-msg" id="scoreMsg"></p>
    </div>
    <div class="btn-row" style="justify-content:center;margin:18px 0 26px;">
      <button class="btn" id="againBtn">再考一次（重新抽題）</button>
      <button class="btn ghost" id="homeBtn">回到首頁</button>
    </div>
    <div id="reviewList"></div>
  </section>

  <footer>依《生成式 AI 應用與規劃》學習指引第三章製作　·　僅供自我練習</footer>
</div>

<script>
/* ---------- 題庫 ----------
   answer 為正確選項索引 (0=A,1=B,2=C,3=D) ---------- */
const QUESTIONS = [
  /* ============ 知識題 30 ============ */
  {type:"know",q:"No Code 與 Low Code 平台被視為推動下列何者的重要力量？",
   opts:["AI 民主化，讓更多非技術人員參與 AI 創建","半導體製程邁向奈米級的微縮技術突破","區塊鏈分散式帳本的去中心化共識機制","量子位元運算效能的國際標準化制定"],a:0,
   e:"指引指出 No Code 與 Low Code 平台已成為推動 AI 民主化的重要力量，讓非技術背景人員也能參與 AI 的創建與部署。"},

  {type:"know",q:"下列何者最能描述 No Code 平台的核心特點？",
   opts:["以視覺化介面與拖放操作即可開發，無需編寫程式碼","須撰寫大量後端程式碼以串接底層資料庫服務","僅開放給具備多年經驗的資深軟體工程師操作","只能輸出無互動的靜態文件而無法建立應用"],a:0,
   e:"No Code 平台透過視覺化介面和拖放操作，讓使用者無需編寫程式碼即可快速開發應用。"},

  {type:"know",q:"Low Code 平台相較於 No Code 平台，最主要的差異是什麼？",
   opts:["結合視覺化工具並允許撰寫少量程式碼實現深度整合","完全不提供任何視覺化介面且僅能純文字操作","只能用於開發單機小遊戲而不支援商業系統","無法與企業內部既有系統進行任何資料串接"],a:0,
   e:"Low Code 平台結合視覺化開發工具與程式碼擴充功能，讓有技術背景者透過少量程式碼實現深度整合、客製化與複雜邏輯。"},

  {type:"know",q:"Low Code 平台特別適合哪一類使用場景？",
   opts:["中大型企業與需要高彈性功能的應用開發","僅供個人記事與待辦清單的簡單管理","純展示用途且不需互動的靜態網頁","完全不需與外部系統整合的離線工具"],a:0,
   e:"Low Code 特別適合中大型企業，以及需要高彈性功能的應用開發，能有效提升開發效率並保留程式設計的靈活性。"},

  {type:"know",q:"下列哪一組工具在指引中被提到已推出視覺化介面，讓無程式設計經驗者也能建立機器學習模型？",
   opts:["TensorFlow 及 Keras","Photoshop 及 Illustrator","Word 及 Excel","Chrome 及 Safari"],a:0,
   e:"指引提到 TensorFlow 及 Keras 等工具已推出視覺化介面，讓無程式設計經驗的使用者也能輕鬆建立機器學習模型。"},

  {type:"know",q:"生成式 AI 與 No Code / Low Code 結合時，「自動生成程式碼」帶來的主要效益為何？",
   opts:["協助開發客製化功能並節省開發時間","顯著提高整體系統的硬體耗電量","單純增加專案程式碼的總行數","降低使用者參與開發流程的程度"],a:0,
   e:"AI 協助開發客製化功能，能節省開發時間，是兩者結合的重要效益之一。"},

  {type:"know",q:"在醫療保健領域，生成式 AI 的下列哪一項應用有助於「縮短研發週期」？",
   opts:["分析生醫數據並預測分子結構的藥物發現","即時產出吸引人文案的自動化行銷生成","預測需求並優化補貨策略的庫存管理","模擬市場情境協助決策的風險評估管理"],a:0,
   e:"生成式 AI 可分析大量生物醫學數據、預測分子結構，協助新藥開發並縮短研發週期。"},

  {type:"know",q:"生成式 AI 在製造業「生產流程優化」的主要作用是什麼？",
   opts:["透過數據分析提供製程改善建議並精準化生產","為新產品設計吸睛的宣傳海報與行銷素材","協助撰寫具法律效力的商業合約與條款","模擬各種金融市場情境以評估投資風險"],a:0,
   e:"透過數據分析提供製程改善建議，實現自動化與精準化生產，可提升效率並降低成本。"},

  {type:"know",q:"下列何者屬於生成式 AI 在金融業的應用？",
   opts:["模擬市場情境的風險評估與管理","快速整理病歷的病歷自動生成","依課綱產出教材的自動化生成","分析設計數據的產品原型製作"],a:0,
   e:"金融業應用包含風險評估與管理、投資組合優化、自動化合規監管等。"},

  {type:"know",q:"生成式 AI 在零售業的「庫存與供應鏈管理」主要能做什麼？",
   opts:["預測產品需求並優化補貨與庫存策略","為程式模組自動撰寫單元測試腳本","針對候選藥物進行分子結構的預測","模擬金融市場情境以協助風險決策"],a:0,
   e:"AI 預測產品需求，優化補貨與庫存策略，能降低庫存成本。"},

  {type:"know",q:"在教育領域，生成式 AI 的「個人化學習路徑」是依據什麼來設計？",
   opts:["學生的學習進度和興趣","學校所在的地理位置","授課教師的年資深淺","教室內的座位配置圖"],a:0,
   e:"依據學生的學習進度和興趣，生成式 AI 能設計個人化的學習計畫，提升學習效果。"},

  {type:"know",q:"生成式 AI 在客戶服務的「虛擬智慧客服」可提供什麼特性的服務？",
   opts:["可模擬真人對話的 24/7 客戶支援","僅限公司上班時段的人工回覆","只能回覆事先寫好的罐頭訊息","需由專員逐字打字回覆的客服"],a:0,
   e:"虛擬智慧客服可模擬真人對話，提供更親切且易於理解的 24/7 客戶支援服務。"},

  {type:"know",q:"選擇與評估 No Code / Low Code 平台時，指引列出的關鍵考量因素共有幾個？",
   opts:["6 個","3 個","9 個","12 個"],a:0,
   e:"指引列出選擇與評估平台時需考量的 6 個關鍵因素。"},

  {type:"know",q:"「系統整合能力」屬於平台評估的哪一個考量面向？",
   opts:["功能與擴展性","安全性與合規性","成本與效益","市場評價與案例"],a:0,
   e:"評估平台與現有系統（如 CRM、ERP）的整合能力，屬於「功能與擴展性」面向。"},

  {type:"know",q:"TCO（Total Cost of Ownership，總擁有成本）屬於哪一評估面向？",
   opts:["成本與效益","目標用戶與技術需求","安全性與合規性","技術支援與社群資源"],a:0,
   e:"TCO 考量平台購買、維護、培訓等相關成本，屬於「成本與效益」面向。"},

  {type:"know",q:"ROI 指的是下列何者？",
   opts:["投資回報率，衡量平台帶來的效益價值","資料保護率，衡量資料加密的強度","系統反應率，衡量整體運算的速度","人力配置率，衡量團隊的規模大小"],a:0,
   e:"ROI（Return On Investment，投資回報率）衡量平台在縮短開發週期、提升效率等效益，確保投資具有實際價值。"},

  {type:"know",q:"下列何者屬於平台評估中「安全性與合規性」的內容？",
   opts:["資料加密、身份驗證與權限管理","開發者社群的活躍與互動程度","平台整體的總擁有成本估算","同業導入的成功案例與口碑"],a:0,
   e:"安全性與合規性包含資料安全與隱私保護（加密、身份驗證等）與細緻的權限管理。"},

  {type:"know",q:"生成式 AI 與 No Code / Low Code 結合時，指引提到需遵循哪些個資相關法規？",
   opts:["GDPR、CCPA","HTML、CSS","TCP、UDP","JPEG、PNG"],a:0,
   e:"在資料隱私與安全性挑戰中，指引提到需遵循個資法如 GDPR、CCPA 等相關法規。"},

  {type:"know",q:"針對「模型準確性與可靠性」挑戰，指引提出的解方是什麼？",
   opts:["建立多層次驗證，結合自動化檢測與人工審核","將所有判斷完全交由 AI 模型自動決定","直接停用平台上的全部生成式 AI 功能","僅倚賴單一次測試即發布至生產環境"],a:0,
   e:"解方為建立多層次驗證機制，結合自動化檢測與人工審核，確保生成內容的準確性與一致性。"},

  {type:"know",q:"針對「道德與倫理風險」（如偏見與歧視），指引提出的解方為何？",
   opts:["建立倫理準則與規範並導入公平性檢測工具","僅無限制擴增訓練資料量即可自然消除","改用參數更大的模型便能徹底解決偏見","關閉輸出端的內容審查以加快回應速度"],a:0,

/* ---------- 邏輯 ---------- */
const LETTERS = ["A","B","C","D"];
let mode="all", pool=[], idx=0, score=0, answered=false, session=[];

const $=id=>document.getElementById(id);

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

/* mode buttons */
document.querySelectorAll(".mode-btn").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll(".mode-btn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    mode=b.dataset.mode;
  });
});

function buildPool(){
  let base=QUESTIONS;
  if(mode==="know") base=QUESTIONS.filter(q=>q.type==="know");
  if(mode==="case") base=QUESTIONS.filter(q=>q.type==="case");
  return shuffle(base).slice(0,10);
}

$("startBtn").addEventListener("click",startQuiz);
$("againBtn").addEventListener("click",startQuiz);
$("homeBtn").addEventListener("click",()=>{
  $("resultScreen").classList.add("hidden");
  $("startScreen").classList.remove("hidden");
});
$("nextBtn").addEventListener("click",nextQuestion);

function startQuiz(){
  pool=buildPool();
  idx=0;score=0;session=[];
  $("startScreen").classList.add("hidden");
  $("resultScreen").classList.add("hidden");
  $("quizScreen").classList.remove("hidden");
  $("liveScore").textContent="0";
  renderQuestion();
}

function renderQuestion(){
  answered=false;
  const q=pool[idx];
  $("curIdx").textContent=idx+1;
  $("barFill").style.width=((idx)/pool.length*100)+"%";
  const isKnow=q.type==="know";
  $("qtypeTag").textContent=isKnow?"知識題":"情境題";
  const badge=$("qBadge");
  badge.textContent=isKnow?"知識題":"情境題";
  badge.className="qtype "+(isKnow?"know":"case");
  $("qStem").textContent=q.q;

  // shuffle options while tracking correct
  const order=shuffle([0,1,2,3]);
  const list=$("optList");
  list.innerHTML="";
  q._order=order;
  order.forEach((origIdx,pos)=>{
    const li=document.createElement("li");
    li.className="opt";
    li.innerHTML=`<span class="key">${LETTERS[pos]}</span><span>${q.opts[origIdx]}</span>`;
    li.addEventListener("click",()=>choose(li,origIdx));
    list.appendChild(li);
  });

  $("explainBox").classList.remove("show");
  $("nextBtn").classList.add("hidden");
}

function choose(el,origIdx){
  if(answered) return;
  answered=true;
  const q=pool[idx];
  const correct = origIdx===q.a;
  if(correct){score++; $("liveScore").textContent=score;}

  const items=[...$("optList").children];
  items.forEach((li,pos)=>{
    li.classList.add("disabled");
    const o=q._order[pos];
    if(o===q.a) li.classList.add("correct");
    else if(li===el) li.classList.add("wrong");
    else li.classList.add("dim");
  });

  const eb=$("explainBox");
  eb.innerHTML=`<b>${correct?"✓ 答對了":"✗ 答錯了"}　·　正確答案：${answerLetter(q)}</b><br>${q.e}`;
  eb.classList.add("show");

  session.push({q:q.q, type:q.type, chosen:q.opts[origIdx], correctText:q.opts[q.a], correct});

  $("nextBtn").classList.remove("hidden");
  $("nextBtn").textContent = (idx===pool.length-1)?"看結果　→":"下一題　→";
}

function answerLetter(q){
  const pos=q._order.indexOf(q.a);
  return LETTERS[pos];
}

function nextQuestion(){
  if(idx===pool.length-1){ showResults(); return; }
  idx++;
  renderQuestion();
}

function showResults(){
  $("barFill").style.width="100%";
  $("quizScreen").classList.add("hidden");
  $("resultScreen").classList.remove("hidden");
  $("finalScore").textContent=score;

  const pct=score/pool.length;
  let msg;
  if(pct===1) msg="滿分！觀念非常扎實，可以上考場了。";
  else if(pct>=0.8) msg="表現優秀，少數細節再複習即可。";
  else if(pct>=0.6) msg="及格水準，建議回頭看錯題的解析。";
  else msg="再加把勁，把每題解析讀過一遍會很有幫助。";
  $("scoreMsg").textContent=msg;

  const deg=Math.round(pct*360);
  const col = pct>=0.6? "var(--accent)":"var(--gold)";
  $("ring").style.background=`conic-gradient(${col} ${deg}deg, var(--line) ${deg}deg)`;
  $("ring").firstElementChild.style.cssText="background:#fff;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;";

  const rl=$("reviewList");
  rl.innerHTML="";
  session.forEach((s,i)=>{
    const div=document.createElement("div");
    div.className="review-item";
    const badge=s.type==="know"?'<span class="rev-badge k">知識</span>':'<span class="rev-badge c">情境</span>';
    let lines=`<p class="review-q">${i+1}. ${s.q}${badge}</p>`;
    if(s.correct){
      lines+=`<p class="review-line"><span class="lab">你的答案</span><span class="ok">${s.chosen} ✓</span></p>`;
    }else{
      lines+=`<p class="review-line"><span class="lab">你的答案</span><span class="no">${s.chosen} ✗</span></p>`;
      lines+=`<p class="review-line"><span class="lab">正確答案</span><span class="ok">${s.correctText}</span></p>`;
    }
    div.innerHTML=lines;
    rl.appendChild(div);
  });
}
</script>
</body>
</html>
