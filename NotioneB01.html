<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>監督式與非監督式學習 情境題練習</title>
<style>
  :root{
    --ink:#f6f8fb; --ink2:#eef1f7; --panel:#ffffff; --panel2:#f1f4f9;
    --line:#e2e6ed; --muted:#6b7688; --text:#1a2230; --dim:#48566b;
    --c1:#0d9488; --c2:#7c3aed; --c3:#db2777;
    --ok:#16a34a; --okbg:#dcfce7;
    --no:#dc2626; --nobg:#fee2e2;
    --grad:linear-gradient(90deg,#0d9488 0%,#7c3aed 55%,#db2777 100%);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:
      radial-gradient(1200px 600px at 80% -10%, rgba(124,108,255,.10), transparent 60%),
      radial-gradient(900px 500px at -5% 10%, rgba(56,225,200,.08), transparent 55%),
      var(--ink);
    color:var(--text);
    font-family:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 96px}
  header{margin-bottom:22px}
  .eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--c1);
    font-family:"JetBrains Mono",ui-monospace,monospace;margin:0 0 10px}
  h1{font-size:clamp(26px,5vw,38px);line-height:1.12;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
  h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:14px;margin:0}

  .modebar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 4px}
  .mode{appearance:none;border:1px solid var(--line);background:transparent;color:var(--dim);
    font-size:13px;padding:9px 16px;border-radius:99px;cursor:pointer;transition:.18s;font-family:inherit;font-weight:600}
  .mode:hover{border-color:var(--c2);color:var(--text)}
  .mode.active{background:var(--grad);color:#0b0f14;border-color:transparent}

  .dash{display:flex;align-items:center;gap:16px;margin:16px 0 8px;flex-wrap:wrap}
  .signal{flex:1;min-width:200px}
  .signal .track{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
  .signal .fill{height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
  .signal .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);
    margin-top:7px;font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.05em}
  .score{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;color:var(--dim)}
  .score b{color:var(--c1)}
  .score .sep{color:var(--line);margin:0 6px}
  .score .wrong{color:var(--c3)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 6px}
  .btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--dim);
    font-size:13px;padding:8px 14px;border-radius:9px;cursor:pointer;transition:.18s;
    font-family:inherit;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--c2);color:var(--text);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{background:transparent}

  .card{background:linear-gradient(180deg,var(--panel),var(--ink2));
    border:1px solid var(--line);border-radius:16px;padding:22px 22px 20px;margin:16px 0;
    box-shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 18px 40px -30px rgba(15,23,42,.10)}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .qnum{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--ink);
    background:var(--c1);padding:3px 9px;border-radius:6px;font-weight:700}
  .qtext{font-size:16px;line-height:1.72;color:var(--text);margin:0 0 16px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    background:var(--panel2);border:1px solid var(--line);border-radius:11px;
    padding:13px 14px;cursor:pointer;transition:.16s;color:var(--dim);font-size:14.5px;line-height:1.6;font-family:inherit}
  .opt:hover:not(.locked){border-color:var(--c2);background:#f4f1fd;color:var(--text)}
  .opt .key{flex:none;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);
    display:grid;place-items:center;font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:13px;font-weight:700;color:var(--muted);transition:.16s}
  .opt:hover:not(.locked) .key{border-color:var(--c2);color:var(--c1)}
  .opt.locked{cursor:default}
  .opt.correct{border-color:var(--ok);background:var(--okbg);color:var(--text)}
  .opt.correct .key{background:var(--ok);color:var(--ink);border-color:var(--ok)}
  .opt.wrong{border-color:var(--no);background:var(--nobg);color:var(--text)}
  .opt.wrong .key{background:var(--no);color:#fff;border-color:var(--no)}
  .opt.dim{opacity:.5}
  .explain{margin-top:14px;border-left:3px solid var(--c2);background:rgba(124,108,255,.07);
    border-radius:0 10px 10px 0;padding:12px 15px;font-size:14px;color:var(--dim);
    max-height:0;overflow:hidden;opacity:0;transition:.35s ease}
  .explain.show{max-height:340px;opacity:1;margin-top:14px}
  .explain .lab{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;
    letter-spacing:.14em;color:var(--c2);text-transform:uppercase;display:block;margin-bottom:5px}
  .explain b{color:var(--c1)}
  .result{display:none;background:linear-gradient(180deg,var(--panel),var(--ink2));
    border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center;margin:18px 0}
  .result.show{display:block}
  .result .big{font-size:52px;font-weight:800;line-height:1;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .result .cap{color:var(--muted);font-size:13px;margin-top:6px;font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.1em}
  .result .msg{margin:14px 0 18px;color:var(--dim)}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px;
    font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.04em}
  @media (max-width:560px){.wrap{padding:20px 14px 90px}.qtext{font-size:15px}.opt{font-size:14px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  .opt:focus-visible,.btn:focus-visible,.mode:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">初級 AI 應用規劃師 · 情境練習</p>
    <h1>監督式 · 半／自／非監督 <span class="g">情境題</span></h1>
    <p class="sub">50 題情境選擇題題庫，每回合可抽考 15 題 · 涵蓋監督式七模型與半／自／非監督三種學習方式</p>

    <div class="modebar" id="modebar">
      <button class="mode active" data-mode="15">抽考 15 題</button>
      <button class="mode" data-mode="all">全部 50 題</button>
    </div>

    <div class="dash">
      <div class="signal">
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="lab"><span id="progLab">已作答 0 / 0</span><span id="pct">0%</span></div>
      </div>
      <div class="score">正確 <b id="sCorrect">0</b><span class="sep">/</span>錯誤 <span class="wrong" id="sWrong">0</span></div>
    </div>
    <div class="toolbar">
      <button class="btn" id="revealBtn">顯示本回合解析</button>
      <button class="btn ghost" id="newRoundBtn">重新抽題</button>
    </div>
  </header>
  <div id="quiz"></div>
  <div class="result" id="result">
    <div class="big" id="rBig">0%</div>
    <div class="cap" id="rCap">SCORE</div>
    <p class="msg" id="rMsg"></p>
    <button class="btn" id="againBtn">再抽一回合</button>
  </div>
  <footer>學習來源：「監督式學習」＋「半／自／非監督三種學習方式」考前快速複習 · 題型仿 115 年第一次初級 AI 應用規劃師</footer>
</div>
<script>
const ALL = [{"id": 1, "q": "某連鎖飲料店想根據每月投入的廣告預算來預測當月營業額，資料團隊觀察散佈圖後發現兩者大致呈直線關係，且主管特別希望模型能明確說明「廣告預算每增加一萬元，營業額大約提升多少」這種可解讀的因果關聯。就此需要在散佈圖上找出一條最能代表趨勢的直線來預測連續數值的需求而言，下列何種模型最為適合？", "opts": ["K-近鄰演算法（KNN）", "K-means 分群", "線性迴歸（Linear Regression）", "支援向量機（SVM）"], "ans": "C", "topic": "線性迴歸", "exp": "線性迴歸在散佈圖上找最能代表趨勢的直線預測連續數值，且權重可解讀特徵影響。"}, {"id": 2, "q": "某資料科學家以線性迴歸建立房價預測模型後，發現殘差圖顯示資料實際上呈現明顯的曲線關係，模型在許多區段的預測都出現系統性偏差。此現象最能凸顯線性迴歸的哪一項限制？", "opts": ["真實關係常非直線，面對複雜非線性情況表現有限", "完全無法解讀特徵與結果的關係", "計算過於緩慢、不適合大數據", "只能用於分類、無法預測連續值"], "ans": "A", "topic": "線性迴歸缺點", "exp": "線性迴歸假設線性關係，當真實關係為非線性時表現有限。"}, {"id": 3, "q": "某銀行風控團隊想建立一個「像流程圖一樣、依條件一層層切分」的模型來評估貸款風險，並要求每一次切分後，落入同一分支的資料在類別上要越「純」越好。此種可同時用於分類與迴歸、以切分提升純度為目標的模型是下列何者？", "opts": ["線性迴歸（Linear Regression）", "決策樹（Decision Tree）", "邏輯迴歸（Logistic Regression）", "主成分分析（PCA）"], "ans": "B", "topic": "決策樹", "exp": "決策樹像流程圖依條件切分，目標是每次切分後資料越純，分類迴歸皆可。"}, {"id": 4, "q": "某醫療團隊訓練一棵決策樹判讀檢驗結果，發現它在訓練資料上幾乎全對，但一遇到新病患表現就大幅下滑，明顯把訓練資料的細節與雜訊都硬記了下來。針對這種過擬合（Overfitting）現象，下列何種做法是最直接對應的解法？", "opts": ["把資料標準化到 0~1 之間", "增加樹的深度讓它記得更多", "改用更高維度的特徵空間", "剪枝（Pruning），移除過度細分的分支"], "ans": "D", "topic": "決策樹剪枝", "exp": "決策樹易過擬合，剪枝（Pruning）移除過度細分的分支以提升泛化能力。"}, {"id": 5, "q": "某講師介紹決策樹的組成結構時，提到它由三種節點構成：最頂端作為起點的節點、中間依條件做判斷分支的節點，以及最末端輸出結果的節點。就「最末端輸出最終結果」的那一種節點而言，其名稱為下列何者？", "opts": ["根節點（Root Node）", "內部節點（Internal / Decision Node）", "葉節點（Leaf Node）", "支援向量（Support Vector）"], "ans": "C", "topic": "決策樹結構", "exp": "決策樹的葉節點（Leaf Node）位於最末端，輸出最終結果。"}, {"id": 6, "q": "某音樂串流平台想為新歌自動歸類曲風，作法是把新歌用特徵向量表示後，找出資料庫中與它「距離最接近」的數首既有歌曲，再由這些鄰居的曲風投票決定新歌的類別。此種依距離找出最近數個鄰居再投票的演算法是下列何者？", "opts": ["主成分分析（PCA）", "隨機森林（Random Forest）", "線性迴歸（Linear Regression）", "K-近鄰演算法（KNN）"], "ans": "D", "topic": "KNN", "exp": "KNN 以距離找出最近的 K 個鄰居，由鄰居投票決定分類結果。"}, {"id": 7, "q": "某電商想預測顧客是否會點擊某封行銷郵件，團隊希望模型不只給出「會／不會」，還能輸出一個介於 0 到 1 之間的發生機率，並且每個特徵都有可解讀的權重。此模型的典型運作流程是「線性加權 → Sigmoid → 機率 → 分類」。下列何者最符合此描述？", "opts": ["決策樹（Decision Tree）", "K-means 分群", "主成分分析（PCA）", "邏輯迴歸（Logistic Regression）"], "ans": "D", "topic": "邏輯迴歸", "exp": "邏輯迴歸以線性加權經 Sigmoid 轉為機率再分類，特徵權重可解讀。"}, {"id": 8, "q": "某資料團隊比較兩種分類模型的核心想法：其一以條件機率公式計算，其二以線性加權後套用 Sigmoid 函數。就「以線性加權加上 Sigmoid 來運作」的那一種模型而言，其名稱為下列何者？", "opts": ["線性迴歸（Linear Regression）", "貝氏分類器（Naive Bayes）", "邏輯迴歸（Logistic Regression）", "K-means"], "ans": "C", "topic": "邏輯迴歸 vs NB", "exp": "邏輯迴歸用線性加權＋Sigmoid；Naive Bayes 用條件機率公式。"}, {"id": 9, "q": "某資安公司要建立垃圾郵件過濾器，資料具有「特徵維度很高但可用樣本相對少」的特性。團隊希望找到一個能把垃圾與正常郵件完美分開、且讓分割邊界距離兩邊最近的樣本點越遠越好的模型。此種以最大化邊界之超平面來分類、擅長高維少樣本的模型是下列何者？", "opts": ["支援向量機（SVM）", "K-means 分群", "主成分分析（PCA）", "線性迴歸（Linear Regression）"], "ans": "A", "topic": "SVM", "exp": "SVM 找最大邊界的超平面分開類別，擅長高維度、少樣本問題。"}, {"id": 10, "q": "某工程師說明 SVM 的三個關鍵名詞：作為分割邊界的平面、最靠近該邊界的那些資料點，以及要讓邊界盡量拉大的原則。就「最靠近分割邊界、實際決定邊界位置的那些資料點」而言，其名稱為下列何者？", "opts": ["最大邊界（Maximum Margin）", "葉節點（Leaf Node）", "超平面（Hyperplane）", "支援向量（Support Vectors）"], "ans": "D", "topic": "SVM 支援向量", "exp": "支援向量是最靠近超平面的資料點，直接決定邊界位置。"}, {"id": 11, "q": "某影像辨識專案的資料在原始特徵空間中並非線性可分，團隊希望在不需明確計算高維座標的情況下，讓 SVM 能在更高維度找到可分割的超平面。就 SVM 用來處理非線性可分問題的核心技術而言，下列何者最為符合？", "opts": ["肘部法（Elbow Method）", "剪枝（Pruning）", "核函數（Kernel Trick）", "偽標籤（Pseudo-Labeling）"], "ans": "C", "topic": "SVM 核函數", "exp": "核函數（Kernel Trick）讓 SVM 在高維空間找到分割面，處理非線性可分問題。"}, {"id": 12, "q": "某團隊採用 SVM 建立癌症基因檢測模型，效果不錯，但主管提醒須留意其缺點。就 SVM 的特性而言，下列何者屬於其缺點？", "opts": ["完全無法用於分類任務", "屬於黑盒子模型，且對雜訊與極端值敏感", "一定會嚴重過擬合且無法調整", "只能處理低維度、大樣本的資料"], "ans": "B", "topic": "SVM 缺點", "exp": "SVM 屬黑盒子模型，且對雜訊（Noise）與極端值較為敏感。"}, {"id": 13, "q": "某金融科技公司想提升信用評分的準確度與穩定性，作法是同時訓練大量決策樹，並讓這些樹以投票方式做出最終決策，藉由集體智慧與隨機性降低單一樹的雜訊干擾。此種集結眾多決策樹投票決策的模型是下列何者？", "opts": ["隨機森林（Random Forest）", "主成分分析（PCA）", "邏輯迴歸（Logistic Regression）", "K-近鄰演算法（KNN）"], "ans": "A", "topic": "隨機森林", "exp": "隨機森林集結多棵決策樹投票，準確度高且不易過擬合。"}, {"id": 14, "q": "某物流公司比較單一決策樹與隨機森林兩種方案，用於預測配送延誤。技術主管請團隊整理隨機森林相對於單一決策樹的優缺點，以便向管理層說明選型理由。就隨機森林的特性而言，下列敘述何者最正確？", "opts": ["準確度低且極易過擬合", "準確度高、不易過擬合，但計算資源消耗大且較難解釋", "只能處理已排序的數值資料", "計算資源極省且完全透明可解釋"], "ans": "B", "topic": "隨機森林優缺", "exp": "隨機森林準確度高、不易過擬合，但耗資源且比單一樹更像黑盒子。"}, {"id": 15, "q": "某新聞平台要把大量文章自動分類到不同主題，資料量龐大且以文字為主。團隊選用一種基於條件機率、並假設各特徵彼此獨立、計算快且對文字分類特別強的模型。此模型是下列何者？", "opts": ["線性迴歸（Linear Regression）", "支援向量機（SVM）", "K-means 分群", "貝氏分類器（Naive Bayes）"], "ans": "D", "topic": "Naive Bayes", "exp": "Naive Bayes 以條件機率加獨立假設，計算快、對文字分類（NLP）特別強。"}, {"id": 16, "q": "某工程師以貝氏分類器判斷郵件是否為垃圾郵件，作法是把郵件中「免費」「中獎」「點擊連結」等詞在垃圾與正常兩類下的條件機率分別相乘後比較大小。此模型雖然實作簡單、計算快，但有一項核心假設在現實中常不成立。此假設為下列何者？", "opts": ["假設資料一定線性可分", "假設資料必定呈常態分佈", "假設所有特徵彼此完全獨立", "假設樣本數必須大於特徵數"], "ans": "C", "topic": "Naive Bayes 假設", "exp": "Naive Bayes 假設特徵彼此獨立，此假設常不真實，特徵強相關時效果下降。"}, {"id": 17, "q": "某資料科學家要在「可解釋、計算快、且能輸出機率」與「準確度高但較難解釋」之間為線上詐欺偵測選型。若監理單位高度重視每個特徵的權重與可解讀性，並希望直接得到事件機率，下列何者最符合此需求？", "opts": ["隨機森林（Random Forest）", "支援向量機（SVM）", "隨機決策森林集成", "邏輯迴歸（Logistic Regression）"], "ans": "D", "topic": "邏輯迴歸可解釋", "exp": "邏輯迴歸可解釋性高、計算快且輸出機率，適合重視特徵權重的情境。"}, {"id": 18, "q": "某團隊要辨識人臉，資料維度高、標註樣本少，且希望以最大化邊界的方式在類別間找出穩健的分割面。就此高維度、少樣本且以最大邊界分類為訴求的情境而言，下列何者最為適合？", "opts": ["支援向量機（SVM）", "主成分分析（PCA）", "線性迴歸（Linear Regression）", "K-means 分群"], "ans": "A", "topic": "SVM 應用", "exp": "SVM 擅長高維度、少樣本，常用於人臉辨識、癌症基因檢測等。"}, {"id": 19, "q": "某零售商想同時滿足兩個目標：模型要能處理含缺失值的雜亂資料，並透過多個模型投票降低雜訊、避免過擬合，即使犧牲一些可解釋性也可接受。就此以集體投票提升穩健度的需求而言，下列何者最為適合？", "opts": ["單一決策樹（Decision Tree）", "邏輯迴歸（Logistic Regression）", "線性迴歸（Linear Regression）", "隨機森林（Random Forest）"], "ans": "D", "topic": "隨機森林特性", "exp": "隨機森林能處理缺失值、以多樹投票降低雜訊與過擬合，代價是較難解釋。"}, {"id": 20, "q": "某教學案例以「二分法測驗」比喻某監督式模型：它像不斷用是非題把資料一層層切開，每題都讓分出來的群組更趨於單一類別，直到得出結論。此比喻最貼近下列哪一種模型？", "opts": ["主成分分析（PCA）", "決策樹（Decision Tree）", "支援向量機（SVM）", "K-means 分群"], "ans": "B", "topic": "決策樹比喻", "exp": "決策樹像二分法測驗／流程圖，逐層切分使資料越純。"}, {"id": 21, "q": "某醫療影像新創只有少量由醫師標註的病灶影像，卻有海量未標註影像。團隊的作法是：先用少量標籤訓練一個初始模型，再用它替大量無標籤影像預測，並把其中信心度高的預測當成真標籤放回訓練集反覆迭代。此種學習方式最符合下列何者？", "opts": ["監督式學習的線性迴歸", "半監督式學習的自我訓練（偽標籤）", "強化學習", "非監督式學習的分群"], "ans": "B", "topic": "半監督/自我訓練", "exp": "少量標籤＋大量無標籤，用模型自造偽標籤反覆迭代，屬半監督自我訓練。"}, {"id": 22, "q": "某團隊採用偽標籤（Pseudo-Labeling）進行半監督訓練後，發現模型在初期對某些其實分錯的資料給了過高信心，這些錯誤偽標籤被放回訓練集後，在後續迭代中不斷被強化，導致模型越練越偏。此現象最符合下列哪一個概念？", "opts": ["確認偏誤（Confirmation Bias）", "過擬合的剪枝需求", "梯度消失", "維度災難（Curse of Dimensionality）"], "ans": "A", "topic": "確認偏誤", "exp": "偽標籤初期若高信心地標錯，錯誤會在迭代中被強化，即確認偏誤。"}, {"id": 23, "q": "某工程師想降低自我訓練中確認偏誤的風險，考慮兩種做法：一是對影像做旋轉、裁切等再讓模型預測以增加穩健度，二是保留「0.92 貓／0.08 狗」這類機率分佈而不直接硬歸為單一類別。這兩種做法分別對應下列何者？", "opts": ["資料增強（Data Augmentation）與軟標籤（Soft Label）", "肘部法與主成分分析", "超平面與支援向量", "剪枝與核函數"], "ans": "A", "topic": "確認偏誤解法", "exp": "資料增強與軟標籤可減少過度自信，緩解自我訓練的確認偏誤。"}, {"id": 24, "q": "某團隊在半監督流程中，刻意不把模型對無標籤資料的預測直接歸為單一類別，而是保留各類別的機率分佈（例如貓 0.92、狗 0.08）一併用於訓練，以避免模型過度自信而犯錯。此種標籤形式稱為下列何者？", "opts": ["偽標籤的硬歸類", "主成分", "軟標籤（Soft Label）", "支援向量"], "ans": "C", "topic": "軟標籤", "exp": "軟標籤保留機率分佈而非硬歸類，可減少過度自信造成的錯誤。"}, {"id": 25, "q": "某公司資料中僅有 5% 由人工標註、其餘 95% 皆無標籤，且標註成本高昂。團隊希望同時善用這少量標籤與大量無標籤資料來訓練模型。就此標籤情況而言，最貼切的學習方式類別為下列何者？", "opts": ["非監督式學習（完全無標籤）", "半監督式學習（少量標籤＋大量無標籤）", "自監督式學習（資料自造訊號）", "監督式學習（完整標籤）"], "ans": "B", "topic": "半監督定義", "exp": "半監督式學習使用少量標籤搭配大量無標籤資料進行訓練。"}, {"id": 26, "q": "某影像團隊沒有任何人工標籤，於是先設計一個「假任務」讓模型去做（例如判斷圖片被旋轉了幾度），藉此逼模型學會影像的結構與特徵，之後再把學到的能力遷移到真正的下游任務。此種先做假任務、再遷移的兩階段學習方式稱為下列何者？", "opts": ["前置任務（Pretext Task）", "主成分分析（PCA）", "肘部法（Elbow Method）", "偽標籤（Pseudo-Labeling）"], "ans": "A", "topic": "前置任務", "exp": "前置任務設計假任務讓模型自學資料結構，再遷移到真正任務。"}, {"id": 27, "q": "某影像實驗室在完全沒有人工標籤的情況下，想先讓模型透過一個自設的「假任務」自學影像結構，再遷移到真正的辨識任務。工程師正在挑選合適的前置任務（Pretext Task）。下列選項中，何者屬於前置任務的經典範例？", "opts": ["圖片旋轉、拼圖、影像填色、遮罩語言模型", "剪枝與核函數", "K-means 分群與肘部法選 K", "主成分分析降維"], "ans": "A", "topic": "前置任務範例", "exp": "前置任務經典範例含圖片旋轉、拼圖、影像填色、遮罩語言模型等。"}, {"id": 28, "q": "某自監督團隊採用一種學習策略：把同一張圖經不同增強後視為「正樣本對」而拉近，把不同圖視為「負樣本對」而推遠，核心是「相似的靠近、不相似的分開」，代表方法有 SimCLR、MoCo。此策略稱為下列何者？", "opts": ["掩碼預測（Masked Prediction）", "主成分分析（PCA）", "自蒸餾（Self-Distillation）", "對比學習（Contrastive Learning）"], "ans": "D", "topic": "對比學習", "exp": "對比學習拉近正樣本、推遠負樣本，代表方法 SimCLR、MoCo。"}, {"id": 29, "q": "某 NLP 團隊採用一種自監督任務：故意把句子中的部分字詞遮住，讓模型依據上下文剩餘資訊去猜被遮住的內容，代表模型為 BERT。此種任務稱為下列何者？", "opts": ["掩碼預測（Masked Prediction）", "主成分分析（PCA）", "前置任務中的拼圖", "對比學習（Contrastive Learning）"], "ans": "A", "topic": "掩碼預測", "exp": "掩碼預測遮住部分輸入、讓模型依上下文補回，代表模型 BERT。"}, {"id": 30, "q": "某多模態團隊採用 OpenAI 於 2021 年推出的模型，把圖像與文字映射到同一個語意空間，使自然語言能與視覺影像相互關聯，訓練資料為大量「圖像＋文字配對」，其監督訊號自然產生、常被稱為弱監督。此模型是下列何者？", "opts": ["隨機森林", "DINO", "CLIP", "K-means"], "ans": "C", "topic": "CLIP", "exp": "CLIP 以圖文配對把圖像與文字對齊到同一語意空間，屬弱監督。"}, {"id": 31, "q": "某視覺團隊採用 Meta 於 2021 年提出、專門訓練視覺 Transformer（ViT）的方法，特色是不需人工標籤、不使用負樣本，改以「教師—學生網路」的自蒸餾讓模型自己看懂圖片，並運用多裁切視角。此方法是下列何者？", "opts": ["DINO", "BERT", "SimCLR", "CLIP"], "ans": "A", "topic": "DINO", "exp": "DINO 以教師—學生自蒸餾訓練 ViT，不需人工標籤也不需負樣本。"}, {"id": 32, "q": "某自監督研究團隊在導入不同方法前，先盤點各方法「是否需要準備負樣本對」，因為這會大幅影響資料前處理與批次設計。就下列自監督方法而言，何者屬於「需要負樣本」的一類？", "opts": ["前置任務（Pretext Task）", "對比學習（Contrastive Learning）", "掩碼預測（Masked Prediction）", "DINO 自蒸餾"], "ans": "B", "topic": "是否需負樣本", "exp": "對比學習與 CLIP 需要負樣本；前置任務、掩碼預測、DINO 則不需要。"}, {"id": 33, "q": "某多模態新創在技術選型會議上，要向投資人清楚區分 CLIP 與 DINO 這兩個 2021 年的自監督模型各自的定位與特性，避免混為一談。就這兩者的差異而言，下列敘述何者最正確？", "opts": ["兩者都必須依賴大量人工標籤", "兩者都只處理純文字資料", "CLIP 做圖文對齊且需負樣本；DINO 用自蒸餾且不需負樣本", "CLIP 用自蒸餾且不需負樣本；DINO 做圖文對齊"], "ans": "C", "topic": "CLIP vs DINO", "exp": "CLIP＝對比學習＋圖文多模態（需負樣本）；DINO＝自蒸餾（不需負樣本）。"}, {"id": 34, "q": "某團隊沒有任何人工標籤，卻仍想訓練出能理解資料的模型，作法是「從資料本身自動產生監督訊號」，例如遮住一部分再補回、或設計旋轉、拼圖等假任務讓資料自己當老師。此種學習方式的類別為下列何者？", "opts": ["強化學習", "自監督式學習（Self-Supervised Learning）", "半監督式學習", "監督式學習"], "ans": "B", "topic": "自監督定義", "exp": "自監督式學習無人工標籤，從資料本身自造監督訊號讓資料自己當老師。"}, {"id": 35, "q": "某 AI 課程講師想用最精簡的一句話，幫學員牢記自監督中「掩碼預測」與「對比學習」兩者核心概念的差別，以免考試時混淆。就這兩者的核心概念對應而言，下列何者最正確？", "opts": ["兩者都是圖文對齊", "掩碼預測＝補缺失；對比學習＝分辨相似度", "掩碼預測＝分辨相似度；對比學習＝補缺失", "兩者都是自蒸餾"], "ans": "B", "topic": "掩碼 vs 對比", "exp": "掩碼預測核心是補缺失；對比學習核心是分辨相似度（拉近/推遠）。"}, {"id": 36, "q": "某企業內訓在課程小結時提到：自監督方法中有一種代表模型，能把「圖像」與「文字」對齊到同一個語意空間，藉此達成跨模態的理解與檢索。此描述最符合下列哪一個模型？", "opts": ["BERT＝分群", "K-means＝降維", "DINO＝自蒸餾", "CLIP＝對比學習＋多模態（圖文）"], "ans": "D", "topic": "CLIP 定位", "exp": "CLIP＝對比學習＋多模態圖文對齊，把圖像與文字對齊到同一語意空間。"}, {"id": 37, "q": "某電商想在完全沒有客戶分類標籤的情況下，依消費行為的特徵相似度把客戶自動分成數個群組，以利精準行銷。就此無標籤、依相似度自動分群的需求而言，下列何種演算法最為適合？", "opts": ["支援向量機（SVM）", "邏輯迴歸（Logistic Regression）", "K-means 分群（K-平均演算法）", "線性迴歸（Linear Regression）"], "ans": "C", "topic": "K-means", "exp": "K-means 在無標籤下依特徵相似度自動把資料分成 K 個群組。"}, {"id": 38, "q": "某資料分析師要用 K-means 進行客戶分群，但不確定該分成幾群。他想採用一種常見的圖形化方法：畫出群數與群內誤差的關係曲線，找出曲線明顯轉折、下降趨緩的「轉折點」作為適當群數。此方法稱為下列何者？", "opts": ["主成分分析（PCA）", "核函數（Kernel Trick）", "肘部法（Elbow Method）", "剪枝（Pruning）"], "ans": "C", "topic": "肘部法", "exp": "肘部法以群數對群內誤差作圖，取轉折（手肘）處作為適當的 K 值。"}, {"id": 39, "q": "某團隊使用 K-means 對含有少數極端消費金額的客戶資料分群，結果群心被這些極端值嚴重拉偏，且原本呈狹長形的自然群組也被切得不理想。此結果凸顯 K-means 的哪些限制？", "opts": ["不需指定 K 值、且對異常值完全不敏感", "只能用於文字資料", "須先指定 K 值、對異常值敏感、且較適合圓形／球狀分群", "一定會過擬合、需剪枝"], "ans": "C", "topic": "K-means 缺點", "exp": "K-means 須先指定 K、對異常值敏感，且偏好圓形／球狀的群集。"}, {"id": 40, "q": "某研究團隊的資料有數十個彼此相關的指標，導致維度過高、運算沉重且不易視覺化。團隊希望在盡量保留原始資訊的前提下，把眾多指標數學組合、精煉成 2~3 個新的綜合維度以解決維度災難。就此降維需求而言，下列何者最為適合？", "opts": ["K-means 分群", "邏輯迴歸（Logistic Regression）", "決策樹（Decision Tree）", "主成分分析（PCA）"], "ans": "D", "topic": "PCA", "exp": "PCA 在保留關鍵資訊下把多個特徵組合成少數主成分，達成降維。"}, {"id": 41, "q": "某講師說明 PCA 的數學本質其實是一種「座標軸旋轉」：先找出資料變異最大的方向作為主軸，再找與其正交的次要軸，最後捨棄變異較小的次要成分。就 PCA 尋找的第一主軸方向而言，下列敘述何者最正確？", "opts": ["尋找與資料完全無關的隨機方向", "尋找使群內誤差最小的方向", "尋找資料變異數最大（Maximum Variance）的方向", "尋找資料變異數最小的方向"], "ans": "C", "topic": "PCA 主軸", "exp": "PCA 先找變異數最大的方向作為第一主成分，再找正交次要軸並捨棄次要成分。"}, {"id": 42, "q": "某團隊以 PCA 把高維資料壓到 2 維以利視覺化並提升運算效率，但資深顧問提醒須留意其代價。就 PCA 的特性而言，下列何者屬於其缺點？", "opts": ["只能處理已標註的資料", "主成分為特徵的組合，失去原始解釋性，且只適用線性關係", "一定會造成資料洩漏", "會嚴重增加運算成本"], "ans": "B", "topic": "PCA 缺點", "exp": "PCA 的主成分是特徵組合，失去可解釋性，且僅適用線性關係。"}, {"id": 43, "q": "某教學以「把 3D 立體場景拍成一張 2D 照片，並設法找到最能看清全貌的拍照角度」來比喻某非監督技術，強調它在壓縮維度的同時盡量保留資訊。此比喻最貼近下列何者？", "opts": ["決策樹剪枝", "K-means 分群", "對比學習", "主成分分析（PCA）降維"], "ans": "D", "topic": "PCA 比喻", "exp": "PCA 像把 3D 拍成 2D、找最能看清全貌的角度，是降維並保留資訊。"}, {"id": 44, "q": "某資料團隊面對「完全沒有任何標籤」的資料，只想從資料的內在結構中找出自然群組或壓縮其維度。就此完全無標籤、著重從結構找群組或降維的情境而言，最貼切的學習方式類別為下列何者？", "opts": ["非監督式學習（Unsupervised Learning）", "自監督式學習", "半監督式學習", "監督式學習"], "ans": "A", "topic": "非監督定義", "exp": "非監督式學習在完全無標籤下，從資料結構找群組（分群）或降維。"}, {"id": 45, "q": "某資料負責人依「標籤情況」為三個專案分類：甲專案完全沒有標籤、乙專案只有少量標籤搭配大量無標籤、丙專案沒有人工標籤但可從資料本身自造監督訊號。就這三者對應的學習方式，下列配對何者完全正確？", "opts": ["甲：半監督；乙：非監督；丙：監督", "甲：非監督；乙：半監督；丙：自監督", "甲：監督；乙：自監督；丙：半監督", "甲：自監督；乙：監督；丙：非監督"], "ans": "B", "topic": "三種學習對照", "exp": "完全無標籤→非監督；少量標籤＋大量無標籤→半監督；資料自造訊號→自監督。"}, {"id": 46, "q": "某顧問替三個需求各推薦一種非監督技術：甲要把無標籤客戶自動分群、乙要把高維指標壓成少數綜合維度、丙要為分群挑選適當的群數。就這三者對應的方法，下列配對何者完全正確？", "opts": ["甲：K-means；乙：PCA；丙：肘部法", "甲：K-means；乙：肘部法；丙：PCA", "甲：肘部法；乙：K-means；丙：PCA", "甲：PCA；乙：肘部法；丙：K-means"], "ans": "A", "topic": "非監督方法對照", "exp": "分群→K-means；降維→PCA；選 K 值→肘部法。"}, {"id": 47, "q": "某團隊要為「垃圾郵件過濾」這類文字分類任務選型，考量資料量大、以文字為主、且希望計算快速與實作簡單。就以條件機率加獨立假設、對文字分類特別強的模型而言，下列何者最為適合？", "opts": ["主成分分析（PCA）", "貝氏分類器（Naive Bayes）", "K-means 分群", "線性迴歸（Linear Regression）"], "ans": "B", "topic": "NB 文字分類", "exp": "Naive Bayes 計算快、實作簡單，對文字分類（NLP）特別強，常用於垃圾郵件。"}, {"id": 48, "q": "某電商在為點擊預測選型時，資料科學家要向產品經理說明「邏輯迴歸」與「SVM」兩種模型在輸出、可解釋性與適用資料上的差異，以利決策。就這兩者的比較而言，下列敘述何者最正確？", "opts": ["兩者都以距離找 K 個鄰居投票", "邏輯迴歸輸出機率且可解釋性高；SVM 以最大邊界超平面分類、擅長高維少樣本但較像黑盒子", "邏輯迴歸擅長高維少樣本、SVM 輸出機率", "兩者都只能用於迴歸、不能分類"], "ans": "B", "topic": "邏輯迴歸 vs SVM", "exp": "邏輯迴歸輸出機率、可解釋；SVM 找最大邊界超平面、擅長高維少樣本。"}, {"id": 49, "q": "某新專案只有極少量人工標籤但有海量無標籤資料，團隊想「用模型自己造標籤」來擴充訓練資料，但主管特別提醒要防範一種「錯誤標籤被反覆強化」的風險。此風險與其對應的緩解手段，下列配對何者最正確？", "opts": ["風險為維度災難；解法為肘部法", "風險為過擬合；解法為核函數", "風險為梯度爆炸；解法為剪枝", "風險為確認偏誤；解法為資料增強與軟標籤"], "ans": "D", "topic": "偽標籤風險與解法", "exp": "自我訓練的確認偏誤可用資料增強與軟標籤緩解。"}, {"id": 50, "q": "某影像團隊採用一種自監督學習策略，需要同時準備「正樣本對」與「負樣本對」，透過拉近相似樣本、推遠不相似樣本來學習表徵，代表方法為 SimCLR。若團隊改採 DINO，則在「是否需要負樣本」這點上會有什麼差異？", "opts": ["對比學習（SimCLR）需要負樣本，DINO 以自蒸餾進行、不需負樣本", "DINO 需要負樣本、SimCLR 不需要", "SimCLR 與 DINO 都需要負樣本", "兩者都不需要負樣本"], "ans": "A", "topic": "對比 vs DINO", "exp": "對比學習（SimCLR）需負樣本；DINO 用自蒸餾、不需負樣本。"}];
const LETTERS=['A','B','C','D'];
let mode = 15;          // 15 or 'all'
let pool = [];          // current round's questions (subset of ALL)
let answered = {};      // index-in-pool -> chosen letter
const $ = s=>document.querySelector(s);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildRound(){
  answered = {};
  $('#result').classList.remove('show');
  let idx = ALL.map((_,i)=>i);
  shuffle(idx);
  const n = (mode==='all') ? ALL.length : Math.min(15, ALL.length);
  pool = idx.slice(0, n).map(i=>ALL[i]);
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function render(){
  const quiz = $('#quiz'); quiz.innerHTML='';
  pool.forEach((q,pos)=>{
    const card = document.createElement('div');
    card.className='card'; card.dataset.pos=pos;
    const chosen = answered[pos];
    card.innerHTML = `
      <div class="qhead"><span class="qnum">第 ${String(pos+1).padStart(2,'0')} 題</span></div>
      <p class="qtext">${q.q}</p>
      <div class="opts">
        ${q.opts.map((o,k)=>{const L=LETTERS[k];
          return `<button class="opt" data-l="${L}" role="button"><span class="key">${L}</span><span>${o}</span></button>`;
        }).join('')}
      </div>
      <div class="explain" id="exp-${pos}">
        <span class="lab">解析 · 正解 ${q.ans} · 觀念：${q.topic}</span>${q.exp}
      </div>`;
    quiz.appendChild(card);
    if(chosen) applyLock(card, q, chosen);
    card.querySelectorAll('.opt').forEach(btn=>{
      btn.addEventListener('click',()=>choose(pos,q,card,btn.dataset.l));
    });
  });
  updateDash();
}
function applyLock(card,q,chosen){
  card.querySelectorAll('.opt').forEach(b=>{
    b.classList.add('locked');
    const L=b.dataset.l;
    if(L===q.ans) b.classList.add('correct');
    else if(L===chosen) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  $('#exp-'+card.dataset.pos).classList.add('show');
}
function choose(pos,q,card,L){
  if(answered[pos]) return;
  answered[pos]=L; applyLock(card,q,L); updateDash();
  if(Object.keys(answered).length===pool.length) finish();
}
function updateDash(){
  const n=Object.keys(answered).length; let correct=0;
  for(const k in answered){ if(answered[k]===pool[k].ans) correct++; }
  const total=pool.length||1;
  const pct=Math.round(n/total*100);
  $('#fill').style.width=pct+'%';
  $('#progLab').textContent=`已作答 ${n} / ${pool.length}`;
  $('#pct').textContent=pct+'%';
  $('#sCorrect').textContent=correct; $('#sWrong').textContent=n-correct;
}
function finish(){
  let correct=0;
  for(const k in answered){ if(answered[k]===pool[k].ans) correct++; }
  const pct=Math.round(correct/pool.length*100);
  $('#rBig').textContent=pct+'%';
  $('#rMsg').textContent=`本回合答對 ${correct} 題，共 ${pool.length} 題。`+
    (pct>=80?' 掌握得很扎實，各學習方式與模型的適用情境都分得清楚。':
     pct>=60?' 基礎穩固，再留意易混淆處（如自監督各法是否需負樣本、K-means 與 PCA、決策樹與隨機森林）。':
     ' 建議回頭複習監督式七模型與半／自／非監督三種學習方式的核心定義與適用時機。');
  const r=$('#result'); r.classList.add('show');
  r.scrollIntoView({behavior:'smooth',block:'center'});
}
$('#revealBtn').addEventListener('click',()=>{
  pool.forEach((q,pos)=>{
    const card=document.querySelector(`.card[data-pos="${pos}"]`);
    if(!answered[pos]){
      card.querySelectorAll('.opt').forEach(b=>{
        b.classList.add('locked');
        if(b.dataset.l===q.ans) b.classList.add('correct'); else b.classList.add('dim');
      });
    }
    $('#exp-'+pos).classList.add('show');
  });
});
$('#newRoundBtn').addEventListener('click',buildRound);
$('#againBtn').addEventListener('click',buildRound);
document.querySelectorAll('.mode').forEach(m=>{
  m.addEventListener('click',()=>{
    document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));
    m.classList.add('active');
    mode = m.dataset.mode==='all' ? 'all' : 15;
    buildRound();
  });
});
buildRound();
</script>
