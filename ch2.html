</style></head><body><main><header><div class="eyebrow">MARKETING / CHAPTER 02</div><h1>Ch2 策略管理・進階練習</h1><p class="muted">從條件辨識到策略選擇，練習判斷每個決策的依據。</p></header><div id="storageNotice" class="notice hidden" role="status"></div><div id="app"></div><footer>依據《行銷-Ch2 策略管理 心智圖 摘要》編製，延伸基礎觀念與虛構情境。本題庫為理解練習，非官方考古題。<br>成績保存在目前瀏覽器，不會跨裝置同步；清除瀏覽器資料、使用無痕模式或搬移檔案可能影響紀錄。建議定期匯出備份。本章成績與 Ch1 分開保存；備份請於相同章節及版本匯入。</footer></main>
<script>
'use strict';
const BANK=[{"id": 1, "kind": "基礎", "topic": "策略基礎", "q": "區分使命、目標與策略時，下列配對何者較適當？", "options": ["使命安排部門任務，目標說明理念，策略界定成果數字", "使命說明存在目的，目標界定成果，策略安排達成方式", "使命列出執行預算，目標安排活動，策略說明企業沿革", "使命界定年度數字，目標安排方法，策略說明存在目的"], "answer": 1, "explain": "摘要採使命→目標→策略：先釐清存在目的，再設定期望成果，最後選擇達成方式。"}, {"id": 2, "kind": "基礎", "topic": "策略基礎", "q": "以策略三角檢查方案，主要應確認哪三項的配合？", "options": ["期望成果、外部條件、內部能力", "產品價格、銷售通路、宣傳媒體", "年度收入、銷售數量、產品毛利", "組織層級、部門名稱、人員職稱"], "answer": 0, "explain": "策略三角包含目標、環境與資源，分別對應想達成什麼、外部條件如何，以及內部有何能力。"}, {"id": 3, "kind": "基礎", "topic": "目標管理", "q": "下列哪項最能區分「目標」與「行動方案」？", "options": ["前者界定希望達到的狀態，後者安排具體工作", "前者只處理非量化事項，後者只處理財務數字", "前者只在規劃時使用，後者只在控制時使用", "前者只適用高階主管，後者只適用基層員工"], "answer": 0, "explain": "目標回答要達成什麼，行動方案回答誰在何時做什麼；兩者可出現在不同組織層次。"}, {"id": 4, "kind": "基礎", "topic": "目標管理", "q": "某指標定義清楚、可量測且具期限，但所需產能遠高於企業能力。依 SMART 最需檢查哪項？", "options": ["具體性", "可實現性", "可衡量性", "時限性"], "answer": 1, "explain": "能否在資源與條件下實現，與指標是否清楚、可量測或有期限是不同問題。"}, {"id": 5, "kind": "基礎", "topic": "目標管理", "q": "目標同時要求挑戰性與可達成性，較合理的解讀是？", "options": ["需隨實績下調，且保證考核結果達標", "需超出資源極限，且不受環境變化影響", "需促使組織努力，且有資源與方法支持實現", "需維持過去水準，且避免承擔改善責任"], "answer": 2, "explain": "挑戰性不等於不可達成；目標應帶動努力，也要有合理可行的條件與路徑。"}, {"id": 6, "kind": "基礎", "topic": "環境與資源", "q": "SWOT 區分優勢與機會，主要依據為何？", "options": ["因素能否用財務數字衡量", "因素屬於長期或短期影響", "因素是否已列入年度計畫", "因素位於組織內部或外部"], "answer": 3, "explain": "優勢為內部有利條件，機會為外部有利條件；內外部歸屬與影響方向要分別判斷。"}, {"id": 7, "kind": "基礎", "topic": "策略過程", "q": "區分策略規劃與策略執行，哪項較適當？", "options": ["前者只適用總公司，後者只適用銷售部門", "前者選擇方向與方法，後者使組織配合並落實", "前者只設定財務數字，後者只負責查核差距", "前者不涉及外部環境，後者不涉及內部資源"], "answer": 1, "explain": "規劃回答去哪裡、怎麼去；執行則將選擇轉成組織、制度與人員的實際行動。"}, {"id": 8, "kind": "基礎", "topic": "策略過程", "q": "「策略窗口」最關鍵的成立條件為何？", "options": ["市場所需與企業可提供的能力在某段期間契合", "企業可取得資金且同業尚未調高產品價格", "市場成長快速且企業當期的廣告支出增加", "企業已制定計畫且執行進度符合原先時程"], "answer": 0, "explain": "窗口是外部需要與內部策略、能力的有利配合，不只是市場大或企業有資金。"}, {"id": 9, "kind": "基礎", "topic": "策略過程", "q": "依摘要區分評估與控制，何者較適當？", "options": ["評估衡量成果，控制分析差距並採取修正", "評估分派工作，控制決定企業的存在目的", "評估選擇客群，控制建立組織的新職稱", "評估制定使命，控制蒐集所有市場資料"], "answer": 0, "explain": "評估判斷達標程度；控制在比較與原因分析後採取改善，兩者相連但重點不同。"}, {"id": 10, "kind": "基礎", "topic": "組織配合", "q": "在 7S 中，獎酬制度、核准流程與例行報表主要歸於何者？", "options": ["Structure", "Style", "Systems", "Skills"], "answer": 2, "explain": "Systems 指制度及作業流程；Structure 著重組織分工與權責，Skills 著重能力，Style 著重領導方式。"}, {"id": 11, "kind": "基礎", "topic": "組織配合", "q": "運用 7S 判斷執行障礙，最適當的觀點是？", "options": ["先增加人員數量，再推定策略已被落實", "依七項平均分數，取代具體原因分析", "優先挑選一個因素，其他因素暫不納入", "各因素需相互配合，單項改善未必足夠"], "answer": 3, "explain": "7S 是配合性的檢視，策略、結構、制度、人員、技能、風格與共享價值可能相互影響。"}, {"id": 12, "kind": "基礎", "topic": "策略層次", "q": "「公司應保留哪些事業，資金如何跨事業分配」主要屬於哪個層次？", "options": ["事業策略", "作業計畫", "總體策略", "職能策略"], "answer": 2, "explain": "總體策略處理事業組合與整體資源配置；事業策略著重在某事業如何競爭。"}, {"id": 13, "kind": "基礎", "topic": "策略層次", "q": "下列哪項最接近事業策略的核心問題？", "options": ["倉儲班組應如何分配當日揀貨工作", "財務部應如何安排每日帳款核對", "集團應進入或退出哪些產業領域", "某事業應以何種方式取得競爭優勢"], "answer": 3, "explain": "事業層次回答如何競爭；跨事業範圍屬總體，部門或每日安排則偏職能及作業。"}, {"id": 14, "kind": "基礎", "topic": "事業組合", "q": "採用 BCG 的相對市場占有率觀念時，應如何衡量競爭位置？", "options": ["將本事業利潤與企業年度預算比較", "將本事業成長與產業平均成長比較", "將本事業市占與主要競爭者市占比較", "將本事業營收與集團全部營收比較"], "answer": 2, "explain": "相對市占是市占的相對競爭位置，不能用內部營收占比或利潤達成率替代；此為摘要市占軸的基礎延伸。"}, {"id": 15, "kind": "基礎", "topic": "事業組合", "q": "在 BCG 中，金牛與明星的主要共同點為何？", "options": ["兩者皆處於較高的市場成長率環境", "兩者皆處於較低的市場成長率環境", "兩者皆具有較高的相對市場占有率", "兩者皆具有較低的相對市場占有率"], "answer": 2, "explain": "明星為高相對市占、高市場成長；金牛為高相對市占、低市場成長。"}, {"id": 16, "kind": "基礎", "topic": "事業組合", "q": "相較於 BCG，GE 多因子矩陣的主要特徵為何？", "options": ["以事業的成立年資取代相對市場占有率", "以單一銷售指標決定全部事業投資順序", "以當期會計利潤替代市場及能力的分析", "以多項因素評估競爭地位與市場吸引力"], "answer": 3, "explain": "GE 以多因子衡量事業地位與市場吸引力，通常採九宮格；並非只是增加格數。"}, {"id": 17, "kind": "基礎", "topic": "競爭策略", "q": "成本領袖與差異化最核心的區別為何？", "options": ["前者只服務小市場，後者只服務大眾市場", "前者依賴短期折扣，後者依賴大量廣告", "前者一律降低品質，後者一律提高產品定價", "前者建立成本優勢，後者創造顧客重視的獨特價值"], "answer": 3, "explain": "低成本是競爭基礎，不等於低品質或單次低價；差異化須對顧客有意義。"}, {"id": 18, "kind": "基礎", "topic": "成長策略", "q": "安索夫矩陣判斷成長方向時，主要比較哪兩項？", "options": ["成本與品質的高低組合", "產品與市場的新舊組合", "市占與成長的高低組合", "資源與威脅的強弱組合"], "answer": 1, "explain": "安索夫以既有／新產品及既有／新市場形成四種成長方向；它與 BCG 的分析目的不同。"}, {"id": 19, "kind": "應用", "topic": "策略基礎", "q": "公司宣示「讓偏鄉家庭便利取得日用品」，接著決定三年內服務指定地區，並採合作取貨點方式推進。第三項最接近何者？", "options": ["達成目標的策略", "組織存在的使命", "衡量成果的目標", "比較差距的控制"], "answer": 0, "explain": "合作取貨點是實現服務範圍目標的方法；使命、目標及方法要分開辨識。"}, {"id": 20, "kind": "應用", "topic": "策略基礎", "q": "市場需求增加，但企業現有冷鏈與品質管控無法支持擴張。此時最應優先檢查何者？", "options": ["外部機會與內部資源是否配合", "市場成長與企業使命是否同義", "組織名稱與品牌標誌是否一致", "年度營收與產品售價是否相同"], "answer": 0, "explain": "有外部機會並不代表可以立即擴張，還要確認資源能力能否支撐。"}, {"id": 21, "kind": "應用", "topic": "目標管理", "q": "部門提出「下一年度提高滿意度」，調查方式已固定。為使考核能明確判斷達標，最應補充何者？", "options": ["辦公室各項設備的採購日期", "期末期望達到的分數或改善幅度", "同業近期使用的廣告媒體", "負責主管過去的工作經歷"], "answer": 1, "explain": "已有期間與量測方式，但缺少達標門檻，仍難判定是否達成。"}, {"id": 22, "kind": "應用", "topic": "目標管理", "q": "公司要在一年內提高品質，採購卻只按最低買價考核，導致不良率增加。最明顯違反何種目標條件？", "options": ["可衡量性", "一致性", "時限性", "特定性"], "answer": 1, "explain": "採購與品質目標互相牴觸；能量測、有期限仍可能缺乏一致性。"}, {"id": 23, "kind": "應用", "topic": "目標管理", "q": "原訂海外展店目標遇到當地法規重大改變。哪項處理較符合良好目標的要求？", "options": ["暫停紀錄績效，待年底再自行選擇指標", "直接降低門檻，使實際成果自然符合標準", "確認影響後，依使命與資源調整目標及方案", "維持原案不變，以免任何修改影響考核"], "answer": 2, "explain": "彈性是有根據的調整，需兼顧方向、一致性與責任，不是事後任意放寬。"}, {"id": 24, "kind": "應用", "topic": "目標管理", "q": "兩部門都希望獲得同一筆設備預算。主管依公司優先成果及各方案貢獻決定用途，最直接發揮目標何種功能？", "options": ["歸類事業", "描述環境", "分配資源", "建立使命"], "answer": 2, "explain": "目標可指引方向、考核績效與分配資源；此情境強調預算的配置依據。"}, {"id": 25, "kind": "應用", "topic": "環境與資源", "q": "某飲料公司擁有成熟配方技術，且市場上的低糖偏好快速增加。兩項條件依序屬何者？", "options": ["優勢、機會", "優勢、威脅", "劣勢、機會", "機會、優勢"], "answer": 0, "explain": "配方能力在內部且有利，屬優勢；偏好變化來自外部且有利，屬機會。"}, {"id": 26, "kind": "應用", "topic": "環境與資源", "q": "原料行情上漲，同時企業採購資訊落後，導致無法及早調整。兩項因素依序屬何者？", "options": ["威脅、劣勢", "機會、劣勢", "威脅、優勢", "劣勢、威脅"], "answer": 0, "explain": "行情是外部不利因素，資訊能力不足則是內部不利因素，不能因同時發生就歸成同一類。"}, {"id": 27, "kind": "應用", "topic": "環境與資源", "q": "某技術原本是企業強項，但顧客已轉向另一規格。評估該技術時最適當的處理為何？", "options": ["因顧客規格改變，直接將技術改列外部機會", "重新檢查它在新環境下能否帶來競爭價值", "依投入金額大小，決定它必然是優勢或劣勢", "沿用原優勢評分，避免年度資料失去連續性"], "answer": 1, "explain": "優勢需相對於環境及競爭需求判斷，歷史投入或過去成功不保證現在仍有價值。"}, {"id": 28, "kind": "應用", "topic": "環境與資源", "q": "企業有良好研發能力，發現市場需要更耐用的包裝。下列何者最能將分析轉為策略？", "options": ["以研發人數增加，取代對包裝效果的驗證", "運用研發能力開發符合市場缺口的包裝方案", "將兩項因素分別列表後，維持原有產品計畫", "把市場需要改列內部能力，以統一分析欄位"], "answer": 1, "explain": "SWOT 的用途不只分類，而是將內外部條件連結成可行選擇；此處是運用優勢把握機會。"}, {"id": 29, "kind": "應用", "topic": "策略過程", "q": "企業已選定轉向訂閱服務，卻未改客服流程、計費制度及人員訓練。最主要的落差位於何處？", "options": ["市場規模的統計口徑", "事業組合的市場分類", "策略執行的組織配合", "企業使命的文字表達"], "answer": 2, "explain": "方向已選定，問題在配套未落實；需要制度、人員與能力的協同。"}, {"id": 30, "kind": "應用", "topic": "策略過程", "q": "某新品需求短暫上升，公司有現成技術與供應能力，但審批延誤至需求退去才上市。最直接錯失何者？", "options": ["共享價值", "策略窗口", "績效標準", "事業層級"], "answer": 1, "explain": "有利時機需要市場需要與企業能力及時配合；能力存在也可能因行動太慢錯失窗口。"}, {"id": 31, "kind": "應用", "topic": "策略過程", "q": "一項規劃以進口原料穩定供應為前提，執行後來源中斷。接下來最適當的是？", "options": ["重新檢查假設並調整供應與推進方案", "依原規劃繼續擴量，避免執行偏離計畫", "因計畫曾獲核定，將缺料排除控制範圍", "只改績效報表名稱，維持供應安排不變"], "answer": 0, "explain": "規劃的困難之一是條件會變，控制需把環境變化回饋至修正，而非僵守失效假設。"}, {"id": 32, "kind": "應用", "topic": "策略過程", "q": "月報已顯示回購率低於目標，但各部門只傳閱數字，未追查原因。最缺少何項工作？", "options": ["年度目標的首次公告", "組織使命的初次宣示", "實際成果的初次量測", "差距診斷與修正行動"], "answer": 3, "explain": "已量到結果，但控制還需要找原因並採取修正；報表本身不等於完整控制。"}, {"id": 33, "kind": "應用", "topic": "策略過程", "q": "行銷費用超出預算，主管打算立即砍掉成效最好的活動。決定前最應先做什麼？", "options": ["分析超支來源與活動貢獻，再選擇修正方式", "將所有行銷費視為固定費，延後到明年處理", "依超支比例等額刪減，不再比較活動效果", "將預算改為實際支出，直接消除帳面差異"], "answer": 0, "explain": "控制需找原因並考量對目標的影響，不能只為讓單一數字恢復標準而破壞成果。"}, {"id": 34, "kind": "應用", "topic": "組織配合", "q": "公司要求跨部門快速回應，卻把每項小決策都集中到最高主管核准。依 7S，哪項最直接造成阻礙？", "options": ["員工認同的服務價值", "員工操作工具的技能", "權責與決策分配的結構", "對外提出的產品策略"], "answer": 2, "explain": "題幹主要是決策權集中及分工設計，較直接屬 Structure；未指出員工缺乏工具能力。"}, {"id": 35, "kind": "應用", "topic": "組織配合", "q": "公司增聘足夠資料分析師，但員工尚不會使用新的分析方法。依 7S，優先補強何者？", "options": ["Structure", "Style", "Staff", "Skills"], "answer": 3, "explain": "人員數量已足，主要缺口在方法與能力；Staff 與 Skills 應分別辨識。"}, {"id": 36, "kind": "應用", "topic": "組織配合", "q": "企業倡議鼓勵試驗，主管卻公開責備每次合理失敗，使團隊停止提案。最直接需要檢查何者？", "options": ["事業市占與產業成長的配合", "領導行為與倡議價值的配合", "產品品項與倉庫面積的配合", "財務報表與稅務年度的配合"], "answer": 1, "explain": "主管的 Style 與所倡議的 Shared values 不一致，會抑制員工實際行為。"}, {"id": 37, "kind": "應用", "topic": "組織配合", "q": "主管口頭要求重視售後關係，但獎金只看首次成交，員工因而忽略後續服務。最直接應修正哪一項？", "options": ["使獎酬與服務目標相符的制度", "將售後部門改名為顧客成功部門", "增加首次成交報表的填寫次數", "提高新客成交的相同獎金比率"], "answer": 0, "explain": "誘因屬 Systems；名稱或宣導改變不足以修復制度與策略的矛盾。"}, {"id": 38, "kind": "應用", "topic": "策略層次", "q": "集團決定退出一個產業，將資金投入另一事業。主要屬於何者？", "options": ["門市作業計畫", "事業策略", "行銷職能策略", "總體策略"], "answer": 3, "explain": "決定事業範圍與跨事業資金配置，屬公司總體層次。"}, {"id": 39, "kind": "應用", "topic": "策略層次", "q": "某事業決定以特殊售後服務與競爭者區隔，接著行銷部設計對應方案。前一項決策主要屬何者？", "options": ["每日作業安排", "總體策略", "事業策略", "人資職能策略"], "answer": 2, "explain": "前一項是在特定事業選擇競爭方式；部門方案則支持該選擇。"}, {"id": 40, "kind": "應用", "topic": "策略層次", "q": "為支持企業擴展通路，人資部制定店長培訓與招募方案。主要屬於何者？", "options": ["職能策略", "總體策略", "產業吸引力分析", "事業組合選擇"], "answer": 0, "explain": "人資職能以人才方案支持上層方向；不因方案重要就變成總體策略。"}, {"id": 41, "kind": "應用", "topic": "事業組合", "q": "事業甲市占 30%，最大對手 15%，所處市場成長率已判定為高。依 BCG 應歸為何者？", "options": ["老狗", "問題兒童", "明星", "金牛"], "answer": 2, "explain": "相對市占為 30%÷15%=2，屬高；再結合高市場成長，為明星。"}, {"id": 42, "kind": "應用", "topic": "事業組合", "q": "事業乙年銷售成長很快，但產業整體低成長；其相對市占為高。依 BCG 應歸為何者？", "options": ["老狗", "問題兒童", "明星", "金牛"], "answer": 3, "explain": "BCG 看市場成長率，不是事業自己的銷售成長率；高相對市占搭配低市場成長為金牛。"}, {"id": 43, "kind": "應用", "topic": "事業組合", "q": "某事業自身市占 18%，最大對手 36%，市場成長率已判定為高。依 BCG 應歸為何者？", "options": ["明星", "金牛", "問題兒童", "老狗"], "answer": 2, "explain": "相對市占為 0.5，屬低；即使絕對市占看似不小，低相對市占加高市場成長仍為問題兒童。"}, {"id": 44, "kind": "應用", "topic": "事業組合", "q": "某事業相對市占與市場成長率均低，但與其他事業共用關鍵通路且仍有正貢獻。決策上較適當的是？", "options": ["因共用通路，直接將市場成長改列為高", "因仍有收入，直接將其分類改為明星", "僅依矩陣分類，立即停止所有相關營運", "結合現金貢獻與協同效果，再評估保留或退出"], "answer": 3, "explain": "分類不能取代完整決策；低低通常偏收割或退出評估，但仍需看貢獻、連結與限制。"}, {"id": 45, "kind": "應用", "topic": "事業組合", "q": "某產品在高成長市場居領先地位，經理因銷量大便認定能大量供應其他事業現金。最應注意什麼？", "options": ["高成長市場的領先產品應改歸金牛", "維持領先所需投入可能仍高，未必有大量淨現金", "只要市場成長高，企業當期利潤必為負值", "只要市占領先，企業未來便不需追加資源"], "answer": 1, "explain": "明星常需投入以維持成長與地位；銷量、市占與可移用淨現金不能直接畫上等號。"}, {"id": 46, "kind": "應用", "topic": "事業組合", "q": "企業資金有限，面對兩個低市占、高成長事業，最適當的評估方式為何？", "options": ["依產品上市先後，將資金全投較新的產品", "依最近一場活動人氣，取代競爭能力分析", "比較建立競爭優勢的可行性與所需資源", "依兩者同屬一類，平均投入相同資金"], "answer": 2, "explain": "問題兒童應選擇性評估，不是所有高成長市場機會都值得同等投資。"}, {"id": 47, "kind": "應用", "topic": "事業組合", "q": "事業已在成熟市場保持領先，其他事業需要資金。較符合一般 BCG 思考的安排是？", "options": ["只因其他事業缺錢，就增加本事業市場成長率", "維持其競爭力，評估將剩餘現金支援其他事業", "停止維護品質，將所有收入立即轉往其他事業", "只因市場成熟，就將其分類改為問題兒童"], "answer": 1, "explain": "金牛常可提供現金，但仍需合理維護，且現金用途不會改變分類軸。"}, {"id": 48, "kind": "應用", "topic": "事業組合", "q": "某公司用自身品質、聲譽與行銷能力評分，又用市場規模、產業利潤與成長率評分。最符合何種工具？", "options": ["BCG 矩陣", "安索夫矩陣", "策略三角分類", "GE 多因子矩陣"], "answer": 3, "explain": "兩組多因子分別評估競爭地位與市場吸引力，符合 GE，而非單一市占及成長軸。"}, {"id": 49, "kind": "應用", "topic": "事業組合", "q": "在 GE 評估中，某市場潛力佳，但企業品牌與通路能力弱。最適當的解讀為何？", "options": ["只要任一軸高，即可省略另一軸評分", "企業能力弱即可推定市場吸引力低", "市場潛力佳即可推定企業地位強", "市場吸引力與競爭地位需分開評估"], "answer": 3, "explain": "外部市場的吸引力不等於企業自己的競爭能力，後續需評估是否能建立能力。"}, {"id": 50, "kind": "應用", "topic": "事業組合", "q": "GE 評分位於需審慎選擇投資的中間區域。哪項安排較適當？", "options": ["只依一次評分，立即結束所有營運活動", "訂出能力改善與報酬條件，再分階段投入", "維持原預算金額，不再分析條件是否改變", "將資源全數轉入，暫緩所有後續績效檢查"], "answer": 1, "explain": "依摘要，黃區應謹慎評估；選擇性與有條件投入比一律擴張或退出更合適。"}, {"id": 51, "kind": "應用", "topic": "競爭策略", "q": "連鎖商透過採購規模、流程改善及損耗控制，在維持必要品質下取得較低單位成本。主要採何種策略？", "options": ["集中", "差異化", "多角化", "成本領袖"], "answer": 3, "explain": "競爭優勢來自成本結構，而非單純短期降價；多角化則屬產品與市場成長方向。"}, {"id": 52, "kind": "應用", "topic": "競爭策略", "q": "某品牌售價低於同業，但單位成本相同，只靠持續犧牲毛利。最合理的判斷為何？", "options": ["低售價尚不足以證明已建立成本領袖優勢", "毛利較低代表企業已成功實施差異化", "低售價已足以確認其成本必低於同業", "毛利較低代表企業正進行新市場發展"], "answer": 0, "explain": "成本領袖的關鍵是相對成本優勢，低價可以沒有低成本支持，持續性需另評估。"}, {"id": 53, "kind": "應用", "topic": "競爭策略", "q": "品牌開發獨特功能，但顧客不理解也不重視，購買意願未提高。最應先確認什麼？", "options": ["產品是否比同業擁有更多的規格名稱", "差異是否能被目標顧客感知並產生價值", "廣告是否能把所有功能字數完整列出", "產品是否能使用更高的建議售價"], "answer": 1, "explain": "差異化不只是不同，還需對目標顧客有意義；更多規格或高定價不保證有效。"}, {"id": 54, "kind": "應用", "topic": "競爭策略", "q": "小型企業只服務高山救援隊，依其使用條件設計裝備，不追求一般大眾市場。主要採何種策略？", "options": ["總體整合", "成本領袖", "集中", "市場滲透"], "answer": 2, "explain": "重點是選擇狹窄而特定的服務範圍；題幹未提供足以判定成本領先的資訊。"}, {"id": 55, "kind": "應用", "topic": "成長策略", "q": "品牌在既有地區向原有客群推廣同一款飲品，鼓勵增加購買頻率。屬於何者？", "options": ["市場滲透", "多角化", "產品發展", "市場發展"], "answer": 0, "explain": "產品與市場均維持既有，目的是提高購買率或市占，屬市場滲透。"}, {"id": 56, "kind": "應用", "topic": "成長策略", "q": "企業將現有餅乾以原配方銷往從未服務的新國家，不改變產品內容。屬於何者？", "options": ["產品發展", "多角化", "市場滲透", "市場發展"], "answer": 3, "explain": "既有產品進入新地理市場，屬市場發展；市場的新舊是相對企業現況判斷。"}, {"id": 57, "kind": "應用", "topic": "成長策略", "q": "品牌針對原有健身客群，開發原先沒有提供的蛋白點心。屬於何者？", "options": ["多角化", "市場滲透", "產品發展", "市場發展"], "answer": 2, "explain": "服務市場仍是既有客群，產品則為新開發，因此是產品發展。"}, {"id": 58, "kind": "應用", "topic": "成長策略", "q": "原本服務家庭飲水市場的公司，新開發工業感測設備並進入從未服務的工廠市場。屬於何者？", "options": ["產品發展", "多角化", "市場發展", "市場滲透"], "answer": 1, "explain": "對企業而言，產品與市場均為新，符合多角化；不是只看公司是否更換名稱。"}, {"id": 59, "kind": "應用", "topic": "成長策略", "q": "品牌把同一商品改以新電商平台販售，服務的仍是原地區原客群。若僅依題述判斷，何者較適當？", "options": ["網站介面不同即可認定為產品發展", "使用新平台即可認定為市場發展", "平台與門市不同即可認定為多角化", "更換通路尚不足以認定已進入新市場"], "answer": 3, "explain": "新通路不必然等於新市場，要看實際服務對象或範圍是否改變，不能由媒介名稱直接分類。"}, {"id": 60, "kind": "應用", "topic": "策略整合", "q": "某企業選擇狹窄客群並提供專業服務，接著用現有產品打入新的地理區域。兩項決策可如何同時理解？", "options": ["前者描述競爭範圍，後者描述成長方向", "前者描述市場成長，後者描述相對市占", "前者描述績效衡量，後者描述內部技能", "前者描述事業地位，後者描述組織結構"], "answer": 0, "explain": "集中策略與市場發展可並存，因為波特與安索夫回答的問題不同，不能強制二選一。"}];
const KEY='marketing-ch2-advanced60-v1';
const app=document.getElementById('app');
let history=[],session=null,index=0,filter='all',storageOK=true;
function notice(t){const el=document.getElementById('storageNotice');el.textContent=t;el.classList.remove('hidden')}
try{history=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(history))throw Error();history=history.filter(h=>h&&typeof h.id==='string'&&Number.isFinite(h.score)&&Array.isArray(h.details));}catch(e){storageOK=false;notice('無法讀取成績紀錄。本次仍可練習，請使用匯出功能保存結果。')}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(history))}catch(e){storageOK=false;notice('瀏覽器未能儲存成績，請先匯出備份；關閉頁面後可能無法保留。')}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){if(session&&!session.result&&!confirm('重新抽題會捨棄目前尚未交卷的作答，確定繼續？'))return;const picked=shuffle([...shuffle(BANK.filter(q=>q.kind==='基礎')).slice(0,6),...shuffle(BANK.filter(q=>q.kind==='應用')).slice(0,14)]);session={start:Date.now(),questions:picked.map(q=>({...q,order:shuffle([0,1,2,3])})),answers:{},result:null};index=0;renderQuestion()}
function home(){if(session&&!session.result&&!confirm('返回首頁會捨棄尚未交卷的作答，確定繼續？'))return;session=null;renderHome()}
function renderHome(){const best=history.length?Math.max(...history.map(h=>h.score)):'—';const avg=history.length?Math.round(history.reduce((n,h)=>n+h.score,0)/history.length):'—';app.innerHTML=`<section class="card"><span class="pill">CH2 進階理解練習</span><h2 style="margin-top:15px">一次 20 題，練習策略判斷</h2><p>60 題進階單選題庫（18 題基礎、42 題應用），每回隨機抽取 <b>6 題基礎知識＋14 題實際應用</b>。每題 5 分，不限時；交卷後顯示成績、正確答案與解析。</p><div class="stats"><div class="stat"><b>${history.length}</b><small>完成回數</small></div><div class="stat"><b>${best}</b><small>最高分 / 100</small></div><div class="stat"><b>${avg}</b><small>平均分 / 100</small></div></div><button class="primary" onclick="start()">開始隨機練習 →</button></section><section class="card"><div class="topline"><h2>歷次成績</h2><small>儲存在此瀏覽器</small></div><div class="actions"><button onclick="exportHistory()" ${history.length?'':'disabled'}>匯出紀錄備份</button><button onclick="document.getElementById('importFile').click()">匯入備份</button><input id="importFile" class="hidden" type="file" accept=".json,application/json" onchange="importHistory(this)"><button onclick="clearHistory()" ${history.length?'':'disabled'}>清除紀錄</button></div>${history.length?`<div class="tablewrap"><table><thead><tr><th>練習時間</th><th>成績</th><th>答對</th><th>用時</th><th>解析</th></tr></thead><tbody>${history.map(h=>`<tr><td>${esc(new Date(h.date).toLocaleString('zh-TW'))}</td><td><b>${h.score} 分</b></td><td>${h.correct} / 20</td><td>${duration(h.seconds)}</td><td><button onclick="viewHistory('${esc(h.id)}')">查看</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">尚無紀錄。完成第一回，開始累積你的學習足跡。</p>'}</section>`}
function duration(s){return `${Math.floor(s/60)} 分 ${s%60} 秒`}
function renderQuestion(){const q=session.questions[index],answered=Object.keys(session.answers).length;app.innerHTML=`<section class="card"><div class="topline"><b>第 ${index+1} / 20 題</b><span class="muted">已作答 ${answered} / 20</span></div><progress max="20" value="${answered}"></progress><span class="pill">進階單選題</span><h2 style="margin-top:20px" id="questionHeading" tabindex="-1">${q.q}</h2><fieldset style="border:0;padding:0;margin:0"><legend class="muted">請選擇一個最適合的答案</legend><div class="options">${q.order.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${session.answers[q.id]===o?'checked':''} onchange="chooseDisplay(${i})"><span><b>${'ABCD'[i]}.</b> ${q.options[o]}</span></label>`).join('')}</div></fieldset><div class="actions"><button onclick="move(-1)" ${index===0?'disabled':''}>← 上一題</button>${index<19?'<button class="primary" onclick="move(1)">下一題 →</button>':''}<button onclick="submitQuiz()">交卷看解析</button><button onclick="home()">返回首頁</button></div><div class="navgrid" aria-label="題號導覽">${session.questions.map((x,i)=>`<button aria-label="第 ${i+1} 題${session.answers[x.id]!==undefined?'，已作答':''}" class="${i===index?'current ':''}${session.answers[x.id]!==undefined?'done':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><small>綠底表示已作答，可隨時切換題號修改答案。未交卷作答不會在重新整理後保留。</small></section>`}
function chooseDisplay(i){const q=session.questions[index];choose(q.id,q.order[i])}
function choose(id,o){session.answers[id]=o;renderQuestion()}
function jump(i){index=i;renderQuestion();document.getElementById('questionHeading').focus()}
function move(n){jump(index+n)}
function submitQuiz(){if(!session||session.result)return;const missing=20-Object.keys(session.answers).length;if(!confirm(missing?`還有 ${missing} 題未作答，交卷將以答錯計算。確定交卷？`:'確定交卷並查看解析？'))return;const details=session.questions.map(q=>({id:q.id,choice:session.answers[q.id]??null,order:q.order}));const correct=details.filter(d=>d.choice===BANK.find(q=>q.id===d.id).answer).length;const result={id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),date:new Date().toISOString(),score:correct*5,correct,seconds:Math.round((Date.now()-session.start)/1000),details};session.result=result;history.unshift(result);persist();filter='all';renderResult(result)}
function viewHistory(id){const h=history.find(h=>h.id===id);if(h){session={result:h};filter='all';renderResult(h)}}
function renderResult(r){const groups={};r.details.forEach(d=>{const q=BANK.find(x=>x.id===d.id);const g=groups[q.topic]??={total:0,correct:0};g.total++;g.correct+=Number(d.choice===q.answer)});app.innerHTML=`<section class="card"><div class="topline"><h2>本回練習結果</h2><small>${esc(new Date(r.date).toLocaleString('zh-TW'))}</small></div><div class="score">${r.score}<small style="font-size:18px"> / 100</small></div><p>答對 ${r.correct} / 20 題 · 用時 ${duration(r.seconds)}</p><p class="muted">${r.score>=80?'觀念逐漸穩固！看看解析，確認自己能說出原因。':'先找出混淆的概念，再用解析中的關鍵線索重新判斷。'}</p><div class="actions"><button class="primary" onclick="start()">再抽 20 題</button><button onclick="home()">回首頁看紀錄</button><button onclick="exportHistory()">匯出成績備份</button></div><h3>各主題表現</h3>${Object.entries(groups).map(([t,g])=>`<span class="pill">${t} ${g.correct}/${g.total}</span>`).join('')}</section><section><div class="topline"><h2>逐題解析</h2><div><button onclick="setFilter('all')" ${filter==='all'?'disabled':''}>全部</button> <button onclick="setFilter('wrong')" ${filter==='wrong'?'disabled':''}>只看錯題</button></div></div><div style="margin-top:18px">${r.details.map((d,i)=>{const q=BANK.find(x=>x.id===d.id),ok=d.choice===q.answer;if(filter==='wrong'&&ok)return '';return `<article class="card review ${ok?'':'bad'}"><span class="pill">${q.kind} · ${q.topic}</span><h3>${i+1}. ${q.q}</h3><p class="${ok?'right':'wrong'}">${ok?'✓ 答對':'✕ '+(d.choice===null?'未作答':'答錯')}｜你的答案：${d.choice===null?'未作答':esc(q.options[d.choice])}</p><p><b>正確答案：${q.options[q.answer]}</b></p><p class="muted">${q.explain}</p></article>`}).join('')}${filter==='wrong'&&r.correct===20?'<div class="card">本回全對，沒有錯題！</div>':''}</div></section>`}
function setFilter(f){filter=f;renderResult(session.result)}
function exportHistory(){const blob=new Blob([JSON.stringify({version:2,bank:'ch2-advanced60-v1',history},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='行銷Ch2策略管理60題成績備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importHistory(input){const file=input.files[0];if(!file)return;try{if(file.size>5000000)throw Error();const data=JSON.parse(await file.text());if(data.version!==2||data.bank!=='ch2-advanced60-v1'||!Array.isArray(data.history)||data.history.length>10000)throw Error();for(const h of data.history){if(!h||typeof h.id!=='string'||!/^[a-z0-9]+$/.test(h.id)||!Number.isFinite(Date.parse(h.date))||!Number.isInteger(h.seconds)||h.seconds<0||!Array.isArray(h.details)||h.details.length!==20||new Set(h.details.map(d=>d.id)).size!==20)throw Error();for(const d of h.details){if(!Number.isInteger(d.id)||!BANK.some(q=>q.id===d.id)||!(d.choice===null||Number.isInteger(d.choice)&&d.choice>=0&&d.choice<4))throw Error()}h.correct=h.details.filter(d=>d.choice===BANK.find(q=>q.id===d.id).answer).length;h.score=h.correct*5}const ids=new Set(history.map(h=>h.id));history=[...history,...data.history.filter(h=>!ids.has(h.id))].sort((a,b)=>new Date(b.date)-new Date(a.date));persist();renderHome();alert('備份已匯入。')}catch(e){alert('無法匯入：請選擇本練習室匯出的有效 JSON 備份。')}input.value=''}
function clearHistory(){if(confirm('確定清除所有歷次成績？建議先匯出備份，清除後無法復原。')){history=[];persist();renderHome()}}
renderHome();
</script></body></html>
