<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NLP/LLM應用 隨機測驗</title>
<style>
  :root {
    --primary: #4472C4;
    --primary-dark: #2f5597;
    --green: #2e7d32;
    --red: #c62828;
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #26324a;
    --muted: #6b7686;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  h1 {
    text-align: center;
    color: var(--primary-dark);
    font-size: 1.6em;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 28px;
    font-size: 0.95em;
  }
  .card {
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 2px 12px rgba(30,40,80,0.08);
    padding: 28px 24px;
    margin-bottom: 20px;
  }
  .btn {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px 22px;
    font-size: 1em;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s;
    font-family: inherit;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn.secondary {
    background: #eef1f8;
    color: var(--primary-dark);
  }
  .btn.secondary:hover { background: #dde3f2; }
  .btn.block { display:block; width:100%; margin-bottom:12px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .start-actions { display:flex; flex-direction:column; gap:12px; }
  .cat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
    margin: 16px 0 20px;
    font-size: 0.92em;
    color: var(--muted);
  }
  .cat-grid div { display:flex; justify-content:space-between; border-bottom:1px dashed #e0e4ee; padding:4px 0; }
  .progress-row {
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-bottom: 14px;
    font-size: 0.9em;
    color: var(--muted);
  }
  .progress-bar {
    height: 8px;
    background: #e6e9f2;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-fill {
    height: 100%;
    background: var(--primary);
    transition: width 0.25s;
  }
  .tag {
    display:inline-block;
    font-size: 0.75em;
    background: #eef1f8;
    color: var(--primary-dark);
    border-radius: 20px;
    padding: 3px 10px;
    margin-right: 6px;
  }
  .tag.scenario { background:#fff1e0; color:#a15c00; }
  .question-text {
    font-size: 1.12em;
    line-height: 1.6;
    margin: 14px 0 20px;
    font-weight: 600;
  }
  .option {
    display:block;
    width:100%;
    text-align:left;
    background:#f8f9fc;
    border: 2px solid #e6e9f2;
    border-radius: 10px;
    padding: 13px 16px;
    margin-bottom: 10px;
    font-size: 0.98em;
    cursor: pointer;
    line-height:1.5;
    color: var(--text);
    font-family: inherit;
    transition: border-color 0.15s, background 0.15s;
  }
  .option:hover:not(:disabled) { border-color: var(--primary); }
  .option.correct { background:#e8f5e9; border-color: var(--green); color:#1b5e20; font-weight:600; }
  .option.wrong { background:#fdecea; border-color: var(--red); color:#8e1c1c; font-weight:600; }
  .option:disabled { cursor:not-allowed; }
  .explain {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 10px;
    background: #f1f5ff;
    border-left: 4px solid var(--primary);
    font-size: 0.92em;
    line-height:1.6;
    display:none;
  }
  .explain.show { display:block; }
  .nav-row { display:flex; justify-content:flex-end; margin-top: 20px; }
  .score-big {
    text-align:center;
    font-size: 2.6em;
    font-weight:700;
    color: var(--primary-dark);
    margin: 10px 0;
  }
  .score-sub { text-align:center; color:var(--muted); margin-bottom: 20px;}
  table { width:100%; border-collapse: collapse; font-size:0.9em; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #eef1f8; text-align:left; }
  th { color: var(--muted); font-weight:600; }
  .review-item { padding: 14px 0; border-bottom: 1px solid #eef1f8; }
  .review-item:last-child { border-bottom:none; }
  .review-q { font-weight:600; margin-bottom:6px; }
  .review-ans { font-size:0.9em; margin: 3px 0; }
  .ok { color: var(--green); }
  .no { color: var(--red); }
  .hidden { display:none !important; }
  .footer-note { text-align:center; color:var(--muted); font-size:0.8em; margin-top: 24px; }
  .history-empty { text-align:center; color:var(--muted); padding: 20px 0; }
  .clear-link { display:block; text-align:center; margin-top:14px; color:var(--red); font-size:0.85em; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
<div class="wrap">
  <h1>NLP/LLM應用 隨機測驗</h1>
  <div class="subtitle">NLP/LLM、RAG與檢索、提示工程、模型最佳化與部署、模型評估、應用與工具 六大主題共200題 · 每次隨機抽取20題 · 自動計分並記錄成績</div>

  <!-- 開始畫面 -->
  <div id="screen-start" class="card">
    <div class="cat-grid" id="cat-summary"></div>
    <div class="start-actions">
      <button class="btn block" onclick="startQuiz()">開始測驗(隨機20題)</button>
      <button class="btn secondary block" onclick="showHistory()">查看歷史成績</button>
    </div>
  </div>

  <!-- 測驗畫面 -->
  <div id="screen-quiz" class="card hidden">
    <div class="progress-row">
      <span id="progress-text">第 1 / 20 題</span>
      <span id="score-text">目前得分:0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div>
      <span class="tag" id="q-cat">分類</span><span class="tag scenario hidden" id="q-type-tag">情境題</span>
    </div>
    <div class="question-text" id="q-text"></div>
    <div id="options"></div>
    <div class="explain" id="explain"></div>
    <div class="nav-row">
      <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>下一題</button>
    </div>
  </div>

  <!-- 結果畫面 -->
  <div id="screen-result" class="card hidden">
    <div class="score-big" id="final-score"></div>
    <div class="score-sub" id="final-sub"></div>
    <div class="start-actions">
      <button class="btn block" onclick="startQuiz()">再測一次(重新隨機20題)</button>
      <button class="btn secondary block" onclick="showStart()">回到首頁</button>
    </div>
  </div>

  <!-- 錯題檢討 -->
  <div id="screen-review" class="card hidden">
    <h3 style="margin-top:0;color:var(--primary-dark);">本次錯題檢討</h3>
    <div id="review-list"></div>
    <div class="start-actions" style="margin-top:16px;">
      <button class="btn block" onclick="startQuiz()">再測一次</button>
      <button class="btn secondary block" onclick="showStart()">回到首頁</button>
    </div>
  </div>

  <!-- 歷史成績 -->
  <div id="screen-history" class="card hidden">
    <h3 style="margin-top:0;color:var(--primary-dark);">歷史成績紀錄</h3>
    <div id="history-content"></div>
    <button class="btn secondary block" style="margin-top:16px;" onclick="showStart()">回到首頁</button>
    <div class="clear-link" onclick="clearHistory()">清除所有歷史紀錄</div>
  </div>

  <div class="footer-note">題庫依「NLP/LLM、RAG與檢索、提示工程、模型最佳化與部署、模型評估、應用與工具」六大主題編製,成績紀錄僅保存在您目前使用的瀏覽器中。</div>
</div>

<script>
const ALL_QUESTIONS = [{"id": 1, "cat": "NLP/LLM", "type": "概念", "q": "「條件隨機場(CRF)」最核心的特色為何?", "opts": ["專門用來做圖片辨識的卷積神經網路", "考慮前後關係的分類模型,特別用在序列資料上,不只看單一資料點還會看前後連續關係", "只看單一資料點,完全不考慮前後關係", "一種用來加速Transformer運算的技術"], "ans": 1, "exp": "筆記:CRF是一種考慮前後關係的分類模型,用在序列資料上,同時具備單點特徵(Local)與前後關係(Context)。"}, {"id": 2, "cat": "NLP/LLM", "type": "概念", "q": "CRF與一般分類模型(如Logistic)相比,在「判斷方式」上的差異為何?", "opts": ["CRF不進行任何判斷,只做資料儲存", "兩者判斷方式完全相同", "一般模型每個點獨立判斷;CRF是整段一起判斷", "一般模型整段一起判斷;CRF是每個點獨立判斷"], "ans": 2, "exp": "筆記比較表:一般模型(如Logistic)判斷方式是「每個點獨立」;CRF判斷方式是「整段一起判斷」。"}, {"id": 3, "cat": "NLP/LLM", "type": "概念", "q": "關於CRF與一般分類模型在序列資料上的準確度比較,下列何者正確?", "opts": ["兩者準確度完全相同,沒有差異", "CRF無法應用於序列資料", "CRF在序列資料上的準確度較高,一般模型較低", "一般模型在序列資料上的準確度較高,CRF較低"], "ans": 2, "exp": "筆記比較表:CRF因為會看前後關係,在序列資料上準確度「較高」;一般模型「較低」。"}, {"id": 4, "cat": "NLP/LLM", "type": "概念", "q": "「集束搜尋(Beam Search)」的核心概念為何?", "opts": ["每一步只保留唯一一個機率最高的答案", "每一步都保留幾個最有希望的候選答案", "把所有可能答案都保留下來,不做任何篩選", "隨機挑選一個答案作為輸出"], "ans": 1, "exp": "筆記:集束搜尋可以想成每一步都保留幾個最有希望的候選答案,常用在序列生成任務。"}, {"id": 5, "cat": "NLP/LLM", "type": "概念", "q": "集束搜尋(Beam Search)最常應用在下列哪類任務?", "opts": ["資料庫的索引建立", "圖片的邊緣偵測", "序列生成,如翻譯、摘要、字幕生成", "類別型資料的One-Hot編碼"], "ans": 2, "exp": "筆記:集束搜尋常用在序列生成,像翻譯、摘要、字幕生成這類任務。"}, {"id": 6, "cat": "NLP/LLM", "type": "概念", "q": "BERT(雙向編碼器表示)最主要的架構基礎為何?", "opts": ["基於Transformer架構的雙向編碼器模型", "基於決策樹的集成學習模型", "基於馬可夫鏈的序列生成模型", "基於卷積神經網路(CNN)的單向編碼器模型"], "ans": 0, "exp": "筆記:BERT是基於Transformer架構的雙向編碼器模型,會同時看左右文。"}, {"id": 7, "cat": "NLP/LLM", "type": "概念", "q": "關於BERT的用途,下列敘述何者正確?", "opts": ["BERT只能處理圖片資料,不能處理文字", "BERT無法用於問答任務", "BERT不是生成模型,主要用於理解(如語意分類與問答)", "BERT主要用於生成長篇文章,不用於理解任務"], "ans": 2, "exp": "筆記明確指出:「Bert不是生成,用於理解」,它擅長理解語意、分類與問答這類需要上下文的任務。"}, {"id": 8, "cat": "NLP/LLM", "type": "概念", "q": "BERT訓練流程中的「預訓練」階段,主要目的為何?", "opts": ["用大規模文本學習語言規律,讓模型先學通用語意", "把大模型的知識轉移給小模型", "刪除模型中不重要的參數以節省記憶體", "接到下游任務再學一次,把通用能力轉成特定應用"], "ans": 0, "exp": "筆記:預訓練是用大規模文本學語言規律,讓模型先學通用語意;微調則是接到下游任務再學一次。"}, {"id": 9, "cat": "NLP/LLM", "type": "概念", "q": "BERT訓練流程中的「微調」階段,主要目的為何?", "opts": ["用大規模文本學習語言規律,讓模型先學通用語意", "把模型部署到邊緣裝置上", "把模型的Attention計算方法最佳化以節省GPU記憶體", "接到下游任務再學一次,把通用能力轉成特定應用"], "ans": 3, "exp": "筆記:微調是接到下游任務再學一次,把通用能力轉成特定應用。"}, {"id": 10, "cat": "NLP/LLM", "type": "概念", "q": "關於BERT的限制,筆記中提到的重點為何?", "opts": ["輸入長度有限,長文本通常要切段處理", "只能處理英文,無法處理其他語言", "無法進行預訓練,只能直接微調", "無法用於分類任務"], "ans": 0, "exp": "筆記:BERT的限制是輸入長度有限,長文本通常要切段處理。"}, {"id": 11, "cat": "NLP/LLM", "type": "概念", "q": "關於BERT與GPT的關係,筆記中的說法為何?", "opts": ["GPT只能用於理解任務,BERT只能用於生成任務", "兩者互相衝突,無法在同一系統中並存", "BERT和GPT功能完全相同,不能同時使用", "BERT和GPT不僅可以一起使用,而且是非常強大的互補搭檔"], "ans": 3, "exp": "筆記:「BERT和GPT不僅可以一起使用,而且在很多複雜的NLP任務中,它們是非常強大的互補搭檔」。"}, {"id": 12, "cat": "NLP/LLM", "type": "概念", "q": "「雙向語境(Bidirectional Context)」的核心概念為何?", "opts": ["模型只看後面的文字,完全忽略前面的內容", "模型只看前面的文字,完全忽略後面的內容", "模型在理解某個詞時,同時考慮前面和後面的文字,而不是只看單一方向", "模型完全不考慮上下文,只看單一詞彙"], "ans": 2, "exp": "筆記:雙向語境是模型理解某詞時同時考慮前面和後面的文字。"}, {"id": 13, "cat": "NLP/LLM", "type": "概念", "q": "雙向語境(Bidirectional Context)的核心機制是透過下列哪個技術達成?", "opts": ["K個最近鄰的插值方法", "決策樹的分支剪枝", "MapReduce分散式運算架構", "Transformer Encoder搭配Self-Attention(自注意力),同時關注前後詞"], "ans": 3, "exp": "筆記:雙向語境核心機制是使用Transformer Encoder,每個詞都可以看見整句話,透過Self-Attention同時關注前後詞。"}, {"id": 14, "cat": "NLP/LLM", "type": "概念", "q": "「超長上下文(Long-Context)」的核心概念為何?", "opts": ["模型完全不需要考慮輸入長度的限制", "模型只能處理極短的輸入,一次只能看一個字", "模型一次能記住並理解的文字長度變得非常長,能處理超長輸入(大量token)", "模型會自動刪除過長的輸入內容"], "ans": 2, "exp": "筆記:Long-Context是模型一次能記住並理解的文字長度變得非常長,能處理超長輸入,提升長文件理解與跨段推理能力。"}, {"id": 15, "cat": "NLP/LLM", "type": "概念", "q": "「上下文窗口(Context Window)」最貼切的比喻為何?", "opts": ["AI用來連接外部工具的標準協議", "AI用來加密資料的安全機制", "AI的大腦短期記憶容量(一次能放多少字)", "AI的長期知識庫,永久儲存所有對話紀錄"], "ans": 2, "exp": "筆記:上下文窗口可以想成「AI的大腦短期記憶容量(一次能放多少字)」。"}, {"id": 16, "cat": "NLP/LLM", "type": "概念", "q": "當輸入內容超過上下文窗口(Context Window)的限制時,會發生什麼情況?", "opts": ["模型會自動放慢運算速度但仍完整處理全部內容", "會發生「截斷(truncation)」", "系統會自動壓縮所有文字成一個Token", "模型會直接當機無法運作"], "ans": 1, "exp": "筆記:當超過上下文窗口限制時,會發生「截斷(truncation)」。"}, {"id": 17, "cat": "NLP/LLM", "type": "概念", "q": "關於「條件語言模型(Conditional Language Model)」與一般語言模型的差異,下列何者正確?", "opts": ["條件語言模型只能用於圖片生成", "兩者完全相同,沒有任何差異", "一般語言模型只是預測下一個字,沒有額外條件;條件語言模型是根據條件生成文字,有條件", "一般語言模型有條件;條件語言模型沒有條件"], "ans": 2, "exp": "筆記表格:一般語言模型「預測下一個字,❌沒有額外條件」;條件語言模型「根據條件生成文字,✅有條件」。"}, {"id": 18, "cat": "NLP/LLM", "type": "概念", "q": "「溫度(Temperature)」參數的核心作用為何?", "opts": ["控制模型能記住的文字長度", "控制AI回答的速度快慢", "控制模型使用的GPU記憶體大小", "控制AI回答有多隨機/多有創意"], "ans": 3, "exp": "筆記:Temperature是控制AI回答有多隨機、多有創意的參數。"}, {"id": 19, "cat": "NLP/LLM", "type": "概念", "q": "當溫度(Temperature)設定在低區間(0~0.3)時,AI的回答行為會呈現何種特性?", "opts": ["平衡合理與多樣", "很有創意,但可能亂", "很保守,幾乎固定答案", "完全隨機,毫無邏輯"], "ans": 2, "exp": "筆記表格:溫度低(0~0.3)時行為是「很保守、幾乎固定答案」。"}, {"id": 20, "cat": "NLP/LLM", "type": "概念", "q": "當溫度(Temperature)設定在高區間(0.8~1.5)時,AI的回答行為會呈現何種特性?", "opts": ["完全不會產生任何回應", "很保守,幾乎固定答案", "回答速度會變得非常慢", "很有創意,但可能亂"], "ans": 3, "exp": "筆記表格:溫度高(0.8~1.5)時行為是「很有創意、但可能亂」。"}, {"id": 21, "cat": "NLP/LLM", "type": "概念", "q": "「控制變量(Control Tokens)」最貼切的說法為何?", "opts": ["用來儲存模型權重的檔案格式", "用來加密使用者輸入的安全機制", "文章內容本身的一部分,用來表達實質意義", "給AI的指令標籤,而不是文章內容,像遙控器按鈕或模式切換開關"], "ans": 3, "exp": "筆記:控制變量是給AI的指令標籤而不是文章內容,可想像成遙控器按鈕或模式切換開關,用來告訴AI要用什麼方式產生回答。"}, {"id": 22, "cat": "NLP/LLM", "type": "概念", "q": "下列何者屬於「控制變量(Control Tokens)」的範例?", "opts": ["「請正式一點回答」、「請用小學生能懂的方式解釋」", "「幫我計算1加1等於多少」", "「請問台北101有多高?」", "「今天天氣如何?」"], "ans": 0, "exp": "筆記舉例:控制變量是像「請正式一點回答」「請用小學生能懂的方式解釋」「請翻譯成英文」這類控制回答方式的指令,而非問題本身。"}, {"id": 23, "cat": "NLP/LLM", "type": "概念", "q": "關於CRF所看的兩種特徵類型,下列敘述何者正確?", "opts": ["圖像特徵與音訊特徵", "只有前後關係,不考慮單點特徵", "單點特徵(Local)與前後關係(Context)", "只有單點特徵,不考慮前後關係"], "ans": 2, "exp": "筆記:CRF同時具備「1️⃣單點特徵(Local)+2️⃣前後關係(Context)」兩種特徵類型。"}, {"id": 24, "cat": "NLP/LLM", "type": "概念", "q": "集束搜尋(Beam Search)在「機器翻譯」任務中的實際應用為何?", "opts": ["句子前半段多個翻譯分支都還不錯時,能保留較好的整體候選", "完全隨機挑選一個翻譯結果作為輸出", "只保留機率最高的單一翻譯結果,捨棄其他所有分支", "把所有可能的翻譯結果都輸出給使用者選擇"], "ans": 0, "exp": "筆記:機器翻譯案例中,句子前半段多個翻譯分支都還不錯,集束搜尋能保留較好的整體候選。"}, {"id": 25, "cat": "NLP/LLM", "type": "概念", "q": "集束搜尋(Beam Search)在「圖片描述」任務中的實際應用為何?", "opts": ["模型在描述圖像時會同時保留幾個詞組組合,最後挑出整體最順的句子", "直接輸出圖片的像素資料,不做任何文字描述", "把圖片轉換成表格資料", "只描述圖片中的單一物件,忽略其他細節"], "ans": 0, "exp": "筆記:圖片描述案例中,模型描述圖像時會同時保留幾個詞組組合,最後挑出整體最順的句子。"}, {"id": 26, "cat": "NLP/LLM", "type": "概念", "q": "「上下文(Context)」在對話式AI中的意義為何?", "opts": ["只包含使用者當下輸入的單一句話,不含任何歷史紀錄", "只包含AI模型的訓練資料,不含即時對話內容", "只包含系統的錯誤日誌紀錄", "模型在回答問題時能看到的所有文字內容,包含使用者剛問的問題、前面聊天內容、文件內容等"], "ans": 3, "exp": "筆記:上下文是模型在回答問題時能看到的所有文字內容,包含剛剛問的問題、前面聊天內容、文件內容、整段文章。"}, {"id": 27, "cat": "NLP/LLM", "type": "概念", "q": "GPT這類語言模型的輸入,在進入模型運算前會先被轉換成什麼單位?", "opts": ["Pixel(像素單位)", "Byte(位元組單位)", "Token(字詞單位)", "Vector(向量座標,無需轉換為文字單位)"], "ans": 2, "exp": "筆記:在GPT這類模型中,所有輸入(問題+AI之前的回覆)都會變成「Token(字詞單位)」。"}, {"id": 28, "cat": "NLP/LLM", "type": "概念", "q": "關於「一般語言模型」的定義,下列敘述何者正確?", "opts": ["只能處理圖片資料", "根據給定條件生成文字,有額外條件", "只能用於序列標註任務", "預測下一個字,沒有額外條件"], "ans": 3, "exp": "筆記表格:一般語言模型的定義是「預測下一個字」,且「❌沒有額外條件」。"}, {"id": 29, "cat": "NLP/LLM", "type": "概念", "q": "「條件語言模型」在生成文字時的運作方式為何?", "opts": ["只能重複輸出訓練資料中的原文", "只能生成固定長度的文字,無法調整", "在給定某個條件下,去預測或生成文字", "完全隨機生成文字,不考慮任何輸入"], "ans": 2, "exp": "筆記:條件語言模型是「在給定某個條件下,去預測或生成文字的模型」。"}, {"id": 30, "cat": "NLP/LLM", "type": "情境", "q": "某公司要開發一套系統來標註新聞文章中每個字詞的詞性,並且希望模型在判斷某個詞的詞性時,能一併考慮它前後文字的關係,而不是把每個字獨立看待。這個任務最適合採用下列哪種模型?", "opts": ["K折交叉驗證", "Beam Search", "CRF(條件隨機場)", "One-Hot編碼"], "ans": 2, "exp": "CRF正是考慮前後關係、用在序列資料上的分類模型,適合詞性標註這類需要看整段上下文的序列任務。"}, {"id": 31, "cat": "NLP/LLM", "type": "情境", "q": "翻譯系統在把一句中文翻成英文時,句子前半段同時存在好幾種都還算通順的翻譯方式,系統在每一步都保留幾個較有希望的候選翻譯,最後才選出整體最通順的版本。這個做法最符合下列哪個技術?", "opts": ["知識蒸餾", "K折交叉驗證", "集束搜尋(Beam Search)", "剪枝(Pruning)"], "ans": 2, "exp": "每一步保留幾個最有希望的候選答案,正是集束搜尋(Beam Search)的核心概念,常用於機器翻譯這類序列生成任務。"}, {"id": 32, "cat": "NLP/LLM", "type": "情境", "q": "某銀行想開發一套AI客服系統,任務是判斷客戶輸入的問題屬於「帳戶查詢」「貸款諮詢」還是「客訴」三類之一,不需要生成新的文字內容,只需要理解語意並分類。下列哪個模型最適合此任務?", "opts": ["Beam Search", "SMOTE", "GPT(純生成式模型)", "BERT"], "ans": 3, "exp": "BERT擅長理解語意、分類與問答這類需要上下文的任務,「BERT不是生成,用於理解」,正適合此分類需求。"}, {"id": 33, "cat": "NLP/LLM", "type": "情境", "q": "工程師先用大量維基百科文章訓練一個通用語言模型,讓它學會基本的語言規律,接著再用醫療病歷資料,針對「醫療問答」任務重新訓練這個模型。這兩個階段依序對應下列哪兩個概念?", "opts": ["Beam Search→CRF", "微調→預訓練", "剪枝→知識蒸餾", "預訓練→微調"], "ans": 3, "exp": "先用大量文本學習語言規律是預訓練,再用特定領域資料(醫療病歷)針對下游任務訓練是微調,兩階段順序正是預訓練→微調。"}, {"id": 34, "cat": "NLP/LLM", "type": "情境", "q": "使用者請AI閱讀一份300頁的合約文件並回答問題,由於文件內容加上使用者問題的總長度,超過了這個AI模型單次能處理的Token上限,系統只好把超出的部分捨棄。這個現象最符合下列哪個概念?", "opts": ["發生對抗性攻擊(Adversarial Attack)", "發生後門攻擊(Backdoor Attack)", "發生資料漂移(Data Drift)", "超出上下文窗口(Context Window)發生截斷(truncation)"], "ans": 3, "exp": "輸入內容超過模型一次能處理的Token上限(即上下文窗口),系統會發生「截斷(truncation)」,正是筆記中Context Window的定義。"}, {"id": 35, "cat": "NLP/LLM", "type": "情境", "q": "小美在使用AI寫作助理時,要求AI「幫我用嚴謹保守的語氣改寫這篇文章,答案要幾乎固定、不要有太多變化」。如果要透過參數設定達成這個需求,應該把溫度(Temperature)調整到下列哪個區間?", "opts": ["中溫(0.5~0.7)最保守", "高溫(0.8~1.5)", "低溫(0~0.3)", "溫度與此需求無關,應調整Token數量"], "ans": 2, "exp": "筆記表格顯示低溫(0~0.3)的行為是「很保守、幾乎固定答案」,符合小美嚴謹保守、答案固定的需求。"}, {"id": 36, "cat": "NLP/LLM", "type": "情境", "q": "使用者在Prompt開頭加入一句「請用非常正式的商業書信語氣回答,並且全部使用英文」,這句話本身不是問題內容,而是用來規範AI回答的方式。這句話最符合下列哪個概念?", "opts": ["控制變量(Control Tokens)", "集束搜尋的候選答案", "條件語言模型的訓練資料", "資料漂移的偵測結果"], "ans": 0, "exp": "給AI的指令標籤而非問題本身內容,用來規範回答方式,正是控制變量(Control Tokens)的定義,像遙控器按鈕般切換回答模式。"}, {"id": 37, "cat": "NLP/LLM", "type": "情境", "q": "某研究團隊開發一套系統,只要輸入「請以生氣的語氣寫一段話」這個條件,系統就會依照這個指定的情緒條件生成對應的文字內容,而非單純預測下一個字。這套系統最符合下列哪個概念?", "opts": ["條件語言模型(Conditional Language Model)", "CRF條件隨機場", "一般語言模型", "K折交叉驗證"], "ans": 0, "exp": "根據給定條件(生氣的語氣)去生成文字,正是條件語言模型的定義,與只單純預測下一個字、沒有額外條件的一般語言模型不同。"}, {"id": 38, "cat": "NLP/LLM", "type": "情境", "q": "一家新創公司同時使用BERT模型來判斷客戶留言的情緒分類,也使用GPT模型來自動生成回覆客戶的信件內容,兩者搭配使用讓整體客服流程更完整。這樣的搭配方式呼應了筆記中的哪個觀念?", "opts": ["BERT和GPT功能完全相同,不需要同時使用", "GPT只能做分類,BERT只能做生成", "兩者無法在同一個系統中並存", "BERT和GPT是非常強大的互補搭檔,可以一起使用"], "ans": 3, "exp": "筆記明確指出BERT和GPT在許多複雜NLP任務中是強大的互補搭檔,此情境中BERT做分類理解、GPT做生成正是典型互補應用。"}, {"id": 39, "cat": "RAG與檢索", "type": "概念", "q": "「檢索增強生成(RAG)」的核心定義為何?", "opts": ["讓LLM回答問題時,先從外部知識庫搜尋相關資訊,再結合檢索到的資料生成最終答案", "讓LLM完全不使用任何外部資料,只靠模型內部記憶回答", "一種用來標註序列資料的分類方法", "一種用來壓縮模型參數的技術"], "ans": 0, "exp": "筆記:RAG是讓LLM回答問題時先從外部知識庫搜尋相關資訊,再結合這些資料生成最終答案的AI技術。"}, {"id": 40, "cat": "RAG與檢索", "type": "概念", "q": "RAG技術最主要能帶來的效益為何?", "opts": ["讓模型完全不需要進行推論運算", "讓模型參數量大幅減少", "有效消除AI的「幻覺」並納入最新資訊", "讓模型自動學會多國語言翻譯"], "ans": 2, "exp": "筆記:RAG「能有效消除AI的幻覺並納入最新資訊」。"}, {"id": 41, "cat": "RAG與檢索", "type": "概念", "q": "RAG的關鍵步驟依序為何?", "opts": ["資料前處理與向量化(Embedding)→存入向量資料庫→語意檢索(Retrieval)→生成答案(Generation)", "存入向量資料庫→生成答案→資料前處理與向量化→語意檢索", "語意檢索→資料前處理與向量化→生成答案→存入向量資料庫", "生成答案→語意檢索→存入向量資料庫→資料前處理與向量化"], "ans": 0, "exp": "筆記:RAG關鍵步驟依序為資料前處理與向量化(Embedding)→存入向量資料庫→語意檢索(Retrieval)→生成答案(Generation)。"}, {"id": 42, "cat": "RAG與檢索", "type": "概念", "q": "「MCP(Model Context Protocol)」最貼切的比喻為何?", "opts": ["AI界的搜尋引擎", "AI界的防火牆", "AI界的加密演算法", "AI界的USB-C"], "ans": 3, "exp": "筆記標題明確寫出MCP被稱為「AI界的USB-C」。"}, {"id": 43, "cat": "RAG與檢索", "type": "概念", "q": "MCP(Model Context Protocol)是由哪個機構於何時推出的開放標準協議?", "opts": ["由OpenAI於2022年推出", "由Anthropic於2024年底推出", "由Meta於2016年推出", "由Google於2020年推出"], "ans": 1, "exp": "筆記:MCP是由Anthropic於2024年底推出的開放標準協議。"}, {"id": 44, "cat": "RAG與檢索", "type": "概念", "q": "MCP主要用來解決下列哪個問題?", "opts": ["AI工具整合碎片化的問題", "資料庫交易的原子性問題", "模型訓練資料不平衡的問題", "神經網路過擬合的問題"], "ans": 0, "exp": "筆記:MCP用來標準化AI模型與外部工具、資料來源之間的連接方式,解決「AI工具整合碎片化」的問題。"}, {"id": 45, "cat": "RAG與檢索", "type": "概念", "q": "MCP拆解為Model、Context、Protocol三個字,其中「Protocol」代表什麼意思?", "opts": ["工具", "上下文", "AI", "協定"], "ans": 3, "exp": "筆記拆解:Model(AI)、Context(上下文)、Protocol(協定)。"}, {"id": 46, "cat": "RAG與檢索", "type": "概念", "q": "在MCP的三大角色中,「MCP Host」指的是什麼?", "opts": ["負責訓練模型參數的伺服器", "提供工具/資料的服務端,例如檔案系統、資料庫", "使用者操作的AI應用,例如Claude Desktop、Cursor", "Host內負責連線的元件,與Server一對一連接"], "ans": 2, "exp": "筆記表格:MCP Host是使用者操作的AI應用,例子為Claude Desktop、Cursor。"}, {"id": 47, "cat": "RAG與檢索", "type": "概念", "q": "在MCP的三大角色中,「MCP Server」指的是什麼?", "opts": ["負責向量化文字的Embedding模型", "提供工具/資料的服務端,例如檔案系統、資料庫、Slack、GitHub Server", "使用者操作的AI應用", "Host內負責連線的元件"], "ans": 1, "exp": "筆記表格:MCP Server是提供工具/資料的服務端,例子為檔案系統、資料庫、Slack、GitHub Server。"}, {"id": 48, "cat": "RAG與檢索", "type": "概念", "q": "MCP Server提供的三類能力中,「Resources(資源)」指的是什麼?", "opts": ["可讀取的資料,例如檔案內容", "負責連線的元件", "可被模型呼叫執行的功能,例如查詢資料庫", "預先定義好的提示範本"], "ans": 0, "exp": "筆記:MCP Server提供三類能力中,Resources(資源)是可讀取的資料,例如檔案內容。"}, {"id": 49, "cat": "RAG與檢索", "type": "概念", "q": "MCP Server提供的三類能力中,「Prompts(提示模板)」指的是什麼?", "opts": ["可被模型呼叫執行的功能", "預先定義好的提示範本", "可讀取的資料,例如檔案內容", "負責與Server一對一連接的元件"], "ans": 1, "exp": "筆記:MCP Server提供三類能力中,Prompts(提示模板)是預先定義好的提示範本。"}, {"id": 50, "cat": "RAG與檢索", "type": "概念", "q": "「文本切分(Chunking)」的核心定義為何?", "opts": ["把一份很長的文件,切割成許多較小且有意義的文字區塊(Chunk),方便AI理解、搜尋與回答", "把資料庫中的資料表進行正規化", "把多份文件合併成一份超長文件", "把文字轉換成圖片格式儲存"], "ans": 0, "exp": "筆記:Chunking是把一份很長的文件切割成許多較小且有意義的文字區塊,方便AI理解、搜尋與回答。"}, {"id": 51, "cat": "RAG與檢索", "type": "概念", "q": "「多向量檢索器(Multi-vector Retriever)」與一般檢索方式最大的差異為何?", "opts": ["不是每份文件只有一個向量,而是替同一份文件建立多個不同用途的向量,從更多角度去搜尋", "完全不使用向量,只用關鍵字比對", "只能檢索圖片資料,不能檢索文字", "每份文件只能建立一個向量,不能有多個"], "ans": 0, "exp": "筆記:多向量檢索器不是每份文件只有一個向量,而是替同一份文件建立多個不同用途的向量,從更多角度去搜尋,更容易找到真正相關的內容。"}, {"id": 52, "cat": "RAG與檢索", "type": "概念", "q": "若把RAG想像成一座圖書館,「檢索器(Retriever)」對應的角色是什麼?", "opts": ["替每一小段建立語意座標", "根據問題找出最相關的段落", "負責管理圖書館的借閱系統", "把一本書拆成很多小段落"], "ans": 1, "exp": "筆記圖書館比喻:檢索器(Retriever)是根據問題找出最相關的段落;文本切分是把書拆成小段落;向量是替每段建立語意座標。"}, {"id": 53, "cat": "RAG與檢索", "type": "情境", "q": "某企業想讓客服AI能回答關於「最新產品保固政策」的問題,但這項政策是上個月才更新、模型訓練時還不知道的資訊。為了讓AI能正確回答並避免憑空捏造答案,最適合採用下列哪個技術?", "opts": ["RAG(檢索增強生成)", "知識蒸餾(Knowledge Distillation)", "Beam Search", "剪枝(Pruning)"], "ans": 0, "exp": "從外部知識庫(如最新保固政策文件)搜尋相關資訊再生成答案,正是RAG的核心作用,能納入最新資訊並消除幻覺。"}, {"id": 54, "cat": "RAG與檢索", "type": "情境", "q": "一間軟體公司希望自家的AI助理(如Claude Desktop)能標準化地連接到公司內部的檔案系統、資料庫與Slack,而不用為每個工具寫一套客製化的整合程式碼。這最符合下列哪個標準協議的用途?", "opts": ["ACID交易原則", "MCP(Model Context Protocol)", "ETL資料處理流程", "REST API的四大限制"], "ans": 1, "exp": "MCP正是用來標準化AI模型與外部工具、資料來源之間連接方式的開放標準協議,解決工具整合碎片化的問題。"}, {"id": 55, "cat": "RAG與檢索", "type": "情境", "q": "工程師把一份100頁的員工手冊,依照段落與主題切成50個各自獨立、長度適中的文字區塊,再分別存入向量資料庫供後續搜尋使用。這個切割文件的步驟稱為什麼?", "opts": ["文本切分(Chunking)", "資料分片(Data Sharding)", "剪枝(Pruning)", "知識蒸餾(Knowledge Distillation)"], "ans": 0, "exp": "把長文件切割成較小且有意義的文字區塊,正是文本切分(Chunking)的定義,這是RAG流程中的重要前處理步驟。"}, {"id": 56, "cat": "RAG與檢索", "type": "情境", "q": "一套系統對同一份合約文件,分別建立了「條款摘要向量」「風險關鍵字向量」「金額數字向量」三種不同用途的向量索引,讓使用者可以從不同角度找到真正相關的段落。這種做法最符合下列哪個概念?", "opts": ["多向量檢索器(Multi-vector Retriever)", "K折交叉驗證", "資料淨化", "單一向量檢索(每份文件僅一個向量)"], "ans": 0, "exp": "替同一份文件建立多個不同用途的向量以從更多角度搜尋,正是多向量檢索器(Multi-vector Retriever)的定義。"}, {"id": 57, "cat": "RAG與檢索", "type": "情境", "q": "某開發團隊建立了一套系統,其中「Claude Desktop」負責與使用者互動,並透過一個中介元件與「公司GitHub伺服器」建立一對一連接,讓AI能讀取程式碼庫內容。請問「負責與Server一對一連接」的中介元件,在MCP架構中稱為什麼?", "opts": ["MCP Host", "MCP Server", "MCP Client", "MCP Tools"], "ans": 2, "exp": "筆記表格:MCP Client是Host內負責連線的元件,與Server一對一連接;Claude Desktop屬於MCP Host,GitHub Server屬於MCP Server。"}, {"id": 58, "cat": "提示工程", "type": "概念", "q": "「提示工程(Prompt Engineering)」最核心的一句話定義為何?", "opts": ["把模型參數壓縮到最小", "把所有資料都存進向量資料庫", "用聰明的方式問問題", "用最貴的硬體訓練模型"], "ans": 2, "exp": "筆記:「Prompt Engineering =『用聰明的方式問問題』」,你怎麼問AI就怎麼答。"}, {"id": 59, "cat": "提示工程", "type": "概念", "q": "提示工程的5大技巧不包含下列何者?", "opts": ["刪除模型的部分權重(Pruning)", "加入範例(Example)", "指定格式(Format)", "明確目標(Goal)"], "ans": 0, "exp": "提示工程5大技巧為:明確目標(Goal)、指定格式(Format)、設定角色(Role)、限制條件(Constraint)、加入範例(Example),不含刪除模型權重。"}, {"id": 60, "cat": "提示工程", "type": "概念", "q": "提示工程5大技巧中,「設定角色(Role)」是指什麼?", "opts": ["在Prompt中賦予AI一個特定身分或視角來回答問題", "在Prompt中加入具體範例讓AI模仿", "明確說出想要達成的目標", "限制AI回答的字數或格式規則"], "ans": 0, "exp": "設定角色(Role)是提示工程5大技巧之一,指賦予AI特定身分或視角(如「請你扮演一位資深律師」)來回答問題。"}, {"id": 61, "cat": "提示工程", "type": "概念", "q": "「自動提示工程(APE, Automatic Prompt Engineer)」的核心思想為何?", "opts": ["將Prompt的生成視為一個「黑盒子優化問題」", "完全依賴人工反覆嘗試不同的提示詞", "只能用於圖片生成任務,無法用於文字任務", "必須先剪枝模型才能運作"], "ans": 0, "exp": "筆記:APE的核心思想是將Prompt的生成視為一個黑盒子優化問題,讓AI自己幫AI寫出最佳Prompt。"}, {"id": 62, "cat": "提示工程", "type": "概念", "q": "APE(自動提示工程)的四個主要步驟依序為何?", "opts": ["提示詞評估→分數回饋→提示詞生成→疊代優化", "提示詞生成(Generation)→提示詞評估(Evaluation)→分數回饋→疊代優化(Iterate)", "分數回饋→提示詞生成→疊代優化→提示詞評估", "疊代優化→分數回饋→提示詞評估→提示詞生成"], "ans": 1, "exp": "筆記:APE四步驟依序為[輸入數據]→1.提示詞生成(Generation)→2.提示詞評估(Evaluation)→3.分數回饋→4.疊代優化(Iterate)→[輸出最佳Prompt]。"}, {"id": 63, "cat": "提示工程", "type": "概念", "q": "APE的主要優勢中,「超越人類直覺」指的是什麼?", "opts": ["AI只能模仿人類已經想到的提示詞", "AI無法理解人類設定的目標", "AI永遠無法找到比人類更好的提示詞", "AI常常能發現人類想不到的奇特字眼或結構,而這些字眼對LLM最有效"], "ans": 3, "exp": "筆記:APE的優勢之一是超越人類直覺,AI常發現人類想不到的奇特字眼或結構,而這些字眼對LLM最有效。"}, {"id": 64, "cat": "提示工程", "type": "概念", "q": "APE的主要優勢中,「高度適應性」指的是什麼?", "opts": ["APE需要人工重新設計整套演算法才能適應新模型", "APE只能適用於單一固定的模型,無法更換", "APE只適用於圖片生成模型", "當底層模型升級時,只需重新執行APE,就能自動適應新模型的脾氣"], "ans": 3, "exp": "筆記:APE高度適應性是指當底層模型升級(如GPT-3.5換GPT-4)時,只需重新執行APE就能自動適應新模型。"}, {"id": 65, "cat": "提示工程", "type": "概念", "q": "「CoT(Chain of Thought,思維鏈)」的核心定義為何?", "opts": ["引導模型一步一步推理,先寫出中間推理步驟,再給最終答案", "完全不給範例,直接下指令讓AI做事", "把推理過程展開成樹狀結構,同時探索多條路徑", "將思考過程組織成圖結構,節點是想法邊是想法間的關係"], "ans": 0, "exp": "筆記:CoT定義是引導模型一步一步推理,先寫出中間推理步驟,再給最終答案。"}, {"id": 66, "cat": "提示工程", "type": "概念", "q": "「ToT(Tree of Thought,思維樹)」的核心定義為何?", "opts": ["先給幾個範例,再讓AI照著學", "將思考過程組織成圖結構,分支可合併", "把推理過程展開成樹狀結構,同時探索多條思考路徑,並對各路徑評估,不佳的分支可回溯重來", "引導模型一步一步推理,先寫出中間推理步驟再給最終答案"], "ans": 2, "exp": "筆記:ToT是把推理過程展開成樹狀結構,同時探索多條思考路徑並評估,不佳的分支可回溯(backtrack)重來。"}, {"id": 67, "cat": "提示工程", "type": "概念", "q": "「Graph Prompting(圖提示/Graph of Thought)」與ToT相比,最大的優勢為何?", "opts": ["無法進行任何評估或回溯", "完全不能形成分支,只能單一路徑推理", "比樹更靈活,分支可以合併(aggregation)、可以形成迴路、可反覆精煉", "只能用於圖片生成任務"], "ans": 2, "exp": "筆記:Graph Prompting比樹更靈活,分支可以合併(aggregation)、可以形成迴路、可反覆精煉。"}, {"id": 68, "cat": "提示工程", "type": "概念", "q": "CoT、ToT、Graph三種進階提示技術中,結構屬於「鏈(線性)」、特性為「一步接一步,單一路徑」的是哪一個?", "opts": ["Graph/GoT", "CoT", "ToT", "APE"], "ans": 1, "exp": "筆記比較表:CoT結構是鏈(線性),特性是一步接一步、單一路徑。"}, {"id": 69, "cat": "提示工程", "type": "概念", "q": "CoT、ToT、Graph三種進階提示技術中,結構屬於「樹」、特性為「多分支探索、評估、回溯」的是哪一個?", "opts": ["ToT", "Graph/GoT", "APE", "CoT"], "ans": 0, "exp": "筆記比較表:ToT結構是樹,特性是多分支探索、評估、回溯。"}, {"id": 70, "cat": "提示工程", "type": "概念", "q": "CoT、ToT、Graph三種進階提示技術中,被形容為「分支可合併、可循環精煉,最靈活」的是哪一個?", "opts": ["CoT", "Graph/GoT", "ToT", "APE"], "ans": 1, "exp": "筆記比較表:Graph/GoT結構是圖,特性是分支可合併、可循環精煉,最靈活。"}, {"id": 71, "cat": "提示工程", "type": "概念", "q": "「零樣本提示(Zero-Shot Prompting)」的定義為何?", "opts": ["把推理過程展開成樹狀結構", "完全不給範例,直接下指令讓AI做事", "先給幾個範例,再讓AI照著學", "引導模型一步一步推理再給最終答案"], "ans": 1, "exp": "筆記:Zero-Shot Prompting是完全不給範例,直接下指令讓AI做事。"}, {"id": 72, "cat": "提示工程", "type": "概念", "q": "「少樣本提示(Few-Shot Prompting)」的定義為何?", "opts": ["先給幾個範例,再讓AI照著學", "把推理過程展開成樹狀結構同時探索多條路徑", "完全不給範例,直接下指令讓AI做事", "把思考過程組織成圖結構"], "ans": 0, "exp": "筆記:Few-Shot Prompting是先給幾個範例,再讓AI照著學。"}, {"id": 73, "cat": "提示工程", "type": "概念", "q": "「多模態提示工程(Multimodal Prompt Engineering)」的核心定義為何?", "opts": ["結合文字、圖像、音訊等多種感官與格式的輸入,引導AI模型生成精準回應的技術", "只能用於生成圖片,不能用於生成文字", "一種用來加密多媒體檔案的技術", "只能使用純文字輸入,不能結合其他格式"], "ans": 0, "exp": "筆記:多模態提示工程是結合文字、圖像、音訊等多種感官與格式的輸入,引導AI模型生成精準回應的技術。"}, {"id": 74, "cat": "提示工程", "type": "概念", "q": "多模態提示工程的核心技術與應用方向不包含下列何者?", "opts": ["跨模態生成(Cross-modal Generation)", "視覺問答與理解(VQA)", "K折交叉驗證(K-Fold Cross-Validation)", "多模態思維鏈(Multimodal CoT)"], "ans": 2, "exp": "多模態提示工程核心技術應用方向為:多模態思維鏈、視覺問答與理解(VQA)、跨模態生成,不含K折交叉驗證(那是模型評估技術)。"}, {"id": 75, "cat": "提示工程", "type": "概念", "q": "關於傳統Prompt與多模態Prompt的比較,下列敘述何者正確?", "opts": ["傳統Prompt理解更接近人類;多模態Prompt理解有限", "傳統Prompt只能「用說的」;多模態Prompt可以「用看+說」,理解更接近人類", "兩者完全相同,沒有任何差異", "多模態Prompt只能處理聲音,不能處理圖片"], "ans": 1, "exp": "筆記比較表:傳統Prompt只能用說的、容易描述不清、理解有限;多模態Prompt可以用看+說、圖片直接補充、理解更接近人類。"}, {"id": 76, "cat": "提示工程", "type": "概念", "q": "「情境工程(Context Engineering)」與傳統Prompt最大的差異為何?", "opts": ["與RAG及上下文管理完全無關", "只能使用單一固定格式的輸入", "完全不使用任何文字內容", "不只用文字下指令,而是同時使用圖片、聲音、影片、文字等多種資訊來引導AI做出更準確的回應"], "ans": 3, "exp": "筆記:情境工程不只是用文字下指令,而是同時使用圖片、聲音、影片、文字等多種資訊,因為現實世界不是只有文字。"}, {"id": 77, "cat": "提示工程", "type": "概念", "q": "「Context Engineering(上下文工程)」的核心定義為何?", "opts": ["只負責訓練模型的初始權重", "只負責清洗資料庫中的缺失值", "只負責把AI的回答格式化成JSON", "系統化地設計、組織、管理提供給LLM的上下文資訊,在有限的context window內放入對的資訊、格式與份量"], "ans": 3, "exp": "筆記:Context Engineering是系統化地設計、組織、管理提供給LLM的上下文資訊,在有限的context window內放入「對的資訊、對的格式、對的份量」。"}, {"id": 78, "cat": "提示工程", "type": "概念", "q": "Context Engineering的核心目標為何?", "opts": ["盡可能把所有可能相關的資料都塞進Prompt中", "在有限context window內最大化資訊的有效性", "降低模型的推論速度以提升準確率", "完全捨棄RAG技術,只依賴模型內部知識"], "ans": 1, "exp": "筆記考點提示:Context Engineering核心目標是在有限context window內最大化資訊的有效性。"}, {"id": 79, "cat": "提示工程", "type": "概念", "q": "關於Prompt Engineering與Context Engineering的區別,下列敘述何者正確?", "opts": ["Prompt Engineering著重「問法」;Context Engineering著重「整體上下文管理」", "Context Engineering只能用於圖片生成任務", "兩者是完全相同的概念,沒有區別", "Prompt Engineering著重整體上下文管理;Context Engineering著重問法"], "ans": 0, "exp": "筆記考點提示明確區分:Prompt Engineering(問法)vs Context Engineering(整體上下文管理)。"}, {"id": 80, "cat": "提示工程", "type": "概念", "q": "要讓AI輸出格式化,筆記中提到最有效的方法為何?", "opts": ["只能透過刪除模型參數(剪枝)達成", "只能透過重新訓練整個模型才能達成", "利用API的結構化輸出(Structured Output)或在Prompt中強制規範", "完全依賴使用者手動整理AI的回答"], "ans": 2, "exp": "筆記:讓AI輸出格式化最有效的方法是利用API的結構化輸出(Structured Output)或在Prompt中強制規範。"}, {"id": 81, "cat": "提示工程", "type": "概念", "q": "常見的AI輸出格式化方法不包含下列何者?", "opts": ["API結構化輸出(API Structured Output)", "提示詞工程(Prompt Engineering)", "知識蒸餾(Knowledge Distillation)", "第三方工具解析(Output Parsers)"], "ans": 2, "exp": "常見AI格式化方法為:API結構化輸出、提示詞工程、第三方工具解析(Output Parsers),不含知識蒸餾(那是模型壓縮技術)。"}, {"id": 82, "cat": "提示工程", "type": "概念", "q": "關於「輸出格式化AI」與「結構化應用」的核心差異比較,下列何者正確?", "opts": ["輸出格式化AI的核心是系統應用;結構化應用的核心是格式", "輸出格式化AI的核心是「格式」,目的是好讀、統一格式;結構化應用的核心是「系統應用」,目的是可自動化、可運算", "結構化應用只能用於網頁SEO,不能用於其他領域", "兩者完全相同,沒有差異"], "ans": 1, "exp": "筆記比較表:輸出格式化AI核心是格式,目的是好讀統一格式;結構化應用核心是系統應用,目的是可自動化可運算。"}, {"id": 83, "cat": "提示工程", "type": "概念", "q": "輸出格式化AI與結構化應用之間的關係,下列敘述何者正確?", "opts": ["格式化只能發生在結構化應用之後", "結構化應用必須先發生,才能進行格式化", "兩者是上下游關係:AI回答→(格式化)→JSON/表格→(結構化)→系統應用,先有格式化才能做結構化應用", "兩者是互相獨立、毫無關聯的概念"], "ans": 2, "exp": "筆記:「兩者其實是上下游關係」,AI回答→(格式化)→JSON/表格→(結構化)→系統應用,先有格式化才能做結構化應用。"}, {"id": 84, "cat": "提示工程", "type": "概念", "q": "「結構化應用」的核心定義為何?", "opts": ["只是刪除資料中的重複值", "只是把資料儲存成PDF檔案供人閱讀", "只是替AI的回答加上顏色與字體樣式", "將零散、未經組織的資訊,透過特定框架或工具轉換為有邏輯、可被系統理解的格式,並應用於實際系統中"], "ans": 3, "exp": "筆記:結構化應用是將零散、未經組織的資訊,透過特定框架或工具轉換為有邏輯、可被系統(如AI、搜尋引擎)理解的格式,並應用於實際系統中。"}, {"id": 85, "cat": "提示工程", "type": "概念", "q": "結構化應用的三大常見應用領域不包含下列何者?", "opts": ["大數據與AI模型訓練", "軟體與API資料交換", "神經網路的剪枝與知識蒸餾", "網頁SEO與AI搜尋最佳化"], "ans": 2, "exp": "結構化應用三大常見應用領域為:網頁SEO與AI搜尋最佳化、軟體與API資料交換、大數據與AI模型訓練,不含剪枝與知識蒸餾(那是模型壓縮技術)。"}, {"id": 86, "cat": "提示工程", "type": "概念", "q": "APE(自動提示工程)為何能省時省力?", "opts": ["因為它只需要執行一次就能永久適用所有模型", "因為它完全不需要任何資料集就能運作", "無需人工一個個測試,只要給定資料集,放著讓系統自動跑優化即可", "因為它會直接跳過提示詞評估步驟"], "ans": 2, "exp": "筆記:APE省時省力是因為無需人工一個個測試,只要給定資料集,放著讓系統自動跑優化即可。"}, {"id": 87, "cat": "提示工程", "type": "概念", "q": "提示工程5大技巧中,「限制條件(Constraint)」最主要的作用為何?", "opts": ["為AI的回答設下範圍或規則限制,例如字數、語言或禁止事項", "賦予AI一個特定身分來回答問題", "明確說出想要達成的目標", "在Prompt中加入具體範例讓AI模仿"], "ans": 0, "exp": "限制條件(Constraint)是提示工程5大技巧之一,用來為AI回答設下範圍或規則限制。"}, {"id": 88, "cat": "提示工程", "type": "概念", "q": "提示工程5大技巧中,「加入範例(Example)」最主要的作用為何?", "opts": ["明確說出想要達成的目標", "限制AI回答的字數或語言", "賦予AI一個特定身分或視角", "提供具體範例讓AI學習模仿回答的方式與風格"], "ans": 3, "exp": "加入範例(Example)是提示工程5大技巧之一,透過具體範例讓AI學習模仿回答的方式與風格,與Few-Shot Prompting概念相呼應。"}, {"id": 89, "cat": "提示工程", "type": "概念", "q": "Context Engineering範例中,「把整本300頁產品手冊全部塞進Prompt」被評價為哪種做法,原因為何?", "opts": ["差的做法,因為超出視窗、成本爆炸、雜訊多", "無關緊要的做法,對結果沒有任何影響", "好的做法,因為可以節省檢索的時間", "好的做法,因為資訊越多越完整越準確"], "ans": 0, "exp": "筆記範例:把整本300頁手冊全部塞進Prompt是「差的做法」,因為超出視窗、成本爆炸、雜訊多。"}, {"id": 90, "cat": "提示工程", "type": "概念", "q": "Context Engineering範例中,「好的做法」具體是如何處理客服AI的上下文?", "opts": ["把所有產品手冊內容全部放入Prompt中", "把客戶的所有歷史對話紀錄全部塞入Prompt", "完全不提供任何上下文資訊,只靠模型自行猜測", "用RAG檢索出最相關的3段說明+該客戶最近2筆訂單摘要+簡短系統指令,總共只佔幾千tokens"], "ans": 3, "exp": "筆記:好的做法是用RAG檢索出最相關的3段說明+該客戶最近2筆訂單摘要+簡短系統指令,總共只佔幾千tokens,回答又快又準。"}, {"id": 91, "cat": "提示工程", "type": "概念", "q": "關於「輸出格式化AI」與「結構化應用」在「範例」欄位的比較,下列何者正確?", "opts": ["輸出格式化AI沒有具體範例", "兩者範例完全相同", "輸出格式化AI範例為表格、JSON輸出;結構化應用範例為API、資料庫、流程", "輸出格式化AI範例為API、資料庫、流程;結構化應用範例為表格、JSON輸出"], "ans": 2, "exp": "筆記比較表:輸出格式化AI範例是表格、JSON輸出;結構化應用範例是API、資料庫、流程。"}, {"id": 92, "cat": "提示工程", "type": "概念", "q": "關於「輸出格式化AI」與「結構化應用」在「技術層級」欄位的比較,下列何者正確?", "opts": ["兩者皆屬於系統整合層級,沒有差異", "輸出格式化AI屬於系統整合層級;結構化應用屬於Prompt設計層級", "兩者皆與技術層級無關", "輸出格式化AI屬於Prompt設計層級;結構化應用屬於系統整合層級"], "ans": 3, "exp": "筆記比較表:輸出格式化AI技術層級是Prompt設計;結構化應用技術層級是系統整合。"}, {"id": 93, "cat": "提示工程", "type": "情境", "q": "小華在請AI幫忙寫文章時,先告訴AI「請你扮演一位國小老師」「文章請用200字以內」「請條列出三個重點」「這是我要的範例格式:...」並清楚說明「我要達成的目標是讓學生更容易理解光合作用」。小華同時用到了下列哪些提示工程技巧?", "opts": ["只用到CoT思維鏈", "設定角色、限制條件、指定格式、加入範例、明確目標", "只用到Zero-Shot Prompting", "只用到APE自動提示工程"], "ans": 1, "exp": "小華同時運用了提示工程5大技巧:明確目標、指定格式、設定角色、限制條件、加入範例。"}, {"id": 94, "cat": "提示工程", "type": "情境", "q": "某AI公司開發一套系統,讓程式自動產生大量候選提示詞,並用一份測試資料集自動評估每個提示詞的效果、給出分數,再根據分數反覆疊代優化提示詞,最終產出效果最好的版本,全程不需要工程師手動調整。這套系統最符合下列哪個技術?", "opts": ["RAG檢索增強生成", "APE(自動提示工程)", "K折交叉驗證", "Few-Shot Prompting"], "ans": 1, "exp": "自動生成提示詞→自動評估→分數回饋→疊代優化,全程自動化,正是APE的四步驟流程。"}, {"id": 95, "cat": "提示工程", "type": "情境", "q": "老師要求AI在解一道數學應用題時,「請先寫出你的計算過程與每一步的邏輯,最後再給出答案」,而不是直接跳到答案。這個做法最符合下列哪個進階提示技術?", "opts": ["CoT(思維鏈)", "ToT(思維樹)", "Zero-Shot Prompting", "Graph Prompting(圖提示)"], "ans": 0, "exp": "要求模型先寫出中間推理步驟、一步一步推理再給最終答案,正是CoT(Chain of Thought)的定義。"}, {"id": 96, "cat": "提示工程", "type": "情境", "q": "某團隊要求AI在規劃一趟旅遊行程時,同時展開「海島行程」「城市行程」「山區行程」三條不同的規劃路徑,分別評估各自的優缺點,若某條路徑明顯不佳就放棄並回頭嘗試其他路徑,最後選出最佳方案。這最符合下列哪個進階提示技術?", "opts": ["Few-Shot Prompting", "ToT(思維樹)", "APE(自動提示工程)", "CoT(思維鏈)"], "ans": 1, "exp": "同時探索多條思考路徑、評估、並對不佳分支回溯重來,正是ToT(Tree of Thought)的核心定義。"}, {"id": 97, "cat": "提示工程", "type": "情境", "q": "使用者直接要求AI「請幫我寫一封道歉信」,沒有提供任何範例道歉信給AI參考,AI就直接生成了一封信件。這種提示方式屬於下列哪一種?", "opts": ["CoT(思維鏈)", "Few-Shot Prompting(少樣本提示)", "ToT(思維樹)", "Zero-Shot Prompting(零樣本提示)"], "ans": 3, "exp": "完全不給範例,直接下指令讓AI做事,正是零樣本提示(Zero-Shot Prompting)的定義。"}, {"id": 98, "cat": "提示工程", "type": "情境", "q": "使用者在Prompt中先給AI看三封過去寫過的優秀道歉信作為範例,再要求AI「請照著這種風格,幫我寫一封新的道歉信」。這種提示方式屬於下列哪一種?", "opts": ["APE自動提示工程", "Zero-Shot Prompting(零樣本提示)", "情境工程", "Few-Shot Prompting(少樣本提示)"], "ans": 3, "exp": "先給幾個範例,再讓AI照著學,正是少樣本提示(Few-Shot Prompting)的定義。"}, {"id": 99, "cat": "提示工程", "type": "情境", "q": "某電商客服系統在使用者詢問「這件衣服適合我嗎」時,同時分析使用者上傳的自拍照片、輸入的文字描述,並結合先前的購物紀錄語音留言,共同判斷後生成回答建議。這套系統最主要運用了下列哪個概念?", "opts": ["K折交叉驗證", "純文字的Zero-Shot Prompting", "資料分片", "多模態提示工程(Multimodal Prompt Engineering)"], "ans": 3, "exp": "結合圖片、文字、語音等多種感官與格式的輸入來引導AI生成回應,正是多模態提示工程的定義。"}, {"id": 100, "cat": "提示工程", "type": "情境", "q": "某客服系統原本打算把整份300頁的產品手冊全部塞進Prompt讓AI回答客戶問題,結果超出上下文窗口限制且成本暴增。工程師後來改用RAG技術,只檢索出與問題最相關的3段說明,加上客戶最近的訂單摘要與簡短指令。這個改進過程最符合下列哪個工程概念?", "opts": ["Prompt Injection(提示注入攻擊)", "知識蒸餾(Knowledge Distillation)", "剪枝(Pruning)", "Context Engineering(上下文工程)"], "ans": 3, "exp": "在有限context window內放入對的資訊、格式與份量,正是Context Engineering的核心定義,此範例正符合筆記中「好的做法」。"}, {"id": 101, "cat": "提示工程", "type": "情境", "q": "開發團隊要求AI生成的回覆必須是固定結構的JSON資料,包含「姓名」「日期」「金額」三個欄位,以便讓後端程式直接讀取並寫入資料庫,而不是給人類閱讀的一般文字段落。這最主要體現下列哪個概念?", "opts": ["輸出格式化AI", "紅隊演練", "資料淨化", "領域漂移"], "ans": 0, "exp": "讓AI生成固定結構資料(如JSON)以便程式直接讀取,正是輸出格式化AI的定義,常透過API結構化輸出或Prompt強制規範達成。"}, {"id": 102, "cat": "提示工程", "type": "情境", "q": "某公司先讓AI把客戶留言格式化成統一的JSON資料(含姓名、問題類型、情緒分數),接著把這些JSON資料匯入資料庫,並串接到自動化的客服工單系統與資料分析報表中。這整個流程最符合下列哪兩個概念的上下游關係?", "opts": ["先「結構化應用」,再「輸出格式化AI」", "先「輸出格式化AI」,再「結構化應用」", "與輸出格式化和結構化應用皆無關", "兩者同時發生,沒有先後順序"], "ans": 1, "exp": "筆記明確指出兩者是上下游關係:AI回答→(格式化)→JSON/表格→(結構化)→系統應用,先有格式化才能做結構化應用,此案例正符合此流程。"}, {"id": 103, "cat": "提示工程", "type": "情境", "q": "某論文自動化寫作系統把不同段落的想法組織成節點,讓「文獻回顧」的想法與「研究方法」的想法可以互相參照、合併出新的論點,甚至反覆修正精煉,而不只是單一直線或樹狀的推理路徑。這最符合下列哪個進階提示技術?", "opts": ["ToT(思維樹)", "CoT(思維鏈)", "Graph Prompting(圖提示/Graph of Thought)", "Zero-Shot Prompting"], "ans": 2, "exp": "想法之間可以合併、形成迴路、反覆精煉,結構為圖而非單純線性或樹狀,正是Graph Prompting(Graph of Thought)的特色。"}, {"id": 104, "cat": "提示工程", "type": "情境", "q": "某企業想確保客服AI無論被問到什麼問題,回答風格都維持一致的專業形象,於是決定不採用完全自由發揮的方式,而是明確要求AI「達成的目標是解決客戶問題」「用條列式格式呈現步驟」「以親切但專業的客服人員角度回答」「回答不超過100字」,並附上一則過去的優良回覆當範例。這個做法完整運用了提示工程的哪個框架?", "opts": ["多模態提示工程的跨模態生成", "CoT思維鏈的單一路徑推理", "5大技巧:明確目標、指定格式、設定角色、限制條件、加入範例", "APE自動提示工程的四步驟"], "ans": 2, "exp": "此情境完整對應提示工程5大技巧:明確目標(解決客戶問題)、指定格式(條列式)、設定角色(客服人員角度)、限制條件(不超過100字)、加入範例(優良回覆範例)。"}, {"id": 105, "cat": "模型最佳化與部署", "type": "概念", "q": "「微調(Fine-tuning)」最核心的一句話定義為何?", "opts": ["把已經學過很多東西的模型,再用特定資料加強訓練,讓它更專業", "把模型中不重要的部分直接刪除", "把運算從雲端搬到裝置端處理", "把大模型的知識轉移給小模型"], "ans": 0, "exp": "筆記:「微調=把已經學過很多東西的模型,再用特定資料加強訓練,讓它更專業」。"}, {"id": 106, "cat": "模型最佳化與部署", "type": "概念", "q": "微調(Fine-tuning)的流程,下列敘述何者正確?", "opts": ["把模型部署到邊緣裝置上運算", "從零開始訓練一個全新的模型,不使用任何預訓練模型", "拿一個已經訓練好的模型(Pretrained Model),再用特定資料(如醫療、法律)繼續訓練調整參數權重", "只調整模型的輸出格式,不調整任何參數權重"], "ans": 2, "exp": "筆記:微調是拿已訓練好的模型,用特定資料(醫療、法律、公司資料)繼續訓練,調整參數權重,讓它變成某領域專家。"}, {"id": 107, "cat": "模型最佳化與部署", "type": "概念", "q": "「知識蒸餾(Knowledge Distillation, KD)」的核心概念為何?", "opts": ["把模型中不重要的權重直接刪除", "把運算搬到裝置端就近處理", "把厲害的大模型學到的知識,轉移給小模型", "把大量小模型合併成一個大模型"], "ans": 2, "exp": "筆記:知識蒸餾是把厲害的大模型學到的知識,轉移給小模型。"}, {"id": 108, "cat": "模型最佳化與部署", "type": "概念", "q": "知識蒸餾(KD)的做法中,下列敘述何者正確?", "opts": ["只保留學生模型的複雜結構,刪除老師模型的判斷能力", "只讓學生模型看正確答案,完全不學老師的思考過程", "不只讓學生模型看「正確答案」,還讓它學「老師模型怎麼思考」", "完全捨棄老師模型,重新訓練一個全新模型"], "ans": 2, "exp": "筆記:知識蒸餾的做法是不只讓學生看正確答案,還讓它學老師怎麼思考,把大模型的知識濃縮到小模型中。"}, {"id": 109, "cat": "模型最佳化與部署", "type": "概念", "q": "「剪枝(Pruning)」的核心定義為何?", "opts": ["把模型中不重要、貢獻小的部分刪掉", "把大模型的知識轉移給小模型", "把運算從雲端搬到裝置端", "把已訓練好的模型用特定資料繼續訓練"], "ans": 0, "exp": "筆記:剪枝就是把模型中「不重要、貢獻小」的部分刪掉。"}, {"id": 110, "cat": "模型最佳化與部署", "type": "概念", "q": "剪枝(Pruning)後的模型會帶來下列哪些效果?", "opts": ["只會讓模型變得更慢,沒有其他影響", "完全不影響模型的任何效能表現", "更大、更慢、更容易過擬合", "更小(省記憶體)、更快(推論速度提升)、更不容易過擬合"], "ans": 3, "exp": "筆記:剪枝讓模型變得更小(省記憶體)、更快(推論速度提升)、更不容易過擬合(避免記太多雜訊)。"}, {"id": 111, "cat": "模型最佳化與部署", "type": "概念", "q": "剪枝(Pruning)常見應用在哪些模型類型上?", "opts": ["只能用在向量資料庫的索引結構", "神經網路(刪掉某些權重或神經元)、決策樹(砍掉不重要的分支)", "只能用在決策樹,無法用於神經網路", "只能用在神經網路,無法用於決策樹"], "ans": 1, "exp": "筆記:剪枝常見用在神經網路(刪掉某些權重或神經元)、決策樹(砍掉不重要的分支)。"}, {"id": 112, "cat": "模型最佳化與部署", "type": "概念", "q": "關於剪枝(Pruning)的缺點,下列敘述何者正確?", "opts": ["剪枝後完全不需要任何後續處理", "剪枝會讓模型變得更大更慢", "剪枝完全沒有任何缺點", "剪太多會導致準確率下降,且需要重新微調"], "ans": 3, "exp": "筆記:剪枝的缺點是剪太多會導致準確率下降,且需要重新微調(fine-tune)。"}, {"id": 113, "cat": "模型最佳化與部署", "type": "概念", "q": "「批次推論(Batch Inference)」又稱為什麼?", "opts": ["即時推論(Real-time Inference)", "離線推論(Offline Inference)", "邊緣推論(Edge Inference)", "線上推論(Online Inference)"], "ans": 1, "exp": "筆記:批次推論稱為「離線推論(Offline Inference)」。"}, {"id": 114, "cat": "模型最佳化與部署", "type": "概念", "q": "批次推論(Batch Inference)的核心特點不包含下列何者?", "opts": ["低延遲(Low Latency)、即時反饋", "定時執行(Scheduled)", "高吞吐量(High Throughput)", "非即時性(High Latency)"], "ans": 0, "exp": "筆記:批次推論核心特點為非即時性(High Latency)、高吞吐量(High Throughput)、定時執行(Scheduled)、成本效益高,而非低延遲即時反饋。"}, {"id": 115, "cat": "模型最佳化與部署", "type": "概念", "q": "下列何者屬於批次推論(Batch Inference)的典型範例場景?", "opts": ["使用者輸入文字後立即取得的即時聊天回覆", "自駕車即時偵測前方障礙物", "語音助理的即時語音辨識", "電商平台的每日個人化推薦"], "ans": 3, "exp": "筆記:批次推論典型範例場景包含電商平台每日個人化推薦、銀行信用卡潛在風險審查、行銷活動客戶流失預測,預測結果不需要即時反饋。"}, {"id": 116, "cat": "模型最佳化與部署", "type": "概念", "q": "「Flash Attention」的核心目標為何?", "opts": ["把大模型的知識轉移給小模型", "評估模型在不同資料集上的準確率", "加速Transformer的Attention計算,並大幅降低記憶體使用", "把模型部署到邊緣裝置上運算"], "ans": 2, "exp": "筆記:Flash Attention的核心目標是加速Transformer的Attention計算(⚡)與大幅降低記憶體使用避免爆GPU(💾)。"}, {"id": 117, "cat": "模型最佳化與部署", "type": "概念", "q": "Flash Attention的核心想法可以總結為下列哪個描述?", "opts": ["把所有中間矩陣完整儲存以便重複使用", "刪除模型中不重要的神經元", "分塊+不存矩陣+邊算邊丟的高效Attention", "把運算全部搬到邊緣裝置處理"], "ans": 2, "exp": "筆記:Flash Attention核心想法是「分塊+不存矩陣+邊算邊丟」的高效Attention計算方法。"}, {"id": 118, "cat": "模型最佳化與部署", "type": "概念", "q": "Flash Attention的關鍵優化不包含下列何者?", "opts": ["記憶體最佳化", "Online Softmax", "K折交叉驗證(K-Fold Cross-Validation)", "分塊計算(Tiling)"], "ans": 2, "exp": "Flash Attention關鍵優化為分塊計算(Tiling)、Online Softmax、記憶體最佳化,不含K折交叉驗證(那是模型評估技術)。"}, {"id": 119, "cat": "模型最佳化與部署", "type": "概念", "q": "「MLOps」最貼切的比喻為何?", "opts": ["AI模型的資料視覺化工具", "AI模型的資料庫管理系統", "AI模型的DevOps(開發+維運)", "AI模型的加密演算法"], "ans": 2, "exp": "筆記:MLOps可理解為「AI模型的DevOps(開發+維運)」。"}, {"id": 120, "cat": "模型最佳化與部署", "type": "概念", "q": "MLOps主要目的是解決下列哪些痛點?", "opts": ["模型版本混亂與數據漂移等痛點", "GPU硬體採購成本過高", "模型完全無法進行任何推論運算", "資料表的正規化程度不足"], "ans": 0, "exp": "筆記:MLOps是自動化且標準化的實務流程,旨在簡化AI模型生命週期,解決模型版本混亂與數據漂移等痛點。"}, {"id": 121, "cat": "模型最佳化與部署", "type": "概念", "q": "MLOps的核心要素不包含下列何者?", "opts": ["模型監控", "自動化(CI/CD/CT)", "資料分片(Data Sharding)", "版本控管"], "ans": 2, "exp": "MLOps核心要素為版本控管、自動化(CI/CD/CT)、模型監控、回饋迴路,不含資料分片(那是資料工程技術)。"}, {"id": 122, "cat": "模型最佳化與部署", "type": "概念", "q": "MLOps核心關鍵字中的「Data Drift」指的是什麼?", "opts": ["版本控管", "資料漂移", "流程自動化", "模型持續更新"], "ans": 1, "exp": "筆記:MLOps核心關鍵字包含Pipeline(流程自動化)、CI/CD(模型持續更新)、Monitoring(監控模型)、Data Drift(資料漂移)、Versioning(版本控管)。"}, {"id": 123, "cat": "模型最佳化與部署", "type": "概念", "q": "「邊緣運算(Edge Computing)」的核心概念為何?", "opts": ["把模型中不重要的參數刪除", "把運算從遠端雲端搬到資料產生的附近(裝置端)來處理", "把模型的知識轉移給另一個更小的模型", "把所有運算都集中送到遠端雲端伺服器處理"], "ans": 1, "exp": "筆記:「一句話理解:把運算從遠端雲端搬到資料產生的附近(裝置端)來處理」,這正是邊緣運算的核心概念。"}, {"id": 124, "cat": "模型最佳化與部署", "type": "概念", "q": "邊緣運算(Edge Computing)的優點不包含下列何者?", "opts": ["更安全(資料不離開裝置)", "需要把所有原始資料都傳送到雲端才能運算", "即時反應", "省頻寬"], "ans": 1, "exp": "筆記:邊緣運算優點為即時反應、省頻寬、更安全(資料不離開裝置),裝置只傳必要結果到雲端甚至不傳,而非把所有原始資料都傳到雲端。"}, {"id": 125, "cat": "模型最佳化與部署", "type": "概念", "q": "「PEFT(參數高效微調)」的核心定義為何?", "opts": ["把模型的知識完全轉移給另一個小模型", "讓大型AI模型用少量參數完成微調的方法", "把模型中不重要的部分直接刪除", "把運算搬到邊緣裝置端處理"], "ans": 1, "exp": "筆記:PEFT是一種讓大型AI模型「用少量參數完成微調」的方法,不重新訓練整個大模型,只調整少量關鍵參數。"}, {"id": 126, "cat": "模型最佳化與部署", "type": "概念", "q": "PEFT與Full Fine-Tuning相比,在「GPU需求」與「速度」上的差異為何?", "opts": ["PEFT的GPU需求非常高、速度慢;Full Fine-Tuning的GPU需求低、速度快", "PEFT的GPU需求低、速度快;Full Fine-Tuning的GPU需求非常高、速度慢", "PEFT無法在GPU上運行,只能用CPU", "兩者GPU需求與速度完全相同"], "ans": 1, "exp": "筆記比較表:PEFT更新參數少量、GPU需求低、速度快;Full Fine-Tuning更新參數全部、GPU需求非常高、速度慢。"}, {"id": 127, "cat": "模型最佳化與部署", "type": "概念", "q": "PEFT與Full Fine-Tuning相比,在「模型保存」方式上的差異為何?", "opts": ["Full Fine-Tuning每個任務保存一份完整模型;PEFT只保存Adapter", "兩者皆不需要保存任何模型檔案", "兩者的模型保存方式完全相同", "PEFT每個任務保存一份完整模型;Full Fine-Tuning只保存Adapter"], "ans": 0, "exp": "筆記比較表:Full Fine-Tuning模型保存方式是「每個任務一份完整模型」;PEFT是「只保存Adapter」。"}, {"id": 128, "cat": "模型最佳化與部署", "type": "概念", "q": "PEFT與Full Fine-Tuning相比,在「多任務切換」與「效果」上的比較,下列何者正確?", "opts": ["PEFT完全無法用於多任務情境", "PEFT多任務切換容易、效果接近最佳;Full Fine-Tuning多任務切換困難、效果通常最佳", "兩者在多任務切換與效果上完全相同", "PEFT多任務切換困難、效果最差;Full Fine-Tuning多任務切換容易、效果最差"], "ans": 1, "exp": "筆記比較表:PEFT多任務切換「容易」、效果「接近最佳」;Full Fine-Tuning多任務切換「困難」、效果「通常最佳」。"}, {"id": 129, "cat": "模型最佳化與部署", "type": "概念", "q": "「低秩適配(LoRA, Low-Rank Adaptation)」的核心概念為何?", "opts": ["把整個大模型的所有參數重新訓練一遍", "用「小模型補丁」去微調大模型,而不是改整個模型", "把大模型的知識完全轉移給小模型", "把模型部署到邊緣裝置端運算"], "ans": 1, "exp": "筆記:「LoRA=用『小模型補丁』去微調大模型,而不是改整個模型」。"}, {"id": 130, "cat": "模型最佳化與部署", "type": "概念", "q": "LoRA解決微調問題的方式為何?", "opts": ["把原模型完整複製多份,分別訓練不同任務", "把原模型的知識轉移到另一個獨立的小模型", "不要動原模型,只加一小塊可訓練參數", "刪除原模型的大部分參數後重新訓練"], "ans": 2, "exp": "筆記:LoRA解決方式是「不要動原模型,只加一小塊可訓練參數」。"}, {"id": 131, "cat": "模型最佳化與部署", "type": "概念", "q": "LoRA屬於下列哪個更廣泛技術類別下的其中一種方法?", "opts": ["RAG(檢索增強生成)", "Beam Search(集束搜尋)", "PEFT(參數高效微調)", "MLOps(機器學習維運)"], "ans": 2, "exp": "筆記標題明確標示:「低秩適配(LoRA)PEFT其一方法」,LoRA是PEFT技術類別下的其中一種方法。"}, {"id": 132, "cat": "模型最佳化與部署", "type": "概念", "q": "邊緣運算(Edge Computing)的處理流程,下列敘述何者正確?", "opts": ["資料必須先經過知識蒸餾才能在裝置端運算", "裝置直接在「本地」處理資料,只傳必要結果到雲端(甚至不傳)", "裝置完全不具備任何運算能力", "所有資料都必須先傳到雲端處理完才能使用"], "ans": 1, "exp": "筆記:邊緣運算流程是裝置直接在本地處理資料,只傳必要結果到雲端(甚至不傳)。"}, {"id": 133, "cat": "模型最佳化與部署", "type": "情境", "q": "某科技公司拿一個已經學過大量通用語言知識的模型,再用公司內部的法律合約資料繼續訓練調整參數,讓這個模型變成「法律合約專家」,能更精準回答合約相關問題。這個過程最符合下列哪個技術?", "opts": ["K折交叉驗證", "邊緣運算(Edge Computing)", "微調(Fine-tuning)", "剪枝(Pruning)"], "ans": 2, "exp": "拿已訓練好的模型用特定領域資料(法律合約)繼續訓練,讓模型成為特定領域專家,正是微調(Fine-tuning)的定義。"}, {"id": 134, "cat": "模型最佳化與部署", "type": "情境", "q": "某手機廠商想讓手機上的AI助理更輕巧,於是找來一個效果很好但體積龐大的大模型當「老師」,訓練一個體積小很多的「學生」模型,讓學生模型不只學正確答案,還學老師的判斷邏輯,最終讓小模型的表現接近大模型。這最符合下列哪個技術?", "opts": ["批次推論(Batch Inference)", "知識蒸餾(Knowledge Distillation)", "剪枝(Pruning)", "LoRA(低秩適配)"], "ans": 1, "exp": "把大模型學到的知識轉移給小模型,讓學生模型學老師怎麼思考,正是知識蒸餾(Knowledge Distillation)的定義。"}, {"id": 135, "cat": "模型最佳化與部署", "type": "情境", "q": "工程師發現某個神經網路模型中有大量權重對最終預測結果貢獻極小,於是把這些權重刪除,讓模型體積變小、推論速度變快,但發現刪太多之後準確率明顯下降,只好重新做一次微調。這個過程最符合下列哪個技術?", "opts": ["剪枝(Pruning)", "RAG檢索增強生成", "MLOps", "知識蒸餾(Knowledge Distillation)"], "ans": 0, "exp": "把模型中不重要、貢獻小的部分刪掉以縮小模型、加速推論,但剪太多會導致準確率下降需要重新微調,正是剪枝(Pruning)的定義與缺點。"}, {"id": 136, "cat": "模型最佳化與部署", "type": "情境", "q": "某銀行系統每天凌晨固定執行一次程式,一次處理所有信用卡客戶的資料,評估每位客戶隔天的潛在風險等級,這個過程不需要立即回應任何操作中的使用者。這種執行模式最符合下列哪個概念?", "opts": ["多向量檢索器", "批次推論(Batch Inference)", "邊緣運算(Edge Computing)", "Flash Attention"], "ans": 1, "exp": "定時執行、一次性大量處理、預測結果不需要即時反饋給操作使用者,正是批次推論(Batch Inference)的典型範例,如銀行信用卡風險審查。"}, {"id": 137, "cat": "模型最佳化與部署", "type": "情境", "q": "工程團隊發現訓練大型Transformer模型時GPU記憶體經常爆滿,原因是Attention計算過程中產生的中間矩陣太大,於是改用一種將計算分塊處理、不完整儲存中間矩陣、邊算邊丟棄的方法,大幅降低了記憶體用量並加快了速度。這個方法最符合下列哪個技術?", "opts": ["知識蒸餾", "批次推論", "PEFT參數高效微調", "Flash Attention"], "ans": 3, "exp": "分塊+不存矩陣+邊算邊丟的高效Attention計算方法,正是Flash Attention的核心想法,用來加速並降低記憶體使用。"}, {"id": 138, "cat": "模型最佳化與部署", "type": "情境", "q": "某AI團隊建立了一套流程,讓模型從開發、測試、部署到上線後的監控都自動化且標準化,並持續追蹤上線後的資料是否與訓練時的資料出現落差,一旦發現版本混亂或資料落差就立即通知工程師處理。這套流程最符合下列哪個概念?", "opts": ["RAG檢索增強生成", "多模態提示工程", "剪枝(Pruning)", "MLOps(機器學習維運)"], "ans": 3, "exp": "自動化標準化管理AI模型整個生命週期,解決版本混亂與數據漂移痛點,正是MLOps的定義。"}, {"id": 139, "cat": "模型最佳化與部署", "type": "情境", "q": "某智慧工廠在生產線的攝影機旁裝設小型運算裝置,讓瑕疵檢測的AI模型直接在裝置端就近判讀影像,只把「合格/不合格」的結果傳回雲端,原始影像完全不上傳,藉此加快反應速度並保護資料安全。這最符合下列哪個概念?", "opts": ["批次推論(Batch Inference)", "MLOps", "邊緣運算(Edge Computing)", "知識蒸餾(Knowledge Distillation)"], "ans": 2, "exp": "裝置直接在本地處理資料,只傳必要結果到雲端甚至不傳,達到即時反應、省頻寬、資料不離開裝置的安全性,正是邊緣運算的定義。"}, {"id": 140, "cat": "模型最佳化與部署", "type": "情境", "q": "某新創公司資源有限,無法負擔重新訓練整個大型語言模型的GPU成本,於是只針對模型中新增的一小塊可訓練參數進行訓練,而不動原本模型的其餘部分,讓模型能快速適應新任務且方便針對不同客戶切換不同的Adapter。這最符合下列哪個技術?", "opts": ["批次推論", "Full Fine-Tuning(全參數微調)", "LoRA(低秩適配)", "剪枝(Pruning)"], "ans": 2, "exp": "不動原模型只加一小塊可訓練參數,正是LoRA的核心概念,屬於PEFT參數高效微調的一種方法,適合資源有限、需要快速切換任務的情境。"}, {"id": 141, "cat": "模型最佳化與部署", "type": "情境", "q": "比較兩種微調策略:方案A對模型的全部參數重新訓練,GPU需求非常高但效果通常最佳;方案B只調整少量關鍵參數,GPU需求低、速度快,且方便為不同客戶保存不同的Adapter快速切換。方案A與方案B分別對應下列哪兩個概念?", "opts": ["兩者皆為剪枝的不同做法", "方案A為PEFT;方案B為Full Fine-Tuning", "方案A為Full Fine-Tuning;方案B為PEFT", "兩者皆為知識蒸餾的不同做法"], "ans": 2, "exp": "全部參數重新訓練、GPU需求高、效果最佳,對應Full Fine-Tuning;只調整少量參數、GPU需求低、方便切換Adapter,對應PEFT,兩者比較正符合筆記表格內容。"}, {"id": 142, "cat": "模型評估", "type": "概念", "q": "「基準測試/模型評鑑(Benchmark)」的核心定義為何?", "opts": ["用於評估和比較不同AI模型、演算法或系統性能的標準化方法,提供客觀的性能指標", "一種用來清洗訓練資料的前處理方法", "一種用來把大模型知識轉移給小模型的技術", "一種用來加密模型參數的技術"], "ans": 0, "exp": "筆記:基準測試是用於評估和比較不同AI模型、演算法或系統性能的標準化方法,提供客觀的性能指標。"}, {"id": 143, "cat": "模型評估", "type": "概念", "q": "「延遲測試(Latency Testing)」主要在衡量系統的什麼特性?", "opts": ["系統的模型參數總數", "系統儲存資料的容量大小", "系統對抗惡意攻擊的能力", "系統反應有多快"], "ans": 3, "exp": "筆記:延遲測試是在衡量一個系統「反應有多快」,延遲越低使用者體驗越好。"}, {"id": 144, "cat": "模型評估", "type": "概念", "q": "「數據漂移(Data Drift)」的核心定義為何?", "opts": ["模型被駭客植入後門程式", "模型的參數量隨著時間自動增加", "模型在用的資料,和當初訓練時的資料變得不一樣了", "模型的推論速度隨時間變快"], "ans": 2, "exp": "筆記:數據漂移是「模型在用的資料,和當初訓練時的資料,變得不一樣了」。"}, {"id": 145, "cat": "模型評估", "type": "概念", "q": "數據漂移(Data Drift)常見的類型不包含下列何者?", "opts": ["以上皆是數據漂移類型", "特徵漂移(Feature Drift)", "後門攻擊(Backdoor Attack)", "資料分布漂移(Distribution Drift)"], "ans": 2, "exp": "數據漂移常見類型為特徵漂移(輸入資料變了)、資料分布漂移(整體資料型態改變),不包含後門攻擊(那是資安攻擊手法)。"}, {"id": 146, "cat": "模型評估", "type": "概念", "q": "數據漂移類型中,「特徵漂移(Feature Drift)」指的是什麼?", "opts": ["模型參數被竄改", "整體資料型態改變", "模型的訓練環境改變", "輸入資料變了"], "ans": 3, "exp": "筆記:特徵漂移(Feature Drift)指的是「輸入資料變了」。"}, {"id": 147, "cat": "模型評估", "type": "概念", "q": "「領域漂移(Domain Shift)」最貼切的比喻為何?", "opts": ["模型的推論速度變慢", "模型被植入了特定觸發條件的後門", "考試前讀的是A版本教材,但考試出的是B版本內容,不是不會而是環境變了", "模型的參數量突然大幅增加"], "ans": 2, "exp": "筆記比喻:領域漂移就像考試前讀A版本教材,但考試出B版本內容,你不是不會而是「環境變了」,指模型學習的環境和實際使用的環境不一樣。"}, {"id": 148, "cat": "模型評估", "type": "概念", "q": "「平均絕對誤差(MAE)」主要用來評估哪一類模型的預測準確度?", "opts": ["生成式模型(Generative Model)", "分類模型(Classification Model)", "迴歸模型(Regression Model)", "序列標註模型"], "ans": 2, "exp": "筆記:MAE是用來評估迴歸模型(Regression Model)預測準確度最直觀且常用的指標之一。"}, {"id": 149, "cat": "模型評估", "type": "概念", "q": "MAE(平均絕對誤差)的特點不包含下列何者?", "opts": ["對所有誤差的懲罰是線性的", "對異常值(Outliers)極度敏感,容易被單一極端值嚴重扭曲", "直觀且具備相同單位", "對異常值(Outliers)具備魯棒性(Robust)"], "ans": 1, "exp": "筆記:MAE的特點是直觀且具備相同單位,對異常值具備魯棒性(Robust),對誤差的懲罰是線性的,而非對異常值極度敏感。"}, {"id": 150, "cat": "模型評估", "type": "概念", "q": "「均方誤差(MSE)」的計算方式為何?", "opts": ["把每個錯誤取對數後,再取平均", "把每個錯誤直接加總,不取平均", "把每個錯誤「平方」後,再取平均", "把每個錯誤取絕對值後,再取平均"], "ans": 2, "exp": "筆記:「MSE=把每個錯誤『平方』後,再取平均」。"}, {"id": 151, "cat": "模型評估", "type": "概念", "q": "「交叉熵損失(Cross-Entropy Loss)」主要用來衡量什麼?", "opts": ["模型的推論速度快慢", "模型的參數總量大小", "模型是否遭受對抗性攻擊", "模型預測的機率分布與真實分布的差異,且對「錯誤且自信」的預測給予更大懲罰"], "ans": 3, "exp": "筆記:交叉熵損失是用來衡量模型預測的機率跟真實答案差多遠,且會對「錯誤且自信的預測」給予更大懲罰的損失函數。"}, {"id": 152, "cat": "模型評估", "type": "概念", "q": "關於交叉熵(Cross-Entropy)數值高低的意義,下列敘述何者正確?", "opts": ["交叉熵越高越警訊,越低代表模型狀況越好", "交叉熵的高低與模型表現完全無關", "交叉熵只能是正值,無法反映模型好壞", "交叉熵越高代表模型狀況越好,越低代表越警訊"], "ans": 0, "exp": "筆記:「交叉熵越高越警訊,越低代表模型狀況越好」。"}, {"id": 153, "cat": "模型評估", "type": "概念", "q": "關於Accuracy與Cross-Entropy的比較,下列敘述何者正確?", "opts": ["Accuracy看錯得多離譜;Cross-Entropy只看對或錯", "Accuracy只能用於迴歸模型,不能用於分類模型", "兩者衡量的內容完全相同", "Accuracy只看對或錯;Cross-Entropy看「錯得多離譜」"], "ans": 3, "exp": "筆記表格:Accuracy功能是「只看對或錯」;Cross-Entropy功能是「看『錯得多離譜』」。"}, {"id": 154, "cat": "模型評估", "type": "概念", "q": "「K折交叉驗證(K-Fold Cross-Validation)」的核心思想為何?", "opts": ["只用一份固定的資料同時當訓練集與測試集", "把所有資料都當作訓練集,完全不保留測試集", "把數據分成不同的部分,輪流當作「訓練集」和「測試集」,確保模型在沒看過的資料上也能表現良好", "把資料依照時間先後順序切割成兩半,不輪流互換"], "ans": 2, "exp": "筆記:交叉驗證的核心思想是把數據分成不同部分,輪流當作訓練集和測試集,確保模型在沒看過的資料上也能表現良好。"}, {"id": 155, "cat": "模型評估", "type": "概念", "q": "K折交叉驗證主要用來評估模型效能與防止下列哪個問題?", "opts": ["資料分片不均", "資料外洩(Data Leakage)", "後門攻擊(Backdoor Attack)", "過擬合(Overfitting)"], "ans": 3, "exp": "筆記:K折交叉驗證是機器學習中用來評估模型效能與防止過擬合(Overfitting)的重要技術。"}, {"id": 156, "cat": "模型評估", "type": "概念", "q": "K折交叉驗證相較於單純切一次訓練集/測試集的方式,最大的優勢為何?", "opts": ["讓每一筆資料都有機會當作訓練集和測試集,大大減少因資料切分不均勻帶來的偏誤,評估結果更穩定", "可以讓模型參數量自動減少", "可以完全省略測試集,只用訓練集評估", "可以避免資料需要做任何前處理"], "ans": 0, "exp": "筆記:K折交叉驗證讓每一筆資料都有機會當訓練集和測試集,減少因資料切分不均勻帶來的偏誤,評估結果更穩定、更具公信力。"}, {"id": 157, "cat": "模型評估", "type": "概念", "q": "「MMLU」最貼切的比喻為何?", "opts": ["AI的綜合學力測驗", "AI的反應速度測試", "AI的小學數學考試", "AI的中文學科考試"], "ans": 0, "exp": "筆記:MMLU可以理解成「AI的綜合學力測驗」。"}, {"id": 158, "cat": "模型評估", "type": "概念", "q": "MMLU(大規模多任務語言理解)涵蓋多少個學科的選擇題測驗?", "opts": ["100個學科", "5個學科", "10個學科", "57個學科"], "ans": 3, "exp": "筆記:MMLU是一套涵蓋57個學科、跨領域、多學科的選擇題測驗。"}, {"id": 159, "cat": "模型評估", "type": "概念", "q": "MMLU測驗主要用來評估AI的哪些能力?", "opts": ["只評估AI的圖片辨識能力", "只評估AI的程式除錯能力", "只評估AI的語音辨識速度", "知識廣度(Knowledge Coverage)、推理能力(Reasoning)、語言理解(Language Understanding)"], "ans": 3, "exp": "筆記:MMLU評估知識廣度(Knowledge Coverage)、推理能力(Reasoning)、語言理解(Language Understanding)。"}, {"id": 160, "cat": "模型評估", "type": "概念", "q": "MMLU測驗的限制為何?", "opts": ["只能用於中文語言模型,不能用於英文模型", "主要是選擇題,不代表真正理解", "完全沒有任何限制,可以完美評估AI的所有能力", "只能測試圖片辨識能力,不能測試文字能力"], "ans": 1, "exp": "筆記:MMLU的限制是「主要是選擇題(不代表真正理解)」。"}, {"id": 161, "cat": "模型評估", "type": "概念", "q": "「GSM8K」最貼切的比喻為何?", "opts": ["AI的程式碼除錯測試", "AI的小學數學考試", "AI的綜合學力測驗", "AI的中文學科考試"], "ans": 1, "exp": "筆記:GSM8K是AI的「小學數學考試」。"}, {"id": 162, "cat": "模型評估", "type": "概念", "q": "在GSM8K、MATH、AIME三個數學資料集的難度比較中,下列排序何者正確?", "opts": ["GSM8K(小學)< MATH(高中～競賽)< AIME(奧數)", "MATH(小學)< GSM8K(高中～競賽)< AIME(奧數)", "三者難度完全相同,沒有差異", "AIME(小學)< MATH(高中～競賽)< GSM8K(奧數)"], "ans": 0, "exp": "筆記難度表:GSM8K為小學⭐,MATH為高中～競賽⭐⭐⭐,AIME為奧數⭐⭐⭐⭐,難度依序遞增。"}, {"id": 163, "cat": "模型評估", "type": "概念", "q": "「C-Eval」的主要用途為何?", "opts": ["專門用來測試模型的程式碼執行速度", "專門用來測試英文語言模型的通識能力", "專門用來測試模型的圖片生成品質", "專門用來測試和評估中文大型語言模型(LLM)的中文測驗基準"], "ans": 3, "exp": "筆記:C-Eval是專門用來測試和評估「中文大型語言模型(LLM)」的中文測驗基準。"}, {"id": 164, "cat": "模型評估", "type": "概念", "q": "C-Eval測驗主要評估AI的哪些能力?", "opts": ["只評估AI的圖片辨識能力", "只評估AI的語音合成品質", "只評估AI的英文寫作能力", "知識能力、推理能力、中文理解能力"], "ans": 3, "exp": "筆記:C-Eval用來測試AI的知識能力、推理能力、中文理解能力,題目全部是中文。"}, {"id": 165, "cat": "模型評估", "type": "概念", "q": "在MMLU、GSM8K、C-Eval三個Benchmark的比較表中,「重點」欄位對應MMLU的內容為何?", "opts": ["延遲反應速度", "中文知識+推理", "數學推理", "通識能力"], "ans": 3, "exp": "筆記比較表:MMLU(英文,通識能力)、GSM8K(英文,數學推理)、C-Eval(中文,中文知識+推理)。"}, {"id": 166, "cat": "模型評估", "type": "概念", "q": "在MMLU、GSM8K、C-Eval三個Benchmark的比較表中,「語言」欄位對應C-Eval的內容為何?", "opts": ["中文", "中英文皆可", "英文", "與語言無關"], "ans": 0, "exp": "筆記比較表:C-Eval的語言是中文,重點是中文知識+推理;MMLU與GSM8K的語言皆為英文。"}, {"id": 167, "cat": "模型評估", "type": "情境", "q": "某研究團隊想知道自己開發的中文AI模型,在「數學推理」「通識知識」「中文理解」三個不同能力面向上,和其他知名模型相比表現如何,於是分別用三套不同的標準化選擇題測驗來評分比較。這種評分比較方式最符合下列哪個概念?", "opts": ["剪枝(Pruning)", "基準測試/模型評鑑(Benchmark)", "Flash Attention", "K折交叉驗證"], "ans": 1, "exp": "用標準化的方法評估和比較不同AI模型的性能,提供客觀的性能指標,正是Benchmark(基準測試)的定義。"}, {"id": 168, "cat": "模型評估", "type": "情境", "q": "某電商網站的AI客服系統原本回應使用者問題只需要0.3秒,但最近使用者反映常常要等5秒以上才有回覆,工程團隊決定測量系統從接收問題到給出回覆之間的反應時間。這項測量工作屬於下列哪個概念?", "opts": ["知識蒸餾", "延遲測試(Latency Testing)", "K折交叉驗證", "數據漂移偵測"], "ans": 1, "exp": "衡量系統反應有多快,正是延遲測試(Latency Testing)的定義,延遲越低使用者體驗越好。"}, {"id": 169, "cat": "模型評估", "type": "情境", "q": "某銀行的貸款風險評分模型,是用疫情前的客戶消費與收入資料訓練的,疫情後社會整體的消費型態與收入分布都出現大幅變化,導致模型現在的預測準確率明顯下降。這個現象最符合下列哪個概念?", "opts": ["知識蒸餾(Knowledge Distillation)", "後門攻擊(Backdoor Attack)", "剪枝(Pruning)", "數據漂移(Data Drift)"], "ans": 3, "exp": "模型在用的資料和當初訓練時的資料變得不一樣了,正是數據漂移(特別是資料分布漂移)的定義。"}, {"id": 170, "cat": "模型評估", "type": "情境", "q": "某AI模型是用歐美使用者的行為資料訓練完成的,但後來被部署到東南亞市場使用,結果發現使用者的行為模式與消費習慣和訓練資料差異極大,導致模型判斷失準,並非模型本身能力不足。這個現象最符合下列哪個概念?", "opts": ["領域漂移(Domain Shift)", "剪枝(Pruning)", "K折交叉驗證", "MLOps"], "ans": 0, "exp": "模型學習的環境(歐美使用者資料)和實際使用的環境(東南亞市場)不一樣,正是領域漂移(Domain Shift)的定義,如同讀A版教材卻考B版內容。"}, {"id": 171, "cat": "模型評估", "type": "情境", "q": "某房地產估價模型預測房價時,大部分預測與實際成交價只差幾十萬元,但少數幾筆豪宅預測誤差高達上千萬元。資料科學家想選用一個「不會被這些少數極端誤差過度放大影響」的指標來評估整體模型表現。下列哪個指標最適合?", "opts": ["MSE(均方誤差)", "MAE(平均絕對誤差)", "延遲測試", "Cross-Entropy Loss(交叉熵損失)"], "ans": 1, "exp": "MAE對異常值(Outliers)具備魯棒性(Robust),對所有誤差的懲罰是線性的,不會像MSE一樣因平方而被少數極端誤差過度放大,適合此情境。"}, {"id": 172, "cat": "模型評估", "type": "情境", "q": "某研究團隊只用一次固定的80%資料當訓練集、20%資料當測試集來評估模型,擔心這樣的切分方式可能剛好把某些特殊樣本都分到同一邊,導致評估結果不夠穩定。為了讓每一筆資料都有機會當訓練集與測試集,最適合改用下列哪個技術?", "opts": ["SMOTE過採樣", "剪枝(Pruning)", "Flash Attention", "K折交叉驗證(K-Fold Cross-Validation)"], "ans": 3, "exp": "讓每一筆資料都有機會當訓練集和測試集,減少資料切分不均勻帶來的偏誤,正是K折交叉驗證的核心優勢。"}, {"id": 173, "cat": "模型評估", "type": "情境", "q": "某團隊想驗證自家新開發的中文大型語言模型,在「中文知識」與「中文推理能力」上是否夠聰明,決定用一套全部以中文命題、涵蓋各學科知識與推理題目的選擇題測驗來評分。這套測驗最可能是下列哪一個?", "opts": ["GSM8K", "C-Eval", "AIME", "MMLU"], "ans": 1, "exp": "C-Eval是專門用來測試和評估中文大型語言模型的中文測驗基準,題目全部是中文,用來測試知識能力、推理能力、中文理解能力。"}, {"id": 174, "cat": "模型評估", "type": "情境", "q": "某模型在做圖片分類時,對於一張其實是「貓」的圖片,模型不僅分類錯誤判斷成「狗」,而且給出的信心分數高達99%,非常自信卻大錯特錯。若使用交叉熵損失(Cross-Entropy Loss)來評估這個預測,結果會是如何?", "opts": ["交叉熵完全不會給予任何懲罰,因為信心分數很高", "交叉熵會給予很大的懲罰,因為對「錯誤且自信」的預測懲罰更重", "交叉熵只看對或錯,不考慮信心分數高低", "交叉熵會因為信心分數高而給予獎勵,降低損失值"], "ans": 1, "exp": "交叉熵損失會對「錯誤且自信的預測」給予更大懲罰,此案例中模型錯誤分類又非常自信(99%),因此會產生很高的交叉熵損失,提示模型狀況不佳。"}, {"id": 175, "cat": "應用與工具", "type": "概念", "q": "「OCR(光學字元辨識)」最核心的一句話定義為何?", "opts": ["把「聲音」轉換成「文字」", "把「文字」變成「圖片」", "把「表格資料」轉換成「圖表」", "把「圖片中的字」變成「可以複製的文字」"], "ans": 3, "exp": "筆記:「OCR=把『圖片中的字』變成『可以複製的文字』」,讓電腦看懂圖片或紙本上的文字並轉換成可編輯搜尋的數位文字。"}, {"id": 176, "cat": "應用與工具", "type": "概念", "q": "「文件辨識(Document Intelligence)」與OCR最主要的差異為何?", "opts": ["兩者功能完全相同,沒有任何差異", "OCR比Document Intelligence功能更進階", "Document Intelligence不只看懂文字,還能理解整份文件的結構與內容(如標題、表格、金額)", "Document Intelligence只能辨識手寫字,OCR只能辨識印刷字"], "ans": 2, "exp": "筆記:OCR只負責把圖片中的字變成文字;Document Intelligence更進一步看懂版面、知道哪裡是標題/表格/金額、抽取重點資訊。"}, {"id": 177, "cat": "應用與工具", "type": "概念", "q": "關於「AI輔助程式開發工具」的核心定義,下列敘述何者正確?", "opts": ["只能除錯,不具備程式碼生成能力", "只能在雲端伺服器上運行,無法整合進編輯器", "只能用來撰寫文件,不能用來寫程式碼", "將LLM整合進程式編輯器,提供程式碼自動補全、生成、解釋、除錯、重構等功能"], "ans": 3, "exp": "筆記:AI輔助開發工具是將LLM整合進程式編輯器,提供程式碼自動補全、生成、解釋、除錯、重構等功能的工具。"}, {"id": 178, "cat": "應用與工具", "type": "概念", "q": "關於GitHub Copilot與Cursor的型態差異,下列敘述何者正確?", "opts": ["兩者皆為獨立編輯器,沒有外掛版本", "兩者皆為編輯器外掛,沒有獨立版本", "Copilot是編輯器外掛;Cursor是獨立編輯器", "Copilot是獨立編輯器;Cursor是編輯器外掛"], "ans": 2, "exp": "筆記:「Copilot=外掛;Cursor=獨立AI編輯器,記住型態差異」。"}, {"id": 179, "cat": "應用與工具", "type": "概念", "q": "GitHub Copilot與Cursor在「強項」上的比較,下列敘述何者正確?", "opts": ["Copilot強項是行內補全、生態整合;Cursor強項是全專案理解、Agent式多檔編輯", "Copilot和Cursor都只能做行內補全", "兩者強項完全相同,沒有差異", "Copilot強項是全專案理解;Cursor強項是行內補全"], "ans": 0, "exp": "筆記比較表:GitHub Copilot強項為行內補全、生態整合;Cursor強項為全專案理解、Agent式多檔編輯。"}, {"id": 180, "cat": "應用與工具", "type": "概念", "q": "「TensorFlow」是由哪個團隊於何時開源的框架?", "opts": ["Anthropic於2024年開源", "OpenAI於2022年開源", "Meta(前Facebook)AI研究團隊於2016年開源", "Google Brain團隊於2015年開源"], "ans": 3, "exp": "筆記:TensorFlow是Google Brain團隊於2015年開源的框架。"}, {"id": 181, "cat": "應用與工具", "type": "概念", "q": "TensorFlow的設計初衷主要是為了滿足下列哪種需求?", "opts": ["個人開發者的輕量級應用", "大規模生產環境(Production)與工業級部署", "學術研究人員快速實驗與除錯", "純粹的資料視覺化需求"], "ans": 1, "exp": "筆記:TensorFlow的設計初衷是為了滿足大規模生產環境與工業級部署的需求。"}, {"id": 182, "cat": "應用與工具", "type": "概念", "q": "筆記中將TensorFlow比喻為下列何者?", "opts": ["遙控器按鈕", "圖書館的檢索系統", "高階樂高積木(或實驗室)", "自動化大工廠"], "ans": 3, "exp": "筆記比喻:TensorFlow就像「自動化大工廠」,建置生產線需要花較多心思,但工廠蓋好後量產出貨布署效率非常驚人。"}, {"id": 183, "cat": "應用與工具", "type": "概念", "q": "「PyTorch」是由哪個團隊於何時開源的框架?", "opts": ["Google Brain團隊於2015年開源", "Meta(前Facebook)AI研究團隊於2016年開源", "微軟於2020年開源", "Anthropic於2024年開源"], "ans": 1, "exp": "筆記:PyTorch是由Meta(前Facebook)AI研究團隊於2016年開源。"}, {"id": 184, "cat": "應用與工具", "type": "概念", "q": "PyTorch的設計理念「Pythonic」指的是什麼?", "opts": ["只能用C++撰寫,不支援Python語法", "符合Python開發者的直覺", "只能在Google Cloud上運行", "完全不支援任何程式語言的語法糖"], "ans": 1, "exp": "筆記:PyTorch設計理念是「Pythonic」,即符合Python開發者的直覺,寫起來像寫純Python。"}, {"id": 185, "cat": "應用與工具", "type": "概念", "q": "筆記中將PyTorch比喻為下列何者?", "opts": ["自動化大工廠", "遙控器按鈕", "圖書館的借閱系統", "高階樂高積木(或實驗室)"], "ans": 3, "exp": "筆記比喻:PyTorch就像「高階樂高積木(或實驗室)」,可以一邊組裝一邊看效果,隨時拆掉重來。"}, {"id": 186, "cat": "應用與工具", "type": "概念", "q": "下列何者屬於筆記建議「選擇PyTorch」的情境?", "opts": ["身分是學生、研究生、研究人員,重視學習曲線與開發體驗", "完全不在乎學術論文與開源專案的相容性", "身處傳統大型企業,已圍繞Google Cloud建置大型生產線", "專案非常看重邊緣設備部署,需要TensorFlow Lite支援"], "ans": 0, "exp": "筆記:選擇PyTorch的情境包含身為學生、研究生、研究人員(學術論文與開源專案幾乎都是PyTorch天下),以及重視學習曲線與開發體驗。"}, {"id": 187, "cat": "應用與工具", "type": "概念", "q": "下列何者屬於筆記建議「選擇TensorFlow」的情境?", "opts": ["專案非常看重邊緣設備部署,例如要在嵌入式晶片上跑優化模型", "希望寫程式的痛楚感比較低,像寫純Python", "完全不考慮企業內部既有的技術架構", "身分是學生或研究人員,重視學習曲線"], "ans": 0, "exp": "筆記:選擇TensorFlow的情境包含身處傳統大型企業(圍繞GCP或TensorFlow建置生產線),以及專案非常看重邊緣設備部署(TensorFlow Lite支援紮實)。"}, {"id": 188, "cat": "應用與工具", "type": "概念", "q": "關於API與REST API的關係,下列敘述何者正確?", "opts": ["API是溝通方式的泛稱;REST API是其中一種使用HTTP協定、遵循REST風格設計的優良溝通標準", "API只能用於資料庫查詢,REST API只能用於檔案傳輸", "兩者是完全獨立、沒有任何關係的概念", "REST API是溝通方式的泛稱;API是其中一種特定標準"], "ans": 0, "exp": "筆記:「API是一個泛稱,指軟體間溝通的橋樑;而REST API是一種使用HTTP協定並遵循特定REST風格來設計的API」。"}, {"id": 189, "cat": "應用與工具", "type": "概念", "q": "REST API的四大關鍵限制不包含下列何者?", "opts": ["強制加密(Mandatory Encryption)", "無狀態(Stateless)", "客戶端-伺服器分離(Client-Server)", "統一介面(Uniform Interface)"], "ans": 0, "exp": "REST API四大關鍵限制為客戶端-伺服器分離、無狀態、可快取(Cacheable)、統一介面,不含強制加密。"}, {"id": 190, "cat": "應用與工具", "type": "概念", "q": "REST API四大關鍵限制中的「無狀態(Stateless)」指的是什麼概念?", "opts": ["每次請求都必須包含完整資訊,伺服器不會保存前一次請求的狀態", "客戶端與伺服器必須綁定在同一台機器上", "所有請求結果都不可以被快取", "伺服器會永久記住每一次請求的完整歷史紀錄"], "ans": 0, "exp": "無狀態(Stateless)是REST API四大關鍵限制之一,指每次請求都是獨立的,伺服器不依賴先前請求保存的狀態資訊。"}, {"id": 191, "cat": "應用與工具", "type": "概念", "q": "「反洗錢人工智慧(AML AI)」的核心作用為何?", "opts": ["利用AI技術自動生成金融行銷文案", "利用AI技術自動計算股票的技術指標", "利用AI技術自動偵測金融交易中的可疑活動,協助金融機構遵守法規、打擊洗錢犯罪", "利用AI技術自動核准所有貸款申請"], "ans": 2, "exp": "筆記:反洗錢人工智慧(AML AI)利用AI技術自動偵測金融交易中的可疑活動,協助金融機構遵守法規、打擊洗錢犯罪。"}, {"id": 192, "cat": "應用與工具", "type": "概念", "q": "關於AML AI的運作邏輯,下列敘述何者正確?", "opts": ["目的是自動核准所有交易,加快處理速度", "不是抓每筆怪交易,而是先把最值得查的名單排出來", "只針對現金交易進行分析,不處理數位交易", "必須逐一人工檢查所有交易紀錄,AI完全不參與篩選"], "ans": 1, "exp": "筆記:「異常偵測是方法,AML AI是把方法放進金融合規流程」,「不是抓每筆怪交易,而是先把最值得查的名單排出來」。"}, {"id": 193, "cat": "應用與工具", "type": "概念", "q": "關於「異常偵測」與「AML AI」的關係,下列敘述何者正確?", "opts": ["AML AI是方法,異常偵測是把方法放進金融合規流程", "異常偵測是方法,AML AI是把方法放進金融合規流程", "異常偵測只能用於資安領域,不能用於金融領域", "兩者是完全獨立、互不相關的技術"], "ans": 1, "exp": "筆記明確指出:「異常偵測是方法,AML AI是把方法放進金融合規流程」。"}, {"id": 194, "cat": "應用與工具", "type": "情境", "q": "某公司想把大量紙本發票掃描成圖片後,自動辨識出圖片中的文字內容,轉換成可以複製、搜尋的電子文字檔案,但不需要理解發票的版面結構或哪裡是金額欄位。這個需求最適合採用下列哪個技術?", "opts": ["OCR(光學字元辨識)", "RAG(檢索增強生成)", "MCP(模型上下文協議)", "Document Intelligence(文件辨識)"], "ans": 0, "exp": "單純把圖片中的字轉換成可複製搜尋的文字,不需理解版面結構,正是OCR的核心功能。"}, {"id": 195, "cat": "應用與工具", "type": "情境", "q": "某會計師事務所想開發一套系統,不只要辨識報帳單據上的文字,還要自動判斷哪一欄是「日期」、哪一欄是「金額」、哪一欄是「發票號碼」,並自動把重點資訊整理成結構化資料,類似AI助理幫忙抓重點。這個需求最適合採用下列哪個技術?", "opts": ["K折交叉驗證", "Document Intelligence(文件辨識)", "Flash Attention", "OCR(僅辨識文字,不理解版面)"], "ans": 1, "exp": "不只看懂文字,還能理解整份文件的結構(標題、表格、金額)並抽取重點資訊,正是Document Intelligence比OCR更進階的能力。"}, {"id": 196, "cat": "應用與工具", "type": "情境", "q": "某獨立開發者偏好使用一套獨立的AI編輯器,它能理解整個專案的程式碼架構,並用類似Agent的方式一次修改多個檔案,而不只是單一行的補全建議。他最可能選擇使用下列哪個工具?", "opts": ["Cursor", "GitHub Copilot(僅作為編輯器外掛)", "REST API", "TensorFlow"], "ans": 0, "exp": "Cursor是獨立AI編輯器,強項是全專案理解、Agent式多檔編輯,而GitHub Copilot是編輯器外掛,強項是行內補全與生態整合。"}, {"id": 197, "cat": "應用與工具", "type": "情境", "q": "某研究生正在撰寫深度學習相關的畢業論文,需要參考大量最新的學術論文程式碼與GitHub開源專案,並且希望開發過程能像寫純Python一樣直覺、方便隨時修改實驗架構。他最適合選擇下列哪個深度學習框架?", "opts": ["REST API", "TensorFlow(工業級生產部署導向)", "MCP", "PyTorch"], "ans": 3, "exp": "筆記建議學生、研究生、研究人員選擇PyTorch,因為學術論文與開源專案幾乎都是PyTorch的天下,且開發體驗更直覺(Pythonic)。"}, {"id": 198, "cat": "應用與工具", "type": "情境", "q": "某傳統製造業大型企業,內部系統本來就大量圍繞Google Cloud建置,且計畫把AI模型部署到工廠裡的嵌入式晶片上做即時瑕疵檢測。這家企業最適合選擇下列哪個深度學習框架?", "opts": ["REST API", "MCP", "PyTorch(學術研究導向)", "TensorFlow"], "ans": 3, "exp": "筆記建議身處傳統大型企業、已圍繞GCP建置,且專案看重邊緣設備部署(TensorFlow Lite支援紮實)的情境應選擇TensorFlow。"}, {"id": 199, "cat": "應用與工具", "type": "情境", "q": "某銀行的反洗錢系統發現,同一個帳戶在一天內被拆分成數十筆低於申報門檻的小額匯款,模型把這些看似無關的交易連結起來分析,判斷這可能是刻意規避監控的洗錢手法,並將此帳戶列入優先人工審查名單。這個案例最符合下列哪個技術的應用?", "opts": ["Document Intelligence", "Flash Attention", "K折交叉驗證", "反洗錢人工智慧(AML AI)"], "ans": 3, "exp": "筆記實際案例正是「銀行的分拆轉帳:同一個帳戶一天內被拆成很多小額匯款,模型把這些連起來看,發現像是在躲避監控門檻」,屬於AML AI的應用。"}, {"id": 200, "cat": "應用與工具", "type": "情境", "q": "某天氣查詢App透過網路呼叫氣象局提供的服務取得資料,每次請求都必須附上完整的查詢參數(如城市名稱、日期),伺服器不會記得這個App之前問過什麼,且回應可以被快取重複使用以加快查詢速度。這個服務的設計方式最符合下列哪個概念?", "opts": ["Document Intelligence", "AML AI", "REST API", "MCP(模型上下文協議)"], "ans": 2, "exp": "每次請求需附完整資訊(無狀態)、回應可被快取,加上客戶端-伺服器分離的架構,正是REST API四大關鍵限制的典型體現。"}];
const STORAGE_KEY = "nlp_llm_quiz_history_v1";
const QUIZ_LEN = 20;

let session = null; // {questions, index, score, answers:[{q, chosen, correct}]}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function catSummary() {
  const counts = {};
  ALL_QUESTIONS.forEach(q => {
    counts[q.cat] = (counts[q.cat] || 0) + 1;
  });
  const el = document.getElementById('cat-summary');
  el.innerHTML = Object.entries(counts).map(([cat, n]) =>
    `<div><span>${cat}</span><span>${n} 題</span></div>`
  ).join('');
}
catSummary();

function hideAllScreens() {
  ['screen-start','screen-quiz','screen-result','screen-review','screen-history'].forEach(id => {
    document.getElementById(id).classList.add('hidden');
  });
}

function showStart() {
  hideAllScreens();
  document.getElementById('screen-start').classList.remove('hidden');
}

function startQuiz() {
  const picked = shuffle(ALL_QUESTIONS).slice(0, QUIZ_LEN);
  session = { questions: picked, index: 0, score: 0, answers: [] };
  hideAllScreens();
  document.getElementById('screen-quiz').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion() {
  const q = session.questions[session.index];
  document.getElementById('progress-text').textContent = `第 ${session.index + 1} / ${session.questions.length} 題`;
  document.getElementById('score-text').textContent = `目前得分:${session.score}`;
  document.getElementById('progress-fill').style.width = ((session.index) / session.questions.length * 100) + '%';
  document.getElementById('q-cat').textContent = q.cat;
  const typeTag = document.getElementById('q-type-tag');
  if (q.type === '情境') {
    typeTag.classList.remove('hidden');
    typeTag.textContent = '情境範例題';
  } else {
    typeTag.classList.add('hidden');
  }
  document.getElementById('q-text').textContent = q.q;
  const optsEl = document.getElementById('options');
  optsEl.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.opts.forEach((optText, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = `${letters[i]}. ${optText}`;
    btn.onclick = () => selectAnswer(i);
    optsEl.appendChild(btn);
  });
  document.getElementById('explain').classList.remove('show');
  document.getElementById('explain').textContent = '';
  document.getElementById('next-btn').disabled = true;
}

function selectAnswer(i) {
  const q = session.questions[session.index];
  const options = document.querySelectorAll('#options .option');
  options.forEach(o => o.disabled = true);
  const correct = i === q.ans;
  options[i].classList.add(correct ? 'correct' : 'wrong');
  if (!correct) {
    options[q.ans].classList.add('correct');
  }
  if (correct) session.score++;
  session.answers.push({
    q: q.q, cat: q.cat, type: q.type,
    chosen: q.opts[i], correctText: q.opts[q.ans], correct: correct, exp: q.exp
  });
  const explainEl = document.getElementById('explain');
  explainEl.textContent = (correct ? '✅ 答對了!' : '❌ 答錯了。') + ' 解析:' + q.exp;
  explainEl.classList.add('show');
  document.getElementById('next-btn').disabled = false;
  document.getElementById('score-text').textContent = `目前得分:${session.score}`;
}

function nextQuestion() {
  session.index++;
  if (session.index >= session.questions.length) {
    finishQuiz();
  } else {
    renderQuestion();
  }
}

function finishQuiz() {
  document.getElementById('progress-fill').style.width = '100%';
  const total = session.questions.length;
  const score = session.score;
  const pct = Math.round(score / total * 100);
  saveHistory(score, total, pct);

  hideAllScreens();
  document.getElementById('screen-result').classList.remove('hidden');
  document.getElementById('final-score').textContent = `${score} / ${total}`;
  let comment = '';
  if (pct >= 90) comment = '太厲害了,幾乎全對!';
  else if (pct >= 70) comment = '表現不錯,再加把勁!';
  else if (pct >= 50) comment = '及格邊緣,建議再複習一下筆記。';
  else comment = '還需要多加練習,別灰心!';
  document.getElementById('final-sub').textContent = `正確率 ${pct}% ・ ${comment}`;

  // build review screen content but keep hidden until requested via result screen button
  buildReview();
}

function buildReview() {
  const wrong = session.answers.filter(a => !a.correct);
  const listEl = document.getElementById('review-list');
  if (wrong.length === 0) {
    listEl.innerHTML = '<div class="history-empty">本次全部答對,沒有錯題!</div>';
  } else {
    listEl.innerHTML = wrong.map(a => `
      <div class="review-item">
        <div class="review-q">[${a.cat}] ${a.q}</div>
        <div class="review-ans no">您的答案:${a.chosen}</div>
        <div class="review-ans ok">正確答案:${a.correctText}</div>
        <div class="review-ans">解析:${a.exp}</div>
      </div>
    `).join('');
  }
  // add a link on the result screen to view review
  const sub = document.getElementById('final-sub');
  if (!document.getElementById('review-link')) {
    const link = document.createElement('div');
    link.id = 'review-link';
    link.style.textAlign = 'center';
    link.style.marginTop = '10px';
    link.innerHTML = '<span style="color:#4472C4;text-decoration:underline;cursor:pointer;" onclick="showReview()">查看本次錯題檢討</span>';
    sub.after(link);
  }
}

function showReview() {
  hideAllScreens();
  document.getElementById('screen-review').classList.remove('hidden');
}

function saveHistory(score, total, pct) {
  const history = loadHistoryRaw();
  history.unshift({
    date: new Date().toLocaleString('zh-TW'),
    score, total, pct
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(0, 200)));
}

function loadHistoryRaw() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function showHistory() {
  hideAllScreens();
  document.getElementById('screen-history').classList.remove('hidden');
  const history = loadHistoryRaw();
  const el = document.getElementById('history-content');
  if (history.length === 0) {
    el.innerHTML = '<div class="history-empty">尚無測驗紀錄,快去開始第一次測驗吧!</div>';
    return;
  }
  const avgPct = Math.round(history.reduce((s,h) => s + h.pct, 0) / history.length);
  const bestPct = Math.max(...history.map(h => h.pct));
  let html = `<div class="cat-grid" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:16px;">
    <div><span>總測驗次數</span><span>${history.length}</span></div>
    <div><span>平均正確率</span><span>${avgPct}%</span></div>
    <div><span>最佳正確率</span><span>${bestPct}%</span></div>
  </div>`;
  html += '<table><thead><tr><th>時間</th><th>得分</th><th>正確率</th></tr></thead><tbody>';
  history.forEach(h => {
    html += `<tr><td>${h.date}</td><td>${h.score} / ${h.total}</td><td>${h.pct}%</td></tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

function clearHistory() {
  if (confirm('確定要清除所有歷史測驗紀錄嗎?此動作無法復原。')) {
    localStorage.removeItem(STORAGE_KEY);
    showHistory();
  }
}

showStart();
</script>
