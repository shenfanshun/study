<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>單字彙整檔 · Vocabulary Set 01</title>
<style>
  :root{
    --ink:#1c2432;
    --paper:#faf7f0;
    --card:#ffffff;
    --line:#e4ddcf;
    --accent:#2f6f5e;
    --accent-soft:#e7f0ec;
    --gold:#b4842a;
    --muted:#6b7280;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Georgia","Noto Serif TC",serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px;margin:0 auto;padding:32px 20px 80px;}

  header{
    border-bottom:2px solid var(--ink);
    padding-bottom:20px;margin-bottom:8px;
  }
  .eyebrow{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:12px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin-bottom:10px;
  }
  h1{
    font-size:clamp(28px,6vw,40px);
    font-weight:700;letter-spacing:-.5px;line-height:1.15;
  }
  .sub{
    margin-top:8px;color:var(--muted);
    font-family:"Helvetica Neue",Arial,sans-serif;font-size:14px;
  }

  .toolbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    margin:22px 0 30px;
    font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;
  }
  .btn{
    border:1px solid var(--line);background:var(--card);
    padding:8px 14px;border-radius:999px;cursor:pointer;
    color:var(--ink);font-size:13px;transition:.15s;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .rate{display:flex;align-items:center;gap:8px;color:var(--muted);}
  .rate input{accent-color:var(--accent);}

  .word{
    background:var(--card);border:1px solid var(--line);
    border-radius:14px;margin-bottom:20px;overflow:hidden;
  }
  .word-head{
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    padding:16px 20px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#fff, #fcfaf4);
  }
  .num{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:12px;font-weight:700;color:var(--gold);
    letter-spacing:.1em;
  }
  .term{font-size:24px;font-weight:700;letter-spacing:-.3px;}
  .say-word{
    margin-left:auto;border:none;background:var(--accent-soft);
    color:var(--accent);width:38px;height:38px;border-radius:50%;
    cursor:pointer;font-size:16px;display:grid;place-items:center;
    transition:.15s;
  }
  .say-word:hover{background:var(--accent);color:#fff;}

  ol.sentences{list-style:none;}
  .s{
    padding:14px 20px;border-bottom:1px dashed var(--line);
    display:flex;gap:12px;align-items:flex-start;
  }
  .s:last-child{border-bottom:none;}
  .s-idx{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:12px;color:var(--muted);min-width:20px;padding-top:4px;
  }
  .s-body{flex:1;}
  .en{
    cursor:pointer;font-size:17px;
    display:flex;gap:8px;align-items:flex-start;
  }
  .en .txt{flex:1;}
  .en .chev{color:var(--accent);font-size:13px;transition:.2s;padding-top:4px;}
  .en.open .chev{transform:rotate(90deg);}
  .zh{
    display:none;margin-top:8px;padding:10px 12px;
    background:var(--accent-soft);border-radius:8px;
    font-family:"Noto Sans TC","PingFang TC",sans-serif;
    font-size:15px;color:#26463c;
  }
  .zh.show{display:block;}
  .say-s{
    border:none;background:transparent;cursor:pointer;
    color:var(--muted);font-size:15px;padding:2px 4px;transition:.15s;
  }
  .say-s:hover{color:var(--accent);}

  footer{
    margin-top:40px;text-align:center;color:var(--muted);
    font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;
  }
  .hint{
    background:#fff8e8;border:1px solid #f0e2bd;border-radius:10px;
    padding:12px 16px;font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:13px;color:#7a6320;margin-bottom:26px;
  }
</style>
</head>

</div>

/* ---- speech ---- */
let voice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>/en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
}
pickVoice();
if(speechSynthesis.onvoiceschanged!==undefined){speechSynthesis.onvoiceschanged=pickVoice;}
function say(text){
  if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音功能');return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';
  if(voice)u.voice=voice;
  u.rate=parseFloat(document.getElementById('rate').value);
  speechSynthesis.speak(u);
}

/* ---- build ---- */
const list=document.getElementById('list');
DATA.forEach((item,i)=>{
  const card=document.createElement('div');
  card.className='word';
  const num=String(i+1).padStart(2,'0');
  let html=`<div class="word-head">
      <span class="num">${num}</span>
      <span class="term">${item.w}</span>
      <button class="say-word" title="聽單字發音" data-say="${item.w.replace(/"/g,'&quot;')}">🔊</button>
    </div><ol class="sentences">`;
  item.s.forEach((pair,j)=>{
    const en=pair[0], zh=pair[1];
    html+=`<li class="s">
      <span class="s-idx">${j+1}</span>
      <div class="s-body">
        <div class="en"><span class="chev">▶</span><span class="txt">${en}</span>
          <button class="say-s" title="聽句子發音" data-say="${en.replace(/"/g,'&quot;')}">🔊</button></div>
        <div class="zh">${zh}</div>
      </div>
    </li>`;
  });
  html+=`</ol>`;
  card.innerHTML=html;
  list.appendChild(card);
});

/* ---- events ---- */
list.addEventListener('click',e=>{
  const sayBtn=e.target.closest('[data-say]');
  if(sayBtn){e.stopPropagation();say(sayBtn.getAttribute('data-say'));return;}
  const en=e.target.closest('.en');
  if(en){
    en.classList.toggle('open');
    en.parentElement.querySelector('.zh').classList.toggle('show');
  }
});
document.getElementById('expandAll').onclick=()=>{
  document.querySelectorAll('.en').forEach(el=>el.classList.add('open'));
  document.querySelectorAll('.zh').forEach(el=>el.classList.add('show'));
};
document.getElementById('collapseAll').onclick=()=>{
  document.querySelectorAll('.en').forEach(el=>el.classList.remove('open'));
  document.querySelectorAll('.zh').forEach(el=>el.classList.remove('show'));
};
</script>
