<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>多益單字測驗</title>
<style>
  :root{
    --ink:#1a2b3c; --ink-soft:#5a6b7c; --paper:#f5f1e8; --card:#fffdf8;
    --gold:#c8a45c; --gold-deep:#a67c2e; --teal:#2b7a78; --teal-deep:#1f5c5a;
    --coral:#d96c5f; --green:#3a9d6e; --red:#d15b4d; --line:#e4ddce; --shadow:rgba(40,50,60,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Georgia","Songti TC","Noto Serif TC",serif;
    background:
      radial-gradient(circle at 20% 10%, #efe8d6 0%, transparent 55%),
      radial-gradient(circle at 85% 90%, #e8ece6 0%, transparent 55%),
      var(--paper);
    color:var(--ink);display:flex;flex-direction:column;
    height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  header{
    padding:12px 20px 8px;text-align:center;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,253,248,.7), transparent);flex:0 0 auto;
  }
  .brand{font-size:11px;letter-spacing:4px;color:var(--gold-deep);text-transform:uppercase;font-family:"Helvetica Neue",sans-serif;font-weight:600;}
  .title{font-size:20px;margin-top:2px;font-weight:700;letter-spacing:1px;}
  .title small{font-size:12px;color:var(--ink-soft);font-weight:400;letter-spacing:0;}

  .screen{flex:1;overflow-y:auto;display:none;flex-direction:column;}
  .screen.active{display:flex;}

  /* ---------- category picker ---------- */
  #pick{padding:16px 18px 30px;}
  .pick-hint{font-size:13px;color:var(--ink-soft);text-align:center;margin-bottom:14px;font-family:"Helvetica Neue",sans-serif;}
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .cat-card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;
    cursor:pointer;transition:all .15s;text-align:left;
  }
  .cat-card:active{transform:scale(.97);}
  .cat-card .cn{font-size:15px;font-weight:700;color:var(--ink);}
  .cat-card .meta{font-size:11px;color:var(--ink-soft);margin-top:3px;font-family:"Helvetica Neue",sans-serif;}
  .cat-card.all{grid-column:1/3;background:linear-gradient(135deg,var(--teal),var(--teal-deep));border:none;}
  .cat-card.all .cn,.cat-card.all .meta{color:#fff;}

  /* ---------- quiz ---------- */
  #quiz{padding:14px 20px 20px;}
  .q-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-soft);font-family:"Helvetica Neue",sans-serif;margin-bottom:8px;}
  .back-link{background:none;border:none;color:var(--teal);cursor:pointer;font-size:13px;text-decoration:underline;font-family:"Helvetica Neue",sans-serif;}
  .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px;}
  .bar > i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold-deep));transition:width .3s ease;}

  .q-type{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-deep);font-family:"Helvetica Neue",sans-serif;font-weight:600;margin-bottom:10px;}
  .q-prompt{font-size:20px;line-height:1.5;font-weight:700;margin-bottom:6px;}
  .q-prompt i{font-weight:400;font-style:italic;color:var(--teal-deep);display:inline-block;margin-top:6px;}
  .q-hint{font-size:13px;color:var(--ink-soft);margin-bottom:18px;font-family:"Helvetica Neue",sans-serif;}

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:15px 16px;
    font-size:17px;cursor:pointer;transition:all .15s;text-align:left;color:var(--ink);
  }
  .opt:active{transform:scale(.98);}
  .opt.correct{background:#e7f4ec;border-color:var(--green);color:#1f6e4a;font-weight:700;}
  .opt.wrong{background:#fbe9e7;border-color:var(--red);color:#a33;}
  .opt.disabled{pointer-events:none;opacity:.55;}
  .opt.disabled.correct,.opt.disabled.wrong{opacity:1;}

  .fill-input{
    width:100%;padding:15px 16px;font-size:20px;border:1.5px solid var(--line);border-radius:12px;
    background:var(--card);font-family:"Georgia",serif;color:var(--ink);text-align:center;letter-spacing:1px;
  }
  .fill-input:focus{outline:none;border-color:var(--teal);}
  .fill-input.correct{border-color:var(--green);background:#e7f4ec;color:#1f6e4a;}
  .fill-input.wrong{border-color:var(--red);background:#fbe9e7;color:#a33;}

  .feedback{margin-top:16px;font-size:15px;line-height:1.5;min-height:24px;font-family:"Helvetica Neue",sans-serif;}
  .feedback .ok{color:var(--green);font-weight:700;}
  .feedback .no{color:var(--red);font-weight:700;}
  .feedback .ans{color:var(--ink);}
  .feedback .tr{display:block;color:var(--ink-soft);font-size:13px;margin-top:6px;font-style:italic;}

  .action-btn{
    width:100%;margin-top:18px;padding:15px;border-radius:14px;border:none;
    background:var(--ink);color:#fff;font-size:16px;font-weight:600;cursor:pointer;
    font-family:"Helvetica Neue",sans-serif;transition:transform .15s;
  }
  .action-btn:active{transform:scale(.97);}
  .action-btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);}
  .skip-btn{width:100%;margin-top:8px;background:none;border:none;color:var(--ink-soft);font-size:13px;cursor:pointer;text-decoration:underline;font-family:"Helvetica Neue",sans-serif;}

  /* ---------- result ---------- */
  #result{padding:30px 24px;text-align:center;align-items:center;justify-content:center;}
  .score-ring{font-size:52px;font-weight:700;color:var(--teal-deep);margin:10px 0;}
  .score-sub{font-size:15px;color:var(--ink-soft);font-family:"Helvetica Neue",sans-serif;margin-bottom:8px;}
  .score-msg{font-size:16px;line-height:1.6;margin:14px 0 24px;max-width:340px;}
  .wrong-list{width:100%;max-width:400px;text-align:left;margin-top:10px;}
  .wrong-list h3{font-size:13px;letter-spacing:1px;color:var(--gold-deep);font-family:"Helvetica Neue",sans-serif;text-transform:uppercase;margin-bottom:10px;}
  .wrong-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;}
  .wrong-item b{color:var(--ink);}
  .wrong-item span{color:var(--ink-soft);}
</style>
</head>
<body>
  <header>
    <div class="brand">TOEIC · Business English</div>
    <div class="title">單字測驗 <small id="hdr-sub">選擇分類開始</small></div>
  </header>

  <!-- SCREEN 1: category picker -->
  <div class="screen active" id="pick">
    <div class="pick-hint">每個單字 5 題（1 填空 + 4 選擇）。選一個分類開始複習。</div>
    <div class="cat-grid" id="cat-grid"></div>
  </div>

  <!-- SCREEN 2: quiz -->
  <div class="screen" id="quiz">
    <div class="q-top">
      <button class="back-link" id="quit">← 返回分類</button>
      <span id="q-count">1 / 20</span>
      <span id="q-score">✓ 0</span>
    </div>
    <div class="bar"><i id="q-bar"></i></div>
    <div class="q-type" id="q-type"></div>
    <div class="q-prompt" id="q-prompt"></div>
    <div class="q-hint" id="q-hint"></div>
    <div id="q-body"></div>
    <div class="feedback" id="q-feedback"></div>
    <button class="action-btn" id="q-next" style="display:none;">下一題 →</button>
    <button class="skip-btn" id="q-skip">跳過這題</button>
  </div>

  <!-- SCREEN 3: result -->
  <div class="screen" id="result">
    <div class="brand" style="letter-spacing:3px;">測驗結果</div>
    <div class="score-ring" id="r-score">0%</div>
    <div class="score-sub" id="r-sub">答對 0 / 0 題</div>
    <div class="score-msg" id="r-msg"></div>
    <div class="wrong-list" id="r-wrong"></div>
    <button class="action-btn" id="r-retry" style="max-width:340px;">重做這個分類</button>
    <button class="action-btn ghost" id="r-back" style="max-width:340px;">選其他分類</button>
  </div>

  allCard.className="cat-card all";
  allCard.innerHTML = `<div class="cn">🎲 綜合隨機測驗</div><div class="meta">從全部 ${allCount} 題隨機抽 20 題</div>`;
  allCard.onclick=()=>startQuiz("__all__");
  grid.appendChild(allCard);
  cats.forEach(c=>{
    const n = QUIZ[c].length;
    const words = n/5;
    const b=document.createElement("button");
    b.className="cat-card";
    b.innerHTML=`<div class="cn">${c}</div><div class="meta">${words} 字 · ${n} 題</div>`;
    b.onclick=()=>startQuiz(c);
    grid.appendChild(b);
  });

  // ---- quiz state ----
  let queue=[], qi=0, score=0, wrong=[], curCat="";
  const MAX_ALL = 20;

  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

  // group a flat question list into per-word blocks of 5, preserving order within a word
  function groupByWord(list){
    const map=new Map();
    list.forEach(q=>{ if(!map.has(q.word)) map.set(q.word,[]); map.get(q.word).push(q); });
    return Array.from(map.values());
  }

  function startQuiz(cat){
    curCat = cat;
    if(cat==="__all__"){
      // random 20 questions across everything (fully mixed)
      let pool=[]; cats.forEach(c=>pool=pool.concat(QUIZ[c]));
      queue = shuffle(pool.slice()).slice(0, MAX_ALL);
      $("hdr-sub").textContent="綜合隨機";
    } else {
      // shuffle the WORDS, but keep each word's 5 questions together and in order
      const blocks = groupByWord(QUIZ[cat]);
      shuffle(blocks);
      queue = [].concat(...blocks);
      $("hdr-sub").textContent = cat;
    }
    qi=0; score=0; wrong=[];
    show("quiz");
    renderQ();
  }

  function renderQ(){
    const q = queue[qi];
    $("q-count").textContent = (qi+1)+" / "+queue.length;
    $("q-score").textContent = "✓ "+score;
    $("q-bar").style.width = (qi/queue.length*100)+"%";
    $("q-feedback").innerHTML="";
    $("q-next").style.display="none";
    $("q-skip").style.display="";
    const body = $("q-body");
    body.innerHTML="";

    if(q.type==="fill"){
      $("q-type").textContent="填空 Fill in the blank";
      $("q-prompt").innerHTML = q.prompt;
      $("q-hint").textContent = q.hint ? ("提示："+q.hint) : "";
      const inp=document.createElement("input");
      inp.className="fill-input"; inp.type="text"; inp.autocapitalize="off";
      inp.autocomplete="off"; inp.spellcheck=false; inp.placeholder="輸入英文…";
      body.appendChild(inp);
      const submit=document.createElement("button");
      submit.className="action-btn"; submit.textContent="送出答案";
      submit.onclick=()=>checkFill(inp,q,submit);
      body.appendChild(submit);
      inp.addEventListener("keydown",e=>{if(e.key==="Enter")checkFill(inp,q,submit);});
      setTimeout(()=>inp.focus(),100);
    } else {
      $("q-type").textContent="選擇 Multiple choice";
      $("q-prompt").innerHTML = q.prompt;
      $("q-hint").textContent="";
      const wrap=document.createElement("div");
      wrap.className="options";
      q.options.forEach(opt=>{
        const b=document.createElement("button");
        b.className="opt"; b.textContent=opt;
        b.onclick=()=>checkMC(b,opt,q,wrap);
        wrap.appendChild(b);
      });
      body.appendChild(wrap);
    }
  }

  function norm(s){return (s||"").trim().toLowerCase().replace(/[.,!?;:]/g,"");}

  function checkFill(inp,q,submit){
    if(inp.disabled) return;
    const ok = norm(inp.value)===norm(q.answer);
    inp.disabled=true; submit.style.display="none";
    inp.classList.add(ok?"correct":"wrong");
    if(ok){ score++; speak(q.answer);
      $("q-feedback").innerHTML=`<span class="ok">✓ 答對了！</span> <span class="ans">${q.answer}</span>` + (q.translation?`<span class="tr">${q.translation}</span>`:"");
    } else {
      wrong.push(q);
      $("q-feedback").innerHTML=`<span class="no">✗ 正確答案：</span> <span class="ans">${q.answer}</span>` + (q.translation?`<span class="tr">${q.translation}</span>`:"");
    }
    finishQ();
  }

  function checkMC(btn,opt,q,wrap){
    const ok = opt===q.answer;
    wrap.querySelectorAll(".opt").forEach(b=>{
      b.classList.add("disabled");
      if(b.textContent===q.answer) b.classList.add("correct");
    });
    if(!ok) btn.classList.add("wrong");
    if(ok){ score++;
      // speak the english answer if it's a word choice
      if(/^[A-Za-z .'-]+$/.test(q.answer)) speak(q.answer);
      $("q-feedback").innerHTML=`<span class="ok">✓ 答對了！</span>` + (q.translation?`<span class="tr">${q.translation}</span>`:"");
    } else {
      wrong.push(q);
      $("q-feedback").innerHTML=`<span class="no">✗ 正確答案：</span> <span class="ans">${q.answer}</span>` + (q.translation?`<span class="tr">${q.translation}</span>`:"");
    }
    finishQ();
  }

  function finishQ(){
    $("q-skip").style.display="none";
    $("q-next").style.display="";
    $("q-next").textContent = (qi+1>=queue.length) ? "看結果 →" : "下一題 →";
    $("q-score").textContent="✓ "+score;
  }

  $("q-next").onclick=()=>{
    qi++;
    if(qi>=queue.length) showResult();
    else renderQ();
  };
  $("q-skip").onclick=()=>{
    wrong.push(queue[qi]);
    qi++;
    if(qi>=queue.length) showResult();
    else renderQ();
  };
  $("quit").onclick=()=>show("pick");

  function showResult(){
    show("result");
    const total=queue.length;
    const pct = Math.round(score/total*100);
    $("r-score").textContent = pct+"%";
    $("r-sub").textContent = `答對 ${score} / ${total} 題`;
    let msg;
    if(pct>=90) msg="太厲害了！這個分類你掌握得很紮實，可以往下一個主題前進。";
    else if(pct>=70) msg="不錯的成績！把下面答錯的字再看一遍就更穩了。";
    else if(pct>=50) msg="有基礎了，建議回單字卡複習這個分類，再回來測一次。";
    else msg="這個分類還需要多熟悉，先回單字卡把字看熟，別氣餒，這就是進步的地方。";
    $("r-msg").textContent=msg;
    // wrong list
    const wl=$("r-wrong");
    if(wrong.length){
      let html="<h3>需要複習的字</h3>";
      const seen=new Set();
      wrong.forEach(q=>{
        if(seen.has(q.word))return; seen.add(q.word);
        html+=`<div class="wrong-item"><b>${q.word}</b></div>`;
      });
      wl.innerHTML=html;
    } else {
      wl.innerHTML="<h3 style='text-align:center;color:var(--green);'>全部答對，太棒了！</h3>";
    }
  }

  $("r-retry").onclick=()=>startQuiz(curCat);
  $("r-back").onclick=()=>show("pick");
})();
</script>
</body>
</html>
